urney-2026-02-20\",\"section\":\"build\",\"url\":\"/articles/telegram-notes-journey-2026-02-20\",\"title\":\"从一个念头到自动化链路：Telegram 碎碎念入站记\",\"subtitle\":\"一天之内打通 Telegram → GitHub → 博客的随手记功能\",\"description\":\"记录把 Telegram 随手笔记自动汇总到博客 Notes 页面的全过程，包括方案选型、逐步落地和一路踩过的坑。\",\"date\":\"2026-02-20\"},{\"type\":\"post\",\"id\":\"ai-quota-anxiety\",\"section\":\"articles\",\"url\":\"/articles/ai-quota-anxiety\",\"title\":\"当AI配额用不完：一种新型焦虑\",\"subtitle\":\"订阅了太多AI工具却用不完配额，焦虑的不是钱，而是发现自己成了瓶颈\",\"description\":\"订阅了太多AI工具却用不完配额，焦虑的不是钱，而是发现自己成了瓶颈。这篇文章记录了我与AI的一次对话，以及从中得到的一些想法。\",\"date\":\"2026-02-10\"},{\"type\":\"post\",\"id\":\"telegram-integration-v3\",\"section\":\"build\",\"url\":\"/articles/telegram-integration-v3\",\"title\":\"AlpacaNotes博客 集成 Telegram 自动推送实战\",\"subtitle\":\"\",\"description\":\"本文记录了如何通过 GitHub Actions 和 Telegram Bot API，实现博客新文章自动推送到 Telegram 频道的完整流程。\",\"date\":\"2026-01-24\"},{\"type\":\"post\",\"id\":\"nie-weiping-from-my-view\",\"section\":\"articles\",\"url\":\"/articles/nie-weiping-from-my-view\",\"title\":\"关于聂卫平\",\"subtitle\":\"一个外行记忆碎片中的棋圣\",\"description\":\"聂卫平先生离世，我从一个完全不重要的个人视角，回顾一下这位围棋传奇在我心中的印记，借此表示缅怀。\",\"date\":\"2026-01-19\"},{\"type\":\"post\",\"id\":\"ai-tools-refactor-experience\",\"section\":\"build\",\"url\":\"/articles/ai-tools-refactor-experience\",\"title\":\"网站重构过程中AI工具的体验\",\"subtitle\":\"Windsurf + Gemini 3 Pro实战经验分享\",\"description\":\"分享在网站开发与重构过程中使用AI工具的实战经验，对比Gemini与GPT的差异，探讨大上下文窗口在复杂项目中的应用价值。\",\"date\":\"2026-01-17\"},{\"type\":\"post\",\"id\":\"website-refactor-2026\",\"section\":\"build\",\"url\":\"/articles/website-refactor-2026\",\"title\":\"博客网站开发与重构回顾\",\"subtitle\":\"三天集中重构的实践经验与未来策略\",\"description\":\"回顾过去三天的网站重构工作，总结从雏形搭建到功能完善的完整过程，分享AI辅助开发的体验和未来渐进式迭代策略。\",\"date\":\"2026-01-17\"},{\"type\":\"post\",\"id\":\"AI-and-healthcare-2026-zhang\",\"section\":\"articles\",\"url\":\"/articles/AI-and-healthcare-2026-zhang\",\"title\":\"AI与医疗：效率与理解力的博弈\",\"subtitle\":\"解析张文宏的“去技能化”预警与全球医疗系统的应对策略\",\"description\":\"在1月10日
