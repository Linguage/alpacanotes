om/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_37772-37894\",\"quote\":\"同年10月，在威廉姆斯之前在出版行业的老板蒂姆·奥莱利（Tim O’Reilly）的促成之下，谷歌向它抛出了橄榄枝。谷歌在当时还是一家从搜索引擎业务为主的公司，而且没有收购其他公司的经历。这时谷歌提出了收购Blogger的交易，威廉姆斯接受了。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_4575-4673\",\"quote\":\"伯纳斯–李从小就反复琢磨的另外一个概念是，人类大脑是如何建立随意联系的——比如你和一位朋友一起喝过咖啡之后，下次你闻到咖啡气味的时候就会想起她当时身穿的裙子，但是机器却只能根据已有的程序建立联系。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_5073-5299\",\"quote\":\"各种尚未成熟的想法在脑海中四处漂浮。它们来自不同的地方，不过大脑总是有办法将它们塞到合适的位置。有时候这些想法也会找不到合适的地方，这时我们会外出骑车兜风或者做其他事情，之后问题就迎刃而解了。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_53831-53884\",\"quote\":\"事实证明桑格的想法是错误的。不学无术的群众并没有把专家赶走，他们反而成了专家，同时专家也成了群众的一分子。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_55958-56414\",\"quote\":\"为什么人们愿意为此付出呢？哈佛大学教授约凯·本克勒（Yochai Benkler）将维基百科、开源软件和其他无偿协作项目并称为“基于共享的集体协作”。他解释道：“它的核心特点是，由个人组成的团体会出于激励性动机和社会信号顺利完成大型项目的协作，他们的行为并非由市场价格或管理命令决定。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_56415-56552\",\"quote\":\"这些动机包括与他人互动时产生的心理回报，以及完成一项有价值的工作带来的个人满足。我们每个人都有自己的小乐趣，例如收集邮票，坚持使用准确的语法，了解杰夫·托尔堡（Jeff Torborg）在大学时期的平均击球率，或者熟知特拉法加系列战役的顺序。这些内容都可以在维基百科上找到。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_56581-56636\",\"quote\":\"人们在为维基百科贡献内容的时候，他们体内会有一种近乎原始欲望的因素在起作用。有些维基人把它称为“维基可卡因”。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_58165-58282\",\"quote\":\"维基百科的出现让我们离万尼瓦尔·布什的愿景又近了一步，他在1945年发表的《诚如所思》中预测道：“全新的百科全书形式即将出现，它们之间将会形成一个网络，贯穿在这个网络当中的是互相关联的踪迹，它们将可以被输入到Memex机中进行放大。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_6696-6810\",\"quote\":\"一直都对人与人之间的协作方式很感兴趣。我曾经在其他机构和大学与许多人共事过，他们的工作都需要协同进行。如果他们共处在同一个房间的话，他们肯定会把黑板的各个角落都写满。我当时正在寻找一个可以帮助人们进行头脑风暴和记录项目制度的系统\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_7883-7921\",\"quote\":\"文本是一个经过编码的单词或短语，它在被点击之后会跳转到另外一个文档或者内容。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_8264-8485\",\"quote\":\"这些网络不会有中央节点，也没有控制中枢。你只需知道某个文档的网络地址就可以连接到它。按照伯纳斯–李的说法，这个由链接组成的系统可以“骑在互联网的背上”传播和蔓延。￼这项创新也是由两项已有的创新结合而成的，而这一次是超文本和互联网之间的结合。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_8514-8529\",\"quote\":\"伯纳斯–李利用一台NeXT电脑\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_900-1032\",\"quote\":\"20世纪60年代，童年时期的蒂姆·伯纳斯–李（Tim Berners-Lee）居住在伦敦市郊，他在这个时候已经观察出了关于计算机的一个基本特点：虽然它们非常擅长通过程序进行分步处理，但是它们不善于进行随意的联想和建立巧妙的联系，这是它们与充满想象力的人类之间的区别\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_9019-9135\",\"quote\":\"了1990年年底，他已经建立了一套工具来实现他所构想的网络：用于在线交换超文本的超文本传输协议（HTTP），用于创建页面的超文本标记语言（HTML），一个用于检索和显示信息的基础浏览器应用软件，以及一个用于回应网络请求的服务器软件。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_541_2512-2591\",\"quote\":\"可别人在嘲笑他呀，一有机会就使他难堪，有时骂他骂得很凶，而他与他们却能和谐友好地相处，从来不会生他们的气。是呀，要真正认识一个人是很难的，即使在相识多年之后！\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(12)\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_542_1415-1508\",\"quote\":\"肖像画无限期地拖了下去，几乎拖了一年之久，少校终于看出来了，此人在哄骗他，于是认定画像是画不成了，相反，一天天过去，画得越来越不像他了，他勃然大怒，把画家痛打了一顿，罚他到监狱里去干粗活\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(13)\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_542_3013-3073\",\"quote\":\"钱嘛，我已经说过了，在监狱里是有惊人的意义和能量的。可以肯定地说，在监狱里一个一文不名的囚犯，比多少有点钱的要痛苦十倍，\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(13)\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_542_383-495\",\"quote\":\"但是他恬不知耻地接受了自己的新的遭遇，甚至毫无悔改之意，面对这种遭遇没有道德上的愤慨，除了被强制劳动、不得不告别那些糖果糕点店和三条市民街，竟无所畏惧。他甚至觉得，苦役犯的身份只是使他更能放开手脚，去干一些更加卑鄙龌龊的勾当\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(13)\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_542_4165-4266\",\"quote\":\"但这个似乎最不可能出事的犯人的这种突然爆发，——其全部原因也许就是个人的一种苦闷的、狂躁的发泄，一种想表现自己以及自己的被凌辱的个性的欲望，这欲望是蓦然出现的，达到了愤怒、癫狂、茫然、爆发和痉挛的程度。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(13)\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_542_4275-4364\",\"quote\":\"就像一个人被活活埋在棺材里，醒来后便拼命撞击自己的棺材盖，使尽力气要推开它，当然，理智会让他明白，他的一切努力都将归于徒劳。但问题恰恰在于，这时已谈不上理智了：这时只有痛苦的痉挛\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(13)\",\"date\":\"2020-07-01\"},{\"id\":\"31231802:mark:31231802_21_3964-4065\",\"quote\":\"两党制最大的问题是，一旦落实，最优秀的人才不会选择从政。参选得冒很大风险。竞选活动会变得非常不文明，甚至卑鄙恶毒。如果你才干超群、事业有成，何必为了参选而冒这么大的风险？不只赌上自己的利益，还会牵连家人\",\"book\":{\"id\":\"31231802\",\"title\":\"李光耀观天下（精装版）\",\"author\":\"李光耀\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/802/31231802/t6_31231802.jpg\",\"url\":\"https://weread.qq.com/web/reader/59d32f9071dc8f3a59d7271\",\"wordCount\":149975,\"spinePalette\":{\"paper\":\"rgb(11 12 14)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"六 新加坡：处在十字路口\",\"date\":\"2020-06-28\"},{\"id\":\"243399:mark:243399_38_195-308\",\"quote\":\"接下来，故事中的黄金时代结束了。企业脱掉了可贵的父爱主义外衣，成为高效的管理资本主义的典型：把股东利益置于员工利益之上，为推高股票价格不择手段。业绩不佳的经理人成为公司并购和私人股权收购的猎物，只有大幅裁员才能保住剩下的岗位。\",\"book\":{\"id\":\"243399\",\"title\":\"大繁荣\",\"author\":\"埃德蒙·费尔普斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/62/YueWen_243399/t6_YueWen_243399.jpg\",\"url\":\"https://weread.qq.com/web/reader/5bb32f7053b6c75bbe04a51\",\"wordCount\":\"$undefined\"},\"chapter\":\"经济为什么会衰落\",\"date\":\"2020-06-27\"},{\"id\":\"26619504:mark:26619504_6_1631-1701\",\"quote\":\"作为一名在阿拉伯世界生活了10多年、研究这个地区40多年的西方学者，我觉得我有责任分享我的知识和经验，以帮助弥合西方和伊斯兰世界之间的鸿沟。\",\"book\":{\"id\":\"26619504\",\"title\":\"征服与革命中的阿拉伯人：1516年至今\",\"author\":\"尤金·罗根\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/504/26619504/t6_26619504.jpg\",\"url\":\"https://weread.qq.com/web/reader/9e332ca071962e709e37470\",\"wordCount\":\"$undefined\"},\"chapter\":\"中译本序\",\"date\":\"2020-06-27\"},{\"id\":\"26619504:mark:26619504_6_2045-2103\",\"quote\":\"痛苦的经历鼓励阿拉伯人寻求新的合作伙伴，以平衡美国在阿拉伯地区的影响力。对许多阿拉伯国家政府来说，中国就是解决之道。\",\"book\":{\"id\":\"26619504\",\"title\":\"征服与革命中的阿拉伯人：1516年至今\",\"author\":\"尤金·罗根\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/504/26619504/t6_26619504.jpg\",\"url\":\"https://weread.qq.com/web/reader/9e332ca071962e709e37470\",\"wordCount\":\"$undefined\"},\"chapter\":\"中译本序\",\"date\":\"2020-06-27\"},{\"id\":\"26619504:mark:26619504_6_2136-2289\",\"quote\":\"20世纪，中国与中东的交往始终有别于其他世界大国。1949年，从自己的革命经历中走出来的人民共和国，积极推动反帝和民族解放运动。虽然是一个社会主义国家，但中国并不试图将中东拖入冷战的分裂政治。相反，通过万隆会议，中国寻求推动一种替代冷战的不结盟方式，事实证明，这种方式对中东各国的领导人和人民非常有吸引力。\",\"book\":{\"id\":\"26619504\",\"title\":\"征服与革命中的阿拉伯人：1516年至今\",\"author\":\"尤金·罗根\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/504/26619504/t6_26619504.jpg\",\"url\":\"https://weread.qq.com/web/reader/9e332ca071962e709e37470\",\"wordCount\":\"$undefined\"},\"chapter\":\"中译本序\",\"date\":\"2020-06-27\"},{\"id\":\"934366:mark:934366_540_922-1118\",\"quote\":\"在我开始新生活的这第一个凄凉的晚上，这一切只是在我眼前闪过，——闪过于腾腾烟雾和黑色烟子之间，闪过于亵渎神圣的辱骂声中，闪过于空气污浊、镣铐叮当、诅咒和无耻哄笑的氛围里。我在光光的木板通铺上躺下，把衣服枕在头下（我还没有枕头），盖一件光板皮袄，但久久不能入睡，尽管这第一天的荒诞而意外的印象已使我受尽折磨、精疲力竭。但我的新生活才刚刚开始。还有很多我从未想到也无从预料的事情在前面等待着我……\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(11)\",\"date\":\"2020-06-20\"},{\"id\":\"31231802:mark:31231802_8_7332-7387\",\"quote\":\"他们没有被组织起来。他们希望加入城市的中产阶层。他们认为未来不能靠起义，那只能更糟。他们寄希望于加入城市人口。\",\"book\":{\"id\":\"31231802\",\"title\":\"李光耀观天下（精装版）\",\"author\":\"李光耀\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/802/31231802/t6_31231802.jpg\",\"url\":\"https://weread.qq.com/web/reader/59d32f9071dc8f3a59d7271\",\"wordCount\":149975,\"spinePalette\":{\"paper\":\"rgb(11 12 14)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"一 中国：一个强大的中央\",\"date\":\"2020-06-19\"},{\"id\":\"31231802:mark:31231802_8_7734-7811\",\"quote\":\"在新加坡，由于迅速发展教育，我们正处于比预想要超前地达到这种境地的危险。人民正在迅速提升。的士司机或小贩的孩子进入了大学，他们互相通婚，然后进入上层社会。\",\"book\":{\"id\":\"31231802\",\"title\":\"李光耀观天下（精装版）\",\"author\":\"李光耀\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/802/31231802/t6_31231802.jpg\",\"url\":\"https://weread.qq.com/web/reader/59d32f9071dc8f3a59d7271\",\"wordCount\":149975,\"spinePalette\":{\"paper\":\"rgb(11 12 14)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"一 中国：一个强大的中央\",\"date\":\"2020-06-19\"},{\"id\":\"31231802:mark:31231802_8_7839-7938\",\"quote\":\"每个社会都会发生这种事，但最终会引发很多抱怨。底层的人会说：“好啊，让我们重新洗牌吧。”这就是共产党革命的缘起。国民党被推翻了。现在共产党的精英已经出现了。但是，我们尚未达到高度分化的社会那种状态。\",\"book\":{\"id\":\"31231802\",\"title\":\"李光耀观天下（精装版）\",\"author\":\"李光耀\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/802/31231802/t6_31231802.jpg\",\"url\":\"https://weread.qq.com/web/reader/59d32f9071dc8f3a59d7271\",\"wordCount\":149975,\"spinePalette\":{\"paper\":\"rgb(11 12 14)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"一 中国：一个强大的中央\",\"date\":\"2020-06-19\"},{\"id\":\"934366:mark:934366_539_4486-4619\",\"quote\":\"一个有教养的人依法受到与平民百姓同样的惩处，他所失去的却往往比后者多得不可比拟。他不得不抑制自己所有的内心需求、所有的习惯；陷入他所不能满意的环境，要学会呼吸一种不同的空气……这是从水中捞出来丢弃在沙地上的一条鱼……对所有人都相同的依法惩处，对他来说却往往痛苦十倍。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(10)\",\"date\":\"2020-06-19\"},{\"id\":\"31503072:mark:31503072_3_2667-2748\",\"quote\":\"我就回答你们：我是个八等文官。我供职是为了混口饭吃（但也仅仅为了这个目的），因此去年当我的一位远房亲戚立下遗嘱留给我六千卢布时，我就立刻辞职，蛰居在自己的小角落里\",\"book\":{\"id\":\"31503072\",\"title\":\"地下室手记（果麦经典）\",\"author\":\"[俄]陀思妥耶夫斯基\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/69/YueWen_31503072/t6_YueWen_31503072.jpg\",\"url\":\"https://weread.qq.com/web/reader/a623278071e0b2e0a622468\",\"wordCount\":\"$undefined\"},\"chapter\":\"一\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_532_1840-1902\",\"quote\":\"不少囚犯初来监狱时什么都不会，便向别人请教，等到出狱后，竟成了出色的工匠。这里有靴匠、鞋匠、裁缝、木匠、钳工、切削工、镀金工\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(3)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_532_3561-3598\",\"quote\":\"还有一项收入，虽然不能让囚犯发财，却是持久而有良好影响的收入。这就是施舍。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(3)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_1012-1127\",\"quote\":\"这样的惩罚变成了一种酷刑，一种复仇，而且是没有意义的，因为它不能达到任何合理的目的。而由于任何强制性劳动都必然会具有这种酷刑、徒劳无益、屈辱和羞惭的成分，因而苦役犯的劳动比任何自由的劳动都痛苦得无可比拟，其原因恰恰在于它的强制性。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_1417-1477\",\"quote\":\"后来我才懂得，除了自由被剥夺，除了强制劳动，在苦役生活中还有一种痛苦，比其余的一切都更为强烈的痛苦。这就是：强制的群居。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_1575-1606\",\"quote\":\"囚犯们硬说，在俄罗斯欧洲部分的军人囚犯连里也没有这样好的伙食。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_17-109\",\"quote\":\"入狱后的第一个月，总之是入狱初期，至今还会生动地出现在我的想象之中。此后的狱中岁月在我的回忆中便只是隐约地闪现。有些往事仿佛模糊了，混淆在一起，只留下了一个总的印象：沉重、单调、窒息。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_4891-4977\",\"quote\":\"我起初无法想象，怎么能为了逗乐而吵架，而且在吵架中寻找乐趣、从事心爱的练习并得到快乐呢？不过，虚荣心也不能忽略。雄辩的谩骂者是受人尊敬的。只不过对他不像对演员那样鼓掌而已。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_560-613\",\"quote\":\"说这种劳动是繁重的苦役，其主要原因不在于它艰苦而持续不断，而是因为它是强制性的，是在棍棒的驱使之下非干不可\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_896-1006\",\"quote\":\"可要是强迫他，举例来说，把一只桶里的水倒进另一只桶，再倒回原来的桶里，或捣沙土，或把一个地方的土堆拉到另一个地方，再拉回来，那么我想，犯人过不了几天就会上吊自杀，或者犯下千百种罪行，但求一死，以便摆脱这种屈辱、羞惭和痛苦\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_534_4443-4535\",\"quote\":\"使囚犯热心劳动的唯一办法就是给他规定工作量。有时规定的工作量很大，但是完成定量的速度仍然比被迫工作到敲午饭鼓时要快一倍。完成工作量之后，囚犯就可以毫无阻碍地回去，谁也不会来阻拦他了。 \",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(5)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_535_1321-1410\",\"quote\":\"在如此严格的管理制度之下，一名醉酒的囚犯的出现，把我心里初步形成的关于囚犯生活的所有见解都彻底打乱了。我在狱中度过相当漫长的岁月之后，才弄清了我在入狱初期感到困惑莫解的种种现象。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(6)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_535_2360-2470\",\"quote\":\"老人却是个完全不同的人。在熟读经卷方面也许比他们还更胜一筹，但总是回避争论。他性喜交际。愉快开朗，笑口常开——不是囚犯的那种粗鄙、猥亵的笑，而是开朗、安详的笑，其中含有很多孩子般的稚气，这笑容不知怎么与他的白发特别相称。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(6)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_535_2860-2939\",\"quote\":\"监狱里几乎人人都是贼，可是不知为什么，大家突然都深信不疑，这位老者是决不会偷盗的。不知道他把交到他手里的钱藏到了哪里，但一定是谁也无法找到的一个十分隐秘的地方\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(6)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_536_1805-1857\",\"quote\":\"最后的破烂都喝光以后，醉汉躺下睡觉了，第二天醒来，脑袋里嗡嗡作响，他徒劳地请求酒贩子让他再喝一口解解酒。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(7)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_538_328-418\",\"quote\":\"而一个候审犯大致计算一下那个痛苦的日子到来的期限，往往会逃进医院，希望把痛苦的时刻多少推迟一些。等到出院回监狱，几乎能准确地知道，第二天就是注定不祥的日子，这时他几乎总是焦躁不安。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(9)\",\"date\":\"2020-06-18\"},{\"id\":\"26785337:mark:26785337_5_13528-13568\",\"quote\":\"人应当信奉什么、应当怎样生活，最终只能依赖个人的主观选择，无法获得理性论证的担保\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_13714-13789\",\"quote\":\"由于信仰无法获得理性的客观根据，人们信奉的终极价值多种多样，而多元价值之间的冲突无法通过知识或理性辩论来解决，这就是韦伯所说的“诸神之间永恒的斗争”。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_1425-1502\",\"quote\":\"韦伯不只是纯粹的书斋型学者，他还是德国当时最有影响的公共知识分子。去世之后，他的学术和思想遗产产生了广泛而持久的影响，被视为西方现代历史上的一位思想巨人。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_2070-2158\",\"quote\":\"恰恰是这种神秘精神，将人类与整个宇宙连成一体，并从这种联系中获得生存的意义。古代人的终极价值，生命的根本意义，不是人类自足的，而是依托于比人类更高的存在，依赖于宇宙的整体秩序。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_2655-2729\",\"quote\":\"古代世界那种迷雾一般的魅惑，在现代的“清晨”被理性化的光芒驱散了。现代人在回望古代世界的时候，会有一种“大梦初醒”的感觉，这就是所谓“世界的除魅”。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_2820-2904\",\"quote\":\"这个“梦醒时分”对许多人来说在精神上是格外“荒凉”的，信仰失去了以往神秘的根基，而科学又无法为生命的意义提供新的根本依据，终极价值不再具有客观性和公共性，会让人茫然若失\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_4295-4357\",\"quote\":\"韦伯坚信，学者遵循的最高原则是“智性的诚实”（intellectual honesty），就是要揭示真相，无论真相是多么严酷\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_4379-4453\",\"quote\":\"揭示真相是为了让人清醒、清澈和清晰，而不是在发现真相之后陷入伤感、绝望、虚无或者狂热。这当然是十分艰巨的任务，需要一种罕见的审慎与均衡感才可能达成。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_4501-4511\",\"quote\":\"一方面拒绝虚妄的信心\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_4695-4813\",\"quote\":\"另一面，韦伯又要抵制极端的虚无主义和悲观主义，他需要在复杂而不确定的时代中，细心分辨什么是“可知的”与“不可知的”、什么是“可为的”与“不可为的”，以及两者之间的界限，从而论证，我们在放弃虚妄的信念之后，并非无路可走，仍然可以有所作为。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_5248-5296\",\"quote\":\"黑夜是等不过去的，在黑夜里我们仍然应当做自己能做的事情，这是激发和鼓励一种踏实而审慎的积极态度。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_7200-7250\",\"quote\":\"通常人们对于学术抱有的那些信心和信念是未经充分反省的，传统所确认的学术价值在现代世界中可能根本不可靠\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_7417-7576\",\"quote\":\"由于学术发展，我们的人生反而难以完满了。在传统社会中，我们对世界是相对熟悉的，过完了一生会有一种“享尽天年”的感觉。而现代知识的不断更新，带给人们“日新月异”的感受，一切都是速朽的，于是我们过了一生，也只能理解人类文明进程之中微乎其微的一部分。死亡不再是“圆满”而是中断，生命的意义未曾充分实现，因此有一种残缺的感觉。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_8834-8942\",\"quote\":\"韦伯两次演讲的时间相距十四个月，形势发生了重要的变化。第一次演讲是在1917年11月，当时一战还未结束，德国在战场上还有相当的优势，而第二次演讲发表在1919年1月28日，德国已经在两个月之前宣布投降，以战败而告终。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_9562-9698\",\"quote\":\"极端地说，官僚系统的最佳状态，就是一部高效率的运转良好的机器，它是没有“灵魂”的，这也是理性化时代对现代政治的塑造结果。而政治家则不同，严格意义上的政治家，尤其是韦伯说的“政治领袖”，具有鲜明的“好恶感”，他们有明确的信念和立场，必须对政治行动的最终结果负责，而且责无旁贷\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"26785337:mark:26785337_5_9720-9780\",\"quote\":\"官僚多半是“靠政治而活”，而政治家是“为政治而活”。政治家必须引领官僚系统，为其“注入灵魂”，才能在政治事业上有所作为。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导读：祛魅时代的学术与政治\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_530_1295-1336\",\"quote\":\"但此人十分孤僻，避不见人，他学识渊博，博览群书，不过寡言少语，总之，很难和他深谈。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(1)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_530_2331-2394\",\"quote\":\"我刚从邮局收到的书刊就拿在手上，我把这些尚未拆开的书刊推荐给他看。他投以贪婪的一瞥，却又立刻改变主意，谢绝了，借口是没有时间看\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(1)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_530_2485-2584\",\"quote\":\"记得，我在他的房间里几乎没有看到书，可见，说他博览群书是与事实不符的。不过，有两次我深夜从他的窗前路过，发现他屋子里有灯光。他独坐通宵，在干什么呢？不是在写作吧？倘若是在写作，那么究竟在写些什么呢？\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(1)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_530_2711-2741\",\"quote\":\"。我给她一枚二十戈比的硬币，她给我捧来了死者遗留的一大筐手稿\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(1)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_530_4796-4845\",\"quote\":\"我现在无法理解，我怎么竟能在这样的房间里生活了十年。在木板通铺上有我的三块木板：这是我的全部地盘。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(1)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_531_3993-4071\",\"quote\":\"往往有人能忍耐几年，很温顺，忍受着极其残酷的刑罚，可是为了一点儿小事，稍不顺心，几乎不为什么就突然爆发。在某些人看来，简直可以说他是个疯子；可情况就是这样。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(2)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_532_391-449\",\"quote\":\"这种制度吸干了人的生命汁液、使他的心灵枯竭、软弱、惊恐不安，然后却把精神枯萎的木乃伊、一个半疯子奉为改造和悔罪的典型\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(3)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_532_453-546\",\"quote\":\"一个反社会的罪犯是敌视社会的，几乎总是认为自己无罪而归罪于社会。何况他已经受到社会的惩罚了，几乎认为自己经过这样的赎罪，已经净化了。从这种观点出发可以断定，最后几乎势必会为罪行本身辩护。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(3)\",\"date\":\"2020-06-17\"},{\"id\":\"908185:mark:908185_15_11300-11366\",\"quote\":\"让盖茨跳进垃圾桶，在咖啡渣和垃圾里翻找一沓沓污迹斑斑、皱巴巴的连续打印纸。艾伦说：“我们把这堆珍贵的纸张拿回终端室，钻研了好几个小时\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_11475-11531\",\"quote\":\"于是，盖茨和艾伦想再深挖一步。要想把握操作系统的架构，他们就必须掌握汇编码，也就是直接与计算机硬件对话的深层命令\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_12151-12220\",\"quote\":\"不甘忍受限制的盖茨和艾伦想设法突破这个系统，于是他们弄到一个管理员密码，侵入了内部会计系统文件，并破解了密钥。这样他们就能使用免费账户了。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_12891-12935\",\"quote\":\"于是他们改变了策略：他们给信息科学公司写了封信，表示愿意提供服务，以换取免费的使用时间。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_13321-13394\",\"quote\":\"里克·韦兰懂COBOL，他为信息科学公司的系统写了一个程序编辑器，艾伦很快就掌握了。这时候，两个年纪较大的男孩认为他们不需要盖茨和肯特·埃文斯了。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_14964-15006\",\"quote\":\"两校的合并导致班级排课变得非常麻烦，于是校方让盖茨和埃文斯写一个程序来解决这个问题。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_16034-16139\",\"quote\":\"盖茨给刚刚在华盛顿州立大学读完一年级的保罗·艾伦打了电话，让他回西雅图帮忙编写排课程序。盖茨对他说：“我本来是要和肯特一起做的，现在我需要你帮忙。”盖茨当时的状态很糟。艾伦回忆说：“比尔一连几周情绪都很低落。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_18917-18947\",\"quote\":\"他和艾伦会坐在那里编写代码，一写就是12个小时甚至更长时间。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_19021-19066\",\"quote\":\"有时候，在疯狂工作两天之后，他们会睡上18个小时甚至更长时间，用盖茨的话说就是“大睡一场”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_19610-19655\",\"quote\":\"盖茨十二年级时只申请了三所大学（哈佛、耶鲁和普林斯顿），每所大学他都采取了不同的申请策略。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_20457-20518\",\"quote\":\"他的习惯是一连学习36个小时甚至更长时间，接着倒头睡上10个小时，然后出门买份比萨，再回来继续学习，哪怕这时候是凌晨3点。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_2157-2274\",\"quote\":\"1974年12月，就在盖茨和艾伦第一次看到《大众电子学》封面的那一天，两人便决定为个人电脑制作软件了。不仅如此，他们还想改变这个新兴行业的利润分配格局，让硬件成为一种可以替代的商品，并让那些创造出操作系统和应用软件的人获得大部分利润。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_23060-23151\",\"quote\":\"1974年暑期，即将升入大学二年级的盖茨说服艾伦来到波士顿地区，从事一份霍尼韦尔原本提供给盖茨的工作。于是艾伦从华盛顿州立大学退学，开着他的克莱斯勒一路向东，他力劝盖茨和他一起退学。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_24549-24669\",\"quote\":\"1974年12月，当艾伦带着封面上印有Altair电脑的新一期《大众电子学》来到盖茨位于柯里尔楼的宿舍时，盖茨在哈佛的随性生活突然间被颠覆了，当时他大二刚读了一半。艾伦那句“你瞧，这件事我们竟然没有参与”的召唤让盖茨为之一振，决定行动起来。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_27155-27200\",\"quote\":\"增强版Altair的内存只有4K，而他们的目标是让这个程序小于4K，尽量为用户留出使用空间\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_27420-27462\",\"quote\":\"到1975年2月底，经过8周紧张的代码编写工作，他们终于成功地把程序精简到了3.2K\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_27707-27831\",\"quote\":\"飞机下降的时候，艾伦突然想起还没写加载器，也就是一系列引导Altair将BASIC解释器载入内存的命令。在飞机准备着陆时，他抓起一个便笺本，用英特尔微处理器使用的机器语言写了21行代码，每行都是一个三位的八进制数。等艾伦离开航站楼时已经浑身冒汗了。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_29371-29454\",\"quote\":\"盖茨决定暂时留在哈佛继续读书。他在哈佛经历了一场许多最成功的学生都经历过的“成年礼”（当然，这种事只在事后回忆时才会觉得有意思）：被神秘的大学行政理事会召去接受处分。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_29593-29710\",\"quote\":\"最后，学校没有为使用计算机而追究盖茨的责任，但他还是因为让校外人员保罗·艾伦用他的密码登录PDP–10而“受到警告处分”。他接受了这项轻微的处分，并同意把BASIC解释器的早期版本（而不是他和艾伦当时正在编写的改进版）放在公共领域。[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_30700-30762\",\"quote\":\"现在他们要为自己的公司取一个名字。他们设想了几种方案，其中包括“艾伦\u0026盖茨”，但他们觉得这名字听起来太像律师事务所。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_30809-30854\",\"quote\":\"在与MITS签署的最终协议中，他们自称为“保罗·艾伦和比尔·盖茨，以‘微–软’为名称经营”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_31569-31656\",\"quote\":\"创新者可能是个狂热分子，他热爱自己所做的事情，会没日没夜地工作，也许还会在一定程度上忽略正常的东西，因此会给人感觉有点失衡。我十几岁和二十多岁时的生活状态显然符合这种模式。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_32364-32519\",\"quote\":\"他在和艾伦散步时说：“BASIC的大部分工作是我做的，我从哈佛退学也做了很大牺牲，所以我应该占公司60%以上的份额。”他的新要求是按64对36的比例划分。艾伦气坏了。他说：“这暴露出图书馆馆员的儿子和律师儿子的差别。我从小受到的教育是，协议就是协议，说话要算数。但比尔则比较灵活。”不过，这次艾伦还是让步了。[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_33464-33501\",\"quote\":\"关了几个小时之后，盖茨被释放了，但他那晚的案底照片成为极客历史上的著名标志\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_36251-36363\",\"quote\":\"尽管最初的开发只用了两个月，但我们三个人去年几乎花了一整年时间为BASIC建立文档并持续改进和添加特性。现在我们已经开发出4K、8K、加强版、只读存储器版和磁盘版的BASIC。我们使用的计算机时长价值已超过40 000美元。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_36447-36556\",\"quote\":\"其一，这些“用户”中的大多数从未购买过BASIC（在所有Altair用户中，只有不到10%的人购买了BASIC）；其二，我们从发烧友那儿收到的使用费如果换算成开发Altair BASIC的劳动价值，还不到一小时两美元。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_36741-36865\",\"quote\":\"你们导致的结果则是，今后不会再有人愿意去写出色的软件了。谁能分文不取地从事专业工作呢？哪个发烧友能为编程、找漏洞和编写文档投入相当于三个人干一整年的工作量，然后免费发放产品？事实在于，除了我们之外，还没有人在面向业余爱好者的软件上投入过这么多资金。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_37495-37548\",\"quote\":\"盖茨坦言：“我收到了一片骂声。”在他收到的300封信中，只有五封信主动提出付款。其他多数信件都是在骂他。[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_37816-37947\",\"quote\":\"不过，这封信也透出一种放肆。毕竟盖茨也是盗用计算机分时服务的连环窃贼，而且从八年级到大学二年级，他一直在利用密码入侵账户。盖茨在信中称，他和艾伦为开发BASIC而花费了价值超过40 000美元的计算机时长，但他隐瞒了一个事实，那就是他从来没有真正为这些时长付过费\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_39510-39546\",\"quote\":\"沃兹尼亚克的父亲是洛克希德公司的一名工程师，他喜欢跟沃兹尼亚克讲解电子学\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_40084-40119\",\"quote\":\"等到念高中的时候，沃兹尼亚克便开始把他非凡的电子技术才能用在搞恶作剧上\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_40416-40470\",\"quote\":\"和其他人一样，沃兹尼亚克也把对技术的热爱和嬉皮风格的打扮结合在了一起，虽然他并不太适应反主流文化的生活方式。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_40926-41016\",\"quote\":\"一位朋友把沃兹尼亚克介绍给了另一个也热衷电子学的孩子，这个孩子住在与他家相隔几个街区的地方，名叫史蒂夫·乔布斯。乔布斯比沃兹尼亚克小将近五岁，当时还在沃兹尼亚克的母校家园高中读书。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_41192-41233\",\"quote\":\"他们最大的一次恶作剧是“蓝盒子”事件，这件事为两人日后的电脑业务合作关系奠定了基础\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_41852-41899\",\"quote\":\"沃兹尼亚克设计出了一个新颖的设备，但与乔布斯的合作让他做成了更多事情：他们创建了一个商业项目。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_4450-4578\",\"quote\":\"他的一位老师说：“在‘nerd’（书呆子）这个词还没发明的时候，他就是个‘nerd’了。”他对学业的专注是出了名的。四年级的时候，科学课老师布置了一篇论文，要求写5页纸，结果他交了30页。也就是在那一年，当学校要求他选择未来职业时，他勾选了“科学家”一项。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_45563-45747\",\"quote\":\"沃兹尼亚克当时在设计一个带有视频显示器和键盘的终端。他本来想把它设计成一个“哑”终端，即自身不具备计算能力，而要通过电话线与其他地方的分时计算机相连的终端。但当他看到那份微处理器规格表时，他突然产生了一个灵感：可以利用微处理器（带有中央处理单元的芯片）赋予他正在制作的终端一些运算能力。这就在Altair的基础上迈进了一大步：这是一台集计算机、键盘和屏幕于一体的设备！\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_46022-46051\",\"quote\":\"但这确实是键盘和显示器第一次应用于为发烧友设计的个人电脑。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_46080-46186\",\"quote\":\"家酿计算机俱乐部的使命是自由分享创意。这与比尔·盖茨的立场背道而驰，但沃兹尼亚克却是这种公有思想的拥护者：“我非常认同家酿俱乐部推动计算机技术发展的使命，于是我把自己完整的设计图复印了100来份，谁想要就给谁。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_46844-46950\",\"quote\":\"盖茨曾逼迫艾伦同意给他半数以上的合伙份额。而在苹果的案例中，对合伙份额据理力争的是沃兹尼亚克的父亲。这位敬重工程专家、鄙视营销人员和管理者的工程师坚称，产品设计都是他儿子做的，沃兹尼亚克理应获得超过50%的份额。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_47047-47114\",\"quote\":\"但沃兹尼亚克深知乔布斯在他们合作关系中的贡献，这种贡献的价值至少在50%。如果只有他自己，沃兹尼亚克能做的也许只是免费分发设计图而已。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_47997-48222\",\"quote\":\"苹果的崛起标志着发烧友文化的衰落。几十年来，基尔比和诺伊斯等年轻创新者最初都是通过拆装电子设备走上电子学之路的，他们学习如何区分晶体管、电阻器、电容器和二极管，然后通过接线或焊接把它们连接在电路试验板上，制作出可组装成业余无线电、模型火箭控制器、扩音器和示波器的电路。但到了1971年，微处理器开始淘汰复杂的电路板，日本电子公司则开始大规模生产比自制电子设备更便宜的产品。DIY套件的销量大幅下降。沃兹尼亚克等硬件黑客开始让位于盖茨这样的软件编程者。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\",\"annotation\":\"硬件地位衰落，软件与设计的崛起\"},{\"id\":\"908185:mark:908185_15_48836-48880\",\"quote\":\"个人电脑领域出现了对应用软件的需求，也就是能借助个人电脑的处理能力来完成特殊任务的程序。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_48909-48969\",\"quote\":\"这一领域最具影响力的先驱者是丹·布里克林（Dan Bricklin），他设计出了世界上第一款用于财务领域的电子制表程序VisiCalc\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_49629-49758\",\"quote\":\"布里克林看过道格·恩格尔巴特的联机系统演示（该系统因“演示之母”而闻名），该系统以图形显示和可点击的鼠标为特色。于是布里克林开始构思一种使用鼠标和具有简单“定点——拖动——点击”界面的电子表格。当年夏天，布里克林在马撒葡萄园骑自行车时决定把这个设想变为产品。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_50728-50792\",\"quote\":\"布里克林和弗兰克斯顿都拥有出色的商业头脑和揣摩消费者欲求的能力，因此他们重点关注如何把VisiCalc做成产品而不仅仅是一款程序\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_51352-51408\",\"quote\":\"苹果II的胜出要归功于VisiCalc，因为在整整一年时间里，VisiCalc一直没有推出针对其他个人电脑的版本\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_51543-51645\",\"quote\":\"在此之后，市场上很快出现了Apple Writer和EasyWriter等一批文字处理软件。因此，VisiCalc不仅刺激了个人电脑市场的发展，而且催生了一个由利润驱动的新兴行业，即专有应用软件发行行业。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_5254-5337\",\"quote\":\"湖滨中学母亲俱乐部通过义卖筹集到3 000美元，她们以每分钟4.80美元的价格购买了该系统一段时长的使用权。后来的事实证明，她们太低估这个新玩意的热门程度和烧钱程度了\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_55118-55235\",\"quote\":\"这时盖茨已经意识到，有一种操作系统（最有可能是IBM选择的操作系统）最终将成为多数个人电脑使用的标准操作系统。他还意识到，谁拥有这种操作系统，谁就能占据有利地位。于是，盖茨及其团队没有让IBM的人去见佩特森，而是承诺他们会把事情办妥。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_55672-55728\",\"quote\":\"于是，微软只花了一点钱就买到了一款出色的软件，在对该软件进行一番润色之后，微软成功地在软件行业统治了逾30年之久\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_56341-56472\",\"quote\":\"他要借助IBM将微软的操作系统变为一种全球通用标准，而微软则保留对该操作系统的所有权。在与佩特森的公司进行的交易中，微软不是仅仅购买了使用许可，而是彻底买断了DOS，“可将其用于任何用途”。这一招非常聪明，但更棋高一招的是，微软没有让IBM迫使其接受同样的安排。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_57000-57026\",\"quote\":\"经过一个月的谈判，一份长达32页的协议在1980年11\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_57201-57382\",\"quote\":\"但盖茨知道，合同中有两项条款将改变计算机行业的权利格局。第一，IBM对该操作系统（后来被称为PC-DOS）的使用许可是非排他性的。盖茨有权以MS-DOS为名将同一款操作系统授权给其他个人电脑生产商。第二，微软将保留对源代码的控制权。这就意味着，IBM不能将软件更改或升级为该公司电脑的专有软件。只有微软有权进行更改，随后，微软可随意将每款新版软件授权给任何公司。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_58084-58123\",\"quote\":\"盖茨向他妈妈吹嘘他与IBM的交易有多么重要，希望以此证明他从哈佛退学的正确性。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_58269-58354\",\"quote\":\"于是玛丽回来后对盖茨提出警告称：“看，我把你的情况都跟奥佩尔说了，我提到了你的项目，还有你是怎么退学的，但他并不知道你是谁，所以说，你的项目也许并不像你想象的那么重要。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_58477-58510\",\"quote\":\"奥佩尔的反应是：“哦，你们是说玛丽·盖茨的儿子？哦，对，她很棒。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_59907-59927\",\"quote\":\"以IBM的思维，微软只是一家供应商而已。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_59956-60025\",\"quote\":\"但笑到最后的是盖茨。凭借这项交易，微软将IBM个人电脑及其仿制产品变成了可相互替代的商品，它们唯有靠打价格战来竞争，注定只有微小的利润空间\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_6144-6245\",\"quote\":\"保罗·艾伦比盖茨高两个年级，身体发育得远比盖茨成熟（他甚至能留鬓角），两人是在湖滨中学的计算机房里结识的。高大、合群的艾伦并不是那种典型的书呆子。一见到盖茨，艾伦立马就对他产生了兴趣，而且被他吸引住了。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_61820-61841\",\"quote\":\"施乐主要展示了三大创新成果。第一是以太网，\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_61947-61963\",\"quote\":\"第二项创新是面向对象的程序设计。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_62014-62034\",\"quote\":\"吸引他注意的是第三项创新，即图形用户界面\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_62721-62825\",\"quote\":\"当有人质疑乔布斯盗用施乐的创意时，他援引了一句毕加索的名言：“巧匠摩形，大师窃意。”（Good artists copy，great artists steal.）他还说：“我们从来都不羞于窃取伟大的创意。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_62842-62922\",\"quote\":\"他这样评价施乐的管理层：“他们都是复印机脑袋，根本搞不清计算机能做什么。他们本可以稳夺计算机行业最伟大的胜利，但却搞砸了。施乐本来是能统治整个计算机行业的。”[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_65844-65969\",\"quote\":\"乔布斯的忧虑在1983年11月成为现实，当时距麦金塔的推出还有两个月时间，而盖茨就在这个节骨眼上在曼哈顿的皇宫酒店举办了新闻发布会。他宣布微软正在开发一款以图形用户界面为特色，面向IBM个人电脑及类似产品的新型操作系统。该系统将被称为Windows。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_66479-66556\",\"quote\":\"“喔，史蒂夫，我认为这个问题我们还可以这样看。我认为这更像是我们两人都有个名叫施乐的富有邻居，我闯进他家里准备偷电视机，结果发现你已经把电视机偷走了。”[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_67058-67075\",\"quote\":\"法庭最终判定盖茨的所作所为是合法的\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_67168-67221\",\"quote\":\"法院裁定：“苹果无权为图形用户界面创意或桌面隐喻创意取得专利性质的保护。”保护界面外观创新几乎是不可能的。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_67386-67436\",\"quote\":\"不过，Windows最终还是一步步占据了统治地位，不是因为它的设计更加出色，而是因为商业模式更胜一筹\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_67482-67592\",\"quote\":\"在乔布斯看来，微软的成功象征着世界运转方式中的审美缺陷。他后来表示：“微软的唯一问题时，他们没有品位，一点品位也没有。我不是针对某个小的方面，而是从宏观角度来说的。他们没有原创思想，也没有在产品中融入很好的文化元素。”[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_6759-6813\",\"quote\":\"两人之间的一大差别是注意力集中方式不同。艾伦的思维会在许多想法和爱好之间不断变换，而盖茨则一次只专注于一件事\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_68159-68219\",\"quote\":\"与复制微软BASIC程序带的家酿计算机俱乐部成员相比，斯托尔曼追求更高的道德标准，他坚信，软件应该协作开发并自由分享。[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_69755-69829\",\"quote\":\"斯托尔曼大学念的是哈佛，即便是在数学高手如林的哈佛，他也照样成为一名传奇人物。无论是大学时代的暑期还是毕业后，他都在麻省理工学院人工智能实验室工作，\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_70649-70793\",\"quote\":\"但斯托尔曼失望地看到，麻省理工学院的黑客情谊从20世纪80年代初开始变淡了。他所在的实验室购买了一台新的分时计算机，上面安装了专有软件系统。斯托尔曼叹道：“就连拷贝可执行文件也必须签署保密协议。这就意味着，要想使用一台电脑，第一步得承诺不要帮助你身旁的人。一种协作性的社群遭到了禁止。”[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_71457-71537\",\"quote\":\"斯托尔曼也不会妥协。他说，专有软件是“邪恶的”，因为“它要求人们必须同意不与他人分享，从而让社会变得丑陋起来”。他认为，抵制和击败邪恶力量的方法是创造自由软件。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_71912-72064\",\"quote\":\"斯托尔曼发布了一项宣言：“我认为，如果我喜欢一款程序，就必须将其分享给喜欢这个程序的其他人，这是我信奉的准则。卖软件的人想分化和征服用户，他们强迫每个用户都同意不与他人分享。但我拒绝让他们以这种方式打破我与其他用户的团结一致……GNU一旦编写出来，每个人都将可以像呼吸空气一样自由地获得出色的系统软件。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_72615-72678\",\"quote\":\"自由软件运动所倡导的原则“从本质上说不仅只是为了个人用户，更是为了整个社会，因为它们推进了社会的团结一致，促进了分享与协作。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_72990-73050\",\"quote\":\"通用公共授权的本质是赋予“每个人运行程序、复制程序、更改程序和传播更改后版本的权力——但不允许任何人自行为程序设限。”[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_73211-73282\",\"quote\":\"斯托尔曼自己动手编写了GNU操作系统最初的一些组成部分，其中包括文本编辑器、编译器，还有许多其他工具。但GNU还缺少一个关键部分，也就是内核。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_73619-73775\",\"quote\":\"但出于种种原因，他发现自己很难完成GNU的内核程序。到了1991年，内核程序终于面世了，但写程序的既不是斯托尔曼，也不是他的自由软件基金会，而是一个谁没能料想到的人：一个喜欢露齿而笑，带着几分孩子气的21岁男孩，名叫莱纳斯·托瓦尔兹（Linus Torvalds），他是一个说瑞典语的芬兰人，在赫尔辛基大学读书。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_75426-75477\",\"quote\":\"做好简单的终端模拟器之后，托瓦尔兹还想让电脑能够下载和上传文件，于是他建了磁盘驱动器和文件系统驱动器。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_75553-75631\",\"quote\":\"“前一刻我还披着自己那件破浴袍冥思苦想，考虑在一个终端模拟器上添加额外的功能。下一刻我就意识到，它聚集了这么多的功能，已经变为一个逐步成形的新操作系统了。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_7617-7690\",\"quote\":\"大约就在这个时期，他开始一本正经地告诉别人他会在自己30岁之前赚到100万美元。事实证明他严重低估了自己；到30岁时，他的身价会达到3.5亿美元。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_77530-77664\",\"quote\":\"托瓦尔兹说：“我收到人们发来的电子邮件，询问我是否想让他们给我寄上30美元左右的酬金。”当时他背负了5 000美元的学生贷款，每月还要为他的计算机支付50美元的分期贷款。但他没有去拉捐款，而是让人们给他寄明信片，于是，世界各地Linux用户的明信片开始像潮水一样涌来。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_7760-7818\",\"quote\":\"1968年秋季，当盖茨即将升入八年级时，他和艾伦组建了湖滨编程集团。这个组织从某种程度上来说是一个由极客组成的黑帮。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_77672-77757\",\"quote\":\"“一般是萨拉去收信，看到整天跟她斗嘴的哥哥竟然能收到那么远的地方的新朋友的来信，她的敬佩之情油然而生。这是她第一次发现，我虽然老是占用电话线路，但还是做了些有用的事情。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_79131-79199\",\"quote\":\"无私的协作者们对该系统进行了改进，添加了类似Windows的图形界面和计算机联网辅助工具。只要有漏洞出现，就会有来自某处的某个人动手修补\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_79320-79345\",\"quote\":\"莱纳斯定律”：“众目睽睽之下，漏洞将无所遁形。”[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_79508-79573\",\"quote\":\"对等共享和协同合作其实并不是什么新鲜事物。整个进化生物学领域都是围绕人类及一些其他物种的成员之间为何能以利他方式合作这一问题展开的\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_79936-80077\",\"quote\":\"本杰明·富兰克林在《自传》（Autobiography）中提出了一整套以“为公共福祉而奉献是神圣的”为箴言的公民理念，以解释他为何要鼓励人们自愿结社，去创建医院、民兵、街道清扫队、消防队、图书馆、夜间巡逻队和许多其他社群组织。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_80154-80230\",\"quote\":\"托瓦尔兹说：“金钱并不是最强大的动力。人们在激情的驱动下，在享受快乐时所做的工作是最出色的。这个道理既适用于编剧、雕塑家和创业者，也适用于软件工程师。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_80258-80351\",\"quote\":\"“激励黑客们无私奉献的重要原因还有一点，这就是，他们做出的切实贡献能够赢得同行的尊重……每个人都想给同行留下深刻的印象，提高自己的声望和社会地位。开源软件开发让程序员们拥有了这个机会。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_80681-80765\",\"quote\":\"托瓦尔兹能够把握一种数字时代的艺术，即在大规模、分散化和无等级协作中担任具有威信的领袖。与托瓦尔兹同时代的领袖还有维基百科的创始人吉米·威尔士（Jimmy Wales）\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_81885-81909\",\"quote\":\"“自由软件”一词反映出一种与他人共享的道义责任。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_81958-82079\",\"quote\":\"“开源软件”强调的是让人们通过协作来提高软件开发效率这一实用目标。在实践中，多数自由软件也是开源软件，反之亦然；它们通常都被归入“自由和开源软件”一类。但在斯托尔曼看来，开发软件的方式和动机同等重要。否则，自由软件运动就很容易出现妥协和腐化。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_15_83529-83718\",\"quote\":\"到20世纪90年代，世界上已经出现了许多种软件开发模式。这其中有硬件与操作系统软件牢牢捆绑的苹果模式（麦金塔电脑、iPhone手机和所有i系列产品都是以这种方式开发出来的，其目的是创造无缝用户体验）；有操作系统不捆绑软件，能让用户拥有更多选择的微软模式；此外还有软件完全不受束缚，任何用户都能动手修改的自由和开源模式。每一种模式都有其优势，都能够刺激创新，并且都有一批先知和信徒\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第九章 软件\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_16_22156-22248\",\"quote\":\"商业公司根本不可能为与教育或科研机构不相干的普通人直接提供互联网服务。史蒂夫·凯斯说：“这种情况现在看起来十分愚蠢，但在1992年以前，美国在线这样的商业服务与互联网连接是违法的。”[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十章 在线\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_16_22386-22418\",\"quote\":\"从1993年开始，互联网的准入门槛降低了，成为向所有人开放的服务\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十章 在线\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_16_24009-24074\",\"quote\":\"1986年，戈尔启动了一个国会研究项目，对创建超级计算机中心、对接不同科研网络、增加带宽以及向更多用户开放网络等一系列问题进行考察\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十章 在线\",\"date\":\"2020-06-13\"},{\"id\":\"908185:mark:908185_16_24532-24896\",\"quote\":\"1999年3月，当美国有线电视新闻网的沃尔夫·布利策（Wolf Blitzer）请戈尔列举他作为总统候选人所具备的资质时，他举例说：“我在美国国会供职期间，曾主动采取行动推动互联网的创建。”[插图]与有线电视新闻访谈上通常的回答一样，这句话也遭到了断章取义的解读，但戈尔的确从未使用过“发明”一词。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十章 在线\",\"date\":\"2020-06-13\"},{\"id\":\"635673:mark:635673_3_3317-3357\",\"quote\":\"希勒教授是一个跨学科、跨领域的经济金融学家，他即是古典经济金融学家，又是非常规的\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_3_3468-3544\",\"quote\":\"希勒教授是行为金融学领域的奠基人之一。有别于传统金融学研究中“理性人”假设，行为金融学研究侧重于从人们的心理和行为出发，研究和解释现实金融市场中的现象。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_3_3988-4117\",\"quote\":\"我一直认为希勒教授是理想主义者，他相信人性的光辉，他认为可以通过技术安排为公众的利益重塑金融业，把金融业作为人类财富的管理者，通过公众的广泛参与，让金融业为人类社会的良性发展服务。全民的广泛参与也会打破金融的精英权力结构，使得金融民主化，并实现财富分配的公平\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_1135-1256\",\"quote\":\"上海证券交易所历史悠久，最早成立于1891年，但是1949年新中国成立时被关闭，直到1990年才重新组建。而在1990年，大多数中国人已经忘记了证券交易所的常规功能，他们先入为主地认为这是一个邪恶的事物，只有经历较长的适应期之后才再次接受它。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_1849-1896\",\"quote\":\"中国人平均每8000人才能享有1位律师的服务，相比之下，每300个美国人就能享有1位律师的服务\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_1946-2023\",\"quote\":\"由于律师是直接起草金融合约的人，也是监督合约能够得以执行的人，并且是有能力保护民众不受金融权力滥用伤害的人，所以律师在金融主导的经济体中扮演着重要的角色。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\
