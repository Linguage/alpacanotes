"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_2023-2105\",\"quote\":\"如果没有律师，民众可能会先入为主地认为金融机制总是优先回报那些自私和贪婪的人，再加上整个社会的思潮是没有任何限制因素的，所以我们的社会会变得越来越自私、越来越贪婪。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_2286-2330\",\"quote\":\"当中国人均拥有律师的数量和人均享有的金融业服务人员人数提升后，腐败的现象应该会逐渐消失。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_2394-2458\",\"quote\":\"世界上任何一个国家都不可能照搬照抄其他国家金融领域的办事理念。考虑到中国独特的体制、文化背景和发展速度，照抄他国是完全不现实的。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_2988-3107\",\"quote\":\"铁路和高速公路的建设也要考虑路线途经区域的正确性，建设施工过程中采用的技术的正确性，以及对中国未来发展的影响。执行这种计划，一方面需要中央统一规划，另一方面需要将具体决策的权力释放给相关主体，而参与其中的人都需要得到适当的金融制度的激励。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_3461-3522\",\"quote\":\"社会金融化程度越高，不平等程度越低，原因在于金融本身起到管理风险的作用，对风险的有效管理应该带来降低社会不平等程度的效果。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_4227-4389\",\"quote\":\"中国“百年以来都有慈善和互助的传统，不过其影响局限在社区、宗族或亲属之间……但大多数非营利性组织都是一家或多家政府机关创建、组织并管理的，所以它们缺乏独立性和运营能力”。除此之外，根据他们的说法：“大多数中国人都因为社区、工作单位或自己所属政治团体的要求而参与志愿者活动，志愿者中只有15%的人是出于自身意愿而无私奉献的。”\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_4418-4513\",\"quote\":\"我在本书中提出一个主张：对自己家人和自己身处的社区所行的善举也应被算作真正的慈善，也应该在社会中极力提倡。在倡导慈善时，我们应该注意扩大慈善义举覆盖的范围，也应该倡导慈善源于个人的主动意愿。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_4542-4597\",\"quote\":\"政府不应成为慈善捐赠的主导力量，真正能使慈善事业蓬勃发展的是人们的创意和同情心，而且也必须是人们自觉自愿的捐赠\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_4_4803-4857\",\"quote\":\"中国新生的富人阶层与其他国家的同类人群一样，他们都应该扩展自己的视野，认真思考自己如何为社会良性发展多作贡献\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_5_2550-2676\",\"quote\":\"不可否认，非法行为是导致当下金融危机的祸源之一，但在我看来，把所有问题都归结到这一个源头上会使人们忽略宏观层面的问题。导致现有金融体系出现问题的诱因很多，如果我们不通过改造现有体系解决深层次的问题，那么我们将错失解决问题的关键，也将错失纠正错误的时机。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_5_4296-4452\",\"quote\":\"当代社会确实在朝着一个经济地位越来越不平等的方向发展，造成这种趋势的原因之一是参与金融相关活动的人获得的报酬相当高，而在整个经济体系中其他行业从业者获得的报酬相对低很多，大多数中产阶级和穷人都属于后一类，而他们的社会地位也越来越不稳固。政府划拨资金救助本来就很富有的一群人，无疑加重了公众对这种不平等现象的质疑。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_5_4535-4587\",\"quote\":\"尽管其存在种种不足且可能显得贪得无厌，但是金融业同时也有潜力帮助我们塑造一个更和谐、更繁荣和更平等的社会\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_5_5208-5347\",\"quote\":\"此次金融危机提醒了我们，进行金融创新的一个重要前提就是必须服务于保护整个社会的资产这个最根本的目标。为了保证目标得以实现，最好的办法就是在华尔街培养并监管不同的从业者—首席执行官、交易员、会计、投资银行家、律师和慈善家，通过倡导他们心存良善的从业行为，进而影响整个华尔街的文化。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_5_5899-5990\",\"quote\":\"金融危机使得民众对金融业怀有敌意，其不幸的后果之一就是金融的进一步发展将被抑制。最具讽刺意味的是，为了降低未来金融危机发生的概率，我们需要运用更好的金融工具，而非一味地减少金融活动。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_5_6523-6606\",\"quote\":\"能够提高社会生产效率的金融创新迅速地传播开来，原因有三：一是有信息技术革命的助力，二是越来越多的国家开始尝试不同的经济结构，三是这些国家在同一个全球性的大市场中竞争。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_10238-10318\",\"quote\":\"如果我们对历史发展的轨迹进行推演，我们很有可能极大地延展金融体系发展的深度和广度。实现这一目标需要政府的介入，但是政府干预的手段不能阻碍市场自发的解决方案推进。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_11943-12035\",\"quote\":\"专业思维指的是能够从更广泛的视角思考问题的能力，也就是能够将不同立场、不同渊源的信息结合在一起思考的能力，这些信息能够帮助我们判断什么事情是新的、什么事是多年前就发生过并已经被遗忘的。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_12165-12196\",\"quote\":\"复杂沟通指的是人际交流技巧和对复杂谈话环境识别两种能力的综合。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_12312-12415\",\"quote\":\"在信息技术飞速发展的时代，我们很难预测哪个大类的工种能够幸存下来，任何一个大类之下都会不断衍生出需要专业思维和复杂沟通技能的工种。但是从广义上讲，金融是此类工种最容易存活下来的领域，甚至还有进一步扩大的趋势\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_12910-12955\",\"quote\":\"此后任何银行间的欠款都会以黄金或票据形式进行结算，并不是银行间互相支付，而是统一付给清算所\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_1399-1485\",\"quote\":\"金融如何帮助人们达成平等社会的终极目标？金融如何能为保障自由、促进繁荣、促成平等以及取得经济保障贡献一份力量？我们如何才能使得金融民主化，从而使得金融能更好地为所有人服务？\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_14042-14164\",\"quote\":\"我们至少要承认金融从业者所做的事情中有一部分是有建设性的：他们中有很大一部分人都在对各类业务进行估值，并且引导社会资源投向其中有发展潜力的一部分。但是其他一些金融活动，比如和市场赌方向、进行高频交易或者兜售可疑的金融产品，都对社会没有什么贡献。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_14578-14629\",\"quote\":\"“金融创新”这个词组直到20世纪七八十年代才为人熟知。这个词组最早被用于指称当时刚刚兴起的金融期货市场\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_14955-15036\",\"quote\":\"我们从判决的字里行间可以看出，法院希望看到的是通过“实体物理形式形成的”创新活动。因此直到1982年，美林在创新过程中使用了计算机，金融创新才具备了获得专利的可能\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_2396-2504\",\"quote\":\"如果我们把精力都用来批评金融体系是一个“不负责任的体系”，那最终我们将一事无成。如果我们能够扩展、纠正和规范金融的发展，那么我们仍然有能力达成平等社会的终极目标，也就是为工业化国家和发展中国家都带来同样的繁荣和自由。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_3697-3870\",\"quote\":\"人们应该意识到并非只有股票或债券才能代表金融市场。或许读者一开始没有意识到农产品的价格也与金融产品息息相关，它们的价格对期货价格的影响和股票及债券价格的波动有很大的相似之处。谷物交易市场同样也是一个金融市场，它需要使用和股票市场类似的科技设备，也存在价格的波动，并且对实体经济也产生相当的影响，仅从这些对比上讲我们可以说谷物交易市场也是金融市场。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_4200-4302\",\"quote\":\"这些工人阶级自发的反抗运动没有一个强有力的领导人，而且从根源上讲，工人们起初并没有提出任何共产主义的诉求，他们只是简单地反映了草根阶层对社会现状的不满。但正是这些运动为共产主义生根发芽提供了最适宜的土壤。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_4915-5024\",\"quote\":\"资本关系以劳动者和劳动实现条件的所有权之间的分离为前提。……因此，创造资本关系的过程只能是劳动者和他的劳动条件的所有权分离的过程，这个过程一方面使社会的生活资料和生产资料转化为资本，另一方面使直接生产者转化为雇佣工人。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_5188-5339\",\"quote\":\"马克思从来没有说清楚为什么劳动者无法获得资本。他暗示在资本主义体制下，社会发展的目标完全由上层社会决定—所谓上层社会也就是拥有资本的人，而普通民众没有发言权。虽然他的理论中没有明说，但是根据推理，在这样一个体制内，贫苦的劳动者是永远不可能从银行获得信用贷款的，也永远不可能从富有的投资者处获得风险投资。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_548-642\",\"quote\":\"“好的社会”这个词已经被无数哲学家、历史学家和经济学家沿用了很久，它所描述的是一个我们都希望能够身处其中的理想社会，从定义上讲，这个理想社会应该是一个人人平等的社会，人们相互欣赏、相互尊重\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_5890-5937\",\"quote\":\"财富分配这个基础问题在马克思倡导的新社会中依然存在，这个社会矛盾可以通过教育系统的改革得以解决\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_6333-6387\",\"quote\":\"我认为，金融机构及金融变量应当与朝夕变化、季节更替和潮起潮落等自然现象一样，对人们生活起到指导和规范的作用。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_6590-6753\",\"quote\":\"身处金融和非金融领域的人们都有一个共同的使命，那就是互相帮助，从而发现并了解经济体系存在的意义以及其扮演的社会角色。这个使命说来容易做来难，主要因为三个原因：其一是现有经济体系使得财富集中在一小部分人手里，其二是现有经济体系结构过于复杂，其三是人们被迫在体系内进行各种博弈，而博弈的结果往往要么令人无法满足，要么令人十分不快。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_7069-7132\",\"quote\":\"广义来讲，金融是一门研究目标构建的科学，也就是如何通过必要的经济手段实现一系列目标的学问，以及如何管理实现目标所需的资产的学问\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_7716-7788\",\"quote\":\"金融所要服务的目标都源自民众，这些目标反映了我们每一个职业上的抱负、家庭生活中的希望、生意当中的雄心、文化发展中的诉求，以及社会发展的终极理想。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_8515-8597\",\"quote\":\"金融从业者核心的工作之一是撮合交易，也就是创造新的项目、构建新的企业甚至塑造一套新的体系，不论这些交易的规模大小，正是此项工作将通常散落在各处的个人目标结合在一起。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_9516-9626\",\"quote\":\"解决马克思提出的问题的真正良方并非摧毁整个资本主义体系，反而应该进一步改进这个体系，使其更加民主化。所谓改进这个体系就是使其为平等社会的宏伟目标服务，这一直以来都是解决问题的最好办法，对于那些激进分子而言这可能令其失望。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_9778-9813\",\"quote\":\"就第一点来讲，金融理论中没有一条明确地提出资本应该由少数“大亨”掌控。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_6_9953-10027\",\"quote\":\"针对第二点来讲，创设金融机构时如果真正以人类的品性为核心，那么他们就能更灵活地调整金融创新以适应人类生活的需求，也可以使整个金融体系更加平稳地运转。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 社会需要金融\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_62_672-854\",\"quote\":\"现在来看，2007年爆发的金融危机的诱因中，教育者所犯的错误占很大一部分，特别是学生们过度暴露在有效市场理论的影响之下，促使市场产生投机性泡沫。许多教育者都把市场是完美有效运转的实体这样的极端理念反复灌输给学生。他们的学生以这个思想为出发点，最终得出的结论就是任何个人在商业活动中都可以毫不顾忌道德操守问题，因为就算采取再为人不齿的行径，也不会打破市场完美的平衡。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"第14章 教育者：金融危机始作俑者？\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_63_1034-1057\",\"quote\":\"第一家商学院于1881年在宾夕法尼亚大学成立，\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"商学教育的使命\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_63_1297-1450\",\"quote\":\"根据其1881年时的立项书记载，学院的使命是“在教授学生广泛知识的同时，灌输通过比拼获胜而从他人手中夺取钱财是不道德的，而赚取财富的前提应该是为他人提供服务”。在这个问题上沃顿已经触及金融的实质：金融并不是也不应该是一场零和游戏，它应该一方面促使人类生命更有生产力，另一方面也应该成为辛勤劳作者必得的成果。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"商学教育的使命\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_63_2721-2798\",\"quote\":\"高等学府是金融学的发源地，也是决策者首次接触商学理论和哲学的地方。他们必须深入了解抽象的理论和实际的应用，还需要懂得道德是保障商业活动延续的基石这个道理。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"商学教育的使命\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_64_577-702\",\"quote\":\"现实中存在一种被我们称为中介现象的问题，在高等学府中尤为明显，也就是说学术界的教育者认为自己唯一的目的就是把学生都培养成和自己一样的学者。他们的教学或许过于注重学术领域的前沿研究以及相关方法论，而不是关注如何把学生培养成能在金融体系中参与真实竞争的人\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"经济学教育与道德培养\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_8_445-555\",\"quote\":\"公司的首席执行官总是处在一个与众不同的位置上，原因在于他们代表的是一种理念，是这家公司开展各项业务的核心理念，是这家公司的员工日常工作中蕴含的思维方式，也是包含企业价值观的文化理念，那种将公司和外部社会联系在一起的纽带。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"第1章 首席执行官：那些获得巨额奖金的人们\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_8_584-618\",\"quote\":\"首席执行官的职责就是策划短期目标，通过实现这些目标促进上述理念的发展\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"第1章 首席执行官：那些获得巨额奖金的人们\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_9_1464-1631\",\"quote\":\"首席执行官的更替过程背后有一套完整的金融架构，正是其存在，才使得每一位后续首席执行官的任职成为可能。当代公司的首席执行官从技术上讲只不过是一位特殊的雇员而已，他必须在董事会的监督下为公司服务。界定他们地位的是一纸合同，合同中明文约定其薪酬奖励与公司的业绩和股价表现相关。也就是说对首席执行官的激励依赖于一种金融架构，也是一种金融创新。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"为什么要对首席执行官进行股权激励\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_9_2136-2243\",\"quote\":\"有一种手段可以使首席执行官行动的动力与公司保持一致，那就是发放给首席执行官公司的股票或期权。允许他们在约定价格购买公司股票的做法只有在公司股价上涨的前提下才有意义，所以这种做法激励他们采取各种措施推动公司股价上涨。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"为什么要对首席执行官进行股权激励\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_9_2574-2686\",\"quote\":\"以利润为导向的奖金可能促使首席执行官对公司采取一些揠苗助长的行动，忽略长此以往可能造成的危害，也可能给其继任者留下一个难以收拾的烂摊子。以股价为导向的激励方式则可以鼓励首席执行官引导整个公司朝着有利于长期价值增长的方向前进。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"为什么要对首席执行官进行股权激励\",\"date\":\"2020-06-11\"},{\"id\":\"635673:mark:635673_9_771-823\",\"quote\":\"因此我们也需要一种长期激励机制，以促使首席执行官为公司的长远利益着想。要解决这个问题就需要借助金融方案。\",\"book\":{\"id\":\"635673\",\"title\":\"金融与好的社会\",\"author\":\"罗伯特·席勒\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/673/635673/t6_635673.jpg\",\"url\":\"https://weread.qq.com/web/reader/04432b0059b31904497074d\",\"wordCount\":\"$undefined\"},\"chapter\":\"为什么要对首席执行官进行股权激励\",\"date\":\"2020-06-11\"},{\"id\":\"849769:mark:849769_5_839-973\",\"quote\":\"古典理论其实只适用于某些特殊情况，而不适用于一般情况，均衡论所假定的情况只是均衡的可能位置的有限的点。另外，古典理论所假定的特殊例子的特征不符合我们实际生活的经济社会的特征，因此，如果我们想要把这种理论应用到现实生活中，会发现这种理论只能带来误导性的结果，甚至是灾难。\",\"book\":{\"id\":\"849769\",\"title\":\"就业、利息和货币通论\",\"author\":\"约翰·凯恩斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/29/YueWen_849769/t6_YueWen_849769.jpg\",\"url\":\"https://weread.qq.com/web/reader/d6632d705cf769d6646fc55\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一卷 引论\",\"date\":\"2020-06-11\"},{\"id\":\"26785321:mark:26785321_100_1002-1091\",\"quote\":\"喜剧调动的是人的感官，悲剧触碰的是人的思想；喜剧描绘人生的表象，悲剧揭示人生的真相；喜剧是人生的偶然，悲剧是人生的必然。\\n\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"答问10 为什么悲剧比喜剧更深刻？\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_100_1885-2104\",\"quote\":\"可是尼采不一样，他不打算接受放弃的人生。他认为真正的悲剧精神恰恰在于，在体悟到了存在的恐怖和荒诞之后，既不是像叔本华那样，选择放弃一切生命的意志，也不是像日神精神那样，借助于理性和光明，用“高贵的单纯和静穆的伟大”去战胜存在的“可怕深渊”和人性的“多愁善感”，而是要更深地投入酒神精神中，在悲剧中去体会一种“形而上的慰藉”。这种形而上的慰藉会让我们深深地体会到“一种极强烈的统一感”，人与自身的统一，人与人之间的统一，以及人与自然的统一。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"答问10 为什么悲剧比喜剧更深刻？\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_100_2579-2637\",\"quote\":\"“总有一天我会如愿以偿。这将是很远的一天，我不能亲眼看到了，那时候人们会打开我的书，我会有读者。我应该为他们写作。”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"答问10 为什么悲剧比喜剧更深刻？\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_1442-1530\",\"quote\":\"回到尼采的语境，他认为，酒神精神所提倡的生命力与创造力，先是遭受到了以苏格拉底为代表的理性主义的压制，而后又被基督教的道德所固化。理性和道德都在对蓬勃生长的生命力say no。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_3067-3122\",\"quote\":\"他们推崇的不是道德意义上的德性（virtue），而是“生命的力量在生活赋予的广阔空间中的卓异表现”，也就是卓越\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_3518-3586\",\"quote\":\"生成和消逝，建设和破坏，对之不可作任何道德评定，它们永远同样无罪，在这世界上仅仅属于艺术家和孩子的游戏。……只有审美的人才能这样看世界。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_3650-3730\",\"quote\":\"潜伏在河中的鳄鱼捕食涉水的角马，从角马的角度看，是毁灭，从鳄鱼的角度看，是创生，这只是生命生生不息、周而复始的一个过程，就像潮起和潮落，无法用对错好坏去评判它。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_3877-3973\",\"quote\":\"也许有人会反驳说：可是鳄鱼捕杀角马的场景真的很残忍啊！对不起，尼采告诉我们，所谓的残忍与血腥，只是你把自我的情感投射其上的结果，所谓的意义和价值，也是如此。所以不要入戏太深，一切都是自然之理。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_4583-4627\",\"quote\":\"这里我只想指出一点：尼采的确不接受人人平等的原则，但他并不是一个种族主义者和反犹主义者。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_4627-4692\",\"quote\":\"他在区分人与人之间的高低贵贱时，更多的不是从种族的角度出发，而是从教育和文化的角度出发，在这个意义上，他更像是一个贵族激进主义者。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_5198-5291\",\"quote\":\"按照现代世界尤其是自由主义的伦理观，同情弱者是尊重生命的体现，但是对尼采来说，同情弱者恰恰是在否定生命。同情会使人失去力量，让痛苦变得富有传染性，甚至会带来“生命和生命能量的整体损失”。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_1015-1093\",\"quote\":\"强调个体，崇尚力量，权力意志，这就是主人道德的精髓。相比之下，奴隶道德则把个人隐身在群体之中，推崇爱与同情，遇到困境的时候垂头丧气，遭遇失败的时候会自我安慰\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_1456-1531\",\"quote\":\"当弱者面对强者的时候，因为无力抵抗就会产生一种怨恨的情绪。这种情绪的最基本特征就是，想要反抗但又深深地体会到自己的无能，于是只好将报复的情绪深埋在心底\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_1935-2030\",\"quote\":\"尼采指出，怨恨之人的精神“喜爱蛰藏的暗角，潜逃的暗道和后门，一切阴匿之物都让他满心感到，这是他的世界，他的安全，他的乐土所在。他擅长沉默，不忘怀，等待，暂时将自己渺小化，暂时地侮辱自己……”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_2171-2271\",\"quote\":\"尼采举过一个名叫“俄罗斯式的宿命论”的例子，因为远征太艰苦，疲惫不堪的俄罗斯士兵就怀着宿命论的想法躺在雪地上，不再动弹，他们把身体的新陈代谢降到最低程度，让自己的意志开始冬眠。这是一种彻底的自我放弃。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_3554-3634\",\"quote\":\"强者（高尚的人）也有怨恨，但是强者与弱者的区别在于，当感受到怨恨的时候，强者会立即表现出来，把怨恨的情绪充分地发作出来、消散开去，因此就不会对自己产生任何的毒害\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_4507-4591\",\"quote\":\"同情者根本不是在帮助别人，而是像歌词所说的那样，就是在帮助自己。所以同情心不仅肤浅而且自私，它给同情者本人带来巨大的心理满足感和优越感：多么好！我是一个富于同情心的人！\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_5754-5835\",\"quote\":\"读尼采，一定要把他的哲学跟他的人生结合在一起读，他的哲学就是他的人生，他的人生就是他的哲学。如果你不能体验他的体验，不能设想他的狂想，那就很难真正进入他的哲学。\\n\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_103_1218-1267\",\"quote\":\"成稿之后，尼采迫不及待地付诸印刷，但是仅仅售出四十本，另外赠送了七本，只有一个人回复说收到了赠书。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"087 上帝死了，超人诞生：尼采的《查拉图斯特拉如是说》\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_103_2975-3025\",\"quote\":\"人类为什么无法忍受这样一个见证人？因为人类犯下太多的罪行，而罪恶是不希望有见证人的，所以必须杀死上帝\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"087 上帝死了，超人诞生：尼采的《查拉图斯特拉如是说》\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_103_3323-3491\",\"quote\":\"上帝死了，就意味着没有彼岸世界，只有此岸世界；没有物自身，只有现象界；没有超越感性、居高临下、说一不二的那个约束者，只有我们这些不知所往不知所终、朝生暮死、及时行乐的偶然存在者。这就好像是老师离开了教室，孩子们突然陷入莫名的狂欢，但是这种狂欢却蕴含着巨大的危机，因为它意味着怎么都行（anything goes），意味着彻底的失序状态。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"087 上帝死了，超人诞生：尼采的《查拉图斯特拉如是说》\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_104_2752-2786\",\"quote\":\"只有超人才能认清自己身上最黑暗最沉重的东西，克服它，战胜它，超越它。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"088 一个人如何成其所是？——与尼采一起生活\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_1001-1091\",\"quote\":\"在他精神失常前的一年中，尼采一口气写下了五本小册子，分别是《偶像的黄昏》、《瓦格纳事件》、《尼采反瓦格纳》、《敌基督者》和《瞧，这个人》——就好像是超新星在归入沉寂之前的最后爆发。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_2901-2945\",\"quote\":\"这些对于健康的人来说，都是理所当然的事情，但是对于体弱多病的人来说，却是可望而不可即的。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_3183-3240\",\"quote\":\"生活是一样贴得太近的东西，它不断地使我们的灵魂受到伤害。一旦感到它的镣铐有片刻的放松，人们便可以体验到隽永的乐趣。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_3498-3649\",\"quote\":\"我们用意志力，用极大的轻蔑力去贬低生活，贬低一切来自生活幻想和幻象帷幕之下的幸福、快乐、温馨、亲近等等一切美好的词汇，在这种大轻蔑中体会另一种力量，一种源自生命底层的力量，它狂飙突进，荡涤一切。于是我们终于把握住生活的本质，我们手指前方，说道：“喏，这就是生活的本来面目，你们这些可怜的被蒙蔽的蝼蚁。”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_3962-4011\",\"quote\":\"从病人的透镜出发去看比较健康的概念和价值，又反过来根据丰富生命的充盈和自信来探视颓废本能的隐秘工作\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_4220-4311\",\"quote\":\"尼采告诉我们，恰恰是从病人的视角出发，才能真正体会和理解什么叫作“健康的概念和价值”，恰恰是通过虚弱和颓废，才能真正地体会和理解什么叫作“生命的充盈和自信”。这是一种自我克服的过程。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_4436-4472\",\"quote\":\"什么是颓废？就是体会到生命的无意义，人生的虚幻感，以及自我的无能为力感。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_1406-1489\",\"quote\":\"尼采提出了两个重要的观点：第一，针对日神精神，提出了酒神精神，认为后者才是古希腊艺术的典范和基础；第二，反对苏格拉底开创的理性主义传统，认为这是现代病症的古希腊根源。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_2110-2198\",\"quote\":\"人们在什么时候能够最自由地“手之舞之，足之蹈之”？当然是在酒醉之后。事实上，古希腊的戏剧就诞生于庆祝酒神狄奥尼索斯的节日狂欢之中。而酒神精神的艺术表现形式就是音乐、舞蹈和戏剧。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_2805-2918\",\"quote\":\"“哲学不是一门特殊的理论学科，而是一种具体的生活方式，是对人和宇宙的总体看法，个体的人据此度过他的一生”。尼采与黑格尔的区别在于，黑格尔用理性和逻辑去追求整体性，而尼采则用情感和意志去实现整体性，这也正是叔本华带给尼采的影响。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_3119-3169\",\"quote\":\"欲求和挣扎是人的全部本质……所以，人从来就是痛苦的……人生是在痛苦和无聊之间像钟摆一样地来回摆动着。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_3972-4094\",\"quote\":\"尼采之所以能够看透苏格拉底，是因为他看透了自己。他与苏格拉底一样，也是一个颓废者，直面人生，强颜欢笑。深受生活磨难的人不是苏格拉底，而是尼采自己。唯一的不同在于，尼采不是悲观主义者，他借助悲剧精神克服了悲观主义，最终克服了颓废这个现代性的病症。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_4171-4215\",\"quote\":\"尼采在他们身上看到了自己的投影，所以当尼采攻击他们的时候，他其实是在进行自我克服和治疗。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_4519-4558\",\"quote\":\"尼采与瓦格纳联手，是为了用艺术代替宗教，在那个贫困的时代拯救岌岌可危的现代精神\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_4742-4797\",\"quote\":\"尼采冷眼旁观整个庆典，发现它与艺术毫无关系，不过是一场“不惜一切代价的娱乐”，一次对“生命贫乏者”的精神喂食。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_5139-5207\",\"quote\":\"尼采与瓦格纳决裂，不仅因为瓦格纳败坏了艺术，更因为瓦格纳选择向基督教投降。《帕西法尔》是瓦格纳创作的最后一部歌剧，其中充斥着基督教的元素\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"184073:mark:184073_1_1008-1116\",\"quote\":\"相对于浩瀚宇宙来说，我们从科学家那里得到的知识实在是太少了；如果安于现状，不去想那些我们还不了解的问题，人们将变得固步自封和麻木。而神学呢？它带给我们的信念是主观的、武断的，对于自己不了解的知识却偏要给它下一个定义。\",\"book\":{\"id\":\"184073\",\"title\":\"西方哲学简史\",\"author\":\"伯兰特·罗素\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/73/184073/t6_184073.jpg\",\"url\":\"https://weread.qq.com/web/reader/3343271052cf09334242116\",\"wordCount\":249307,\"spinePalette\":{\"paper\":\"rgb(7 6 10)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"绪论 \",\"date\":\"2020-06-08\"},{\"id\":\"184073:mark:184073_1_1671-1710\",\"quote\":\"希腊的思想是建立在对国家和宗教的热诚之上的，这种情况一直持续到亚里士多德的时代\",\"book\":{\"id\":\"184073\",\"title\":\"西方哲学简史\",\"author\":\"伯兰特·罗素\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/73/184073/t6_184073.jpg\",\"url\":\"https://weread.qq.com/web/reader/3343271052cf09334242116\",\"wordCount\":249307,\"spinePalette\":{\"paper\":\"rgb(7 6 10)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"绪论 \",\"date\":\"2020-06-08\"},{\"id\":\"184073:mark:184073_1_180-306\",\"quote\":\"哲学是介于神学与科学之间的东西。它与神学的共同之处在于，都包含着人类对未知事物的思考；它与科学也有共同之处，那就是理性地看待事物，而不是一切都遵循权威，无论是哪种权威。我认为，凡是能够得到确切认识的知识都属于科学；凡是不能得到确切认识的知识都属于神学。\",\"book\":{\"id\":\"184073\",\"title\":\"西方哲学简史\",\"author\":\"伯兰特·罗素\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/73/184073/t6_184073.jpg\",\"url\":\"https://weread.qq.com/web/reader/3343271052cf09334242116\",\"wordCount\":249307,\"spinePalette\":{\"paper\":\"rgb(7 6 10)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"绪论 \",\"date\":\"2020-06-08\"},{\"id\":\"184073:mark:184073_1_2036-2070\",\"quote\":\"在这个过程中罗马的哲学并没有起到任何作用，因为罗马根本就没有哲学。 \",\"book\":{\"id\":\"184073\",\"title\":\"西方哲学简史\",\"author\":\"伯兰特·罗素\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/73/184073/t6_184073.jpg\",\"url\":\"https://weread.qq.com/web/reader/3343271052cf09334242116\",\"wordCount\":249307,\"spinePalette\":{\"paper\":\"rgb(7 6 10)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"绪论 \",\"date\":\"2020-06-08\"},{\"id\":\"184073:mark:184073_1_2432-2491\",\"quote\":\"直至1453年君士坦丁堡被攻陷，除了在艺术上增加了一种传统和制定了罗马法典以外，东罗马没有给世界创造更多重要的东西。 \",\"book\":{\"id\":\"184073\",\"title\":\"西方哲学简史\",\"author\":\"伯兰特·罗素\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/73/184073/t6_184073.jpg\",\"url\":\"https://weread.qq.com/web/reader/3343271052cf09334242116\",\"wordCount\":249307,\"spinePalette\":{\"paper\":\"rgb(7 6 10)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"绪论 \",\"date\":\"2020-06-08\"},{\"id\":\"184073:mark:184073_1_308-403\",\"quote\":\"还有一片领域，它既不属于科学范畴，也不属于神学范畴，双方都不承认它，并且还攻击它，这片领域便是哲学。哲学家们最热衷的那些问题，科学根本给不出一个答案；神学家们给出的答案越来越不能让人信服。 \",\"book\":{\"id\":\"184073\",\"title\":\"西方哲学简史\",\"author\":\"伯兰特·罗素\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/73/184073/t6_184073.jpg\",\"url\":\"https://weread.qq.com/web/reader/3343271052cf09334242116\",\"wordCount\":249307,\"spinePalette\":{\"paper\":\"rgb(7 6 10)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"绪论 \",\"date\":\"2020-06-08\"},{\"id\":\"184073:mark:184073_1_880-933\",\"quote\":\"要想了解一个民族或者一个时代，就必须了解它的哲学；当我们试图去做到这一点的时候，我们身上便有了哲学家的影子\",\"book\":{\"id\":\"184073\",\"title\":\"西方哲学简史\",\"author\":\"伯兰特·罗素\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/73/184073/t6_184073.jpg\",\"url\":\"https://weread.qq.com/web/reader/3343271052cf09334242116\",\"wordCount\":249307,\"spinePalette\":{\"paper\":\"rgb(7 6 10)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"绪论 \",\"date\":\"2020-06-08\"},{\"id\":\"31231802:mark:31231802_4_1053-1128\",\"quote\":\"美国和中国是在行动和决策上，最具国际影响力的两个主要国家。但新加坡还是必须尽可能与其他国家建立联系，如欧洲国家、日本、韩国、东南亚国家、印度和中东国家\",\"book\":{\"id\":\"31231802\",\"title\":\"李光耀观天下（精装版）\",\"author\":\"李光耀\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/802/31231802/t6_31231802.jpg\",\"url\":\"https://weread.qq.com/web/reader/59d32f9071dc8f3a59d7271\",\"wordCount\":149975,\"spinePalette\":{\"paper\":\"rgb(11 12 14)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"序\",\"date\":\"2020-06-08\"},{\"id\":\"31231802:mark:31231802_4_1202-1233\",\"quote\":\"无论世界怎么样，新加坡都得去接受它，因为它实在小得无法改变世界\",\"book\":{\"id\":\"31231802\",\"title\":\"李光耀观天下（精装版）\",\"author\":\"李光耀\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/802/31231802/t6_31231802.jpg\",\"url\":\"https://weread.qq.com/web/reader/59d32f9071dc8f3a59d7271\",\"wordCount\":149975,\"spinePalette\":{\"paper\":\"rgb(11 12 14)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"序\",\"date\":\"2020-06-08\"},{\"id\":\"31231802:mark:31231802_4_1338-1407\",\"quote\":\"就新加坡而言，我们的成功故事取决于三大特性：确保这是个让人们生活与工作的最安全国家、平等对待每一个公民，以及确保每一代新加坡人能持续成功。\",\"book\":{\"id\":\"31231802\",\"title\":\"李光耀观天下（精装版）\",\"author\":\"李光耀\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/802/31231802/t6_31231802.jpg\",\"url\":\"https://weread.qq.com/web/reader/59d32f9071dc8f3a59d7271\",\"wordCount\":149975,\"spinePalette\":{\"paper\":\"rgb(11 12 14)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"序\",\"date\":\"2020-06-08\"},{\"id\":\"635722:mark:635722_16_3205-3259\",\"quote\":\"随着乔布斯设计鉴赏力的不断提升，他开始尤其青睐日式风格，还渐渐地和三宅一生及贝聿铭这样的明星人物进行更多接触\",\"book\":{\"id\":\"635722\",\"title\":\"史蒂夫·乔布斯传（修订版）\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/39/YueWen_635722/t6_YueWen_635722.jpg\",\"url\":\"https://weread.qq.com/web/reader/a5132d4059b34aa51b14735\",\"wordCount\":\"$undefined\"},\"chapter\":\"第十二章 设计：大道至简\",\"date\":\"2020-06-07\"},{\"id\":\"635722:mark:635722_16_3310-3359\",\"quote\":\"“我见过的最美的设计，就是京都地区的花园，这一文化的产物深深打动了我，而它们都直接源自佛教禅宗。”\",\"book\":{\"id\":\"635722\",\"title\":\"史蒂夫·乔布斯传（修订版）\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/39/YueWen_635722/t6_YueWen_635722.jpg\",\"url\":\"https://weread.qq.com/web/reader/a5132d4059b34aa51b14735\",\"wordCount\":\"$undefined\"},\"chapter\":\"第十二章 设计：大道至简\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_10889-10913\",\"quote\":\"由于我嗜书成癖，终于使我父亲决定让我做一名印刷工\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_11299-11390\",\"quote\":\"由于认识了几个书商的学徒，我有时候就能借到一本小书，我看书非常小心，很快就能干干净净地归还。书要是晚上借的，第二天一早必须归还，以免被以为丢失或缺货，我往往在自己的屋子里开夜车赶着读\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_12093-12216\",\"quote\":\"有时候我们也打口水仗，我们俩都好争辩，一心想把对方驳倒。对了，这种好争辩的禀性容易演化成一种恶习，因为反驳必然要将这种恶习付诸实践，结果惹得一起的人常常感到极不痛快，因为这样一来，除了把交谈搅黄，在本来可以建立友谊的地方，反而产生了厌恶，甚至敌意\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_12885-13279\",\"quote\":\"大约就在这个时候，我偶然看到了一卷零散的《旁观者》[插图]。是第三卷。以前我从来没有看见过这份报纸。我把它买来，反反复复读了好多遍，真是爱不释手。我认为文笔优美，并希望能够模仿得了。有了这种意图，我便选了几篇文章，写出每个句子的要旨，先搁置几天，然后不看书，试着用到手的贴切的字眼详尽地表达每个要旨，争取像原来表现的一样充分，从而再现原文\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_13347-13467\",\"quote\":\"我发现自己词汇贫乏，或者做不到招之即来，运用自如，我认为要是我坚持写诗，这些缺欠就可以避免，因为为了合律协韵就不断需要用意思相同、长短不一、声音多变的词，这就会逼着我为这些变化而苦苦搜索，而且也会让我把那些变化牢记心头，最后使我完全将它掌握\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_13733-13770\",\"quote\":\"无论读书还是做练习，时间只能定在晚上，下班后或早上上班前；要么就是礼拜天。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_15350-15404\",\"quote\":\"我对这种辩论方法着了迷，便采用了它，丢弃了我那一套贸然反驳和武断论证的做法，拿出一副不耻下问和满腹疑团的样子\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_15803-15846\",\"quote\":\"这种方法我连续使用了几年，渐渐就弃而不用了，仅仅保留了用谦虚谨慎的话表达自己看法的习惯\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_16021-16107\",\"quote\":\"由于交谈的主要目的是提供信息或者获取信息，使人心悦或使人信服，所以我希望善意明达之人不要以武断自负的方式说话，而使行善的力量减弱，原因是用这种方式往往使人反感，容易造成对立\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_16196-16307\",\"quote\":\"要是你希望从别人的知识中获取信息和改进，同时又坚决用目前的观点来表达自己，那么谦虚明达之士由于不爱争辩，也许就听之任之，让你坚持错误，不思悔改好了；如果采取这种态度，你就很难指望让听你讲话的人心悦，诚服，达成你所期望的共识\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_19021-19254\",\"quote\":\"我们报纸上的一篇时政评论——针对的问题我忘了——触怒了议会。[插图]议长发出拘捕令，把我哥哥抓了起来，严加处罚，蹲了一个月的大牢，我估计因为他不肯透露作者姓名。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_20216-20277\",\"quote\":\"一发现我要离开他了，他便使心眼儿不让镇上别的任何印刷所用我，为此东跑西颠，到每一个老板跟前游说，这样一来，谁也不肯给我事做\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_24358-24390\",\"quote\":\"有时候一个人钱少时比钱多时出手更大方，也许是怕被人小瞧的缘故吧。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_24704-24773\",\"quote\":\"于是我沿市场街一直走到第四大街，从我未来的岳父大人里德先生的门前经过；他女儿站在门口看见了我，认为我可是出足了洋相，实际情况肯定也是这样。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_26086-26162\",\"quote\":\"提出几点小小的怀疑，引诱他说明他的全部想法，他依仗什么势力，打算怎么开展业务等等。我站在旁边，听了个一字不漏，立马就看出他们俩一个是老狐狸，一个是嫩雏儿\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_26805-26865\",\"quote\":\"这两个印刷商我发现都不称职。布雷福德没有受过专门培训，又是个白丁；凯默虽然说有点学问，却纯粹是个排字工，对印刷一窍不通。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_28778-28870\",\"quote\":\"我已经离家七个月了，亲友们没有听到我的一点音讯；因为我姐夫还没有回来；也没有写信说过我的情况。我出人意料地露面使全家惊奇不已；不过大家都很高兴看见我，对我表示热烈欢迎，只有我哥哥除外。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_30872-31042\",\"quote\":\"他一直是个克己勤奋的后生；他的学识深受几位牧师和绅士的敬佩，似乎在有生之年大有出人头地的希望：可就在我离家出走的这段日子，他养成了喝酒的习惯；根据他自己的说法，和我听到的别人的议论，我得知他来到纽约后天天都喝得烂醉如泥，而且行为非常古怪。他还赌博，输光了钱，所以我只好替他付店钱，还得支付他去费城的盘缠和在费城的生活费：真是搞得我焦头烂额。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_33285-33337\",\"quote\":\"这么看来，做一个理性的动物倒是一件十分方便的事情，因为人想做一件事，它总能使人找出一个或造出一个理由来。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_33427-33540\",\"quote\":\"我习惯用苏格拉底辩论法跟他周旋，提一些表面上离题万里的问题，然后步步逼进切入正题，往往使他陷入为难和矛盾的境地，引他钻进圈套，最后他变得战战兢兢，令人喷饭，如果不先问一句，你打算由此推定什么呢？就连我最平常的问题也不大愿意回答\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_36094-36150\",\"quote\":\"他说，谁能想到富兰克林居然能有这样不同凡响的表现；有绘声绘影之功，翻江倒海之力，火山喷发之势；甚至更胜原作一筹！\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_38833-38985\",\"quote\":\"发现这都不是总督的信，我大为惊讶。思前想后，反复比较，开始怀疑起他的诚信来了。我找到了朋友德纳姆，把事情的原委一股脑儿端给他。他让我知道了基思的那副德性，说他替我写信，那是绝对不可能的，还说但凡知道他的人对他没有丝毫的信赖，他又笑我异想天开，竟然认为总督会给我信用证，说他就不讲信用，哪有什么信用证给呢。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_39389-39467\",\"quote\":\"身为一个总督，竟然玩这种下三烂的把戏，卑劣地捉弄了一个无知的穷孩子，这叫我们作何感想！他已经养成了这种习惯。谁都想讨好；由于没有什么可给，他就只能给人期望了\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_40553-40686\",\"quote\":\"我很快就在帕默的印刷所找到了工作，这是当时巴托罗缪广场[插图]的一家有名的印刷所；我在这里干了将近一年\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_43492-43629\",\"quote\":\"我便从帕默那里跳槽到了华茨[插图]的印刷所，这个印刷所离林肯律师学院操场不远，规模大一些。在这里我一直干到离开伦敦。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_44192-44275\",\"quote\":\"迎新费就是五先令的酒钱，这是排字工对我的要求。我想这是敲竹杠，因为我在楼下已经缴过了。师傅也这么认为，就说免了。我扛了两三个礼拜，因此被认为是个异类，便给我不少小鞋穿\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_44453-44527\",\"quote\":\"我发现还是乖乖地把这笔钱交了算了，因为我相信，跟自己必须朝夕相处的人交恶是愚蠢透顶的。这样一来，我跟他们相处得就挺不错，而且很快就取得了一定的威望。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_44561-44695\",\"quote\":\"有我做榜样，大部分工人放弃了喝啤酒、吃面包奶酪这种使人昏头昏脑的早餐，因为他们发现跟上我吃邻居家供应的一大碗热腾腾的稀饭，上面撒着胡椒面儿，和着面包渣儿，还有一点儿黄酒，只花一品脱啤酒的钱，也就是一个半便士。这种早餐不仅价钱便宜，而且吃起来舒服，还能使他们的头脑清醒。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_4526-4545\",\"quote\":\"我们这个卑微的家族很早就加入了宗教改革\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_45316-45349\",\"quote\":\"正如她说的，租金便宜，因为她指望有个男人住在家里，可以提供一些保护\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_46197-46542\",\"quote\":\"房间十分干净，没有什么家具，只有一块垫子，一张桌子，上面摆着一个十字架和一本书，有一把让我坐的凳子，壁炉上方是一幅画，画的是圣维罗妮卡展现着一块手帕，上面有基督神奇的血面肖像[插图]，她非常严肃认真地给我做了一番说明。她面色苍白，但从不生病，我将它作为又一个例证说明维持一个人的生命和健康需要的收入微乎其微。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_4712-4909\",\"quote\":\"他们有一部英文《圣经》[插图]，为了把它安安全全地藏起来，它被打开，用几条带子网在一把榫接木凳座板底下的框子里头\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_47538-47692\",\"quote\":\"他原先在布里斯托尔做生意，但生意失败，欠了一屁股的债，还了一部分后就去了美洲。在那里他苦心经营，没过几年，就发了大财。跟我一起回到英国后，便请他的老债主们吃饭，在饭桌上他感谢大家照顾他给予了宽限，当时大家就以为只是请客吃饭，别无指望，谁知第一道菜撤去时，人人发现盘子底下压着一张银行支票，欠债加利息全额付清。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_48621-48674\",\"quote\":\"我就这样在伦敦度过了大约十八个月的时光。大部分时间我勤勤恳恳干自己的本行，除了看戏，买书，自己的开销不大。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_49562-49616\",\"quote\":\"德纳姆先生在清水街开了一家商店，我们把百货陈列出来，我兢兢业业打理生意，学习记账，没有多长时间就成了营销专家\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_49915-50024\",\"quote\":\"凯默也以高薪诱我去经管他的印刷所，这样他就可以腾出手来，更好地打理文具店。我在伦敦时，听他的妻子和她的朋友说他人品很次，所以不喜欢再跟他打交道了。我试图再找个商号办事员的工作；但一时半会还碰不上，便只好又跟凯默订约了。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_50825-50926\",\"quote\":\"凯默竟然用比他过去出的薪金高得多的价码来聘用我，其用心对我而言，很快就昭然若揭了，他要通过我来磨炼这些便宜的生手，一旦我把他们调教好了，既然他们已经有约在先，只能替他卖命，那么没有我，他也能够运作下去了\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_52039-52074\",\"quote\":\"我也制造油墨，我是个库管员，样样都管，总而言之，俨然成了一个万能博士。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_52103-52184\",\"quote\":\"然而，不管我的作用有多大，随着别的人手技术一天比一天强，我的重要性也一天比一天弱了。凯默给我发第二季度的工资时告诉我，他觉得我的工资太多，所以认为我应当减减薪了。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_54617-54642\",\"quote\":\"总而言之，我很快就变成了一个彻头彻尾的自然神论者。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_55298-55407\",\"quote\":\"恶与善是无谓的分野，由于这种东西压根儿就不存在：所以现在它显得不像当初我想的那样是一篇独具慧眼的佳作；因此我怀疑是不是某种谬误会不知不觉地潜入我的论点中去，以至于感染了后来的所有论点，因为这是形而上学的推论中屡见不鲜的\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_55408-55501\",\"quote\":\"我逐渐确信人际关系中的真实、诚信、正直对于人生的幸福至关重要，我写成了决心书（这些仍然保留在我的日记本里），在有生之年时时躬行实践\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_59028-59212\",\"quote\":\"我们这样勤奋苦干，邻居们有目共睹，我们开始赢得了声望和信誉；我还听说商界的夜夜俱乐部有人提起新开张的印刷所，普遍的看法是必死无疑，因为当地已经有了凯默和布雷福德两家印刷所；然而贝尔德博士（多年以后你我在苏格兰他的故乡圣安德鲁斯见过他）则力排众议；因为那个富兰克林的勤奋，他说，是他的同行们望尘莫及的：我离开俱乐部回家时，他还在干活呢；他的邻居还没有起床，他又在工作了。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_60296-60590\",\"quote\":\"我们的报纸一出刊就与本地区以前的任何报纸面貌迥异，字型优美，印刷精良，当时伯内特总督[插图]正与马萨诸塞议会之间争论不休，我对这场争论的激烈评论触动了一些要人。他们便对报纸议论纷纷，没过几个礼拜，这些人都成了我们的订户。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_62914-63167\",\"quote\":\"大约就在这个时段，民众中掀起了一股呼声，要求投放更多的纸币，因为这个地区只有15000英镑纸币，而且这些纸币很快就会被销毁。[插图]富人反对增加纸币，之所以反对，是因为担心它会贬值，就像新英格兰发生过的那样，损害所有债权人的利益\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_63623-63673\",\"quote\":\"我在议会里的朋友认为我有贡献，应当给予奖励，于是让我承印纸币，这是一单能赚钱的生意，帮了我一个大忙。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_6428-6470\",\"quote\":\"我父亲有意把我这第十个儿子当作什一税奉送给教会当差，所以八岁那年，就让我上了文法学校\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_65146-65226\",\"quote\":\"此人心高气傲，一派绅士打扮，生活奢糜，常常出外冶游，到头来债务缠身，事业荒废，这样一来，所有的买卖都不沾他的边了；发现无事可做，便步凯默的后尘，跑到巴巴多斯去了\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_66543-66696\",\"quote\":\"在此期间，青春欲火势不可遏，因此逼我常常与萍水相逢的下流女人厮混，这就难免要花钱，会惹出麻烦，还会染上一种病[插图]，不断危及我的健康，这是我最惧怕的，不过万幸我逃过了这一劫。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_6679-6709\",\"quote\":\"我父亲考虑到有一大家子人要养活，大学教育的花费他可提供不起，\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_67067-67426\",\"quote\":\"然而，尽管困难重重，我们豁出去了，1730年9月1日我娶她为妻。[插图]我们担心的那些麻烦事一件也没有发生，事实证明她是个贤内助，照看店面，帮了我很多忙，我们齐心协力，事业兴旺，互相努力，让对方幸福\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_6746-6768\",\"quote\":\"于是他一改初衷把我从文法学校转到一所写算学校\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_67823-67857\",\"quote\":\"我着手实施第一个具有公益性质的计划，那就是成立一个会员制收费图书馆。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_6888-6916\",\"quote\":\"十岁的时候，我被领回家帮父亲做事情，也就是制造蜡烛和肥皂\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_7214-7235\",\"quote\":\"我提议在那里建造一个码头，好让我们有地方站\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_7913-7979\",\"quote\":\"他把我们的注意力引向生活行为中善良、正义和谨慎之类的表现上，自然就不大留心桌子上的饭菜色香味如何，入时不入时，合口不合口之类的问题了\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_9738-9762\",\"quote\":\"观察优秀工匠操弄自己的工具可成了我的一件赏心乐事\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_4_9968-9990\",\"quote\":\"我自小就喜欢读书，手里有点零钱，总要拿去买书\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"自传\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_6_10756-10817\",\"quote\":\"我开始实行这份自查计划，实行的过程中偶尔会中断几天。我惊讶地发现自己的过错比原先想象的多得多，但也满意地看到它们在日益减少\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"〔第二部〕 生平自述续篇\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_6_11954-12103\",\"quote\":\"总体来讲，虽然我从来没有达到我曾经雄心勃勃要达到的那种完美境界，而且还相去甚远，但我通过努力成为一个比较优秀、比较快乐的人，若不努力我是做不到这一步的；就像有些人临摹字帖，一心要练就一笔好字，尽管他们永远达不到他们希望达到的字帖的那种优秀水准，但通过努力书法大有长进，字写得漂亮清晰，也算说得过去了\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"〔第二部〕 生平自述续篇\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_6_2352-2433\",\"quote\":\"这个图书馆给我提供了勤学苦读、不断改进的途径，为此我每天匀出一两个小时；这样便在某种程度上弥补了我父亲一度想让我接受的高等教育的缺失。读书是我让自己享受的唯一乐趣\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"〔第二部〕 生平自述续篇\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_6_6768-6881\",\"quote\":\"我的意图是把这些美德养成习惯，所以我认为最好不要同时全面开花，分散了注意力，而应当一次专注于一项，等把这一项掌握透了，然后再试下一项，这样循序渐进，直到我把十三项统统做到\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"〔第二部〕 生平自述续篇\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_6_7940-7989\",\"quote\":\"这样第一周我就严防死守，对节制不可有丝毫的触犯，别的美德就顺其自然了。只是每天晚上标出当天的过错。\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"〔第二部〕 生平自述续篇\",\"date\":\"2020-06-07\"},{\"id\":\"906847:mark:906847_7_6337-6404\",\"quote\":\"我们听说先从拉丁文开始，学好了拉丁文再学现代语言就容易多了，因为它们都是从拉丁文衍生出来的；可我们并没有为了易于学会拉丁文而先学希腊文\",\"book\":{\"id\":\"906847\",\"title\":\"富兰克林自传\",\"author\":\"[美]富兰克林\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/847/906847/t6_906847.jpg\",\"url\":\"https://weread.qq.com/web/reader/c8b320d05dd65fc8bb0693a\",\"wordCount\":\"$undefined\"},\"chapter\":\"〔第三部〕\",\"date\":\"2020-06-07\"},{\"id\":\"27256052:mark:27256052_11_4847-4886\",\"quote\":\"金钱会因为你的无知而变得无用，对于不熟悉金钱的人来说，要正确地使用它是很难的。\",\"book\":{\"id\":\"27256052\",\"title\":\"人生十二法则：直面混乱与痛苦\",\"author\":\"乔丹·彼得森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/47/YueWen_27256052/t6_YueWen_27256052.jpg\",\"url\":\"https://weread.qq.com/web/reader/74732e20719fe4f4747f8f4\",\"wordCount\":\"$undefined\"},\"chapter\":\"建立你的自我觉察\",\"date\":\"2020-06-05\"},{\"id\":\"27256052:mark:27256052_11_5208-5269\",\"quote\":\"持续的警惕和过度的反应会消耗宝贵的生理资源。这种反应就是我们所说的压力，它绝不仅仅是心理体验，也是恶劣环境所带来的真实约束\",\"book\":{\"id\":\"27256052\",\"title\":\"人生十二法则：直面混乱与痛苦\",\"author\":\"乔丹·彼得森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/47/YueWen_27256052/t6_YueWen_27256052.jpg\",\"url\":\"https://weread.qq.com/web/reader/74732e20719fe4f4747f8f4\",\"wordCount\":\"$undefined\"},\"chapter\":\"建立你的自我觉察\",\"date\":\"2020-06-05\"},{\"id\":\"27256052:mark:27256052_11_5418-5495\",\"quote\":\"古老的“计算器”甚至会关闭你的免疫系统，将未来的能量和资源消耗在当下的危机处理上。你会因此而变得浮躁又冲动，宁可违背道德，触犯法律，也不放过一时享乐的机会\",\"book\":{\"id\":\"27256052\",\"title\":\"人生十二法则：直面混乱与痛苦\",\"author\":\"乔丹·彼得森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/47/YueWen_27256052/t6_YueWen_27256052.jpg\",\"url\":\"https://weread.qq.com/web/reader/74732e20719fe4f4747f8f4\",\"wordCount\":\"$undefined\"},\"chapter\":\"建立你的自我觉察\",\"date\":\"2020-06-05\"},{\"id\":\"27256052:mark:27256052_11_2191-2203\",\"quote\":\"将大自然浪漫化也是错误的\",\"book\":{\"id\":\"27256052\",\"title\":\"人生十二法则：直面混乱与痛苦\",\"author\":\"乔丹·彼得森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/47/YueWen_27256052/t6_YueWen_27256052.jpg\",\"url\":\"https://weread.qq.com/web/reader/74732e20719fe4f4747f8f4\",\"wordCount\":\"$undefined\"},\"chapter\":\"建立你的自我觉察\",\"date\":\"2020-05-18\"},{\"id\":\"27256052:mark:27256052_11_2502-2521\",\"quote\":\"自然界和其孕育的文化建构是完全分离的。\",\"book\":{\"id\":\"27256052\",\"title\":\"人生十二法则：直面混乱与痛苦\",\"author\":\"乔丹·彼得森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/47/YueWen_27256052/t6_YueWen_27256052.jpg\",\"url\":\"https://weread.qq.com/web/reader/74732e20719fe4f4747f8f4\",\"wordCount\":\"$undefined\"},\"chapter\":\"建立你的自我觉察\",\"date\":\"2020-05-18\"},{\"id\":\"853426:mark:853426_5_11607-11629\",\"quote\":\"稀缺的感觉，取决于可用的资源和我们自身的体验\",\"book\":{\"id\":\"853426\",\"title\":\"稀缺：我们是如何陷入贫穷与忙碌的\",\"author\":\"塞德希尔·穆来纳森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/46/YueWen_853426/t6_YueWen_853426.jpg\",\"url\":\"https://weread.qq.com/web/reader/36b321405d05b236bb0ce7d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_11864-12058\",\"quote\":\"拥有的比需要的少，结果很简单：人们会变得不幸福。我们越是贫穷，就越是买不到什么好东西，大到昂贵的学区房，小到给食物提味的盐和糖；我们越是忙碌，就越享受不到休闲时光，无论是看电视还是与家人欢聚一堂；我们的体重越是超标，就越不敢品尝美食，如此种种。拥有的比需要的少，的确会令人不快，而且会产生其他不良影响，比如我们的健康、安全和受教育水平都会受到影响。稀缺，会导致不满，甚至抗争\",\"book\":{\"id\":\"853426\",\"title\":\"稀缺：我们是如何陷入贫穷与忙碌的\",\"author\":\"塞德希尔·穆来纳森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/46/YueWen_853426/t6_YueWen_853426.jpg\",\"url\":\"https://weread.qq.com/web/reader/36b321405d05b236bb0ce7d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_12618-12650\",\"quote\":\"当稀缺俘获大脑时，我们的注意力就会变得更加集中，做事就会更有效率\",\"book\":{\"id\":\"853426\",\"title\":\"稀缺：我们是如何陷入贫穷与忙碌的\",\"author\":\"塞德希尔·穆来纳森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/46/YueWen_853426/t6_YueWen_853426.jpg\",\"url\":\"https://weread.qq.com/web/reader/36b321405d05b236bb0ce7d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_12871-12962\",\"quote\":\"带宽（bandwidth） 就是心智的容量，包括两种能力，分别为认知能力和执行控制力。稀缺会降低所有这些带
