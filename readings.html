ook\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_5076-5185\",\"quote\":\"我们正身处在一个前所未有的复杂和丰富的时代，面对这个时代，我们需要养成同样复杂和丰富的思考习惯，只有站在思想的高墙上，我们才可能鸟瞰全貌，看清差异和联系，实现面相的转换，明白哪里是沼泽哪里是沟壑，哪里是死路哪里是活路。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_6108-6193\",\"quote\":\"对维特根斯坦来说，解决哲学问题意味着改变旧有的思想方式和生活方式。这种改变的发生，是通过把语词从形而上学的用法重新带回到日常用法。回到语词的日常用法，也就是让一切如其所是\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_6283-6348\",\"quote\":\"维特根斯坦的生活态度也是如此，他对生活做彻底的清算，目的不是要把自己从生活之流中连根拔起，而恰恰是要把自己重新放回特定的生活之流中\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_6997-7046\",\"quote\":\"1951年4月28日，维特根斯坦去世，留给这个世界的最后一句话是：“告诉他们我度过了极好的一生。”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_839-956\",\"quote\":\"生活中我们总会遇到一些讨厌的人，你跟他讲人道的时候他跟你讲法律，你跟他讲法律的时候他跟你讲政策，你跟他讲政策的时候他跟你讲人性，你跟他讲人性的时候他跟你讲奇迹。总之每次你说什么话，他都能把要点转到另一处，这样的人我们称之为“诡辩家”。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_1484-1515\",\"quote\":\"对绝大多数人来说，只有在极其特定的机缘下，才会意识到存在的问题\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_1525-1583\",\"quote\":\"存在的问题“是一种极度绝望的时刻赫然耸现的，在这个时刻，全部事物日益丧失了它们的重量，而所有的意义也变得蔽而不明了”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_1893-1936\",\"quote\":\"海德格尔认为，时至今日，不仅“存在问题尚无答案，甚至连怎么提出这个问题也还茫无头绪”。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_2678-2737\",\"quote\":\"我思”是哲学家在一个非常极端的思想实验中逼问得出的结果，它把自己封锁在我思的边界里，最终导致主体与客体之间的二元对立。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_2876-2981\",\"quote\":\"只有在我们使用锤子的过程中出现了某些岔子，比如锤子头发生了松动，或者使得很不称手的时候，我们才会把注意力放在锤子上面，盯着锤子这个客体——用海德格尔的术语说，此时我们就从“当下上手状态”脱落成为“现成在手状态”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\",\"annotation\":\"存在是一种运动中的状态\"},{\"id\":\"26785321:mark:26785321_112_3614-3624\",\"quote\":\"“外部世界是否存在”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_3760-3816\",\"quote\":\"海德格尔解决了这个经典的怀疑论难题吗？我的判断是并没有，他只是转换了追问的方式和思考的路径，然后消解了这个问题。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_4157-4211\",\"quote\":\"：你是什么，不是什么，是由你自己的选择和行动决定的，不要太早给自己下定义和做总结，因为可能性总是大于现实性。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_4445-4490\",\"quote\":\"好在我们虽然无法决定“存在与否”，但却可以决定“怎样存在”，决定什么是适合做的或值得做的。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_4684-4788\",\"quote\":\"此在被抛入特定的生活世界里，虽然我们可以决定怎样存在，但依然受到特定的价值传统的塑造和规定。在这个意义上，海德格尔并不像萨特那样主张人有绝对的自由，也不主张人有绝对的责任，海德格尔并不是纯粹意义的存在主义者。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_113_2285-2374\",\"quote\":\"常人怎样享乐，我们就怎样享乐；常人对文学艺术怎样阅读怎样判断，我们就怎样阅读怎样判断；竟至常人怎样从‘大众’中抽身，我们也就怎样抽身；常人对什么东西愤怒，我们也就对什么东西愤怒。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"097 人生在世，无非一烦：海德格尔的《存在与时间》（中）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_113_3359-3401\",\"quote\":\"只要此在混迹于常人之中，人云亦云、亦步亦趋，此在就不是本真的自己，而是非本真的自己。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"097 人生在世，无非一烦：海德格尔的《存在与时间》（中）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_113_3596-3644\",\"quote\":\"作为被抛的存在者，此在从一开始就与常人一起，在“非本真的漩涡”中沉浮，常人就是我们，我们就是常人\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"097 人生在世，无非一烦：海德格尔的《存在与时间》（中）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_114_2783-2899\",\"quote\":\"所谓本真的向死存在，就是“先行到死，看清楚了丧失在常人之中的日常存在，不再沉陷于操劳和操持，而是立足于自己的生存筹划种种生存的可能性，面对由畏敞开的威胁而确知它自己，因负重而激起热情，解脱了常人的幻想而更加实际，在向死存在中获得自由\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"098 向死存在：海德格尔的《存在与时间》（下）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_114_681-752\",\"quote\":\"有人说，死亡是人生在世唯一确定的事情，这话乍看起来很有道理，仔细想想却不尽然，因为我们只是听说过或看见过别人的死亡，却从未真正亲历过自己的死亡\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"098 向死存在：海德格尔的《存在与时间》（下）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_114_964-1037\",\"quote\":\"可是对于不死之人，永远等不到老之将至的那一天，可以无限地单曲循环“明日复明日”，所有的事情都在永恒的尺度面前失去了重量，岂不是一件更加恐怖的事情？\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"098 向死存在：海德格尔的《存在与时间》（下）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_4_4202-4258\",\"quote\":\"作为一种职业，哲学并不是性价比最高的职业，但是作为一种生活方式和思考方式，我相信哲学是值得我们用一辈子去实践的。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"序言 让我们一起来一场思想的探险\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_5_1109-1175\",\"quote\":\"非常兴奋地说：“哲学，我知道，就是把白的说成黑的，把黑的说成白的。”现在，我们都知道了，这是诡辩家，不是哲学家，这是政治，不是哲学。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"001 导论一：哲学是什么？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_5_2553-2573\",\"quote\":\"首先它们是反思性的，是对现实和经验的反思\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"001 导论一：哲学是什么？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_5_2710-2741\",\"quote\":\"其次，这类问题基本上是针对最一般性的范畴或者说超级概念提问的。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"001 导论一：哲学是什么？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_5_3195-3219\",\"quote\":\"此类问题的第三个特征——它们都是没有标准答案的。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"001 导论一：哲学是什么？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_5_3727-3840\",\"quote\":\"有人也许会问，既然如此，我们今天为什么还需要读柏拉图、读亚里士多德、读康德和黑格尔？我愿意用以赛亚·伯林的话来回答这个问题，他说：“哲学不是一种累积性的学科，古代那些基本的哲学思想、观点、理论和见解现在仍然是哲学的中心内容。”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"001 导论一：哲学是什么？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_1839-1893\",\"quote\":\"罗素也说：“任何一门科学，只要关于它的知识一旦可能确定，这门科学便不再称为哲学，而变成为一门独立的科学了。”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_2267-2308\",\"quote\":\"“不要轻视观念的影响力，教授在沉静的研究中所培育出来的哲学概念可能摧毁一个文明。”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_2782-2863\",\"quote\":\"因为马克思本人正是通过解释世界来改变世界，如果不是因为他发明了“剥削”、“剩余价值”这些观念，全世界的无产者怎么可能会联合起来去推翻这个旧世界，去建立一个新世界？\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_3474-3493\",\"quote\":\"哲学使我们的心灵虽遭逆顺而安之若泰。\\n\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_3619-3674\",\"quote\":\"哲学的功用，就是教会我们在人生遭遇现实的铁壁的时候，以最软的方式着陆。为了说明这个问题，让我来给你造两个句子：\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_4968-4992\",\"quote\":\"离开人生，哲学是空洞的；离开哲学，人生是盲目的。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_7_1769-1807\",\"quote\":\"法国哲学家笛卡尔也说：“没有任何可靠的迹象，使人能够将清醒与睡梦加以区别。”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"003 导论三：哲学的起源\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_7_1900-1927\",\"quote\":\"罗素指出，虽然“人生就是一场大梦”在逻辑上完全是可能的\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"003 导论三：哲学的起源\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_7_2526-2572\",\"quote\":\"比较“梦的假设”和“常识假设”这两种解释的优劣高下，而标准则是看谁更简单、更系统以及更和谐。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"003 导论三：哲学的起源\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_7_2754-2803\",\"quote\":\"霍金认为，哥白尼系统的真正优势在于，假定太阳处于静止位置的时候，由此推导出来的运动方程要简单得多。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"003 导论三：哲学的起源\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_7_5850-5884\",\"quote\":\"哲学是一个动词而不是一个名词，哲学的本质不在于掌握真理而在于寻找真理\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"003 导论三：哲学的起源\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_1500-1528\",\"quote\":\"无论在生活中还是在哲学里，康德都是一个天性热情冲动的人。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_2120-2133\",\"quote\":\"康德13岁丧母，22岁丧父\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_2588-2617\",\"quote\":\"1732年，康德入读腓特烈中学，这是一段不那么美好的回忆。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_2684-2727\",\"quote\":\"曾经有学者总结说，康德在评价他的中学教育时，最常提到的是以下三个词：虚伪、奴性和傲慢。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_3000-3079\",\"quote\":\"康德认为这种“自我审查”的做法，既是在控制人的身体，也是在控制人的心灵，它不仅无助于培养学生的“批判性和独立性思考能力”，而且会导致“狂热思想以及精神异常”。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_3244-3288\",\"quote\":\"晚年的康德在回忆自己的青春岁月时，曾经不无激愤地认为，自己在当时遭受到了奴隶一般的对待。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_3557-3617\",\"quote\":\"在另外一个意义上，康德的经历也恰恰验证了这样一个道理：启蒙的敌人是最大的启蒙者，正如自由的敌人最好地确证了自由的重要性。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_3876-3945\",\"quote\":\"赫尔德认为康德唯一关心的是真理本身，他毫不在意派系和门户之见，也不喜欢那些亦步亦趋、唯唯诺诺的门生。康德的哲学意在唤醒每一个人独立的思考。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_4160-4222\",\"quote\":\"有趣的是，康德对于打牌却有着非常正面的看法，他认为打牌“可以修身养性，让人情绪稳定，习于容忍克制，因此对道德修养有所影响”。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_4378-4429\",\"quote\":\"康德的身体一直算不上健康，他身高只有1.57米，在欧洲人里绝对称得上矮小瘦弱，可以说是先天不足后天失调\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_4449-4485\",\"quote\":\"他相信，如果想要献身于伟大的事业，就必须有规律地生活，进行严格的自我管理\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_4499-4559\",\"quote\":\"康德认为一个人的品格（character）是在40岁定型的，良好的品格不能建立在感觉之上，而必须永远以理性的准则作为基础\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_4645-4710\",\"quote\":\"从40岁开始，康德的生活准则已经从“美学”转向了“道德”，他不再过一种审美的生活、感性的生活，而开始过一种道德的生活、理性的生活。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_5035-5137\",\"quote\":\"当时有一个学生由于读不懂康德的著作而发了疯，耶拿大学有两个学生为此决斗，因为其中一个学生羞辱另一个人根本没读懂《纯粹理性批判》，认为后者必须花30年的时间才可能有所了解，然后再花30年的时间才有资格评论。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_5777-5843\",\"quote\":\"我们的责任不是创作书本，而是制作人格；我们要赢得的，不是战役和疆土，而是行为的秩序与安宁。我们伟大而荣耀的杰作是一种合宜的生活方式。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_949-988\",\"quote\":\"描述伊曼纽尔·康德生平的历史是一个极端困难的差事，因为他既没有生活也没有历史。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_2614-2724\",\"quote\":\"从时代大背景来说，当时占据主流地位的道德哲学是效益主义的伦理学，效益主义者是典型的后果论者，他们认为人的本性就是趋乐避苦、趋利避害，既然人类行为的目的就是尽可能多地增进幸福，那么幸福总量最大的行为也就是道德价值最高的行为\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_3005-3082\",\"quote\":\"自然法则属于理论理性的认知领域，是知性（understanding）为自然立法；而道德法则属于实践理性的实践领域，是理性（reason）为自身确立的法则。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_3146-3188\",\"quote\":\"自然法则是人“不得不”服从的法则，它的具体表现形式为以“是”（is）为系词的判断句，\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_3216-3261\",\"quote\":\"道德法则是人“应该”服从但却不一定服从的法则，它是由“应该”（ought）联结起来的命令式\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_3605-3658\",\"quote\":\"我在网上看到一个健身App的广告词——“自律给我自由”，顿时眼前一亮，因为这正是康德道德哲学的核心要义所在\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_3659-3710\",\"quote\":\"“他律性”意味着强迫性，哪怕外在的要求最终促进了你的利益，依旧是对个人自主性的一种压制，它与自由无关。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_4019-4053\",\"quote\":\"康德提出了三条高度形式化的原则，分别是普遍化原则、目的原则和自律原则\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_4462-4552\",\"quote\":\"康德道德哲学真正的魅力在于，他认为道德法则是纯粹实践理性选择的对象。这意味着道德法则不再是上帝赠予人类的礼物，也不再是客观的、自然的价值，道德法则不是被人们发现的，而是人们发明的。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_4643-4775\",\"quote\":\"康德反对这个观点，认为道德法是被人类理性建构出来的，在建构的过程中，需要满足两个标准：第一，这些法则是被所有人所接受的（beacceptable to all）；第二，这些法则具有公共性和公开性（public）。罗尔斯认为这两条标准正是“社会契约论”的典型特征。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_9_2120-2195\",\"quote\":\"我们享受着触觉的、口舌的、视觉的舒适，却终日在堵塞的道路上奔波，在工作职责和家庭责任的轮番轰炸下疲于奔命，即使有一点仅剩的时间也被压榨出来“投资未来”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"004 希腊精神：雅典的自由vs.斯巴达的纪律\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_9_2575-2662\",\"quote\":\"，school本义就是“度过闲暇之地”，在这里我们充分利用闲暇的时光去追求和享受思想自由与言论自由带来的乐趣，而不是晃晃悠悠，“我喜欢”、“我爱”意义上的无所事事和放任自流。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"004 希腊精神：雅典的自由vs.斯巴达的纪律\",\"date\":\"2020-04-18\"},{\"id\":\"910669:mark:910669_8_3783-3910\",\"quote\":\"假如他为了增高声名起计而在家里造一间绘画陈列室时，他把选画的事完全交托给专家；他从画上所得的乐趣并非是观赏之乐，而是旁的富翁不复能占有这些图画之乐。关于音乐，碰到这富翁是犹太人的话，那他可能有真正的欣赏；否则他在这方面的无知，正如他在旁的艺术方面一模一样\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"三 竞争\",\"date\":\"2020-04-18\"},{\"id\":\"910669:mark:910669_8_4213-4283\",\"quote\":\"读书俱乐部从未把《哈姆雷德》或《李尔王》列入“每月选书”之内，也从没一个月显得需要认识但丁。因此她们的读物全是平庸的现代作品而永远没有名著。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"三 竞争\",\"date\":\"2020-04-18\"},{\"id\":\"910669:mark:910669_8_4382-4412\",\"quote\":\"现代生活所以如是偏重于竞争，实在和文化水准的普遍的低落有关，\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"三 竞争\",\"date\":\"2020-04-18\"},{\"id\":\"910669:mark:910669_8_4878-4938\",\"quote\":\"病根是一般人所公认的人生哲学，以为人生是搏斗，是竞争，尊敬是属于胜利者的。这种观点使人牺牲了理性和思悟，去过度的培养意志\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"三 竞争\",\"date\":\"2020-04-18\"},{\"id\":\"910669:mark:910669_8_5181-5241\",\"quote\":\"我们现代的恐龙也在自杀。平均而论，他们之中每对夫妇所生的儿女不到两个；他们对于人生并没有相当的乐趣可使他们愿望生男育女。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"三 竞争\",\"date\":\"2020-04-18\"},{\"id\":\"23723810:mark:23723810_24_1095-1124\",\"quote\":\"但是如果我们的主题是要研究战争，就用不着拿这些小说来读了。\",\"book\":{\"id\":\"23723810\",\"title\":\"如何阅读一本书\",\"author\":\"莫提默·艾德勒 查尔斯·范多伦\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/810/23723810/t6_23723810.jpg\",\"url\":\"https://weread.qq.com/web/reader/272326407169ff22272934f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第四篇 阅读的最终目标\",\"date\":\"2020-04-17\"},{\"id\":\"23723810:mark:23723810_24_974-997\",\"quote\":\"在这两个故事中，战争只是提供了一个环境或背景，\",\"book\":{\"id\":\"23723810\",\"title\":\"如何阅读一本书\",\"author\":\"莫提默·艾德勒 查尔斯·范多伦\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/810/23723810/t6_23723810.jpg\",\"url\":\"https://weread.qq.com/web/reader/272326407169ff22272934f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第四篇 阅读的最终目标\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_1568-1715\",\"quote\":\"有意思的是，即使对于自己的哲学天赋，维特根斯坦也始终抱有怀疑。有时候，他会显得非常傲慢，比如在1920年代写完《逻辑哲学论》之后，他认为所有的哲学问题已经解决，于是跑到奥地利的一个乡村小学去教书；但是更多的时候，他是在自我怀疑，他在剑桥授课的时候，经常沮丧地对学生哀叹道：你们的老师真是太蠢了。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_2074-2153\",\"quote\":\"维特根斯坦径直找到罗素，开门见山地问：“你看我是不是一个十足的白痴？”维特根斯坦继续说：“如果我是，我就去当一个飞艇驾驶员，但如果我不是，我将成为一个哲学家。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_2835-2853\",\"quote\":\"如果撒谎对自己有利，为什么要说实话？\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_3020-3067\",\"quote\":\"其中，最让维特根斯坦心动的莫过于这句话：“逻辑与伦理根本上是一回事，它们无非是对自己的责任。”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_3087-3171\",\"quote\":\"什么叫“对自己的责任”？就是在自己的身上发掘和绽放天才的因子。什么是天才？就是“具备最强、最清澈的明确和清晰”，在物质上尽可能简朴地生活，但在精神生活中则要完全地发展。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_3344-3366\",\"quote\":\"就改善你自己好了，那是你为改善世界能做的一切\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_3721-3803\",\"quote\":\"维特根斯坦很快发现自己极难与来自底层的士兵相处，他在日记里抱怨自己“几乎总是被恨我的人包围着”，这些人“恶毒”又“无情”，“几乎不可能在他们中找到一丝人性的痕迹”。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_4079-4141\",\"quote\":\"维特根斯坦说：“我并不害怕被击中，只是害怕不能像样地完成我的责任。”什么责任？当然是在自己的身上发掘和绽放天才的因子的责任。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_5935-6017\",\"quote\":\"，对他来说，人生就是一场彻底的自我清算，一场与自己的本性进行的战斗。终其一生，他一直在努力承担起成就其天赋的责任，一直在与自身的褊狭、软弱、伪善及绝望做永恒的斗争。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_6095-6169\",\"quote\":\"在评价维特根斯坦的一生时，蒙克也用了类似的一句话，他说：维特根斯坦总体人生态度的核心，就是成为“自己之所是”，这意味着“真实于自己是不容违背的责任”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_106_6084-6192\",\"quote\":\"的结论是：“简单对象的存在是一种先天的逻辑的必然性。”这话实在有些让人费解，这么说吧，简单对象在维特根斯坦这里不是物理意义上的不可还原之点，也就是说，它不是分子、原子这样的物理的点，而是逻辑分析意义上的不可还原之点。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"090 对于不可说的东西我们必须保持沉默：维特根斯坦的《逻辑哲学论》\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_106_7060-7171\",\"quote\":\"在这个意义上我们甚至可以说，《逻辑哲学论》并非一本关于逻辑的著作，而是一本关于罪及与之相关的伦理、美、生活的意义的著作。虽然维特根斯坦谈论最多的是逻辑，但逻辑只是梯子，真正重要的东西在楼上，一旦登上了楼，就可以撤掉梯子了。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"090 对于不可说的东西我们必须保持沉默：维特根斯坦的《逻辑哲学论》\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_107_2092-2162\",\"quote\":\"哪些命题既不是分析命题也不是综合命题，既无法在实际中证实也无法在原则上证实？没错，就是传统形而上学的命题，比如上一讲中提到的黑格尔的那个句子\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"091 完美但不适合人居住的概念大厦：维特根斯坦反对维特根斯坦\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_107_2171-2222\",\"quote\":\"，逻辑实证主义者喊出了“反对形而上学”的口号，因为形而上学的命题在他们看来都是一些毫无意义的胡言乱语。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"091 完美但不适合人居住的概念大厦：维特根斯坦反对维特根斯坦\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_108_1042-1085\",\"quote\":\"在西方哲学史上，以今日之是否定昨日之非，以今日之我反对昨日之我，维特根斯坦当属第一人。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"092 我将教会你们差异：奥古斯丁图画到底错在哪里？\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_108_2584-2631\",\"quote\":\"命名，尤其是给孩子命名，对于很多父母来说是一件大事，我们深信名称能够预示或者影响一个人的命运。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"092 我将教会你们差异：奥古斯丁图画到底错在哪里？\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_108_3480-3531\",\"quote\":\"：语词除了指称对象，还能做些什么呢？把奥古斯丁图画当成是人类语言本质的理解，究竟会导致什么样的问题呢？\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"092 我将教会你们差异：奥古斯丁图画到底错在哪里？\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_108_4027-4133\",\"quote\":\"在现实生活中我们用语言做很多的事情，它绝对不像前期维特根斯坦认为的那样，只是像镜子一样在反映（reflect）这个世界。语言和我们的生活交织在一起，我们使用语言，就像使用工具一样对这个世界做出反应（react）。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"092 我将教会你们差异：奥古斯丁图画到底错在哪里？\",\"date\":\"2020-04-17\"},{\"id\":\"910669:mark:910669_8_2032-2092\",\"quote\":\"美国事业家的宗教与光荣是多多的赚钱；所以他象印度寡妇一样，很乐意的忍受苦恼。这种人若要过得快乐一些的话，先得改变他的宗教\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"三 竞争\",\"date\":\"2020-04-17\"},{\"id\":\"910669:mark:910669_8_2501-2547\",\"quote\":\"一个事业家的焦虑内，常有恐惧破产的后果的成分，这恐惧虽不合理，却是真切的。这一点我们应该承认\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"三 竞争\",\"date\":\"2020-04-17\"},{\"id\":\"910669:mark:910669_8_2841-2870\",\"quote\":\"过于重视竞争的成功，把它当作幸福的主源：这就种下了烦恼之根\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"三 竞争\",\"date\":\"2020-04-17\"},{\"id\":\"910669:mark:910669_8_2960-3004\",\"quote\":\"我坚持：成功只能为造成幸福的一分子，倘牺牲了一切其余的分子去赢取这一分子，代价就太高了。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"三 竞争\",\"date\":\"2020-04-17\"},{\"id\":\"910669:mark:910669_8_819-877\",\"quote\":\"所以一般所谓的生活的斗争，实际是成功的斗争。他们从事战斗时所惧怕的，并非下一天没有早餐吃，而是不能耀武扬威盖过邻人。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"三 竞争\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_4_1775-1823\",\"quote\":\"难以想象，除了中国还有哪一个国家的现代领导人会借用千年之前战役的战略方针做出一项牵动全国的决定。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_4_2230-2300\",\"quote\":\"虽然中国历经劫难，有时政治衰微长达数百年之久，但中国传统的宇宙观始终没有泯灭。即使在贫弱分裂时期，它的中心地位仍然是检验地区合法性的试金石。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_5_1548-1575\",\"quote\":\"在历史意识中，中国是一个只需复原，而无须创建的既有国家\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一章 中国的独特性\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_5_2849-2948\",\"quote\":\"随着分封的诸侯从自治渐渐走向独立，周朝逐渐解体，陷入了长达250年的动乱，史称战国时期（公元前475～公元前221年），相当于西方从1648年的《威斯特伐利亚和约》签订到第二次世界大战结束这段时期。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一章 中国的独特性\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_6_1683-1821\",\"quote\":\"除了为天朝扬威这一抽象成果外，郑和没有为中国攫取领土或资源，充其量不过是较早地运用中国的“软实力”[插图]，为中国的商人创造了良好条件。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"中国的强盛时期\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_6_1913-1997\",\"quote\":\"。虽然中国的商人继续沿着郑和昔日航行过的海路往来穿梭，但中国的航海能力却日益衰微，以至于中国南部沿海地区面临海盗侵扰时，明朝的统治者竟想强迫沿海居民向内陆迁移10英里。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"中国的强盛时期\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_6_2081-2114\",\"quote\":\"中国的光荣孤立在人类历史上独一无二，酝酿了一种独特的中国自我意识。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"中国的强盛时期\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_6_2707-2811\",\"quote\":\"中国与周边国家的疆界与其说是政治和领土的分界线，不如说是文化差异的分水岭。中国文化的辐射圈涵盖整个东亚。美国政治学家白鲁恂（Lucian Pye）有一句名言：近代中国依然是“一个自诩为民族国家的文明社会”。[插图]\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"中国的强盛时期\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_6_4837-4889\",\"quote\":\"毋庸置疑，这是世界上已知的最美丽、人口最密集、最繁华的王国。中华帝国不亚于一个统一在同一王朝之下的欧洲。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"中国的强盛时期\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_7_2290-2302\",\"quote\":\"皇帝位于中国等级秩序之巅\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"儒家学说\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_7_2476-2512\",\"quote\":\"皇帝扮演的第二个抽象角色是他作为“天子”的地位，调和天、地、人之间的关系\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"儒家学说\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_7_612-664\",\"quote\":\"1000年来中国得以延续至今，主要靠的是中国平民百姓和士大夫信奉的一整套价值观，而不是靠历代皇帝的镇压。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"儒家学说\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_1023-1074\",\"quote\":\"但它从未宣扬过美国式的普世观并借此在世界各地传播自己的一套价值观，而是仅把注意力放在驾驭近邻的蛮夷上。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_1362-1391\",\"quote\":\"中国的皇帝认为，试图对不幸远离中国的国家施加影响是不现实的\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\",\"annotation\":\"“不幸”远离中国的国家\"},{\"id\":\"914582:mark:914582_8_1663-1707\",\"quote\":\"在中国官方记载中，外国使者觐见皇帝不是为了谈判或谈国事，而是“前来领受圣上的文明教化”。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_3346-3445\",\"quote\":\"在西方人的脑海里，长城是中国的主要象征，而长城也恰是中国根本弱点的体现，它在抵御外敌方面几乎没起什么作用。中国的政治家靠的是运用丰富的外交和经济手段，诱使中国潜在的外国敌手与它结成比较容易驾驭的关系\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_4180-4264\",\"quote\":\"治夷方针在中国官员的思维中根深蒂固，以致19世纪大批欧洲“蛮夷”抵达中国沿海地带时，中国官员讲述眼前威胁所用的语言与前朝官员如出一辙：要“以夷制夷”，直到他们受到安抚。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\",\"annotation\":\"原来列强瓜分的局面是自找的？\"},{\"id\":\"914582:mark:914582_8_4859-4919\",\"quote\":\"中国强盛时，其外交体现为在意识形态上捍卫帝国权力的合理性；衰微时，外交则用来掩盖其弱点，帮助中国利用彼此争斗的各种势力。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_5226-5391\",\"quote\":\"当异族君主赢得战争时，中国的官僚阶层会随之归顺，同时又游说征服者，他们刚刚征服的中国疆土幅员辽阔，文化独特，只能以中国人的方式、中国的语言和现有的中国官僚机构来统治。征服者一代代逐渐被同化到他们当初试图控制的秩序中。最终，他们的老家，即发动侵略的起始点，成了中国的一部分。征服者自己开始追求传统的中国国家利益——征服者反被征服。[插图]\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\",\"annotation\":\"中国与其说是一个国家，不如说是一种文明。政权都有其周期，但文明却延绵不绝。每个王朝都有衰颓的时候，但是中华文明仿佛具备极强的张力与包容性，打破武力征服者的文化外壳，并同化之。\"},{\"id\":\"914582:mark:914582_8_696-781\",\"quote\":\"近代西方的国际关系观念产生于16～17世纪。当时欧洲的中世纪制度解体，产生了一批实力不相上下的国家。罗马天主教也分裂成为形形色色的教派。均势外交不是一种选择，而是必然结果\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_886-918\",\"quote\":\"中国与西方形成鲜明对比，它从未长期地与另一国在平等的基础上交往过\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_9_2716-2754\",\"quote\":\"即使在今天，《孙子兵法》一书读起来依然没有丝毫过时感，令人颇感孙子思想之深邃\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_9_2775-2812\",\"quote\":\"甚至可以说，美国在亚洲的几场战争中受挫，一个重要原因就是违背了孙子的规诫。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_9_3051-3086\",\"quote\":\"西方战略家通过打胜仗检验自己的理论，孙子则通过不战而胜检验自己的理论。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\",\"annotation\":\"中国的战争是为了和平，正所谓“止戈为武”\"},{\"id\":\"914582:mark:914582_9_6151-6240\",\"quote\":\"西方人认为，历史是走向近代化的过程，是战胜邪恶与落后的过程。而中国人的历史观强调的是衰落与复兴的周期，在这一过程中，人可以认识自然与世界，却不能完全主宰，最佳结果是与之融为一体。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\",\"annotation\":\"只能说，西方人觉醒得太晚，太天真\"},{\"id\":\"914582:mark:914582_9_660-705\",\"quote\":\"西方传统推崇决战决胜，强调英雄壮举，而中国的理念强调巧用计谋及迂回策略，耐心累积相对优势。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\",\"annotation\":\"或许“韬光养晦”不是中国的权宜之计，而是终极策略😂\"},{\"id\":\"914582:mark:914582_9_6928-7011\",\"quote\":\"亚洲国家宏大的政治结构缺乏挣脱陆地束缚、走向海洋的能力，尽管它们自己濒临大海，比如中国。在它们眼里，海洋意味着极限，意味着陆地的终结。它们从未用积极的眼光审视过海洋。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\"},{\"id\":\"910669:mark:910669_7_10553-10599\",\"quote\":\"个“个人”的死，为我们早已失去宇宙性，因为我们不但在外表上，而且在内心里已经变为民主主义者了\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\"},{\"id\":\"910669:mark:910669_7_10957-11061\",\"quote\":\"对于那些老觉得世界上无事可为而仿徨的优秀青年，我要说丢开写作，竭力想法不要动笔。进入世界，做一个海盗也好，做一个婆罗洲上的王也好，做一个苏俄的劳动者也好；去过一种生活，使低级的生理需求几乎占去你全部的精力。”\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\",\"annotation\":\"在事上磨练\"},{\"id\":\"910669:mark:910669_7_2533-2581\",\"quote\":\"我自己常有“万事皆空”的心境；但我摆脱这心境时，并非靠了什么哲学，而是靠了对于行动感到强烈的需要\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\"},{\"id\":\"910669:mark:910669_7_2683-2778\",\"quote\":\"空虚之感是因为天然的需要太容易满足而产生的。人这个动物，正和别的动物一样，宜于作相当的生存斗争，万一人类凭了大宗的财富，毫不费力地满足了他所有的欲望时，幸福的要素会跟着努力一块儿向他告别的。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\",\"annotation\":\"生命不息，折腾不止！人应当有欲望，否则容易空虚\"},{\"id\":\"910669:mark:910669_7_3901-3938\",\"quote\":\"没有新的事情令人烦闷，有了新的事情同样令人烦闷：可知失望的真原因并不在此。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\",\"annotation\":\"互联网与传统媒介相比，糟糕之处在于使欲望太容易产生满足，从而迅速产生空虚感。愉悦之后，空虚伴随而来\\n\\n互联网并没有让人快乐，它的出现只是满足了过去的需求，但却催生了很多新的欲望\"},{\"id\":\"910669:mark:910669_7_4402-4440\",\"quote\":\"瞻望未来而把“现在”的整个意义放在它所能带来的“未来”上面：这种习惯是有害的\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\"},{\"id\":\"910669:mark:910669_7_4565-4612\",\"quote\":\"倘我得永远活下去，人生的欢乐临了倒势必要变得乏味。唯其因为人生有限，人生的乐趣才永远显得新鲜。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\",\"annotation\":\"西西弗斯会作何感想？对他而言，生命无休止，推巨石的工作也没有尽头，他快乐吗？他有欲望吗？什么让他坚持把无意义的工作做下去？如果直接躺倒，又意味着什么？\\n\\n如果永生的欲望都能够得到满足，那还有什么欲望是需要去追求的呢？无欲无求的生活，又怎么会有惊喜和悲伤呢？\"},{\"id\":\"910669:mark:910669_7_6209-6243\",\"quote\":\"我从不相信这种悲观主义有什么形而上的原因。原因只是战争、贫穷与暴行。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\"},{\"id\":\"910669:mark:910669_7_6509-6543\",\"quote\":\"我们对于一个无神的宇宙，比他们更觉习惯，但我们尚未习惯一个无爱的宇宙\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\"},{\"id\":\"910669:mark:910669_7_8821-8887\",\"quote\":\"爱情不但是欢乐之源，并且短少了它还是痛苦之根。第二，爱情之应受重视，因为它增进一切最美妙的享受，例如音乐，山巅的日出，海上的月夜等。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\"},{\"id\":\"910669:mark:910669_7_8937-8991\",\"quote\":\"爱情能戳破“自我”这个坚厚的甲壳，因为它是生物合作的一种，在这合作中间，双方都需要感情来完成对方本能的目标。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\"},{\"id\":\"910669:mark:910669_7_9191-9302\",\"quote\":\"有赖于合作，而且自然赋予我们——固然很不完美——本能的器官，合作所不可或缺的“友谊”就从这本能里肇始的。爱情是导向合作的最原始最普通的形式，凡是强烈地经验过爱情的人，断不愿接受那宣称人之至善和他所爱者的至善不相关涉的哲学。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\"},{\"id\":\"910669:review:6166943_7gDWxmuds\",\"quote\":\"智慧之士可能在环境容许的范围内尽量快乐，倘他发觉对宇宙的冥想使他有超过某程度的痛苦时，他会把冥想移转到别处去。\",\"annotation\":\"人能够承受和感觉到的痛苦与快乐都是有限度的，痛苦与快乐并不是我们坚持做一件事情的动力\",\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250}},{\"id\":\"910669:review:6166943_7gDWYvDZP\",\"quote\":\"现在的人不再读古代的作品，算是文人的运气，否则再写新书一定要被读者认为空虚之至了\",\"annotation\":\"好像古人早已经把人类智慧发掘了，只不过现代人并不知道这一点\",\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250}},{\"id\":\"910669:review:6166943_7gDXnxKfu\",\"quote\":\"如果这是一个赋有哲学气分的人，他就将断言人生在本质上是苦恼的，既然一切欲望都能实现的人仍然是抑郁不欢。\",\"annotation\":\"天才之为责任：穷尽所能，不辜负这一身天赋\",\"chapter\":\"二 浪漫底克的忧郁\",\"date\":\"2020-04-16\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250}},{\"id\":\"914582:mark:914582_48_1062-1114\",\"quote\":\"这位大使不得不接受了一项痛苦的任务：向台湾方面解释，今后美国要把中国政策的重点从台北移向北京。尼克松说：\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"尼克松和周恩来的对话\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_48_1601-1635\",\"quote\":\"的意思是，要是把8亿中国人放到一个不错的制度之下，他们就能领导全世界\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"尼克松和周恩来的对话\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_48_2524-2548\",\"quote\":\"尼克松建议把外交政策建立在双方利益互惠的基础之上\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"尼克松和周恩来的对话\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_48_3268-3325\",\"quote\":\"尼克松提出即使在大部分美军撤出越南之后，也还要维持美国在亚洲的长期作用。不寻常之处在于，他声称这样做符合双方利益。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"尼克松和周恩来的对话\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_48_3638-3678\",\"quote\":\"我们的话得这么说：“美国威胁到谁了？你倒说说看，你要谁来取代美国，起到这个作用？\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"尼克松和周恩来的对话\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_1282-1329\",\"quote\":\"我们出了机场以后，沿途处处可见“打倒美帝国主义及其走狗”的标语口号，其中有一些还是用英文写的。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_1454-1482\",\"quote\":\"他特意让我注意墙上一条英文标语：“亚非乒乓球赛欢迎您。”\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_1528-1583\",\"quote\":\"周恩来似乎是随口说道，我们应对中国观其行，而不是只听它“放空炮”——几个月后，我们又从毛泽东口中听到了这个词。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_1911-1937\",\"quote\":\"毛泽东的一生都认为和平是斗出来的，和平本身不是目的。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_2172-2263\",\"quote\":\"周恩来拿出的公报草案是遵照毛泽东的指示写的，草案坚定地阐述了中国立场。其中，我们的立场是几页空白，周恩来认为我们的语气也会同样强硬，当然立场是截然相反的。公报的最后一部分是共同立场。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_3724-3940\",\"quote\":\"五项原则是：重申一个中国的政策；声明美国不支持台湾岛内的独立运动；美国不鼓励日本插手台湾问题（考虑到历史原因，这是中国特别关注的问题）；支持以和平方式解决中国大陆和台湾的问题；支持继续推动正常化。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_4030-4053\",\"quote\":\"周恩来回答说，双方都有“困难”，“不设时限”。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_4867-4926\",\"quote\":\"整个过程中，美国阐明了和平解决的重要性，中国则坚称必须最终统一。各方都实行了克制，力争避免跟对方展开意志或力量的较量。\",\"book\":{\"id\":\"914582\",\"title\":\"论中国\",\"author\":\"亨利·基辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_914582/t6_YueWen_914582.jpg\",\"url\":\"https://weread.qq.com/web/reader/304323205df496304babec5\",\"wordCount\":\"$undefined\"},\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"932993:mark:932993_6_10304-10424\",\"quote\":\"童年的大部分时候,大家都认为他是这一胞卓异的孩子里较迟钝的一个。他未显出早熟的音乐、艺术或文学才能,实际上甚至到四岁才开口说话。他缺少家庭其他男性成员身上标志性的反叛和任性,而是很早就投入到父亲想灌输给他哥哥却未果的实际技能和技术兴趣上去了\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-16\"},{\"id\":\"932993:mark:932993_6_11464-11521\",\"quote\":\"日后他强调自己童年的不快乐,但在家人的印象里他是个满意快活的男孩子。这一反差无疑是前述他少年时反思诚实的症结所在。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-16\"},{\"id\":\"932993:mark:932993_6_12450-12576\",\"quote\":\"事实上希特勒是维特根斯坦在那儿的同辈,而且(如果《我的奋斗》可信)正是这所学校的历史老师利奥波德·波奇第一次教希特勒把哈布斯堡帝国看做一个“堕落的王朝”,教他分辨忠于哈布斯堡的绝望的王朝爱国主义和(对希特勒来说)更动人的泛日耳曼运动的民粹主义的国家主义\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-16\"},{\"id\":\"932993:mark:932993_6_5096-5211\",\"quote\":\"卡尔和利奥波尔蒂勒·维特根斯坦夫妇把他俩的八个孩子按天主教信仰施洗,照奥地利上等布尔乔亚认可和尊敬的成员抚养。卡尔·维特根斯坦甚至有机会进入高贵阶层,但他拒绝在名字中加进表示贵族的“von”,他觉得人们把这种举动视作暴发户的标志。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-16\"},{\"id\":\"932993:mark:932993_6_6629-6896\",\"quote\":\"世纪末维也纳是“研究世界毁灭的试验场”——它是犹太复国主义和纳粹主义的共同出生地,是弗洛伊德建立心理分析的地方,是克里姆特、谢勒和柯柯什卡开创艺术领域中“青春风格”运动￼的地方,是勋伯格建立无调性音乐的地方,是阿道夫·鲁斯引入十足功能性、无装饰的建筑风格(现代建筑物的标志)的地方。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-16\"},{\"id\":\"932993:mark:932993_6_7951-8051\",\"quote\":\"真正代表的是一股对奥匈帝国影响出奇小的力量——形而上学上是唯物主义的、政治上是自由主义的侵略性资本主义企业家。要是在英国、德国或者——也许尤其在——美国,他会被视为时代之子。在奥地利他则身处主流之外。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-16\"},{\"id\":\"910669:mark:910669_20_2762-2855\",\"quote\":\"譬如你发见实现胜利的捷径是去侮辱某个外国。倘使你的思想领域以现在为限，倘使你习染着效率至上的学说，你就会釆取这等可疑的手段。由于这些手段，你眼前的计划是胜利了，但将来的后果可能非常悲惨。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一五 闲情\",\"date\":\"2020-04-15\",\"annotation\":\"一战之后对德国的清算，看成这种短视的典型，最终酿成大祸\"},{\"id\":\"910669:mark:910669_20_3382-3515\",\"quote\":\"我将使青年清清楚楚的知道过去，清清楚楚的觉察人类的将来极可能远比他的过去为长久，深深的意识到地球的渺小，和在地球上的生活只是一件暂时的细故；在提供这些事实使他们确知个人的无足重轻以外，同时我更将提出另一组事实，使青年的头脑感受一种印象，领会到个人能够达到的那种伟大。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一五 闲情\",\"date\":\"2020-04-15\",\"annotation\":\"许倬云：全世界人类曾经走过的路，都算我走过的路\"},{\"id\":\"910669:mark:910669_20_3831-3893\",\"quote\":\"摆脱了为环境奴使的人所怀有的恐惧之后，他将体验到一种深邃的欢乐，尽管他外表的生活变化无定，他心灵深处永远不失为一个幸福的人。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一五 闲情\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_20_4278-4341\",\"quote\":\"悲哀是兔不了的，应当在意料之内的，但我们当竭尽所能加以限制。某些人在患难之中榨取最后一滴的苦恼，实际不过是满足他们的感伤气氛。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一五 闲情\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_20_4660-4702\",\"quote\":\"一个有充分的生机与兴致的人战胜患难的方法，是在每次打击以后对人生和世界重新发生兴趣，\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一五 闲情\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_20_4802-4845\",\"quote\":\"所以我们的生活决不可置于狭隘的兴趣之上，使我们人生的意义和目的完全受着意外事故的支配。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一五 闲情\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_6_1003-1020\",\"quote\":\"在上工时间的群众身上，你可看到焦虑\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_6_1501-1537\",\"quote\":\"酒精对他们的作用，是替他们挑起了犯罪意识，那是在健全的时间被理性抑捺着的\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_6_1578-1621\",\"quote\":\"一部分是由于社会制度，一部分是由于个人心理，——当然，个人心理也大半是社会制度的产物。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_6_1975-2014\",\"quote\":\"我将假定他们有充分的收入，可以不愁吃不愁住，有充分的健康可以作普通的肉体活动。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_6_2148-2239\",\"quote\":\"相信，这种不快乐大部分是由于错误的世界观，错误的伦理学，错误的生活习惯，终于毁掉了对一般可能的“事物”的天然的兴致和胃口，殊不知一切的快乐，不问是人类的或野兽的，都得以这些事物为根基\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_6_2705-2775\",\"quote\":\"慢慢地，我学会了对自己和自己的缺陷不再介介于怀；而对外界的事物，却一天天的集中我的注意：臂如世界现状，知识的各部门，以及我抱有好感的个人等。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_6_2991-3151\",\"quote\":\"他以为靠了宗教得来的幸福，其实靠着清道夫的行业一样可以得到，只要他真正做一个清道夫。有一般人是因为深陷在“自我沉溺”之中而无可救药的，对于他们，外界的纪律确是一条引向幸福的路。“自我沉溺”种类繁多。我们可以挑出“畏罪狂”，“自溺狂”，“自大狂”三种最普通的典型。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_6_3283-3320\",\"quote\":\"他认为自己应该如何如何，这幅理想的图画，却和他所知的实际的他，不断发生冲突\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\",\"annotation\":\"me?\"},{\"id\":\"910669:mark:910669_6_3819-3860\",\"quote\":\"“自溺狂”在某个意义上是普通的犯罪意识的反面；特征是惯于自赞自叹，并希望受人赞叹。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\",\"annotation\":\"艺术家？\"},{\"id\":\"910669:mark:910669_6_4585-4630\",\"quote\":\"“自大狂”和自溺狂的不同之处，是他希望大权在握而非动人怜爱，他竭力要令人畏惧而非令人爱慕。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_6_4809-4875\",\"quote\":\"亚历山大大帝，心理上便和疯子同型，虽然他赋有雄才大略，能够完成疯子的梦。然而他还是不能完成他自己的梦，因为他愈成功，他的梦也愈扩大。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_6_5770-5867\",\"quote\":\"典型的不快乐者，是少年时给剥夺了某些正常的满足的人，以致后来把这一种满足看得比一切其余的满足更重要，从而使他的人生往着单一的方向走去，并且过于重视这一种满足的实现，认为和一切与之有关的活动相反。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一 什么使人不快乐？\",\"date\":\"2020-04-15\"},{\"id\":\"910669:mark:910669_20_1953-1999\",\"quote\":\"一切的闲情逸兴，除了在宽弛作用上重要之外，还有许多旁的裨益。第一，它们帮助人保持均称的意识。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一五 闲情\",\"date\":\"2020-04-14\"},{\"id\":\"910669:mark:910669_20_2618-2665\",\"quote\":\"近代高等教育的缺陷之一，是太偏于某些技能的训练，而忘了用大公无私的世界观去扩大人类的思想和心灵\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一五 闲情\",\"date\":\"2020-04-14\"},{\"id\":\"910669:mark:910669_19_1158-1203\",\"quote\":\"在大半有酬报的工作和一部分无酬报的工作内，第二桩利益是它给人以成功的机会和发展野心的利便。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一四 工作\",\"date\":\"2020-04-13\"},{\"id\":\"910669:mark:910669_19_1360-1399\",\"quote\":\"目的之持续，终究是幸福的最重要原素之一，而这在大多数人是主要靠了工作而实现的。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一四 工作\",\"date\":\"2020-04-13\"},{\"id\":\"910669:mark:910669_19_1811-1839\",\"quote\":\"使工作有趣的有两个原素：第一是巧技的运用，第二是建设性。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一四 工作\",\"date\":\"2020-04-13\"},{\"id\":\"910669:mark:910669_19_1868-1907\",\"quote\":\"每个练有什么特殊本领的人，总乐于施展出来，直到不足为奇或不能再进步的时候为止。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":
