\"其中包括意图伤害他人的比赛；要求参与者欺骗别人、狡诈或残忍待人的比赛；以及那些输掉后惩罚太大的比赛。参与这样的比赛通常会伤害你的自尊或声誉。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"25 拒绝“比赛”\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_32_1602-1651\",\"quote\":\"许多比赛不仅无害，而且具有价值，且能够提升你的人生；它们不是冷酷无情的，实际上它们是细腻情感的表达\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"25 拒绝“比赛”\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_32_805-840\",\"quote\":\"有人说“我无法忍受比赛”，那么在大多数情况下，他们其实只是表现糟糕罢了\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"25 拒绝“比赛”\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_33_1344-1376\",\"quote\":\"男人通常会试图让对方觉得自己很有能力，同时隐藏自己的需求或占有欲\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"26 装模作样以留下好印象\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_33_1445-1469\",\"quote\":\"而女性则倾向于隐藏自己的力量和成就，以免吓到男性\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"26 装模作样以留下好印象\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_33_3528-3545\",\"quote\":\" 在一段关系中，从一开始就做你自己\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"26 装模作样以留下好印象\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_8_1139-1224\",\"quote\":\"由于父母自己的成长经历，他们往往无法在情感上满足你的需要。如果你一直在追求他们无法给予你的东西，而且如果你认为自己的价值取决于是否得到它，那么你就永远也不会觉得自己有价值\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 追逐父母的爱与认可\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_8_1228-1255\",\"quote\":\"你徒劳的努力会让你产生敌意和怨恨，让你的父母产生挫败感\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 追逐父母的爱与认可\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_8_1362-1404\",\"quote\":\"在很多情况下，你从父母那里得不到的东西，恰恰就是你的父母从他们的父母那里得不到的东西\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 追逐父母的爱与认可\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_8_1459-1509\",\"quote\":\"打破家庭循环的关键是：做你父母的父母，实质上成为你自己的祖父母、外祖父母。给予父母他们从未得到的东西\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 追逐父母的爱与认可\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_8_1951-2088\",\"quote\":\"她母亲是在大萧条时期由被迫长时间工作的父母抚养长大的。和其他被忽视的孩子一样，卡罗琳的母亲在成长过程中也觉得自己被忽视了。因此，当她自己成为一名母亲时，她做得太过火了，对女儿的生活干涉太多，甚至试图控制她。“你们两个的不幸之处在于，”我告诉卡罗琳，“你们都没有真正的母亲。”\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 追逐父母的爱与认可\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_9_1126-1151\",\"quote\":\"第一种类型的人会让你觉得他们强大、有魅力、有力量。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"02 和错误的人交往\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_9_1196-1248\",\"quote\":\"具有讽刺意味的是，就像吸血鬼一样，这种类型的人反而是通过吸取他人的力量来维持自己的力量的。他们是索取者。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"02 和错误的人交往\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_9_1333-1374\",\"quote\":\"你被第二种类型的人吸引是因为他们需要你。你认同他们，像你希望被对待的那样对待他们。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"02 和错误的人交往\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_9_1464-1527\",\"quote\":\"但通常情况下，他们只是在榨干你。从长远来看，你会感到精疲力竭，你会变成自己从未想成为的那种人：冷淡、冷漠，甚至可能会虐待他们。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"02 和错误的人交往\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_9_1710-1807\",\"quote\":\"拥有怨恨内核的人会与世界为敌。刚开始的时候，他们往往很有魅力，他们很好胜、喜欢对抗，而且通常很好斗。他们会把每一次分歧变成对抗，并试图迅速占据上风。当你和他们在一起时，你总会觉得不适，或是自卑。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"02 和错误的人交往\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_9_2826-2894\",\"quote\":\"幸运的是，还有第三种类型的人——拥有健康内核的人。他们豁达、自信，拥有坚定的信念和良好的幽默感，他们是我们希望出现在我们生活中的那种人。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"02 和错误的人交往\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_7_1054-1072\",\"quote\":\"“有时候，简单的出路就是正确的出路。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"前 言 如何战胜自我挫败\",\"date\":\"2023-02-07\"},{\"id\":\"3300003095:mark:3300003095_3_2723-2936\",\"quote\":\"作为写手，金先生也不是旗开得胜那一类，而是迭遭退稿，年轻的他把退稿钉在墙上，直到钉子不堪重负为止，而第一部卖得大价钱的小说《凯丽》￼（Carrie），金先生自称从不喜欢，要不是贤妻从废纸篓中抢救出手稿，怕是永远不得问世了。\",\"book\":{\"id\":\"3300003095\",\"title\":\"写作这回事：创作生涯回忆录（经典写作课）\",\"author\":\"[美]斯蒂芬·金\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/28/cpPlatform_3300003095/t6_cpPlatform_3300003095.jpg\",\"url\":\"https://weread.qq.com/web/reader/a8232570813ab67b5g01534b\",\"wordCount\":\"$undefined\"},\"chapter\":\"金先生论写作\",\"date\":\"2022-09-28\"},{\"id\":\"3300003095:mark:3300003095_3_3288-3347\",\"quote\":\"例如金先生说写作环境切不可富丽堂皇，而是愈简朴愈好，书桌也不必求大，书房只需有一扇可以关上的门把作家闭锁在内就可以了。\",\"book\":{\"id\":\"3300003095\",\"title\":\"写作这回事：创作生涯回忆录（经典写作课）\",\"author\":\"[美]斯蒂芬·金\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/28/cpPlatform_3300003095/t6_cpPlatform_3300003095.jpg\",\"url\":\"https://weread.qq.com/web/reader/a8232570813ab67b5g01534b\",\"wordCount\":\"$undefined\"},\"chapter\":\"金先生论写作\",\"date\":\"2022-09-28\"},{\"id\":\"33879483:mark:33879483_5_1651-1769\",\"quote\":\"在私塾读书，照规矩，从清早一直到打二更，是不许休息的，除了早午两餐，不得不放两次学，以及没法禁止的大小便外。一年到头，也无所谓假期，除了端阳、中秋各放学三天，过年放半个月，家里有什么婚丧祝寿大事，不得不耽搁相当时日。倘要休息，只好害病。\",\"book\":{\"id\":\"33879483\",\"title\":\"死水微澜\",\"author\":\"李劼人\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/25/YueWen_33879483/t6_YueWen_33879483.jpg\",\"url\":\"https://weread.qq.com/web/reader/97932dd07204f5bb979ce67\",\"wordCount\":\"$undefined\"},\"chapter\":\"chapter 1 第一部分 序幕\",\"date\":\"2022-09-28\"},{\"id\":\"23458702:mark:23458702_38_761-813\",\"quote\":\"他想传达这样的信息：想要赢得总冠军，必须让身边的人专注于各自最擅长的事情，而自己则专注于自己最擅长的事情\",\"book\":{\"id\":\"23458702\",\"title\":\"曼巴精神：科比自传\",\"author\":\"科比·布莱恩特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/702/23458702/t6_23458702.jpg\",\"url\":\"https://weread.qq.com/web/reader/9c6322f07165f38e9c6ea43\",\"wordCount\":49894,\"spinePalette\":{\"paper\":\"rgb(17 17 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"比尔·拉塞尔\",\"date\":\"2022-09-07\"},{\"id\":\"23458702:mark:23458702_40_787-846\",\"quote\":\"某些特定情况下，比如在一场比赛之中，好的教练会传达可执行的信息。他们会明确指出，具体是哪些因素在起作用，哪些是无用功。\",\"book\":{\"id\":\"23458702\",\"title\":\"曼巴精神：科比自传\",\"author\":\"科比·布莱恩特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/702/23458702/t6_23458702.jpg\",\"url\":\"https://weread.qq.com/web/reader/9c6322f07165f38e9c6ea43\",\"wordCount\":49894,\"spinePalette\":{\"paper\":\"rgb(17 17 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"好教练的重要性无与伦比\",\"date\":\"2022-09-07\"},{\"id\":\"35239336:mark:35239336_13_29297-29383\",\"quote\":\"由于他同海伦伯爵夫人的亲密关系，他在上流社会的地位很引人注目；由于他受到一位要人的信任和庇护，他在官场的地位也很优越。他打算在彼得堡娶一个最有钱的姑娘，而这是很容易办到的。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_42628-42707\",\"quote\":\"“人有时会产生多么荒唐的念头！”安德烈公爵想，“不过可以肯定，这个姑娘那么可爱，那么出色，她只要在这里跳上一个月舞，就一定会嫁人……这里难得有这样的好姑娘。”\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_47911-47963\",\"quote\":\"“既然生活，充满种种欢乐的生活，展现在我的面前，我为什么还要害怕，为什么还要在闭塞的小圈子里忙忙碌碌？”\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_48059-48205\",\"quote\":\"“皮埃尔说得对，人要幸福，必须相信能获得幸福。现在我相信他的话是对的。‘任凭死人埋葬他们的死人，’[13]我们活着一天，就要生活，而且要生活得幸福。”\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_51987-52046\",\"quote\":\"她提到现在这个时代，因为凡是智力不发达的人总喜欢提到时代，认为他们懂得并且重视时代的特点，而且人的本性是随时代而改变的\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_56606-56688\",\"quote\":\"安德烈公爵明白，老头子希望他的感情或他未婚妻的感情经受不住一年时间的考验，或者老公爵自己会在这一年里死去。于是安德烈公爵决定遵从父亲的意志：先订婚，一年后举行婚礼。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_67162-67254\",\"quote\":\"玛丽雅公爵小姐活得越久，她的生活经验越丰富，对生活观察得越深刻，她就越觉得在茫茫尘世追求享乐和幸福的人目光短浅。他们操劳，受苦，奋斗，互相伤害，想获得那种空虚、罪恶和不可能获得的幸福。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_10002-10068\",\"quote\":\"此外，原来认识他的人一致认为，五年来他大有进步，变得更加成熟，不像原来那样做作、傲慢和喜欢嘲弄别人，而是随着年龄的增长显得稳重沉着。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_14691-14733\",\"quote\":\"总的来说，斯佩兰斯基使安德烈公爵吃惊的思想特点在于他毫不动摇地坚信理性的力量和正确。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_16675-16774\",\"quote\":\"皮埃尔对他的活动开始感到不满。共济会，至少他在这里看到的共济会，他有时觉得徒具形式。他对共济会本身并不怀疑，但疑心俄国共济会已误入歧途，背离它的宗旨。因此，皮埃尔为了研究共济会的高深教义在年底出国。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_17384-17529\",\"quote\":\"为此目的，必须使美德压倒罪恶，使正直的人今世也能因他们的德行而获得永久的奖赏。但现在的种种政治制度却妨碍我们达到目的。在这种情况下应该怎么办呢？实行革命，推翻一切，用暴力驱除暴力吗？不，我们绝不赞成这样做。任何暴力改革都必须反对，因为人们若仍像现在这样是不能驱除罪恶的，因为智慧不需要暴力。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_18004-18070\",\"quote\":\"等到我们的会友在每个国家里有一定数目，每个人再培养两个人，他们又能紧密团结起来，到那时本会就什么都能做到，就可以为人类福利做许多事。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_18292-18404\",\"quote\":\"在这次集会上，皮埃尔第一次惊讶地发现人的思想千差万别，任何真理在两个人看来都不一样。就连那些似乎支持他的人也是按照自己的理解歪曲他的意见。皮埃尔不能容忍这种歪曲，因为他坚决要求把他的思想完整地传达给别人，使别人能正确理解他。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_19907-20020\",\"quote\":\"只有在尘世的骚乱中我们才能达到以下三项宗旨：第一，自知，因为人只有通过比较才能认识自己；第二，自我完善，只有经过奋斗才能自我完善；第三，达到主要的德行——视死如归。生活的变化无常最能显示它的空虚，增强我们天生对死亡或重生的爱。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_21416-21529\",\"quote\":\"但也许因为主持这种交际活动就是需要愚蠢，也许因为受骗的人在受骗中感到快乐，骗术并没有被拆穿，而海伦作为美丽而聪明的迷娘的名声绝不动摇，她即使说出最庸俗愚蠢的话，大家也会赞美她的每一句话，并在其中寻求连她自己都没想到的深奥意义。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_21542-21626\",\"quote\":\"皮埃尔正是这个风头十足的交际花所需要的丈夫。他是个精神恍惚的怪人，具有绅士风度的老爷，他不妨碍任何人，不仅不破坏客厅的高雅格调，而且以自己的平庸笨拙反衬出妻子的文雅大方\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_5736-5843\",\"quote\":\"老栎树完全变了样，展开苍绿多汁的华盖，在夕阳下轻轻摇曳。如今生着节瘤的手指，身上的疤痕，老年的悲哀和疑虑，一切都不见了。从粗糙的百年老树皮里，没有长出枝条，却长出许多鲜嫩的新叶，使人无法相信这样的老树又会披满绿叶。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_6029-6153\",\"quote\":\"“我心里有什么感觉，只有我自己知道是不够的，应该让人人都知道：应该让皮埃尔知道，让那个想飞上天去的姑娘知道，要让人人都了解我，我活着不能只为我自己，也不能让大家都像那个姑娘似的不关心我的存在，我的生命要在大家身上反映出来，要使大家都同我一起生活！”\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_6276-6318\",\"quote\":\"他明白，要是他不把生活经验用于实际工作中，不积极参与生活，那么，他的经验就毫无用处。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_9777-9855\",\"quote\":\"安德烈公爵处境非常有利，他受到彼得堡上流社会各界的欢迎。改革派热烈欢迎他，拉拢他，第一，因为他以聪明和博学著称，第二，因为他解放农奴而获得自由主义者的名声。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"41176028:mark:41176028_11_13548-13630\",\"quote\":\"20世纪六七十年代，主要的英美哲学家反对优绩至上，理由是人们在市场上的收入取决于他们无法控制的偶然性，比如对一个人的才能的需求，以及一个人的才能是普通的还是罕见的。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"得到你应得到的\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_13630-13876\",\"quote\":\"但到了20世纪八九十年代，一群有影响力的哲学家——或许反映了当时政治中盛行的责任言辞——重新开始为优绩辩护。他们被称为运气平等主义者，他们认为，社会帮助失利者的义务取决于找出穷人中谁应该为他们的不幸负责，以及谁是坏运气的受害者。他们坚持认为，只有那些对自己的困境不负责任的人才应该得到政府的帮助。￼\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"得到你应得到的\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_1378-1435\",\"quote\":\"从20世纪90年代开始到现在，我的学生中似乎有越来越多的人相信，他们的成功是他们自己努力的结果，是他们自己取得的。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"奋斗与应得\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_1595-1693\",\"quote\":\"无论学生支持还是反对平权法案，大多数人都坚信他们努力学习才有资格进入哈佛大学，因此他们在哈佛的地位是当之无愧的。至于他们被录取是因为运气或其他自己无法控制的因素的说法，都会遇到哈佛学生的强烈抵制。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"奋斗与应得\",\"date\":\"2021-11-10\",\"annotation\":\"以前当一个学生抱怨运气不好、不佛公平时，老师会告诉他要从自身找原因。在当时这一观念不容置辩，现在被统称为PUA……\"},{\"id\":\"41176028:mark:41176028_11_17567-17639\",\"quote\":\"有理由认为民粹主义对自命不凡的精英的反感在特朗普当选中起了一定的作用。当年早些时候，英国举行了一场令人惊讶的投票，决定退出欧盟，也与这种反感有关\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"民粹主义的强烈抵制\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_17752-17833\",\"quote\":\"他们憎恨主张优绩至上的精英、专家和专业人士阶层，这些家伙颂扬市场驱动的全球化，从中获益，迫使劳动人民接受外国竞争的挤压。他们似乎更认同全球精英，而不是他们的同胞。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"民粹主义的强烈抵制\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_18029-18105\",\"quote\":\"那些努力工作、遵守规则的人可以凭借自己的才能平步青云。他们没有注意到，对那些困在底层或挣扎着维持生活的人来说，阶层跃升的话语与其说是承诺，不如说是嘲讽。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"民粹主义的强烈抵制\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_19265-19474\",\"quote\":\"首先，在不平等现象猖獗和流动性停滞的情况下，重申我们对自己的命运负责，以及我们得到的就是我们应得的东西，这些说法削弱了团结，并让那些被全球化抛在后面的人士气低落。其次，坚持认为大学文凭是获得受人尊敬的工作和体面生活的首要途径，这造成了文凭主义偏见，损害了工作的尊严，贬低了那些没有上过大学的人。最后，坚持认为社会和政治问题最好由受过高等教育、价值中立的专家来解决，这是技术官僚的自负，腐蚀了民主，剥夺了普通公民的权力。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"民粹主义的强烈抵制\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_19637-20695\",\"quote\":\"最富有的1%的人的收入超过整个底层一半人口的收入总和，￼中等阶层的收入也停滞了40年，￼努力和勤奋会让你走得更远的想法开始变得空洞。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"如果你努力，你就能成功吗？\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_20928-21341\",\"quote\":\"根据全球民意调查，大多数（77%）美国人相信人们只要努力就能成功，只有一半的德国人这么看。在法国和日本，大多数人认为努力工作并不能保证成功。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"如果你努力，你就能成功吗？\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_25549-25626\",\"quote\":\"事实上，美国的经济流动性比其他许多国家都要小。与德国、西班牙、日本、澳大利亚、瑞典、加拿大、芬兰、挪威和丹麦相比，美国人经济上的优势和劣势更容易代代相传。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"如果你努力，你就能成功吗？\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_26971-26985\",\"quote\":\"美国梦也在中国北京蓬勃发展。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"如果你努力，你就能成功吗？\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_28394-28453\",\"quote\":\"他们本能地相信美国例外论，相信美国是个努力工作就能取得成功的地方。这种阶层跃升的信念是美国传统上针对不平等的解决方案。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"如果你努力，你就能成功吗？\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_28572-28617\",\"quote\":\"但一旦他们了解到美国比其他许多国家不平等程度更高而流动性更低，他们就会感到困扰和难以理解。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"如果你努力，你就能成功吗？\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_28850-28963\",\"quote\":\"我的一些学生认为，即使美国梦与事实不符，重要的是不要传播这些信息，最好的办法是保护人们的想法不被搅乱，这样他们就会继续相信，只要持续发挥他们的才能并努力工作，他们就有可能实现阶层跃升。这会把美国梦变成柏拉图所说的“高尚的谎言”\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"如果你努力，你就能成功吗？\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_30393-30502\",\"quote\":\"2016年，随着全球化对普通工人的有害影响变得清晰，自由派精英们提出的阶层跃升话语传达了冷酷的暗示。即使面对不平等日益加剧，自由派精英也坚持认为我们要对自己的命运负责，因此，无论是获得成功还是遭遇不幸，都是我们应得的。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"看到什么与相信什么\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_30531-30593\",\"quote\":\"这种看待不平等的方式助长了精英的傲慢，强化了一种信念，即那些从全球化中获益的人理应得到奖赏，而那些落在后面的人理应贫困度日。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"看到什么与相信什么\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_31984-32006\",\"quote\":\"精英的傲慢最令人难堪的特征之一就是文凭主义。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"看到什么与相信什么\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_3408-3503\",\"quote\":\"20世纪80年代的市场必胜论促使人们提出了第三个理由，即优绩至上论：只要在机会均等的公平体系中运作，市场就会让每个人得到他应得的东西。只要每个人都有平等的竞争机会，市场结果就会奖励优秀的人。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"市场与优绩至上\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_412-453\",\"quote\":\"对那些困在底层或挣扎着维持生活的人来说，阶层跃升的话语与其说是承诺，不如说是嘲讽。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"3 阶层跃升的话语\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_4651-4729\",\"quote\":\"向优绩至上的转变一方面显示了英才统治冷酷的一面，其冷酷性体现在对个人责任的严格要求上，这种要求伴随着对福利制度的控制和把风险从政府和公司转移到个人身上的努力\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"市场与优绩至上\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_5005-5061\",\"quote\":\"优绩至上观念体现在所谓的阶层跃升的话语中，保证那些努力工作并遵守规则的人应该站在他们的才能和梦想所能达到的高度。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"市场与优绩至上\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_680-732\",\"quote\":\"这种思维方式赋予我们力量，鼓励人们这样思考：自己对自己的命运负责，而不是成为自己无法控制的力量的受害者。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"3 阶层跃升的话语\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_747-875\",\"quote\":\"我们越是认为自己是白手起家、自给自足的，就越不可能关心那些比我们不幸的人的命运。如果我的成功是我自己努力实现的，那么他们的失败一定是他们自己的错。这种逻辑显示优绩至上原则侵蚀了人与人之间的共通性。对我们的命运负有个人责任的观念过于强烈，让我们很难换位思考。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"3 阶层跃升的话语\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_7567-7880\",\"quote\":\"克林顿赞同里根的观点，即福利发放对象应仅限于那些“并非因自身过错而需要帮助的人”。克林顿说：“政府的作用是创造经济机会，帮助那些并非由于自身过错而承受经济负担的人。”\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"责任的言辞\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_9570-9593\",\"quote\":\"机会平等和阶层跃升的理想一直是美国梦的一部分。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"尽你所能，达所当止\",\"date\":\"2021-11-10\"},{\"id\":\"41176028:mark:41176028_11_9700-9769\",\"quote\":\"但令人惊讶的是，这个口号其实挺新的。在过去40年里，这句话才在美国政治话语中变得突出。罗纳德·里根是第一位将其作为政治理论支柱的美国总统。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"尽你所能，达所当止\",\"date\":\"2021-11-10\"},{\"id\":\"853846:mark:853846_5_13327-13432\",\"quote\":\"咖啡饮料先从盖拉族嚼食的咖特草，发展到嚼食咖啡果叶，进而泡煮咖啡果肉成为类似水果茶的“咖许”，再进步到轻焙咖啡豆和咖啡果肉，泡煮成更香浓的“咖瓦”。之前虽无文献佐证这一进化轨迹，但这四大阶段最迟在15世纪末完成\",\"book\":{\"id\":\"853846\",\"title\":\"世界咖啡学：变革、精品豆、烘焙技法与中国咖啡探秘\",\"author\":\"韩怀宗\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/YueWen_853846/t6_YueWen_853846.jpg\",\"url\":\"https://weread.qq.com/web/reader/9ac324c05d07569ac6a95d9\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一部分 咖啡历史与故事\",\"date\":\"2021-10-28\"},{\"id\":\"853846:mark:853846_5_8697-8748\",\"quote\":\"咖啡饮料的演进相当缓慢，到了9至11世纪，才从盖拉族嚼食咖啡果发展到水煮咖啡果的药用“果汁”——邦琼。\",\"book\":{\"id\":\"853846\",\"title\":\"世界咖啡学：变革、精品豆、烘焙技法与中国咖啡探秘\",\"author\":\"韩怀宗\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/YueWen_853846/t6_YueWen_853846.jpg\",\"url\":\"https://weread.qq.com/web/reader/9ac324c05d07569ac6a95d9\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一部分 咖啡历史与故事\",\"date\":\"2021-10-28\"},{\"id\":\"853846:mark:853846_5_9561-9608\",\"quote\":\"郑和每次出航都带着茶砖同行，除了当作馈赠友邦的礼物，也大方向也门统治者展示中国的泡茶待客之道。\",\"book\":{\"id\":\"853846\",\"title\":\"世界咖啡学：变革、精品豆、烘焙技法与中国咖啡探秘\",\"author\":\"韩怀宗\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/YueWen_853846/t6_YueWen_853846.jpg\",\"url\":\"https://weread.qq.com/web/reader/9ac324c05d07569ac6a95d9\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一部分 咖啡历史与故事\",\"date\":\"2021-10-28\"},{\"id\":\"853846:mark:853846_5_9733-9797\",\"quote\":\"郑和返国后，明朝关闭了对外通商渠道，茶叶不易输进中东，提神饮料出现短缺期，阿拉伯只好回头启用自家的提神饮料，令咖啡再度受到重视。\",\"book\":{\"id\":\"853846\",\"title\":\"世界咖啡学：变革、精品豆、烘焙技法与中国咖啡探秘\",\"author\":\"韩怀宗\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/YueWen_853846/t6_YueWen_853846.jpg\",\"url\":\"https://weread.qq.com/web/reader/9ac324c05d07569ac6a95d9\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一部分 咖啡历史与故事\",\"date\":\"2021-10-28\"},{\"id\":\"41176028:mark:41176028_10_1039-1104\",\"quote\":\"社会应该根据优绩分配经济回报和工作岗位的想法，有几个吸引人的原因，其中两个原因是将招聘中对才能的看法推而广之形成的，即效率和公平。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"优绩为什么重要\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_10_10837-10902\",\"quote\":\"随着对上帝信仰的消退，对人类主观能动性的信心逐渐增强。我们越认为自己可以自我实现、自给自足，就越没理由对自己的成功感到愧疚或感恩。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"天命论思维：过去和现在\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_10_11125-11256\",\"quote\":\"马克斯·韦伯观察到：“幸运的人很少对自己拥有好运的事实感到满足，除此之外，他还想确认他有权利获得自己的好运，他想要确信自己理应获得这份成功。最重要的是，他想要确认，与其他人相比，他更配得上这份好运。他还想要确认，不那么幸运的人所经历的不幸都只是他们自己应得的。”\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"天命论思维：过去和现在\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_10_1600-1694\",\"quote\":\"优绩至上原则可能会发生转变，走向暴虐。这不仅发生在社会没能践行这项原则的时候，更可能发生在社会遵从该原则的时候。优绩至上理想的阴暗面植根于其最诱人的承诺，即掌控自己的命运并实现自我的承诺。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"优绩为什么重要\",\"date\":\"2021-10-25\",\"annotation\":\"对有风险的事情，敢于去做的人，必须承受着远超常规的压力。失败则意味着被羞辱，而失败的概率是很大的。成功则意味着获得极高收益，甚至可以盛气凌人。而那些不敢去承担风险的人，则可以躲在暗处戳勇敢者的脊梁骨。如此，是否是风险参与者，抑或是成败与否都很难让人具有良好的心态与社会相处，这样的社会很难和谐。\"},{\"id\":\"41176028:mark:41176028_10_3249-3593\",\"quote\":\"在约伯悼念逝去的家人时，他的朋友们（如果可以称他们为朋友）坚持认为他一定犯了什么滔天大罪，他们逼迫约伯去回想自己可能造了什么孽。[插图]这是优绩至上暴政的最早例证。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"优绩至上的宇宙\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_10_3809-3933\",\"quote\":\"上帝在旋风中宣告，并非发生的每件事都是对人类行为的奖赏或惩罚。降雨未必是为了浇灌义人的庄稼，干旱也未必是为了惩罚恶人，毕竟雨也会下在荒无人烟的旷野。创造世界不只是为了人类，与以人类为中心的图景相比，宇宙更为广阔，上帝行事的方式也更加神秘而不可揣度。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"优绩至上的宇宙\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_10_4094-4121\",\"quote\":\"上帝承认约伯是正直的，但责备他擅自揣摩上帝的道德准则。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"优绩至上的宇宙\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_10_6601-6669\",\"quote\":\"而当信仰需要体现在对仪式的外在遵守中，需要借助一系列复杂的教会行为来调解和加强时，关于感恩和恩典的神学将不可避免地滑向自傲和自救的神学。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"救赎和自救\",\"date\":\"2021-10-25\",\"annotation\":\"赎罪券经济\"},{\"id\":\"41176028:mark:41176028_10_6873-6965\",\"quote\":\"马丁·路德继承了奥古斯丁的观点并将其拓展为更广泛的观点：救赎完全是上帝的恩典，不会受任何试图取悦上帝的行为影响，无论是善行还是举行仪式。我们既不能祈求进入天堂，也不能花钱买一条路进去。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"救赎和自救\",\"date\":\"2021-10-25\",\"annotation\":\"如果上天堂或下地狱是通过自身努力完成某项指标来实现的，那这种努力与购买赎罪券何异？现代社会没有了死后的天堂与地狱，相应地发明了世俗意义上地“成功”与“失败”等概念来衡量存在的意义。\"},{\"id\":\"41176028:mark:41176028_10_7243-7294\",\"quote\":\"然而，矛盾的是，路德发起的新教改革却导致日后新教教徒及其后继者为美国带去了强大的优绩至上主义工作伦理。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"救赎和自救\",\"date\":\"2021-10-25\",\"annotation\":\"人类在不同时代不同地方总会发明一组类似于“天堂”“地狱”之类地东西，这一组概念几乎成了信仰地核心要素。\"},{\"id\":\"41176028:mark:41176028_10_8199-8244\",\"quote\":\"既然每个人都听从上帝的召唤而去从事某一职业，那么尽力做好工作以回应这种召唤就是救赎的标志。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"救赎和自救\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_10_8354-8414\",\"quote\":\"这样一来，工作的意义不在于享受它带来的财富，而在于颂扬上帝，若为个人的奢侈享受而去工作，则是对这一目标的背离，陷于腐败。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"救赎和自救\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_10_8597-8667\",\"quote\":\"一生勤勉工作以回应上帝的召唤，这诚然不是获得救赎的捷径，而是确认自己是否（已经）蒙获上帝选中的方式。勤勉工作是获得救赎的标志，而不是其原因。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"救赎和自救\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_10_9328-9403\",\"quote\":\"韦伯解释说：“上帝为每个人都准备了一份召唤，人们应该接受这份召唤并为之努力工作。”这赋予了劳动分工神圣的认可，并支持了“对经济秩序所做的神意论解释”。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"救赎和自救\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_9_11607-11681\",\"quote\":\"优绩至上的准则所产生的情感，无论在成功者还是失败者中，在道德上都不受欢迎。在成功者中，优绩至上催生了狂妄自大；在失败者中，优绩至上带来了屈辱和怨恨。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"优绩至上的道德准则\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_9_11930-11977\",\"quote\":\"精英阶层的傲慢反映了成功人士倾向于过度沉醉在自己的成功中，而不记得有助于他们成功的时机和好运。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"1 赢家与输家\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_9_12123-12182\",\"quote\":\"完全遵照优绩至上原则，会让人丧失对上天眷顾和恩宠的感受力。优绩至上观念削弱了我们将所有人视为同呼吸共命运的同伴的能力。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"优绩至上的道德准则\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_9_12427-12463\",\"quote\":\"优绩至上的观念祝贺成功者，却诋毁失败者，即使在失败者自己的眼中也是如此。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"羞辱政治\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_9_12610-12686\",\"quote\":\"对羞辱的抗议在心理上更沉重，它混合了对胜利者的怨恨和挥之不去的自我怀疑：也许富人之所以富有，是因为他们比穷人更值得拥有；也许失败者是他们自身不幸的同谋。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"羞辱政治\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_9_13664-13695\",\"quote\":\"希拉里赢得了全球化赢家的选票，而特朗普赢得了全球化输家的选票。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"羞辱政治\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_9_16042-16134\",\"quote\":\"托马斯·杰斐逊支持建立在“美德和才能”基础上的“自然贵族”，而不是“建立在财富和出身基础上的人造贵族”。“这种形式的政府最好，”他写道，“有利于把这些天生的亚里士多德选进政府机关。”[插图]\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"技术官僚眼中的优绩与道德判断\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_9_16757-16962\",\"quote\":\"美国英才治国的技术官僚版本[插图]切断了英才和道德判断之间的联系。在经济领域，技术管理简单地假设公共利益是由GDP定义的，而人们贡献的价值在于他们出售的产品或服务的市场价值。在政府领域，技术管理认为精英意味着技术专家的专业知识。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"技术官僚眼中的优绩与道德判断\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_9_17914-18001\",\"quote\":\"除了掏空公共话语的内涵，技术官僚眼中的优绩提升了有资格证书的专业人士阶层的声望，贬低了大多数工人的贡献，削弱了他们的社会地位和尊严，还以这些方式重新界定了获得社会认可的条件。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"技术官僚眼中的优绩与道德判断\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_9_18468-18631\",\"quote\":\"一方面，这会是值得庆祝的事情：工人阶级的孩子最终会与特权阶层的孩子并肩公平竞争。但是，迈克尔·扬认为，这场胜利会有副作用，因为这场胜利注定会助长胜利者的狂妄自大和失败者的屈辱。赢家会认为他们的成功是“对他们自己的能力、自己的努力、自己不可否认的成就的回报”，因此会看轻那些不如自己成功的人。那些失利的人会觉得他们只能怪自己。[插图]\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"民粹主义者的反抗\",\"date\":\"2021-10-25\"},{\"id\":\"41176028:mark:41176028_3_1004-1065\",\"quote\":\"这本书想要探讨，我们如何才能找到理解成功的新方式，变得不那么焦虑，更宽厚、更谦逊，这种方式让我们对公共利益有更强的责任感。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"致中文版读者的几句话\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_3_667-749\",\"quote\":\"在竞争激烈的社会中取得成功的那些人开始相信，他们的成功完全是自己的功劳，因此他们理应得到成功带来的回报。他们也倾向于相信那些成就不如自己的人应该承受他们目前的境遇。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"致中文版读者的几句话\",\"date\":\"2021-10-20\",\"annotation\":\"精英阶层对自己的过度自信会让世界割裂，让精英阶层忘掉自己应有的社会义务，从而成为固化的既得利益者\"},{\"id\":\"41176028:mark:41176028_6_1353-1383\",\"quote\":\"他们只看到有人破坏游戏规则，却没有看透这个游戏本身是一个陷阱\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_1430-1471\",\"quote\":\"优绩制根本无法兑现它许诺的公平竞争与社会阶层流动，在虚假承诺的伪装下只是一个陷阱。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_2505-2638\",\"quote\":\"桑德尔从道德哲学思考出发，揭示了优绩制的不公平性：影响我们成功与否的因素大都不是我们自己能决定的，例如性别、种族、地区、健康状况、天赋、家庭背景等，这些“运气”和你自己其实没有什么关系，却在很大程度上影响了你能否进入大学、能读什么样的大学，进而影响你未来的事业发展。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_3021-3083\",\"quote\":\"美国社会的现状是，精英阶层能够将优越的社会和经济地位“代际传递”给自己的子女。这当然不能依靠被废弃的世袭制度，而是通过教育。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_3112-3149\",\"quote\":\"教育本来是社会阶层流动的关键通道，但优质教育是稀缺资源，需要竞争才能获得。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_3410-3579\",\"quote\":\"早在20世纪60年代，耶鲁大学校长小金曼·布鲁斯特就曾明确主张，学校要根据学生的成绩而不是其家庭背景来录取学生，希望由此打破精英的世袭。但他的期望落空了，因为精英阶层找到了保持优势的秘诀：通过支付高额费用，让孩子获得最好的升学训练，从幼儿园一直到高中，外加各种昂贵的课外补习班和培训项目，让他们的子女在各级入学申请中获得难以匹敌的竞争力。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_4484-4643\",\"quote\":\"优绩主义侵蚀着公共利益（共同善），它导致了胜利者的傲慢和失败者的屈辱。它鼓励成功者深深沉迷于自己的成功，以至于忘掉了一路上帮助他们的时机和好运，同时也导致他们鄙薄那些比自己不幸、比自己更缺乏资格的人。结果，优绩制助长了阶级之间的对抗和怨恨，这种社会分裂的状况会侵蚀西方的公民社会和民主政治，为民粹主义的兴起提供推动力。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_4782-4820\",\"quote\":\"大学文凭是获得有尊严的工作与体面生活的必要条件吗？在桑德尔看来，这是危险的。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_4847-4918\",\"quote\":\"他提出了一个创新的方案：让所有申请者在达到基本学术门槛后，通过抽签方式来录取。这种抽签录取制，不仅能让学生减轻压力，也会减少被录取学生的优越感\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_5093-5132\",\"quote\":\"我们经常假设人们的收入是他们对公共利益所做贡献的衡量，但这是一种不折不扣的误解\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_5396-5468\",\"quote\":\"在桑德尔看来，分配正义可以纳入对优绩的考量，但优绩的概念本身需要重新理解，不是简单地根据市场竞争的输赢，而是要按照对公共利益的道德重要性来界定。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_5685-5778\",\"quote\":\"意识到运气在生活中的作用会让我们变得谦卑。这种谦卑的精神就是我们现在需要的公民美德。它驱使我们重新定义成功的观念，为我们超越优绩制的暴政，走向一种少些怨恨、多些包容的公共生活指出了方向。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\",\"annotation\":\"强弱不是问题，问题是傲慢\"},{\"id\":\"41176028:mark:41176028_6_6454-6523\",\"quote\":\"改变竞争的目标也只能更换获胜的人群而不是等级结构本身，在狩猎时代可能是体力（身强力壮）的等级，而在今天的信息技术时代可能是数学才能的等级。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_7151-7192\",\"quote\":\"“当我们为公共利益做出贡献，并因所做贡献而赢得同胞尊重的时候，我们是最完整的人。”\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_7199-7277\",\"quote\":\"人类最基本的需求是“被那些与我们共同生活的人需要”，而工作的尊严在于满足这一需求。如果这意味着过一种美好的生活，那么把消费当作经济活动的唯一目的就是错误的。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_6_979-1129\",\"quote\":\"“优绩主义”理想或“优绩制”（meritocracy）原则：社会与经济的奖赏应当依据才能、努力和成就这些“优绩”（merit）来决定。人们在机会平等的条件下公平竞争，成绩优异者获胜。因此，最好的大学应当录取成绩最出色的学生，收入最高的职位应当留给最有能力的人才。对美国人来说，这是不容挑战的理想原则。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_7_2804-2878\",\"quote\":\"全球化的赢家解释说，重要的政治分歧不再是左派对右派，而是开放对封闭。在开放的世界里，成功取决于教育，取决于让自己具备在全球经济领域竞争和取胜的能力。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"序\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_7_2915-2944\",\"quote\":\"但这也意味着那些登上顶峰的人开始相信他们的成功是自己应得的\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"序\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_8_4813-4924\",\"quote\":\"撇开合法与否不谈，“后门”和“侧门”在这个问题上完全不同：当家长依靠大笔捐款买下孩子的入学资格时，这笔钱就会进入大学，大学可以用它改善为所有学生提供的教育。在辛格的案件中，资金流向了第三方，因此对大学本身几乎没有任何帮助。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"引言 走进大学校园\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_8_5232-5291\",\"quote\":\"当然，在实践中，事情并非那么简单。金钱不仅悬停在“后门”门口，也盘旋在“前门”之上。衡量成绩的标准很难与经济优势分开。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"引言 走进大学校园\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_8_7950-7999\",\"quote\":\"不仅因为丑闻牵涉名人和私募股权巨头，还因为他们想要买通的渠道存在广泛的需求，是人们狂热追求的目标。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"引言 走进大学校园\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_8_8036-8066\",\"quote\":\"什么有权有势的父母会为了让自己的孩子进入精英大学而大肆造假？\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"引言 走进大学校园\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_8_8279-8332\",\"quote\":\"这种对名牌大学录取的痴迷源于近几十年来日益加剧的不平等，这种痴迷反映了这样一个事实，即谁进入哪里利害攸关。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"引言 走进大学校园\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_9_10944-11086\",\"quote\":\"美国人认为，只要努力工作，发挥才能，任何人都可以出人头地，这种信念已不再符合现实。这也许可以解释，为什么关于机会的花言巧语不像过去那样鼓舞人心。流动性不再能补偿不平等。任何对贫富差距的严肃回应都必须直接考虑到权力和财富的不平等，而不是满足于设计方案帮助人们爬上梯级间隔越来越大的梯子。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"阶层跃升的话语\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_9_1168-1224\",\"quote\":\"思考应该从此开始：认识到这些不满不仅是经济上的，也是道德和文化上的；这些不满不仅关乎薪水和工作，也关乎社会尊严。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"1 赢家与输家\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_9_1697-1734\",\"quote\":\"第二种诊断将工人阶级的怨恨归因于全球化和科技的快速变化所造成的困惑和混乱。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"诊断民粹主义的怨恨\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_9_1912-1995\",\"quote\":\"这些工人的愤怒给人误导了，因为他们没有意识到自己是在对抗像天气一样不可改变的力量。他们的焦虑最好通过职业培训计划和其他措施来消除，以帮助他们适应全球和技术变革的需要。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"诊断民粹主义的怨恨\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_9_2252-2315\",\"quote\":\"但他们没有认识到自己在激起民愤、导致民粹主义反弹中所扮演的角色，他们没有注意到我们正在目睹的动荡是对历史性政治失败的政治反应。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"诊断民粹主义的怨恨\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_9_568-612\",\"quote\":\"同样令人担忧的是，主流政党和政治家几乎没有表现出他们对搅动世界各地政治的不满情绪的理解。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"1 赢家与输家\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:mark:41176028_9_842-931\",\"quote\":\"这种全球化让顶层人士受益，但让普通公民感到自身权力遭受了剥夺。这也是对技术官僚治国方法的谴责，那些感到经济和文化的列车已经把自己抛下的人在高声呼喊，而技术官僚对这些呼声充耳不闻。\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992},\"chapter\":\"1 赢家与输家\",\"date\":\"2021-10-20\"},{\"id\":\"41176028:review:6166943_7ubOe8MhS\",\"quote\":\"说，其基本理念是：“当我们为公共利益做出贡献，并因所做贡献而赢得\",\"annotation\":\"现代社会太侧重于消费地位，而对尊严的定义权则被掌握在商人手中。\",\"chapter\":\"推荐序 优绩主义的陷阱\",\"date\":\"2021-10-20\",\"book\":{\"id\":\"41176028\",\"title\":\"精英的傲慢：好的社会该如何定义成功？\",\"author\":\"迈克尔·桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/28/41176028/t6_41176028.jpg\",\"url\":\"https://weread.qq.com/web/reader/5d1320e072744bdc5d154db\",\"wordCount\":158992}},{\"id\":\"29373667:mark:29373667_12_2039-2068\",\"quote\":\"第一个也是最基础的一个定义：技术是实现人的目的的一种手段。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第2章 组合与结构\",\"date\":\"2021-06-05\"},{\"id\":\"29373667:mark:29373667_12_2319-2362\",\"quote\":\"我会用到的第二个技术定义是复数性质的：技术是实践和元器件的集成（assemblage）\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第2章 组合与结构\",\"date\":\"2021-06-05\"},{\"id\":\"29373667:mark:29373667_12_2505-2542\",\"quote\":\"我用到的第三个定义是：将技术视作可供某种文化中利用的装置和工程实践的集合。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第2章 组合与结构\",\"date\":\"2021-06-05\"},{\"id\":\"29373667:mark:29373667_14_772-847\",\"quote\":\"将技术的构件模块化可以更好地预防不可预知的变动，同时还简化了设计过程。但只有当模块被反复使用且使用的次数足够多时，才值得付出代价将技术分割为功能单元。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"为什么要模块化\",\"date\":\"2021-06-05\"},{\"id\":\"29373667:mark:29373667_16_4509-4579\",\"quote\":\"原理是为达成某个目的而利用某个现象的理念（idea），它广泛存在于人类及“使用”的世界。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第3章 现象\",\"date\":\"2021-06-05\"},{\"id\":\"29373667:mark:29373667_16_4828-4861\",\"quote\":\"现象在能够被应用于技术之前，一定要被“驯服”，并且作好恰当的准备。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第3章 现象\",\"date\":\"2021-06-05\"},{\"id\":\"29373667:review:6166943_7qOI1DhjF\",\"quote\":\"•　技术是实现目的的一种手段，它是一种装置、一种方法或一个流程。•　技术提供功能，功能指技术要执行的某一类任务。\",\"annotation\":\"技术的三个特征：功能性、集成性、可进化性\",\"chapter\":\"第2章 组合与结构\",\"date\":\"2021-06-05\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"}},{\"id\":\"29373667:mark:29373667_10_1017-1041\",\"quote\":\"技术在某种程度上一定是来自此前已有技术的新组合。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"组合进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_10_1077-1123\",\"quote\":\"到目前为止，只有些许迹象能让我们用来解释新颖性。但是技术是如何被恰当地组建才是我讨论的核心。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"组合进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_10_1419-1566\",\"quote\":\"1910年，熊彼特27岁，他不仅直接关注组合和技术，而且关注经济中的组合。他说：“生产意味着在我们的能力范围内组合材料和动力……生产别的东西，用不同的方法生产同样的东西意味着以不同的方式组合材料和动力。”经济中的变化产生于“生产方式的新组合”。用现代语言来讲，我们可以说它源于“技术的新组合”。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"组合进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_10_1722-1769\",\"quote\":\"但是熊彼特问的是：经济能否在没有外界因素的情况下，完全从内部变革它自身，如果能，是怎样改变的？\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"组合进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_10_2097-2189\",\"quote\":\"熊彼特认识到：有一股力量的源泉发端于经济内部，这种力量会打破任何经济内部的平衡。这种能量的来源是一种组合。经济体持续地通过组合旧技术来创造新技术，因此经济也不断地从内部扰动自身的结构。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"组合进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_10_2266-2284\",\"quote\":\"组合驱动变革——或者至少驱动技术创新\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"组合进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_10_2840-2914\",\"quote\":\"如果新技术真是以前技术的组合，那么现存技术的存量一定在某种程度上提供了新组合所需的部分。这样一来，以前技术的聚集就带来了进一步的聚集。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"组合进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_10_3189-3277\",\"quote\":\"似乎物质文化的装置越庞大，发明的数量越多。需要发明的东西越多，发明的数量就越多。这可以解释为什么更“原始”的社会没能发明出现代性的技术，他们没有必要的要素和利用这些要素的知识。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"组合进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_10_3611-3668\",\"quote\":\"所有技术的集合自力更生地从无到有，从简单到复杂地成长起来了。我们可以说技术从自身创生了自身。这种机制便是组合进化。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"组合进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_10_3723-3757\",\"quote\":\"新技术产生于已有技术的组合，以及（因之而来的）现存技术会带来未来技术\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"组合进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_11_744-770\",\"quote\":\"第一条我已经谈到过：技术（所有的技术）都是某种组合。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"本书的主题\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_11_806-825\",\"quote\":\"其次，技术的每个组件自身也是缩微的技术\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"本书的主题\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_11_899-935\",\"quote\":\"第三条基本原理是，所有的技术都会利用或开发某种（通常是几种）效应或现象。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"本书的主题\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_4_2367-2414\",\"quote\":\"人的行为依赖于他们过去的全部行为。注意，是“依赖”而不是“由此被决定”，也不是“完全不依赖”。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"推荐序一 路径依赖性：人口、经济、技术\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_4_3221-3315\",\"quote\":\"诺思有几篇论文阐述制度的收益递增效应。他指出，规模越大的政府总是追求更大规模，权力越大的人倾向于追求更大权力，成功的制度有复制自身的冲动，直到社会被锁死于早已僵化但曾经成功的制度陷阱之内。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"推荐序一 路径依赖性：人口、经济、技术\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_5_1172-1202\",\"quote\":\"。但是关于‘技术’这个词到底是什么意思，我们并没有达成共识。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"推荐序二 打开“技术黑箱”的一个新尝试\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_5_1308-1472\",\"quote\":\"针对这样一种情况，布莱恩从几乎完全空白的状态开始他的研，并主要基于三个基本原理（假设）逐级地构建了他的关于技术的理论：（1）技术（所有的技术）都是某种组合，这意味着任何具体技术都是由当下的部件、集成件或系统组件构建或组合而成的；（2）技术的每个组件自身也是缩微的技术；（3）所有的技术都会利用或开发某种（通常是几种）效应或现象。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"推荐序二 打开“技术黑箱”的一个新尝试\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_5_1981-2051\",\"quote\":\"“自然现象是技术赖以产生的必不可少的资源。所有的技术，无论是多么简单或者多么复杂的技术，实际上都是应用了一种或几种现象之后乔装打扮出来的。”\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"推荐序二 打开“技术黑箱”的一个新尝试\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_5_2351-2392\",\"quote\":\"技术集合通过人类发明家这个中介实现自身建构，像珊瑚礁通过微小生物自己建构自己一样。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"推荐序二 打开“技术黑箱”的一个新尝试\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_6_1174-1316\",\"quote\":\"技术，是新的技术产品和生产工艺（例如，早期的汽车）通过被应用和被采用而获得改善，之后再获得进一步的应用和采用，在被采用的过程中形成正反馈或收益递增。收益递增向经济学提出了一个问题：假如有两种收益递增的产品（也可以指两项技术）相互竞争的话，领先的那个就有可能进一步领先，并因此主导市场。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言 技术的追问\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_6_1578-1687\",\"quote\":\"我意识到，新技术并不是无中生有地被“发明”出来的，我看到的技术的例子都是从先前已有的技术中被创造（被建构、被聚集、被集成）而来的。换句话说，技术是由其他的技术构成的，技术产生于其他技术的组合（combinations）\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言 技术的追问\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_6_1967-2140\",\"quote\":\"我接触到了弗朗西斯科·瓦雷拉（Francisco Varela）和温贝托·马图拉纳（Humberto Maturana）的自创生系统理论（self-producing systems）。我知道，如果我直接采用“技术是自我创生的（autopoietic），或者自我创造的（self-creating）”这样的阐述，其实可以令读者印象更加深刻。但是在\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言 技术的追问\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_6_2668-2729\",\"quote\":\"经济是从满足我们需要的生产性的方法、法规和组织性安排当中产生出来的，因此经济是从捕捉现象及之后的技术组合过程中发展起来的。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言 技术的追问\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_6_3388-3505\",\"quote\":\"开始，我搞不懂为什么在所有这些思考技术的人里，历史学家在技术和创新的方法和本质方面表达最多，后来我明白了，世界上有更多东西是从技术、而不是战争和条约中涌现出来的，而历史学家当然关注世界是如何形成的，因此就会对技术是怎样形成的更感兴趣。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言 技术的追问\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_6_3995-4186\",\"quote\":\"出于多种理由，要写一本“既严谨又能满足大众阅读需求”的书的想法最终还是胜出了。主要理由是：首先，单纯的诚实性需要。由于研究对象在此之前没有被详细地思考过，所以还不需要晦涩的专业术语的介入；其次，我认为技术太重要了，因此不能为专家所独有，而是需要普罗大众的共同参与；最后，很重要的是，我要激起公众广泛关注这样一个异常美丽的主题的兴趣，关注我所坚信的那个技术背后必定拥有的某种自然逻辑。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言 技术的追问\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_6_4490-4630\",\"quote\":\"随着研究的深入，我发现自己做的是有点类似于数学家的工作：首先需要准确界定术语，然后由此逻辑地导出结果和性质。结果将如读者所见，我需要不断地（而且必要地）关注词汇以及它们在技术中的应用，必要时还要引进几个新的术语。我希望能尽量避免这种情况，但是为了讨论需要，还是额外引入了几个术语。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言 技术的追问\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_6_741-853\",\"quote\":\"教授们解释道：技术是科学的应用；技术是经济中关于机制和方法的研究；技术是工业过程中的社会知识；技术是工程实践。但是所有这些答案似乎都不能令我十分满意，没有哪个答案触及“技术的本性”（technology-ness）这个层次。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言 技术的追问\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_7_2221-2278\",\"quote\":\"技术的循环：技术总是进行这样的循环，为解决老问题去采用新技术，新技术又引起新问题，新问题的解决又要诉诸更新的技术。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第1章 问题\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_7_2581-2619\",\"quote\":\"这种不安不仅只是来自于恐惧，害怕技术给它所解决的每一个问题带来更多的新问题。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第1章 问题\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_7_2698-2750\",\"quote\":\"然而，作为人类，我们实际上不应该和技术如此紧密地结合，而是应该和其他什么东西融合得更为紧密，那就是自然。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第1章 问题\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_8_1393-1570\",\"quote\":\"我们知道单个技术（individualtechnology）的历史以及它们是如何生成的细节；我们可以对设计过程进行分析；关于经济因素如何影响技术的设计、技术被接受的过程，以及技术怎样在经济体中扩散，我们已经有了很精彩的研究；我们对社会如何型塑（shapes）技术以及技术如何型塑社会进行了细致的分析；我们深思技术的意义，追问技术到底是否决定人类的历史。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"缺失了本质的技术\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_8_1865-1989\",\"quote\":\"关于技术的理论之所以缺失，是因为：•　技术一直处于科学的阴影之中。•　那些认真思考技术的人大多数都是社会科学家和哲学家。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"缺失了本质的技术\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_8_2905-2994\",\"quote\":\"但有一次，当我问著名的技术专家沃尔特·文森蒂（WalterVincenti），为什么绝少有工程师尝试去奠定他们领域的理论基础，他的回答是：“工程师只喜欢那些他们能解决的问题。”\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"缺失了本质的技术\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_8_791-842\",\"quote\":\"技术实际上是人类经验中最完整的已知部分之一。然而关于它的实质——它的存在的最深的本质，我们却知之甚少。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"缺失了本质的技术\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_9_1314-1348\",\"quote\":\"换句话说，如果我们能够理解进化，我们就能理解那个
