最神秘的过程：创新。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"技术的进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_9_3741-3883\",\"quote\":\"我不想对技术中的变异和选择置之不理。技术当然会存在于多个版本当中，出色的表现者也当然会被选择，所以后来的形式的确会按照先前这种形式繁衍下去。但是当我们面对主要问题，如根本性的新技术是如何产生的，这相当于达尔文理论中的生物新物种是如何产生的问题，我们就遇到了阻碍，达尔文机制就不好用了。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"技术的进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_9_433-467\",\"quote\":\"我想解决的当然是关于技术的比较深层次的问题之一，即技术是如何进化的？\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"技术的进化\",\"date\":\"2021-06-04\"},{\"id\":\"29373667:mark:29373667_9_501-1084\",\"quote\":\"是进化的。“进化”这个词有两个一般性的含义[插图]：一个是某事物渐进的变化，就像芭蕾或者英国情歌的“演变”，我称这种进化为狭义的进化，或者更像“发展”（development）；另一个含义是指，某类事物的所有对象联结在一起的过程，而其联结纽带也在于它们诞降（descent）自相同的先前对象的集合[插图]。这是进化的完整含义，也正是我所谓的进化（evolution）。\",\"book\":{\"id\":\"29373667\",\"title\":\"技术的本质（经典版）\",\"author\":\"布莱恩·阿瑟\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/31/YueWen_29373667/t6_YueWen_29373667.jpg\",\"url\":\"https://weread.qq.com/web/reader/4d83260071c034e34d8523f\",\"wordCount\":\"$undefined\"},\"chapter\":\"技术的进化\",\"date\":\"2021-06-04\"},{\"id\":\"MP_WXS_3286016687:mark:MP_WXS_3286016687_bnT1q~ozouTOj52c-RF~DQ_507-605\",\"quote\":\"中央银行主管数字人民币，只有指定的商业银行才能对公众提供服务。也就是说，以后网上支付的时候，你不会只用微信支付和支付宝，还可以用商业银行的客户端。这就是说， 数字人民币就是商业银行的网上支付服务。\",\"book\":{\"id\":\"MP_WXS_3286016687\",\"title\":\"阮一峰的网络日志\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/b4f42cb224d505f5758535f3332383630313636383721d\",\"wordCount\":\"$undefined\"},\"date\":\"2020-09-20\"},{\"id\":\"25023819:mark:25023819_8_3332-3357\",\"quote\":\"所谓科学，就是对理性的加工提炼，并以此去解释世界。\",\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-12\"},{\"id\":\"932993:mark:932993_10_11086-11181\",\"quote\":\"但从前的那种使他俩能谈论“音乐、道德和一堆逻辑以外的事”的亲密感消失了。在这一破裂中幸免的智性上的同情也将彻底消失,原因是第一次世界大战给他俩都带来了变化——加重和加深了他们本性差异的变化。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第五章 挪威\",\"date\":\"2020-08-02\"},{\"id\":\"932993:mark:932993_10_3359-3402\",\"quote\":\"他能够完全专注于自己,或不如说完全专注于他的逻辑;他觉得他的逻辑和他自己实际是一回事。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第五章 挪威\",\"date\":\"2020-08-02\"},{\"id\":\"932993:mark:932993_10_7381-7460\",\"quote\":\"或许你认为这种对我自己的考虑是浪费时间——但我怎么能在是一个人之前是一个逻辑学家!最最重要的是跟自己清算!\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第五章 挪威\",\"date\":\"2020-08-02\"},{\"id\":\"932993:mark:932993_10_7990-8046\",\"quote\":\"回挪威时他决心毕其功于一役,摆脱自己生活里的肮脏妥协。而且——虽然这有点像胡乱出气——他先拿自己和罗素的关系开刀\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第五章 挪威\",\"date\":\"2020-08-02\"},{\"id\":\"932993:mark:932993_10_9200-9256\",\"quote\":\"他承认,罗素的价值判断和他自己的价值判断一样好、一样根深蒂固,但——正因如此——他们之间不可能有任何真正的友谊:\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第五章 挪威\",\"date\":\"2020-08-02\"},{\"id\":\"25023819:mark:25023819_8_1975-2044\",\"quote\":\"通常来说，启蒙运动指的是18世纪的后60年，不过它可以上溯自17世纪的科学革命和理性时代，也可以下延至19世纪上半叶古典自由主义的鼎盛时期\",\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_8_2139-2194\",\"quote\":\"在这个时期内，各种思想纷涌迭现，有些还相互矛盾，但有四个理念将它们连在一起，也就是理性、科学、人文主义和进步。\",\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_8_2613-2650\",\"quote\":\"正是理性让大多数启蒙运动思想家都不相信世界上存在一位干预人类事物的拟人神。\",\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_8_2854-2886\",\"quote\":\"正如孟德斯鸠所言：“假如三角形也有神，那么它的神一定有三条边。”\",\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_8_2906-3032\",\"quote\":\"其中一些人是自然神论者，他们与有神论者不同，认为上帝在将世界这台机器发动起来之后就退居幕后，听凭世界按照自然法则存在和发展下去。另一些人则是泛神论者，他们将“上帝”作为自然法则的代名词。不过，他们中几乎没有人信奉《圣经》中那位制定律法、呼风唤雨的上帝。\",\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_8_639-849\",\"quote\":\"：启蒙是指“人类从自己加于自己的不成熟状态中解脱出来”，从因“懒惰和怯懦”而服从于宗教或政治权威的“条规戒律”的状态中解脱出来。[插图]他宣称，启蒙运动的口号就是：“勇于运用自己的理智！”它的基本条件是思想与言论的自由。“\",\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_7_1174-1193\",\"quote\":\"这个世界只有愚蠢的回答，没有愚蠢的问题\",\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\",\"wordCount\":\"$undefined\"},\"chapter\":\"PART I 启蒙运动\",\"date\":\"2020-07-31\"},{\"id\":\"25023819:mark:25023819_7_1347-1415\",\"quote\":\"当你问出这个问题时，你是在为你的信念寻找理由，也就是力图用理性的方法，来发现和证明那些对你来说重要的东西。事实上，活着的理由实在是太多了\",\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\",\"wordCount\":\"$undefined\"},\"chapter\":\"PART I 启蒙运动\",\"date\":\"2020-07-31\"},{\"id\":\"25023819:mark:25023819_7_2813-2885\",\"quote\":\"启蒙运动的理念是人类理性的产物，但它们总是与人性的其他方面相互斗争：对部族的忠诚、对权威的服从、奇幻无稽的思维，以及将自身不幸归咎于他人的习惯。\",\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\",\"wordCount\":\"$undefined\"},\"chapter\":\"PART I 启蒙运动\",\"date\":\"2020-07-31\"},{\"id\":\"25023819:mark:25023819_7_3227-3476\",\"quote\":\"哈耶克说：“如果要让旧的真理保留在人们的大脑中，就必须在后代人的语言和观念中不断加以重申。[插图]那些曾经明确有效的词语由于使用过多而变成陈词滥调，以至于不再具有确切的含义。虽然其内在理念可能和以往一样正确合理，但这些词语已经不再拥有令人信服的力量，即便它们关涉的问题在今天依然存在。”[插图]\",\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\",\"wordCount\":\"$undefined\"},\"chapter\":\"PART I 启蒙运动\",\"date\":\"2020-07-31\"},{\"id\":\"932993:mark:932993_9_21242-21385\",\"quote\":\"如果我也能看到,我不会在意,但事实却是这样,这很烦人;这已在相当程度上摧毁了我的写作乐趣——我只能继续写我看见的东西,却感觉这可能全是错的,如果再写下去,维特根斯坦会认为我是不诚实的无赖。好吧,好吧——年轻一代在敲门了——我必须及时为他腾出空间,否则我将成为一个大包袱。但此刻我很烦躁。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第四章 罗素的导师\",\"date\":\"2020-07-31\"},{\"id\":\"932993:mark:932993_9_22034-22098\",\"quote\":\"“十年前我能用已有的想法的存货写一本书了,如今我对精确有了更高的标准。”这个标准是维特根斯坦设定的,但现在他觉得自己没能力实践。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第四章 罗素的导师\",\"date\":\"2020-07-31\"},{\"id\":\"932993:mark:932993_9_25087-25132\",\"quote\":\"火车上的争吵似乎标志了他俩关系的某种转折点。品生特的日记从此用“路德维希”指代维特根斯坦。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第四章 罗素的导师\",\"date\":\"2020-07-31\"},{\"id\":\"932993:mark:932993_9_28299-28359\",\"quote\":\"他要流放自己,远离他认识的所有人生活若干年——比如说在挪威。他要彻底地独居,就他自己——隐居生活——什么也不做只做逻辑。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第四章 罗素的导师\",\"date\":\"2020-07-31\"},{\"id\":\"932993:mark:932993_9_29336-29380\",\"quote\":\"“性欲随身体的接近而增加,爱则在爱人缺席时最强;爱需要分离、需要一定的距离而得以保持”。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第四章 罗素的导师\",\"date\":\"2020-07-31\"},{\"id\":\"932993:mark:932993_8_25195-25237\",\"quote\":\"罗素劝他不要非等到解决了所有哲学问题之后才开始写作。罗素告诉他,那一天永远不会到来:\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-07-30\"},{\"id\":\"932993:mark:932993_9_11663-11704\",\"quote\":\"两人的合作走到头了。在逻辑的领域,维特根斯坦远不再是罗素的学生,而成了罗素的老师。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第四章 罗素的导师\",\"date\":\"2020-07-30\"},{\"id\":\"932993:mark:932993_9_12496-12529\",\"quote\":\"看上去,维特根斯坦的逻辑工作完全未增加他在思考政治问题时的严格性。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第四章 罗素的导师\",\"date\":\"2020-07-30\"},{\"id\":\"932993:mark:932993_9_2606-2683\",\"quote\":\"据罗素讲,他“在骚动的沉默中,像野兽般在我屋里踱来踱去三个小时”。有一次罗素问:“你是在思考逻辑还是你的罪?”“两者皆是。”维特根斯坦回答,继续踱他的步。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第四章 罗素的导师\",\"date\":\"2020-07-30\"},{\"id\":\"932993:mark:932993_9_4599-4693\",\"quote\":\"就在这个学期,他神经烦躁最盛之时,他也成功地获得了某些新的和重要的友谊。尤其是获得了约翰·梅纳德·凯恩斯的尊重和友爱,在维特根斯坦一生的大部分时间里,凯恩斯都是一个宝贵的、施以援手的朋友。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第四章 罗素的导师\",\"date\":\"2020-07-30\"},{\"id\":\"932993:mark:932993_8_15899-15946\",\"quote\":\"就在那时他告诉品生特,在想自杀的孤独和痛苦中度过了九年之后,罗素对他从事哲学的鼓励是他的救星。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-07-28\"},{\"id\":\"932993:mark:932993_8_16085-16109\",\"quote\":\"费特根斯坦几乎没有业余爱好,这很能解释他的孤独。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-07-28\"},{\"id\":\"932993:mark:932993_8_16520-16631\",\"quote\":\"若一人赢得整个世界却失去自己的灵魂,于他又有何益￼”\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-07-28\"},{\"id\":\"932993:mark:932993_8_18316-18343\",\"quote\":\"他的本性是彻头彻尾的善;这就是他为什么看不到道德的必要\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-07-28\"},{\"id\":\"932993:mark:932993_8_18378-18420\",\"quote\":\"他的态度非常自由;他觉得原则这种东西是无意义的,因为他的冲动是强烈的,从不是可耻的。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-07-28\"},{\"id\":\"932993:mark:932993_8_18664-18916\",\"quote\":\"维特根斯坦对于自我忠实￼(以及上述例子里的忠诚￼)的强调,并非是反对道德,而是在建构一种不同的道德\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-07-28\"},{\"id\":\"932993:mark:932993_8_18942-19049\",\"quote\":\"即便在这个也许最内省的时期,罗素也认为保有灵魂依赖于一个“真心追求的大的目标”——他倾向于在自我之外寻找支撑自己的东西。维特根斯坦则(也是很典型地)坚持认为,保持不堕落的可能性完全依靠自我——依靠在内部觅得的品质。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-07-28\"},{\"id\":\"932993:mark:932993_8_19740-19790\",\"quote\":\"维特根斯坦辩称学习数学能提高人的品味:“因为好品味是真诚的品味,因此任何使人诚实思考的事都滋养它。”\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_572_2630-2682\",\"quote\":\"从这时起，苦役犯们就非常尊敬若-斯基，对他总是彬彬有礼。他们特别中意的是，他在受刑时竟一声也没有叫喊。 \",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(43)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_572_3259-3321\",\"quote\":\"我所在的第二类的苦役犯是由军事管制下的城堡中的囚犯所构成的，其生活比其他两类，即第三类（工厂类）和第一类（矿工类）要艰苦得多\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(43)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_572_3329-3429\",\"quote\":\"所有的囚犯都艰苦得多，恰恰是因为这一类囚犯的管理和生活制度全都是军事化的，与俄军的囚犯连很相似。军事管制更严酷，限制更多，总是戴着镣铐，总是在士兵的监视之下，牢房总是上锁，而另外两类的管理就比较宽松。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(43)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_573_4179-4237\",\"quote\":\"以前他在这座城市里就是市长啊，这一切记忆犹新……这次打击是突如其来的。消息传来，监狱里一片欢腾。这是一个胜利的节日！\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(44)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_573_4300-4421\",\"quote\":\"我们后来遇见他穿着老百姓的破旧的常礼服，头戴有一个小帽徽的大檐帽。他凶狠地瞪着囚犯们。可是他一旦脱下身上的军服，便威风扫地了。穿上军服，他是雷霆，是上帝。身穿常礼服，他突然变得什么也不是，有些像听差了。真奇怪，对这种人来说，军服是何等重要啊。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(44)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_574_14-79\",\"quote\":\"我们的少校教官被撤换不久，我们监狱就发生了根本性的变化。取消了服苦役的制度，取而代之的是建立军事管辖的囚犯连，以俄军囚犯连为基础。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(45)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_574_2270-2346\",\"quote\":\"我已经说过，囚犯在监狱里蹲上两三年，就会珍惜这些岁月，不由得开始盘算，最好还是避免麻烦和危险，平安地度过剩余的时间，最后合法地获释，出狱后作为移民定居。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(45)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_1128-1196\",\"quote\":\"可是很奇怪：流逝的时间越多，离刑期越近，我却越来越沉得住气了。到了最后几天，我甚至感到吃惊而责备自己：我觉得，我好像变得完全平静而冷漠了\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_123-245\",\"quote\":\"我在囚犯中已经有了很多朋友和知己，他们都认定我是个好人。其中有不少人都与我以诚相待，真心地爱护我。一名工程兵在送我和我的一个难友出狱时几乎要哭了，后来，我们出狱后还在这座城市的公家房子里住了整整一个月，他几乎天天都拐到我们这里来，就为了看看我们\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_1595-1669\",\"quote\":\"在这里我要顺便指出，由于幻想和疏阔，我们在监狱里会觉得，自由比真实的自由更自由，就是说，比实际上的、现实中的自由更自由。囚犯们夸大了真实的自由的概念\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_2050-2181\",\"quote\":\"在这一堵堵墙壁之内，曾有多少青春被白白葬送，多少伟大的力量在这里徒然遭到毁灭！必须把话都说出来：要知道，这些人绝非平庸之辈。要知道，这也许就是我国全体人民中最有才华、最坚强的人们。可是强大的力量白白地遭到毁灭，不正常地、非法地、无可挽回地惨遭毁灭。这是谁之罪？ \",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_309-334\",\"quote\":\"在最后一段时间我所得到的优待，超过了以往的全部刑期\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_601-696\",\"quote\":\"我字斟句酌，努力在字里行间探寻隐秘的含意以及对往日生活的暗示；我在寻找在我那个时代曾激动人心的事件的痕迹，而现在我是多么悲伤而真切地意识到了，我与新的生活是那么格格不入，成了弃家出走的浪子。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_844-883\",\"quote\":\"一旦搜出来，一定会查问：“书是哪儿来的？在哪里买的？可见，你是有联络的了……”\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_565_1906-1993\",\"quote\":\"可以肯定地说，考虑到困难，考虑到问题的严重性，决心逃跑的人只有百分之一；然而其余的九十九个人至少也会幻想怎样逃跑，以及逃往哪里；哪怕仅仅在希望中，在可能性的想象中得到一点安慰\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(36)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_565_2044-2133\",\"quote\":\"已判处刑期的犯人只是在入狱初期也许会逃跑。服苦役两三年以后，该囚犯就珍惜这些岁月了，渐渐地暗自承认，最好还是依法服满刑期，出狱后到移民点去定居，不愿冒险逃跑并承受失败的毁灭性后果\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(36)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_565_205-224\",\"quote\":\"在春天我们的监狱似乎会更经常地发生纷争\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(36)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_565_4569-4618\",\"quote\":\"在服苦役期间，为了承受这可诅咒的生活中的一切恶劣的物质条件，对体力的需要不下于对精神力量的需要。 \",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(36)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_566_2027-2114\",\"quote\":\"按说这有什么用呢？然而对将军以及一般高级官员的详细了解足以衡量一个人的知识水平、见识以及他入狱前在社会上的地位。总之，关于高级首长的谈论被认为是监狱里最高雅、最重要的谈论。 \",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(37)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_566_3892-3953\",\"quote\":\"九点多钟清点人数之后，把我们赶回各自的牢房，上锁过夜。夜很短；我们在早晨四点多钟就被叫醒，而入睡的时间决不会早于十一点钟。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(37)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_566_42-136\",\"quote\":\"之所以屡次谈到这条河的河岸，是因为只有在这里才能看到上帝的世界，那纯净、明朗的远方，那渺无人烟的自由的大草原，它的荒凉使我产生了一种奇特的印象。只有在这河岸上才能拿屁股对着城堡而看不到它。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(37)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_568_4770-4839\",\"quote\":\"一名囚犯买下了全部羊肉，付给监狱一个半卢布。这些钱全都拿来买了面包圈，而买了瓦西卡的囚犯，再零售给难友们做烤羊肉。羊肉的味道确实非常鲜美。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(39)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_569_4758-4801\",\"quote\":\"最娇生惯养、四体不勤的人，在满脸汗水地劳动一天之后，就会吃黑面包，喝着有死蟑螂的菜汤。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(40)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_570_115-247\",\"quote\":\"然而高贵的人、贵族就不同了。不管他多么正直、善良、聪明，都会成年累月地受到所有的人乃至整个集体的仇视和蔑视；他得不到理解，主要的是——得不到信任。他不是朋友也不是伙伴，即使随着岁月的流逝，终于使他们不再欺辱他，然而他终究不是自己人，永远痛苦地意识到自己被疏远的孤独\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(41)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_562_1269-1315\",\"quote\":\"我国普通百姓所非常喜欢和相信的拔火罐、贴水蛭、热敷和放血，我们这里的人都愿意甚至很高兴接受。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(33)\",\"date\":\"2020-07-26\"},{\"id\":\"934366:mark:934366_562_1330-1407\",\"quote\":\"同样是这些人，他们能顽强地忍受木棒和树条所引起的剧痛，而拔火罐时却往往会埋怨、忸怩甚至呻吟。他们这是太娇气，或干脆就是矫情呢，——我就不知道该如何解释了。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(33)\",\"date\":\"2020-07-26\"},{\"id\":\"934366:mark:934366_563_575-812\",\"quote\":\"在一片寂静中听到这病态、沙哑而酸楚的声音是很怪异的。而这时在某个角落，也有些人未曾入睡，躺在各自的床上闲谈。一个人开始讲述自己的往事，讲到遥远的过去，讲到流浪生涯，讲到妻儿和往日的风习。单凭这远处的低语声，你就会感到，他所讲到的一切，对他来说，已经一去不复返了，而他自己，这个讲故事的人，——已是孑然一身。只听到轻微而单调的低语声，仿佛远方的流水潺潺……记得，我曾在漫长的冬夜听到一个故事。我立刻觉得，这是热病中的一个梦，仿佛我患疟疾躺在床上，在发烧和谵妄中梦见了这一切……\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(34)\",\"date\":\"2020-07-26\"},{\"id\":\"934366:mark:934366_561_0-86\",\"quote\":\"我讲到了刑吏。刑吏的特性几乎以萌芽的形式存在于每一个现代人身上。但人的兽性的发展并不相同。如果一个人的兽性在其发展中压倒他其余的所有特性，那么这个人当然就会变得可怕而丑恶。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(32)\",\"date\":\"2020-07-25\"},{\"id\":\"934366:mark:934366_561_1973-2070\",\"quote\":\"可是刑吏即使为减轻处罚而受贿，第一下打击他还是会抡起胳膊使出全力。这在他们之间甚至成了一种常规。他会减轻随后的打击力度，尤其是在他已经受贿的情况下。然而这第一下，不论受贿与否，他是要使出全力的。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(32)\",\"date\":\"2020-07-25\"},{\"id\":\"934366:mark:934366_560_1167-1298\",\"quote\":\"那些在执行前一半之后医好背伤的人，便出院去承受后一半的惩罚，在出院的当天和前夜往往面色阴沉，愁眉苦脸，沉默寡言。他们会显出某种程度的迟钝、一种反常的心神不定。这样的人不愿与人交谈，多半是默然不语；最奇怪的是，囚犯们也从不主动与这样的人谈话，不想涉及他面临的遭遇。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(31)\",\"date\":\"2020-07-24\"},{\"id\":\"934366:mark:934366_560_1555-1716\",\"quote\":\"早在关押受审期间，他已经听到关于长官的种种手段的传言；那时他就有了死的准备。但是在挨过前一半惩罚后，他振作起来了。他回到医院时已被打得半死；我还从未见过那样可怕的伤口；但是他心里充满了喜悦，希望能活下来，因为传言不实，他这不是活着离开了刑场吗，于是眼下，在长期关押受审之后，他已经开始梦想旅途、逃亡、自由、田野和森林了……\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(31)\",\"date\":\"2020-07-24\"},{\"id\":\"934366:mark:934366_560_2614-2674\",\"quote\":\"人尝试了以极具侮辱性的形式凌辱另一个同样具有上帝形象的生物的权力和无限可能性，那么他就不由自主地丧失了支配自己情感的能力\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(31)\",\"date\":\"2020-07-24\"},{\"id\":\"934366:mark:934366_560_2675-2701\",\"quote\":\"施暴是一种习惯；它天然地能发展，终于会发展成一种病态\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(31)\",\"date\":\"2020-07-24\"},{\"id\":\"934366:mark:934366_560_834-929\",\"quote\":\"我已经说过，在面临惩罚时，很少有人能保持冷静，甚至那些已经屡次挨打而且打得很重的人也不例外。这时犯人总是会感到一种强烈的，但纯粹是生理上的恐惧，一种压倒一切精神特点的不由自主和不可遏止的恐惧\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(31)\",\"date\":\"2020-07-24\"},{\"id\":\"934366:mark:934366_557_1519-1562\",\"quote\":\"一个已判决的苦役犯患有任何疾病，都不可以解除镣铐。甚至肺病患者也是戴着镣铐死在我的面前\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(28)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_557_1650-1783\",\"quote\":\"镣铐本身并不是很沉。一般也就是八磅到十二磅。健康的人带上十磅的东西是不觉得沉重的。不过我听说，戴着脚镣的腿几年后就开始萎缩。我不知道这是不是真的，但这是有可能的。即使分量不重，哪怕只有十磅，永久地套在脚上，毕竟会反常地增加肢体的重量，日子久了自然会产生有害的影响……\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(28)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_557_183-279\",\"quote\":\"囚犯病房不像普通病房，有病的囚犯在病中也要遭受惩罚。是谁最先规定了这个制度的呢，我不知道，只知道在这方面并没有任何明文规定的制度，形式主义的无益有害的本质从来没有像在这种事情上表现得如此严重。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(28)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_557_2180-2325\",\"quote\":\"镣铐仅仅是一种示众、羞辱以及肉体上和精神上的压力。至少初衷是这样。镣铐从来就不能妨碍任何人逃跑。最迟钝、最笨拙的囚犯也不费什么事就能很快地把镣铐锯断或用石头砸开。脚镣是起不了什么预防作用的；既然是这样，既然脚镣的作用仅仅是为了对已判决的苦役犯进行惩罚，那么我又要问了：难道是要惩罚将死之人？\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(28)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_557_3824-3937\",\"quote\":\"但这时人们开始抬尸体了，连铺板一起抬了起来；在一片寂静中稻草发出沙沙的声音，脚镣拖在地板上铿然作响……有人把脚镣提了起来。尸体被抬走了。突然，大伙儿都大声说起话来。只听已经在走廊里的士官在打发人去找铁匠。应该替死者除掉脚镣……\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(28)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_558_1049-1087\",\"quote\":\"我只是想说，普通民众的不信任和敌视更多的是针对医院的行政部门，而不是针对医生\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(29)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_558_2871-2957\",\"quote\":\"这个可怜的人受尽了可怕的折磨，还是一连几天顽强地忍受着这种酷刑，最后才愿意出院。眼睛一天后就痊愈了。等到脖子上的伤口愈合，他立即回到军营的禁闭室，第二天还要出去挨那一千棒。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(29)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_558_308-441\",\"quote\":\"普通民众即使身患重病，也宁可一连几年去找巫医或服用自家的民间草药（草药是绝不可轻视的），而不去就医或住院。这里有一个与医学无关的非常重要的情况，即：老百姓普遍地不信任一切带有官方行政印记的东西；然而除此之外，老百姓还由于各种可怕的事故和传说而对军医院产生了恐惧和偏见\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(29)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_558_811-930\",\"quote\":\"那些放弃自己职责的人，那些羊群中的狼，不管提出什么理由来为自己辩护，无论怎样自我辩解，比如归咎于环境，说环境也腐蚀了他们，他们都总是错的，特别是因此而泯灭了仁爱之心的话。仁爱、和蔼可亲、对病人的兄弟般的同情，有时比任何药物都更有益于病人。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(29)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_559_0-64\",\"quote\":\"我再补充一点：所有这些挨过打的人在讲到他们怎样挨打、讲到那些毒打他们的人的时候，我总是惊讶于他们是那样非凡地和善、那样心平气和。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(30)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_559_1185-1329\",\"quote\":\"除他之外也曾有过勤奋而热心地忠于职守的执行官，当然这是在从前，在那个并不遥远的从前，关于那个时期的“传说还很新鲜，却令人难以置信”。不过，他们的勤奋和热心多半是质朴的，并不特别着迷。而这个中尉在执行任务时却有点像高雅的美食家。他爱好、狂热地爱好执行的艺术，而且他的爱好完全是为艺术而艺术。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(30)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_559_3852-4005\",\"quote\":\"他为人朴实，甚至还自以为是一个善良的人。可是也有这样的情况，长官中偶尔也会有不仅善良，而且宽宏大度的人；那又怎样呢？——大家都不喜欢他，简直还会嘲笑他。问题在于，斯梅卡洛夫善于使我们这里所有的人都觉得他是自己人，而这是一种重要的才能，或者更准确地说，是一种天赋的能力，拥有这种能力的人甚至连想也没有想到过它\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(30)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_553_1414-1482\",\"quote\":\"倘若我们的学者有人对民间戏剧进行新的、比迄今更细致的研究，那将是非常有益的大好事，民间戏剧是有的，是存在的，而且它也许并不是无足轻重的。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(24)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_553_1972-2020\",\"quote\":\"平日天色向晚监狱就早早地上锁了。圣诞节是例外：直至出现晚霞的时候也不上锁。其实这是对演剧的优待。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(24)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_553_4134-4237\",\"quote\":\"只要剥掉非其固有的假象的外壳，更细心、更贴近而不抱成见地看一看实质本身，——任何人都能在人民身上看到他所料想不到的东西。我们的精英能教给人民的东西不多。我甚至敢于断言，——恰恰相反，他们自己还要向人民学习。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(24)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_554_2004-2050\",\"quote\":\"不过我最感兴趣的是观众；这时人人都敞开了心扉。他们忘我地尽情欢乐。喝彩声越来越频繁地轰然而起\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(25)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_554_801-1011\",\"quote\":\"至于铃鼓，简直创造了奇迹：它时而在手指上旋转，时而只见拇指在鼓皮上蹭过，时而发出急骤、清脆而单一的击鼓声，时而这强烈、清晰的声音仿佛豌豆陡然洒落，化为无数细碎、震颤的簌簌声。最后还出现了两架手风琴。说实话，在此之前，我对简单的民间乐器的能量是没有概念的；音响的和谐、协调、主要是对乐曲的内涵本身的理解和表现的那种魄力和独特，简直令人叫绝。那时我才第一次完全理解了，豪放、剽悍的俄罗斯民间舞曲的无比豪放而剽悍的特点究竟何在\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(25)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_555_2581-2705\",\"quote\":\"我渐渐地回忆起了一切：最后一天、节日、这整整的一个月……我惊恐地抬起头来，在监狱六支蜡烛的抖动、微弱的烛光下扫视着我的睡梦中的难友们。我看着他们苍白的脸、他们破旧的被子、这十足的潦倒和赤贫，——我凝目注视——仿佛我想认定这不是噩梦的延续，而是实情。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(26)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_555_2827-2865\",\"quote\":\"“我毕竟不是一辈子在这里，不过就是那么几年！……”我想，又把头垂落在枕头上。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(26)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_555_4433-4520\",\"quote\":\"病人中爱喝茶的人为数不多。至于小烟斗和烟丝袋，几乎人人都有，甚至连肺痨病人也不例外，都藏在病床底下。医师和其他管理人员几乎从来不检查床铺，即使碰到有人拿着小烟斗，也装作没看见\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(26)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_556_138-229\",\"quote\":\"他因假币案被起诉，躺在这里已近一年，看来什么病也没有，但硬是对医师说，他患有动脉瘤。他的目的达到了：他躲过了苦役和体罚，再过一年将被流放到T城去，在一所医院附近的什么地方靠公家养着。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(27)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_556_3263-3350\",\"quote\":\"我特别讨厌在这些罩衫里有时会发现的那些肥得出奇的大虱子。囚犯们都满怀喜悦地消灭它们，每当囚犯在厚实而笨拙的指甲下啪的一声磕死一个虱子时，甚至从他的脸色就能看出，他是多么高兴。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(27)\",\"date\":\"2020-07-18\"},{\"id\":\"MP_WXS_3224065282:mark:MP_WXS_3224065282_uV27r0miw47Jxg33Tst7dA_2972-3011\",\"quote\":\"用我自己的说法，就是地摊经济能否重新塑造一个 “附近”，重新塑造微观的社会生态\",\"book\":{\"id\":\"MP_WXS_3224065282\",\"title\":\"知识分子\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/58e427e224d505f5758535f33323234303635323832c97\",\"wordCount\":\"$undefined\"},\"date\":\"2020-07-16\"},{\"id\":\"MP_WXS_3224065282:mark:MP_WXS_3224065282_uV27r0miw47Jxg33Tst7dA_3450-3522\",\"quote\":\"中国这么大一个国家，永远不能够只从经济效益来考虑经济，必须要考虑到这么多人，怎么让他们有事情可做。大家一起做一些事，即使没有效率也只能先这么做。\",\"book\":{\"id\":\"MP_WXS_3224065282\",\"title\":\"知识分子\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/58e427e224d505f5758535f33323234303635323832c97\",\"wordCount\":\"$undefined\"},\"date\":\"2020-07-16\"},{\"id\":\"MP_WXS_3224065282:mark:MP_WXS_3224065282_uV27r0miw47Jxg33Tst7dA_3808-3866\",\"quote\":\"30年来，城市对这种非正规经济的不断的打击、改造升级和吸纳，背后最重要的一个逻辑就是土地的地租逻辑，就是土地的增值。\",\"book\":{\"id\":\"MP_WXS_3224065282\",\"title\":\"知识分子\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/58e427e224d505f5758535f33323234303635323832c97\",\"wordCount\":\"$undefined\"},\"date\":\"2020-07-16\"},{\"id\":\"MP_WXS_3224065282:mark:MP_WXS_3224065282_uV27r0miw47Jxg33Tst7dA_5453-5499\",\"quote\":\"街道经济也好、地摊经济也好，最有意思的地方是它的社会性，它是靠人气烟火气来达到它的经济效益。\",\"book\":{\"id\":\"MP_WXS_3224065282\",\"title\":\"知识分子\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/58e427e224d505f5758535f33323234303635323832c97\",\"wordCount\":\"$undefined\"},\"date\":\"2020-07-16\"},{\"id\":\"MP_WXS_3224065282:mark:MP_WXS_3224065282_uV27r0miw47Jxg33Tst7dA_7222-7375\",\"quote\":\"“理性” 和 “非理性” 都是比较主观的标签了。为什么我们觉得这种大型市场、正规经济是理性的？因为它有一套办法把自己的做法明确地说出来。但从普通人的立场看，它怎么会是理性的呢？用这种方式去占用空间，用那么多钢筋水泥，那么大量的能源消耗，那么高额的维护成本，那么高的金融风险，现在在中国确实都是很真实的问题。\",\"book\":{\"id\":\"MP_WXS_3224065282\",\"title\":\"知识分子\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/58e427e224d505f5758535f33323234303635323832c97\",\"wordCount\":\"$undefined\"},\"date\":\"2020-07-16\"},{\"id\":\"MP_WXS_3224065282:mark:MP_WXS_3224065282_uV27r0miw47Jxg33Tst7dA_8015-8049\",\"quote\":\"有时候我们老想着怎么样去降低密度，这可能跟我们的基本条件是不符合的。\",\"book\":{\"id\":\"MP_WXS_3224065282\",\"title\":\"知识分子\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/58e427e224d505f5758535f33323234303635323832c97\",\"wordCount\":\"$undefined\"},\"date\":\"2020-07-16\"},{\"id\":\"MP_WXS_3224065282:mark:MP_WXS_3224065282_uV27r0miw47Jxg33Tst7dA_8963-9040\",\"quote\":\"大部分城市居民去家乐福买东西也是可以买得起的，生活也可以跟得上正规化的步伐。但是这次疫情给我们一个教训就是，这种方式可能是成本相当高，而且确实比较有风险。\",\"book\":{\"id\":\"MP_WXS_3224065282\",\"title\":\"知识分子\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/58e427e224d505f5758535f33323234303635323832c97\",\"wordCount\":\"$undefined\"},\"date\":\"2020-07-16\"},{\"id\":\"934366:mark:934366_552_3346-3396\",\"quote\":\"仅仅按法律条文执法而不领会其意义、不理解法律的精神实质，只会直接导致混乱，而且不可能有任何别的结果。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(23)\",\"date\":\"2020-07-15\"},{\"id\":\"934366:mark:934366_552_3523-3725\",\"quote\":\"我敢肯定地说，戏剧演出以及演出获得准许所激起的感激心情，才使监狱在节日期间没有发生任何严重的事态：一次恶性的争吵、一起盗窃案也不曾有过。我亲眼看到，有些过于放纵和吵闹的囚犯被自己人所制止，而其唯一的理由就是，否则演出会遭到禁止。士官要求囚犯们保证，一定要保持肃静，举止得体。他们高兴地表示同意，严格地遵守诺言；他们的保证得到信任，也使他们颇为得意。不过，应当说，长官并没有因为允许演出而有任何破费和损失。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(23)\",\"date\":\"2020-07-15\"},{\"id\":\"MP_WXS_3224065282:mark:MP_WXS_3224065282_uV27r0miw47Jxg33Tst7dA_1146-1208\",\"quote\":\"而在义乌，因为甘蔗种植比较多，有红糖剩余，义乌人就拿这个糖出去，收鸡毛回来混合其他肥料用来改善酸性土壤，叫做 “鸡毛换糖”。\",\"book\":{\"id\":\"MP_WXS_3224065282\",\"title\":\"知识分子\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/58e427e224d505f5758535f33323234303635323832c97\",\"wordCount\":\"$undefined\"},\"date\":\"2020-07-15\"},{\"id\":\"934366:mark:934366_551_252-300\",\"quote\":\"我想，整个城市没有哪一位商人和市民的家庭主妇没有送来自己的面包，向“不幸的”囚犯们祝贺伟大的节日\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(22)\",\"date\":\"2020-07-07\"},{\"id\":\"934366:mark:934366_551_3224-3289\",\"quote\":\"已到暮色苍茫的时候。在饮酒狂欢之中沉重地透露出忧伤、郁闷和昏昏沉沉的醉意。一个在一小时前欢笑的人，已经由于饮酒过量而在那里放声大哭\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(22)\",\"date\":\"2020-07-07\"},{\"id\":\"934366:mark:934366_546_1797-1834\",\"quote\":\"可是这一次他不愿忍受，公然在光天化日之下，在展开的队列前面捅死了自己的团长\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_2769-2821\",\"quote\":\"像彼得罗夫这样的人，理智起作用只有在他们还没有什么强烈愿望的时候。世上没有什么能阻碍他们实现自己的愿望。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_2915-2977\",\"quote\":\"这些人有一种与生俱来的观念，毕生都在无意识地驱使他们来去奔波；他们就这样一辈子跑来跑去，直至找到完全合乎自己愿望的事业为止。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_3301-3355\",\"quote\":\"晚上他亲自向我承认了偷书的事，不过没有一点窘态，也毫无悔意，完全是无所谓的样子，好像在讲一桩极其普通的事情。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_3737-3834\",\"quote\":\"他能明确地提出问题，但对我所提供的知识并不感到惊奇，甚至只是三心二意地听听而已……我还觉得，他不假思索地认定，不能像跟别人谈话那样跟我谈话，除了谈书本以外，我什么也不懂，也不会懂，所以多谈无益。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_4125-4191\",\"quote\":\"这些人的生活中有时会发生这样的情况，他们在某种普遍性的激烈行动或变革的时刻，突然鲜明而洒脱地尽显其本色，从而立即投入自己的豪迈的活动\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_4231-4317\",\"quote\":\"他们质朴地开始而不大肆张扬，然而首先驰马踏破主要障碍，不假思索、无所畏惧地直奔一切艰难险阻，——于是群起追随，不顾一切地前进，活动于决定性的战线，往往就在那里抛下自己的头颅\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_145-175\",\"quote\":\"有的人并没有杀过人，却比一个身负六条命案而入狱的人更加可怕。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_3281-3441\",\"quote\":\"军官的军衔似乎搅乱了他们的内脏，同时也搅乱了他们的头脑。长期在重负下呻吟并走过一切服从的阶段之后，他们突然看到自己成了军官、指挥官、贵族，由于不习惯和最初的陶醉而夸大自己的权威和重要性；不言而喻，这只是对服从于他们的下级而言。在上级面前，他们仍然竭力奉承，虽然这已经是完全不必要的了，对不少长官来说，这甚至是令人厌恶的。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_3736-3883\",\"quote\":\"有些人认为，比如说，只要囚犯们伙食好、待遇好，一切都依法办理就行了。这也是一种误解。任何一个人，不管他是谁，也不管他的地位多么卑微，哪怕是本能地、下意识地，但毕竟需要对自己人格的尊重。囚犯自己知道他是囚犯，为人所不齿，也知道自己在长官面前的地位；然而任何烙印、任何镣铐都不能使他忘记他是一个人。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_376-489\",\"quote\":\"他杀死的第一个人是压迫者、仇敌；虽然这也是犯罪，然而是可以理解的；这是事出有因；可是后来他连并非仇敌的人也杀，遇到随便什么人都杀，为取乐、为一句粗话、为一个眼神、为凑成双数而杀人，或者干脆：“从路上滚开，别让我碰到，我来了！”\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_4190-4236\",\"quote\":\"囚犯们更喜欢这样的长官，就是说，既保持了自己的尊严，也不让他们受委屈，因而一切都高尚而又得体\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_4939-4989\",\"quote\":\"卢奇卡虽然杀了六个人，可是在监狱里从来没有人怕过他，尽管他在心里也许很希望享有“可怕的人”的名声……\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_503-609\",\"quote\":\"仿佛一旦越过他认为不可逾越的界限，他就开始自我欣赏，在他的心目中已无神圣可言了；仿佛在撺掇他一下子越过一切法度和权威，享受放荡不羁的无限的自由，享受那种由于恐惧而心跳停止的感觉，他是不可能不对自己怀有这样的恐惧的\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_779-850\",\"quote\":\"他装出一副无所畏惧的样子，而这个“无所畏惧”的人有时自己在盼着惩罚快些到来，盼着被人干掉，因为他自己终于觉得，这假装的无所畏惧是不可承受之重。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_850-910\",\"quote\":\"奇怪的是，这种情绪，这种装模作样会一直持续到走上断头台，然后突然中断：仿佛这确实就是正式的期限，是由一定规则预先确定的。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_548_1798-1854\",\"quote\":\"生平认识很多犹太人的卢奇卡时常逗弄他，完全不是出于恶意，就是为了逗乐，好像在逗弄小狗、鹦鹉、训练过的小动物一样。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(19)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_548_2210-2231\",\"quote\":\"“那就好，有了上帝和钱，到哪里都不错。” \",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(19)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_548_4440-4496\",\"quote\":\"铁环不是紧箍在腿上，在铁环和腿之间能塞进一根手指；这样铁环就在腿上碰击和摩擦，一天下来，没有衬垫的囚犯会把腿擦伤\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(19)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_548_582-641\",\"quote\":\"每逢周末他在押送下到自己在城里的祈祷室（这是法律所允许的），生活得十分惬意，不过他焦急地盼着，在服完十二年刑期后结婚。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(19)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_549_0-22\",\"quote\":\"当我们打开澡堂的门的时候，我以为我们进了地狱\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(20)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_549_533-590\",\"quote\":\"浴床上约有五十把浴帚同时举起又落下；人人都在如醉如痴地抽打着自己。蒸汽时时刻刻都在加热。这已不是热气；这是地狱之火\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(20)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_550_1406-1434\",\"quote\":\"圣诞节终于到了。囚犯们几乎在圣诞节的前一天就不出去干活了\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(21)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_550_2225-2308\",\"quote\":\"除了对伟大节日与生俱来的崇敬之外，囚犯还下意识地感悟到，他通过对节日的这种维护而与整个世界相关联，因而他并不是无家可归的弃儿、不可救药的浪子，在监狱里也和在社会上一样\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(21)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_550_2706-2740\",\"quote\":\"有一次，生平仅有的一次，他试图用自己的头脑生活——却遭到了牢狱之灾。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(21)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_550_4078-4150\",\"quote\":\"总的说来，大家都举止得体，态度温和，竟异乎寻常地彬彬有礼。既听不到平时的叫骂，也听不到平时的争吵。大伙儿都明白，这是一个重大的日子、伟大的节日。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(21)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_550_4180-4290\",\"quote\":\"我要顺便指出，在囚犯之间几乎完全看不到友情，我不是说广泛的友情，这更是无从谈起，我说的是私人之间的友情，某一个囚犯和另一个囚犯成为朋友。这在我们之间几乎是完全没有的，而这是一个值得注意的特点：在监狱外面是没有这种情况的。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(21)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_544_23-65\",\"quote\":\"一般地说，为什么所有快乐的人，在这最初的几天里我已经注意到了，都在某种程度上受到蔑视\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(15)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_544_3111-3160\",\"quote\":\"不管我在哪里凑上去帮他们干活，到处都不是我待的地方，我在哪里都碍事，几乎到处都有人骂骂咧咧地赶我走\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(15)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_544_3688-3818\",\"quote\":\"决心要尽可能保持朴实和独立的作风，丝毫不露出特别想要接近他们的态度；但也不排斥他们，如果他们自己想接近我的话。决不惧怕他们的威胁和敌视，而且要尽可能地行若无事。决不在某些重要问题上与他们同流合污，也决不迁就他们的某些习惯和习气，总之，决不无原则地强求他们的友谊\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(15)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_544_4691-4742\",\"quote\":\"简直不知道我是怎么了，可我竟然扑上去亲吻它，搂着它的头；它跳起来，把两条前腿搭在我的肩上，舔着我的脸。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(15)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_544_4876-4928\",\"quote\":\"在人世间我现在只剩下这仅有的爱我、依恋我的生物了，只剩下我的朋友、我唯一的朋友——我的忠诚的狗沙里克了。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(15)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_1204-1286\",\"quote\":\"姑且假定，这也是一种生活——服苦役的囚徒生活；但一个被流放一定期限的苦役犯，不论他是谁，本能地就绝不会把自己的遭遇看成现实生活的一部分，看成某种实际的、稳定的东西。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_1482-1554\",\"quote\":\"到涅尔琴斯克去差不多要走半年，与大伙儿结伴同行比蹲监狱可就好多啦！以后在涅尔琴斯克服完刑期，到那时……要知道，有的白发苍苍的老者也在这样期盼着呢\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_1763-1921\",\"quote\":\"其实每个人都渴望坐满自己的刑期。不禁要问，这是为什么呢？这是因为：那时他们就能走出低矮的石拱下的闷人潮湿的牢房，能在监狱的院子里走一走……仅此而已。他们是永远不会被放出监狱了。他们自己知道，解除铁链以后，将永远被关押在监狱里，直至老死，而且还要戴着镣铐。他们是知道这些的，然而还是强烈地渴望尽快熬过这戴着铁链的刑期。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_1975-2026\",\"quote\":\"我感到劳动能拯救我，能增强我的健康和体质。经常的焦虑不安、精神上的刺激、牢房里污浊的空气会彻底毁了我。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_3431-3506\",\"quote\":\"Б是一位非常有教养而高尚的人，生性豁达，但疾病毁了他的健康，使他饱受折磨。我们在一起操作砂轮，这使我们甚至乐此不疲。这个活儿对我的健康是极为有益的。 \",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_4320-4387\",\"quote\":\"如果他发觉，比方说我想独自待着，那么他和我谈上两分钟，便立刻离开我，而且每一次都感谢我对他的关怀，其实我从来没有关怀过监狱里的任何人。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_670-780\",\"quote\":\"他的剃刀锃亮、有人来剃头的时候，他就满意极了：他的肥皂沫是热乎乎的，他的手柔和而灵巧，剃头的动作像丝绒一般地轻柔。看来他是在享受这门艺术，并引以为自豪，他漫不经心地接过赚来的一个戈比，仿佛问题真的在于艺术，而不在于戈比。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"MP_WXS_3224065282:mark:MP_WXS_3224065282_a4JJs-hV4vyP4-jVbdrCZQ_387-427\",\"quote\":\"在过往的70年中，这些生活在富裕国家中的人已经逐渐失去了对瘟疫和危险传染病的警惕\",\"book\":{\"id\":\"MP_WXS_3224065282\",\"title\":\"知识分子\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/58e427e224d505f5758535f33323234303635323832c97\",\"wordCount\":\"$undefined\"},\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_543_160-227\",\"quote\":\"在西伯利亚有一些人几乎要老死此乡，看来一生的宗旨就是要兄弟般地照顾“不幸的人们”，像对自己的亲生孩子一样给予完全无私的崇高的同情和关怀\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(14)\",\"date\":\"2020-07-03\"},{\"id\":\"934366:mark:934366_543_2232-2283\",\"quote\":\"士兵有权朝囚犯开枪，要是他试图逃跑的话；但同时也要对开枪负责，如果他不是在最迫不得已的情况下开枪的话；\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(14)\",\"date\":\"2020-07-03\"},{\"id\":\"934366:mark:934366_543_962-1002\",\"quote\":\"…有些人说（我听到也读到过这种说法），对别人的最崇高的爱同时也是最大的利己主义。\",\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\",\"wordCount\":\"$undefined\"},\"chapter\":\"死屋手记(14)\",\"date\":\"2020-07-03\"},{\"id\":\"908185:mark:908185_17_10582-10651\",\"quote\":\"卡里奥的第一项贡献是改进伯纳斯–李之前向欧洲核子研究组织管理层提交的经费申请计划书，他的做法是在保持计划书吸引力的同时让它变得更加清晰明确\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_10880-10931\",\"quote\":\"后来伯纳斯–李想到了一个直观而清晰的名字。“我们就把它叫作万维网（World Wide Web）吧。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_11783-11817\",\"quote\":\"伯纳斯–李坚持认为万维网的协议应该免费开放共享，并且永远纳入公共领域\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_12090-12154\",\"quote\":\"欧洲核子研究组织最终加入了理查德·斯托尔曼的阵营，并采用了他的GNU通用公共许可证。此举造就了历史上规模最大的免费开源项目之一。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_13629-13727\",\"quote\":\"纳斯–李编写过一款可以用于阅读和编辑文档的浏览器，因为他希望万维网可以成为一个用户协作平台。然而他的浏览器只能在当时比较少见的NeXT电脑上使用，而且他也没有足够的时间和资源去开发其他版本的浏览器\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_14921-14983\",\"quote\":\"万维网在1993年进入高速发展阶段。在当年年初的时候，世界范围内只有50个万维网服务器，这个数字在同年10月变成了500个。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_15291-15449\",\"quote\":\"另外一个推动万维网发展的重要力量来自一款叫作Mosaic的网页浏览器，这款浏览器具有安装简易和显示图像的特点，它开发于伊利诺伊大学厄巴纳–香槟分校的国家超级计算应用中心（National Center for Supercomputing Applications，NCSA），这是一所由戈尔法案资助建立的研究机构。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_15898-15990\",\"quote\":\"安德森在1992年11月第一次看到万维网的演示，他当场就震惊了。为了开发一款更好用的浏览器，他在国家超级计算应用中心招揽了一位顶尖的程序员埃里克·比纳（Eric Bina）作为他的搭档\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_16096-16520\",\"quote\":\"真正可用的产品。”￼\\n接下来他们进行了两个月的疯狂编程工作——跟比尔·盖茨和保罗·艾伦之前所做的不相伯仲。他们有三到四天的时间都在夜以继日地连续编程，支撑安德森度过这段时光的是牛奶和曲奇饼，比纳的食物则是彩虹糖和激浪汽水，之后他们足足昏睡了一整天的时间才恢复过来。他们是一支优秀的团队：比纳是一位有条不紊的程序员，安德森则是一位以产品为导向的设计师。￼\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_1695-1775\",\"quote\":\"伯纳斯–李出生于1955年，与比尔·盖茨和史蒂夫·乔布斯同年。他认为生于这个年代是一件幸运的事情，因为当时的小孩可以轻易地拿到和摆弄一些基础的电子设备和电子元件\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_17089-17133\",\"quote\":\"Mosaic浏览器能够流行起来的原因是它的安装过程十分简便，而且它可以在网页中插入图像。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_17870-17952\",\"quote\":\"的外观很精美，甚至可以说是令人赏心悦目的，但是安德森强调的是利用富媒体（rich media）来呈现吸引眼球的页面，而伯纳斯–李认为重点应该放在促进严肃的协作上面。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_19143-19226\",\"quote\":\"我对马克没有在Mosaic里面加入编辑工具而感到失望，”伯纳斯–李说道，“如果当时人们有意识地将万维网更多地用作协作媒介，而不是发布媒介，我想它肯定要比现在强大得多。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_20943-21001\",\"quote\":\"在1993年到1994年间，也就是万维网刚刚起步的时期，我是时代公司新媒体部的主编，负责这家杂志公司的互联网发展战略\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_22289-22417\",\"quote\":\"20世纪90年代后期，伯纳斯–李尝试通过自己领导的万维网联盟（World Wide Web Consortium，W3C）为万维网开发一个小额支付系统。他的想法是在网页中嵌入处理小额支付所需的信息，然后让银行或者公司利用这个系统来建立不同的“电子钱包”服务\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_22982-23183\",\"quote\":\"安德森表示他相信比特币￼（一种创建于2009年的数字货币和点对点支付系统）会是一种更好的支付系统。“如果我可以乘坐时间机器回到1993年，我要做的第一件事肯定是开发比特币或者类似的加密货币\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_24029-24111\",\"quote\":\"从20世纪90年代中期开始，由博客和维基网站所引领的“Web 2.0”潮流为万维网注入了新的活力，用户可以在这些网站中进行协作和互动，在用户社区创造属于自己的内容。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_24918-24971\",\"quote\":\"霍尔很快就发现了一些东西：“几乎所有在网上发表内容的人都只是业余爱好者，他们所写的都不是专业严肃的内容。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_2882-2933\",\"quote\":\"从垃圾堆里把这台计算器捡了回来，然后接上自己制作的开关和晶体管，它很快就变成了一台可以工作的简易计算机\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_31528-31638\",\"quote\":\"博客在1999年进入了快速发展时期。博客的使用者已经不再限于贾斯汀·霍尔这种离经叛道和爱出风头的人了，博客的内容也不只是关于生活和幻想的个人日记。博客已经成为一个面向自由评论家、公民记者、律师、政治活动家和分析师的平台。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_31705-31803\",\"quote\":\"在成为一个能够颠覆出版行业和解放公众话语的全新媒体之前，博客需要变得更加简单易用，能够变得像“在这里输入文字之后按下那个按钮”那么简单。埃文·威廉姆斯（Ev Williams）就在这个时候登场了。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_3248-3457\",\"quote\":\"伯纳斯–李后来解释了他们当时失败的原因，“这里不是硅谷，我们周围没有家酿计算机俱乐部，也没有成熟的社区和文化氛围”。￼创新会在合适的土壤之上生长，对于20世纪70年代来说，这片土壤位于旧金山湾区，而不是牛津郡。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_32841-32874\",\"quote\":\"威廉姆斯是一个天生的连续创业者，所以他总是忍不住想要开办自己的公司\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_33928-33988\",\"quote\":\"创新的一个基本要点是保持专注。威廉姆斯明白他的第一家公司失败的原因——他想做的东西太多了，但是到头来一件东西都没有做成。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_34185-34246\",\"quote\":\"同年7月，他在胡里安休假期间瞒着她将Blogger作为一个独立产品发布了。他遵循的是创新的另外一个基本要点：不要过分专注。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\",\"annotation\":\"哦？interesting\"},{\"id\":\"908185:mark:908185_17_35506-35758\",\"quote\":\"如果有人愿意暂时和我共享一部分办公空间，请联系我。我可以通过节约成本来维持公司的运营。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十一章 万维网\",\"date\":\"2020-07-01\"},{\"id\":\"908185:mark:908185_17_36566-36655\",\"quote\":\"有人对威廉姆斯的情况表示同情，并向他伸出了援手，其中最重要的援助来自丹·布里克林，这是一位备受尊敬和乐于助人的技术业界领袖，他曾经参与开发了第一款计算机表格程序VisiCalc。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.c
