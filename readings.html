些生来离群索居的个体，要么不值得我们关注，要么不是人类\",\"book\":{\"id\":\"32764984\",\"title\":\"社会性动物（第12版）\",\"author\":\"艾略特·阿伦森 乔舒亚·阿伦森\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/984/32764984/t6_32764984.jpg\",\"url\":\"https://weread.qq.com/web/reader/fcb322c071f3f438fcb5e8c\",\"wordCount\":\"$undefined\"},\"chapter\":\"社会性动物\",\"date\":\"2025-01-08\"},{\"id\":\"3300120802:review:6166943_7X1pOjzoK\",\"quote\":\"\",\"annotation\":\"\\n《悠悠岁月》是诺贝尔文学奖得主埃尔诺的作品。她用一种意识流的写法，记述了过去几十年她所亲历的世界。这种意识流的写法感觉非常适合用来听。听这种内容的体验比那种议论式的文章要好很多。\\n\\n我们在听的时候通常不会非常聚精会神。这种情况下会遗漏一些信息，但是意识流意味着你可以遗漏任何信息，你只需要专注于当下听到的东西即可，这个写法可能更讲究在局部的场景构建。从宏观意义上来说，当你读完这本书，好像已经过了几十年。但如果让你说这本书里这几十年里发生了什么，你可能一时难以说清楚。她之前讲的东西可能就像我们的记忆一样，突然之间就蹦了出来，然后很快又消失了。或许这是意识流写法的一个特点，非常适合听书这种模式的。\\n\\n\",\"date\":\"2025-01-07\",\"book\":{\"id\":\"3300120802\",\"title\":\"悠悠岁月\",\"author\":\"[法]安妮·埃尔诺\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/61/cpplatform_qucmxrgjmpv1fqa5n81ljc/t6_cpplatform_qucmxrgjmpv1fqa5n81ljc1731493957.jpg\",\"url\":\"https://weread.qq.com/web/reader/ca0329a0813ab95b0g012500\",\"wordCount\":112077},\"bookReview\":true},{\"id\":\"23665518:mark:23665518_35_945-983\",\"quote\":\"我一向认为，生物学犹如神话故事那样迷人，因为事实上，生物学的内容就是神话故事\",\"book\":{\"id\":\"23665518\",\"title\":\"自私的基因（40周年增订版）\",\"author\":\"理查德·道金斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/60/YueWen_23665518/t6_YueWen_23665518.jpg\",\"url\":\"https://weread.qq.com/web/reader/fb732f6071691b6efb7de4b\",\"wordCount\":\"$undefined\"},\"chapter\":\"前言\",\"date\":\"2025-01-05\"},{\"id\":\"3300076264:review:6166943_7WVbKk9Ph\",\"quote\":\"\",\"annotation\":\"这本书中有很多的预测，不过预测是否准确并不重要，重要的是能从中感受李光耀的世界观与性格特点。\\n\\n大约五年前，读过这本书中关于中国的部分，感觉挺有道理。但现在再看，感觉好像很多都是错的。当然，对于预测，我们应该宽容点，而且政治人物说话必然要讲究一些政治正确。\\n\\n听这本书有一个缺憾，那就是李光耀的讲话时那种斩钉截铁的风格很有魅力，对我而言很洗脑。\\n\\n\",\"date\":\"2025-01-03\",\"book\":{\"id\":\"3300076264\",\"title\":\"李光耀观天下（精装版）\",\"author\":\"李光耀\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/79/cpplatform_wdghcvhzndnxtmgbbdm5dg/t6_cpplatform_wdghcvhzndnxtmgbbdm5dg1698833759.jpg\",\"url\":\"https://weread.qq.com/web/reader/63c32e90813ab844ag014d47\",\"wordCount\":146609},\"bookReview\":true},{\"id\":\"3300107258:mark:3300107258_22_594-714\",\"quote\":\"1930年12月11日是个非常关键的日子，这一天美国银行宣布倒闭。这是到那时为止美国有史以来倒闭的最大一家商业银行。而且，虽然它不过是一家普通的商业银行，但它的名称却使国内外许多人认为它是一家官方银行，因而它的倒闭对公众信心的打击尤其严重。\",\"book\":{\"id\":\"3300107258\",\"title\":\"自由选择（珍藏版）\",\"author\":\"[美]米尔顿·弗里德曼 罗丝 D. 弗里德曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/13/cpplatform_fn6jqifsvs9wzhwc6wrrls/t6_cpplatform_fn6jqifsvs9wzhwc6wrrls1721638493.jpg\",\"url\":\"https://weread.qq.com/web/reader/ed132ed0813ab9065g018fc4\",\"wordCount\":234527,\"spinePalette\":{\"paper\":\"rgb(253 252 252)\",\"ink\":\"#292622\"}},\"chapter\":\"银行业危机\",\"date\":\"2024-12-30\"},{\"id\":\"3300107258:mark:3300107258_26_3148-3210\",\"quote\":\"即对老年人和遗属的补贴上。他们领取的津贴几乎占全部支出的2/3，人数占领取福利金总人数的3/4。我们下一节讨论公共援助计划。\",\"book\":{\"id\":\"3300107258\",\"title\":\"自由选择（珍藏版）\",\"author\":\"[美]米尔顿·弗里德曼 罗丝 D. 弗里德曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/13/cpplatform_fn6jqifsvs9wzhwc6wrrls/t6_cpplatform_fn6jqifsvs9wzhwc6wrrls1721638493.jpg\",\"url\":\"https://weread.qq.com/web/reader/ed132ed0813ab9065g018fc4\",\"wordCount\":234527,\"spinePalette\":{\"paper\":\"rgb(253 252 252)\",\"ink\":\"#292622\"}},\"chapter\":\"福利国家的后果\",\"date\":\"2024-12-30\"},{\"id\":\"3300107258:mark:3300107258_16_6514-6516\",\"quote\":\"擘画\",\"book\":{\"id\":\"3300107258\",\"title\":\"自由选择（珍藏版）\",\"author\":\"[美]米尔顿·弗里德曼 罗丝 D. 弗里德曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/13/cpplatform_fn6jqifsvs9wzhwc6wrrls/t6_cpplatform_fn6jqifsvs9wzhwc6wrrls1721638493.jpg\",\"url\":\"https://weread.qq.com/web/reader/ed132ed0813ab9065g018fc4\",\"wordCount\":234527,\"spinePalette\":{\"paper\":\"rgb(253 252 252)\",\"ink\":\"#292622\"}},\"chapter\":\"中央经济计划\",\"date\":\"2024-12-29\"},{\"id\":\"3300107258:mark:3300107258_16_6927-7026\",\"quote\":\"而印度则依靠政府管制，从而严重地挫伤了国民的创造性，或者说，将国民创造性白白耗散于无用之途。同时，印度保护各种既得利益，使其免遭变革之侵害；在印度，决定何者生存的准则不是市场效率，而是官僚们的认可。\",\"book\":{\"id\":\"3300107258\",\"title\":\"自由选择（珍藏版）\",\"author\":\"[美]米尔顿·弗里德曼 罗丝 D. 弗里德曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/13/cpplatform_fn6jqifsvs9wzhwc6wrrls/t6_cpplatform_fn6jqifsvs9wzhwc6wrrls1721638493.jpg\",\"url\":\"https://weread.qq.com/web/reader/ed132ed0813ab9065g018fc4\",\"wordCount\":234527,\"spinePalette\":{\"paper\":\"rgb(253 252 252)\",\"ink\":\"#292622\"}},\"chapter\":\"中央经济计划\",\"date\":\"2024-12-29\"},{\"id\":\"3300107258:mark:3300107258_3_568-616\",\"quote\":\"经验教导我们，每当政府用心良善准备有所作为的时候，我们就应该保持最高程度的警惕来保卫我们的自由。\",\"book\":{\"id\":\"3300107258\",\"title\":\"自由选择（珍藏版）\",\"author\":\"[美]米尔顿·弗里德曼 罗丝 D. 弗里德曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/13/cpplatform_fn6jqifsvs9wzhwc6wrrls/t6_cpplatform_fn6jqifsvs9wzhwc6wrrls1721638493.jpg\",\"url\":\"https://weread.qq.com/web/reader/ed132ed0813ab9065g018fc4\",\"wordCount\":234527,\"spinePalette\":{\"paper\":\"rgb(253 252 252)\",\"ink\":\"#292622\"}},\"chapter\":\"文前\",\"date\":\"2024-12-29\"},{\"id\":\"3300107258:review:6166943_7WO3QllmT\",\"quote\":\"通常情况下，银行新吸收的现金存款额大约和取款额相持平，因此少量的准备金就足以应付当前的取、存款缺口。然而，若是人人都想马上就取出存款，那情形就大不同了，很可能就会发生恐慌。那情形，就好比在一个满是观众的剧场里，突然有人喊了一声“着火啦”，于是人们便争先恐后地夺路逃生。\",\"annotation\":\"信任比黄金更可贵，信任是阳光空气和水。当被信任的时候，可能感觉不到什么是信任，但一旦失去了信任，甚至不会给你苟延残喘的机会\",\"chapter\":\"联邦储备体系的起源\",\"date\":\"2024-12-29\",\"book\":{\"id\":\"3300107258\",\"title\":\"自由选择（珍藏版）\",\"author\":\"[美]米尔顿·弗里德曼 罗丝 D. 弗里德曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/13/cpplatform_fn6jqifsvs9wzhwc6wrrls/t6_cpplatform_fn6jqifsvs9wzhwc6wrrls1721638493.jpg\",\"url\":\"https://weread.qq.com/web/reader/ed132ed0813ab9065g018fc4\",\"wordCount\":234527,\"spinePalette\":{\"paper\":\"rgb(253 252 252)\",\"ink\":\"#292622\"}}},{\"id\":\"573975:mark:573975_54_10564-10636\",\"quote\":\"这部分内容详细说明了系统1的无意识运作和系统2受控制运作的区别，并且说明了系统1的核心，即联想记忆是如何不断对世界上所发生的事作出连贯的解释的。\",\"book\":{\"id\":\"573975\",\"title\":\"思考，快与慢\",\"author\":\"丹尼尔·卡尼曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/86/YueWen_573975/t6_YueWen_573975.jpg\",\"url\":\"https://weread.qq.com/web/reader/af83263058c217af81f8979\",\"wordCount\":\"$undefined\"},\"chapter\":\"序言\",\"date\":\"2024-12-28\"},{\"id\":\"573975:mark:573975_54_10967-10996\",\"quote\":\"我们总是高估自己对世界的了解，却低估了事件中存在的偶然性。\",\"book\":{\"id\":\"573975\",\"title\":\"思考，快与慢\",\"author\":\"丹尼尔·卡尼曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/86/YueWen_573975/t6_YueWen_573975.jpg\",\"url\":\"https://weread.qq.com/web/reader/af83263058c217af81f8979\",\"wordCount\":\"$undefined\"},\"chapter\":\"序言\",\"date\":\"2024-12-28\"},{\"id\":\"910669:mark:910669_31_3456-3754\",\"quote\":\"苏格拉底不时可以享用一顿筵席，且当毒药在肚里发作的时候，他的确从和门徒的谈话里得到很大的满足[插图]，但他大半的生涯，是和妻子俩安静地过着日子，下午作一次散步，路上或者遇到几个朋友。康德相传终生未尝走出故乡十里以外。达尔文周游世界以后，余下的时间都是在家里消磨的。马克思掀动了几处革命以后，决意在不列颠博物馆中度他的余年。从全体看来，安静的生活是大人物的特征，他们的喜乐也不是外人心目中认为兴奋的那一种。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"四 烦闷与兴奋\",\"date\":\"2024-12-28\",\"annotation\":\"安静地苟完余生（doge）\"},{\"id\":\"910669:mark:910669_32_406-518\",\"quote\":\"纯粹肉体的劳顿，只要不过度，倒多少是快乐的因子；它使人睡眠酣畅，胃口旺盛，对于假日可能有的娱乐觉得兴致勃勃。但劳顿过度时就变成严重的祸害了。除了最进步的社会以外，地球上到处的农家妇女三十岁上便老了，被过度的劳作弄得筋疲力尽。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2024-12-28\"},{\"id\":\"910669:mark:910669_38_6159-6251\",\"quote\":\"责任意识在工作上是有益的，但在人与人的关系上是有害的。人愿意被爱，却不愿被人家用着隐忍和耐性勉强敷衍。个人的幸福之源固然不少，但其中最主要的一个恐怕就是：自动地而且毫不费力地爱许多人。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一〇 快乐还可能么？\",\"date\":\"2024-12-28\"},{\"id\":\"3300103182:mark:3300103182_65_4216-4257\",\"quote\":\"可悲的人们，竟然忘掉了先辈四百年前简洁有力的法语箴言：追求大自由，就会陷入大奴役！\",\"book\":{\"id\":\"3300103182\",\"title\":\"旧制度与大革命（中法双语版）\",\"author\":\"[法]托克维尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_uzmy4nhxfsqzz8hdrq5ere/t6_cpplatform_uzmy4nhxfsqzz8hdrq5ere1729655199.jpg\",\"url\":\"https://weread.qq.com/web/reader/2f932450813ab8eceg01272c\",\"wordCount\":921194,\"spinePalette\":{\"paper\":\"rgb(208 210 209)\",\"ink\":\"#292622\"}},\"chapter\":\"第一章 文人何以在18世纪中期成为政治权威及其影响\",\"date\":\"2024-12-27\",\"annotation\":\"只知道有问题，但没有合适的解决方案，把对未来的预期寄托于一厢情愿的幻想中，只有骗子能满足他们的预期\"},{\"id\":\"3300103182:review:6166943_7WJMwdQ1v\",\"quote\":\"就像如今一样，彼时，农民极其爱恋土地，土地占有欲点燃了农民身上的全部激情。当时有位睿智之士评曰：“对成为地主，人们趋之若鹜，所以，土地总是溢价出售。在法国，下等阶层的所有积蓄，就是为了购买土地，而在其他国家，不是借给他人就是投资公债证券。”\",\"annotation\":\"What？这不是在说东大？\",\"chapter\":\"第一章 法国人民为何比其他国家人民更憎恨封建制度\",\"date\":\"2024-12-27\",\"book\":{\"id\":\"3300103182\",\"title\":\"旧制度与大革命（中法双语版）\",\"author\":\"[法]托克维尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_uzmy4nhxfsqzz8hdrq5ere/t6_cpplatform_uzmy4nhxfsqzz8hdrq5ere1729655199.jpg\",\"url\":\"https://weread.qq.com/web/reader/2f932450813ab8eceg01272c\",\"wordCount\":921194,\"spinePalette\":{\"paper\":\"rgb(208 210 209)\",\"ink\":\"#292622\"}}},{\"id\":\"3300103182:review:6166943_7WKJAbdqb\",\"quote\":\"\",\"annotation\":\"内容过于真实，读起来仿佛是“猪八戒照镜子”。\\n\\n托克维尔最好真的只是在讲法国（doge）。\",\"date\":\"2024-12-27\",\"book\":{\"id\":\"3300103182\",\"title\":\"旧制度与大革命（中法双语版）\",\"author\":\"[法]托克维尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_uzmy4nhxfsqzz8hdrq5ere/t6_cpplatform_uzmy4nhxfsqzz8hdrq5ere1729655199.jpg\",\"url\":\"https://weread.qq.com/web/reader/2f932450813ab8eceg01272c\",\"wordCount\":921194,\"spinePalette\":{\"paper\":\"rgb(208 210 209)\",\"ink\":\"#292622\"}},\"bookReview\":true},{\"id\":\"573975:mark:573975_54_564-631\",\"quote\":\"在人生最辉煌的时候，我们很难对自己的信念和需求产生怀疑，越是在最需要质疑自己的时候越难做到这一点，但我们可以从他人的真知灼见中受到启迪\",\"book\":{\"id\":\"573975\",\"title\":\"思考，快与慢\",\"author\":\"丹尼尔·卡尼曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/86/YueWen_573975/t6_YueWen_573975.jpg\",\"url\":\"https://weread.qq.com/web/reader/af83263058c217af81f8979\",\"wordCount\":\"$undefined\"},\"chapter\":\"序言\",\"date\":\"2024-12-27\"},{\"id\":\"908185:review:6166943_7WINqMIjC\",\"quote\":\"杨致远（Jerry Yang）和大卫·费罗（David Filo）对待博士论文的态度都很散漫，他们会因为玩模拟篮球经理游戏而拖延完成论文的时间。“我们做各种事情，就是不写论文。”杨致远回忆道\",\"annotation\":\"很欣赏这种态度（doge）\",\"chapter\":\"第十一章 万维网\",\"date\":\"2024-12-26\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758}},{\"id\":\"908185:review:6166943_7WIQBPLUx\",\"quote\":\"布林和佩奇一起去了汉堡王餐厅庆祝。“我们觉得应该吃一些好吃的东西，尽管那些食物确实很不健康，”佩奇说道，“而且价格也很便宜。对于这次的成功融资来说，这似乎也是一种合适的庆祝方式。”\",\"annotation\":\"嗯嗯，我也喜欢汉堡王\",\"chapter\":\"第十一章 万维网\",\"date\":\"2024-12-26\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758}},{\"id\":\"908185:review:6166943_7WJ7lNaGK\",\"quote\":\"\",\"annotation\":\"计算机科学与技术的“纪传体”历史书，从埃达到AI崛起的前夜。\\n\\n印象比较深刻的人物与直接感觉有：\\n1. 埃达与其父亲拜伦：感性与理性思维之间“你死我活”的竞争；\\n2. 肖克利与巴丁等贝尔实验室的同事：晶体管诞生前后的八卦故事；\\n3. 诺伊斯、基尔比、摩尔、格鲁夫：集成电路与微处理器的诞生；\\n4. 沃兹、乔布斯、盖茨、艾伦：硬件极客黄金时代的终结，软件开发者的崛起, 设计师（技术的人文主义）的黎明；\\n5. 斯托曼、托尔瓦兹：软件自由主义者的分支：理想主义与实用主义的开源理念；\\n6. 蒂姆•伯纳斯•李：圣人；\\n7. 佩奇、布林：一种新的企业文化的成熟。\\n\\n作者传达的理念：\\n1. 伟大的技术突破通常是天才协作的成果而非单打独斗；\\n2. 创新的发生往往都是万事俱备之后再吹点东风一样自然。\\n\\n这本书我读了很多年，都是断断续续的，中间读过许多与之相关的很多其他资料，这本书中的故事也常被一些科学史的作者或博主拿来讲述。可以说很多故事早就内化到我的日常的“八卦类知识消费”中了 。\\n\\n书里的故事很精彩，这首先要归功于推动技术发展的诸多天才的传奇人生，此外作者的写作也充分体现了其作为顶级传记作家的功底。\\n\\n\",\"date\":\"2024-12-26\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"bookReview\":true},{\"id\":\"908185:mark:908185_13_58441-58764\",\"quote\":\"科技发展的过程就像建造大教堂一样。在几百年的历程中，不断有新人加入，每个人都会在现有的基础之上添加一块砖，每个人都会说：“我建了一座大教堂。”到了下个月，又会有新砖放在之前的砖瓦上。然后来了一位历史学家，问：“大教堂是谁建的？”彼得在这里加了几块石头，保罗又多加了几块石头。如果不谦虚谨慎的话，你就会自欺欺人地以为自己完成的是最重要的部分。但事实是，每一项贡献都必须以前人的积累为基础。事物与事物之间都是环环相扣的。[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第七章 互联网\",\"date\":\"2024-12-25\"},{\"id\":\"908185:mark:908185_16_1547-1576\",\"quote\":\"1972年，阿帕网的第一个热门应用诞生了，这就是电子邮件。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第十章 在线\",\"date\":\"2024-12-25\"},{\"id\":\"908185:mark:908185_11_13724-13975\",\"quote\":\"诺伊斯后来写道：“新元件和新应用之间的协同效应让两者均产生了爆炸性增长。”[插图]这种协同效应在半个世纪之前也出现过，当时石油业与汽车业出现了同步增长。这其中包含着一个关键的创新经验：要了解哪些行业具有共生性，这样才能利用它们协同增长所带来的机遇。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第五章 微芯片\",\"date\":\"2024-12-24\",\"annotation\":\"摩尔定律原来是这么来的\"},{\"id\":\"908185:mark:908185_11_14936-14977\",\"quote\":\"摩尔定律不仅仅是一个预期，而且是行业的目标，这就使其在一定程度上成为一种自证预言。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第五章 微芯片\",\"date\":\"2024-12-24\"},{\"id\":\"908185:mark:908185_11_20267-20389\",\"quote\":\"他们最终决定将公司命名为“集成电子公司”（Integrated Electronics Corp.）。这个名字也不算太精彩，但好处是可以简写为“英特尔”（Intel）。这样一来，听上去就很顺耳了。这个名字从很多方面看都取得很妙，一听便可心领神会\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第五章 微芯片\",\"date\":\"2024-12-24\"},{\"id\":\"908185:mark:908185_11_25833-25988\",\"quote\":\"诺伊斯注意到，在东海岸的公司，办事员和秘书用小小的金属办公桌，而顶层高管使用昂贵的红木办公桌。于是诺伊斯决定用一张小小的灰色铝制办公桌来办公，让普通员工用更好的桌子，就连新聘的支持人员也用较大的木质办公桌。他那张带有凹痕和划痕的办公桌放在办公区靠近中央的位置，每个人都能一览无余。这就杜绝了其他任何人要求特权。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第五章 微芯片\",\"date\":\"2024-12-24\"},{\"id\":\"908185:mark:908185_11_27523-27624\",\"quote\":\"诺伊斯是一位伟大的领导者，因为他很聪明，善于启发人，但他不是一个伟大的管理者。摩尔说：“诺伊斯的行事原则是，只要你向人暗示怎样做是对的，他们就会有足够的智慧去把这件事捡起来做。你无须为之后的东西操心。”\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第五章 微芯片\",\"date\":\"2024-12-24\"},{\"id\":\"908185:mark:908185_11_29375-29490\",\"quote\":\"尽管风格不同，但诺伊斯、摩尔和格鲁夫拥有一个共同点：他们都毫不动摇地坚持一个目标，要确保创新、尝试和创业精神在英特尔蓬勃发展。格鲁夫笃信“成功滋生自满，自满酿成失败，唯有偏执狂才能生存”。诺伊斯和摩尔也许并不偏执，但他们从未自满。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第五章 微芯片\",\"date\":\"2024-12-24\"},{\"id\":\"908185:mark:908185_11_29733-29952\",\"quote\":\"当时，常常有公司来要求英特尔做一种用于完成特定任务的芯片。霍夫（还有诺伊斯和其他人）设想了一种替代方案：发明一种能接受指令，即进行编程，从而按要求完成不同任务的通用芯片。换句话说，也就是在一枚芯片上做出通用计算机。[插图]\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第五章 微芯片\",\"date\":\"2024-12-24\"},{\"id\":\"908185:mark:908185_11_31372-31547\",\"quote\":\"他意识到，能通过编程实现一切逻辑功能的芯片将成为电子设备的标准元件，就像两英寸厚、四英寸宽的木板是房屋建筑业的标准建材一样。这种芯片会取代专用芯片，这就意味着它们可以批量生产，价格也会不断下降。它们还会让电子行业产生一个比较微妙的变化：在电路板上设计元件配置的硬件工程师变得没那么重要了，取而代之的是新生的软件工程师，他们的工作是将一批指令写入系统。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第五章 微芯片\",\"date\":\"2024-12-24\"},{\"id\":\"908185:mark:908185_9_50850-50952\",\"quote\":\"图灵测试，也就是图灵所说的“模仿游戏”（the imitation game）的操作很简单：一位询问者将自己的问题写下来，发给处于另外一个房间之中的一个人和一台机器，然后根据他们给出的答案确定哪个是真人。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第三章 编程\",\"date\":\"2024-12-24\"},{\"id\":\"908185:mark:908185_9_52996-53050\",\"quote\":\"”换句话说，跟人类大脑不一样的是，机械装置无法拥有自由意志，也不能产生自主性，它只能按照既定的程序执行任务。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第三章 编程\",\"date\":\"2024-12-24\"},{\"id\":\"908185:mark:908185_9_53135-53189\",\"quote\":\"图灵提出了一个极具独创性的反驳观点：机器也许可以进行学习，从而逐渐发展出自己的主动性，并掌握产生新想法的能力\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第三章 编程\",\"date\":\"2024-12-24\"},{\"id\":\"3300123213:mark:3300123213_86_533-669\",\"quote\":\"如果我要做严肃的工作，或者发表演讲，我会带上13英寸的便携式计算机。我一直不喜欢手边没有计算机，但带着13英寸的便携式计算机又挺重的，因此，我还备有一台只有2磅（约0.9千克）重的迷你便携式计算机，我把它放在一个小包里（不用说，包和计算机上都装饰有我们的Spikey图标）\",\"book\":{\"id\":\"3300123213\",\"title\":\"万物皆计算：科学奇才的探索之旅\",\"author\":\"[美]斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/10/cpplatform_1ysgda9ughbdbnxbt4pdzg/t6_cpplatform_1ysgda9ughbdbnxbt4pdzg1732849980.jpg\",\"url\":\"https://weread.qq.com/web/reader/40032f70813ab96a1g013538\",\"wordCount\":199960,\"spinePalette\":{\"paper\":\"rgb(40 54 130)\",\"ink\":\"#eaf2ff\"}},\"chapter\":\"22.4 移动办公\",\"date\":\"2024-12-23\"},{\"id\":\"3300123213:review:6166943_7WEdt0ed7\",\"quote\":\"\",\"annotation\":\"喜欢大佬分享他的故事与生活。这本书确实很有趣，除了一些科学与技术方面的知识，还涉及了软件LOGO的设计，软件函数名的命名以及日常生活中的数字化管理与数据挖掘，非常有趣。\\n\",\"date\":\"2024-12-23\",\"book\":{\"id\":\"3300123213\",\"title\":\"万物皆计算：科学奇才的探索之旅\",\"author\":\"[美]斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/10/cpplatform_1ysgda9ughbdbnxbt4pdzg/t6_cpplatform_1ysgda9ughbdbnxbt4pdzg1732849980.jpg\",\"url\":\"https://weread.qq.com/web/reader/40032f70813ab96a1g013538\",\"wordCount\":199960,\"spinePalette\":{\"paper\":\"rgb(40 54 130)\",\"ink\":\"#eaf2ff\"}},\"bookReview\":true},{\"id\":\"3300082609:mark:3300082609_12_820-856\",\"quote\":\"我们依靠神经网络在这些样例“之间”进行“合理”的“插值”（或“泛化”）。\",\"book\":{\"id\":\"3300082609\",\"title\":\"这就是ChatGPT\",\"author\":\"斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/24/cpplatform_4cn8w4tmgzntjobg9ffeny/t6_cpplatform_4cn8w4tmgzntjobg9ffeny1703648785.jpg\",\"url\":\"https://weread.qq.com/web/reader/74332a90813ab86c4g019d98\",\"wordCount\":52593},\"chapter\":\"机器学习和神经网络的训练\",\"date\":\"2024-12-22\"},{\"id\":\"3300082609:mark:3300082609_28_1033-1121\",\"quote\":\"虽然“原始ChatGPT”可以在许多情况下帮助人们写作、提供建议或生成对各种文档或交流有用的文本，但是当必须把事情做到完美时，机器学习并不是解决问题的方法—就像人类也不是一样。\",\"book\":{\"id\":\"3300082609\",\"title\":\"这就是ChatGPT\",\"author\":\"斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/24/cpplatform_4cn8w4tmgzntjobg9ffeny/t6_cpplatform_4cn8w4tmgzntjobg9ffeny1703648785.jpg\",\"url\":\"https://weread.qq.com/web/reader/74332a90813ab86c4g019d98\",\"wordCount\":52593},\"chapter\":\"前方的路\",\"date\":\"2024-12-22\"},{\"id\":\"3300082609:mark:3300082609_28_1165-1230\",\"quote\":\"ChatGPT在“类人的部分”表现出色，因为其中没有精确的“正确答案”。但当它被“赶鸭子上架”、需要提供精确的内容时，往往会失败。\",\"book\":{\"id\":\"3300082609\",\"title\":\"这就是ChatGPT\",\"author\":\"斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/24/cpplatform_4cn8w4tmgzntjobg9ffeny/t6_cpplatform_4cn8w4tmgzntjobg9ffeny1703648785.jpg\",\"url\":\"https://weread.qq.com/web/reader/74332a90813ab86c4g019d98\",\"wordCount\":52593},\"chapter\":\"前方的路\",\"date\":\"2024-12-22\"},{\"id\":\"3300082609:mark:3300082609_28_1509-1642\",\"quote\":\"在许多方面，可以说ChatGPT从未“真正理解”过事物，它只“知道如何产生有用的东西”。但是Wolfram|Alpha则完全不同。因为一旦Wolfram|Alpha将某些东西转换为Wolfram语言，我们就拥有了它们完整、精确、形式化的表示，可以用来可靠地计算事物。\",\"book\":{\"id\":\"3300082609\",\"title\":\"这就是ChatGPT\",\"author\":\"斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/24/cpplatform_4cn8w4tmgzntjobg9ffeny/t6_cpplatform_4cn8w4tmgzntjobg9ffeny1703648785.jpg\",\"url\":\"https://weread.qq.com/web/reader/74332a90813ab86c4g019d98\",\"wordCount\":52593},\"chapter\":\"前方的路\",\"date\":\"2024-12-22\"},{\"id\":\"3300082609:review:6166943_7WD4q8aoT\",\"quote\":\"\",\"annotation\":\"作为一本书还是太薄了，前面还加上了大篇幅的推荐序。\\n\\n观点有很深刻独到的见解，毕竟是大科学家。\\n\\n但对大模型来说，这本书的时间还是太早了，里面的玩法现在来看不算很新颖。\",\"date\":\"2024-12-22\",\"book\":{\"id\":\"3300082609\",\"title\":\"这就是ChatGPT\",\"author\":\"斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/24/cpplatform_4cn8w4tmgzntjobg9ffeny/t6_cpplatform_4cn8w4tmgzntjobg9ffeny1703648785.jpg\",\"url\":\"https://weread.qq.com/web/reader/74332a90813ab86c4g019d98\",\"wordCount\":52593},\"bookReview\":true},{\"id\":\"3300103182:mark:3300103182_62_4457-4800\",\"quote\":\"在草草追溯大革命的过程中，我将尽力阐明：是哪些事件、哪些错误、哪些失策，导致法国人抛弃原定目标，忘却自由，而只想成为世界霸主[插图]的平等奴仆；那比大革命所推翻的政府更强悍、更专制的政府，如何攫取并垄断所有政治权力，如何取消付出如此高昂代价换来的所有自由而代之以徒具其表的自由；如何剥夺选民的知情权、集会权和决定权而又标榜人民主权；在决定征税时，如何把议会的屈从和沉默吹嘘成议员自主投票决定；如何盗用大革命名义，取消国民自治权以及思想、言论、出版自由——此乃1789年争取的最珍贵、最伟大的成果——的主要法律保障。\",\"book\":{\"id\":\"3300103182\",\"title\":\"旧制度与大革命（中法双语版）\",\"author\":\"[法]托克维尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_uzmy4nhxfsqzz8hdrq5ere/t6_cpplatform_uzmy4nhxfsqzz8hdrq5ere1729655199.jpg\",\"url\":\"https://weread.qq.com/web/reader/2f932450813ab8eceg01272c\",\"wordCount\":921194,\"spinePalette\":{\"paper\":\"rgb(208 210 209)\",\"ink\":\"#292622\"}},\"chapter\":\"原著前言\",\"date\":\"2024-12-21\",\"annotation\":\"以创建天堂的名义打造地狱\"},{\"id\":\"3300103182:mark:3300103182_62_6244-6454\",\"quote\":\"在专制社会，无所谓安居乐业，人人都焦虑不已，都渴望挤为人上人，都唯恐沦为人下人；金钱，成为尊卑贵贱的主要标志，具有独特的流动性，不断转手，改变个人的社会地位，提升或者降低家庭的社会地位。因此，几乎人人都想拼命积聚财富、渴望不惜代价发财致富，热衷经商、贪图钱财、追求物质享受和安逸就会成为专制社会最普遍的情绪。这种情绪，很容易弥漫于社会各阶层，甚至弥漫于素来与此无缘的阶层。倘若不遏制这种情绪，不久就会让整个民族萎靡堕落。\",\"book\":{\"id\":\"3300103182\",\"title\":\"旧制度与大革命（中法双语版）\",\"author\":\"[法]托克维尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_uzmy4nhxfsqzz8hdrq5ere/t6_cpplatform_uzmy4nhxfsqzz8hdrq5ere1729655199.jpg\",\"url\":\"https://weread.qq.com/web/reader/2f932450813ab8eceg01272c\",\"wordCount\":921194,\"spinePalette\":{\"paper\":\"rgb(208 210 209)\",\"ink\":\"#292622\"}},\"chapter\":\"原著前言\",\"date\":\"2024-12-21\",\"annotation\":\"专制，内卷与躺平\"},{\"id\":\"3300103182:mark:3300103182_62_819-930\",\"quote\":\"从来没有哪个民族，像1789年的法国人那样，企图决绝地把自身历史一刀两断，在过去与未来之间挖一道鸿沟。为防止把任何旧东西带进新社会，他们高度警惕；为迥异于先辈，他们给自己设立了种种限制；为让自身面貌焕然一新，他们不遗余力。\",\"book\":{\"id\":\"3300103182\",\"title\":\"旧制度与大革命（中法双语版）\",\"author\":\"[法]托克维尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_uzmy4nhxfsqzz8hdrq5ere/t6_cpplatform_uzmy4nhxfsqzz8hdrq5ere1729655199.jpg\",\"url\":\"https://weread.qq.com/web/reader/2f932450813ab8eceg01272c\",\"wordCount\":921194,\"spinePalette\":{\"paper\":\"rgb(208 210 209)\",\"ink\":\"#292622\"}},\"chapter\":\"原著前言\",\"date\":\"2024-12-21\"},{\"id\":\"3300103182:review:6166943_7WBPtK6Rv\",\"quote\":\"自由却截然不同：唯有自由，才能与社会固有的种种罪恶作斗争，才能阻止社会沉沦；唯有自由，可以促使人们摆脱因自主自立而必然导致的孤立，可以促使彼此亲近以便讨论公共事务并达成妥协而形成共识；唯有自由，才能促使人们摆脱金钱崇拜，摆脱日常琐事的烦扰，从而让人们时时刻刻都感受到，祖国就在身边，祖国高于自身；唯有自由，能够在关键时刻以更强烈、更高尚的情感取代追求安逸的念头，能够让人们具有比发家致富更伟大的雄心壮志，能够点亮明灯让人们清晰辨别善恶\",\"annotation\":\"算了，全文背诵吧\",\"chapter\":\"原著前言\",\"date\":\"2024-12-21\",\"book\":{\"id\":\"3300103182\",\"title\":\"旧制度与大革命（中法双语版）\",\"author\":\"[法]托克维尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_uzmy4nhxfsqzz8hdrq5ere/t6_cpplatform_uzmy4nhxfsqzz8hdrq5ere1729655199.jpg\",\"url\":\"https://weread.qq.com/web/reader/2f932450813ab8eceg01272c\",\"wordCount\":921194,\"spinePalette\":{\"paper\":\"rgb(208 210 209)\",\"ink\":\"#292622\"}}},{\"id\":\"3300123213:mark:3300123213_35_13826-13961\",\"quote\":\"事实上，人们经常发现，令人惊讶的简单程序就能实现各种复杂的目标。然而，并不像传统工程创造出来的东西，这些程序是否在以我们人类容易理解的方式运行，是没有限制的。事实上，人们会经常发现它们不以人类容易理解的方式运行。\",\"book\":{\"id\":\"3300123213\",\"title\":\"万物皆计算：科学奇才的探索之旅\",\"author\":\"[美]斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/10/cpplatform_1ysgda9ughbdbnxbt4pdzg/t6_cpplatform_1ysgda9ughbdbnxbt4pdzg1732849980.jpg\",\"url\":\"https://weread.qq.com/web/reader/40032f70813ab96a1g013538\",\"wordCount\":199960,\"spinePalette\":{\"paper\":\"rgb(40 54 130)\",\"ink\":\"#eaf2ff\"}},\"chapter\":\"第5章 物理学的终极可能是什么\",\"date\":\"2024-12-21\"},{\"id\":\"3300123213:mark:3300123213_35_13991-14028\",\"quote\":\"我们可以描述它们要什么样的整体目标，但是我们不能轻易理解它们是怎么实现的。\",\"book\":{\"id\":\"3300123213\",\"title\":\"万物皆计算：科学奇才的探索之旅\",\"author\":\"[美]斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/10/cpplatform_1ysgda9ughbdbnxbt4pdzg/t6_cpplatform_1ysgda9ughbdbnxbt4pdzg1732849980.jpg\",\"url\":\"https://weread.qq.com/web/reader/40032f70813ab96a1g013538\",\"wordCount\":199960,\"spinePalette\":{\"paper\":\"rgb(40 54 130)\",\"ink\":\"#eaf2ff\"}},\"chapter\":\"第5章 物理学的终极可能是什么\",\"date\":\"2024-12-21\"},{\"id\":\"3300123213:mark:3300123213_36_26400-26477\",\"quote\":\"我们费了九牛二虎之力才把Mathematica编译好，总算准备好进行第一次计算了。有人敲下2+2，我不骗你，结果是“5”。我认为这是整型与浮点表示的问题。\",\"book\":{\"id\":\"3300123213\",\"title\":\"万物皆计算：科学奇才的探索之旅\",\"author\":\"[美]斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/10/cpplatform_1ysgda9ughbdbnxbt4pdzg/t6_cpplatform_1ysgda9ughbdbnxbt4pdzg1732849980.jpg\",\"url\":\"https://weread.qq.com/web/reader/40032f70813ab96a1g013538\",\"wordCount\":199960,\"spinePalette\":{\"paper\":\"rgb(40 54 130)\",\"ink\":\"#eaf2ff\"}},\"chapter\":\"第6章 我的技术人生——在计算机历史博物馆的演讲\",\"date\":\"2024-12-21\",\"annotation\":\"啊偶…多么经典的瞬间\"},{\"id\":\"3300123213:mark:3300123213_57_8577-8830\",\"quote\":\"这是一个微妙但普遍存在的社交网络现象，被称为“友谊悖论”(friendship paradox)。这个悖论产生的原因在于，当对用户的好友进行采样时，我们不可避免地以一种非均匀的方式对所有Facebook用户进行采样。特别是，如果我们的用户代表一个均匀的样本，任何给定的好友都会以与其拥有的好友数量相关的比例被采样，结果就是拥有更多好友的人被更频繁地采样，因此平均好友数量增加了。通过逆比例对好友进行加权，我们可以纠正这种现象，这就是本章前面所做的。\",\"book\":{\"id\":\"3300123213\",\"title\":\"万物皆计算：科学奇才的探索之旅\",\"author\":\"[美]斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/10/cpplatform_1ysgda9ughbdbnxbt4pdzg/t6_cpplatform_1ysgda9ughbdbnxbt4pdzg1732849980.jpg\",\"url\":\"https://weread.qq.com/web/reader/40032f70813ab96a1g013538\",\"wordCount\":199960,\"spinePalette\":{\"paper\":\"rgb(40 54 130)\",\"ink\":\"#eaf2ff\"}},\"chapter\":\"第13章 Facebook世界里的数据科学\",\"date\":\"2024-12-21\"},{\"id\":\"3300123213:mark:3300123213_5_2850-3082\",\"quote\":\"近年来，有曼朱尔·巴尔加瓦(Manjul Bhargava)[插图]，用将近十年的时间提供指导，最终成就电影《知无涯者》（The Man Who Knew Infinity, 2015年），他本人在电影剪辑阶段花费了数周时间“旁观”电影数学部分的完成。\",\"book\":{\"id\":\"3300123213\",\"title\":\"万物皆计算：科学奇才的探索之旅\",\"author\":\"[美]斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/10/cpplatform_1ysgda9ughbdbnxbt4pdzg/t6_cpplatform_1ysgda9ughbdbnxbt4pdzg1732849980.jpg\",\"url\":\"https://weread.qq.com/web/reader/40032f70813ab96a1g013538\",\"wordCount\":199960,\"spinePalette\":{\"paper\":\"rgb(40 54 130)\",\"ink\":\"#eaf2ff\"}},\"chapter\":\"第1章 快，外星飞船可能是怎么工作的\",\"date\":\"2024-12-20\"},{\"id\":\"908185:mark:908185_7_9735-10167\",\"quote\":\"埃达接受了母亲的信念，认为沉浸在数学当中就可以帮助她摆脱拜伦式的性格倾向。在经历了一段不伦的师生恋之后，18岁的埃达在巴贝奇差分机的启发之下毅然决定开始学习一系列的新课程。“我必须断绝生活在愉悦和自我满足中的念头。”她在书信中向自己的新家教说道，“我发现似乎只有对科学课程进行非常深入和高强度的学习才能抑制我狂热的想象力……我认为自己首先要做的是彻底掌握一门数学课程。”这位家教也认同了这种治疗方式：“你的想法是正确的，你目前的主要对策和预防措施就是认真学习一门知识性课程。为了达到这个目的，没有比数学更合适的科目了。”[插图]他为埃达开出了欧几里得几何的处方，再配以三角函数和代数学。\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\",\"wordCount\":379758},\"chapter\":\"第一章 埃达·洛夫莱斯伯爵夫人\",\"date\":\"2024-12-19\"},{\"id\":\"151277:mark:151277_28_3198-3353\",\"quote\":\"。所以一个暴君政府的便利之处就在于它可以从远距离上行动。依靠它所建立起的各个支点，它的力量就可以像杠杆的力量一般随着长度而增大。反过来，人民的力量则只有集中起来才能发挥出来；若是分散开来，力量就会消失，就像撒在地面上的火药，只会星星点点地燃烧罢了。因此，人口稀少的国家最适合暴君制，凶猛的野兽只能在旷野中称王。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论没有一种政府形式适宜于\",\"date\":\"2024-12-18\"},{\"id\":\"566431:mark:566431_100_1305-1516\",\"quote\":\"身为初创企业，两个家族各有独立发展，不想招惹是非。但是随着事业发展壮大，它们就开始把注意力放在彼此身上了。蒙太古心里总是想着凯普莱特，而凯普莱特也时刻注意着蒙太古。结果是什么？结果是微软的Windows系统遇上了谷歌的Chrome OS，必应遇上了谷歌搜索，Explorer浏览器和Chrome浏览器针锋相对，Office办公软件和Docs办公软件争得不可开交，微软的Surface平板电脑和谷歌的Nexus平板电脑较劲。\",\"book\":{\"id\":\"566431\",\"title\":\"从0到1：开启商业与未来的秘密\",\"author\":\"彼得·蒂尔 布莱克·马斯特斯\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/431/566431/t6_566431.jpg\",\"url\":\"https://weread.qq.com/web/reader/3973284058a49f39706f0c0\",\"wordCount\":86323,\"spinePalette\":{\"paper\":\"rgb(116 170 204)\",\"ink\":\"#162a40\"}},\"chapter\":\"战争与和平\",\"date\":\"2024-12-16\",\"annotation\":\"想起了贝佐斯的一句话：“要慎重地选择你的竞争对手，因为你们最终会变得很像。”  国内内卷严重大概也是竞争意识太过强烈导致的。内卷不会产生从0到1的创新，只会让已经存在的事物被创造无数倍，美其名曰“从1到N”。然而，只是因为别人做过我们就要跟上，必然会消耗大量的精力与金钱，其结果就是不可能把所有事情做好（大多数项目都做不好，因为只有一小部分项目是天然适合自己的）\"},{\"id\":\"566431:mark:566431_106_1945-2004\",\"quote\":\"从中国的角度来看，经济增长得还不够快。其他国家都害怕中国将要统治整个世界，而中国是唯一一个认为自己不会统治世界的国家。\",\"book\":{\"id\":\"566431\",\"title\":\"从0到1：开启商业与未来的秘密\",\"author\":\"彼得·蒂尔 布莱克·马斯特斯\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/431/566431/t6_566431.jpg\",\"url\":\"https://weread.qq.com/web/reader/3973284058a49f39706f0c0\",\"wordCount\":86323,\"spinePalette\":{\"paper\":\"rgb(116 170 204)\",\"ink\":\"#162a40\"}},\"chapter\":\"你能掌控自己的未来吗？\",\"date\":\"2024-12-16\"},{\"id\":\"566431:mark:566431_106_2284-2348\",\"quote\":\"局外人着迷于中国内部的巨大财富，但是他们没有注意到，富有的中国人正努力把自己的财产转移出国，贫穷一些的则能省就省，以求储备充足。\",\"book\":{\"id\":\"566431\",\"title\":\"从0到1：开启商业与未来的秘密\",\"author\":\"彼得·蒂尔 布莱克·马斯特斯\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/431/566431/t6_566431.jpg\",\"url\":\"https://weread.qq.com/web/reader/3973284058a49f39706f0c0\",\"wordCount\":86323,\"spinePalette\":{\"paper\":\"rgb(116 170 204)\",\"ink\":\"#162a40\"}},\"chapter\":\"你能掌控自己的未来吗？\",\"date\":\"2024-12-16\",\"annotation\":\"彼得蒂尔眼光毒辣啊\"},{\"id\":\"566431:mark:566431_106_4176-4207\",\"quote\":\"与其努力数年开发一种新产品，迷茫的乐观主义者选择改进已有产品。\",\"book\":{\"id\":\"566431\",\"title\":\"从0到1：开启商业与未来的秘密\",\"author\":\"彼得·蒂尔 布莱克·马斯特斯\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/431/566431/t6_566431.jpg\",\"url\":\"https://weread.qq.com/web/reader/3973284058a49f39706f0c0\",\"wordCount\":86323,\"spinePalette\":{\"paper\":\"rgb(116 170 204)\",\"ink\":\"#162a40\"}},\"chapter\":\"你能掌控自己的未来吗？\",\"date\":\"2024-12-16\"},{\"id\":\"566431:mark:566431_106_4433-4541\",\"quote\":\"婴儿潮培养出一代迷茫的乐观主义者，他们理所当然地享受着不费吹灰之力得来的成果。不论你是出生在1945年，还是1950年，抑或是1955年，在你生命的头18年，你都会觉得世界真是越来越好，但这些和你根本一点关系都没有。\",\"book\":{\"id\":\"566431\",\"title\":\"从0到1：开启商业与未来的秘密\",\"author\":\"彼得·蒂尔 布莱克·马斯特斯\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/431/566431/t6_566431.jpg\",\"url\":\"https://weread.qq.com/web/reader/3973284058a49f39706f0c0\",\"wordCount\":86323,\"spinePalette\":{\"paper\":\"rgb(116 170 204)\",\"ink\":\"#162a40\"}},\"chapter\":\"你能掌控自己的未来吗？\",\"date\":\"2024-12-16\"},{\"id\":\"566431:mark:566431_106_4914-5014\",\"quote\":\"这些婴儿潮时期出生的人长大后，认为成功人士之所以能够成功是由其个人背景决定的，而个人背景具有很大的偶然性。但是他们忽视了更大的社会背景：这一代人从孩童时期就过高地估计了机遇的力量，低估了规划的重要性。\",\"book\":{\"id\":\"566431\",\"title\":\"从0到1：开启商业与未来的秘密\",\"author\":\"彼得·蒂尔 布莱克·马斯特斯\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/431/566431/t6_566431.jpg\",\"url\":\"https://weread.qq.com/web/reader/3973284058a49f39706f0c0\",\"wordCount\":86323,\"spinePalette\":{\"paper\":\"rgb(116 170 204)\",\"ink\":\"#162a40\"}},\"chapter\":\"你能掌控自己的未来吗？\",\"date\":\"2024-12-16\",\"annotation\":\"当机遇收窄，对未来的判断与规划就更加重要了。在机遇众多的时候，多寻求新的机会（什么是变的）；在机遇减少的时候，更多地去想一想那些不会过时的道理（什么是不变的）\\n\"},{\"id\":\"566431:mark:566431_127_374-404\",\"quote\":\"摇滚歌手鲍勃·迪伦曾说过，一个人不是忙着出生，就是忙着去死。\",\"book\":{\"id\":\"566431\",\"title\":\"从0到1：开启商业与未来的秘密\",\"author\":\"彼得·蒂尔 布莱克·马斯特斯\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/431/566431/t6_566431.jpg\",\"url\":\"https://weread.qq.com/web/reader/3973284058a49f39706f0c0\",\"wordCount\":86323,\"spinePalette\":{\"paper\":\"rgb(116 170 204)\",\"ink\":\"#162a40\"}},\"chapter\":\"让创业延续\",\"date\":\"2024-12-16\"},{\"id\":\"566431:mark:566431_129_955-1032\",\"quote\":\"时间是最宝贵的资产，将时间浪费在不能长久合作的人身上得不偿失。如果你不能在工作上建立持久的关系，那么你就浪费了时间——即使纯粹从财务的角度来看，也是如此。\",\"book\":{\"id\":\"566431\",\"title\":\"从0到1：开启商业与未来的秘密\",\"author\":\"彼得·蒂尔 布莱克·马斯特斯\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/431/566431/t6_566431.jpg\",\"url\":\"https://weread.qq.com/web/reader/3973284058a49f39706f0c0\",\"wordCount\":86323,\"spinePalette\":{\"paper\":\"rgb(116 170 204)\",\"ink\":\"#162a40\"}},\"chapter\":\"“PayPal黑帮”\",\"date\":\"2024-12-16\"},{\"id\":\"566431:review:6166943_7WtyFYLnN\",\"quote\":\"\",\"annotation\":\"十年前，这本书引发了巨大轰动，印象比较深刻的是国内很多专家认为中国虽然“从0到1”不太行，但是很擅长做“从1到N”的微创新。到了十年后的今天，我们被这些“微创新”改变了一些，但是对我们改变最大的还是像短视频、直播之类的“从0到1”的东西。抖音快手等企业崛起之后，事实上就不太可能存在另一家足够强大的短视频平台了。\\n\\n而那些“从1到N”的创新，比如新能源汽车，做得非常好，但其原因是汽车容易做出不完全同质化的产品，大家的品味与需求以及厂家的产品线的有限性导致在该产业中难以一家通吃。\\n\\n在互联网企业中，很遗憾，我们看不到多少成功的“从1到N”的企业。或许，团购、外卖与打车软件很成功，但是那个竞争太惨烈了，充分体现了中国企业家的疯狂，但那一段惨烈的记忆恐怕也会像一战之于法国一样，牺牲掉一代企业家的勇气。\\n\\n\\n\\n\\n\",\"date\":\"2024-12-16\",\"book\":{\"id\":\"566431\",\"title\":\"从0到1：开启商业与未来的秘密\",\"author\":\"彼得·蒂尔 布莱克·马斯特斯\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/431/566431/t6_566431.jpg\",\"url\":\"https://weread.qq.com/web/reader/3973284058a49f39706f0c0\",\"wordCount\":86323,\"spinePalette\":{\"paper\":\"rgb(116 170 204)\",\"ink\":\"#162a40\"}},\"bookReview\":true},{\"id\":\"3300025948:mark:3300025948_17_6975-7027\",\"quote\":\"一个好的科学家得是一个具有原创思想的人，而一个好的工程师，是一个能让其设计中包含尽可能少的原创思想的人。\",\"book\":{\"id\":\"3300025948\",\"title\":\"宇宙波澜：科技与人类前途的自省\",\"author\":\"弗里曼·戴森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/28/cpPlatform_fTiFPYiwMoM3kHE4Cqrs2j/t6_cpPlatform_fTiFPYiwMoM3kHE4Cqrs2j.jpg\",\"url\":\"https://weread.qq.com/web/reader/fff32c90813ab70a2g0186a1\",\"wordCount\":192625},\"chapter\":\"10 1970年到达土星\",\"date\":\"2024-12-12\",\"annotation\":\"工程与科学有时候差异巨大，甚至有点对立\"},{\"id\":\"3300025948:mark:3300025948_8_3011-3047\",\"quote\":\"无论有多少可能性，我都没有多少年头可活了，不做数学的每小时都是可悲的浪费\",\"book\":{\"id\":\"3300025948\",\"title\":\"宇宙波澜：科技与人类前途的自省\",\"author\":\"弗里曼·戴森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/28/cpPlatform_fTiFPYiwMoM3kHE4Cqrs2j/t6_cpPlatform_fTiFPYiwMoM3kHE4Cqrs2j.jpg\",\"url\":\"https://weread.qq.com/web/reader/fff32c90813ab70a2g0186a1\",\"wordCount\":192625},\"chapter\":\"2 浮士德的救赎\",\"date\":\"2024-12-10\"},{\"id\":\"151277:mark:151277_18_1640-1745\",\"quote\":\"在欧洲却还有一个可以这样立法的国家——那就是科西嘉岛。在恢复与保卫他们的自由时，这个勇敢的民族所具有的坚决与豪迈，确实值得出现一位智者来教导他们如何保全自由。我有一种预感，那座小岛总有一天会使全欧洲感到震惊的。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论人民（续）\",\"date\":\"2024-12-05\",\"annotation\":\"拿破仑？这预言绝了\"},{\"id\":\"3300118948:review:6166943_7W5tGp9Rb\",\"quote\":\"\",\"annotation\":\"$1e\",\"date\":\"2024-11-30\",\"book\":{\"id\":\"3300118948\",\"title\":\"暗淡蓝点：探寻人类的太空家园\",\"author\":\"[美]卡尔·萨根\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/77/cpplatform_27faa17tfebs2pc9ndmsqb/t6_cpplatform_27faa17tfebs2pc9ndmsqb1729826325.jpg\",\"url\":\"https://weread.qq.com/web/reader/e7132fa0813ab94f6g0181d5\",\"wordCount\":227914},\"bookReview\":true},{\"id\":\"32320209:mark:32320209_7_8330-8400\",\"quote\":\"我的项目只是在自然法则的作用下暂时推迟了，目前的世界还没有做好迎接它的准备。它远远超过了当前的时代，但是自然法则终将获胜，我的项目终将成功。\",\"book\":{\"id\":\"32320209\",\"title\":\"被世界遗忘的天才：特斯拉回忆录\",\"author\":\"尼古拉·特斯拉\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/13/YueWen_32320209/t6_YueWen_32320209.jpg\",\"url\":\"https://weread.qq.com/web/reader/6ec3214071ed2ad16ec6355\",\"wordCount\":\"$undefined\"},\"chapter\":\"第五章 放大发射机\",\"date\":\"2024-11-02\"},{\"id\":\"35239336:mark:35239336_25_48985-49023\",\"quote\":\"我的全部思想只是，如果坏人结合成一股势力，那么好人也应该这样做。这道理很简单\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"尾声\",\"date\":\"2024-11-02\"},{\"id\":\"32320209:mark:32320209_3_4780-4866\",\"quote\":\"当人们制造装置去试验某个粗略的想法时，总会发现自己不可避免地将注意力集中在装置的细节上。在对装置进行不断改进和重新制造的过程中，他的注意力就会慢慢分散，并忽略设计的基本原理\",\"book\":{\"id\":\"32320209\",\"title\":\"被世界遗忘的天才：特斯拉回忆录\",\"author\":\"尼古拉·特斯拉\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/13/YueWen_32320209/t6_YueWen_32320209.jpg\",\"url\":\"https://weread.qq.com/web/reader/6ec3214071ed2ad16ec6355\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一章 我的少年生活\",\"date\":\"2024-10-30\"},{\"id\":\"32320209:mark:32320209_3_4910-5028\",\"quote\":\"我不会仓促进行实际工作。当我有设计思路时，就会立刻用想象把它勾勒出来。我在脑海中修改框架，不断完善，并进行试验操作。不管在头脑中运行自己的涡轮机，还是在工作室进行测试，对于我来说，完全都是想象行为。我甚至可以想象到涡轮机出现故障的细节。\",\"book\":{\"id\":\"32320209\",\"title\":\"被世界遗忘的天才：特斯拉回忆录\",\"author\":\"尼古拉·特斯拉\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/13/YueWen_32320209/t6_YueWen_32320209.jpg\",\"url\":\"https://weread.qq.com/web/reader/6ec3214071ed2ad16ec6355\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一章 我的少年生活\",\"date\":\"2024-10-30\"},{\"id\":\"3300118948:mark:3300118948_10_5978-6251\",\"quote\":\"再看看那个光点，它就在这里。这是家园，这是我们。你所爱的每一个人，你认识的每一个人，你听说过的每一个人，曾经有过的每一个人，都在它的上面度过他们的一生。我们的欢乐与痛苦聚集在一起。数以千计的自以为是的宗教、意识形态和经济学说，每一个猎人与采集者，每一个英雄与懦夫，每一个文明的缔造者与毁灭者，每一个国王与农夫，每一对年轻爱侣，每一个母亲和父亲，每一个满怀希望的孩子，每一个发明家和探险家，每一个德高望重的教师，每一个腐败的政客，每一个“超级明星”，每一个“最高领导者”，人类历史上的每一个圣人与罪犯，都生活在这里——一粒悬浮在太阳光中的细小尘埃。\",\"book\":{\"id\":\"3300118948\",\"title\":\"暗淡蓝点：探寻人类的太空家园\",\"author\":\"[美]卡尔·萨根\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/77/cpplatform_27faa17tfebs2pc9ndmsqb/t6_cpplatform_27faa17tfebs2pc9ndmsqb1729826325.jpg\",\"url\":\"https://weread.qq.com/web/reader/e7132fa0813ab94f6g0181d5\",\"wordCount\":227914},\"chapter\":\"第1章 你在这里\",\"date\":\"2024-10-29\"},{\"id\":\"35239336:mark:35239336_22_1174-1288\",\"quote\":\"一个历史事件不可能有多种原因，只能有一种原因。但支配事件的规律，有些是未知的，有些已被我们摸索出来。我们只有摈弃从某一个人的意志中寻求原因的方法，才能发现这些规律，就像人们只有摈弃地球固定不动的观念，才能发现行星运动的规律一样。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二部\",\"date\":\"2024-10-26\"},{\"id\":\"35239336:mark:35239336_22_822-882\",\"quote\":\"人的智力不深入了解无数错综复杂的条件（其中每一个条件单独看都像是原因），只随便抓住一个首先碰到的近似条件说：这就是原因。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第二部\",\"date\":\"2024-10-26\"},{\"id\":\"701313:mark:701313_15_354-447\",\"quote\":\"年轻的福特当时最为人所知的名声莫过于雇用“枪手”为其撰写期末论文，并且在“枪手”开出的发票还夹在论文里的情况下就把论文交了上去，他这种对待学术极不认真的态度导致了被耶鲁大学开除学籍的结果\",\"book\":{\"id\":\"701313\",\"title\":\"高盛帝国\",\"author\":\"查尔斯·埃利斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/25/YueWen_701313/t6_YueWen_701313.jpg\",\"url\":\"https://weread.qq.com/web/reader/867322405ab3818677853d9\",\"wordCount\":\"$undefined\"},\"chapter\":\"福特：最大一单首次公开发行\",\"date\":\"2024-10-25\"},{\"id\":\"701313:mark:701313_15_508-541\",\"quote\":\"你需要放多少套新的进去就拿出多少套旧的来——拿出来的就随你处置吧。\",\"book\":{\"id\":\"701313\",\"title\":\"高盛帝国\",\"author\":\"查尔斯·埃利斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/25/YueWen_701313/t6_YueWen_701313.jpg\",\"url\":\"https://weread.qq.com/web/reader/867322405ab3818677853d9\",\"wordCount\":\"$undefined\"},\"chapter\":\"福特：最大一单首次公开发行\",\"date\":\"2024-10-25\"},{\"id\":\"MP_WXS_3224065282:mark:MP_WXS_3224065282_fJuC6uh6beJjGIaX~RW7kQ_2787-2934\",\"quote\":\"假如学术工作的基本动力不再是对知识的追求和“好奇心”而是“绩效”，“学者”则要不可避免地变成“打工人”，科研工作的核心则难免由“知识生产”变成“应付考核”。这一转变的代价是，个人需要始终面对高水平的压力和焦虑，被掌控的感觉以及专业理想的破灭；对学术事业和国家的创新能力而言，这无疑是极大的隐患。\",\"book\":{\"id\":\"MP_WXS_3224065282\",\"title\":\"知识分子\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/58e427e224d505f5758535f33323234303635323832c97\",\"wordCount\":\"$undefined\"},\"date\":\"2024-10-25\"},{\"id\":\"MP_WXS_3224065282:mark:MP_WXS_3224065282_fJuC6uh6beJjGIaX~RW7kQ_3883-3950\",\"quote\":\"对学者而言，既然日常工作的道德追求已然由“为社会”生产知识变成“为自己”负责，那么所有努力必然指向打造个人亮眼的学术履历而非社会责任。\",\"book\":{\"id\":\"MP_WXS_3224065282\",\"title\":\"知识分子\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/58e427e224d505f5758535f33323234303635323832c97\",\"wordCount\":\"$undefined\"},\"date\":\"2024-10-25\"},{\"id\":\"32908875:mark:32908875_4_2621-2721\",\"quote\":\"解决城市交通问题不是靠修更多的道路来解决，那只能使城市最具活力的区域不断受到侵蚀，而是应该通过减少汽车的使用机会的方式来解决，包括提高使用汽车的难度，以及提供多种出行选择来慢慢减少人们对进城汽车的依赖\",\"book\":{\"id\":\"32908875\",\"title\":\"美国大城市的死与生（60周年致敬版）\",\"author\":\"[加]简·雅各布斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/0/YueWen_32908875/t6_YueWen_32908875.jpg\",\"url\":\"https://weread.qq.com/web/reader/a8d328b071f6264ba8df4e1\",\"wordCount\":366287},\"chapter\":\"谁毁了城市？六十年后再读《美国大城市的死与生》\",\"date\":\"2024-10-23\"},{\"id\":\"32908875:mark:32908875_4_4779-4917\",\"quote\":\"如果说学习西方先进思想需要结合中国特色的话，那么，我更愿意把雅各布斯女士的那面城市生死之镜，比作《红楼梦》中贾瑞从神秘道士那里得到的、警幻仙姑所制的那面“风月宝鉴”，它正可照见风花月夜，最终却使人在短暂的欢愉之后，命归黄泉；反则可照见骷髅朽骨，却可以救人于膏肓，有起死回生之效\",\"book\":{\"id\":\"32908875\",\"title\":\"美国大城市的死与生（60周年致敬版）\",\"author\":\"[加]简·雅各布斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/0/YueWen_32908875/t6_YueWen_32908875.jpg\",\"url\":\"https://weread.qq.com/web/reader/a8d328b071f6264ba8df4e1\",\"wordCount\":366287},\"chapter\":\"谁毁了城市？六十年后再读《美国大城市的死与生》\",\"date\":\"2024-10-23\"},{\"id\":\"32908875:mark:32908875_7_609-756\",\"quote\":\"生活本身就是目的。若问生活是否有价值，唯一答案就在于你的生活是否足够丰富。还有一点不能忘记：我们每个人都濒临绝望。托护着我们渡过绝望之海的，是希望，是深信我们自身难以解释的价值，我们确定不移的努力，以及运用我们自身力量所带来的潜在满足感。\",\"book\":{\"id\":\"32908875\",\"title\":\"美国大城市的死与生（60周年致敬版）\",\"author\":\"[加]简·雅各布斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/0/YueWen_32908875/t6_YueWen_32908875.jpg\",\"url\":\"https://weread.qq.com/web/reader/a8d328b071f6264ba8df4e1\",\"wordCount\":366287},\"chapter\":\"卷首\",\"date\":\"2024-10-23\"},{\"id\":\"32908875:review:6166943_7V9WE4IRv\",\"quote\":\"他们费尽了心思去学习现代正统规划理论的圣人先贤们曾经说过的话，如城市理应如何运作，以及什么理应为城市里的人们和企业带来好处。他们对这些思想如此投入，以至于当现实矛盾威胁到要推翻他们千辛万苦学来的知识时，他们一定会把现实撇在一边。\",\"annotation\":\"本本主义\",\"chapter\":\"一 导言\",\"date\":\"2024-10-23\",\"book\":{\"id\":\"32908875\",\"title\":\"美国大城市的死与生（60周年致敬版）\",\"author\":\"[加]简·雅各布斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/0/YueWen_32908875/t6_YueWen_32908875.jpg\",\"url\":\"https://weread.qq.com/web/reader/a8d328b071f6264ba8df4e1\",\"wordCount\":366287}},{\"id\":\"34222392:mark:34222392_2_1843-2000\",\"quote\":\"火箭科学家们要想象那些无法想象的事情，解决那些无法解决的问题。他们将失败转化为胜利，把束缚转化为优势；他们认为小事故只是可以解决的难题，而非不可逾越的障碍；他们前进的动力不是盲目的信念，而是自我怀疑；他们的目标不是短期结果，而是长期突破；他们知道规则不是一成不变的，已设定的东西可以更改，他们能开辟出一条新的路径。\",\"book\":{\"id\":\"34222392\",\"title\":\"像火箭科学家一样思考：将不可能变为可能\",\"author\":\"奥赞·瓦罗尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_34222392/t6_YueWen_34222392.jpg\",\"url\":\"https://weread.qq.com/web/reader/fc032510720a3138fc06b99\",\"wordCount\":203145,\"spinePalette\":{\"paper\":\"rgb(29 21 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"序言\",\"date\":\"2024-10-23\"},{\"id\":\"34222392:mark:34222392_2_4580-4680\",\"quote\":\"对于我们来说，批判性思维和创造力不是天生的。我们不敢往大处着眼，不愿与不确定性共舞，而且害怕失败。这些心态在旧石器时代是必要的，它们使我们免受有毒食物和食肉动物的伤害。但在信息时代，它们就变成了缺点。\",\"book\":{\"id\":\"34222392\",\"title\":\"像火箭科学家一样思考：将不可能变为可能\",\"author\":\"奥赞·瓦罗尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_34222392/t6_YueWen_34222392.jpg\",\"url\":\"https://weread.qq.com/web/reader/fc032510720a3138fc06b99\",\"wordCount\":203145,\"spinePalette\":{\"paper\":\"rgb(29 21 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"序言\",\"date\":\"2024-10-23\"},{\"id\":\"34222392:mark:34222392_2_724-771\",\"quote\":\"用NASA一名官员的话来说，我们甚至不知道“如何计算地球轨道，更别提登月火箭的发射轨道了”​。\",\"book\":{\"id\":\"34222392\",\"title\":\"像火箭科学家一样思考：将不可能变为可能\",\"author\":\"奥赞·瓦罗尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_34222392/t6_YueWen_34222392.jpg\",\"url\":\"https://weread.qq.com/web/reader/fc032510720a3138fc06b99\",\"wordCount\":203145,\"spinePalette\":{\"paper\":\"rgb(29 21 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"序言\",\"date\":\"2024-10-23\"},{\"id\":\"34222392:mark:34222392_5_1807-1980\",\"quote\":\"在现代世界，我们在不确定性中寻找确定性，在混乱中搜索秩序，在歧义中寻找正确回答，在错综复杂中寻找坚定。“我们花了更多的时间和精力尝试控制这个世界，而不是尝试着去理解它。”尤瓦尔·诺亚·赫拉利（Yuval Noah Harari）写道。我们寻找的是循规蹈矩的公式、捷径和投机取巧——那袋花生就是明证。随着时间的推移，我们丧失了与未知事物共处的能力。\",\"book\":{\"id\":\"34222392\",\"title\":\"像火箭科学家一样思考：将不可能变为可能\",\"author\":\"奥赞·瓦罗尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_34222392/t6_YueWen_34222392.jpg\",\"url\":\"https://weread.qq.com/web/reader/fc032510720a3138fc06b99\",\"wordCount\":203145,\"spinePalette\":{\"paper\":\"rgb(29 21 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"对确定性的迷恋\",\"date\":\"2024-10-23\"},{\"id\":\"34222392:mark:34222392_5_2033-2091\",\"quote\":\"一名醉汉在夜晚的路灯下找他的钥匙。他知道自己把钥匙丢在了街上某个黑暗的地方，可他却在路灯下苦苦寻找，因为那里有灯光。\",\"book\":{\"id\":\"34222392\",\"title\":\"像火箭科学家一样思考：将不可能变为可能\",\"author\":\"奥赞·瓦罗尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_34222392/t6_YueWen_34222392.jpg\",\"url\":\"https://weread.qq.com/web/reader/fc032510720a3138fc06b99\",\"wordCount\":203145,\"spinePalette\":{\"paper\":\"rgb(29 21 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"对确定性的迷恋\",\"date\":\"2024-10-23\"},{\"id\":\"34222392:mark:34222392_5_2367-2476\",\"quote\":\"但是，只有当我们敢于牺牲确定性答案，敢于冒险，敢于远离路灯的时候，才能真正实现突破。如果你固步自封，就不会有出人意料的发现。唯有那些领先时代之人，才敢于与伟大的未知事物共舞，并在现状中发现潜伏的危机，而不是满足于现状。\",\"book\":{\"id\":\"34222392\",\"title\":\"像火箭科学家一样思考：将不可能变为可能\",\"author\":\"奥赞·瓦罗尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_34222392/t6_YueWen_34222392.jpg\",\"url\":\"https://weread.qq.com/web/reader/fc032510720a3138fc06b99\",\"wordCount\":203145,\"spinePalette\":{\"paper\":\"rgb(29 21 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"对确定性的迷恋\",\"date\":\"2024-10-23\"},{\"id\":\"35239336:mark:35239336_20_1905-1962\",\"quote\":\"只有承认无穷小的单位——历史的微分（就是人的个人倾向）而进行观察，并掌握求积分的方法，我们才有希望认识历史的规律。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第三卷\",\"date\":\"2024-10-23\",\"annotation\":\"追问一件事情背后的原因，或可以认为是对现象的曲线进行求导\"},{\"id\":\"35239336:mark:35239336_20_2480-2549\",\"quote\":\"我每次看表，时针指到“十”，我就听见附近教堂钟声当当，但我不能因此得出结论说，每当指针指到“十”，教堂响起钟声，时针的位置就是打钟的原因。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第三卷\",\"date\":\"2024-10-23\",\"annotation\":\"一只鸡可能以为太阳是它叫起来的\"},{\"id\":\"35239336:mark:35239336_20_2879-3020\",\"quote\":\"要研究历史规律，我们应该完全改变观察的对象，抛开帝王将相，而着眼研究支配群众的同类无穷小的因素。没有人说得出，这样研究历史规律，人们能取得多大成就；但显而易见，只有用这种方法，才有可能发现历史规律，而人的智慧在这方面所做的，还不及史学家描述帝王将相事迹和评论他们行为的百万分之一呢。\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第三卷\",\"date\":\"2024-10-23\"},{\"id\":\"35239336:mark:35239336_20_3258-3271\",\"quote\":\"侵略就凭着一股冲力向前推进\",\"book\":{\"id\":\"35239336\",\"title\":\"战争与和平（全集）\",\"author\":\"[俄]列夫·托尔斯泰\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/32/YueWen_35239336/t6_YueWen_35239336.jpg\",\"url\":\"https://weread.qq.com/web/reader/1b5329307219b5a81b52f62\",\"wordCount\":962218},\"chapter\":\"第三卷\",\"date\":\"2024-10-23\"},{\"id\":\"907771:mark:907771_136_1337-1572\",\"quote\":\"为什么家长要这样伪装呢？因为他们觉得孩子不应该知道成年人语言的所有内容，只需知道一部分适合儿童的词就行了。我们喜欢孩子们看上去天真无邪。[插图]\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"道貌岸然\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_136_1680-1717\",\"quote\":\"扪心自问，我们向孩子灌输圣诞老人的神话，到底是为了孩子，还是为了我们自己？\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"道貌岸然\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_139_1918-1955\",\"quote\":\"能够一起谈论“异端邪说”并且不会因此气急败坏的人，就是你最应该认识的朋友。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"守口如瓶\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_139_847-905\",\"quote\":\"我就鼓励自己在心里默默思考那些最无法无天的想法。你的思想是一个“地下组织”，绝不要把那里发生的事情一股脑说给外人听。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"守口如瓶\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_165_861-885\",\"quote\":\"金钱不是财富，而只是我们用来转移财富所有权的东西\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"大饼谬论\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_168_1129-1202\",\"quote\":\"如果一家公司真正能够按照贡献付薪，它将取得巨大成功。许多雇员会更努力地工作。更重要的是，这样一家公司将吸引那些工作特别努力的人，从而超越竞争对手。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"更努力地工作\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_168_1527-1556\",\"quote\":\"在大公司中，个人的表现无法单独测量，公司里其他人会拖累你。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"更努力地工作\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_169_435-468\",\"quote\":\"此外，你还必须有可放大性，也就是说你做出的决定能够产生巨大的效应。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"可测量性和可放大性\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_169_553-624\",\"quote\":\"你的表现可以被测量，并且据此得到回报，但是你没有决策的权力。你能做的唯一决策就是以多快的速度完成工作。即使你做到最快，回报可能也只增加一两倍。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"可测量性和可放大性\",\"date\":\"2024-10-22\"},{\"id\":\"907771:review:6166943_7V7ZArs1x\",\"quote\":\"\",\"annotation\":\"作者在书中有很多具有前瞻性的看法。\\n\\n书里的第一部分关于社会，第二部分关于商业，第三部分关于技术。这三部分的观点都具有很强的预见性，非常犀利。即便是一些关于技术的观点，虽然过去二十多年迭代迅速，但放在今天也非常具有参考价值。\",\"date\":\"2024-10-22\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"bookReview\":true},{\"id\":\"907771:mark:907771_143_4969-5017\",\"quote\":\"黑客永远是自负的。如果黑客有自己的节日，那就是4月1日愚人节，在这一天，你可以放心地作弄其他人。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"4 良好的坏习惯\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_143_7400-7467\",\"quote\":\"如果读美国开国元勋的自述，你会发现他们听起来很像黑客。“反抗政府的精神，”杰斐逊写道，“在某些场合是如此珍贵，我希望它永远保持活跃。”\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"4 良好的坏习惯\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_143_7627-7674\",\"quote\":\"那些占据高位、本能地想要约束黑客、强迫黑客服从的人，请谨慎施为，因为你们真有可能成为千古罪人。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"4 良好的坏习惯\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_152_1303-1428\",\"quote\":\"随着参与人数的增加，人与人之间需要的沟通成本呈现指数级增长。人数越来越多，开会讨论各个部分如何协同工作所需的时间越来越长，无法预见的互相影响越来越大，产生的bug也越来越多。幸运的是，这个过程的逆向也成立：人数越来越少，软件开发的效率将呈指数式上升。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"逆向的《人月神话》\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_1010-1091\",\"quote\":\"如果这样的用户使用盗版，你并没有任何损失。事实上，你反而赚到了，因为你的软件现在多了一个用户，市场影响力就更大了一些，而这个用户可能毕业以后就会出钱购买你的软件。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_1578-1616\",\"quote\":\"Intel服务器版本更贵的原因。如果一个公司购买Sun服务器，就表明它很有钱\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_1641-1933\",\"quote\":\"盗版实质上是一种价格歧视，只不过针对的是最底层的消费者。我觉得，软件公司明白这个道理，所以故意对某些盗版行为睁一只眼闭一只眼。[插图]由于互联网软件无法盗版，所以软件公司必须想出其他策略推广软件。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_2068-2163\",\"quote\":\"事实上，第二步对第一步有反作用，如果某样商品购买起来很困难，人们就会改变主意，放弃购买。反过来也成立，如果某样东西易于购买，你就会多买一点。自从有了亚马逊网上书店，我买的新书比什么时候都多。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_421-492\",\"quote\":\"第一眼看上去，这种说法好像很滑稽，但是后来我意识到这个观点是对的，因为它反映了软件开发的现实：软件开发不是静态的，而是一个持续不断的动态过程。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_752-920\",\"quote\":\"对于软件公司来说，互联网软件是一个很理想的收入来源。你每个季度的销售额不是从零开始，而是拥有一个持续的现金流。因为互联网软件每时每刻都可以升级，所以你不用担心做错什么事。事实上，你不可能真的做错什么事，因为如果用户痛恨你对软件的修改，你马上就会知道。你也不会有坏账的烦恼，如果谁不付钱，你就停止对他的服务。此外，你也不可能遇到盗版问题。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_210_465-506\",\"quote\":\"所谓“一次性程序”，就是指为了完成某些很简单的临时性任务而在很短时间内写出来的程序\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"一次性程序\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_210_568-661\",\"quote\":\"令人吃惊的是，一次性程序往往不是真的只用一次，就像第二次世界大战期间很多美国大学造的一大批临时建筑后来都成了永久建筑。许多一次性程序后来也都变成了正式的程序，具备了正式的功能和外部用户。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"一次性程序\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_210_742-790\",\"quote\":\"一下子从无到有做出一个大项目是很恐怖的一件事。当人们接手一个巨型项目时，很容易被它搞得一蹶不振。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"一次性程序\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_210_904-935\",\"quote\":\"开发大型程序的另一个方法就是从一次性程序开始，然后不断地改进。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"一次性程序\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_213_1032-1074\",\"quote\":\"人们真正注意到你的时候，不是第一眼看到你站在那里，而是发现过了这么久你居然还在那里。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"时间\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_213_717-806\",\"quote\":\"大多数人接触新事物时会使用类似的过滤机制，甚至有时要听到别人提起十遍以上他们才会留意。这样做完全是合理的，因为大多数热门新商品事后被证明是浪费时间的噱头，没多久就消失得无影无踪。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"时间\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_213_829-875\",\"quote\":\"但是我决定等到一两年后再去学习它，结果一两年后已经没有学习的必要了，因为市场已经把它遗忘了。\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"wordCount\":187889},\"chapter\":\"时间\",\"date\":\"2024-10-20\"},{\"id\":\"842282:mark:842282_11_13485-13540\",\"quote\":\"在普遍性里，思维得到自身的满足，但假如思维对于特殊性采取漠视态度，从而思维对于它自身的发展，也就采取漠视态度了\",\"book\":{\"id\":\"842282\",\"title\":\"小逻辑\",\"author\":\"黑格尔著\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/282/842282/t6_842282.jpg\",\"url\":\"https://weread.qq.com/web/reader/9fe325a05cda2a9fea10c24\",\"wordCount\":\"$undefined\"},\"chapter\":\"导言\",\"date\":\"2024-10-12\"},{\"id\":\"842282:mark:842282_11_14439-14614\",\"quote\":\"哲学史上所表现的种种不同的体系，一方面我们可以说，只是一个哲学体系，在发展过程中的不同阶段罢了。另一方面我们也可以说，那些作为各个哲学体系的基础的特殊原则，只不过是同一思想整体的一些分支罢了。那在时间上最晚出的哲学体系，乃是前此一切体系的成果，因而必定包括前此各体系的原则在内；所以一个真正名副其实的哲学体系，必定是最渊博、最丰富和最具体的哲学体系。\",\"book\":{\"id\":\"842282\",\"title\":\"小逻辑\",\"author\":\"黑格尔著\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/282/842282/t6_842282.jpg\",\"url\":\"https://weread.qq.com/web/reader/9fe325a05cda2a9fea10c24\",\"wordCount\":\"$undefined\"},\"chapter\":\"导言\",\"date\":\"2024-10-12\"},{\"id\":\"842282:mark:842282_11_18254-18426\",\"quote\":\"因此〔哲学〕这门科学可以分为三部分：1．逻辑学，研究理念自在自为的科学。2．自然哲学，研究理念的异在或外在化的科学。3．精神哲学，研究理念由它的异在而返回到它自身的科学。\",\"book\":{\"id\":\"842282\",\"title\":\"小逻辑\",\"author\":\"黑格尔著\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/282/842282/t6_842282.jpg\",\"url\":\"https://weread.qq.com/web/reader/9fe325a05cda2a9fea10c24\",\"wordCount\":\"$undefined\"},\"chapter\":\"导言\",\"date\":\"2024-10-12\"},{\"id\":\"37209427:mark:37209427_6_3838-3934\",\"quote\":\"其中最重要的一点，是将知识和推理从人工智能的核心角色中抹去。在麦卡锡的人工智能系统设想中，逻辑模型是其核心，所有的人工智能行为都围绕这一核心进行(如上一章的图8所示)，而这个设想遭到了强烈抨击\",\"book\":{\"id\":\"37209427\",\"title\":\"人工智能全传\",\"author\":\"迈克尔·伍尔德里奇\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/427/37209427/t6_37209427.jpg\",\"url\":\"https://weread.qq.com/web/reader/b9532c307237c553b95aae7\",\"wordCount\":186941},\"chapter\":\"第四章 机器人与其合理性\",\"date\":\"2024-10-11\"},{\"id\":\"37209427:mark:37209427_6_586-704\",\"quote\":\"哲学家托马斯·库恩(Thomas Kuhn)在其1962年出版的著作《科学革命的结构》一书中指出，随着科学认知的发展，有时候旧有科学体系会面临全盘崩溃的危机，新的科学体系诞生，取代传统的、既定的科学体系，这就意味着科学的范式将发生变化。\",\"book\":{\"id\":\"37209427\",\"title\":\"人工智能全传\",\"author\":\"迈克尔·伍尔德里奇\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/427/37209427/t6_37209427.jpg\",\"url\":\"https://weread.qq.com/web/reader/b9532c307237c553b95aae7\",\"wordCount\":186941},\"chapter\":\"第四章 机器人与其合理性\",\"date\":\"2024-10-11\"},{\"id\":\"37209427:mark:37209427_6_5874-6038\",\"quote\":\"人工智能的新范式被称为基于行为的人工智能，正如我们接下来要讨论的，它强调了特定的个体行为的重要性，这些行为有助于智能系统的整体运行。布鲁克斯采用的特殊方法被称为包容式体系结构，在当时出现的所有方法中，它似乎是影响力最持久的。\",\"book\":{\"id\":\"37209427\",\"title\":\"人工智能全传\",\"author\":\"迈克尔·伍尔德里奇\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/427/37209427/t6_37209427.jpg\",\"url\":\"https://weread.qq.com/web/reader/b9532c307237c553b95aae7\",\"wordCount\":186941},\"chapter\":\"第四章 机器人与其合理性\",\"date\":\"2024-10-11\"},{\"id\":\"37209427:mark:37209427_6_9613-9754\",\"quote\":\"而一直到90年代中期，人们才达成共识，所谓的智能体应该具备以下三种特性：首先，它们必须反应灵敏，必须迅速适应自己的环境，并且能够在环境变化中适时地调整自己的行为；第二，它们必须积极主动，能够系统地完成用户赋予它们的任务；最后，智能体需要有协作性，即在需要的时候能够和其他智能体合作。\",\"book\":{\"id\":\"37209427\",\"title\":\"人工智能全传\",\"author\":\"迈克尔·伍尔德里奇\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/427/37209427/t6_37209427.jpg\",\"url\":\"https://weread.qq.com/web/reader/b9532c307237c553b95aae7\",\"wordCount\":186941},\"chapter\":\"第四章 机器人与其合理性\",\"date\":\"2024-10-11\"},{\"id\":\"37209427:review:6166943_7URTLOQhI\",\"quote\":\"\",\"annotation\":\"通俗易懂，娓娓道来。\\nAI的发展历程真是一波三折。\",\"date\":\"2024-10-11\",\"book\":{\"id\":\"37209427\",\"title\":\"人工智能全传\",\"author\":\"迈克尔·伍尔德里奇\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/427/37209427/t6_37209427.jpg\",\"url\":\"https://weread.qq.com/web/reader/b9532c307237c553b95aae7\",\"wordCount\":186941},\"bookReview\":true},{\"id\":\"23458702:mark:23458702_61_669-763\",\"quote\":\"“曼巴精神”是一种思维模式，它不在于寻求结果，而在于如何做才能取得结果，在于从现实到目标的这个过程。它是一段旅程、一种方法、一种生活方式。我真心认为，在所有努力之中，拥有这种心态最为重要。\",\"book\":{\"id\":\"23458702\",\"title\":\"曼巴精神：科比自传\",\"author\":\"科比·布莱恩特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/702/23458702/t6_23458702.jpg\",\"url\":\"https://weread.qq.com/web/reader/9c6322f07165f38e9c6ea43\",\"wordCount\":49894,\"spinePalette\":{\"paper\":\"rgb(17 17 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"曼巴精神\",\"date\":\"2024-10-03\"},{\"id\":\"23458702:mark:23458702_63_1205-1272\",\"quote\":\"谢天谢地，我在1998年就看到了这张照片。经过研究，我纠正了自己的姿势，调整了身体平衡。从那以后，任何人再想在低位单打我，都会困难许多\",\"book\":{\"id\":\"23458702\",\"title\":\"曼巴精神：科比自传\",\"author\":\"科比·布莱恩特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/702/23458702/t6_23458702.jpg\",\"url\":\"https://weread.qq.com/web/reader/9c6322f07165f38e9c6ea43\",\"wordCount\":49894,\"spinePalette\":{\"paper\":\"rgb(17 17 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"科比乔丹\",\"date\":\"2024-10-03\"},{\"id\":\"23458702:mark:23458702_63_857-946\",\"quote\":\"一眼就能看出，我俩的表现泾渭分明，先从姿势开始。迈克尔腰部以上的身体保持笔直，他没有向任何一个方向发生倾斜，因此能保持身体平衡，位置居中。他牢牢掌控着自己的身体，掌控着这次进攻。\",\"book\":{\"id\":\"23458702\",\"title\":\"曼巴精神：科比自传\",\"author\":\"科比·布莱恩特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/702/23458702/t6_23458702.jpg\",\"url\":\"https://weread.qq.com/web/reader/9c6322f07165f38e9c6ea43\",\"wordCount\":49894,\"spinePalette\":{\"paper\":\"rgb(17 17 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"科比乔丹\",\"date\":\"2024-10-03\"},{\"id\":\"23458702:mark:23458702_55_577-604\",\"quote\":\"我和勒布朗之间谈得最多的是什么才是真正的“杀手心态”。\",\"book\":{\"id\":\"23458702\",\"title\":\"曼巴精神：科比自传\",\"author\":\"科比·布莱恩特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/702/23458702/t6_23458702.jpg\",\"url\":\"https://weread.qq.com/web/reader/9c6322f07165f38e9c6ea43\",\"wordCount\":49894,\"spinePalette\":{\"paper\":\"rgb(17 17 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"克敌制胜，我心所向\",\"date\":\"2024-10-02\"},{\"id\":\"23458702:mark:23458702_58_651-748\",\"quote\":\"有时，即使我戴着耳机，实际上也没有播放任何音乐。这只是一个小花招，让人们看到之后主动离开，以便自己进入比赛状态。大多数情况下，比赛之前我只是喜欢待在那儿，听着周围环境的声响，默默观察身边的一切。\",\"book\":{\"id\":\"23458702\",\"title\":\"曼巴精神：科比自传\",\"author\":\"科比·布莱恩特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/702/23458702/t6_23458702.jpg\",\"url\":\"https://weread.qq.com/web/reader/9c6322f07165f38e9c6ea43\",\"wordCount\":49894,\"spinePalette\":{\"paper\":\"rgb(17 17 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"我在美国男篮的赛前准备，与其他所有人迥然不同\",\"date\":\"2024-10-02\"},{\"id\":\"23514583:mark:23514583_163_2859-2998\",\"quote\":\"我很清楚，任何一个组织若想实现既定目标，都必须有一个人来思考、指挥，并承担起大部分责任。但是被领导的人不应受到胁迫，他们应该有权选择他们的领导人。我确信，专制的独裁制度很快就会衰败，因为暴力总会招致那些品德低下的人，而且在我看来，天才的暴君往往由无赖来继承，这是亘古不变的规律。\",\"book\":{\"id\":\"23514583\",\"title\":\"我的世界观\",\"author\":\"阿尔伯特·爱因斯坦\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/583/23514583/t6_23514583.jpg\",\"url\":\"https://weread.qq.com/web/reader/83c329e07166cdd783c051d\",\"wordCount\":\"$undefined\"},\"chapter\":\"我的世界观\",\"date\":\"2024-09-26\",\"annotation\":\"想到了对三代教父的评论：第一代是虎，第二代是狼，第三代是狗\"},{\"id\":\"26785321:review:6166943_7Uufl2EdA\",\"quote\":\"莱布尼茨的上帝好比电脑程序员，一旦设定了初始程序，电脑就开始自动运行，然后上帝就开始无所事事地四处溜达，喝咖啡，闲聊，发呆，再也不插手剩下的事务\",\"annotation\":\"上帝的本意是好的，只是被人给执行坏了\",\"chapter\":\"057 这个世界是所有可能世界里最好的吗？——莱布尼茨哲学（下）\",\"date\":\"2024-09-26\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343}},{\"id\":\"3300099302:mark:3300099302_5_1179-1220\",\"quote\":\"但后来我了解到，受害者的定义是对于自己的环境缺乏控制能力的人，我觉得她不属于此类。\",\"book\":{\"id\":\"3300099302\",\"title\":\"我灵魂里的女性（阿连德作品）\",\"author\":\"[智利]伊莎贝尔•阿连德\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/cpplatform_4sqtwbemdzsuvaj5kn9xck/t6_cpplatform_4sqtwbemdzsuvaj5kn9xck1715330664.jpg\",\"url\":\"https://weread.qq.com/web/reader/ce9328a0813ab8d4ag012722\",\"wordCount\":\"$undefined\"},\"chapter\":\"女孩被剥夺了生气和发火的权利\",\"date\":\"2024-09-19\"},{\"id\":\"3300099302:mark:3300099302_5_1277-1327\",\"quote\":\"在我看来，她原本可以拼搏奋斗，让自己更加独立，过想要的生活，并且发掘自己的巨大潜能，而不是屈服认命。\",\"book\":{\"id\":\"3300099302\",\"title\":\"我灵魂里的女性（阿连德作品）\",\"author\":\"[智利]伊莎贝尔•阿连德\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/cpplatform_4sqtwbemdzsuvaj5kn9xck/t6_cpplatform_4sqtwbemdzsuvaj5kn9xck1715330664.jpg\",\"url\":\"https://weread.qq.com/web/reader/ce9328a0813ab8d4ag012722\",\"wordCount\":\"$undefined\"},\"chapter\":\"女孩被剥夺了生气和发火的权利\",\"date\":\"2024-09-19\"},{\"id\":\"3300099302:mark:3300099302_7_723-821\",\"quote\":\"在智利，家庭和群体的支柱是女人，在劳动阶层更是如此，父亲们来来去去，他们经常突然消失，而后再也不记得自己的孩子。而母亲则是根深叶茂的大树，她们不仅要照顾自己的孩子，如果有必要的话，还要照顾别人的。\",\"book\":{\"id\":\"3300099302\",\"title\":\"我灵魂里的女性（阿连德作品）\",\"author\":\"[智利]伊莎贝尔•阿连德\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/cpplatform_4sqtwbemdzsuvaj5kn9xck/t6_cpplatform_4sqtwbemdzsuvaj5kn9xck1715330664.jpg\",\"url\":\"https://weread.qq.com/web/reader/ce9328a0813ab8d4ag012722\",\"wordCount\":\"$undefined\"},\"chapter\":\"在智利，家庭和群体的支柱是女人\",\"date\":\"2024-09-19\"},{\"id\":\"34222392:mark:34222392_16_3351-3509\",\"quote\":\"“我们经常听到初级领导者为不好的结果找理由。”杰夫·贝佐斯（Jeff Bezos）说，“比如他们会说：‘呃，我们是按流程办事的。’如果你不小心提防的话，流程就会变成大麻烦。”不过，你无须把标准操作流程扔进碎纸机，使公司变得混乱不堪。相反，你需要养成一个习惯，像贝佐斯那样问自己：“是我们主导流程，还是流程主导我们？”\",\"book\":{\"id\":\"34222392\",\"title\":\"像火箭科学家一样思考：将不可能变为可能\",\"author\":\"奥赞·瓦罗尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_34222392/t6_YueWen_34222392.jpg\",\"url\":\"https://weread.qq.com/web/reader/fc032510720a3138fc06b99\",\"wordCount\":203145,\"spinePalette\":{\"paper\":\"rgb(29 21 19)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"我们一直都是这样做的\",\"date\":\"2024-09-16\"},{\"id\":\"33109781:mark:33109781_10_1032-1083\",\"quote\":\"意识到这个问题后，我知道自己该怎么做了：找一个搭档，一起合作。从那时起，这本书的写作变得既流畅又有趣。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"03 拖延\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_10_1179-1273\",\"quote\":\"通常导致拖延的决定性因素是，独自一人做事，没有人帮助你、支持你，或者鼓励你。你可能会咒骂自己懒惰、懦弱或缺乏自信，但其实你真正的障碍可能是孤独，尤其是当你拖延的任务是要你独自完成的任务时。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"03 拖延\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_10_1592-1660\",\"quote\":\"一个孩子如果得到了鼓励、引导和安慰，那么他长大后就会拥有成年人应该具备的自信、常识和韧性，当遇到困惑的时候，他可以发挥这些特质解决问题。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"03 拖延\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_10_1663-1699\",\"quote\":\"如果独自一人做事触发了脆弱和恐惧的情感记忆，那么成年的他就会倾向于拖延。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"03 拖延\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_10_1728-1749\",\"quote\":\"克服孤独引发的拖延的关键是获得他人的支持。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"03 拖延\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_10_1947-2036\",\"quote\":\"有一位女士的博士论文已经拖延了三年。于是我每天早上9点给她打电话，问她一些问题，例如：“你在办公桌前吗？你下一步打算做什么？完成之后你会做什么？”我让她每工作一个小时就给我留言。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"03 拖延\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_10_924-956\",\"quote\":\"我嘲笑自己说：“你连自己的懒惰都克服不了，怎么帮助别人改变呢？”\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"03 拖延\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_11_1766-1797\",\"quote\":\"从心理学上讲，如果你和某人拥有同样的感受，你就不可能对他生气。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"04 期望别人能理解你的感受\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_11_3122-3165\",\"quote\":\"对男性来说，最重要的是事业和对自主的需要；对于女性来说，最重要的是关系问题和亲密的需要\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"04 期望别人能理解你的感受\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_11_3166-3209\",\"quote\":\"一般来说，不论他们的职业、地位或价值观如何，男性和女性都倾向于在这些领域寻求认同和尊重\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"04 期望别人能理解你的感受\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_11_3350-3405\",\"quote\":\"感受比意义更有力量。如果你愿意努力去体会别人的感受，并帮助他们体会你的感受，那么你们可以用类比法来创造同理心。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"04 期望别人能理解你的感受\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_12_1799-1865\",\"quote\":\"我看了看他的信息登记表，惊讶地发现他是一位著名的州最高法院法官。我问护士长为什么这个人没有访客。她回答说，他疏远了生活中的每一个人。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"05 迟迟等待直到为时已晚\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_14_1325-1358\",\"quote\":\"无法毫无恐惧地说“不”或毫无怨恨地说“好”是人们经常遇到的一个困境\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"07 当你想说“不”的时候说“好”\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_14_1532-1585\",\"quote\":\"如果你发现自己处于这样一种境地：不想默许一种不可接受的行为，但又害怕提出反对，那么你可能会试图避开那个人。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"07 当你想说“不”的时候说“好”\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_14_1950-2017\",\"quote\":\"关键是要留意到受挫的早期预警信号，比如越来越不想看到对方，意识到只有你对对方表达支持，而对方没有，或者感觉自己总是像一个懦夫一样退让。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"07 当你想说“不”的时候说“好”\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_14_2046-2104\",\"quote\":\"当别人做出不公平或不合理的行为时，你不必附和。如果你支持他们，那么要说清楚你是在帮他们的忙，而且你希望得到一些回报。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"07 当你想说“不”的时候说“好”\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_15_1265-1317\",\"quote\":\"而且每当他对自己事业的缓慢进展感到沮丧时，他就会提醒雪莉这件事。他持续的怨恨对这段婚姻的存续产生了威胁。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"08 心怀怨恨\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_15_1778-1805\",\"quote\":\"宽恕的最好方法是停止怨恨的想法，专注于实现重要的目标。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"08 心怀怨恨\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_15_1942-1980\",\"quote\":\"忘记的最好方法是改善你的行为和环境，直到你觉得足够安全，可以放下痛苦的记忆。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"08 心怀怨恨\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_32_1094-1192\",\"quote\":\"但她发现要做好销售光拥有科学专业知识是不够的。她不善交际，人们和她在一起时会觉得不舒服。但是，她并没有努力掌握有助于业务成交的社交技巧，而是摆出一副自以为是的姿态，这样做只会让她和别人更加疏远了。\",\"book\":{\"id\":\"33109781\",\"title\":\"我们为什么做出不利于自己的行为\",\"author\":\"马克·郭士顿 菲利普·戈德堡\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/781/33109781/t6_33109781.jpg\",\"url\":\"https://weread.qq.com/web/reader/ac332d8071f93715ac38583\",\"wordCount\":\"$undefined\"},\"chapter\":\"25 拒绝“比赛”\",\"date\":\"2023-02-08\"},{\"id\":\"33109781:mark:33109781_32_1417-1487\",\"quote\":
