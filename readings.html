t\"]\n1b:T21db,"])</script><script>self.__next_f.push([1,"读完牛顿传记。这本书比预期的精彩许多，也使我产生了些许感想。\n\n首先，毋庸置疑，牛顿是一个了不起的人物，很少有人能像他一样对我们每个人产生如此深刻的影响。\n\n他给世界带来的改变无需多言，但我们对他的认识和了解却非常肤浅。我小学时就开始借阅关于牛顿的书，但当时阅读能力太差，读不下去，只是对他的一些故事有所耳闻，比如知道他出生在克伦威尔时期，但那时我并不知道克伦威尔是谁。后来我对科学史有了一些初步的了解，但我一直有意避开牛顿这个人，因为他太过久远，是个难以理解的神秘人物，总有种敬而远之的心态。相对来说，我当时更愿意去了解其他人，包括爱因斯坦、居里夫人、费曼等科学家。这一次，我终于打开了牛顿的传记，阅读欲望很强烈，一气呵成地读完了全书。\n\n牛顿的生平非常丰富。首先，他寿命很长，活了 84 岁，这在当时属于非常难得的高寿。他的经历也很丰富。他出身不算差，后来在读书过程中一度并不出色，但突然奋发，从此之后就一直是最优秀的学生。后来他从事学术，接替了巴罗的位置，成为卢卡斯讲座的教授。他在20多岁的时候就做出了非常突出的成就，比如著名的万有引力，成了明星学者，并能够出入非常高级别的场所，在后来还成了政府重要的官员和国王的座上宾，成为全欧洲的话题人物。\n\n我们对他的了解更多的是他作为科学家的成就，比如提出了万有引力定律、牛顿三定律以及光学原理，当然还有微积分。除此之外，我们对他的了解相对较少，偶尔听说他对炼金术很感兴趣，并且他非常虔诚，是一个清教徒。此外，他还炒股，有着惊世骇俗的韭菜经历，他一度血赚，最终血亏，最终成为了南海金融泡沫的受难者。关于他作为皇家造币厂厂长的经历，我也有所了解，但了解得并不多。通过这些事情，我所了解的还是一个比较片面、比较干瘪的牛顿。而这次读他的传记，让我对他这个人生框架有了更加丰富、多维的感知。\n\n通过这部传记，可以感觉到牛顿脾古怪。他性格孤僻，不喜欢教书，求胜欲很强，经常与一些人陷入难以言说的争斗。他非常小气、极端记仇，弱势的时候隐藏自己，强势的时候重拳出击，终身热爱玩弄权术。这些特制在他与莱布尼兹和胡克的争斗中有所体现。通过牛顿的视角，胡克可能是一个十恶不赦的小人，但由于对那些历史缺乏全面的了解，也难说清他俩之间的是非曲折。以上特质对一个人来说不够光彩，但对牛顿来说倒无所谓。因为他在科学上的贡献太突出了，整个现代社会都蒙受他的恩泽，相比之下性格上的缺点完全可以只被当作补充性的谈资。当然，牛顿也有很多朋友，如巴罗、惠更斯、哈雷和洛克等人，这些人给了他很多帮助，也在某种程度上弥补了他性格上的一些弱点。\n\n我们更应了解牛顿作为科研工作者的一些特质。他对科学的影响很深刻，一方面在于他提炼出的重要结论，这些结论奠定了未来数学和物理学的基础；另一方面在方法论层面，他对理论的简洁性和可理解性的追求非常执着。此外，他也是比较早追求理论可证伪性的学者。比如，他在《光学》这本书的出版上，除了列举他的研究工作之外，还增加了一些批判性的内容，以“质疑”的形式体现，并且每一次改版都会增加很多质疑内容。这些批判性内容出现在他自己书上的是很有趣的，显得严谨、自信而强大。\n\n牛顿的动手能力极强，这些可能是被忽视的。他善于设计实验来对他的想法进行验证，也经常做一些发明创造，比如自己设计与研制三棱镜从而研究光学规律。他在担任皇家造币局的厂长起见，对硬币的设计与生产进行了革新，大大地打击了假币产业，很多发明甚至沿用至今。担任造币厂的经历体现了他出人意料的管理能力，但这并不是孤例。牛顿后来还拯救了声明濒临扫地的皇家科学院，只不过这段作为院长的履职经历也让该科学院打上了过深的牛顿烙印，很多人也承袭了牛顿性格上的缺点（或许这就是所谓的“顿感力”吧）。\n\n此外，牛顿非常勤奋。无论是做科研还是做皇家造币厂厂长，都能看出他是一个名副其实的“卷王”，工作态度认真，对细节一丝不苟。所以我们不能单纯地只认为他的伟大成就是建立在他天赋的基础之上，他的努力程度也是绝大多数人无法企及的。\n\n牛顿还有一个强大的地方就在于他的身体特别好。他几乎没有患上当时常见的一些疾病，而且去世时依然有两排健康的牙齿，这时他已经 84 岁了，这很令人惊叹（反观同时代同样长寿的路易十四...）。另一个能体现他身体好的地方在于，在他的研究工作中，事实上花了很长时间进行炼金术的研究。在这个过程中，他做了大量实验，需要接触大量的重金属，这通常会对身体产生负面影响。但是，即便在牛顿体内检测出超标的重金属，他依然能够保持长寿和健康的状态。他也是到了八十岁左右身体才开始明显地被疾病困扰。更值得一提的是，他一生都保持着清醒的大脑，思维能力到了很晚的时候才开始有衰退迹象。\n\n牛顿职业生涯中，曾花费大量时间进行当时以及后来都被视为旁门左道的炼金术研究。他深知世人对此的看法，因此刻意隐藏相关记录。但他在这方面投入的时间长达25年，甚至超过了在数学和物理上的投入，这令后人深感遗憾。\n\n然而，如果我们站在牛顿所处的时代回溯，或许会有不同的看法。当时的科研尚未有清晰的定义和“正统”道路，一切都需要探索和尝试。牛顿只是凭借其天赋和努力，在迷雾中摸索前行。我们可以设想两种场景。其一：牛顿在炼金的时候突然灵光一闪，指出“炼金术”是不可能，然后给出几个定律，说不定就会提前几十年发展出现代意义上的化学，那样它已经足以封神的成就之树上又将结出一颗伟大的果实；其二：如果当时牛顿在物理学上花了数十年尝试但不幸地毫无建树，但在微积分方面做出了开创性成果，他依然会被认定为历史上最伟大的科学家之一。那么后世是否可以这样说：“他本应该把更多时间花在数学上而不是在研究那些宇宙规律上浪费宝贵的时间与天赋”？\n\n或许，对牛顿而言，数学、物理和炼金术是一个相互关联的整体。他并非刻意划分学科边界，而是对整个自然体系进行深入思考，很多后来被认为有用的概念，不过是他对整个体系思考（或许思考的核心就是怎么炼出金子）的副产品，他“顺便”奠定了后来的数学和物理学基础。\n\n也就是说，我们今天所走的“正统”科研道路，正是牛顿当年“浪费时间”探索出来的。他尝试了无数条路，其中一些最终通向了真理，成为了后人眼中的康庄大道。而那些没有成功的尝试，则成为了后人眼中的“弯路”，但正是在这些“弯路”上的试错，最终廓清了为数不多的那几条正道。\n\n或许牛顿会说：“我尝试了一百条路，帮你们走通了其中的几条。若非我‘浪费时间’，你们在科研工作中的成功率都要归零。然而你们还嫌弃我当时走了九十多条弯路！” 用当前流行的句式表述就是：你不能只有在吃红利的时候才认可祖师爷当初的卓绝努力。\n\n在科学发展中，反复地印证着一个道理：伟大的成就通常建立在前人无数次尝试的基础之上，即使是看似“无用”甚至荒谬的探索，也是孕育科技突破的必要努力。正所谓：\n「年少才成惊四座，数理光开立声名。微积分理辟天地，万有引力定星行。三大定律昭千古，光学棱镜证分明。学贯天人精术算，推演玄机运数精。\n炼金之术沉迷久，世人讥讽笑痴情。谁知试错成正道，拓路前行入慧庭。假若昔时不苦索，何来今日化学明？千条歧路铺新径，后世安能讥梦萦？」"])</script><script>self.__next_f.push([1,"1c:T163f,"])</script><script>self.__next_f.push([1,"卡尔·萨根去世于1996年，当时我很小。几年之后，在一本少儿科普读物中看到了缅怀他的文章，于是他也成了我小学时就记住的为数不多的几个老外之一。\n\n中学的时候，读过《日本平家蟹》, 当时阅读能力有限，没能理解文章背后的思想。当时我不喜欢那种娓娓道来的叙述方式，更不喜欢那些虾啊蟹啊之类的事物。大学的时候，纪录片《宇宙》算是把我真正地带进了科学殿堂，对“平家蟹”的疑惑被解开。“平家蟹”揭示了一种在造型上类似于日本武士的蟹类，被当地渔民认为是当年随平家沉入海底的武士们的化身。但卡尔萨根告诉我们，当地渔民捞到长相与武士颇为神似的螃蟹之后就将其放生，以表达对平家武士的缅怀，久而久之，这类螃蟹的种群就繁殖壮大——本质上，这是一种“人工选择”（也可以说经人之手的“自然选择”）。\n\n平家蟹的故事使得我开始掌握了一点通过科学视角理解自然现象的技巧。不过年轻的自己喜欢这种科学视角，却更沉迷于某种宏大叙事，毕竟惶惶大国，数千年的绵长文明，沧海横流与歌舞升平交织的历史记录，了解起来总让人热血澎湃。然而，后来发现，当宏大的叙事照进我们的日常生活的时候，却总感觉到哪里有些不协调的地方。不过这很正常，毕竟历史中出现的最不起眼的人名，在当时恐怕都是具有显赫一时的人物，而我们在历史长河中不过是注定被遗忘的一颗水珠或者一粒沙尘。\n\n再后来，在一个播客节目中，听到主播朗读《暗淡蓝点》中的那段文字，那种蓦然回首的动人瞬间在脑海中就再也挥之不去：\n「\n再看看那个光点，它就在这里。这是家园，这是我们。你所爱的每一个人，你认识的每一个人，你听说过的每一个人，曾经有过的每一个人，都在它的上面度过他们的一生。我们的欢乐与痛苦聚集在一起。数以千计的自以为是的宗教、意识形态和经济学说，每一个猎人与采集者，每一个英雄与懦夫，每一个文明的缔造者与毁灭者，每一个国王与农夫，每一对年轻爱侣，每一个母亲和父亲，每一个满怀希望的孩子，每一个发明家和探险家，每一个德高望重的教师，每一个腐败的政客，每一个“超级明星”，每一个“最高领导者”，人类历史上的每一个圣人与罪犯，都生活在这里——一粒悬浮在太阳光中的细小尘埃。\n」\n这是”旅行者号“的视角，也是一个科学探索者的视角。这个世界上，总有不少野心家吹嘘自己滔天的权势与不朽的功绩，但在宇宙之中，他所在乎的一切不过是某一尘埃之上瞬息之间的“自我感觉良好的错觉”。我们绝大多数人，在这个充斥着拥堵与摩擦的人世间，也常感慨生活的乏味与人性的险恶，但在宇宙尺度之中，这种体验既不见得比微生物的冲撞与摩擦更高级，又不见得比王侯将相的自我陶醉更卑微。在这个被假象与真实反复折叠的世界里，开心也好，压抑也罢，都不过是人在与自然互动中产生的生理反应。当我们代入”旅行者号“的视角，这些纷繁复杂的情感体验与生理反应在空间上的局域性以及在时间上的有限性都不超过那个暗淡的蓝点。\n\n自从人类发现了科学的用处，就再也无法压抑住对太空的向往。齐奥尔科夫斯基说：”地球是人类的摇篮，但人类不可能永远生活在摇篮里“。然而，当人类终于能够跳出自己的摇篮，回望浩瀚星海中的暗淡蓝点之时，又茫然发现这广袤的宇宙之中再也找不到另一个家园。或许这一百多年对宇宙的探索能得到的最有价值的结论就是：“人类不可能永远生活在摇篮里，但是地球——那个人类的摇篮，是唯一一个能够长期包容人类的家园”。就像每一个在悸动的青春时代勇敢地离家出走的孩子，终究会发现故乡是唯一让自己牵肠挂肚的地方；就像每一个攒够了钱等到了假期的城市居民，当它们终于抵达了某个魂牵梦绕的旅游景点的时候，发现自己可能更想回家躺着。当一个人对社会了解越多，越感觉自己的有限，对世界了解得越多，越对自然存敬畏之心。科学的价值大抵如此——它可能没办法帮人类打造一个天堂，但它可以让人类更充分地认识自己。\n\n当我们把视角从“旅行者号”拉回到地球家园中的自己，会发现自己虽然渺小，但是我们拥有着丰富的感知能力，一草一木、一花一叶、一缕阳光、一口空气，都足以在某个某个微小地瞬间滋养自己精神世界；地球虽不过是诸多星球中不算特别的一个，但却足以让数十亿人类倾其所有去感受其万千气象。我们无需纠结于自己是否会青史留名，因为有些东西不过是某些特权群体为了塑造某种对自己有利的”共同意识“选择性编排的故事合集。我们可以在自己有限的认知范围内质疑其准确性，但终究没有任何解释权。但我们每个人，在人类视角中伟大也好渺小也罢，都拥有一个更加鲜活更有温度的小世界，我们经历的每个瞬间都是真实的，仔细品来也通常会感受到其精彩。将这些真实与精彩进行抽象整理，或许就会发现科学蕴藏其中，或许生活中的真理远比宏大叙述中的要丰富得多。"])</script><script>self.__next_f.push([1,"1d:T21db,"])</script><script>self.__next_f.push([1,"读完牛顿传记。这本书比预期的精彩许多，也使我产生了些许感想。\n\n首先，毋庸置疑，牛顿是一个了不起的人物，很少有人能像他一样对我们每个人产生如此深刻的影响。\n\n他给世界带来的改变无需多言，但我们对他的认识和了解却非常肤浅。我小学时就开始借阅关于牛顿的书，但当时阅读能力太差，读不下去，只是对他的一些故事有所耳闻，比如知道他出生在克伦威尔时期，但那时我并不知道克伦威尔是谁。后来我对科学史有了一些初步的了解，但我一直有意避开牛顿这个人，因为他太过久远，是个难以理解的神秘人物，总有种敬而远之的心态。相对来说，我当时更愿意去了解其他人，包括爱因斯坦、居里夫人、费曼等科学家。这一次，我终于打开了牛顿的传记，阅读欲望很强烈，一气呵成地读完了全书。\n\n牛顿的生平非常丰富。首先，他寿命很长，活了 84 岁，这在当时属于非常难得的高寿。他的经历也很丰富。他出身不算差，后来在读书过程中一度并不出色，但突然奋发，从此之后就一直是最优秀的学生。后来他从事学术，接替了巴罗的位置，成为卢卡斯讲座的教授。他在20多岁的时候就做出了非常突出的成就，比如著名的万有引力，成了明星学者，并能够出入非常高级别的场所，在后来还成了政府重要的官员和国王的座上宾，成为全欧洲的话题人物。\n\n我们对他的了解更多的是他作为科学家的成就，比如提出了万有引力定律、牛顿三定律以及光学原理，当然还有微积分。除此之外，我们对他的了解相对较少，偶尔听说他对炼金术很感兴趣，并且他非常虔诚，是一个清教徒。此外，他还炒股，有着惊世骇俗的韭菜经历，他一度血赚，最终血亏，最终成为了南海金融泡沫的受难者。关于他作为皇家造币厂厂长的经历，我也有所了解，但了解得并不多。通过这些事情，我所了解的还是一个比较片面、比较干瘪的牛顿。而这次读他的传记，让我对他这个人生框架有了更加丰富、多维的感知。\n\n通过这部传记，可以感觉到牛顿脾古怪。他性格孤僻，不喜欢教书，求胜欲很强，经常与一些人陷入难以言说的争斗。他非常小气、极端记仇，弱势的时候隐藏自己，强势的时候重拳出击，终身热爱玩弄权术。这些特制在他与莱布尼兹和胡克的争斗中有所体现。通过牛顿的视角，胡克可能是一个十恶不赦的小人，但由于对那些历史缺乏全面的了解，也难说清他俩之间的是非曲折。以上特质对一个人来说不够光彩，但对牛顿来说倒无所谓。因为他在科学上的贡献太突出了，整个现代社会都蒙受他的恩泽，相比之下性格上的缺点完全可以只被当作补充性的谈资。当然，牛顿也有很多朋友，如巴罗、惠更斯、哈雷和洛克等人，这些人给了他很多帮助，也在某种程度上弥补了他性格上的一些弱点。\n\n我们更应了解牛顿作为科研工作者的一些特质。他对科学的影响很深刻，一方面在于他提炼出的重要结论，这些结论奠定了未来数学和物理学的基础；另一方面在方法论层面，他对理论的简洁性和可理解性的追求非常执着。此外，他也是比较早追求理论可证伪性的学者。比如，他在《光学》这本书的出版上，除了列举他的研究工作之外，还增加了一些批判性的内容，以“质疑”的形式体现，并且每一次改版都会增加很多质疑内容。这些批判性内容出现在他自己书上的是很有趣的，显得严谨、自信而强大。\n\n牛顿的动手能力极强，这些可能是被忽视的。他善于设计实验来对他的想法进行验证，也经常做一些发明创造，比如自己设计与研制三棱镜从而研究光学规律。他在担任皇家造币局的厂长起见，对硬币的设计与生产进行了革新，大大地打击了假币产业，很多发明甚至沿用至今。担任造币厂的经历体现了他出人意料的管理能力，但这并不是孤例。牛顿后来还拯救了声明濒临扫地的皇家科学院，只不过这段作为院长的履职经历也让该科学院打上了过深的牛顿烙印，很多人也承袭了牛顿性格上的缺点（或许这就是所谓的“顿感力”吧）。\n\n此外，牛顿非常勤奋。无论是做科研还是做皇家造币厂厂长，都能看出他是一个名副其实的“卷王”，工作态度认真，对细节一丝不苟。所以我们不能单纯地只认为他的伟大成就是建立在他天赋的基础之上，他的努力程度也是绝大多数人无法企及的。\n\n牛顿还有一个强大的地方就在于他的身体特别好。他几乎没有患上当时常见的一些疾病，而且去世时依然有两排健康的牙齿，这时他已经 84 岁了，这很令人惊叹（反观同时代同样长寿的路易十四...）。另一个能体现他身体好的地方在于，在他的研究工作中，事实上花了很长时间进行炼金术的研究。在这个过程中，他做了大量实验，需要接触大量的重金属，这通常会对身体产生负面影响。但是，即便在牛顿体内检测出超标的重金属，他依然能够保持长寿和健康的状态。他也是到了八十岁左右身体才开始明显地被疾病困扰。更值得一提的是，他一生都保持着清醒的大脑，思维能力到了很晚的时候才开始有衰退迹象。\n\n牛顿职业生涯中，曾花费大量时间进行当时以及后来都被视为旁门左道的炼金术研究。他深知世人对此的看法，因此刻意隐藏相关记录。但他在这方面投入的时间长达25年，甚至超过了在数学和物理上的投入，这令后人深感遗憾。\n\n然而，如果我们站在牛顿所处的时代回溯，或许会有不同的看法。当时的科研尚未有清晰的定义和“正统”道路，一切都需要探索和尝试。牛顿只是凭借其天赋和努力，在迷雾中摸索前行。我们可以设想两种场景。其一：牛顿在炼金的时候突然灵光一闪，指出“炼金术”是不可能，然后给出几个定律，说不定就会提前几十年发展出现代意义上的化学，那样它已经足以封神的成就之树上又将结出一颗伟大的果实；其二：如果当时牛顿在物理学上花了数十年尝试但不幸地毫无建树，但在微积分方面做出了开创性成果，他依然会被认定为历史上最伟大的科学家之一。那么后世是否可以这样说：“他本应该把更多时间花在数学上而不是在研究那些宇宙规律上浪费宝贵的时间与天赋”？\n\n或许，对牛顿而言，数学、物理和炼金术是一个相互关联的整体。他并非刻意划分学科边界，而是对整个自然体系进行深入思考，很多后来被认为有用的概念，不过是他对整个体系思考（或许思考的核心就是怎么炼出金子）的副产品，他“顺便”奠定了后来的数学和物理学基础。\n\n也就是说，我们今天所走的“正统”科研道路，正是牛顿当年“浪费时间”探索出来的。他尝试了无数条路，其中一些最终通向了真理，成为了后人眼中的康庄大道。而那些没有成功的尝试，则成为了后人眼中的“弯路”，但正是在这些“弯路”上的试错，最终廓清了为数不多的那几条正道。\n\n或许牛顿会说：“我尝试了一百条路，帮你们走通了其中的几条。若非我‘浪费时间’，你们在科研工作中的成功率都要归零。然而你们还嫌弃我当时走了九十多条弯路！” 用当前流行的句式表述就是：你不能只有在吃红利的时候才认可祖师爷当初的卓绝努力。\n\n在科学发展中，反复地印证着一个道理：伟大的成就通常建立在前人无数次尝试的基础之上，即使是看似“无用”甚至荒谬的探索，也是孕育科技突破的必要努力。正所谓：\n「年少才成惊四座，数理光开立声名。微积分理辟天地，万有引力定星行。三大定律昭千古，光学棱镜证分明。学贯天人精术算，推演玄机运数精。\n炼金之术沉迷久，世人讥讽笑痴情。谁知试错成正道，拓路前行入慧庭。假若昔时不苦索，何来今日化学明？千条歧路铺新径，后世安能讥梦萦？」"])</script><script>self.__next_f.push([1,"1e:T163f,"])</script><script>self.__next_f.push([1,"卡尔·萨根去世于1996年，当时我很小。几年之后，在一本少儿科普读物中看到了缅怀他的文章，于是他也成了我小学时就记住的为数不多的几个老外之一。\n\n中学的时候，读过《日本平家蟹》, 当时阅读能力有限，没能理解文章背后的思想。当时我不喜欢那种娓娓道来的叙述方式，更不喜欢那些虾啊蟹啊之类的事物。大学的时候，纪录片《宇宙》算是把我真正地带进了科学殿堂，对“平家蟹”的疑惑被解开。“平家蟹”揭示了一种在造型上类似于日本武士的蟹类，被当地渔民认为是当年随平家沉入海底的武士们的化身。但卡尔萨根告诉我们，当地渔民捞到长相与武士颇为神似的螃蟹之后就将其放生，以表达对平家武士的缅怀，久而久之，这类螃蟹的种群就繁殖壮大——本质上，这是一种“人工选择”（也可以说经人之手的“自然选择”）。\n\n平家蟹的故事使得我开始掌握了一点通过科学视角理解自然现象的技巧。不过年轻的自己喜欢这种科学视角，却更沉迷于某种宏大叙事，毕竟惶惶大国，数千年的绵长文明，沧海横流与歌舞升平交织的历史记录，了解起来总让人热血澎湃。然而，后来发现，当宏大的叙事照进我们的日常生活的时候，却总感觉到哪里有些不协调的地方。不过这很正常，毕竟历史中出现的最不起眼的人名，在当时恐怕都是具有显赫一时的人物，而我们在历史长河中不过是注定被遗忘的一颗水珠或者一粒沙尘。\n\n再后来，在一个播客节目中，听到主播朗读《暗淡蓝点》中的那段文字，那种蓦然回首的动人瞬间在脑海中就再也挥之不去：\n「\n再看看那个光点，它就在这里。这是家园，这是我们。你所爱的每一个人，你认识的每一个人，你听说过的每一个人，曾经有过的每一个人，都在它的上面度过他们的一生。我们的欢乐与痛苦聚集在一起。数以千计的自以为是的宗教、意识形态和经济学说，每一个猎人与采集者，每一个英雄与懦夫，每一个文明的缔造者与毁灭者，每一个国王与农夫，每一对年轻爱侣，每一个母亲和父亲，每一个满怀希望的孩子，每一个发明家和探险家，每一个德高望重的教师，每一个腐败的政客，每一个“超级明星”，每一个“最高领导者”，人类历史上的每一个圣人与罪犯，都生活在这里——一粒悬浮在太阳光中的细小尘埃。\n」\n这是”旅行者号“的视角，也是一个科学探索者的视角。这个世界上，总有不少野心家吹嘘自己滔天的权势与不朽的功绩，但在宇宙之中，他所在乎的一切不过是某一尘埃之上瞬息之间的“自我感觉良好的错觉”。我们绝大多数人，在这个充斥着拥堵与摩擦的人世间，也常感慨生活的乏味与人性的险恶，但在宇宙尺度之中，这种体验既不见得比微生物的冲撞与摩擦更高级，又不见得比王侯将相的自我陶醉更卑微。在这个被假象与真实反复折叠的世界里，开心也好，压抑也罢，都不过是人在与自然互动中产生的生理反应。当我们代入”旅行者号“的视角，这些纷繁复杂的情感体验与生理反应在空间上的局域性以及在时间上的有限性都不超过那个暗淡的蓝点。\n\n自从人类发现了科学的用处，就再也无法压抑住对太空的向往。齐奥尔科夫斯基说：”地球是人类的摇篮，但人类不可能永远生活在摇篮里“。然而，当人类终于能够跳出自己的摇篮，回望浩瀚星海中的暗淡蓝点之时，又茫然发现这广袤的宇宙之中再也找不到另一个家园。或许这一百多年对宇宙的探索能得到的最有价值的结论就是：“人类不可能永远生活在摇篮里，但是地球——那个人类的摇篮，是唯一一个能够长期包容人类的家园”。就像每一个在悸动的青春时代勇敢地离家出走的孩子，终究会发现故乡是唯一让自己牵肠挂肚的地方；就像每一个攒够了钱等到了假期的城市居民，当它们终于抵达了某个魂牵梦绕的旅游景点的时候，发现自己可能更想回家躺着。当一个人对社会了解越多，越感觉自己的有限，对世界了解得越多，越对自然存敬畏之心。科学的价值大抵如此——它可能没办法帮人类打造一个天堂，但它可以让人类更充分地认识自己。\n\n当我们把视角从“旅行者号”拉回到地球家园中的自己，会发现自己虽然渺小，但是我们拥有着丰富的感知能力，一草一木、一花一叶、一缕阳光、一口空气，都足以在某个某个微小地瞬间滋养自己精神世界；地球虽不过是诸多星球中不算特别的一个，但却足以让数十亿人类倾其所有去感受其万千气象。我们无需纠结于自己是否会青史留名，因为有些东西不过是某些特权群体为了塑造某种对自己有利的”共同意识“选择性编排的故事合集。我们可以在自己有限的认知范围内质疑其准确性，但终究没有任何解释权。但我们每个人，在人类视角中伟大也好渺小也罢，都拥有一个更加鲜活更有温度的小世界，我们经历的每个瞬间都是真实的，仔细品来也通常会感受到其精彩。将这些真实与精彩进行抽象整理，或许就会发现科学蕴藏其中，或许生活中的真理远比宏大叙述中的要丰富得多。"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"$L17\",null,{}],[\"$\",\"$18\",null,{\"fallback\":[\"$\",\"$L19\",null,{\"label\":\"Reads\"}],\"children\":[\"$\",\"$L1a\",null,{\"stats\":{\"periods\":{\"overall\":{\"seconds\":6869058,\"days\":1052,\"finished\":84,\"trend\":[{\"date\":\"2018\",\"seconds\":0},{\"date\":\"2019\",\"seconds\":66},{\"date\":\"2020\",\"seconds\":723333},{\"date\":\"2021\",\"seconds\":116124},{\"date\":\"2022\",\"seconds\":52348},{\"date\":\"2023\",\"seconds\":3893},{\"date\":\"2024\",\"seconds\":1804991},{\"date\":\"2025\",\"seconds\":2720716},{\"date\":\"2026\",\"seconds\":1447587}],\"categories\":[{\"name\":\"文学\",\"seconds\":1098695},{\"name\":\"经济理财\",\"seconds\":828629},{\"name\":\"人物传记\",\"seconds\":801522},{\"name\":\"历史\",\"seconds\":539405},{\"name\":\"哲学宗教\",\"seconds\":362483},{\"name\":\"科学技术\",\"seconds\":237385},{\"name\":\"社会小说\",\"seconds\":235298},{\"name\":\"年代小说\",\"seconds\":210471}],\"asOf\":\"2026-11-24\"},\"annually\":{\"seconds\":1447587,\"days\":284,\"finished\":11,\"trend\":[{\"date\":\"2026-01\",\"seconds\":210803},{\"date\":\"2026-02\",\"seconds\":261699},{\"date\":\"2026-03\",\"seconds\":184147},{\"date\":\"2026-04\",\"seconds\":139391},{\"date\":\"2026-05\",\"seconds\":84844},{\"date\":\"2026-06\",\"seconds\":70811},{\"date\":\"2026-07\",\"seconds\":37883},{\"date\":\"2026-08\",\"seconds\":102899},{\"date\":\"2026-09\",\"seconds\":120575},{\"date\":\"2026-10\",\"seconds\":141351},{\"date\":\"2026-11\",\"seconds\":93184},{\"date\":\"2026-12\",\"seconds\":0}],\"categories\":[{\"name\":\"文学\",\"seconds\":412801},{\"name\":\"人物传记\",\"seconds\":212700},{\"name\":\"年代小说\",\"seconds\":210471},{\"name\":\"经济理财\",\"seconds\":124864},{\"name\":\"社会小说\",\"seconds\":104055},{\"name\":\"艺术\",\"seconds\":101751},{\"name\":\"影视原著\",\"seconds\":98153},{\"name\":\"玄幻小说\",\"seconds\":86040}],\"asOf\":\"2026-11-24\"},\"mon url\":\"https://weread.qq.com/web/reader/3b0324d052c37c3b00f5cf1\"},\"date\":\"2025-02-05\",\"url\":\"/readings/books/181116#review-181116%3Areview%3A6166943_7XJ8mchWA\",\"entryId\":\"181116:review:6166943_7XJ8mchWA\",\"excerpt\":\"深邃而务实\"},{\"id\":\"dac1047f4c2f7905786de755\",\"title\":\"牛顿传（修订版）\",\"bookTitle\":\"牛顿传（修订版）\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\"},\"date\":\"2025-01-17\",\"url\":\"/readings/books/32763783#review-32763783%3Areview%3A6166943_7XgvszlZ3\",\"entryId\":\"32763783:review:6166943_7XgvszlZ3\",\"excerpt\":\"$1b\"},{\"id\":\"e409d764f4c0b3b44942042f\",\"title\":\"悠悠岁月\",\"bookTitle\":\"悠悠岁月\",\"book\":{\"id\":\"3300120802\",\"title\":\"悠悠岁月\",\"author\":\"[法]安妮·埃尔诺\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/61/cpplatform_qucmxrgjmpv1fqa5n81ljc/t6_cpplatform_qucmxrgjmpv1fqa5n81ljc1731493957.jpg\",\"url\":\"https://weread.qq.com/web/reader/ca0329a0813ab95b0g012500\"},\"date\":\"2025-01-07\",\"url\":\"/readings/books/3300120802#review-3300120802%3Areview%3A6166943_7X1pOjzoK\",\"entryId\":\"3300120802:review:6166943_7X1pOjzoK\",\"excerpt\":\"\\n《悠悠岁月》是诺贝尔文学奖得主埃尔诺的作品。她用一种意识流的写法，记述了过去几十年她所亲历的世界。这种意识流的写法感觉非常适合用来听。听这种内容的体验比那种议论式的文章要好很多。\\n\\n我们在听的时候通常不会非常聚精会神。这种情况下会遗漏一些信息，但是意识流意味着你可以遗漏任何信息，你只需要专注于当下听到的东西即可，这个写法可能更讲究在局部的场景构建。从宏观意义上来说，当你读完这本书，好像已经过了几十年。但如果让你说这本书里这几十年里发生了什么，你可能一时难以说清楚。她之前讲的东西可能就像我们的记忆一样，突然之间就蹦了出来，然后很快又消失了。或许这是意识流写法的一个特点，非常适合听书这种模式的。\\n\\n\"},{\"id\":\"4e8a8c255a8bb08228fb77d1\",\"title\":\"李光耀观天下（精装版）\",\"bookTitle\":\"李光耀观天下（精装版）\",\"book\":{\"id\":\"3300076264\",\"title\":\"李光耀观天下（精装版）\",\"author\":\"李光耀\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/79/cpplatform_wdghcvhzndnxtmgbbdm5dg/t6_cpplatform_wdghcvhzndnxtmgbbdm5dg1698833759.jpg\",\"url\":\"https://weread.qq.com/web/reader/63c32e90813ab844ag014d47\"},\"date\":\"2025-01-03\",\"url\":\"/readings/books/3300076264#review-3300076264%3Areview%3A6166943_7WVbKk9Ph\",\"entryId\":\"3300076264:review:6166943_7WVbKk9Ph\",\"excerpt\":\"这本书中有很多的预测，不过预测是否准确并不重要，重要的是能从中感受李光耀的世界观与性格特点。\\n\\n大约五年前，读过这本书中关于中国的部分，感觉挺有道理。但现在再看，感觉好像很多都是错的。当然，对于预测，我们应该宽容点，而且政治人物说话必然要讲究一些政治正确。\\n\\n听这本书有一个缺憾，那就是李光耀的讲话时那种斩钉截铁的风格很有魅力，对我而言很洗脑。\\n\\n\"},{\"id\":\"d4c5ac00e487e0c1528def38\",\"title\":\"旧制度与大革命（中法双语版）\",\"bookTitle\":\"旧制度与大革命（中法双语版）\",\"book\":{\"id\":\"3300103182\",\"title\":\"旧制度与大革命（中法双语版）\",\"author\":\"[法]托克维尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_uzmy4nhxfsqzz8hdrq5ere/t6_cpplatform_uzmy4nhxfsqzz8hdrq5ere1729655199.jpg\",\"url\":\"https://weread.qq.com/web/reader/2f932450813ab8eceg01272c\",\"wordCount\":921194,\"spinePalette\":{\"paper\":\"rgb(208 210 209)\",\"ink\":\"#292622\"}},\"date\":\"2024-12-27\",\"url\":\"/readings/books/3300103182#review-3300103182%3Areview%3A6166943_7WKJAbdqb\",\"entryId\":\"3300103182:review:6166943_7WKJAbdqb\",\"excerpt\":\"内容过于真实，读起来仿佛是“猪八戒照镜子”。\\n\\n托克维尔最好真的只是在讲法国（doge）。\"},{\"id\":\"b53122c1ee9f556e0090203c\",\"title\":\"创新者\",\"bookTitle\":\"创新者\",\"book\":{\"id\":\"908185\",\"title\":\"创新者\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/33/YueWen_908185/t6_YueWen_908185.jpg\",\"url\":\"https://weread.qq.com/web/reader/88532e705ddb99885e9eebc\"},\"date\":\"2024-12-26\",\"url\":\"/readings/books/908185#review-908185%3Areview%3A6166943_7WJ7lNaGK\",\"entryId\":\"908185:review:6166943_7WJ7lNaGK\",\"excerpt\":\"计算机科学与技术的“纪传体”历史书，从埃达到AI崛起的前夜。\\n\\n印象比较深刻的人物与直接感觉有：\\n1. 埃达与其父亲拜伦：感性与理性思维之间“你死我活”的竞争；\\n2. 肖克利与巴丁等贝尔实验室的同事：晶体管诞生前后的八卦故事；\\n3. 诺伊斯、基尔比、摩尔、格鲁夫：集成电路与微处理器的诞生；\\n4. 沃兹、乔布斯、盖茨、艾伦：硬件极客黄金时代的终结，软件开发者的崛起, 设计师（技术的人文主义）的黎明；\\n5. 斯托曼、托尔瓦兹：软件自由主义者的分支：理想主义与实用主义的开源理念；\\n6. 蒂姆•伯纳斯•李：圣人；\\n7. 佩奇、布林：一种新的企业文化的成熟。\\n\\n作者传达的理念：\\n1. 伟大的技术突破通常是天才协作的成果而非单打独斗；\\n2. 创新的发生往往都是万事俱备之后再吹点东风一样自然。\\n\\n这本书我读了很多年，都是断断续续的，中间读过许多与之相关的很多其他资料，这本书中的故事也常被一些科学史的作者或博主拿来讲述。可以说很多故事早就内化到我的日常的“八卦类知识消费”中了 。\\n\\n书里的故事很精彩，这首先要归功于推动技术发展的诸多天才的传奇人生，此外作者的写作也充分体现了其作为顶级传记作家的功底。\\n\\n\"},{\"id\":\"c6fa21080635516106dde5de\",\"title\":\"万物皆计算：科学奇才的探索之旅\",\"bookTitle\":\"万物皆计算：科学奇才的探索之旅\",\"book\":{\"id\":\"3300123213\",\"title\":\"万物皆计算：科学奇才的探索之旅\",\"author\":\"[美]斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/10/cpplatform_1ysgda9ughbdbnxbt4pdzg/t6_cpplatform_1ysgda9ughbdbnxbt4pdzg1732849980.jpg\",\"url\":\"https://weread.qq.com/web/reader/40032f70813ab96a1g013538\",\"wordCount\":199960,\"spinePalette\":{\"paper\":\"rgb(40 54 130)\",\"ink\":\"#eaf2ff\"}},\"date\":\"2024-12-23\",\"url\":\"/readings/books/3300123213#review-3300123213%3Areview%3A6166943_7WEdt0ed7\",\"entryId\":\"3300123213:review:6166943_7WEdt0ed7\",\"excerpt\":\"喜欢大佬分享他的故事与生活。这本书确实很有趣，除了一些科学与技术方面的知识，还涉及了软件LOGO的设计，软件函数名的命名以及日常生活中的数字化管理与数据挖掘，非常有趣。\\n\"},{\"id\":\"a35c84174c2b072a4140bcc1\",\"title\":\"这就是ChatGPT\",\"bookTitle\":\"这就是ChatGPT\",\"book\":{\"id\":\"3300082609\",\"title\":\"这就是ChatGPT\",\"author\":\"斯蒂芬·沃尔弗拉姆\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/24/cpplatform_4cn8w4tmgzntjobg9ffeny/t6_cpplatform_4cn8w4tmgzntjobg9ffeny1703648785.jpg\",\"url\":\"https://weread.qq.com/web/reader/74332a90813ab86c4g019d98\"},\"date\":\"2024-12-22\",\"url\":\"/readings/books/3300082609#review-3300082609%3Areview%3A6166943_7WD4q8aoT\",\"entryId\":\"3300082609:review:6166943_7WD4q8aoT\",\"excerpt\":\"作为一本书还是太薄了，前面还加上了大篇幅的推荐序。\\n\\n观点有很深刻独到的见解，毕竟是大科学家。\\n\\n但对大模型来说，这本书的时间还是太早了，里面的玩法现在来看不算很新颖。\"},{\"id\":\"042cfea715f1896edfd404a5\",\"title\":\"从0到1：开启商业与未来的秘密\",\"bookTitle\":\"从0到1：开启商业与未来的秘密\",\"book\":{\"id\":\"566431\",\"title\":\"从0到1：开启商业与未来的秘密\",\"author\":\"彼得·蒂尔 布莱克·马斯特斯\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/431/566431/t6_566431.jpg\",\"url\":\"https://weread.qq.com/web/reader/3973284058a49f39706f0c0\",\"wordCount\":86323,\"spinePalette\":{\"paper\":\"rgb(116 170 204)\",\"ink\":\"#162a40\"}},\"date\":\"2024-12-16\",\"url\":\"/readings/books/566431#review-566431%3Areview%3A6166943_7WtyFYLnN\",\"entryId\":\"566431:review:6166943_7WtyFYLnN\",\"excerpt\":\"十年前，这本书引发了巨大轰动，印象比较深刻的是国内很多专家认为中国虽然“从0到1”不太行，但是很擅长做“从1到N”的微创新。到了十年后的今天，我们被这些“微创新”改变了一些，但是对我们改变最大的还是像短视频、直播之类的“从0到1”的东西。抖音快手等企业崛起之后，事实上就不太可能存在另一家足够强大的短视频平台了。\\n\\n而那些“从1到N”的创新，比如新能源汽车，做得非常好，但其原因是汽车容易做出不完全同质化的产品，大家的品味与需求以及厂家的产品线的有限性导致在该产业中难以一家通吃。\\n\\n在互联网企业中，很遗憾，我们看不到多少成功的“从1到N”的企业。或许，团购、外卖与打车软件很成功，但是那个竞争太惨烈了，充分体现了中国企业家的疯狂，但那一段惨烈的记忆恐怕也会像一战之于法国一样，牺牲掉一代企业家的勇气。\\n\\n\\n\\n\\n\"},{\"id\":\"df08db8b04beae6705e849f8\",\"title\":\"暗淡蓝点：探寻人类的太空家园\",\"bookTitle\":\"暗淡蓝点：探寻人类的太空家园\",\"book\":{\"id\":\"3300118948\",\"title\":\"暗淡蓝点：探寻人类的太空家园\",\"author\":\"[美]卡尔·萨根\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/77/cpplatform_27faa17tfebs2pc9ndmsqb/t6_cpplatform_27faa17tfebs2pc9ndmsqb1729826325.jpg\",\"url\":\"https://weread.qq.com/web/reader/e7132fa0813ab94f6g0181d5\"},\"date\":\"2024-11-30\",\"url\":\"/readings/books/3300118948#review-3300118948%3Areview%3A6166943_7W5tGp9Rb\",\"entryId\":\"3300118948:review:6166943_7W5tGp9Rb\",\"excerpt\":\"$1c\"},{\"id\":\"1b1bef3dc2b2f429a2b6e73a\",\"title\":\"黑客与画家（10万册纪念版）\",\"bookTitle\":\"黑客与画家（10万册纪念版）\",\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\"},\"date\":\"2024-10-22\",\"url\":\"/readings/books/907771#review-907771%3Areview%3A6166943_7V7ZArs1x\",\"entryId\":\"907771:review:6166943_7V7ZArs1x\",\"excerpt\":\"作者在书中有很多具有前瞻性的看法。\\n\\n书里的第一部分关于社会，第二部分关于商业，第三部分关于技术。这三部分的观点都具有很强的预见性，非常犀利。即便是一些关于技术的观点，虽然过去二十多年迭代迅速，但放在今天也非常具有参考价值。\"},{\"id\":\"054aab47d0b84ab689905574\",\"title\":\"人工智能全传\",\"bookTitle\":\"人工智能全传\",\"book\":{\"id\":\"37209427\",\"title\":\"人工智能全传\",\"author\":\"迈克尔·伍尔德里奇\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/427/37209427/t6_37209427.jpg\",\"url\":\"https://weread.qq.com/web/reader/b9532c307237c553b95aae7\"},\"date\":\"2024-10-11\",\"url\":\"/readings/books/37209427#review-37209427%3Areview%3A6166943_7URTLOQhI\",\"entryId\":\"37209427:review:6166943_7URTLOQhI\",\"excerpt\":\"通俗易懂，娓娓道来。\\nAI的发展历程真是一波三折。\"},{\"id\":\"b797505b7fe795c1032ee557\",\"title\":\"红楼梦\",\"bookTitle\":\"红楼梦\",\"book\":{\"id\":\"23303684\",\"title\":\"红楼梦\",\"author\":\"[清]曹雪芹 [清]高鹗\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/65/YueWen_23303684/t6_YueWen_23303684.jpg\",\"url\":\"https://weread.qq.com/web/reader/6bf32660716396046bffdca\"},\"date\":\"2020-04-27\",\"url\":\"/readings/books/23303684#review-23303684%3Areview%3A6166943_7gUe6Tkc1\",\"entryId\":\"23303684:review:6166943_7gUe6Tkc1\",\"excerpt\":\"就是美，语言美，故事美，人物也美……\\n\"},{\"id\":\"fd64eb2080f5b68f1356c9c5\",\"title\":\"鼠疫\",\"bookTitle\":\"鼠疫\",\"book\":{\"id\":\"815156\",\"title\":\"鼠疫\",\"author\":\"[法]加缪\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/2/YueWen_815156/t6_YueWen_815156.jpg\",\"url\":\"https://weread.qq.com/web/reader/d99322b05c7034d9957d680\"},\"date\":\"2020-04-27\",\"url\":\"/readings/books/815156#review-815156%3Areview%3A6166943_7gUe39fVV\",\"entryId\":\"815156:review:6166943_7gUe39fVV\",\"excerpt\":\"疫情的剧本\\n\"}],\"highlights\":[{\"id\":\"3300010494:mark:3300010494_5_386-420\",\"quote\":\"人是一个奥秘。应该解开它，如果你毕生都在解开它，那你不要说损失了时间\",\"book\":{\"id\":\"3300010494\",\"title\":\"穷人\",\"author\":\"[俄]陀思妥耶夫斯基\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/94/3300010494/t6_3300010494.jpg\",\"url\":\"https://weread.qq.com/web/reader/6d232360813ab6a99g014773\",\"wordCount\":102116},\"chapter\":\"揭示人之奥秘的『最高意义上的现实主义者』\",\"date\":\"2026-10-06\"},{\"id\":\"3300051275:mark:3300051275_10_4136-4264\",\"quote\":\"如果没有优秀的投资人为年轻创业者的理念和天赋承担巨大的风险，数字革命就不可能发生。1975年，硅谷获得的外部投资总额不过区区几百万美元。在这张照片拍摄之际，这个数字已经逼近100亿美元，而且还在持续飙升。到2000年，这个数字攀升至了惊人的1110亿美元。\",\"book\":{\"id\":\"3300051275\",\"title\":\"无畏的天才\",\"author\":\"道格·门德斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_8w4qnkd7mhnin3ox7q5g7h/t6_cpplatform_8w4qnkd7mhnin3ox7q5g7h1678084838.jpg\",\"url\":\"https://weread.qq.com/web/reader/5c9327f0813ab7a87g01582f\",\"wordCount\":46070,\"spinePalette\":{\"paper\":\"rgb(173 173 175)\",\"ink\":\"#292622\"}},\"chapter\":\"4 这是人类的故事\",\"date\":\"2026-10-04\"},{\"id\":\"3300051275:mark:3300051275_6_2550-2598\",\"quote\":\"当时，太空竞赛时代的先锋工程师们早已盘踞在硅谷。这些新人来到硅谷，与老工程师狭路相逢、针锋相对。\",\"book\":{\"id\":\"3300051275\",\"title\":\"无畏的天才\",\"author\":\"道格·门德斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_8w4qnkd7mhnin3ox7q5g7h/t6_cpplatform_8w4qnkd7mhnin3ox7q5g7h1678084838.jpg\",\"url\":\"https://weread.qq.com/web/reader/5c9327f0813ab7a87g01582f\",\"wordCount\":46070,\"spinePalette\":{\"paper\":\"rgb(173 173 175)\",\"ink\":\"#292622\"}},\"chapter\":\"前言 25万行代码 一个时代的终结，一个时代的开始\",\"date\":\"2026-09-30\"},{\"id\":\"3300020505:mark:3300020505_3_3202-3291\",\"quote\":\"那时候我听说，人衰老的第一个征兆就是开始像自己的父亲，于是我想我必是注定了要永葆青春，因为我的这张马脸永远都不可能像我父亲那加勒比风格的粗硬样貌或是我母亲那带罗马帝国气息的面容。\",\"book\":{\"id\":\"3300020505\",\"title\":\"苦妓回忆录\",\"author\":\"[哥]加西亚•马尔克斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/5/3300020505/t6_3300020505.jpg\",\"url\":\"https://weread.qq.com/web/reader/cdf32c10813ab6e82g0150f4\",\"wordCount\":\"$undefined\"},\"chapter\":\"一\",\"date\":\"2026-09-26\"},{\"id\":\"3300020505:mark:3300020505_3_3663-3716\",\"quote\":\"现在的我会嘲笑那些向医生咨询的八十多岁的小伙子，他们被某些突如其来的状况吓坏了，却不知到了九十岁事情会更糟\",\"book\":{\"id\":\"3300020505\",\"title\":\"苦妓回忆录\",\"author\":\"[哥]加西亚•马尔克斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/5/3300020505/t6_3300020505.jpg\",\"url\":\"https://weread.qq.com/web/reader/cdf32c10813ab6e82g0150f4\",\"wordCount\":\"$undefined\"},\"chapter\":\"一\",\"date\":\"2026-09-26\"},{\"id\":\"3300020505:mark:3300020505_3_536-568\",\"quote\":\"活到九十岁这年，我想找个年少的处女，送自己一个充满疯狂爱欲的夜晚\",\"book\":{\"id\":\"3300020505\",\"title\":\"苦妓回忆录\",\"author\":\"[哥]加西亚•马尔克斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/5/3300020505/t6_3300020505.jpg\",\"url\":\"https://weread.qq.com/web/reader/cdf32c10813ab6e82g0150f4\",\"wordCount\":\"$undefined\"},\"chapter\":\"一\",\"date\":\"2026-09-26\"},{\"id\":\"3300051275:mark:3300051275_5_2449-2522\",\"quote\":\"乔布斯这样评论道：“从头开始的轻松感取代了保持成功的沉重感，对待任何事情都多了一份不确定性。我得到了解放，并进入了人生中最富有创造力的一段时期。”\",\"book\":{\"id\":\"3300051275\",\"title\":\"无畏的天才\",\"author\":\"道格·门德斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_8w4qnkd7mhnin3ox7q5g7h/t6_cpplatform_8w4qnkd7mhnin3ox7q5g7h1678084838.jpg\",\"url\":\"https://weread.qq.com/web/reader/5c9327f0813ab7a87g01582f\",\"wordCount\":46070,\"spinePalette\":{\"paper\":\"rgb(173 173 175)\",\"ink\":\"#292622\"}},\"chapter\":\"推荐序2 生命的黎明是乐园，青春才是真正的天堂\",\"date\":\"2026-09-26\"},{\"id\":\"3300051275:mark:3300051275_5_3128-3184\",\"quote\":\"在那个满是阳光、绿草、碧空与黄金的地方，他却有意识地选择在室内拍摄黑白照片，以老派的方式来描绘这个新时代的来临。\",\"book\":{\"id\":\"3300051275\",\"title\":\"无畏的天才\",\"author\":\"道格·门德斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_8w4qnkd7mhnin3ox7q5g7h/t6_cpplatform_8w4qnkd7mhnin3ox7q5g7h1678084838.jpg\",\"url\":\"https://weread.qq.com/web/reader/5c9327f0813ab7a87g01582f\",\"wordCount\":46070,\"spinePalette\":{\"paper\":\"rgb(173 173 175)\",\"ink\":\"#292622\"}},\"chapter\":\"推荐序2 生命的黎明是乐园，青春才是真正的天堂\",\"date\":\"2026-09-26\"},{\"id\":\"34141387:mark:34141387_6_3167-3211\",\"quote\":\"费曼图是理查德·费曼所创立的一种用形象化的方法，方便地处理量子场中各种粒子相互作用的图，\",\"book\":{\"id\":\"34141387\",\"title\":\"费曼的彩虹\",\"author\":\"伦纳德·蒙洛迪诺\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/387/34141387/t6_34141387.jpg\",\"url\":\"https://weread.qq.com/web/reader/1a1321b07208f4cb1a152af\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一章\",\"date\":\"2026-09-26\"},{\"id\":\"34141387:mark:34141387_7_1837-1988\",\"quote\":\"其中之一就是著名的测不准原理（Uncertainty Principle），它指出我们实际上不可能同时确定某两个物理量。例如，如果你精确地测出某个物体的位置，那么就无法非常准确地得知它的速度。不过，对于我们日常生活中见到的大型物体，这些限制并不明显，只是对于组成原子的粒子来说，它们就会产生巨大的差异。\",\"book\":{\"id\":\"34141387\",\"title\":\"费曼的彩虹\",\"author\":\"伦纳德·蒙洛迪诺\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/387/34141387/t6_34141387.jpg\",\"url\":\"https://weread.qq.com/web/reader/1a1321b07208f4cb1a152af\",\"wordCount\":\"$undefined\"},\"chapter\":\"第二章\",\"date\":\"2026-09-26\"},{\"id\":\"3300020505:mark:3300020505_3_2935-3053\",\"quote\":\"？我想是在那天之前不久：四十二岁那年，我忍着几乎令我窒息的背痛去找医生，但那并没引起他的重视。“就是您这岁数正常的疼痛。”他对我说。“这样的话，”我应道，“是我的岁数不正常了。”\",\"book\":{\"id\":\"3300020505\",\"title\":\"苦妓回忆录\",\"author\":\"[哥]加西亚•马尔克斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/5/3300020505/t6_3300020505.jpg\",\"url\":\"https://weread.qq.com/web/reader/cdf32c10813ab6e82g0150f4\",\"wordCount\":\"$undefined\"},\"chapter\":\"一\",\"date\":\"2026-09-25\"},{\"id\":\"3300020505:mark:3300020505_3_3732-3779\",\"quote\":\"事实上，这也是一种生命的胜利：老人们在无足轻重的事上失去了记忆，但对真正感兴趣的事却很少迷糊。\",\"book\":{\"id\":\"3300020505\",\"title\":\"苦妓回忆录\",\"author\":\"[哥]加西亚•马尔克斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/5/3300020505/t6_3300020505.jpg\",\"url\":\"https://weread.qq.com/web/reader/cdf32c10813ab6e82g0150f4\",\"wordCount\":\"$undefined\"},\"chapter\":\"一\",\"date\":\"2026-09-25\"},{\"id\":\"3300051275:mark:3300051275_5_2105-2185\",\"quote\":\"在那个开创性的10年里，他们梦想着创造一个酷炫的新世界，不管那意味着什么，反正在那个新世界里，知识能以前所未有的速度进行传播与扩散，人们能充分发挥自己的创造力。\",\"book\":{\"id\":\"3300051275\",\"title\":\"无畏的天才\",\"author\":\"道格·门德斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_8w4qnkd7mhnin3ox7q5g7h/t6_cpplatform_8w4qnkd7mhnin3ox7q5g7h1678084838.jpg\",\"url\":\"https://weread.qq.com/web/reader/5c9327f0813ab7a87g01582f\",\"wordCount\":46070,\"spinePalette\":{\"paper\":\"rgb(173 173 175)\",\"ink\":\"#292622\"}},\"chapter\":\"推荐序2 生命的黎明是乐园，青春才是真正的天堂\",\"date\":\"2026-09-25\"},{\"id\":\"3300051275:mark:3300051275_5_2684-2722\",\"quote\":\"更是一个心态永葆年轻的工匠，致力于消除工具与玩具之间、工作与娱乐之间的界限。\",\"book\":{\"id\":\"3300051275\",\"title\":\"无畏的天才\",\"author\":\"道格·门德斯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_8w4qnkd7mhnin3ox7q5g7h/t6_cpplatform_8w4qnkd7mhnin3ox7q5g7h1678084838.jpg\",\"url\":\"https://weread.qq.com/web/reader/5c9327f0813ab7a87g01582f\",\"wordCount\":46070,\"spinePalette\":{\"paper\":\"rgb(173 173 175)\",\"ink\":\"#292622\"}},\"chapter\":\"推荐序2 生命的黎明是乐园，青春才是真正的天堂\",\"date\":\"2026-09-25\"},{\"id\":\"34141387:mark:34141387_7_1297-1412\",\"quote\":\"量子理论并非真正的专门理论，而是一种理论类型。它包括任何基于“量子假设”的理论，是马克斯·普朗克（Max Planck）在1900年提出来的，它说明某些物理量（例如你的能量）只能呈现特定的离散值（和经典物理量均为连续不间断的相悖）\",\"book\":{\"id\":\"34141387\",\"title\":\"费曼的彩虹\",\"author\":\"伦纳德·蒙洛迪诺\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/387/34141387/t6_34141387.jpg\",\"url\":\"https://weread.qq.com/web/reader/1a1321b07208f4cb1a152af\",\"wordCount\":\"$undefined\"},\"chapter\":\"第二章\",\"date\":\"2026-09-25\"},{\"id\":\"3300159706:mark:3300159706_33_3819-3922\",\"quote\":\"这就带来了一个可怕的问题，泡沫最疯狂阶段整个银行体系在4年时间增长了140万亿贷款，但在泡沫破裂之时这些贷款还款周期大多都不到20%。这就意味着一旦老员工们失业，他们这剩余80%的未偿贷款将只能由银行消化。\",\"book\":{\"id\":\"3300159706\",\"title\":\"以日为鉴：衰退时代生存指南（微信读书特别版）\",\"author\":\"分析师Boden\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/4/cpplatform_c51jhaugkycsgy414tbhz2/t6_cpplatform_c51jhaugkycsgy414tbhz21755763748.jpg\",\"url\":\"https://weread.qq.com/web/reader/77d32440813aba4e2g01644a\",\"wordCount\":133835},\"chapter\":\"第二章 救老员工，还是大学生？——回顾日本大学生失业潮\",\"date\":\"2026-09-21\"},{\"id\":\"3300159706:mark:3300159706_33_5889-6056\",\"quote\":\"据统计，这批临时员工在10年内成功转正的比例仅有47%。这种环境下，新人们怎么可能规划好自己的职业生涯，多数人被迫开始频繁跳槽。而此时日本社会还没有意识到这批大学生其实才是真正的受害者，反而认为这批大学生不够努力、不够上进，由此催生了“垮掉的70后”。可以说，这一代大学生没有赶上终身雇佣制度的红利，但却成了终身雇佣制度解体的牺牲品。\",\"book\":{\"id\":\"3300159706\",\"title\":\"以日为鉴：衰退时代生存指南（微信读书特别版）\",\"author\":\"分析师Boden\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/4/cpplatform_c51jhaugkycsgy414tbhz2/t6_cpplatform_c51jhaugkycsgy414tbhz21755763748.jpg\",\"url\":\"https://weread.qq.com/web/reader/77d32440813aba4e2g01644a\",\"wordCount\":133835},\"chapter\":\"第二章 救老员工，还是大学生？——回顾日本大学生失业潮\",\"date\":\"2026-09-21\"},{\"id\":\"3300159706:mark:3300159706_33_8444-8616\",\"quote\":\"2004年，随着团块世代进入退休阶段，日本再次掀起了“再雇佣”的风潮，一批老技术员工被返聘成为香饽饽。这是因为企业发现，这些老员工经历过七八十年代众多项目的历练，往往拥有更丰富的工作经验和专业技能。相比之下，90年代的大学生在毕业后面临的是产业与技术的衰退，他们中的许多人不要说历练了，甚至都没有完整参与过几个项目，自然也谈不上什么专业的技能。\",\"book\":{\"id\":\"3300159706\",\"title\":\"以日为鉴：衰退时代生存指南（微信读书特别版）\",\"author\":\"分析师Boden\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/4/cpplatform_c51jhaugkycsgy414tbhz2/t6_cpplatform_c51jhaugkycsgy414tbhz21755763748.jpg\",\"url\":\"https://weread.qq.com/web/reader/77d32440813aba4e2g01644a\",\"wordCount\":133835},\"chapter\":\"第二章 救老员工，还是大学生？——回顾日本大学生失业潮\",\"date\":\"2026-09-21\"},{\"id\":\"3300159706:mark:3300159706_38_5729-5830\",\"quote\":\"学生们想要专心进行科学研究几乎是不可能的，文部省统计1998年研究生实际科研时间仅占53%，剩下时间都在处理非科研事项。一边是艰难的毕业论文，一边是教授的无情压榨，研究生与博士们几乎都处于严重过劳状态。\",\"book\":{\"id\":\"3300159706\",\"title\":\"以日为鉴：衰退时代生存指南（微信读书特别版）\",\"author\":\"分析师Boden\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/4/cpplatform_c51jhaugkycsgy414tbhz2/t6_cpplatform_c51jhaugkycsgy414tbhz21755763748.jpg\",\"url\":\"https://weread.qq.com/web/reader/77d32440813aba4e2g01644a\",\"wordCount\":133835},\"chapter\":\"第六章 日本硕博扩招一代——日本硕博学历贬值史：大扩招的教训\",\"date\":\"2026-09-21\"},{\"id\":\"3300159706:mark:3300159706_38_7401-7579\",\"quote\":\"因为经过10年的经济衰退与破产潮的洗礼，多数企业都处于战略收缩阶段，对于研发创新的投入十分谨慎，因此企业没有意愿雇佣太多的研究型人才。当时正是劳务派遣最严重的时期，找不到工作的硕士博士，很多只能沦为派遣员工，与本科生甚至高中生拿着相同的薪水。而不愿从事派遣员工的高学历者，则只能返回高校从事低薪的临时教师，以期待有一天可以转正，继续干回自己热爱的科研工作。\",\"book\":{\"id\":\"3300159706\",\"title\":\"以日为鉴：衰退时代生存指南（微信读书特别版）\",\"author\":\"分析师Boden\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/4/cpplatform_c51jhaugkycsgy414tbhz2/t6_cpplatform_c51jhaugkycsgy414tbhz21755763748.jpg\",\"url\":\"https://weread.qq.com/web/reader/77d32440813aba4e2g01644a\",\"wordCount\":133835},\"chapter\":\"第六章 日本硕博扩招一代——日本硕博学历贬值史：大扩招的教训\",\"date\":\"2026-09-21\"},{\"id\":\"3300196813:mark:3300196813_18_1516-1565\",\"quote\":\"只有已经安住在真理之中的人，才能说出真理；而不是那些仍然栖身于虚妄之中，只是偶尔探头张望真理的人。\",\"book\":{\"id\":\"3300196813\",\"title\":\"文化与价值\",\"author\":\"[英]维特根斯坦\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/cpplatform_4ujxk73jemik1tbgjuxzkn/t6_cpplatform_4ujxk73jemik1tbgjuxzkn1772416153.jpg\",\"url\":\"https://weread.qq.com/web/reader/2f7327b0813abb361g0135a0\",\"wordCount\":103934},\"chapter\":\"1939年至1940年\",\"date\":\"2026-05-17\",\"annotation\":\"需要领悟的东西，干巴巴地学是学不会的\"},{\"id\":\"842282:mark:842282_12_1506-1573\",\"quote\":\"第一问题是：什么是逻辑学的对象？对于这个问题的最简单、最明了的答复是，真理就是逻辑学的对象。真理是一个高尚的名词，而它的实质尤为高尚。\",\"book\":{\"id\":\"842282\",\"title\":\"小逻辑\",\"author\":\"黑格尔著\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/282/842282/t6_842282.jpg\",\"url\":\"https://weread.qq.com/web/reader/9fe325a05cda2a9fea10c24\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一部 逻辑学\",\"date\":\"2026-04-15\"},{\"id\":\"842282:mark:842282_12_521-559\",\"quote\":\"逻辑学是研究纯粹理念的科学，所谓纯粹理念就是思维的最抽象的要素所形成的理念。\",\"book\":{\"id\":\"842282\",\"title\":\"小逻辑\",\"author\":\"黑格尔著\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/282/842282/t6_842282.jpg\",\"url\":\"https://weread.qq.com/web/reader/9fe325a05cda2a9fea10c24\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一部 逻辑学\",\"date\":\"2026-04-15\"},{\"id\":\"26435427:review:6166943_86HhYM0Jo\",\"quote\":\"闹闹，啊噢；花花，嗯哼；我们永远在一起，天公地母也休想把我们分离，啊噢好不好？嗯哼非常好！\",\"annotation\":\"酸臭。\\n\\n莫言写恋爱也是一绝，即便是驴子的恋爱🤣🤣🤣\",\"chapter\":\"第七章 花花畏难背誓约 闹闹发威咬猎户\",\"date\":\"2026-02-06\",\"book\":{\"id\":\"26435427\",\"title\":\"生死疲劳【中国诺奖得主代表作】\",\"author\":\"莫言\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/79/yuewen_26435427/t6_yuewen_264354271701758059.jpg\",\"url\":\"https://weread.qq.com/web/reader/c2f320f071935f63c2f1313\",\"wordCount\":387456}},{\"id\":\"26435427:review:6166943_86FLpTOR3\",\"quote\":\"一切来自土地的都将回归土地。\",\"annotation\":\"一切终将归于沉寂\",\"chapter\":\"第五十三章 人将死恩仇并泯 狗虽亡难脱轮回\",\"date\":\"2026-02-05\",\"book\":{\"id\":\"26435427\",\"title\":\"生死疲劳【中国诺奖得主代表作】\",\"author\":\"莫言\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/79/yuewen_26435427/t6_yuewen_264354271701758059.jpg\",\"url\":\"https://weread.qq.com/web/reader/c2f320f071935f63c2f1313\",\"wordCount\":387456}},{\"id\":\"26435427:review:6166943_86H3twTtQ\",\"quote\":\"\",\"annotation\":\"马尔克斯确实“害人不浅”\\n\\n余华与莫言都是他的好学生。一部长篇读完之后，主角家族几乎啥都不剩了...\\n\\n《生死疲劳》这本书，开始读了之后就停不下来，然后接连不断的悲伤，最后哭成泪人。甚至感觉这本书是在讲述自己故事。\\n\\n最后，蓝脸的墓志铭：一切来自土地的都将回归土地。\",\"date\":\"2026-02-05\",\"book\":{\"id\":\"26435427\",\"title\":\"生死疲劳【中国诺奖得主代表作】\",\"author\":\"莫言\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/79/yuewen_26435427/t6_yuewen_264354271701758059.jpg\",\"url\":\"https://weread.qq.com/web/reader/c2f320f071935f63c2f1313\",\"wordCount\":387456},\"bookReview\":true},{\"id\":\"26435421:review:6166943_866HoSaVM\",\"quote\":\"\",\"annotation\":\"一开始听得乐不可支，后面越来越让人唏嘘。\\n\\n莫言讲故事太强了！\",\"date\":\"2026-01-12\",\"book\":{\"id\":\"26435421\",\"title\":\"蛙【中国诺奖得主代表作】\",\"author\":\"莫言\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/yuewen_26435421/t6_yuewen_264354211701748538.jpg\",\"url\":\"https://weread.qq.com/web/reader/f5432d3071935f5df546a42\",\"wordCount\":191508},\"bookReview\":true},{\"id\":\"25292178:mark:25292178_28_1004-1115\",\"quote\":\"那么“搞明白”到底是什么意思呢？说白了，就是在脑中完全自动、毫不费力地唤醒某些我们熟悉的类别。这些类别一旦从沉睡的记忆中被唤醒，就能帮助我们在混乱中找到规律。在很大程度上，这就意味着有一大堆各种类别词语同时涌入我们的脑海。\",\"book\":{\"id\":\"25292178\",\"title\":\"表象与本质：类比，思考之源和思维之火\",\"author\":\"[美]侯世达 [法]桑德尔\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/178/25292178/t6_25292178.jpg\",\"url\":\"https://weread.qq.com/web/reader/44332da07181ed92443ef71\",\"wordCount\":\"$undefined\"},\"chapter\":\"词语是怎么闪现在脑海的？\",\"date\":\"2025-12-24\"},{\"id\":\"3300058755:mark:3300058755_19_3582-3937\",\"quote\":\"当4年后，拉格朗日写信把解决等周问题的真正方法（变分法，在伯努利家族那一章中描述过）告诉欧拉时，欧拉写信给这个年轻人，说新方法解决了他的困难，因为在这以前，欧拉使用他的半几何的方法，困惑了多年却未能解决这个问题。欧拉没有立刻发表他寻求已久的解答，一直等到拉格朗日能够先发表他的解答，“这是为了不剥夺应该归于你的光荣。”不管在私人信件上怎样奉承，对拉格朗日也不能有什么帮助。欧拉认识到这一点，在发表他的著作（在拉格朗日的著作发表之后）时，就故意说他是怎样被困难挡住了，在拉格朗日指出克服困难的途径之前，它们是难以逾越的障碍。最后，欧拉使拉格朗日在23岁这个不寻常的年轻年龄，就当选为柏林科学院的外籍院士（1759年10月2日），拉格朗日的地位也得以确定。\",\"book\":{\"id\":\"3300058755\",\"title\":\"数学大师：从芝诺到庞加莱\",\"author\":\"埃里克·坦普尔·贝尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/47/cpplatform_7jxmjwch6g9stn9f6kpbh9/t6_cpplatform_7jxmjwch6g9stn9f6kpbh91684121423.jpg\",\"url\":\"https://weread.qq.com/web/reader/d26321a0813ab7d73g015f39\",\"wordCount\":\"$undefined\"},\"chapter\":\"第10章 一座高耸的金字塔\",\"date\":\"2025-12-03\"},{\"id\":\"3300058755:mark:3300058755_21_21556-21572\",\"quote\":\"：“永勿怨恨批评，永勿回答它。”\",\"book\":{\"id\":\"3300058755\",\"title\":\"数学大师：从芝诺到庞加莱\",\"author\":\"埃里克·坦普尔·贝尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/47/cpplatform_7jxmjwch6g9stn9f6kpbh9/t6_cpplatform_7jxmjwch6g9stn9f6kpbh91684121423.jpg\",\"url\":\"https://weread.qq.com/web/reader/d26321a0813ab7d73g015f39\",\"wordCount\":\"$undefined\"},\"chapter\":\"第12章 皇帝的朋友们\",\"date\":\"2025-12-03\"},{\"id\":\"MP_WXS_3957812448:mark:MP_WXS_3957812448_2OMR-a8TPPf~ybMHR7w~aQ_927-1022\",\"quote\":\"价值迁移：写代码本身会变得像打字一样——成为一项基础技能，而不是一个职业。真正的价值将转移到别处：理解该构建什么，洞察不同系统如何组合在一起，以及在海量廉价软件模块的复杂性中游刃有余地穿行。\",\"book\":{\"id\":\"MP_WXS_3957812448\",\"title\":\"宝玉AI\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/077424a224d505f5758535f33393537383132343438dfd\",\"wordCount\":\"$undefined\"},\"date\":\"2025-09-19\"},{\"id\":\"3300023549:mark:3300023549_11_13279-13518\",\"quote\":\"唐朝此时最不值钱的东西就是告身，因为皇帝为了鼓舞将士，几乎到了滥发告身的地步。他发出去了许多在和平时期非常珍贵的名号，比如开府、特进、列卿、大将军等，至于中郎、郎将，更是数不胜数，甚至有异姓封王的。由于名号太滥，大将军的告身只能换顿酒喝，就连普通士兵杂役都可以穿上高官的金紫衣服。[插图]唐朝吏治的败坏到此时已经登峰造极。\",\"book\":{\"id\":\"3300023549\",\"title\":\"盛世的崩塌：盛唐与安史之乱时期的政治、战争与诗（一部全新视角下的大唐帝国兴衰史！）\",\"author\":\"郭建龙\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/49/3300023549/t6_3300023549.jpg\",\"url\":\"https://weread.qq.com/web/reader/f9132c90813ab6fb2g019847\",\"wordCount\":277046,\"spinePalette\":{\"paper\":\"rgb(20 74 72)\",\"ink\":\"#eaf2ff\"}},\"chapter\":\"第八章 血肉抗战\",\"date\":\"2025-08-20\",\"annotation\":\"唉，恶性通胀\"},{\"id\":\"3300023549:mark:3300023549_11_2781-2857\",\"quote\":\"安禄山在早期曾经试图拿下太原，但随着两京的陷落，他将更多的精力放在了南方，反而忽略了最重要的太原，使得李光弼以不到一万的人马就守住了这个最重要的战略点。\",\"book\":{\"id\":\"3300023549\",\"title\":\"盛世的崩塌：盛唐与安史之乱时期的政治、战争与诗（一部全新视角下的大唐帝国兴衰史！）\",\"author\":\"郭建龙\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/49/3300023549/t6_3300023549.jpg\",\"url\":\"https://weread.qq.com/web/reader/f9132c90813ab6fb2g019847\",\"wordCount\":277046,\"spinePalette\":{\"paper\":\"rgb(20 74 72)\",\"ink\":\"#eaf2ff\"}},\"chapter\":\"第八章 血肉抗战\",\"date\":\"2025-08-20\"},{\"id\":\"3300023549:mark:3300023549_13_26041-26085\",\"quote\":\"事实上，唐朝在经过了安史之乱后，进入了一个人人自危的时期，即便是将军和节度使也无法幸免。\",\"book\":{\"id\":\"3300023549\",\"title\":\"盛世的崩塌：盛唐与安史之乱时期的政治、战争与诗（一部全新视角下的大唐帝国兴衰史！）\",\"author\":\"郭建龙\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/49/3300023549/t6_3300023549.jpg\",\"url\":\"https://weread.qq.com/web/reader/f9132c90813ab6fb2g019847\",\"wordCount\":277046,\"spinePalette\":{\"paper\":\"rgb(20 74 72)\",\"ink\":\"#eaf2ff\"}},\"chapter\":\"第十章 找不回的盛世\",\"date\":\"2025-08-20\"},{\"id\":\"3300023549:review:6166943_82xX9cEFQ\",\"quote\":\"东面是安上门，西面是含光门。[插图]安史之乱后，皇帝甚至连“安”字都不愿意听，于是将安上门改为先天门。\",\"annotation\":\"太惨了\",\"chapter\":\"尾声 盛世的丘墟\",\"date\":\"2025-08-20\",\"book\":{\"id\":\"3300023549\",\"title\":\"盛世的崩塌：盛唐与安史之乱时期的政治、战争与诗（一部全新视角下的大唐帝国兴衰史！）\",\"author\":\"郭建龙\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/49/3300023549/t6_3300023549.jpg\",\"url\":\"https://weread.qq.com/web/reader/f9132c90813ab6fb2g019847\",\"wordCount\":277046,\"spinePalette\":{\"paper\":\"rgb(20 74 72)\",\"ink\":\"#eaf2ff\"}}},{\"id\":\"3300023549:review:6166943_82xXKS7zZ\",\"quote\":\"他死后，安庆绪和严庄进去，在他的床下挖了个数尺深的坑，将他的尸体用毯子一裹就埋了。\",\"annotation\":\"这么低碳环保？\",\"chapter\":\"第八章 血肉抗战\",\"date\":\"2025-08-20\",\"book\":{\"id\":\"3300023549\",\"title\":\"盛世的崩塌：盛唐与安史之乱时期的政治、战争与诗（一部全新视角下的大唐帝国兴衰史！）\",\"author\":\"郭建龙\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/49/3300023549/t6_3300023549.jpg\",\"url\":\"https://weread.qq.com/web/reader/f9132c90813ab6fb2g019847\",\"wordCount\":277046,\"spinePalette\":{\"paper\":\"rgb(20 74 72)\",\"ink\":\"#eaf2ff\"}}},{\"id\":\"3300023549:mark:3300023549_3_8877-8937\",\"quote\":\"：即便没有安史之乱，所谓盛世，也早已经结束了。事实上，即便没有安禄山，玄宗所留下的政治隐患也会在短时间内导致另一个乱局。\",\"book\":{\"id\":\"3300023549\",\"title\":\"盛世的崩塌：盛唐与安史之乱时期的政治、战争与诗（一部全新视角下的大唐帝国兴衰史！）\",\"author\":\"郭建龙\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/49/3300023549/t6_3300023549.jpg\",\"url\":\"https://weread.qq.com/web/reader/f9132c90813ab6fb2g019847\",\"wordCount\":277046,\"spinePalette\":{\"paper\":\"rgb(20 74 72)\",\"ink\":\"#eaf2ff\"}},\"chapter\":\"楔子 盛世毁于战争\",\"date\":\"2025-08-19\"},{\"id\":\"837932:mark:837932_90_10182-10227\",\"quote\":\"我一辈子想要的就是融入生活(engage life)，而不希望自己被孤立(isolate)\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-15\"},{\"id\":\"837932:mark:837932_90_10644-10732\",\"quote\":\"他一个人的旅行，无论公务私务都搭乘经济舱，但与太太和家人一起旅行时，查理便会搭乘自己的私人飞机。他解释说：太太一辈子为我抚育这么多孩子，付出甚多，身体又不好，我一定要照顾好她。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-15\"},{\"id\":\"837932:mark:837932_90_5966-6135\",\"quote\":\"查理思考问题总是从逆向开始。如果要明白人生如何得到幸福，查理首先是研究人生如何才能变得痛苦；要研究企业如何做强做大，查理首先研究企业是如何衰败的；大部分人更关心如何在股市投资上成功，查理最关心的是为什么在股市投资上大部分人都失败了。他的这种思考方法来源于下面这句农夫谚语中所蕴含的哲理：我只想知道将来我会死在什么地方，这样我就不去那儿了。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-15\"},{\"id\":\"837932:mark:837932_90_6534-6623\",\"quote\":\"近代很多第一流的专家学者能够在自己狭小的研究领域内做到相对客观，一旦离开自己的领域不远，就开始变得主观、教条、僵化，或者干脆就失去了自我学习的能力，所以大都免不了瞎子摸象的局限。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-15\"},{\"id\":\"837932:mark:837932_90_6754-6812\",\"quote\":\"他提倡要学习在所有学科中真正重要的理论，并在此基础上形成所谓的“普世智慧”​，以此为利器去研究商业投资领域的重要问题。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-15\"},{\"id\":\"837932:mark:837932_90_7190-7263\",\"quote\":\"一个人在一生中可以真正得到的真见卓识仍然非常有限，所以正确的决策必须局限在自己的“能力圈”以内。一种不能够界定其边界的能力当然不能称为真正的能力。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-15\"},{\"id\":\"837932:mark:837932_90_7263-7341\",\"quote\":\"怎么才能界定自己的能力圈呢？查理说，如果我要拥有一种观点，如果我不能够比全世界最聪明、最有能力、最有资格反驳这个观点的人更能够证否自己，我就不配拥有这个观点\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-15\"},{\"id\":\"837932:mark:837932_90_8663-8777\",\"quote\":\"他还是个出色的建筑师。他按自己的喜好建造房子，从最初的图纸设计到之后的每一个细节，他都全程参与。比如他捐助的所有建筑物都是他自己亲自设计的，这包括了斯坦福大学研究生院宿舍楼、哈佛高中科学馆以及亨廷顿图书馆与园林的珍本图书研究馆。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-15\"},{\"id\":\"837932:mark:837932_90_9410-9502\",\"quote\":\"到六点四十五的时候，查理慢悠悠地走进来了，手里拿着一摞报纸，头也不抬地坐下，完全没有注意到我的存在。以后我逐渐了解，查理与人约会一定早到。到了以后也不浪费时间，会拿出准备好的报纸翻阅。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-15\"},{\"id\":\"837932:mark:837932_90_2028-2201\",\"quote\":\"巴菲特说股票本质上是公司的部分所有权，股票的价格就是由股票的价值，也就是公司的价值所决定的。而公司的价值又是由公司的盈利情况及净资产决定的。虽然股票价格上上下下的波动在短期内很难预测，但长期而言一定是由公司的价值决定的。而聪明的投资者只要在股票的价格远低于公司实际价值的时候买进，又在价格接近或者高于价值时卖出，就能够在风险很小的情况下赚很多钱。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-14\"},{\"id\":\"837932:mark:837932_90_2337-2414\",\"quote\":\"那时我自认为不适合做管理，因为对美国的社会和文化不了解，创业也没有把握。但是如果说去研究公司的价值，去研究一些比较复杂的商业数据、财务报告，却是我的专长。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-14\"},{\"id\":\"837932:mark:837932_90_2979-3069\",\"quote\":\"1998年1月，我创立了自己的公司，支持者寡，几个老朋友友情客串投资人凑了一小笔钱，我自己身兼数职，既是董事长、基金经理，又是秘书、分析员。全部的家当就是一部手机和一台笔记本电脑。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-14\"},{\"id\":\"837932:mark:837932_90_3690-3742\",\"quote\":\"比如他们相信市场完全有效理论，因而相信股价的波动就等同真实的风险，判断你的表现最看重你业绩的波动性如何。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-14\"},{\"id\":\"837932:mark:837932_90_3742-3885\",\"quote\":\"在价值投资者看来，投资股市最大的风险其实并不是价格的上下起伏，而是你的投资未来会不会出现永久性的亏损。单纯的股价下跌不仅不是风险，其实还是机会。不然哪里去找便宜的股票呢？就像如果你最喜欢的餐馆里牛排的价格下跌了一半，你会吃得更香才对。买进下跌的股票时是卖家难受，作为买家你应该高兴才对。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-14\"},{\"id\":\"837932:mark:837932_90_5182-5238\",\"quote\":\"整个华尔街的思维方式都有问题，虽然伯克希尔已经取得了这么大的成功，但在华尔街上却找不到任何一家真正模仿它的公司。\",\"book\":{\"id\":\"837932\",\"title\":\"穷查理宝典：查理·芒格智慧箴言录（全新增订本）\",\"author\":\"彼得·考夫曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/48/YueWen_837932/t6_YueWen_837932.jpg\",\"url\":\"https://weread.qq.com/web/reader/2e0320e05cc92c2e0796c5a\",\"wordCount\":\"$undefined\"},\"chapter\":\"中文版序言 书中自有黄金屋\",\"date\":\"2025-08-14\"},{\"id\":\"31808208:mark:31808208_269_785-1034\",\"quote\":\"有一次帕斯卡[插图]讲过一句话：谁反对哲学，他自己便是哲学家。多可怜的哲学！\",\"book\":{\"id\":\"31808208\",\"title\":\"人不单靠面包活着：陀思妥耶夫斯基书信选\",\"author\":\"费·米·陀思妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/208/31808208/t6_31808208.jpg\",\"url\":\"https://weread.qq.com/web/reader/c783298071e55ad0c78cb3e\",\"wordCount\":\"$undefined\"},\"chapter\":\"给米·米·陀思妥耶夫斯基\",\"date\":\"2025-07-13\",\"annotation\":\"内耗者的宿命\"},{\"id\":\"3300148741:mark:3300148741_42_613-761\",\"quote\":\"我们理解世界、理解生活往往不是通过推论，不是通过推理，逻辑其实是辅助性的工具。更重要的是对经验形成的总体的图景。正是因为图景的知识，才有权重的问题，你知道哪一个是主要矛盾，哪一个是次要矛盾。一件事情看起来好像很热闹，但在整个大的图景当中只占两成，你就给它0.2的权重，最后呈现出来的东西才会真实。\",\"book\":{\"id\":\"3300148741\",\"title\":\"你好，陌生人\",\"author\":\"项飙\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/61/cpplatform_jujgmpcgf6athrowqdhex2/t6_cpplatform_jujgmpcgf6athrowqdhex21749805427.jpg\",\"url\":\"https://weread.qq.com/web/reader/9f532000813aba09ag011847\",\"wordCount\":\"$undefined\"},\"chapter\":\"为什么我们对生活的理解没有质感\",\"date\":\"2025-07-01\",\"annotation\":\"最近深有感触\"},{\"id\":\"26357016:mark:26357016_58_7618-7736\",\"quote\":\"从此之后，整个社会气氛加大了道德观念的灌输，要求人们重新树立忠于朝廷的价值观，道学抓住了这个机会成了主流。对“君君臣臣父父子子”的提倡，对灭人欲的推崇，都一股脑儿变成了人们必须接受的“天理”，最终发展成为一种愚忠，束缚了中国近千年之久。\",\"book\":{\"id\":\"26357016\",\"title\":\"汴京之围：北宋末年的外交、战争和人\",\"author\":\"郭建龙\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/68/YueWen_26357016/t6_YueWen_26357016.jpg\",\"url\":\"https://weread.qq.com/web/reader/ed3325f071922d18ed3589b\",\"wordCount\":243505},\"chapter\":\"尾声 消失的艮岳\",\"date\":\"2025-06-28\"},{\"id\":\"26357016:review:6166943_81fgSk238\",\"quote\":\"事实上，金人并不想折磨赵氏，只是按照他们的传统，将南方的皇帝全家迁走，让他们到北方自食其力、自生自灭。金人对于赵氏女性也并非完全迫害，只是按照游牧民族的规矩占为己有。但在宋人的想象中，金人却显得更加穷凶极恶、有意迫害。不过，宋朝“小说家”是欢迎这种迫害的，在虚构中将迫害更加强化，丝毫不在意赵氏的面子。\",\"annotation\":\"还是民间小说看起来更爽\",\"chapter\":\"画外音 百姓真的在乎帝王吗？\",\"date\":\"2025-06-28\",\"book\":{\"id\":\"26357016\",\"title\":\"汴京之围：北宋末年的外交、战争和人\",\"author\":\"郭建龙\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/68/YueWen_26357016/t6_YueWen_26357016.jpg\",\"url\":\"https://weread.qq.com/web/reader/ed3325f071922d18ed3589b\",\"wordCount\":243505}},{\"id\":\"26357016:mark:26357016_43_12067-12501\",\"quote\":\"宇文虚中表示，首先应该发罪己诏，将所有弊端革除，等人心回转，才能胜得了金军。宋徽宗连忙叫他去写罪己诏。宇文虚中从袖中抽出早已经准备好的草稿，原来他没有等皇帝的命令，就私下里先写了个草稿。[插图]皇帝也来不及提出质疑，立刻叫人在京城四处张挂。在罪己诏中，宇文虚中将皇帝骂得淋漓尽致，似乎将几十年的积怨都发泄了出来。其中将皇帝形容为：言路壅蔽，导谀日闻；恩倖持权，贪饕得志。缙绅贤能，陷于党籍；政事兴废，拘于纪年。赋敛竭生民之财，戍役困军伍之力，多作无益，靡侈成风。利源酤榷已尽，而谋利者尚肆诛求；诸军衣粮不时，而冗食者坐享富贵。灾异谪见而朕不悟，众庶怨怼而朕不知。追惟己愆，悔之何及！\",\"book\":{\"id\":\"26357016\",\"title\":\"汴京之围：北宋末年的外交、战争和人\",\"author\":\"郭建龙\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/68/YueWen_26357016/t6_YueWen_26357016.jpg\",\"url\":\"https://weread.qq.com/web/reader/ed3325f071922d18ed3589b\",\"wordCount\":243505},\"chapter\":\"第七章 闪击战\",\"date\":\"2025-06-26\"},{\"id\":\"33808607:mark:33808607_6_3936-4265\",\"quote\":\"“无头鸡”麦克。1945年，这只叫麦克的鸡本来要成为主人餐桌上的一道菜，但当主人用斧子砍下它的头之后，它的身体仍四处奔跑，就跟正常的鸡一样。它停下之后非但没有死去，反而“做回了正常的鸡应该有的样子”——它开始用脖子梳理羽毛、啄食，通过滴眼液的瓶子进食，直到18个月后的一天晚上死于窒息。它之所以能存活下来，很可能是因为许多反射功能被储存在脊髓和脑干中，而当初砍的位置偏高，保住了它大部分的脊髓和脑干。据说它在被砍时未伤及颈部的静脉，并且溢出的血液及时在伤口上凝固了，这避免了它因流血过多而死。在“无头鸡”麦克的家乡，也就是美国科罗拉多州的弗鲁塔市，人们每年5月都会为这只无头鸡顽强的精神而举办纪念活动。\",\"book\":{\"id\":\"33808607\",\"title\":\"人人都该懂的脑科学\",\"author\":\"阿马尔·阿尔查拉比 马丁·特纳 沙恩·德拉蒙特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/607/33808607/t6_33808607.jpg\",\"url\":\"https://weread.qq.com/web/reader/b93322907203e0dfb93f11f\",\"wordCount\":\"$undefined\"},\"chapter\":\"01 脑科学研究的历史进程\",\"date\":\"2025-05-25\",\"annotation\":\"“无头鸡”麦克：我宁肯死得痛快点\"},{\"id\":\"29629921:mark:29629921_6_1273-1359\",\"quote\":\"莫夫告诉我，至少要画废十张画，才能学会正确地使用油画笔。但是一旦掌握，就会得心应手，所以我全神贯注地工作，不让自己有丝毫懈怠，尽量避免犯错。不用说，技巧不是一天就能掌握的。\",\"book\":{\"id\":\"29629921\",\"title\":\"梵高手稿\",\"author\":\"文森特·梵高\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/921/29629921/t6_29629921.jpg\",\"url\":\"https://weread.qq.com/web/reader/723328b071c41de17235845\",\"wordCount\":\"$undefined\"},\"chapter\":\"Part Two 1882\",\"date\":\"2025-04-17\"},{\"id\":\"MP_WXS_2393463699:mark:MP_WXS_2393463699_NPohg~jpS3rzqr4gO96pUQ_43470-43669\",\"quote\":\"如果我们查看它在底层，在编辑GPT中，你会看到在指令中，它只是简单地给出了...它只是分解了指令。你将得到一个来自电视节目《单身即地狱》的图像裁剪，但你可以更改这个。它显示了一小段对话。所以，我给模型提供了一个提示，以及正在发生的事情的上下文。这些是说明。首先对它进行OCR处理，然后翻译它，然后分解它。然后你可以做任何你喜欢的输出格式，你可以玩这个并改进它。但这只是一个简单的例子，这工作得很好。\",\"book\":{\"id\":\"MP_WXS_2393463699\",\"title\":\"Linguista\",\"author\":\"公众号\",\"cover\":null,\"url\":\"https://weread.qq.com/web/mp/reader/7a542f8224d505f5758535f323339333436333639392cf\",\"wordCount\":\"$undefined\"},\"date\":\"2025-03-07\"},{\"id\":\"921568:mark:921568_68_16511-16595\",\"quote\":\"如果你的某位朋友喜欢把想法“说个明白”（甚至在无人交流的情况下难以思考问题），他就可能是个外向者。内向者通常觉得这样的谈话很痛苦，更喜欢独立思考，想明白了才和别人交流。\",\"book\":{\"id\":\"921568\",\"title\":\"原则\",\"author\":\"瑞·达利欧\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/23/YueWen_921568/t6_YueWen_921568.jpg\",\"url\":\"https://weread.qq.com/web/reader/848324405e0fe08483ab6a4\",\"wordCount\":276090,\"spinePalette\":{\"paper\":\"rgb(248 246 246)\",\"ink\":\"#292622\"}},\"chapter\":\"4 理解人与人大不相同\",\"date\":\"2025-02-20\"},{\"id\":\"921568:mark:921568_67_3524-3616\",\"quote\":\"有创造力的人通常持发散思维，这可能导致他们难以信靠，而线性思维者往往更值得信赖；一些人更情绪化，另一些人更理性；等等。在任何复杂的计划中，缺少拥有互补性能力者的帮助，任何人都无法成功。\",\"book\":{\"id\":\"921568\",\"title\":\"原则\",\"author\":\"瑞·达利欧\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/23/YueWen_921568/t6_YueWen_921568.jpg\",\"url\":\"https://weread.qq.com/web/reader/848324405e0fe08483ab6a4\",\"wordCount\":276090,\"spinePalette\":{\"paper\":\"rgb(248 246 246)\",\"ink\":\"#292622\"}},\"chapter\":\"3 做到头脑极度开放\",\"date\":\"2025-02-19\"},{\"id\":\"921568:mark:921568_67_7147-7222\",\"quote\":\"在我看来，人们在发生分歧时变得愤怒是毫无意义的，因为大多数分歧与其说是威胁，不如说是学习的机会。在学到东西后改变想法的人是赢家，顽固拒绝学习的人是输家\",\"book\":{\"id\":\"921568\",\"title\":\"原则\",\"author\":\"瑞·达利欧\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/23/YueWen_921568/t6_YueWen_921568.jpg\",\"url\":\"https://weread.qq.com/web/reader/848324405e0fe08483ab6a4\",\"wordCount\":276090,\"spinePalette\":{\"paper\":\"rgb(248 246 246)\",\"ink\":\"#292622\"}},\"chapter\":\"3 做到头脑极度开放\",\"date\":\"2025-02-19\"},{\"id\":\"921568:mark:921568_68_12000-12088\",\"quote\":\"习惯本质上是惯性，一种继续把你一直做的事情做下去（或者继续不做你一直不做的事情）的强烈倾向。研究显示，如果你能坚持某种行为约18个月，你就会形成一种几乎要永远做下去的强烈倾向。\",\"book\":{\"id\":\"921568\",\"title\":\"原则\",\"author\":\"瑞·达利欧\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/23/YueWen_921568/t6_YueWen_921568.jpg\",\"url\":\"https://weread.qq.com/web/reader/848324405e0fe08483ab6a4\",\"wordCount\":276090,\"spinePalette\":{\"paper\":\"rgb(248 246 246)\",\"ink\":\"#292622\"}},\"chapter\":\"4 理解人与人大不相同\",\"date\":\"2025-02-19\"},{\"id\":\"921568:mark:921568_68_12832-12935\",\"quote\":\"为了帮助你，我建议你写下自己最大的三个坏习惯。现在就写。然后从中选一个，下决心戒掉。你能做到吗？这将带来很大的改变。如果你能把三个坏习惯都戒掉，你的人生轨迹将大大改善。你也可以决定要养成哪些习惯，然后执行。\",\"book\":{\"id\":\"921568\",\"title\":\"原则\",\"author\":\"瑞·达利欧\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/23/YueWen_921568/t6_YueWen_921568.jpg\",\"url\":\"https://weread.qq.com/web/reader/848324405e0fe08483ab6a4\",\"wordCount\":276090,\"spinePalette\":{\"paper\":\"rgb(248 246 246)\",\"ink\":\"#292622\"}},\"chapter\":\"4 理解人与人大不相同\",\"date\":\"2025-02-19\"},{\"id\":\"921568:mark:921568_64_993-1075\",\"quote\":\"我逐渐明白，我的遭遇是对我的个性和创造力的考验。我逐渐领悟到，在一个如此伟大的系统里，我不过是渺小的匆匆过客，因此知道如何与这个系统良好互动，对我和系统都是有益的。\",\"book\":{\"id\":\"921568\",\"title\":\"原则\",\"author\":\"瑞·达利欧\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/23/YueWen_921568/t6_YueWen_921568.jpg\",\"url\":\"https://weread.qq.com/web/reader/848324405e0fe08483ab6a4\",\"wordCount\":276090,\"spinePalette\":{\"paper\":\"rgb(248 246 246)\",\"ink\":\"#292622\"}},\"chapter\":\"8 从更高的层面回顾\",\"date\":\"2025-02-15\",\"annotation\":\"接纳与珍惜发生在自己生命中的一切\"},{\"id\":\"921568:mark:921568_55_2551-2772\",\"quote\":\"只要原则是真实的（即能够反映你的真实性格和价值观），你就可以随心所欲地选定自己的原则。你在生活中将面临无数的选择，而你做出选择的方式将反映你的原则，所以用不了多久，你身边的人就将明白你依据怎样的原则为人处世。最糟糕的情况是你很虚假，因为假如你虚假的话，你将失去自尊和人们的信任。所以你必须清楚自己的原则是什么，并且“知行合一”。如果知与行之间似乎存在矛盾，你应当解释这些矛盾。最好的方法是写下来，因为这样一来，你将能够改进你写在纸面上的原则。\",\"book\":{\"id\":\"921568\",\"title\":\"原则\",\"author\":\"瑞·达利欧\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/23/YueWen_921568/t6_YueWen_921568.jpg\",\"url\":\"https://weread.qq.com/web/reader/848324405e0fe08483ab6a4\",\"wordCount\":276090,\"spinePalette\":{\"paper\":\"rgb(248 246 246)\",\"ink\":\"#292622\"}},\"chapter\":\"导言\",\"date\":\"2025-02-12\"},{\"id\":\"833591:mark:833591_32_33415-33479\",\"quote\":\"当一个旁观者问他气球能有什么用时，富兰克林做出了简练而相似的回答：“一个初生的婴儿，能有什么用呢？”而这一回答很快就为人所熟知。\",\"book\":{\"id\":\"833591\",\"title\":\"富兰克林传\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/25/YueWen_833591/t6_YueWen_833591.jpg\",\"url\":\"https://weread.qq.com/web/reader/88832c105cb837888655846\",\"wordCount\":371218,\"spinePalette\":{\"paper\":\"rgb(49 46 46)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"全权公使\",\"date\":\"2025-02-07\"},{\"id\":\"833591:mark:833591_32_43105-43124\",\"quote\":\"当我的力量渐衰，智慧与善行却与日俱增。\",\"book\":{\"id\":\"833591\",\"title\":\"富兰克林传\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/25/YueWen_833591/t6_YueWen_833591.jpg\",\"url\":\"https://weread.qq.com/web/reader/88832c105cb837888655846\",\"wordCount\":371218,\"spinePalette\":{\"paper\":\"rgb(49 46 46)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"全权公使\",\"date\":\"2025-02-07\"},{\"id\":\"181116:mark:181116_40_2954-3005\",\"quote\":\"一般的铁路组织内部大多是僵化的。一个问题要经过一层层地上报，没有得到上级的命令，任何人都不会去做事情。\",\"book\":{\"id\":\"181116\",\"title\":\"为人生加速：福特自传\",\"author\":\"[英]福特\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/4/YueWen_181116/t6_YueWen_181116.jpg\",\"url\":\"https://weread.qq.com/web/reader/3b0324d052c37c3b00f5cf1\",\"wordCount\":180027},\"chapter\":\"经营铁路 \",\"date\":\"2025-02-05\"},{\"id\":\"181116:mark:181116_47_279-306\",\"quote\":\"给予别人是容易的，难的是如何使得给予不再被人们所需要。\",\"book\":{\"id\":\"181116\",\"title\":\"为人生加速：福特自传\",\"author\":\"[英]福特\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/4/YueWen_181116/t6_YueWen_181116.jpg\",\"url\":\"https://weread.qq.com/web/reader/3b0324d052c37c3b00f5cf1\",\"wordCount\":180027},\"chapter\":\"我们需要慈善吗？ \",\"date\":\"2025-02-05\"},{\"id\":\"181116:review:6166943_7XJ8mchWA\",\"quote\":\"\",\"annotation\":\"深邃而务实\",\"date\":\"2025-02-05\",\"book\":{\"id\":\"181116\",\"title\":\"为人生加速：福特自传\",\"author\":\"[英]福特\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/4/YueWen_181116/t6_YueWen_181116.jpg\",\"url\":\"https://weread.qq.com/web/reader/3b0324d052c37c3b00f5cf1\",\"wordCount\":180027},\"bookReview\":true},{\"id\":\"181116:mark:181116_2_1504-1610\",\"quote\":\"有两种改革者，他们都是制造麻烦的人。那些自称为改革者的人想打碎现存的事物。他们是那种因为衬衣领子上的扣子和扣眼不吻合便要撕碎衬衣的人，却从来想不到可以将扣眼做大一点，这种改革者在任何时候都不会明白自己正在做什么。\",\"book\":{\"id\":\"181116\",\"title\":\"为人生加速：福特自传\",\"author\":\"[英]福特\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/4/YueWen_181116/t6_YueWen_181116.jpg\",\"url\":\"https://weread.qq.com/web/reader/3b0324d052c37c3b00f5cf1\",\"wordCount\":180027},\"chapter\":\"序：理念是什么 \",\"date\":\"2025-02-04\"},{\"id\":\"907768:mark:907768_15_26166-26185\",\"quote\":\"但也有些人担心，电报会宣告报纸的死刑。\",\"book\":{\"id\":\"907768\",\"title\":\"信息简史\",\"author\":\"詹姆斯·格雷克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/49/YueWen_907768/t6_YueWen_907768.jpg\",\"url\":\"https://weread.qq.com/web/reader/ccf326f05dd9f8ccf81de85\",\"wordCount\":\"$undefined\"},\"chapter\":\"第5章 地球的神经系统（就那么几根破电线，我们能指望它什么呢？）\",\"date\":\"2025-02-04\",\"annotation\":\"有趣，电报比报纸死得更快\"},{\"id\":\"907768:review:6166943_7XHwSkC1x\",\"quote\":\"一位记者注意到，克里米亚战争的前线快报从伦敦发送到了利物浦、约克、曼彻斯特、利兹、布里斯托、伯明翰以及赫尔等处，“快速更超烟火，也如烟火一般，在空中爆炸，通过发散的电线四散到众多邻近的市镇”。[插图]但他也发现了其中的危险性：“由于收集和传输匆忙，这样的情报也有不足之处，不像报纸，虽然反应迟些、传输慢些，却更可靠。”电报和报纸之间是一种共生的关系，它们之间的正反馈放大了这种效应。\",\"annotation\":\"新技术可以让旧技术获得更清晰的定位，也会让其不可替代的优势与价值更加凸显，而这种优势与价值在新技术之前可能是被忽视的。\",\"chapter\":\"第5章 地球的神经系统（就那么几根破电线，我们能指望它什么呢？）\",\"date\":\"2025-02-04\",\"book\":{\"id\":\"907768\",\"title\":\"信息简史\",\"author\":\"詹姆斯·格雷克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/49/YueWen_907768/t6_YueWen_907768.jpg\",\"url\":\"https://weread.qq.com/web/reader/ccf326f05dd9f8ccf81de85\",\"wordCount\":\"$undefined\"}},{\"id\":\"36213096:review:6166943_7XDYaFOsJ\",\"quote\":\"他意识到自己只身在东海岸，身无分文，还要面对一个躺在沙发上要死要活的老板。赫尔兰德想要说些什么让西蒙斯振作起来，但好像说什么都无济于事。\",\"annotation\":\"这画面挺真实。。。\",\"chapter\":\"第3章 一定有办法对价格建模\",\"date\":\"2025-02-02\",\"book\":{\"id\":\"36213096\",\"title\":\"征服市场的人：DeepSeek 创始人梁文锋作序\",\"author\":\"格里高利·祖克曼\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/84/YueWen_36213096/t6_YueWen_36213096.jpg\",\"url\":\"https://weread.qq.com/web/reader/57d322107228916857ddb4f\",\"wordCount\":219299}},{\"id\":\"907768:mark:907768_6_1025-1121\",\"quote\":\"那些看似有损于精炼和简洁的冗余信息反而提升了信息传播的精准性。而今，当我们对碎片化、无序化的信息头痛不已时，我们是否意识到，在依托大数据系统的组织与传播模式下，碎片可以为我们描绘出事物的全貌？\",\"book\":{\"id\":\"907768\",\"title\":\"信息简史\",\"author\":\"詹姆斯·格雷克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/49/YueWen_907768/t6_YueWen_907768.jpg\",\"url\":\"https://weread.qq.com/web/reader/ccf326f05dd9f8ccf81de85\",\"wordCount\":\"$undefined\"},\"chapter\":\"推荐序一\",\"date\":\"2025-02-02\"},{\"id\":\"907768:mark:907768_6_1150-1215\",\"quote\":\"在之后的“持久的文字”一章中，作者对于这一问题进行了更深入的探讨，也通过翁神父的观点道出了互联网文化的核心特征——口语文化的复兴。\",\"book\":{\"id\":\"907768\",\"title\":\"信息简史\",\"author\":\"詹姆斯·格雷克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/49/YueWen_907768/t6_YueWen_907768.jpg\",\"url\":\"https://weread.qq.com/web/reader/ccf326f05dd9f8ccf81de85\",\"wordCount\":\"$undefined\"},\"chapter\":\"推荐序一\",\"date\":\"2025-02-02\"},{\"id\":\"3300128993:review:6166943_7XxLtqFYe\",\"quote\":\"2012年12月，辛顿在一次研究会议上通过电子邮件拍卖了这家“公司”。\",\"annotation\":\"经典桥段\",\"chapter\":\"第11章 范式转变的时刻：AlexNet横空出世\",\"date\":\"2025-01-28\",\"book\":{\"id\":\"3300128993\",\"title\":\"黄仁勋:英伟达之芯\",\"author\":\"[美]斯蒂芬·威特\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/17/cpplatform_tbvb88uy6cwrq2lzpcsshr/t6_cpplatform_tbvb88uy6cwrq2lzpcsshr1735874725.jpg\",\"url\":\"https://weread.qq.com/web/reader/47a32050813ab98e3g013257\",\"wordCount\":215809}},{\"id\":\"3300128993:review:6166943_7XxLyBGW2\",\"quote\":\"克里泽夫斯基在卧室里一手训练出的神经网络AlexNet，其重要性如今已可与莱特兄弟的飞机、爱迪生的灯泡相提并论。\",\"annotation\":\"even more\",\"chapter\":\"第11章 范式转变的时刻：AlexNet横空出世\",\"date\":\"2025-01-28\",\"book\":{\"id\":\"3300128993\",\"title\":\"黄仁勋:英伟达之芯\",\"author\":\"[美]斯蒂芬·威特\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/17/cpplatform_tbvb88uy6cwrq2lzpcsshr/t6_cpplatform_tbvb88uy6cwrq2lzpcsshr1735874725.jpg\",\"url\":\"https://weread.qq.com/web/reader/47a32050813ab98e3g013257\",\"wordCount\":215809}},{\"id\":\"3300128993:mark:3300128993_10_2380-2416\",\"quote\":\"而普里姆的对策则是创建数千个不同的电子邮件地址，每个地址对应一位联系人。\",\"book\":{\"id\":\"3300128993\",\"title\":\"黄仁勋:英伟达之芯\",\"author\":\"[美]斯蒂芬·威特\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/17/cpplatform_tbvb88uy6cwrq2lzpcsshr/t6_cpplatform_tbvb88uy6cwrq2lzpcsshr1735874725.jpg\",\"url\":\"https://weread.qq.com/web/reader/47a32050813ab98e3g013257\",\"wordCount\":215809},\"chapter\":\"第4章 英伟达遭遇绝境：我们公司离破产只有30天\",\"date\":\"2025-01-26\",\"annotation\":\"是个狠人\"},{\"id\":\"26785337:mark:26785337_6_14387-14457\",\"quote\":\"有一天，他在树林中漫步，居然失去控制，公然号啕大哭。家里饲养的一只猫的咪呜声，竟使他狂怒不可遏。这些病征都是在1898至1899年间出现的。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导论：韦伯的生平与思想\",\"date\":\"2025-01-25\"},{\"id\":\"26785337:mark:26785337_6_14777-14827\",\"quote\":\"“无论读书、写字、说话、走路或睡觉，他没有不感到痛楚的；他所有的精神机能和部分躯体机能都拒绝运作。”\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导论：韦伯的生平与思想\",\"date\":\"2025-01-25\"},{\"id\":\"26785337:mark:26785337_6_16663-16795\",\"quote\":\"他认为，只有工作中的人，才算是一个完全的人（a full man）；于是他强迫自己工作。然而，仅过了一个夏季，他又单独重返意大利、荷兰和比利时。偶尔，他会因自己的精神状况、对自己能力不足的失望、与海德堡教授团的摩擦以及祖国的政治情况，而兴起永远不再返回德国的念头。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导论：韦伯的生平与思想\",\"date\":\"2025-01-25\"},{\"id\":\"26785337:mark:26785337_6_82071-82229\",\"quote\":\"韦伯看出，人可以以科学为理由来排斥宗教，以道德为理由来排斥科学，因为“学术的真理，不过就是在那些希望得到真理的人看来妥当的事物”[插图]。因此，人也可以拒绝学术真理。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导论：韦伯的生平与思想\",\"date\":\"2025-01-25\",\"annotation\":\"不是所有人都渴望真理\"},{\"id\":\"26785337:mark:26785337_6_82447-82474\",\"quote\":\"只有以信仰为基础，某一价值才会为个人或大多数人所偏好。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导论：韦伯的生平与思想\",\"date\":\"2025-01-25\",\"annotation\":\"似乎所有人都需要信仰，至少在某些时候\"},{\"id\":\"26785337:mark:26785337_6_82520-82593\",\"quote\":\"价值之间无从消解的矛盾冲突，只能以共存、妥协或容忍来处理。人类以政治、宗教或经济等价值为名进行观点上的斗争，在这些观点之间，科学没有能力去做裁决。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导论：韦伯的生平与思想\",\"date\":\"2025-01-25\"},{\"id\":\"26785337:mark:26785337_6_84000-84050\",\"quote\":\"：“一门经验性的科学，并不能教人应该做什么，而只能告诉他能够做什么，或在某些情况下，他想要做什么。”\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导论：韦伯的生平与思想\",\"date\":\"2025-01-25\",\"annotation\":\"理性只是欲望与热情的护法\"},{\"id\":\"26785337:mark:26785337_6_84301-84371\",\"quote\":\"学术只有在自己的范围里，才有资格说话，它不能行之于政治、艺术或宗教等评价性的领域中；同理，这些评价性的活动，在学术的领域中，也必须保持缄默。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导论：韦伯的生平与思想\",\"date\":\"2025-01-25\",\"annotation\":\"对不能言说的事物，必须保持沉默\"},{\"id\":\"26785337:mark:26785337_6_85629-85725\",\"quote\":\"事实上，韦伯经常提到他与马克思主义知识分子的面谈，特别是那些在德国的俄国流亡人士；对他们，韦伯只有非常有限的信心，因为他感觉他们更热衷于对权力的追求，而不愿对政治活动所涵盖的各种问题进行反省。\",\"book\":{\"id\":\"26785337\",\"title\":\"学术与政治\",\"author\":\"马克斯·韦伯\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/43/YueWen_26785337/t6_YueWen_26785337.jpg\",\"url\":\"https://weread.qq.com/web/reader/a23323007198b639a233c27\",\"wordCount\":215099},\"chapter\":\"导论：韦伯的生平与思想\",\"date\":\"2025-01-25\",\"annotation\":\"事实表明......\"},{\"id\":\"3300128993:mark:3300128993_8_4341-4400\",\"quote\":\"当LSI的客户提出新的功能需求时，多数设计师只会简单地回应：“这无法实现。”而黄仁勋则会说：“让我试试看能做些什么。”\",\"book\":{\"id\":\"3300128993\",\"title\":\"黄仁勋:英伟达之芯\",\"author\":\"[美]斯蒂芬·威特\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/17/cpplatform_tbvb88uy6cwrq2lzpcsshr/t6_cpplatform_tbvb88uy6cwrq2lzpcsshr1735874725.jpg\",\"url\":\"https://weread.qq.com/web/reader/47a32050813ab98e3g013257\",\"wordCount\":215809},\"chapter\":\"第2章 职涯早期：AMD、LSI和太阳微系统公司\",\"date\":\"2025-01-25\"},{\"id\":\"833591:mark:833591_10_26676-26697\",\"quote\":\"“上帝赐予我们眼泪，却带走生命让它落下。”\",\"book\":{\"id\":\"833591\",\"title\":\"富兰克林传\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/25/YueWen_833591/t6_YueWen_833591.jpg\",\"url\":\"https://weread.qq.com/web/reader/88832c105cb837888655846\",\"wordCount\":371218,\"spinePalette\":{\"paper\":\"rgb(49 46 46)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"初创事业\",\"date\":\"2025-01-23\"},{\"id\":\"833591:mark:833591_10_32832-32892\",\"quote\":\"所以他决定就像一个人“给花坛除草一样，他不会毕其功于一役，因为这完全超出了他的能力与体力，而是一个接着一个，循序渐进”。\",\"book\":{\"id\":\"833591\",\"title\":\"富兰克林传\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/25/YueWen_833591/t6_YueWen_833591.jpg\",\"url\":\"https://weread.qq.com/web/reader/88832c105cb837888655846\",\"wordCount\":371218,\"spinePalette\":{\"paper\":\"rgb(49 46 46)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"初创事业\",\"date\":\"2025-01-23\"},{\"id\":\"833591:mark:833591_10_4097-4148\",\"quote\":\"富兰克林把这种方法传授给了自己的朋友，即通过建议或者提问迂回论证，用（或假装）好奇以避免引起对方不快。\",\"book\":{\"id\":\"833591\",\"title\":\"富兰克林传\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/25/YueWen_833591/t6_YueWen_833591.jpg\",\"url\":\"https://weread.qq.com/web/reader/88832c105cb837888655846\",\"wordCount\":371218,\"spinePalette\":{\"paper\":\"rgb(49 46 46)\",\"ink\":\"#f8f4eb\"}},\"chapter\":\"初创事业\",\"date\":\"2025-01-23\",\"annotation\":\"嗯嗯\"},{\"id\":\"833591:review:6166943_7XpkGWkUJ\",\"quote\":\"1739年，他又抱怨自己的印刷商偷了自己的利润，但他又加了一句，“我并不怨恨他，他是我尊重的人。”\",\"annotation\":\"这和马斯克在x上玩小号一回事啊\",\"chapter\":\"初创事业\",\"date\":\"2025-01-23\",\"book\":{\"id\":\"833591\",\"title\":\"富兰克林传\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/25/YueWen_833591/t6_YueWen_833591.jpg\",\"url\":\"https://weread.qq.com/web/reader/88832c105cb837888655846\",\"wordCount\":371218,\"spinePalette\":{\"paper\":\"rgb(49 46 46)\",\"ink\":\"#f8f4eb\"}}},{\"id\":\"833591:review:6166943_7Xow8fG5P\",\"quote\":\"商业本身是一种道德，经济上的成功并不妨碍精神的救赎。\",\"annotation\":\"嗯，似非而是的至理\",\"chapter\":\"富兰克林家族：“自由人”\",\"date\":\"2025-01-22\",\"book\":{\"id\":\"833591\",\"title\":\"富兰克林传\",\"author\":\"沃尔特·艾萨克森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/25/YueWen_833591/t6_YueWen_833591.jpg\",\"url\":\"https://weread.qq.com/web/reader/88832c105cb837888655846\",\"wordCount\":371218,\"spinePalette\":{\"paper\":\"rgb(49 46 46)\",\"ink\":\"#f8f4eb\"}}},{\"id\":\"29348508:review:6166943_7XluKzCTe\",\"quote\":\"文学评论家纳杰日金（他在自己的杂志《望远镜》上刊登了《哲学书简》）1834年写道：“我们俄罗斯人的创造为零。我们在任何一个学科都没有贡献。没有一个人可以代表俄罗斯立于世界文明之林。”[插图]\",\"annotation\":\"好低的起点，好猛的崛起\",\"chapter\":\"第六节\",\"date\":\"2025-01-20\",\"book\":{\"id\":\"29348508\",\"title\":\"娜塔莎之舞：俄罗斯文化史\",\"author\":\"奥兰多·费吉斯\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/508/29348508/t6_29348508.jpg\",\"url\":\"https://weread.qq.com/web/reader/613321c071bfd29c613ae36\",\"wordCount\":\"$undefined\"}},{\"id\":\"32763783:mark:32763783_157_2246-2432\",\"quote\":\"尽管还存有这些明显的失误，牛顿已经在全书的内容上谨守着戒条，只叙述可以验证的假设。但是如他自己在书中所言，“我此时无法思考这些问题”[插图]，而决定在第四册中将所有问题集中起来，写成被他称为“质疑”的部分。\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"量子力学呼之欲出\",\"date\":\"2025-01-17\"},{\"id\":\"32763783:mark:32763783_157_2461-2532\",\"quote\":\"“质疑”的目的是方便他提出较为极端的看法，不至于将它们写成普通问题的形式，而遭受批评者嘲笑。在第一版《光学》的附录中，他一共列举了16则质疑。\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"量子力学呼之欲出\",\"date\":\"2025-01-17\"},{\"id\":\"32763783:review:6166943_7XgeJjuQe\",\"quote\":\"在头几个星期中，每天凌晨4点，当压制机开始启动时，牛顿就在厂房里了，夜班开工前他又赶回来监督。有一阵子，他甚至住在工厂旁边为他准备的带有一个小院子的宿舍里。在历任的厂长中，没有一人做过这些事。\",\"annotation\":\"原来天才是卷王\",\"chapter\":\"回收旧币铸新币\",\"date\":\"2025-01-17\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580}},{\"id\":\"32763783:review:6166943_7XgvszlZ3\",\"quote\":\"\",\"annotation\":\"$1d\",\"date\":\"2025-01-17\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"bookReview\":true},{\"id\":\"32763783:mark:32763783_98_1648-1667\",\"quote\":\"明天，阿拉伯文教授将走入无人的荒野。”\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"为人师表\",\"date\":\"2025-01-16\"},{\"id\":\"32763783:mark:32763783_98_1910-1977\",\"quote\":\"牛顿依照巴罗的做法，在形式上遵照规定，每年交给大学图书馆十堂课分量的讲义，不过也无法百分之百遵守，可是他那些讲义的品质远超过欠缺的量。\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"为人师表\",\"date\":\"2025-01-16\"},{\"id\":\"3300070913:mark:3300070913_61_13010-13164\",\"quote\":\"在一个恰好是资料稀缺的研究领域，核查与记录特定的事实便可能是一切。在资料众多而无法一一列举、同时又没有多到不能加以考察的研究领域，阐明与制定规律就既可行，也有必要。在资料无以数计的领域，被称作虚构的艺术创造和表现形式是唯一可以利用或值得利用的方法。在这里，正像在三种方法之间一样，我们遇到了数量上的实质区别。\",\"book\":{\"id\":\"3300070913\",\"title\":\"历史研究（上、下）\",\"author\":\"[英]阿诺德·汤因比\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/99/cpplatform_5y63ru6nkvvtsff4ytnhev/t6_cpplatform_5y63ru6nkvvtsff4ytnhev1694429512.jpg\",\"url\":\"https://weread.qq.com/web/reader/4a932c50813ab8233g01380f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第三章 各个社会的可比性\",\"date\":\"2025-01-15\"},{\"id\":\"3300070913:mark:3300070913_66_10700-10718\",\"quote\":\"证明了“先知只在本乡本土才不受尊重”\",\"book\":{\"id\":\"3300070913\",\"title\":\"历史研究（上、下）\",\"author\":\"[英]阿诺德·汤因比\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/99/cpplatform_5y63ru6nkvvtsff4ytnhev/t6_cpplatform_5y63ru6nkvvtsff4ytnhev1694429512.jpg\",\"url\":\"https://weread.qq.com/web/reader/4a932c50813ab8233g01380f\",\"wordCount\":\"$undefined\"},\"chapter\":\"第七章 环境的挑战\",\"date\":\"2025-01-15\",\"annotation\":\"啊偶...\"},{\"id\":\"32763783:mark:32763783_12_750-813\",\"quote\":\"这批藏书约250册，它们可能成了牛顿日后收藏书籍的起始，它们也向牛顿引介了有关神学的知识，使神学成为他日后专注研究的学科之一。\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"母亲再嫁\",\"date\":\"2025-01-13\"},{\"id\":\"32763783:mark:32763783_3_457-485\",\"quote\":\"“虚假的事物可以被随意想象，唯有真实的事物才能被理解。”\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"序言 真相出现\",\"date\":\"2025-01-13\"},{\"id\":\"32763783:mark:32763783_3_548-572\",\"quote\":\"“我们在解释一个奇迹的时候，不必害怕奇迹失踪。”\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"序言 真相出现\",\"date\":\"2025-01-13\"},{\"id\":\"32763783:mark:32763783_39_668-904\",\"quote\":\"有一次上课，他正在小心写下亚里士多德的观念时，突然间，句子写到一半就停止了，然后他翻过好几页空白页，跳到其中一页的顶上写下“哲学的一些疑问”，接着在下面写道：“我是柏拉图的朋友，我是亚里士多德的朋友，可是，我更好的朋友是真理。”[插图]\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"牛顿的“哲学笔记簿”\",\"date\":\"2025-01-13\"},{\"id\":\"32763783:mark:32763783_59_595-678\",\"quote\":\"事情的真相是，牛顿并不会侥幸地因为单一事件或者回到童年的环境，而产生某种推动力，进而得到启发，反而是专心的研究和绝对的奉献，逐步揭露事实真相，才是比较可能发生的情况。\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"灵感何时涌现\",\"date\":\"2025-01-13\"},{\"id\":\"32763783:mark:32763783_59_678-750\",\"quote\":\"正如有人问牛顿是怎么会想到这些前所未知的东西时，他回答说：“我经常将一些问题放在眼前，等待第一道曙光缓缓出现，再一步步地看到圆满、明亮的光辉。”\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"灵感何时涌现\",\"date\":\"2025-01-13\",\"annotation\":\"伟大的想法就像一棵树一样，一开始是颗种子，然后生根发芽，逐渐长大。当人们看到的时候，已经长成了参天大树，但他们通常没有机会见证一颗种子变成幼苗再变成大树的全过程，只感觉不可思议，以为这棵树是从天而降的。\\n\\n人们乐意把那些想法的诞生归因于天才的灵光一现，却忽视了这些想法的孕育过程。\\n\\n这种倾向可能方便把一个思想家进行神话。有些时候，那些天才思想家面对到处流传的传说疲于解释；另一种情形，有些天才爱慕虚荣，乐意配合这种虚假的传言的蔓延，从而方便他们牟取帽子与财富。但是这些“天才的灵光一现”基本上都是误读，这一点在我了解科学史的过程中不断地被印证。\\n\\n天才之所以为天才，在于他们对想法的“孕育能力”，而不在于其天才想法一朝分娩时刻的惊世骇俗。那些“天才们”通常也会因为自己艰苦的“孕育过程”被忽视而感到非常委屈。\\n\\n当然，这还不是最令人委屈的。在某些地方，参天大树会被移植。移植这些树的人会吹嘘这棵树是他们自己培养出来的。\\n\\n然而，如果认为这种吹嘘可以让他们永远地获得这棵大树，那就接受了那种假定：“这棵树是从天而降的”。这种观念很危险，因为它忽视了这棵大树赖以生存与成长所需要的阳光、空气、水，当然还有那片土壤--这是只属于天才的土壤。\\n\\n有时候思想的参天大树很重要，有时候土壤更加重要。对一个国家或社会而言，拥有前者，可能会拥有现在，但拥有后者才会有未来。需要注意的是，这里的土壤存在天才的脑中，你无法直接把这些突然从这些大脑中剥离，而是需要给这些天才提供合适的阳光、空气和水，让他们的土壤更加肥沃，孕育出新的树苗并让其成长。\"},{\"id\":\"32763783:mark:32763783_6_1412-1445\",\"quote\":\"牛顿说过：“虚假的事物可以被随意想象，唯有真实的事物才能被理解。”\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"牛顿的两面性\",\"date\":\"2025-01-13\",\"annotation\":\"‘A man may imagine things that are false, but he can only understand things that are true.’\"},{\"id\":\"32763783:mark:32763783_64_3650-3813\",\"quote\":\"更不可思议的是，牛顿在他原本的严谨生活中稍稍放肆之后，能够很快收敛，并且从此以后再也不让自己松懈。他那相当短暂、略显不羁的时期，就如同经过了一阵宣泄或自我清除，之后，他重新严谨地控制自己，其转变之突然，就与他突然出现在剑桥的小酒馆一样。1668年年初，他再度自我隐没于学术中，其时，他正着手铸造他早期学术生涯最重要的作品之一。\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"迷恋深红色\",\"date\":\"2025-01-13\"},{\"id\":\"32763783:mark:32763783_70_1239-1333\",\"quote\":\"牛顿自己写的“存在理由”是要重新发现“自然的架构”，由于这一神圣使命，他认为没有哪条研究途径不该去探索，没有哪块石头是不重要而不该被翻过来看看的，没有哪个人的理论是高高在上、不该被质疑的。\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"从炼金术寻求统一\",\"date\":\"2025-01-13\"},{\"id\":\"32763783:mark:32763783_70_746-848\",\"quote\":\"牛顿对秘术的兴趣到底有多大，修炼功夫有多深，各人有不同的见解。我们从本书中将可看到，牛顿重力概念的形成，主要是受到他所沉迷的炼金术的影响。很明显，他喜欢整合各方面的知识，热心寻求宇宙间各种定律的统一理论。\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580},\"chapter\":\"从炼金术寻求统一\",\"date\":\"2025-01-13\"},{\"id\":\"32763783:review:6166943_7XaYUSBSu\",\"quote\":\"从事炼金的人并非都是坏人或魔鬼，他们通常只不过是毁了自己的一生，再不然也是叫那些有多余闲钱的人失望而已。\",\"annotation\":\"炼金术士不坑穷人\",\"chapter\":\"来自王室的支持\",\"date\":\"2025-01-13\",\"book\":{\"id\":\"32763783\",\"title\":\"牛顿传（修订版）\",\"author\":\"迈克尔·怀特\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/783/32763783/t6_32763783.jpg\",\"url\":\"https://weread.qq.com/web/reader/1d232b8071f3ef871d2908d\",\"wordCount\":256580}},{\"id\":\"32764984:mark:32764984_28_419-447\",\"quote\":\"那
