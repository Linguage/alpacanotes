宽的容量，致使我们缺乏洞察力和前瞻性，还会减弱我们的执行控制力\",\"book\":{\"id\":\"853426\",\"title\":\"稀缺：我们是如何陷入贫穷与忙碌的\",\"author\":\"塞德希尔·穆来纳森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/46/YueWen_853426/t6_YueWen_853426.jpg\",\"url\":\"https://weread.qq.com/web/reader/36b321405d05b236bb0ce7d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_13113-13161\",\"quote\":\"因为我们总是将关注点放在稀缺上，思想总是围着稀缺打转，所以就没有那么多精力投入人生中的其他事物。\",\"book\":{\"id\":\"853426\",\"title\":\"稀缺：我们是如何陷入贫穷与忙碌的\",\"author\":\"塞德希尔·穆来纳森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/46/YueWen_853426/t6_YueWen_853426.jpg\",\"url\":\"https://weread.qq.com/web/reader/36b321405d05b236bb0ce7d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_13566-13720\",\"quote\":\"难以坚持按计划行事，无法抗拒新皮衣的诱惑，无法拒绝新项目的吸引，忘性大（忘记验车、打电话、还账单），脑子不好使（错误地估计了银行账户中的余额，发错了邀请函），这些都是因为带宽变窄才发生的。在稀缺所引发的后果中，有一项尤为重要——稀缺会进一步延续并加剧稀缺。\",\"book\":{\"id\":\"853426\",\"title\":\"稀缺：我们是如何陷入贫穷与忙碌的\",\"author\":\"塞德希尔·穆来纳森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/46/YueWen_853426/t6_YueWen_853426.jpg\",\"url\":\"https://weread.qq.com/web/reader/36b321405d05b236bb0ce7d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_13785-13836\",\"quote\":\"贫穷之人会一直穷困潦倒，忙碌之人会永远日理万机，孤独之人会终日形单影只，而节食之人也总是会以失败而告终\",\"book\":{\"id\":\"853426\",\"title\":\"稀缺：我们是如何陷入贫穷与忙碌的\",\"author\":\"塞德希尔·穆来纳森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/46/YueWen_853426/t6_YueWen_853426.jpg\",\"url\":\"https://weread.qq.com/web/reader/36b321405d05b236bb0ce7d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_14455-14551\",\"quote\":\"稀缺会俘获我们的注意力，并带来一点点好处：我们能够在应对迫切需求时，做得更好。但从长远的角度来看，我们的损失更大：我们会忽视其他需要关注的事项，在生活的其他方面变得不那么有成效。\",\"book\":{\"id\":\"853426\",\"title\":\"稀缺：我们是如何陷入贫穷与忙碌的\",\"author\":\"塞德希尔·穆来纳森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/46/YueWen_853426/t6_YueWen_853426.jpg\",\"url\":\"https://weread.qq.com/web/reader/36b321405d05b236bb0ce7d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_6082-6211\",\"quote\":\"当然，如果你也整天忍饥挨饿的话，那么找食物必然会是第一要务。但这些人关注的方面却远远超越了自身的实际利益——开餐厅、对比食物的价格、研究菜谱，这些想法都不能缓解饥饿。而所有这些关于食物的执着，只能进一步加剧饥饿带来的痛苦。他们对此毫无招架之力，但又别无选择。\",\"book\":{\"id\":\"853426\",\"title\":\"稀缺：我们是如何陷入贫穷与忙碌的\",\"author\":\"塞德希尔·穆来纳森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/46/YueWen_853426/t6_YueWen_853426.jpg\",\"url\":\"https://weread.qq.com/web/reader/36b321405d05b236bb0ce7d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_6720-6819\",\"quote\":\"稀缺俘获大脑（scarcity captures the mind） 稀缺造成的后果不仅仅是因为我们会因拥有的太少而感到不悦，而是因为它会改变我们的思维方式，会强行侵入我们的思想之中。\",\"book\":{\"id\":\"853426\",\"title\":\"稀缺：我们是如何陷入贫穷与忙碌的\",\"author\":\"塞德希尔·穆来纳森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/46/YueWen_853426/t6_YueWen_853426.jpg\",\"url\":\"https://weread.qq.com/web/reader/36b321405d05b236bb0ce7d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_9518-9593\",\"quote\":\"当我们将稀缺心态考虑在内时，就能理解这一现象了：因为孤独者会去关注自身的稀缺状况，关注为数不多的亲人朋友；他们会对他人表情中所流露出来的情绪非常敏感。\",\"book\":{\"id\":\"853426\",\"title\":\"稀缺：我们是如何陷入贫穷与忙碌的\",\"author\":\"塞德希尔·穆来纳森\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/46/YueWen_853426/t6_YueWen_853426.jpg\",\"url\":\"https://weread.qq.com/web/reader/36b321405d05b236bb0ce7d\",\"wordCount\":\"$undefined\"},\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"23303684:review:6166943_7gUe6Tkc1\",\"quote\":\"\",\"annotation\":\"就是美，语言美，故事美，人物也美……\\n\",\"date\":\"2020-04-27\",\"book\":{\"id\":\"23303684\",\"title\":\"红楼梦\",\"author\":\"[清]曹雪芹 [清]高鹗\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/65/YueWen_23303684/t6_YueWen_23303684.jpg\",\"url\":\"https://weread.qq.com/web/reader/6bf32660716396046bffdca\",\"wordCount\":\"$undefined\"},\"bookReview\":true},{\"id\":\"26392183:mark:26392183_12_1232-1269\",\"quote\":\"我把一切在其中找不到任何属于感觉的东西的表象称为纯粹的（在先验的意义上） \",\"book\":{\"id\":\"26392183\",\"title\":\"康德三大批判合集（注释版）\",\"author\":\"康德\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/96/yuewen_26392183/t6_yuewen_263921831724826980.jpg\",\"url\":\"https://weread.qq.com/web/reader/e0132f607192b677e018b46\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一部分 先验感性论\",\"date\":\"2020-04-27\"},{\"id\":\"815156:review:6166943_7gUe39fVV\",\"quote\":\"\",\"annotation\":\"疫情的剧本\\n\",\"date\":\"2020-04-27\",\"book\":{\"id\":\"815156\",\"title\":\"鼠疫\",\"author\":\"[法]加缪\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/2/YueWen_815156/t6_YueWen_815156.jpg\",\"url\":\"https://weread.qq.com/web/reader/d99322b05c7034d9957d680\",\"wordCount\":\"$undefined\"},\"bookReview\":true},{\"id\":\"910669:mark:910669_13_1052-1170\",\"quote\":\"事实上，这种烦恼是难以解决的，因为表示同情与不表示同情，都是足以引起烦恼的原因。倾向于被虐狂的人，一朝发觉一件厄运的故事被人相信时，会把这故事渲染得千真万确；而另外一方面，倘他发觉人家不相信时，他只是多得了一个例子，来证明人家对他的狠心\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_1397-1489\",\"quote\":\"然而人们一听到有什么不利于自己的闲话时，立刻要骇愕而且愤愤了。显而易见，他们从未想到，旁人的议论自己，正如自己的议论旁人。这骇愕愤懑的态度还是温和的，倘使夸张起来，就可引上被虐狂的路。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_1763-1981\",\"quote\":\"令我们有一种神奇的本领，能一目了然的看到彼此的思想，那末，我想第一个后果是：所有的友谊都将解体；可是第二个后果倒是妙不可言，因为独居无友的世界是受不了的，所以我们将学会彼此相悦，而无须造出幻想来蒙蔽自己，说我们并不以为彼此都有缺点￼\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_2230-2250\",\"quote\":\"过于看高自己的价值，常常是受虐狂的根子。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_2694-2740\",\"quote\":\"还有从事实上受到真正苦难的人，把自己的经验推广开去，终于认为他个人的不幸就是转捩干坤的关键。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_3028-3087\",\"quote\":\"另一种常见的被虐狂者，是某一等特殊的慈善家，永远违反着对方的意志而施惠于人，一旦发觉人家无情无义时，便骇愕而且悚然了。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_3567-3644\",\"quote\":\"一个政治家逐渐集中所有的精神力量，以便达到一个高尚的目标，他因之而摒弃安适，进入公共生活的领域，可是无情义的群众忽然翻过脸来攻击他了，那时他当然不胜其惊愕\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_3878-3987\",\"quote\":\"第一条是：记住你的动机并不常常象你意想中的那么舍己达人。第二条是：切勿把你自己的价值估得太高。第三条是：切勿期望人家对你的注意，象你注意自己一样关切。第四条是：勿以为多数的人在密切留神你，以致有何特殊的欲望要来迫害你。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_4057-4133\",\"quote\":\"这样的人常有一种幻象，以为世界或世界的一部是应该如何如何的；而他们觉得（有时准确地有时不准确地）在实现他们的幻象时，他们将使人类或其中的一部分得到恩惠。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\",\"annotation\":\"我不要你觉着，我要我觉着\"},{\"id\":\"910669:mark:910669_13_4233-4314\",\"quote\":\"何况他的信念往往不过是一种烟幕，隐藏在烟幕之下的，是他眼见自己力能左右大局而感到快慰。而在爱好权势之外，还加上另一项动机，就是虚荣心，那是在这等情形中大有作用的。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_432-466\",\"quote\":\"有些人妄想人家要杀害他们，禁锢他们，或对他们施行什么旁的严重的迫害。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_4676-4705\",\"quote\":\"所以一个人为了口福而饮食，要比饮食时单想着公众福利好得多。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_4800-4876\",\"quote\":\"凡是在敌人面前保卫妻儿的冲动，也当列入关切自己的动机之内。这种程度的利他主义，是人类正常天性之一部，但习俗道德所教训的那种程度却并不是，而且很少真正达到\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\",\"annotation\":\"道德往往对给人提出了过高的利他主义要求\"},{\"id\":\"910669:mark:910669_13_5134-5322\",\"quote\":\"历史上颇有怀才不遇的例子，但比起鱼目混珠的事实来不知要少几倍。假若一个人是时代不予承认的一个天才，那末他不管人家漠视而固执他的路线是对的。另一方面，假若他是没有才具而抱着虚荣心妄自尊大的人，那末他还是不坚持为妙。一个人如果自以为创造着不获赏识的杰作而苦恼，那是没有方法可以知道他究竟属于两者之中的那一种。属于前者的时候，你的固执是悲壮的；属于后者的时候，你的固执便是可笑的了。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_744-776\",\"quote\":\"这类人物善于花言巧语，很容易使相识不久的人对他们表示热烈的同情。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_13_858-938\",\"quote\":\"依照“大概”的原则，生在一个社会里的各式人物，一生中遇到虐害的次数大约是相仿的。假如一个人在一群人里面受到普遍的（照他自己所道）虐害，那末原因大概是在他自己身上\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"八 被虐狂\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_14_2804-2870\",\"quote\":\"公众舆论对那些显然惧怕它的人，总比对满不在乎的人更加横暴。狗对怕它的人，总比对不理不睬的人叫得更响，更想去咬他；人群也有同样的特点。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"九 畏惧舆论\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_14_3438-3579\",\"quote\":\"凡与自己集团中的习俗不和协的人，常倾向于锋芒外露，心神不安，缺少胸怀开朗的好心情。这些人一旦走到另一个集团，走到他们的观点并不被认为奇怪的派别中去时，他们的性格似乎完全改变了。他们能从严肃、羞怯、缄默，一变而为轻快和富有自信；能从顽强一变而为和顺易与；能从自我中心一变而为人尽可亲。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"九 畏惧舆论\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_14_3608-3669\",\"quote\":\"所以凡是与环境不融洽的青年，在就业的时候，当尽量选取一桩能有气味相投的伴侣可以遇到的事业，即使要因之而减少收入也在所不顾。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"九 畏惧舆论\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_14_4495-4584\",\"quote\":\"一种安慰人心的说法，说天才终归会打出他自己的路，许多人根据了这个原则便认为对青年英才的迫害，并不能产生多少弊害。但我们毫无应该接受这原则的论据。那种说数很象说凶手终必落网的理论。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"九 畏惧舆论\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_14_6458-6552\",\"quote\":\"只要这种畏惧相当强烈，就不能有何伟大的成就，也不能获得真正的幸福所必需的精神自由，因为幸福的要素是，我们的生活方式必渊源于我们自己的深邃的冲动，而非渊源于做我们邻居或亲戚的偶然的嗜好与欲念\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"九 畏惧舆论\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_15_684-751\",\"quote\":\"快乐虽有许多等级，大体上可以分成两类；那可以说是自然的快乐和幻想的快乐，或者说是禽兽的快乐和精神的快乐，或者说是心的快乐和头脑的快乐。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一〇 快乐还可能么？\",\"date\":\"2020-04-27\"},{\"id\":\"910669:mark:910669_15_6922-6959\",\"quote\":\"幸福的秘诀是：让你的兴趣尽量的扩大，让你对人对物的反应，尽量的倾向于友善。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"一〇 快乐还可能么？\",\"date\":\"2020-04-27\"},{\"id\":\"151277:mark:151277_2_0-16\",\"quote\":\"人生而自由，却又时时处在枷锁之中\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一卷的题旨\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_2_1132-1206\",\"quote\":\"亚里士多德也曾经说过，人根本不是天生平等的，有些人天生应该是做奴隶的，另一些人则天生是来统治别人的。 \\n    亚里士多德是对的，但是他颠倒了因果。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一卷的题旨\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_2_1338-1362\",\"quote\":\"强力导致了奴隶的出现，而怯懦则使他们永远当奴隶。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一卷的题旨\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_2_1608-1694\",\"quote\":\"即便是最强者也决不会强大到能永远做主人，除非他将自己的强力转化为权利，将服从转化为义务。由此就得到了最强者的权利。表面看来这种权利像是讥讽，但实际上它已被确定为一种原则了。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一卷的题旨\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_2_1932-1964\",\"quote\":\"既然最强者总是有理，剩下的就仅仅在于怎样做才能使自己成为最强者。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一卷的题旨\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_2_224-271\",\"quote\":\"社会秩序是一项为其他一切权利提供基础的神圣权利。但是这项权利是建立在契约之上的，而绝非出于自然\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一卷的题旨\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_2_2280-2321\",\"quote\":\"强力并不意味着权利，而只有合法的权力才能产生义务。这样，就要回到我的原始问题上来。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一卷的题旨\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_2_328-350\",\"quote\":\"家庭是一切社会中最古老而又唯一自然形成的社会\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一卷的题旨\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_2_394-466\",\"quote\":\"在孩子解除了对父亲服从的义务，父亲解除了对孩子照顾的义务之后，双方就恢复了同等的独立的状态。如果这时他们继续生活在一起，那就是自愿的而非自然的了\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一卷的题旨\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_2_507-585\",\"quote\":\"人性首要的法则是要维护自身的生存，人性首要的关怀是对自身的关怀，而且，一个人一旦达到了理智的年龄，能够自行判断维护自己生存的适当方法时，他就成为了自己的主人\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一卷的题旨\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_3_1374-1392\",\"quote\":\"构成战争的，是物的关系而非人的关系。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_3_1629-1656\",\"quote\":\"战争是国与国之间的一种关系，而绝非人与人之间的一种关系\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_3_165-226\",\"quote\":\"但一个人使自己成为另一个人的奴隶并非是奉送自己，他是在出卖自己，至少也是为了自己能活下去。那么全体人民为什么要出卖自己呢？\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_3_1658-1731\",\"quote\":\"战争中，个人与个人绝非以人的身份，甚至也不是以公民的身份，而仅仅是以士兵的身份才偶然成为仇敌的；他们只是作为国家的保卫者，而绝不是作为国家的成员。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_3_1965-2052\",\"quote\":\"既然战争的目的是摧毁敌国，只要手中有武器，人们就有权杀死对方的保卫者。但是一旦他们投降，不再是敌人或敌人的工具之时，他们就重新成为单纯的个人，而别人也就不再对他们有生杀之权。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_3_2080-2103\",\"quote\":\"战争绝对无法产生不是战争的目的所必需的任何权利\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_3_2185-2240\",\"quote\":\"假如战争根本就没有赋予征服者屠杀俘虏的权利，那么，这种他并不具有的权利，就无法成为他奴役被征服者的权利的基础。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\",\"annotation\":\"杀降非法，所以通过战争并不能获得杀死俘虏的权利，更没有拿这种不存在的权利剥来夺俘虏自由的可能\"},{\"id\":\"151277:mark:151277_3_2390-2486\",\"quote\":\"我也认为一个由战争造成的奴隶或是一族被征服的人民，对其主人除了被迫服从以外，完全没有任何义务。征服者既然已经剥夺了他生命的等价物，那么对他就根本没什么恩德可言，征服者就从毫无所得变成了有利可图\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_3_2701-2785\",\"quote\":\"无论是个人之间，还是个人对全社会，下列说法都毫无意义：“我同你订立一个约定，这个约定中的负担完全归你而利益完全归我；只要我高兴，我就守约，并且只要我高兴，你也得守约。”\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_3_287-337\",\"quote\":\"难道臣民在奉送自己人身自由之时，还以国王攫取他们的财产作为条件吗？我看不出他们还保存了什么东西了。 \",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_3_604-641\",\"quote\":\"说全国人民都这样做，就是在假设举国人民皆疯狂了，而疯狂是无法形成权利的。 \",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_3_670-712\",\"quote\":\"孩子们生来就是自由的，他们的自由属于自己，除了他们自己以外，任何人无权对他们进行处置\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论奴隶制\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_4_506-541\",\"quote\":\"多数表决的规则本身就是一种约定的确立，并且至少有过一次全体一致的同意。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论总需追溯到一个最初的约定\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_5_118-208\",\"quote\":\"人类既然无法产生新的力量，而仅能结合并运用已有的力量，那么人类便没有其他的生存办法，只有集合起来形成一种合力才得以克服这种阻力，通过一个唯一的动力将他们发动起来，使他们协同合作。 \",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论社会公约\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_5_318-414\",\"quote\":\"    “要找到一种结合的形式，使它能够充分运用合力来护卫和保障每个参与者的人身以及财富，且这一结合中的每个与全体相联合的人都是自己的主人，同以往一样自由。”这就是社会契约要解决的根本问题。 \",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论社会公约\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_5_503-575\",\"quote\":\"一旦这个社会公约遭到破坏，每个人就立即恢复了他原来所有的权利，并且在他丧失约定的自由之时，就又重新得到了他为了约定的自由所放弃的自己的自然自由。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论社会公约\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_5_598-621\",\"quote\":\"每一个参与者和他自身的一切权利全部都转让给集体\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论社会公约\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_5_745-822\",\"quote\":\"如果个人保留了某些权利，但是个人与集体之间无法再有任何共同的权威来进行裁决，而在某些事情上每一个人又都是自己的裁判者，那么有些人很快就会要求事事都要如此。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论社会公约\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_5_897-959\",\"quote\":\"既然人们从任何一个成员那里都能够获得自己放弃给集体的权利，那么人们也就获得了自己所失去的一切以及更大的力量来保全自己的所有。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论社会公约\",\"date\":\"2020-04-26\",\"annotation\":\"对集体奉献一切，以从集体中获得保护自己的权利\"},{\"id\":\"151277:mark:151277_5_993-1061\",\"quote\":\"社会公约可以简化地表述为：我们每一个人都把自身及其全部的力量置于公共意愿的最高指导之下，而且我们视每一个成员为全体的不可分割的一部分。 \",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论社会公约\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_6_1234-1273\",\"quote\":\"人们要迫使他自由，因为这就是要让每个公民都有祖国，从而保证他能够无须依附别人。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论主权者\",\"date\":\"2020-04-26\",\"annotation\":\"自由是一种权利，也是一种义务\"},{\"id\":\"151277:mark:151277_6_340-381\",\"quote\":\"，没有而且也不可能有任何一种根本法律能够约束人民共同体，即使是社会契约本身也不能。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论主权者\",\"date\":\"2020-04-26\",\"annotation\":\"？？？\"},{\"id\":\"151277:mark:151277_6_441-505\",\"quote\":\"政治共同体或者主权者，既然其存在就只是由于契约的神圣性，那么就绝不能使自己担负任何能够损害这一原始行为的义务，即使是对外也不能，\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论主权者\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_6_584-643\",\"quote\":\"一旦人群结成了一个共同体，侵犯其中的任何一个成员就被看做是在侵犯整个共同体，而侵犯共同体就更加使得共同体成员同仇敌忾。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论主权者\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_6_61-96\",\"quote\":\"对个人来说，他是主权者的一个成员；而对主权者来说，他是国家的一个成员。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论主权者\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_6_710-757\",\"quote\":\"既然主权者只能由组成主权者的每个人构成，那么主权者就没有而且也不能有与他们的利益相反的其他利益\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论主权者\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_7_0-140\",\"quote\":\"从自然状态进入社会状态，人类就经历了一场最令人瞩目的变化。在他们的行为之中正义取代了本能，因而他们的行动也被赋予了前所未有的道德性。只有在义务的呼声代替了生理的冲动，权利代替了嗜欲之时，此前自私的人类才发现自己不得不依据另外的原则行事，并且先得请教自己的理性，才能听从自己的欲望。\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论社会状态\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_7_361-436\",\"quote\":\"人类由于社会契约而丧失的东西是他的自然自由和对他想要的以及所能得到的一切东西的那种无限的权利，而他所获得的，是社会的自由和对他所享有的一切东西的所有权\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论社会状态\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_7_437-539\",\"quote\":\"为了不至于在权衡得失之时发生错误，我们必须较好地区分只以个人力量为标志的自然的自由和被公共意愿约束的社会的自由，并要区分只是由于强力的结果或是最先占有而形成的享有权，和只能依据正式的权利来获得的所有权。 \",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论社会状态\",\"date\":\"2020-04-26\"},{\"id\":\"151277:mark:151277_7_549-633\",\"quote\":\"我们还应在社会状态的优势栏内加上道德的自由，正是道德的自由才使人类真正成为自己的主人。因为如果仅仅只有欲望的冲动那就是奴隶状态，而只有服从人们为自己制定的法律，才是自由\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"},\"chapter\":\"论社会状态\",\"date\":\"2020-04-26\",\"annotation\":\"社会的自由需要自律来维持\"},{\"id\":\"151277:review:6166943_7gTRMPT6w\",\"quote\":\"那绝对的、天然独立的生存，可以让他将自己对于公共事业的义务看成是一种无偿的贡献，而抛弃义务对别人的危害则会远远小于因履行义务而给自己造成的负担。\",\"annotation\":\"勿以恶小而为之\",\"chapter\":\"论主权者\",\"date\":\"2020-04-26\",\"book\":{\"id\":\"151277\",\"title\":\"社会契约论\",\"author\":\"[法]卢梭\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/89/YueWen_151277/t6_YueWen_151277.jpg\",\"url\":\"https://weread.qq.com/web/reader/ef8324d0524eedef870b3e1\",\"wordCount\":\"$undefined\"}},{\"id\":\"422133:mark:422133_5_3395-3457\",\"quote\":\"任何大学里的数学系在所有的系中都是保密程度最低的，因为那里没有属于专利的发明。数学界为自己能坦率和自由地交流思想而感到自豪。\",\"book\":{\"id\":\"422133\",\"title\":\"费马大定理：一个困惑了世间智者358年的谜\",\"author\":\"西蒙·辛格\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/yuewen_422133/t6_yuewen_4221331719982892.jpg\",\"url\":\"https://weread.qq.com/web/reader/816329705670f581606cee7\",\"wordCount\":\"$undefined\"},\"chapter\":\"第一章 “我想我就在这里结束”\",\"date\":\"2020-04-26\"},{\"id\":\"910669:mark:910669_12_4758-4807\",\"quote\":\"大半人士把童年的迷信在表面上丢开以后，认为大功已经告成。他们并没觉察，这些迷信仍旧潜伏在下意识界。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-26\"},{\"id\":\"910669:mark:910669_12_5192-5237\",\"quote\":\"以事实论，犯罪意识非但不能促成良好的生活，抑且获致相反的结果。它令人不快乐，令人自惭形秽。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-26\"},{\"id\":\"910669:mark:910669_12_5276-5329\",\"quote\":\"为了自惭形秽，他对优越的人心怀怨恨。他将发觉嫉妒很容易，佩服很困难。他将变成一般地不受欢迎的人，越来越孤独\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-26\"},{\"id\":\"910669:mark:910669_12_5656-5726\",\"quote\":\"我不劝一个人独坐一隅，每天作一小时反省功夫。我认为这绝不是好方法，它只能增加自我沉溺，而这又是应当治疗的病症；因为和谐的人格是应该向外发展的\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-26\"},{\"id\":\"910669:mark:910669_12_5734-5793\",\"quote\":\"一个人对于他合理的信念，应立志坚决永远不让那不合理的相反的信念侵入而不加扑灭，或让它控制自己，不管控制的时间如何短暂。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-26\",\"annotation\":\"敬而远之\"},{\"id\":\"910669:mark:910669_12_6340-6448\",\"quote\":\"也无须害怕，说在使自己变得合理的时候，生活就会变得暗淡无聊。相反，唯其因为“合理”是存在于内心的和谐之上，所以到达这个境界的人，在对世界的观照上，在完成外界目标的精力运用上，比起永远被内心的争执困扰的人来，要自由得多\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-26\"},{\"id\":\"910669:mark:910669_12_6449-6480\",\"quote\":\"最无聊的莫过于幽囚在自身之内，最欢畅的莫过于对外的注意和努力。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-26\"},{\"id\":\"910669:mark:910669_12_6551-6663\",\"quote\":\"为那些从未受伪道德的训练而养成主观心情的人，理性可以无须。但为那些得了病的人，在治疗上理性是必不可少的。而得病也许是精神发展上一个免不了的阶段。我想，凡是借理性之力而度过了这一关的人，当比从未害病也从未受过治疗的人高出一级。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-26\"},{\"id\":\"910669:mark:910669_12_6763-6808\",\"quote\":\"在他心中，任何热情都是麻醉，而且因为他不能设想基本的幸福，他觉得唯有借麻醉之力才能解除苦恼\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-26\"},{\"id\":\"910669:mark:910669_12_6901-6967\",\"quote\":\"需要靠无论何种的麻醉来获致的幸福是假的，不能令人满足的。我们的官能必须全部活跃，对世界必须有最完满的认识，方能有真正令人快慰的幸福。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-26\"},{\"id\":\"910669:mark:910669_11_4608-4649\",\"quote\":\"我不以为任何孔雀会嫉妒别只孔雀的尾巴，因为每只孔雀都以为自己的尾巴是世界上最美的。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"六 嫉妒\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_11_5299-5415\",\"quote\":\"在社会阶级固定的时代，在大家相信贫富的分野是上帝安排的时代，最低微的阶级绝不嫉妒上面的各阶级。乞丐不嫉妒百万富翁，虽然他们一定嫉妒比自己收获更多的别的乞丐。近代社会情势的不稳定，民主主义与社会主义的平等学说，大大地扩大了嫉妒的界限。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"六 嫉妒\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_11_5904-5944\",\"quote\":\"一个人觉得不胜任份内之事的时光，便一肚子的不如意，非常容易对工作较轻的人发生妒忌\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"六 嫉妒\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_11_6106-6145\",\"quote\":\"上文提及的女人，怀着妒意去注视一切衣服丽都的女人，一定在本能生活上是不快乐的。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"六 嫉妒\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_11_6236-6306\",\"quote\":\"前，人们不过妒忌邻居，因为对于旁的人们很少知道。现在，靠了教育和印刷品，他们抽象地知道很多广大阶级的人类之事，实际他们连其中的一个都不曾认识\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"六 嫉妒\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_11_6456-6558\",\"quote\":\"近代文明所造成的人类的心，根本偏向于仇恨而不偏向友善。它的偏向仇恨，是因为它不满足，因为它深切地，或竟无意识地觉得它多少失去了人生的意义，觉得也许旁的人倒保有着“自然”给人享受的美妙事物，而我们却独抱向隅\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"六 嫉妒\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_1023-1069\",\"quote\":\"是指可称为“体面的”罪人，例如在紧急关头挪用公款的银行行长，或被情欲诱入什么性的邪恶的教士。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_1153-1175\",\"quote\":\"和这种感觉密切关连的是害怕成为社会的放逐者。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_1308-1419\",\"quote\":\"；但是承认社会的道德而再作违背道德之事的人，一失掉自己的品级[插图]，就将大为苦闷了\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_1650-1747\",\"quote\":\"他多少怀着怅惘悔恨的心思，承认圣者的角色轮不到自己；的确，他对圣贤的观念，是日常生活中几乎办不到的那一种。所以他一生离不了犯罪感觉，觉得自己不配列入上品，极度忏悔的时间才是他生命中最高洁的时间。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_1930-1971\",\"quote\":\"受母亲或保姆亲热的对待，是他生命中最大的乐趣；而这乐趣唯有他不触犯道德律时方能获得\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_2011-2085\",\"quote\":\"他一边长大，一边忘记了他道德律的来处，忘记了当初违反道德律时所受的惩罚究竟为何物，但他并不把道德律丢掉，且继续感到倘使触犯它，便会发生一些可怕的祸事\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_2397-2446\",\"quote\":\"日常道德中的这个禁欲成分，差不多已变成了下意识，但它在各方面都发生作用，使我们的道德律变为不合理？\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_2558-2606\",\"quote\":\"我不否认世界上谎言太多，也不否认增加真理可使我们善良得多，但我的确否认撒谎在任何情势之下都不足取\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_2824-2986\",\"quote\":\"加强这个感觉的，当然还有奥地帕斯症结[插图]，因为在童时最爱的女人，是不可能与之有性的自由的女人。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_2989-3107\",\"quote\":\"许多成年的男子觉得女人都因了性而失掉身分，他们只尊敬憎厌性交的妻子。但有着冷淡的妻子的丈夫，势必被本能驱使到旁的地方地寻找本能的满足。然而即使他暂时满足了本能，他仍不免受犯罪意识的毒害，以致同任何女子（不问在婚姻以内或以外）都不觉快乐。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_3589-3627\",\"quote\":\"当清明的意志被疲劳、疾病、饮料、或任何旁的原因削弱时，犯罪意识特别占着优势。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_456-489\",\"quote\":\"成人生活的不快乐有许多潜在的心理原因，而犯罪意识是其中最重要的一个\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"910669:mark:910669_12_880-913\",\"quote\":\"良心这个名词，实在包括好几种不同的感觉；最简单的一种是害怕被人发觉\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"七 犯罪意识\",\"date\":\"2020-04-25\"},{\"id\":\"932993:mark:932993_6_15075-15106\",\"quote\":\"他说政治“是一个人为了隐藏他之所是和他自己的无知而做的事情”。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_6_15305-15344\",\"quote\":\"所有其他问题的提出和回答必须在这个确定的限度之内:真实于自己是不容违背的责任。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_6_16470-16510\",\"quote\":\"维特根斯坦日后对“自我(self)”的哲学思考很大一部分是为了扑灭唯我论的幽灵。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_6_17173-17255\",\"quote\":\"实际上,维特根斯坦本人开始羞耻于自己不敢自杀,羞耻于自己不直面一个背后的声音:自己在世界里是多余的。这种感觉持续了九年,直到伯特兰·罗素确信他有哲学天才后才得以克服\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_6_20059-20125\",\"quote\":\"犹太人“浸透了女性气质”——“最男性化的犹太人也比最不男性化的雅利安人更女性化”。跟女人一样,犹太人具有配对的强大本能\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_6_20359-20431\",\"quote\":\"魏宁格本人既是犹太人又是同性恋(因而有可能是心理上的女性类型);这种想法——他的自杀是某种“解决”——容易被吸收到最粗俗的反犹或反女性的态度中去\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_6_20500-20580\",\"quote\":\"在世纪之交的维也纳,对女人解放的恐惧、尤其对犹太人解放的恐惧是人们普遍关心的事;这一点无疑在某种程度上解释了此书的风行。日后它将为纳粹的宣传广播提供便利的材料。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_6_20988-21164\",\"quote\":\"根据魏宁格,和女人不同,男人可以选择:他能、也必须——在雄性和雌性之间、在有意识和无意识之间、在意志和冲动之间、在爱和性欲之间——作出选择。选择这几个对子中的前者是每个男人的伦理责任,他能做到多大程度,就意味着在多大程度上逼近男人的最高类型:天才。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_6_21760-21825\",\"quote\":\"爱和性欲不止不是一回事,它们是互相对立的。这就是为什么婚后之爱的观念是虚伪的。性的吸引随身体的接近而增加,爱则在爱人缺席时最强。真\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_6_23447-23533\",\"quote\":\"赫兹在《力学原理》里处理的问题是如何理解牛顿物理学用到的神秘概念“力”。赫兹提出,面对这个问题,不应该直接回答“什么是力”,而应该不拿“力”当基本概念而重新表述牛顿的物理学\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_6_24711-24806\",\"quote\":\"这是一个各种兴趣和义务相互竞争的时期。对父亲的责任感迫使维特根斯坦坚持学习工程,而且他对一门还年轻的科学(航空学)产生了兴趣。但他日益发觉,哲学问题——几乎违背自己的意志——紧紧抓住了自己。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_6_25021-25075\",\"quote\":\"但长远来看,他可能已经清楚,唯一值得过的生活是实现他负有的更大责任的生活:对自己的责任——对自己天才的责任。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_7_2012-2084\",\"quote\":\"学校并不认为维特根斯坦是为获得学位而工作,而是认为他将从事自己的研究,大学的实验设施可供他使用,要是引起了教授们的关注,他需要的话亦可加以利用。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第二章 曼彻斯特\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_7_2412-2493\",\"quote\":\"他对纯数学生出了兴趣,开始听J.E.李特尔伍德的数学分析理论课;每周有一个晚上,他还跟另两个研究生一起讨论数学问题。这些讨论引得他去思考为数学提供逻辑基础的问题,\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第二章 曼彻斯特\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_7_2944-3038\",\"quote\":\"《数学原则》的中心论题是:跟康德和其他多数哲学家的观点相反,能够从少量基本的、逻辑的原则导出全部纯数学。换句话说,数学和逻辑是同一回事。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第二章 曼彻斯特\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_7_3336-3439\",\"quote\":\"两种观点间的差别:一种观点认为数学是一套确定的、客观的知识,另一种认为数学根本上是人类心灵的主体建构。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第二章 曼彻斯特\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_7_4045-4232\",\"quote\":\"即一个类,即此概念的外延。罗素发现,经由一串特定的推理,这公理导致一个矛盾。因为给定上述前提,那么,某些类属于自身,某些则不是:所有类的类自身也是一个类,所以就属于自身;男人的类自身不是一个男人,所以不属于自身。由此就构造出了“所有不属于自身的类的类”。现在我们问:这个类是不是自身的一个成员?无论回答是或否,都导致矛盾。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第二章 曼彻斯特\",\"date\":\"2020-04-21\",\"annotation\":\"理发师悖论\"},{\"id\":\"932993:mark:932993_7_4798-4856\",\"quote\":\"此困难的完全解决会是什么,我尚未成功地发现;但因其损害了推理的最终基础,我诚挚地提请每一个逻辑学学生注意对之的研究。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第二章 曼彻斯特\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_7_5489-5568\",\"quote\":\"据维特根斯坦的姐姐赫尔米勒说,由于当时对数学哲学的着迷,他受尽了两种冲突的召唤产生的撕扯感的折磨。乔丹对他的“解决”的驳回可能使他服了气,暂时坚持从事航空学。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第二章 曼彻斯特\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_7_5616-5652\",\"quote\":\"虽然他对哲学问题有足够的感受力,但仍然有待某个人使他相信自己有哲学天分。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第二章 曼彻斯特\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_7_5990-6030\",\"quote\":\"他对自己不得不投身于工程工作的总体性烦躁,其程度由于这差事要求精度的本性而增强了\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第二章 曼彻斯特\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_10149-10157\",\"quote\":\"责任和冲动的冲突\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_10235-10276\",\"quote\":\"罗素的鼓励之所以是必需的,恰是因为他能由此而克服这怀疑,快乐地听从自己最强烈的冲动\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_10879-10950\",\"quote\":\"他隐含的意思是,如果一个人最强烈的冲动是作曲,而且如果完全沉溺于这冲动能够写出崇高的音乐,那么他不只有权听从冲动而行动,他还背负着这么做的责任\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_12129-12163\",\"quote\":\"哲学是一位不情愿的女士——只有激情之手握住的冰冷的剑,才能触到她的心\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_1233-1409\",\"quote\":\"《数学原理》之后他的第一本著作是《哲学问题》,即他的“廉价小说”[插图];这本书是他的许多通俗作品中的第一本,也首次显现出他清晰地表述艰深思想的卓越天赋。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_14722-14753\",\"quote\":\"由于其音乐感受力和安静的性情,品生特是维特根斯坦的一个理想伙伴\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_2090-2110\",\"quote\":\"你叫做上帝的东西正是我叫做无限的东西。”\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\",\"annotation\":\"对我来说，叫英菲尼迪\"},{\"id\":\"932993:mark:932993_8_3880-3938\",\"quote\":\"我的德国工程师很爱争辩,很烦人。他不肯承认,这屋子里确确实实没有一头犀牛……[他]又回来了,我换衣服时他一直在争辩。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_4510-4557\",\"quote\":\"对维特根斯坦来说问题是形而上的而非经验的,关系到的是何种东西组成了世界,而非一只犀牛在此与否。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_4601-4618\",\"quote\":\"世界是事实的总和,而非物的总和。”\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_4951-4984\",\"quote\":\"他有钱,对哲学有强烈的兴趣,但他认为,除非他还不错,否则不应当献身\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_5359-5483\",\"quote\":\"维特根斯坦后来告诉大卫·品生特,罗素的鼓励使他确定得以获救,并结束了他九年的孤独和痛苦,在那九年里他不断地想到自杀。由于罗素的鼓励,他能够最终放弃了工程学,扫除了“那个背后的声音:他在这世界里是多余的”——这个声音以前令他为自己没有自杀而感到羞耻。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_6269-6316\",\"quote\":\"维特根斯坦的工作从一开始针对的就不是“什么是数学”这个问题,而是更加基本的问题:“什么是逻辑”\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_7551-7607\",\"quote\":\"罗素的赞美是无止境的。他在维特根斯坦身上看到了“完美的学生”,这种学生“用强烈且非常聪明的异议表达热烈的钦佩”。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_7855-7910\",\"quote\":\"“这是罕见的激情,发现它是快乐的事。”甚至“他对哲学具有比我更多的激情;他的是雪崩,相形之下的我似乎只是雪球”\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_8078-8157\",\"quote\":\"他的性情是艺术家式的,直觉的,喜怒无常的。他说自己每个早晨怀着希望开始工作,每个夜晚结束工作时却伴着绝望——当他不能理解事物时,他生出的正是我生出的那种愤怒。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"932993:mark:932993_8_9225-9432\",\"quote\":\"他辩护的是一种基于忠实[插图]、基于真实面对自己及自己的冲动的道德——一种来自于自我内部的道德,而非规则、原则和责任从外部强加的道德。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第三章 罗素的爱徒\",\"date\":\"2020-04-21\"},{\"id\":\"910669:mark:910669_10_2857-2959\",\"quote\":\"。在现代生活里成为重要的一种疲倦，总是属于情绪方面的；纯粹的智力疲惫，如纯粹的肌肉疲惫一样，可因睡眠而获救济。无论哪一个劳心者，倘他的工作不涉感情（譬如计算工作），那末每夜的睡眠总可把每天的疲劳一扫而尽。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-20\"},{\"id\":\"910669:mark:910669_10_3033-3063\",\"quote\":\"神经衰败的前兆之一，是相信自己的工作重要无比，一休息就要闯祸\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-20\"},{\"id\":\"910669:mark:910669_10_3273-3290\",\"quote\":\"使人心力崩溃的是情绪的骚乱而非工作\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-20\"},{\"id\":\"910669:mark:910669_10_3439-3473\",\"quote\":\"而当一桩烦恼是很严重的时候，凡是不能深入到意识之下的方法就决无用处。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-20\"},{\"id\":\"910669:mark:910669_10_4338-4368\",\"quote\":\"恐惧之来，以为害最大的形式来说，是因为有些我们不愿正视的危险\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-20\",\"annotation\":\"奥利给!\"},{\"id\":\"910669:mark:910669_10_4890-4918\",\"quote\":\"一个勇敢的女子假如愿意男人们爱她，就得把她的勇敢藏起来。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-20\"},{\"id\":\"910669:mark:910669_10_5142-5205\",\"quote\":\"疲劳的来源，往往由于太爱兴奋。一个人倘能用睡眠来消磨余暇，就可保持身体康健，但他的工作时间是乏味的，所以需要在自由时间寻些快活\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-20\"},{\"id\":\"910669:mark:910669_10_5579-5642\",\"quote\":\"然而我们不难觉察，兴奋的欢娱不是一条幸福之路；虽是在更可满意的欢乐不得到手的时候，一个人总觉得除非乞灵于刺激，生活简直难以挨受\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-20\"},{\"id\":\"910669:mark:910669_10_5833-5867\",\"quote\":\"神经疲惫的最恶劣的现象之一，是它仿佛在一个人与外界之间挂了一重帘幕。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-20\"},{\"id\":\"910669:mark:910669_10_5983-5998\",\"quote\":\"，实在都是和大地失去接触的惩罚\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-20\"},{\"id\":\"932993:mark:932993_6_13027-13054\",\"quote\":\"他坚持用礼貌的“您”称呼他们,结果只是让自己更为疏离。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-20\"},{\"id\":\"932993:mark:932993_6_13758-13950\",\"quote\":\"她是弗洛伊德的早期拥护者,接受过弗洛伊德对她的精神分析。后来她成了弗洛伊德的好朋友,合并￼后当弗洛伊德逃离纳粹之手时(他的逃离迟得很凶险)她助了一臂之力。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-20\"},{\"id\":\"932993:mark:932993_6_14512-14536\",\"quote\":\"克劳斯主张,犹太人的自由只能从完全的同化中得来。\",\"book\":{\"id\":\"932993\",\"title\":\"维特根斯坦传：天才之为责任\",\"author\":\"瑞·蒙克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/67/YueWen_932993/t6_YueWen_932993.jpg\",\"url\":\"https://weread.qq.com/web/reader/0ea320005e3c810ea1cf0c4\",\"wordCount\":428508},\"chapter\":\"第一章 自我毁灭的试验场\",\"date\":\"2020-04-20\"},{\"id\":\"910669:mark:910669_10_1375-1433\",\"quote\":\"这一切的结果是，等到完满的成功来到时，一个人的神经早已支离破碎，长时间的惯于操心，使他在无需操心时仍旧摆脱不掉那习惯\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_10_1660-1730\",\"quote\":\"让我们来谈谈为了谋生而疲乏的比较普遍的情形罢。在这等情形内，疲劳大部分是由烦恼而来，而烦恼是可用较为高明的人生哲学和较多的精神纪律来免除的。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_10_1929-1978\",\"quote\":\"。一个明哲之士，只在有目的时才思索他的烦恼；在旁的时候，他想着旁的事情；倘使在夜里，他就什么都不想\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_10_2078-2134\",\"quote\":\"在适当的时间思索一件事情，而不在任何时间胡思乱想：培养这么一副有秩序的头脑，对于幸福与效率两者都能有惊人的作用。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_10_2288-2373\",\"quote\":\"我曾有一时作着无数的公共演讲；最初，每一场听众都令我害怕，慌张的心绪使我讲得很坏；对此窘境的惧怕，竟使我老是希望在讲演之前遇到什么意外，讲过以后我又因神经紧张而疲倦不堪。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_10_2373-2455\",\"quote\":\"慢慢地，我教自己觉得我演讲的好坏根本无足重轻，宇宙决不因我演说的优劣而有所改变。于是我发觉，越是不在乎讲得好或坏，我越是讲得不坏，神经紧张慢慢减退，几乎完全没有了。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_10_820-843\",\"quote\":\"要在现代生活中逃避神经的疲惫，是一件极难的事。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"五 疲劳\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_9_3905-3921\",\"quote\":\"忍受单调生活的能力，应该自幼培养\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"四 烦闷与兴奋\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_9_4145-4232\",\"quote\":\"太多的旅行，太多复杂的印象，不适宜于青年人，徒然使他们长大起来不耐寂寞，殊不知唯寂寞才能生产果实。我不说寂寞本身有何优点；我只说某些美妙的事物，没有相当的寂寞单调就不能享受。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"四 烦闷与兴奋\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_9_4335-4407\",\"quote\":\"但若过着一种心思散漫，纵情佚乐的生活，一个青年人的头脑里就难于孕育有建设性的目标；因为在此情形中，他的念头所贯注的将是未来的欢娱，而非遥远的成就\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"四 烦闷与兴奋\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_9_4968-5036\",\"quote\":\"凡使我们接触大地生活的游戏，本身就有令人深感快慰的成分；它们停止时，带来的快乐并不跟着消灭，虽然它们存在时，快乐之强烈不及更为兴奋的行乐\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"四 烦闷与兴奋\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_9_5344-5375\",\"quote\":\"现代都市居民所感受的特殊的烦闷，即和脱离自然生活有着密切的关系\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"四 烦闷与兴奋\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_9_5454-5521\",\"quote\":\"。为了逃避那富有建设性的烦闷，他们反而堕入另一种更可怕的烦闷。幸福的生活，大半有赖于恬静，因为唯有在恬静的空气中，真正的欢乐才能常住。\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"四 烦闷与兴奋\",\"date\":\"2020-04-19\"},{\"id\":\"910669:mark:910669_9_649-754\",\"quote\":\"。烦闷的特色之一，是眼前摆着“现状”，想象里又盘旋着“另外一些更愉快的情状”，两者之间形成一个对照。烦闷的另一要素，是一个人的官能必不专注于一事一物。从要你性命的敌人那里逃跑，我想当然是不愉快的，但决不令人纳闷\",\"book\":{\"id\":\"910669\",\"title\":\"幸福之路\",\"author\":\"[英]罗素\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/73/YueWen_910669/t6_YueWen_910669.jpg\",\"url\":\"https://weread.qq.com/web/reader/e1b32ad05de54de1bcb2dab\",\"wordCount\":91250},\"chapter\":\"四 烦闷与兴奋\",\"date\":\"2020-04-19\"},{\"id\":\"26785321:mark:26785321_109_1823-1873\",\"quote\":\"维特根斯坦给出的建议是“不要想，而要看”，一旦我们睁开眼睛看，而不是像哲学家那样闭着眼睛去解释自然（\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_2028-2104\",\"quote\":\"总之，当你放弃想、专注看的时候，就会看到游戏的复杂多变性，它们之间没有“共同之处”，但有“相似之处”，这些“相似之处”就像是一张“盘根错节的复杂网络”。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_2157-2237\",\"quote\":\"我想不出比‘家族相似’更好的说法来表达这些相似性的特征；因为家族成员之间的各式各样的相似性就是这样盘根错节的：身材、面相、眼睛的颜色、步态、脾性，等等，等等。”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_2523-2606\",\"quote\":\"巴门尼德关心“一切是一”的那个“一”，维特根斯坦却想要教会我们差异；赫拉克利特说“隐蔽的关联比明显的关联更为牢固”，维特根斯坦则说：“我们对隐藏起来的东西不感兴趣”。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_2899-3022\",\"quote\":\"第一，按照家族相似性的思路，游戏和工具就是边缘模糊的概念，这样一来，它们还是有意义的概念吗？第二，共相理论、本质主义真的彻底错了吗？难道我们不可以借助科学的方法去寻找“共相”和“本质”吗？\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_3694-3758\",\"quote\":\"从麦粒到麦堆，从头发稀疏到秃子，没有一个确定的标准，也找不到一个清晰的分界线，但这并不意味着麦堆和秃子这类模糊的概念就不是概念。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_3801-3869\",\"quote\":\"相反，如果我们将秃子严格定义为头发只剩下一万根，或者头发覆盖面积少于原有面积的三分之一，我们反而不会使用秃子这个语词了，难道不是这样吗？\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_4038-4063\",\"quote\":\"并不是概念越清晰，逻辑越严格，句子的意义就越明确。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_4892-4927\",\"quote\":\"我们觉得，即使一切可能的科学问题都已得到解答，人生问题也还完全未被触及\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_5757-5784\",\"quote\":\"。哲学是针对借助我们的语言来蛊惑我们的智性所做的斗争。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_5994-6025\",\"quote\":\"哲学“不用任何方式干涉语言的实际用法”，“它让一切如其所是”。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_1020-1069\",\"quote\":\"哲学家与诡辩家的最大差异在于，诡辩家通过转换要点来拒绝理解，而哲学家则试图通过统领要点来达成理解。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_1589-1633\",\"quote\":\"对维特根斯坦来说，能够改变看特定事物时的面相，是拥有理解能力并且最终达成理解的关键所在。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_2379-2503\",\"quote\":\"什么叫作“集合整理我们已经知道的东西”？还是以兔鸭图为例，无论你把那张图看成兔子还是看成鸭子，图本身并没有发生改变，它如其所是地放在那里，你没有在图上添加一笔一画，你只是通过面相的转换，也就是集合和整理我们已经知道的东西，然后你就看见了不同的对象。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_2754-2830\",\"quote\":\"打个比方，就像你一个猛子扎进水里，不断地下潜，最终会遭遇河床，同理，在解释的过程中我们也会遭遇“思想的河床”，或者用维特根斯坦最常用的概念——生活形式。\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_3590-3699\",\"quote\":\"维特根斯坦说：“任何解释都像它所解释的东西一样悬在空中，不能为它提供支撑。”那么到底什么才能提供支撑呢？当然就是规则本身，就是生活形式本身。在维特根斯坦看来，“遵守规则是一种实践，以为[自己]在遵守规则并不是遵守规则”\",\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"wordCount\":439343},\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_4685-4767\",\"quote\":\"“我们对某些事情不理解的一个主要根源是我们不能综观语词用法的全貌”，为什么综观语词用法的全貌如此重要？因为综观可以“居间促成理解，而理解恰恰在于，我们‘看到联系’”\",\"b
