61bc8367e.js\"],\"default\"]\n1a:T9fb,"])</script><script>self.__next_f.push([1,"Prompts:\n\nPresent an exquisite, miniature 3D cartoon-style scene of {User Input: Museum Name}, clearly viewed from a 45° top-down perspective.\n\n​Central Architecture:\n\nPlace the museum's most absolutely recognizable architectural landmark (e.g., the Glass Pyramid for the Louvre, the Greek Revival facade for the British Museum, or the Winter Palace for the Hermitage) prominently at the center. The architectural style must be distinct and accurate to the institution.\n\n​Exclusive Collection Elements (Replace Generic Items):\n\nStrictly minimize generic travel clichés (such as tour buses, cameras, or generic tickets). Instead, surround the central building with high-fidelity, miniature replicas of the museum's most precious collections:\n\n​Iconic Antiquities \u0026 Artifacts: Scattered around are detailed models of specific historical treasures housed within this museum (e.g., the Rosetta Stone, Egyptian Sarcophagi, ancient pottery, royal jewelry, or samurai armor).\n\n​Masterpiece Sculptures: Represent the museum's famous three-dimensional art NOT as living characters, but strictly as miniature marble statues, bronze busts, or stone carvings (e.g., The Thinker, Venus de Milo, or Discobolus) positioned artistically around the base.\n\n​Fine Art Highlights: Distinct, recognizable miniature framed oil paintings or tapestries that are the \"crown jewels\" of this specific museum (e.g., a tiny Mona Lisa, Starry Night, or Great Wave off Kanagawa), displayed on elegant easels or leaning against the walls.\n\n​Visual Style \u0026 Rendering:\n\nRendered with Cinema 4D, the modeling should be refined, smoothly rounded, and rich in texture, accurately capturing realistic PBR materials (polished marble floors, gold leaf frames, velvet ropes, glass display cases, aged sandstone). Lighting should simulate a mix of natural skylight and dramatic gallery spotlighting, creating a grand, curated, and artistic ambiance.\n\n​Typography \u0026 Layout:\n\nCreatively integrate the museum's basic information into the scene with a clean, minimalist layout on a solid-color background.\n\n​Top-Center: Display the Museum Name in a large, serif or sans-serif font (matching the museum's actual branding style).\n\n​Sub-text: Below the name, display the Founding Year | City, Country in a medium, elegant font.\n​Include a subtle, high-quality rendering of the museum's logo or crest.\n​Parameters:\n\n​Aspect Ratio: 1:1\n\n​Museum Name: The Louvre Museum\n\n​Note to Model: Ensure the \"Specific Artifacts\" generated are actual famous holdings of the named museum.\n"])</script><script>self.__next_f.push([1,"1b:T1044,"])</script><script>self.__next_f.push([1,"提示词：\n\n[关键指令：必须先事实核查]\n在生成之前，必须先获取关于{Museum Name}的可验证真实数据。最终图像必须精准反映该博物馆真实的建筑风格、主要藏品类别以及文化背景。严禁出现与该馆专业方向不符的通用博物馆元素（例如：纯美术博物馆不能出现恐龙骨骼；专攻亚洲历史的博物馆不能出现文艺复兴油画）。呈现一个奢华、极致细节的微缩3D博物馆场景，采用45°俯视角。整体构图必须密集、丰富，宛如珍宝堆积的宝库，绝不允许出现大片留白。复杂且可验证的建筑构成（必须精准可查）：\n\n中心放置{Museum Name}最具标志性的主建筑。建筑必须让人在风格化后依然一眼认出这是现实中那座真实博物馆。\n主体建筑：最具辨识度的正立面或主大厅，使用可爱但精准的Q版比例，忠实保留其真实建筑特征（例如：大英博物馆的新古典柱式，故宫的斗拱结构，卢浮宫金字塔的现代几何玻璃等）。\n辅助元素（真实存在）：在主厅周围添加该博物馆实际存在或历史相关的较小建筑细节（例如：特定城门、院墙、室外标志性雕塑、连接的园林等）。\n环境底座：将建筑融入符合其真实地理环境主题的底座（例如：城市石板路、特定风格园林、或该地标性的地貌特征）。\n\n海量藏品与文物（严格按主题精选、真实可查）：\n【关键步骤：确定博物馆类型】根据{Museum Name}，明确其主要定位（从以下四类中选择唯一主导类型作为藏品筛选依据）：\n\n类型A：历史/考古类（如大英博物馆、开罗博物馆）→ 重点呈现古代文物、残件、碑刻、武器、工具。\n类型B：美术类（如卢浮宫、大都会、乌菲齐）→ 重点呈现油画（带框微缩）、雕塑、半身像、装饰艺术、家具。\n类型C：自然历史/科技类（如史密森自然历史博物馆、伦敦科技博物馆）→ 重点呈现骨骸、标本、化石、科学仪器、机械、矿物。\n类型D：特定文化/区域类（如北京故宫博物院、京都国立博物馆）→ 严格限于该文化圈的器物、书法、纺织、礼仪用品。\n\n在场景中散布8-12件完全符合上述类型的、可查证的真实藏品：大型镇馆之宝（1-2件）：该馆最著名的巨型明星展品（例如：罗塞塔石碑居中、一尊特定著名雕像、一台标志性大型机器）。\n中型代表文物（3-4件）：体现该馆最强部门的特色器物（例如：特定类型陶瓷、整套盔甲、天文仪器、中型雕塑）。\n小型精致细节（多件）：填满缝隙的微小珍品（例如：古币、珠宝、小型碑刻、科学标本、微型卷轴）。\n摆放方式：动态活泼——放在微型底座上、倚靠墙体、或用魔幻现实主义手法“漂浮”。\n\n视觉风格与“填满空白”（收藏家桌面感）：\n\n将整个场景视为“馆长的书桌”式微缩模型，彻底消灭空旷感。\n主题道具：加入强化特定主题的装饰元素（A类：考古工具；B类：鎏金画框与调色盘；C类：放大镜与野外笔记；D类：传统文房用具）。\n地面纹理密度：据地点选择丰富质感（例如：古老石板地、抛光展厅木地板、传统花纹地毯）。\n渲染风格：Cinema 4D/Octane Render。高饱和度、极致锐利细节、环境光遮蔽增加深度。使用景深效果，中心密集区域极致清晰，边缘柔和虚化。\n\n色彩方案（文化沉浸感）：\n\n主色调：提取该博物馆建筑或官方品牌中最具代表性的3个真实颜色。\n背景：纯色、高级哑光底色，提供优雅对比（例如：深酒红、石板蓝、暗祖母绿）。\n\n文字排版（精致得体）：\n\n主标题：\"{Museum Name}\" 使用与博物馆起源文化相符的字体（例如：亚洲博物馆用书法体，欧洲/西方博物馆用衬线体）。\n副标题：\"City, Country\" 使用干净无衬线字体。\n排版位置：优雅低调，不抢戏。\n\n参数：画面比例：1:1\n博物馆名称：{Museum Name}\n"])</script><script>self.__next_f.push([1,"1c:T123b,"])</script><script>self.__next_f.push([1,"Prompt (More Stable \u0026 Accurate)\n[CRITICAL INSTRUCTION: Fact-Check First]\nBefore generating, fetch verifiable data about {Museum Name}. The resulting image must accurately reflect the actual architectural style, primary collection categories, and cultural context of this specific institution. Do not include generic museum items if they do not belong to this museum's specialization (e.g., no dinosaur bones in a dedicated Fine Art museum; no Renaissance paintings in a dedicated Asian History museum).\nPresent a lavish, highly detailed miniature 3D scene of {Museum Name}, viewed from a 45° top-down perspective. The composition should feel dense, rich, and like a treasure trove, avoiding empty spaces.\n1. Complex Architectural Composition (Verifiable \u0026 Specific):\nCentrally place the iconic master building of {Museum Name}. The architecture must be recognizable as that specific real-world location, even in stylized form.\nMain Structure: The most recognizable facade or main hall, rendered with cute but precise Q-version proportions capturing its real architectural identity (e.g., Neo-Classical columns for British Museum, traditional Dougong brackets for Palace Museum, modern geometric glass for Louvre Pyramid).\nSecondary Elements (Contextual): Surrounding the main hall, add smaller, verifiable architectural details actually present at or historically associated with the site (e.g., specific gates, courtyard walls, iconic statues located outside the building, connected gardens).\nEnvironment Base: Integrate the building into a thematic base that accuratel
