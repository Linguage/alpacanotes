t-2000173423897813135\",\"title\":\"人物主题雕像\",\"content\":\"$1a\",\"imageUrl\":\"$undefined\",\"imageUrls\":[\"https://pbs.twimg.com/media/G8GcwiJaUAAgLQL.jpg\",\"https://pbs.twimg.com/media/G8Gc3K7bkAAGbqa.jpg\",\"https://pbs.twimg.com/media/G8Gc7UcaIAApF16.jpg\",\"https://pbs.twimg.com/media/G8GdF3CbsAE8Jzo.jpg\"],\"description\":\"人物主题雕像 回归我最喜欢的“人物博物馆”话题。在科幻主题的基础上迭代，获得人物主题的写实风格雕像。 示例人物： 1. 托尔金 2. 伽利略 3.梵·高 4. 加加林 --- 提示词（英文版见评论区） 人物：托尔金 以 45° 俯视角度呈现的一件精细叙事雕塑，置于方形深色木质底座\",\"tags\":[\"tweet-backup\",\"ai绘图\"],\"params\":\"$undefined\",\"ref\":\"https://x.com/AztecaAlpaca/status/2000173423897813135\",\"refText\":\"AztecaAlpaca\",\"gallery\":true,\"source\":{\"title\":\"雕塑与材质化风格类\",\"url\":\"/prompts/tweet-cluster-sculpture-material\",\"date\":\"2025-12-20T00:00:00.000Z\",\"type\":\"collection\"}},{\"id\":\"tweet-2001131600185381220\",\"title\":\"GPT版本\",\"content\":\"$1b\",\"imageUrl\":\"$undefined\",\"imageUrls\":[\"https://pbs.twimg.com/media/G8Vw6biasAAvvHB.jpg\",\"https://pbs.twimg.com/media/G8VyS8La4AM7LHX.jpg\"],\"description\":\"GPT版本 效果上讲，GPT与Gemini各有特色，都可以接受。二者对材质的处理有一定差异。 另外，我感觉Gemini对提示词的跟随性更强一些，GPT的素材可信度有些问题。\",\"tags\":[\"tweet-backup\",\"ai绘图\"],\"params\":\"$undefined\",\"ref\":\"https://x.com/AztecaAlpaca/status/2001131600185381220\",\"refText\":\"AztecaAlpaca\",\"gallery\":true,\"source\":{\"title\":\"雕塑与材质化风格类\",\"url\":\"/prompts/tweet-cluster-sculpture-material\",\"date\":\"2025-12-20T00:00:00.000Z\",\"type\":\"collection\"}},{\"id\":\"tweet-2002020793988034889\",\"title\":\"水中芭蕾\",\"content\":\"提示词：\\n\\nHigh-speed photography style. The primary subject structure from the reference image is transformed into a monochromatic, abstract frozen liquid splash sculpture emerging from a dynamic, churning water surface. The entire structure is constructed from powerful, torrential water jets, cascading sheets of fluid, and exploding, ultra-sharp droplets caught mid-motion, splashing and rippling powerfully around the base. Enhanced sense of dynamic flow, momentum, and turbulence; twisting ribbons of water and complex, energetic splashes define the shape. Crystalline, glass-like textures. Soft, natural background lighting from a twilight sky introduces warm golden and cool blue hues that refract through the transparent water form. The background is a heavily blurred, natural environment at dusk, with soft, colorful bokeh from distant light sources and the setting sun, creating a subtle yet rich color palette. Poetic, minimalist, cinematic, ultra-realistic, 8k detail. --ar 3:4\\n\",\"imageUrl\":\"$undefined\",\"imageUrls\":[\"https://pbs.twimg.com/media/G8iZ1GYbYAEAWwi.jpg\",\"https://pbs.twimg.com/media/G8iajwNasAA8nLK.jpg\",\"https://pbs.twimg.com/media/G8iap8zawAA3U2q.jpg\",\"https://pbs.twimg.com/media/G8ibFCCaoAA15oX.jpg\"],\"description\":\"水中芭蕾 1.芭蕾舞--奥斯波娃 2.花样滑冰--羽生结弦 3.体操鞍马--张博恒 4.篮球--科比 在 Tan老师的提示词基础上进行了一些修改，做了一个对既有照片风格化的提示词（见二楼评论区），可以生成该照片中主体的一种“水体化”呈现，富有动感与张力。特别适合处理运动镜头 ht\",\"tags\":[\"tweet-backup\",\"ai绘图\"],\"params\":\"$undefined\",\"ref\":\"https://x.com/AztecaAlpaca/status/2002020793988034889\",\"refText\":\"AztecaAlpaca\",\"gallery\":true,\"source\":{\"title\":\"雕塑与材质化风格类\",\"url\":\"/prompts/tweet-cluster-sculpture-material\",\"date\":\"2025-12-20T00:00:00.000Z\",\"type\":\"collection\"}},{\"id\":\"tweet-2002526176284143757\",\"title\":\"如何为你最喜爱的球星做这种美轮美奂且富有动感的“沙雕”？\",\"content\":\"prompt：\\n\\nA monochromatic, finely detailed kinetic sand sculpture of the primary subject, captured in a close-up telephoto shot. The subject is frozen in mid-air, depicting a dynamic jumping motion with feet clearly lifted off the ground. The sculpture has a matte, granular texture with visible sand grains. Fine streams of sand are flowing horizontally off the limbs and body to the right, carried by a breeze, creating delicate trailing plumes. The background is a heavily blurred, separate natural desert dune landscape at dusk, providing a soft bokeh backdrop that does not interfere with the sculpture's form. Warm golden hour lighting highlights the texture and creates a poetic, cinematic atmosphere. Ultra-realistic, 8k detail. --ar 3:4\\n\",\"imageUrl\":\"$undefined\",\"imageUrls\":[\"https://pbs.twimg.com/media/G8oGl6LbMAEpbKA.jpg\",\"https://pbs.twimg.com/media/G8oGpdbaMAA8dOC.jpg\"],\"description\":\"如何为你最喜爱的球星做这种美轮美奂且富有动感的“沙雕”？ 只需要上传一张图，贴上一段提示词（见评论区）即可搞定！ 两张示例 1.乔丹扣篮 2.科比后仰（全球知名背景板——韦德）\",\"tags\":[\"tweet-backup\",\"ai绘图\"],\"params\":\"$undefined\",\"ref\":\"https://x.com/AztecaAlpaca/status/2002526176284143757\",\"refText\":\"AztecaAlpaca\",\"gallery\":true,\"source\":{\"title\":\"雕塑与材质化风格类\",\"url\":\"/prompts/tweet-cluster-sculpture-material\",\"date\":\"2025-12-20T00:00:00.000Z\",\"type\":\"collection\"}}]},\"collections\":[],\"allPrompts\":\"$e:1:props:children:props:collection:prompts\"}]}]]\n"])</script><script>self.__next_f.push([1,"14:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"12:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"雕塑与材质化风格类 - Prompt Hub - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"聚合雕塑化、材质化（沙雕、水体、核雕等）相关提示词。\"}],[\"$\",\"link\",\"3\",{\"rel\":\"alternate\",\"type\":\"application/rss+xml\",\"href\":\"https://linguista.cn/alpacanotes/rss.xml\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"雕塑与材质化风格类 - Prompt Hub - AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"聚合雕塑化、材质化（沙雕、水体、核雕等）相关提示词。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes/prompts/tweet-cluster-sculpture-material\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"https://linguista.cn/alpacanotes/aztecaalpaca.jpg\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"article\"}],[\"$\",\"meta\",\"9\",{\"property\":\"article:published_time\",\"content\":\"2025-12-20T00:00:00.000Z\"}],[\"$\",
