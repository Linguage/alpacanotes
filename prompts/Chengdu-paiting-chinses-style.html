,\"static/chunks/687-c2665e2500b4d6df.js\",\"176\",\"static/chunks/176-3df8e6cb591332fc.js\",\"388\",\"static/chunks/app/prompts/%5Bid%5D/page-b610a7d61bc8367e.js\"],\"DeviceLoading\"]\n19:I[2481,[\"839\",\"static/chunks/839-14659c40363d67cb.js\",\"687\",\"static/chunks/687-c2665e2500b4d6df.js\",\"176\",\"static/chunks/176-3df8e6cb591332fc.js\",\"388\",\"static/chunks/app/prompts/%5Bid%5D/page-b610a7d61bc8367e.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"$L16\",null,{}],[\"$\",\"$17\",null,{\"fallback\":[\"$\",\"$L18\",null,{\"label\":\"成都版《清明上河图》\"}],\"children\":[\"$\",\"$L19\",null,{\"collection\":{\"type\":\"collection\",\"id\":\"Chengdu-paiting-chinses-style\",\"title\":\"成都版《清明上河图》\",\"description\":\"一幅融合现代成都与传统水墨画风格的《清明上河图》式长卷，展现古今交融的城市景观。\",\"date\":\"2025-11-23T00:00:00.000Z\",\"tags\":[\"nanobanana\",\"水墨画\",\"成都\",\"城市\",\"古今融合\"],\"promptCount\":3,\"contentHtml\":\"\",\"prompts\":[{\"id\":\"Chengdu-paiting-chinese-style\",\"title\":\"成都版《清明上河图》\",\"content\":\"画面基调：一幅宏大的中国传统水墨工笔长卷画，完全模仿北宋张择端《清明上河图》的绘画风格、散点透视构图和古朴泛黄的绢本设色质感。\\n\\n核心场景：烟火气缭绕的锦江（府南河）两岸鸟瞰图。画面焦点是一座宏伟的仿古廊桥（安顺廊桥），桥面人流密集（但仅为人行桥），廊桥远处有另一座桥面（非廊桥），桥有九孔，人称九眼桥，桥上两岸道路交通水泄不通，绘满了密密麻麻的现代私家车、绿色的出租车以及穿梭在车流缝隙中海量的电动车和外卖骑手（身着黄蓝制服），所有车辆与骑手都用毛笔线条精细勾勒。\\n\\n环境细节：锦江中行驶着现代夜游船和乌篷船。河流两岸是古今交错的建筑群：一边是低矮精致的川西穿斗式建筑（类似太古里），一边是高耸入云的玻璃幕墙摩天大楼（依稀可见IFS的大熊猫雕塑爬在墙上），建筑采用传统的\\\"界画\\\"技法绘制。背景远处隐约可见高耸的电视塔（339电视塔）矗立在蜀地的薄雾中。\\n\\n人物活动：河滨绿道和茶馆外摆区挤满了成百上千的微小现代人物。他们形态各异，极具松弛感：有的坐在竹椅上喝盖碗茶、摆龙门阵，有的正在露天凑桌打麻将，有的在排队吃火锅，还有采耳师在为游客服务。整个画面细节极其丰富，既喧闹又安逸，完全使用古老的水墨和大地色调渲染.\\n\",\"imageUrl\":\"$undefined\",\"imageUrls\":[\"https://pbs.twimg.com/media/G6a17SpaIAAIxBH?format=jpg\u0026name=medium\"],\"description\":\"一幅融合现代成都与传统水墨画风格的《清明上河图》式长卷，展现古今交融的城市景观。\",\"tags\":[\"中国风\",\"水墨画\",\"成都\",\"城市\",\"古今融合\"],\"params\":{\"Model\":\"nanobanana pro\",\"Aspect Ratio\":\"16:9\"},\"ref\":\"https://x.com/AztecaAlpaca/status/1992480214736351586?s=20\",\"refText\":\"阿兹特克小羊驼\",\"gallery\":true,\"source\":{\"title\":\"成都版《清明上河图》\",\"url\":\"/prompts/Chengdu-paiting-chinses-style\",\"date\":\"2025-11-23T00:00:00.000Z\",\"type\":\"collection\"}},{\"id\":\"wanghe-chao-qingming\",\"title\":\"望海潮·《清明上河图》\",\"content\":\"根据柳永的词绘制一个《清明上河图》风格的画作，并在画幅的上面附上词（竖排，自右向左书写，中文书法）\\n\\n画面基调：一幅宏大的中国传统水墨工笔长卷画，完全模仿北宋张择端《清明上河图》的绘画风格、散点透视构图和古朴泛黄的绢本设色质感。\\n\\n望海潮\\n\\n东南形胜，三吴都会，钱塘自古繁华。\\n\\n烟柳画桥，风帘翠幕，参差十万人家。\\n\\n云树绕堤沙，怒涛卷霜雪，天堑无涯。\\n\\n市列珠玑，户盈罗绮，竞豪奢。\\n\\n重湖叠𪩘清嘉，有三秋桂子，十里荷花。\\n\\n羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。\\n\\n千骑拥高牙，乘醉听箫鼓，吟赏烟霞。\\n\\n异日图将好景，归去凤池夸。\\n\",\"imageUrl\":\"$undefined\",\"imageUrls\":[\"https://pbs.twimg.com/media/G6a31nkbEAAHuRC.jpg\"],\"description\":\"根据柳永《望海潮》绘制的《清明上河图》风格画作，词文以竖排书法形式呈现。\",\"tags\":[\"宋词\",\"清明上河图\",\"柳永\",\"钱塘\",\"书法\"],\"params\":{\"Model\":\"nanobanana pro\",\"Aspect Ratio\":\"16:9\"},\"ref\":\"https://x.com/AztecaAlpaca/status/1992482121991217428\",\"refText\":\"阿兹特克小羊驼\",\"gallery\":false,\"source\":{\"title\":\"成都版《清明上河图》\",\"url\":\"/prompts/Chengdu-paiting-chinses-style\",\"date\":\"2025-11-23T00:00:00.000Z\",\"type\":\"collection\"}},{\"id\":\"wanghe-chao-qianli\",\"title\":\"望海潮·《千里江山图》\",\"content\":\"根据柳永的词绘制一个《千里江山图》风格的画作，并在画幅的上面附上词（竖排，自右向左书写，中文书法）\\n\\n画面基调：一幅宏大的中国传统水墨画，完全模仿北宋王希孟《千里江山图》的绘画风格、散点透视构图和色彩典雅的绢本设色质感。\\n\\n望海潮\\n\\n东南形胜，三吴都会，钱塘自古繁华。\\n\\n烟柳画桥，风帘翠幕，参差十万人家。\\n\\n云树绕堤沙，怒涛卷霜雪，天堑无涯。\\n\\n市列珠玑，户盈罗绮，竞豪奢。\\n\\n重湖叠𪩘清嘉，有三秋桂子，十里荷花。\\n\\n羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。\\n\\n千骑拥高牙，乘醉听箫鼓，吟赏烟霞。\\n\\n异日图将好景，归去凤池夸。\\n\",\"imageUrl\":\"$undefined\",\"imageUrls\":[\"https://pbs.twimg.com/media/G6a4olhaoAAM14p.jpg\",\"https://pbs.twimg.com/media/G6a9MDxbUAAmlys.jpg\"],\"description\":\"根据柳永《望海潮》绘制的《千里江山图》风格画作，词文以竖排书法形式呈现。\",\"tags\":[\"宋词\",\"千里江山图\",\"柳永\",\"王希孟\",\"书法\"],\"params\":{\"Model\":\"nanobanana pro\",\"Aspect Ratio\":\"16:9\"},\"ref\":\"$undefined\",\"refText\":\"$undefined\",\"gallery\":false,\"source\":{\"title\":\"成都版《清明上河图》\",\"url\":\"/prompts/Chengdu-paiting-chinses-style\",\"date\":\"2025-11-23T00:00:00.000Z\",\"type\":\"collection\"}}]},\"collections\":[],\"allPrompts\":\"$e:1:props:chil
