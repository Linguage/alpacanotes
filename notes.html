ren\":[null,[\"$\",\"$4\",\"9o1L6SfbfuTvBgxGkcuNS\",{\"children\":[[\"$\",\"$Le\",null,{\"children\":\"$Lf\"}],[\"$\",\"$L10\",null,{\"children\":\"$L11\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\"}]]}]]}]]],\"m\":\"$undefined\",\"G\":[\"$12\",\"$undefined\"],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"13:I[2647,[\"769\",\"static/chunks/769-1b2dcaae534cd38e.js\",\"295\",\"static/chunks/295-cd1ad4792cfea08a.js\",\"128\",\"static/chunks/128-9d1a72f3c6b94486.js\",\"154\",\"static/chunks/154-f31fb61fcc9f6be8.js\",\"996\",\"static/chunks/996-1d2a3bdf68e1c7e2.js\",\"568\",\"static/chunks/app/notes/page-f8f75d7268dd6ae9.js\"],\"default\"]\n14:\"$Sreact.suspense\"\n15:I[6123,[\"769\",\"static/chunks/769-1b2dcaae534cd38e.js\",\"295\",\"static/chunks/295-cd1ad4792cfea08a.js\",\"128\",\"static/chunks/128-9d1a72f3c6b94486.js\",\"154\",\"static/chunks/154-f31fb61fcc9f6be8.js\",\"996\",\"static/chunks/996-1d2a3bdf68e1c7e2.js\",\"568\",\"static/chunks/app/notes/page-f8f75d7268dd6ae9.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"b:[\"$\",\"main\",null,{\"className\":\"min-h-screen pb-20 bg-background text-foreground\",\"children\":[[\"$\",\"$L13\",null,{}],[\"$\",\"div\",null,{\"className\":\"mx-auto w-full max-w-6xl px-6\",\"children\":[\"$\",\"$14\",null,{\"fallback\":[\"$\",\"p\",null,{\"className\":\"py-12 text-muted\",\"children\":\"正在打开笔记目录…\"}],\"children\":[\"$\",\"$L15\",null,{\"items\":[{\"key\":\"note:2026-10-08t2004\",\"section\":\"memo\",\"title\":\"创作的停滞与对AI的倦怠\",\"excerpt\":\"最近的内容创作基本上停滞，主要的精力都放在把想法外包给AI来进行一些网站优化，对于写作这种耗费心力的事情，我一点时间都不想花费。 我不知道从什么时候开始，从AI的爱好者变成了一个越发坚定的“反AI主义着”。之前的很多文章事实上都是AI代笔的，现在我的态度已经转变，再交给AI代笔有点说不过去。“既要又要”对于我这种底线不够坚定的人来说也不是不行，但写作这件事情，既然无法带来流量，那么娱乐自己总得是必要的了，而用AI写作真的一点乐趣都不存在。\",\"date\":\"2026-10-08T20:04:00.000Z\",\"dateKey\":\"2026-10-09\",\"url\":\"/notes/2026-10-08t2004\",\"tags\":[\"AI\",\"写作\"]},{\"key\":\"note:2026-10-08t1939\",\"section\":\"memo\",\"title\":\"不知不觉，已经在生理意义上成为了成都人\",\"excerpt\":\"在家度过了一周，可能过敏了，腿上起了疹子。会来之后一天症状就明显缓解了。 当说到自己是哪里人的时候，通常是指你的户籍或祖籍。不过人与地方的连接可能是更加自然且根深蒂固的，那就是与这个地方的气候、饮食、人情世故的适应。这种关系不会写在某个文件中，但会写在我们身上。 我在成都待了十多年，不知不觉中，或许已经完成了“脱胎换骨”，成了一个生理意义上的成都人。\",\"date\":\"2026-10-08T19:39:00.000Z\",\"dateKey\":\"2026-10-09\",\"url\":\"/notes/2026-10-08t1939\",\"tags\":[\"生活\",\"假期\"]},{\"key\":\"post:ai-research-alienation-and-human-agency\",\"section\":\"essay\",\"title\":\"AI时代的科研异化与人的主体性\",\"excerpt\":\"近日，OpenAI一次性公开了七百余份由人工智能生成的数学研究手稿。如此庞大的产出规模令人惊讶，似乎预示着一个科学发现可以大规模自动化的时代正在到来。然而，数学界对此的反应却远非一致的欢呼。陶哲轩开始公开反思AI对数学研究可能造成的负面影响，一些数学家甚至发表声明，质疑这种批量生产研究成果的方式究竟能在多大程度上促进数学的发展。 这场争论让我感到一种强烈的矛盾。一方面，人工智能正在展现出前所未有的智力能力，许多过去需要人类付出漫长努力才能解决的问题，如今可能在极短时间内得到答案。另一方面，这种能力的增长似乎并未给所有研究者带来同等程度的喜悦，反而使一些人开始担忧自己所从事的事业正在失去原有的意义。为什么一种能够极大推动知识增长的技术，会引发如此深刻的忧虑？ 陶哲轩在近期的讨论中指出，传统数学研究中，一项重大猜想的解决往往只是学术活动的开始。围绕新的证明，数学家们会展开讨论、举办报告、形成合作，新的研究问题也随之出现。原本复杂的证明逐渐得到简化和解释，最终成为能够被更多人理解、学习和继续发展的数学知识。科学发现由此融入整个学术共同体，并在持续的交流与探索中推动学科发展。 而AI可能改变这一过程。一个人可以借助AI迅速解决某个数学问题，却未必真正理解得到的证明，也未必对这一领域具有持续的研究兴趣。当成果能够被大量生产，围绕成果展开的理解、讨论与后续探索却未能同步增长时，数学研究便可能出现一种奇特的繁荣：被解决的问题越来越多，研究活动本身却未必因此更加活跃。 在我看来，这种变化触及了现代科研中一个长期存在的问题：科研活动正在越来越深地受到成果指标的支配。 事实上，在人工智能大规模进入科研领域之前，这种异化就已经相当明显。论文数量、引用次数、期刊等级和各种绩效指标，逐渐成为衡量科研活动的重要标准。原本用于评价研究成果的指标，又反过来影响研究者的行为，使科研工作越来越倾向于生产可以计…\",\"date\":\"2026-10-08T00:00:00.000Z\",\"dateKey\":\"2026-10-08\",\"url\":\"/articles/ai-research-alienation-and-human-agency\",\"tags\":[\"人工智能\",\"科研异化\",\"人的主体性\",\"科学哲学\",\"数学研究\"]},{\"key\":\"post:argentina-beat-england-2026-07-16\",\"section\":\"essay\",\"title\":\"阿根廷逆转英格兰\",\"excerpt\":\"世界杯决赛的对阵已经产生：阿根廷与西班牙。他们将在7月20日凌晨3点角逐这一届世界杯的总冠军。前一天凌晨5点进行英格兰与法国之间的三四名决赛。 今天凌晨刚刚结束的英阿大战中，英格兰先是在第50多分钟打进一球。随后，他们采取了一种蹲坑式的战术，把身后空间完全漏给了阿根廷。之后40分钟左右，阿根廷几乎全面占据场上优势，在第85分钟和伤停补时刚开始时各进一球，以2:1逆转。 这场比赛梅西完成了两次助攻。截至目前，梅西7场比赛已经有8个进球、4次助攻，排在射手榜首位。梅西大概率会拿下本届世界杯的最佳球员。至于冠军，仍有悬念。从纸面实力上看，阿根廷与西班牙相比处于弱势地位，但世界杯决赛显然不能只看纸面实力。 目前来看，这两支球队踢的都属于拉丁式足球，值得期待。梅西和亚马尔之间也很有意思，某种意义上可以说是巴萨两代人的代表。他们在19年前曾经有过一次邂逅，当时梅西给亚马尔洗澡，所以这场决赛也可以称为“澡盆大战”。 阿根廷与英格兰这场比赛，和上一场法国与西班牙的比赛，在踢法上有不少区别。法国对西班牙那场，法国好像没有很瞧得上西班牙。他们似乎觉得自己拥有一套非常强大的进攻组合，就可以肆虐西班牙的防线。但是西班牙恰恰拿捏住了他们中场薄弱的特点，利用自己在这方面的绝对优势，让法国的前场在整场比赛中碌碌无为。 感觉法国面对这种踢法，缺少应对措施，也没有拿出自己的方案。最终输掉比赛，大家都挺服的。 英格兰输掉这场比赛，大家也挺服。他们自己选择了一种很难赢下比赛的策略，输得非常搞笑。他们拥有很强的攻击力，却选择了六后卫，完全搞不清楚这套逻辑。 用六后卫面对阿根廷，确实说明他们对梅西有足够的重视。但是这种比赛，似乎很难纯粹通过防守赢下来。\",\"date\":\"2026-07-16T00:00:00.000Z\",\"dateKey\":\"2026-07-16\",\"url\":\"/articles/argentina-beat-england-2026-07-16\",\"tags\":[\"世界杯\",\"阿根廷\",\"英格兰\",\"梅西\"]},{\"key\":\"note:almost-missed-world-cup-2026-07-15\",\"section\":\"memo\",\"title\":\"我原本想看最后四场世界杯：两场半决赛、一场三四名决赛，以及最后的决赛。\",\"excerpt\":\"我原本想看最后四场世界杯：两场半决赛、一场三四名决赛，以及最后的决赛。 昨天我错过了西班牙与法国的比赛，等我醒来时，比赛已经结束了。法国队被西班牙淘汰。西班牙死死拿捏住了法国的命门，法国的攻击线完全没有发挥出威力。这算是法国队的傲慢得到的一个教训。 接下来是英格兰与阿根廷的比赛。英阿大战时隔24年再度上演，非常值得期待。不过这场比赛的时间是凌晨4点，能不能起来看很难说。 我大概率起不来。到机场后看能不能补上，但感觉不太现实。凌晨4点基本上是最不可能起来的阴间时间。 现在确实没有以前那种看球的热情了。算了。\",\"date\":\"2026-07-15T14:32:05.000Z\",\"dateKey\":\"2026-07-15\",\"url\":\"/notes/almost-missed-world-cup-2026-07-15\",\"tags\":[\"世界杯\",\"足球\",\"观赛\"]},{\"key\":\"post:world-cup-final-four-2026-07-12\",\"section\":\"essay\",\"title\":\"世界杯四强产生\",\"excerpt\":\"今天世界杯的四强已经全部产生了。早一点的比赛中，英格兰击败了挪威；上午的比赛中，阿根廷击败了瑞士。这样一来，英格兰和阿根廷将会师半决赛。这应该是世界杯上的第6次英阿大战，很值得期待。 今天的比赛中，有两件比较抓马的事情。一个是在英格兰与挪威的比赛中，英格兰进球之前，皮球据说踢到了摄像机上，又反弹回来，对比赛造成了干扰。但是裁判并没有吹停，而且这件事情刚好发生在英格兰进球的那次进攻中，所以引起了很多讨论。 我后来也看到相关的视频，说比赛用球上有传感器。在整个过程中，传感器似乎没有因为靠近球框或者摄像头而突然产生撞击信号。所以这件事情也可能没有真正发生，实际的撞击可能并不存在。不管怎么样，这件事已经被大家讨论了很多。 另外一件事情发生在阿根廷与瑞士队的比赛中。瑞士队的恩波洛假摔，试图让阿根廷球员吃到黄牌。这名阿根廷球员之前已经拿到一张黄牌，如果再吃到黄牌，就会两黄变一红被罚下。 这件事情可能导致一名球员被罚下，VAR因此介入，最后发现是恩波洛假摔。他此前也有一张黄牌，这次假摔让他又吃到一张，自己被罚下。阿根廷球员的黄牌则被取消，得以继续留在场上。 恩波洛被罚下后，瑞士队不得不少打一人。这是今天比较搞笑的一幕，但后果也很严重，对整体比赛形势应该起到了决定性的作用。 今天梅西和哈兰德都没有进球，贝林厄姆进了两个球。现在射手榜上已有6人进球达到5个，其中梅西和姆巴佩进了8个，哈兰德进了7个，贝林厄姆和凯恩进了6个，登贝莱进了5个。 这6个人本来都有机会角逐金靴。不对，哈兰德已经被淘汰了。挪威队今天出局，所以哈兰德已经没有机会继续争金靴，只能看他最后能不能保住射手榜第三的位置。今年这个金靴竞争还是太激烈了。 好像2006年到2014年这几届，金靴进球数都不算特别高。2006年和2010年都是5个球就能拿到金靴，其他很多届是6个。金靴奖得主进球数比较多的，主要是2002年和2022年，这…\",\"date\":\"2026-07-12T00:00:00.000Z\",\"dateKey\":\"2026-07-12\",\"url\":\"/articles/world-cup-final-four-2026-07-12\",\"tags\":[\"世界杯\",\"足球\",\"阿根廷\",\"英格兰\"]},{\"key\":\"note:world-cup-viewing-2026-07-11\",\"section\":\"memo\",\"title\":\"这几天世界杯已经进入1/4决赛。前两场已经打完了，法国与西班牙分别淘汰了摩洛哥和比利时，他们将会师半决赛，争夺其中一个决赛席位。…\",\"excerpt\":\"这几天世界杯已经进入1/4决赛。前两场已经打完了，法国与西班牙分别淘汰了摩洛哥和比利时，他们将会师半决赛，争夺其中一个决赛席位。明天还会踢另外两场比赛。 这届赛事进球挺多，名场面好像没那么多。对我来说，主要是夜间起不来，所以没怎么看比赛。 我对这届世界杯总体比较无感，但经常会被其中的一些事情激励到。前几届我可能会看非常多的比赛，那种在剧情中被影响到的体验，在本届世界杯上显然没有。 现在计划明天看一下阿根廷和瑞士队的1/4决赛。这场比赛时间比较好，早上9点钟开打。\",\"date\":\"2026-07-11T13:51:54.000Z\",\"dateKey\":\"2026-07-11\",\"url\":\"/notes/world-cup-viewing-2026-07-11\",\"tags\":[\"世界杯\",\"足球\",\"观赛\"]},{\"key\":\"note:world-cup-schedule-2026-07-05\",\"section\":\"memo\",\"title\":\"世界杯似乎没有什么大不了的。我关注的几支球队现在都还在，包括阿根廷、巴西、法国。明天早上是巴西踢挪威，可能是1/8决赛中比较值得…\",\"excerpt\":\"世界杯似乎没有什么大不了的。我关注的几支球队现在都还在，包括阿根廷、巴西、法国。明天早上是巴西踢挪威，可能是1/8决赛中比较值得关注的一场。 我今天看了一下世界杯的总体安排，15号到20号是半决赛与决赛，到时候的比赛应该会比较受关注。在此之前还有十天左右，也就是1/8决赛、1/4决赛。这些比赛也很重要，但我不太可能认真去看。\",\"date\":\"2026-07-05T14:59:54.000Z\",\"dateKey\":\"2026-07-05\",\"url\":\"/notes/world-cup-schedule-2026-07-05\",\"tags\":[\"世界杯\",\"足球\",\"观赛\"]},{\"key\":\"post:cape-verde-world-cup-2026-07-04\",\"section\":\"essay\",\"title\":\"佛得角结束世界杯征程\",\"excerpt\":\"今天早上的比赛，是阿根廷与佛得角之间的对决。阿根廷3:2通过加时赛淘汰了佛得角。 这场比赛，佛得角的表现非常令人震惊。他们在场面上甚至没有比阿根廷弱到哪里去，尤其是在加时赛中，几乎全程都保持着非常强的活力。佛得角的门将贡献了8次扑救，也是他们能够把比赛拖到最后的最重要功臣。 比赛结束后，佛得角也结束了本届世界杯的征程。他们一共踢了4场比赛，在常规时间一场都没有输掉，这是非常了不起的成就。阿根廷与佛得角这场比赛为他们的征程画上了一个几乎完美的句号。虽然没有办法更进一步，但我在虎扑上看到，佛得角的所有球员都拿到了至少9.8分的评分。40岁的老门将沃齐尼亚获得了10分，而且有15万人评分。这在历史上也是很罕见的成就。 这位门将有一个Instagram账号。开赛之前，他的粉丝只有5万人，现在已经达到1800万。这是一场属于小人物的梦幻之旅。他们在世界最高舞台上证明了自己。很多人在这之前甚至不知道有这个国家，但现在佛得角已经成了本届世界杯最大的黑马。 关于观看人数，我看到过27亿和2.7亿两种说法。27亿有点夸张，2.7亿可能更正常，数据还需要核对。但不管怎么说，这应该也是一个纪录，非常厉害。\",\"date\":\"2026-07-04T00:00:00.000Z\",\"dateKey\":\"2026-07-04\",\"url\":\"/articles/cape-verde-world-cup-2026-07-04\",\"tags\":[\"世界杯\",\"佛得角\",\"沃齐尼亚\",\"足球\"]},{\"key\":\"post:modric-last-world-cup\",\"section\":\"essay\",\"title\":\"送别莫德里奇\",\"excerpt\":\"这段时间世界杯我并没有怎么看，只是晚上刷到很多关于葡萄牙与克罗地亚这场比赛的内容。比赛应该非常精彩，葡萄牙淘汰了克罗地亚。过程也引发了一些争议，其中C罗的点球、绝杀，以及吹掉克罗地亚绝平的判罚，都让不少克罗地亚球迷感到不满。比赛结果已经确定，不可能再改变了。 这场比赛没有看直播。真正触动我的，是晚上刷到很多送别莫德里奇的短视频。莫德里奇的巅峰大概是在2018年，那时他三十二三岁，而现在他已经超过40岁了。这应该是他在世界杯上的最后一战，基本没有什么悬念。这样一位伟大的球员，由另一位40多岁的前队友克里斯蒂亚诺·罗纳尔多送别，确实让人有点难受。 克罗地亚比很多人预期的走得早了一些。葡萄牙毕竟是本届世界杯的热门球队之一。虽然晋级过程艰难，他们仍然一步一步往前走。 莫德里奇在2018年征服了很多球迷。他长得英俊，成长背景也很励志，球风飘逸，又带领克罗地亚这样一支并不被普遍看好的国家队打进世界杯决赛。虽然输给了当时强大的法国队，他个人的表现赢得了广泛认可，并在那一年拿到了金球奖。那是一次非常伟大的个人表演。 到了2022年，巴西球迷对莫德里奇和克罗地亚的感情就复杂了很多，因为他们淘汰了巴西，并再次进入四强。对克罗地亚这样一个小国来说，能连续两届世界杯打进四强，本身是非常了不起的成就。这届世界杯，我们也许还期待他们继续创造奇迹，这终究不太现实。他们止步32强，虽然遗憾，也算是可以接受的结果。 我对莫德里奇最深的印象，来自他在皇马时期的表现。有几年我作为利物浦球迷，实在很难继续看英超，因为利物浦总是输球，所以那几年主要看皇马。皇马在2016年至2018年完成欧冠三连冠，2014年也拿到过欧冠冠军，也就是著名的“五年四冠”时期。那支皇马非常强大，莫德里奇是“典礼三中场”之一，一直发挥着关键作用。 在皇马时期，人们更多只是把他看作一名非常出色的中场。真正让他确立“世界第一中场”地位的，是2…\",\"date\":\"2026-07-04T00:00:00.000Z\",\"dateKey\":\"2026-07-04\",\"url\":\"/articles/modric-last-world-cup\",\"tags\":[\"世界杯\",\"莫德里奇\",\"克罗地亚\",\"足球\"]},{\"key\":\"post:germany-eliminated-world-cup-2026-06-30\",\"section\":\"essay\",\"title\":\"德国再次止步32强\",\"excerpt\":\"今天早上3点半左右醒来。我不太清楚具体睡了多久，应该有七个多小时，睡眠时间够长。醒来后，我还看了一场足球比赛。 我本来想看巴西与日本的比赛，醒来时比赛已经结束了。巴西队逆转日本，在第95分钟由马丁内利绝杀，晋级16强。接下来是德国与巴拉圭的比赛，四点多开打。我断断续续看了一会儿，发现德国没有踢出预期中的表现。 双方在常规时间1:1打平。加时赛时，德国队进了一个球，但因提前犯规被取消。点球大战中，德国队罚丢了三个点球，第三次止步32强，又成了“老32”，挺让人无语。 德国明显缺少点什么东西，这几届看着都挺让人别扭。小组赛我没有看。他们有一场7:1，但对手是库拉索，可能也说明不了什么实力，而且他们在小组赛最后一场输掉了比赛。这个德国队没有体现出有多强，给人的感觉像个伪强队。他们把一堆球星聚在一起，却好像什么事情都做不好。 也有人会说这对德国人是好事，会让他们反思自己、提升自己。但是这种说法，好像四年前就有过。一而再、再而三地犯这种错误，也不太能指望他们以后不再犯同样的错误。可能现在存在一些更本质的问题，德国足球的基因已经变了，不再像以前那样坚韧、那样高效、那样气势如虹。现在软绵绵的，这几届都这样，习惯就好。 接下来是荷兰与摩洛哥的比赛。这场比赛挺值得一看，因为两边实力都不错。世界杯进入淘汰赛之后，观赏性也在提高。\",\"date\":\"2026-06-30T00:00:00.000Z\",\"dateKey\":\"2026-06-30\",\"url\":\"/articles/germany-eliminated-world-cup-2026-06-30\",\"tags\":[\"世界杯\",\"德国\",\"足球\"]},{\"key\":\"post:world-cup-group-stage-ended-2026-06-28\",\"section\":\"essay\",\"title\":\"世界杯小组赛结束\",\"excerpt\":\"到今天，世界杯小组赛已经结束了。稍微休息一下之后，30号就要开始1/16决赛。32强已经全部产生，日本晋级，韩国在第三轮大意输掉比赛之后，陷入了一个非常糟糕的处境。本来是打平即出线，结果输了。接下来大家又开始挨个列举他们出线的条件，各种算排名，很欢乐，因为这是之前国足的剧本。 大部分豪门球队都没有被淘汰，只是分组情况不太一样。阿根廷处在一个相对有利的分区位置。在他们这个1/4区里，一共有8支球队，对阿根廷的考验应该不会特别严峻。他们有很大概率杀入四强。 在接下来这个1/4区的三场比赛中，我感觉梅西会继续进球。梅西已经在3场小组赛中进了6个球，每一场都有进球，这真是太恐怖了。这三场比赛的对手也没有强到哪里去，我估计他会把本届世界杯的总进球数刷到10个。再往后进入四强，就场场都是恶仗了，这几乎是毫无悬念的。 相比之下，巴西所在的1/4区挑战就比较大了。巴西在1/16决赛就要碰到日本，接下来还有可能碰到其他强队，比如英格兰。德国和法国也分到了同一个1/8区，他们的对决可能会成为1/8决赛中最受关注的比赛。西班牙、葡萄牙好像也分到这个半区，比较有看点。 这届赛事到目前为止，打出来的比赛比较松弛。可能是球队增加到48支之后，强队在小组赛的竞争压力没有那么大，可以更加从容地踢出一些大比分，观感也非常不错。比赛规则层面的一些细节，可能也导致了现在世界杯的进球数比较多。 这届世界杯最大的黑马，目前看来是佛得角。佛得角进入了淘汰赛，将在1/16决赛碰到阿根廷。能进入淘汰赛已经是超额完成任务，又有机会碰到梅西，这简直是一个完美的剧本。 进入淘汰赛，可以看的比赛越来越多，世界杯正式打响了。现在还有20多天的比赛，很刺激。我在整个小组赛期间其实没怎么看比赛。\",\"date\":\"2026-06-28T00:00:00.000Z\",\"dateKey\":\"2026-06-28\",\"url\":\"/articles/world-cup-group-stage-ended-2026-06-28\",\"tags\":[\"世界杯\",\"足球\",\"梅西\",\"佛得角\"]},{\"key\":\"note:world-cup-first-impressions-2026-06-14\",\"section\":\"memo\",\"title\":\"最近有世界杯的比赛。昨天晚上看了一场，只是没有盯着屏幕看，相当于听了一场。卡塔尔逼平了瑞士。6点多好像还有一场巴西与摩洛哥的比赛…\",\"excerpt\":\"最近有世界杯的比赛。昨天晚上看了一场，只是没有盯着屏幕看，相当于听了一场。卡塔尔逼平了瑞士。6点多好像还有一场巴西与摩洛哥的比赛，比分是1:1。 这些比赛现在很难让人兴奋。世界杯的总体观感不够刺激，还是强队的密度太低，因为扩充到了48队。\",\"date\":\"2026-06-14T07:57:20.000Z\",\"dateKey\":\"2026-06-14\",\"url\":\"/notes/world-cup-first-impressions-2026-06-14\",\"tags\":[\"世界杯\",\"足球\",\"观赛\"]},{\"key\":\"post:spurs-finals-ended-2026-06-14\",\"section\":\"essay\",\"title\":\"总决赛结束以后\",\"excerpt\":\"今天的NBA总决赛结束了。马刺队最后一场的过程和前几场差不多：第一节，或者说上半场，他们能够抢到开局优势；到第三节开始被一点一点地吃掉；到第四节被逆转，最后输掉比赛。 这5场比赛，差不多每一场都是这种方式。只是第三场他们侥幸保住了最后的优势；到第四场，更是耻辱地被逆转了29分。这一场的激烈程度和之前差不多。大比分是1:4，尼克斯也不能说赢得很轻松，不过他们确实拿出了一种很难形容的统治力。 今天这场比赛中，文班亚马、卡斯尔和福克斯表现得都比较一般。只有迪伦·哈珀的表现要好一些，尤其是比赛前段，算得上是超水平发挥。但也不能说是超水平，我感觉他本身水平就很高。只不过在第四节最后，上篮、发球都有一些没处理好的地方，还可以继续提高。 他最终拿到了25分，算是总决赛的代表作。他在过去四轮系列赛中，每一轮至少都有一场非常高水平的表演。我感觉下个赛季，一个巨星要呼之欲出了。希望马刺队不要不识好歹，多给哈珀一些机会，或者让哈珀担当一个进攻核心。 哈珀是那种四平八稳、攻防兼备的球员。我觉得他未来能担当大任务，马刺不能耽误他。马刺对文班的纵容也该收一收了。至于福克斯，我感觉马刺可以想办法处理掉。处理起来可能比较有难度，因为福克斯的薪水太高了，这对于正常球队来说都是一个巨大的负担。 目前NBA已经连续第8年出现不同的冠军了。生逢乱世，希望下个赛季马刺还能够扎进来。如果这两支球队还能进入总决赛，那就会是过去几年中，第一组能够连续两年闯进总决赛的球队。我也不知道这种混乱局面是否会持续下去，大概还会。 纽约拿到了一个来之不易的冠军。他们上一次夺冠已经是53年前了。这一次，他们以一种旋风式的打法，或者说旋风式的势头，在季后赛中一度13连胜，最终只花了19场就赢下了其中的16场。这是非常具有统治力的表现。所以马刺输给这种球队，也并不亏，没什么遗憾的吧。 马刺在这个过程中学到了非常多的东西。他们付出的代价也是…\",\"date\":\"2026-06-14T00:00:00.000Z\",\"dateKey\":\"2026-06-14\",\"url\":\"/articles/spurs-finals-ended-2026-06-14\",\"tags\":[\"NBA\",\"马刺\",\"尼克斯\",\"总决赛\"]},{\"key\":\"post:spurs-finals-game-four-collapse-2026-06-11\",\"section\":\"essay\",\"title\":\"领先29分后输掉总决赛第四场\",\"excerpt\":\"今天是6月11日，马刺和尼克斯的总决赛第四场，最后马刺106:107输掉了比赛。这将会成为一场令所有马刺球迷刻骨铭心的比赛，至少会被盘点20年，也会伴随文班一辈子。 马刺一度领先29分，结果被逆转。这算是创造了NBA历史上最大的被逆转分差纪录吧，至少在总决赛环节是这样。这场比赛的后劲真的很大。 我上午看完比赛后，逐渐接受了这个结果，后来却越想越气，越气越想。比赛的所有镜头，我都不愿意再看；比赛的所有讨论，我也不想再参与。现在已经过去五六个小时，我开始觉得可以稍微复盘一下。也没有什么可复盘的，只是想平复一下。 现在大比分是1:3，下一场是在圣安东尼奥打第五场。至于第六场，不知道还会不会有。基本上不可能再翻盘了，马刺应该已经输掉了这个总冠军。我不相信经过这种失败之后，他们还能够保持正常的斗志。 这届总决赛应该暴露了马刺很多不足，首先就是年轻。不过球队里最稳健的人，是年龄最小的迪伦·哈珀。在这个系列赛中，文班也好，卡斯尔也好，福克斯也好，还有他们的主帅，都犯了很多错误。我感觉非常失望。 他们在场上很多时候表现得还可以，到了关键时刻，总会做出一些让人困惑的事情。这是这支球队第一次打季后赛，他们却打进了总决赛，这是非常令人震撼的成就。他们又在总决赛奉献了最为愚蠢的表演。哎，好像这个世界总归是平衡的。 尼克斯会赢掉总决赛。这是他们应得的，他们做得非常完美。这是一个梦幻的赛季，尤其是在季后赛中一路打出了13连胜，直到上一场才被马刺赢下，终结了连胜。 事实上，上一场比赛马刺是在裁判明显延长哨的帮助之下才赢下来的。所以对于马刺来说，赢下那场比赛也没有什么特别值得开心的。我作为马刺球迷，并不那么开心。我感觉这个系列赛在某种程度上被裁判给毁掉了。 我从没想过领先29分还会输球。这真是历史级别的奇耻大辱。上一次给我带来如此震撼，让我当场麻痹的比赛，还是2014年世界杯，巴西1:7输给德国那一场。…\",\"date\":\"2026-06-11T00:00:00.000Z\",\"dateKey\":\"2026-06-11\",\"url\":\"/articles/spurs-finals-game-four-collapse-2026-06-11\",\"tags\":[\"NBA\",\"马刺\",\"尼克斯\",\"总决赛\"]},{\"key\":\"note:spurs-finals-game-three-2026-06-10\",\"section\":\"memo\",\"title\":\"昨天是总决赛第三场，马刺队赢球了，但这场比赛看着挺让人生气。马刺在整个系列赛里都比较让人生气。他们前两场输球，也都算是打到了最后…\",\"excerpt\":\"昨天是总决赛第三场，马刺队赢球了，但这场比赛看着挺让人生气。马刺在整个系列赛里都比较让人生气。他们前两场输球，也都算是打到了最后时刻。 第一场是最后时刻反超，结果被尼克斯一波流给带走了。 第二场是差点被带走，马刺打了一波14:0，把比分反超。到了最后9秒，文班接连犯了若干个错误，表现得非常愚蠢。这种情况下，如果按照普通人的水平来说，肯定也有情可原。不过作为一个联盟的顶级球星，犯这种错误还是不能接受的。 第三场，他们终于赢了。第二场和第三场都有极强的延长哨嫌疑。联盟为了多卖几场票，也是很拼，没办法。 第三场是在纽约的主场打，纽约尼克斯的球迷有点过于疯狂。纽约球迷应该在比赛后对远征的马刺球迷大肆发泄了一波。纽约变身哥谭市，可惜纽约没有蝙蝠侠。对马刺球迷来说，第四场还是自求多福吧。对马刺球员来说，也希望他们能够注意安全。 这个系列赛大概率会在纽约再打上G6，这能够使联盟的收益接近最大化，但也很难评。还是希望后面两支球队能够正常打球。 很多比赛正常打就很好，包括之前跟雷霆的比赛。但是后面慢慢地，好像就被裁判的哨子给主导了。过去这两个赛季，比赛总是会被轻松地拖进抢七，一直给我一种很诡异的感觉。 如果是这样，那他们前6场直接你来我往，大家温柔一点，最后第7场再正式开打不就行了吗？哎，我感觉这对这项运动是巨大的伤害。他们也不在乎这些，毕竟眼前的钱能挣到才是王道。\",\"date\":\"2026-06-10T01:59:51.000Z\",\"dateKey\":\"2026-06-10\",\"url\":\"/notes/spurs-finals-game-three-2026-06-10\",\"tags\":[\"NBA\",\"马刺\",\"尼克斯\",\"总决赛\"]},{\"key\":\"note:football-notes-2026-05-31\",\"section\":\"memo\",\"title\":\"不知不觉又到了这个月的最后一天。今天是31日，也是周末。\",\"excerpt\":\"不知不觉又到了这个月的最后一天。今天是31日，也是周末。 欧冠决赛，巴黎在点球大战中击败了阿森纳，拿到了欧冠冠军。这样一来，他们成为继皇马之后，又一个蝉联欧冠的球队，算得上开创了巴黎王朝吧。 阿森纳表现得也不错，他们一开局就进了一个球，整体表现也非常积极。虽然整场比赛较为沉闷，但是对于观众来说，恐怕还是充分感受到了欧冠决赛的紧张气氛。 我非常遗憾，因为没有收看这个比赛的渠道。我只是在B站上看了几个盗播，后来索性放弃了，直接躺在床上，听一个B站up主的语音解说。我也是在半睡半醒之间，听完了这场比赛。 与足球相关的另一件事，是利物浦解雇了斯洛特。下个赛季将会有一个新的主帅来接管这支球队，希望能够把利物浦带出当前的泥潭吧。 足球赛事目前算是告一段落了。接下来大概有两周的休息时间，因为世界杯将在6月12号开打。不过这届世界杯，我看了一下，总共40天的比赛，其中前20天都是小组赛，后面20天才是淘汰赛。也就是说，进入7月份之后，才进入32强淘汰赛。所以我感觉，后面的比赛才更像正式的世界杯。 前面很难说会有特别令人瞩目的所谓世纪大战，更多还是给各个国家队提供一个观察和磨合的机会。但是对于中国队，或者说对于中国人来说，就没有什么意义了，因为中国队并没有进入世界杯，和意大利队一样。\",\"date\":\"2026-05-31T06:24:50.000Z\",\"dateKey\":\"2026-05-31\",\"url\":\"/notes/football-notes-2026-05-31\",\"tags\":[\"足球\",\"欧冠\",\"世界杯\",\"利物浦\"]},{\"key\":\"post:spurs-enter-finals\",\"section\":\"essay\",\"title\":\"马刺重新站上总决赛舞台：文班与一支新王朝班底\",\"excerpt\":\"这几天比较疲倦，身体状态不好，稍微能让我提起精神的就是 31 日凌晨的两场比赛：巴黎 vs 阿森纳的欧冠决赛，以及雷霆 vs 马刺的 NBA 西决抢七。两场比赛中，法国人都成了大赢家——巴黎击败阿森纳蝉联欧冠冠军，开创了自己的王朝；另一场，法国天才文班亚马率领的马刺击败雷霆，挺进 NBA 总决赛，一个新的王朝序曲仿佛已经演奏完毕。 两场比赛的赢家都是我更喜欢的那支，但看完比赛之后，反而有一种怅然若失的感觉。 尤其是马刺和雷霆的西决第七场，悬念保持到了最后一分钟。当时间走完、两队主帅握手，我没有什么特别的感觉，直到下一秒看到文班喜极而泣，才意识到是这个史诗般的西决终于完结——不仅仅是某场比赛的结束。 马刺赢了，文班赢了。他们击败了不可一世的雷霆，通过一系列令人震撼的表现征服了西部，时隔多年重新进入总决赛。 按理说这应该是一个非常兴奋的时刻，但比赛真正结束之后，我反而有一种突然释放之后的空虚感。 所有人都期待文班改变 NBA 的格局，但在这个赛季开始之前，我对他们的期望仅仅是能够进入季后赛，感受一下真正意义上的高端局，积累一些必要的经验，为后续球队的战术调整和球员的个人成长找到更加清晰的方向。 结果没想到，这下是真的体验到了真正意义上的高端局。他们已经和联盟中最强的竞争对手进行了七场的巅峰对决，并且赢了下来，打进了总决赛。他们将有机会在纽约——这个世界中心舞台——为球迷展示他们最强有力的表演。 第一场季后赛之前，我很紧张；第一场西决之前，我也很紧张。但是现在反倒无所谓了，因为我非常确信，这支马刺队已经不再缺乏任何大赛经验，他们需要的仅仅是发挥正常水平，去想办法赢得剩下的四场胜利。 这个跨度太大了，我已经感觉无力再去期待什么了，接下来好好享受吧。 其实昨晚的欧冠并没有让我很激动。我没有收看渠道，只是在 B 站上刷一些盗播的视频，基本上每三五分钟就会有一批直播间被封。我最后索性找了…\",\"date\":\"2026-05-31T00:00:00.000Z\",\"dateKey\":\"2026-05-31\",\"url\":\"/articles/spurs-enter-finals\",\"tags\":[\"NBA\",\"马刺\",\"篮球\",\"文班亚马\"]},{\"key\":\"note:about-twitter-slopper-20260525\",\"section\":\"memo\",\"title\":\"关于推特的起号专家\",\"excerpt\":\"关于推特的起号专家... 这是我见识过的最恶臭的一类人，当然也只能说“之一”，毕竟恶臭的人总能散发出不一样的恶臭气息。 现在已经对他们脱敏了，然后刷推就非常轻松。 一年前开始发推，本来感觉还挺不错的，后来就碰到各种起号的东西刷屏，让人非常焦虑。 他们好像都很成功唉，但后来又感觉怎么水平都普遍不太高的样子。 看麻了，之后看到不喜欢的就屏蔽，少争论，多拉黑... 然后就清爽多了，当然，我一直也没啥流量😂\",\"date\":\"2026-05-25T10:59:24.000Z\",\"dateKey\":\"2026-05-25\",\"url\":\"/notes/about-twitter-slopper-20260525\",\"tags\":[]},{\"key\":\"note:spurs-thunder-game-three-2026-05-23\",\"section\":\"memo\",\"title\":\"5月23日上午看了一场NBA比赛：马刺与雷霆的第三场。马刺输掉了，他们表现得不好。开局还不错，是5:0，但后面应该一度落后15分…\",\"excerpt\":\"5月23日上午看了一场NBA比赛：马刺与雷霆的第三场。马刺输掉了，他们表现得不好。开局还不错，是5:0，但后面应该一度落后15分，非常被动。我们状态不太好，最后输了15分。这场比赛里，马刺很多球员都表现出了疲倦状态，尤其是替补席，彻底被雷霆打爆了。 马刺需要做出积极调整。他们在这场比赛中暴露出了板凳深度远不及雷霆的问题。现在比分是1:2，下一场必须得赢，不然恐怕很难再扭转局势了。\",\"date\":\"2026-05-24T02:13:20.000Z\",\"dateKey\":\"2026-05-24\",\"url\":\"/notes/spurs-thunder-game-three-2026-05-23\",\"tags\":[\"NBA\",\"马刺\",\"雷霆\",\"季后赛\"]},{\"key\":\"post:spurs-thunder-double-overtime-2026-05-21\",\"section\":\"essay\",\"title\":\"马刺与雷霆的双加时，以及重新看NBA\",\"excerpt\":\"5月19日早上，我在KFC看了一场NBA比赛，看得很兴奋，那就是马刺与雷霆的经典对决。 为了看这场比赛，我开了一个咪咕的NBA会员。它的球队通是20块钱还是25块钱，不过第一个月只有12块钱，后面我会关掉。毕竟我不可能一直看NBA，而且NBA现在只剩一个月了，最后两个系列赛就要结束了。 马刺与雷霆最近那场比赛太精彩了，让我兴奋了一整天。我不断刷各种关于这场比赛的讨论，尤其是关于文班亚马和迪伦·哈珀的讨论。 最近NBA季后赛进入东西区决赛。第一场比赛，马刺击败了雷霆，尼克斯击败了骑士，各自拿下开门红。尤其是马刺与雷霆的这场比赛，堪称世纪大战。 这场比赛我从下半场开始完整地看了，它有两个加时。文班亚马拿到了44分、24个篮板的牛逼数据。他应该是奥尼尔之后，第一个在季后赛中打出这种数据的球员吧。 他在比赛中的影响力，甚至不是数据所能完全呈现的。他只有3个盖帽，但事实上，之所以只有3个盖帽，是因为对手不敢在他的防守覆盖面中轻易出手。你不出手，就没有盖帽。 对于雷霆来说，这可能就是一种生存空间的强势压迫，他们不得不采用一些自己非常不习惯的打法。这是马刺整场比赛压制雷霆的重要原因。 文班亚马打了48分钟。在这个过程中，他大概在第四节最后有一点体力问题。但到了加时赛中，似乎熬过来了，又找回了一些能量。他在加时赛中起了非常关键的作用，尤其是第一个加时赛，在球队只剩30秒、还落后3分的情况下，他一记刚过半场的三分，直接把比分扳平。这让人非常震惊。 这场比赛也导致文班亚马成了这两天被讨论很多的人。他去年6月初逛了少林寺，进行了比较规范的修行，大概持续了一周多。这段经历也成了被热议的对象。很多人觉得，这是来自东方的神秘力量，对文班亚马的成长起到了关键作用。可能确实起到了一些作用，非常有意思。 对文班亚马，我以后肯定还会持续关注。我感觉非常有趣。这也是生活的一部分：只要持续关注，总会有这样有趣的人…\",\"date\":\"2026-05-21T00:00:00.000Z\",\"dateKey\":\"2026-05-21\",\"url\":\"/articles/spurs-thunder-double-overtime-2026-05-21\",\"tags\":[\"NBA\",\"马刺\",\"雷霆\",\"文班亚马\"]},{\"key\":\"note:wembanyama-ejected-2026-05-11\",\"section\":\"memo\",\"title\":\"早上起来看NBA消息时，发现两场比赛都已经结束了。76人被尼克斯横扫了，马刺输给了森林狼。\",\"excerpt\":\"早上起来看NBA消息时，发现两场比赛都已经结束了。76人被尼克斯横扫了，马刺输给了森林狼。 马刺这一场比较大的争议是文班亚马被罚下，因为他肘击了纳兹·里德。这确实是一个典型的恶意犯规。不过这次犯规的原因，可能是森林狼不断升级防守力度，动作越来越大，文班有点不耐烦了。 年轻人还是需要调整一下。不过我估计以后在这个联盟里，这套规则体系只会让那些比较狡猾的老狐狸更吃香。我想这是比较令人失望的，也会把很多人教坏了。 还是希望文班能够调整过来。跟森林狼打成这个样子，应该也还能接受。文班下场之后，马刺好像还打了一节左右，但没有放弃，一直打到最后时刻才分出胜负，还是比较令人满意的。希望下一场马刺能够调整回来。 通常情况下，这种事情都会让文班迎来一场大爆发。再看吧，今天确实是太糟糕了。 不过这也是很有必要的一场练兵。因为如果马刺不去适应这种季后赛强度，他们是没办法在季后赛中和雷霆周旋的。雷霆是一支非常恶心的球队，防守方面小动作也很多，还是需要去适应。\",\"date\":\"2026-05-10T16:00:00.000Z\",\"dateKey\":\"2026-05-11\",\"url\":\"/notes/wembanyama-ejected-2026-05-11\",\"tags\":[\"NBA\",\"马刺\",\"森林狼\",\"文班亚马\"]},{\"key\":\"note:sports-notes-2026-05-07\",\"section\":\"memo\",\"title\":\"今天是比赛日。欧冠半决赛，拜仁和巴黎1:1打平，巴黎凭借首回合的净胜球淘汰了拜仁，进入决赛。他们将和阿森纳争夺冠军。\",\"excerpt\":\"今天是比赛日。欧冠半决赛，拜仁和巴黎1:1打平，巴黎凭借首回合的净胜球淘汰了拜仁，进入决赛。他们将和阿森纳争夺冠军。 这场比赛登贝莱打进了制胜进球，他在第3分钟就进球了。拜仁这边，凯恩到第90分钟才进球，还是有点晚了，很遗憾。 另一场是早上起来后看到的马刺和森林狼的比赛。这场比赛没有太大悬念。我开始看的时候，比分好像是44:30，马刺领先14分。等我再刷一下，比分已经到了55:30左右。那一波小高潮我错过了，不过后面分差又进一步被拉开，最后一度拉到了40分。 第一场比赛，马刺两分输给了森林狼。森林狼给马刺制造了非常高强度的压力。但现在看来，马刺还是比较有底蕴和天赋的。这一场很难说马刺特别发力，只是状态回调，就打出了这样的结果。\",\"date\":\"2026-05-06T16:00:00.000Z\",\"dateKey\":\"2026-05-07\",\"url\":\"/notes/sports-notes-2026-05-07\",\"tags\":[\"欧冠\",\"巴黎圣日耳曼\",\"拜仁慕尼黑\",\"NBA\",\"马刺\"]},{\"key\":\"note:sports-notes-2026-05-06\",\"section\":\"memo\",\"title\":\"这几天的比赛，算是进入高潮阶段了。世界杯之前要结束的赛事很多，包括NBA季后赛、欧冠和各大联赛，整体还是非常精彩的。\",\"excerpt\":\"这几天的比赛，算是进入高潮阶段了。世界杯之前要结束的赛事很多，包括NBA季后赛、欧冠和各大联赛，整体还是非常精彩的。 今天凌晨，阿森纳击败了马德里竞技，进入了欧冠决赛。明天凌晨，就是巴黎和拜仁之间的比赛，这组对决也挺让人期待的。很多人都更看好巴黎和拜仁之间的胜者，因为这两支球队这个赛季确实太强了。 但如果阿森纳最后能够夺冠，那也是一件值得庆祝的事情。他们已经太久没有拿到冠军了，多少有点需要“解渴”的感觉。作为利物浦球迷，曾经很长时间无缘联赛和欧冠冠军，对这种体验还是非常深刻的。所以希望阿森纳这个赛季能在欧冠决赛里有好的表现，更希望他们能在联赛里稳住，最终锁定冠军。 NBA季后赛第二轮已经开始了，各支球队基本都亮相了。今天湖人应该是输给了雷霆，活塞击败了骑士，这些结果大体上都算符合实力预期。 马刺第一场输给了森林狼，而且进攻打得非常差。希望他们第二场能尽快调整回来，找到感觉。\",\"date\":\"2026-05-05T16:00:00.000Z\",\"dateKey\":\"2026-05-06\",\"url\":\"/notes/sports-notes-2026-05-06\",\"tags\":[\"欧冠\",\"NBA\",\"阿森纳\",\"马刺\"]},{\"key\":\"note:sports-notes-2026-05-05\",\"section\":\"memo\",\"title\":\"体育方面我会关注。现在NBA季后赛、欧冠，还有世界杯都快到关键阶段了。欧冠明天要打半决赛第二回合。世界杯也将在下个月开始。\",\"excerpt\":\"体育方面我会关注。现在NBA季后赛、欧冠，还有世界杯都快到关键阶段了。欧冠明天要打半决赛第二回合。世界杯也将在下个月开始。 NBA季后赛第一轮已经结束了。 东部四组对决里，有三组打到了抢七。凯尔特人在3:1领先的情况下被翻盘，这非常罕见。魔术也在3:1领先的情况下被活塞翻盘。这几个抢七都挺神奇的。凯尔特人这算是被“黑七”了。 第二轮已经开始了。马刺和森林狼的比赛获得了很大的关注。这场比赛打得非常焦灼，最终森林狼104:102击败了马刺。 文班亚马这一场拿到了三双，还有12个盖帽，非常了不起。但他在进攻端太糟糕了，17投5中，只得了11分，还不如盖帽多。虽然马刺有7人得分上双，但没有一个特别突出的点来解决问题。文班在防守端表现好，但在进攻端甚至有点拖累球队。 森林狼那边，爱德华兹休战了9天之后复出。他之前是膝盖反关节，看起来应该是比较严重的伤病，但9天就复出了，挺了不起的。不过还是希望他后续能够保持健康，也不希望他为了某一场比赛勉强复出，那肯定冒着巨大风险。 森林狼打得相当好，他们给马刺上了很高的强度。对于马刺这种青年军来说，这是非常宝贵的经验。森林狼最近几年已经两次进入西决，我想他们越到季后赛，战斗力越让人惊叹。这场比赛就是一个例证。 世界杯还有转播权的问题。 好像央视和国际足联没有谈拢。国际足联开价3亿美元，央视还价6000万到8000万美元。现在距离比赛开打只有一个月了，双方还没谈拢，所以有可能会出现央视不直播世界杯的情况。 不过我感觉央视这个还价其实更合理。3亿美元实在太高了，绝对不划算。 一方面，这届赛事虽然比赛更多，但时间并不好，大部分都是凌晨和早上，对中国观众非常不友好。另一方面，中国队也没有参加。而且现在这个年头，大家经济条件可能也不太好。\",\"date\":\"2026-05-04T16:00:00.000Z\",\"dateKey\":\"2026-05-05\",\"url\":\"/notes/sports-notes-2026-05-05\",\"tags\":[\"NBA\",\"马刺\",\"森林狼\",\"世界杯\",\"转播权\"]},{\"key\":\"note:sports-notes-2026-04-29\",\"section\":\"memo\",\"title\":\"这两天，尤其是昨天夜里，我睡得比较晚。当时已经快4点钟了。我打开手机一看，发现巴黎圣日耳曼和拜仁慕尼黑的比赛还在直播。\",\"excerpt\":\"这两天，尤其是昨天夜里，我睡得比较晚。当时已经快4点钟了。我打开手机一看，发现巴黎圣日耳曼和拜仁慕尼黑的比赛还在直播。 当时比分是2:1，比赛进行了30多分钟。不过我犹豫了一下，最终还是决定不看了。一方面是我试着去刷新资源，但一直找不到直播链接，没办法正常看；另一方面，我那个时候的状态也确实太差了。 早上起来后，发现最终比分居然是5:4。等于错过了一场非常精彩的进球大战，还是挺遗憾的。 但如果我真的把整场比赛看完，我估计自己也快猝死了。太可怕了。这种失眠的体验真是糟糕。 篮球这边，今天早上看到马刺又击败了开拓者，这样他们就4:1晋级第二轮了。 他们下一个对手会是掘金和森林狼之间的胜者。 到了第二轮，因为那两支球队现在都有比较严重的伤病，所以对马刺来说，可能是一个相对不错的对位。因此现在很多人都会期待他们进一步打进西决，去和雷霆这样的球队对垒。 这几场比赛里，马刺打出来的风格挺让人惊艳的。你很难摸清楚，最后真正终结你的到底是谁。 文班亚马的核心作用，主要体现在防守端；进攻端则有点百花齐放的感觉，好像谁都能打。这种体验挺梦幻的。 他们毕竟是第一次打季后赛。而且第一轮打的是开拓者，很难说有特别高的强度。真正面对巨大压力的时候，表现到底会怎样，还有待观察。 但至少目前来看，这是一个非常令人满意的态势，也让人充满遐想。\",\"date\":\"2026-04-28T16:00:00.000Z\",\"dateKey\":\"2026-04-29\",\"url\":\"/notes/sports-notes-2026-04-29\",\"tags\":[\"足球\",\"欧冠\",\"NBA\",\"马刺\",\"季后赛\"]},{\"key\":\"note:nba-playoffs-2026-04-27\",\"section\":\"memo\",\"title\":\"4月26日森林狼和掘金那场比赛，森林狼虽然赢了，但他们损失了爱德华兹和迪文岑佐，还是挺悲催的。\",\"excerpt\":\"4月26日森林狼和掘金那场比赛，森林狼虽然赢了，但他们损失了爱德华兹和迪文岑佐，还是挺悲催的。 现在他们已经3:1领先了，有机会一鼓作气拿下系列赛。 不过今天整体比赛观感比较一般，没有25日那几场那么精彩。当然，也不可能场场都精彩。 今天，马刺3:1领先开拓者。马刺在文班亚马复出之后，轻松打爆了开拓者。 虽然开拓者一度领先了19分，但最后还是输了20分左右。能看出文班的统治力。 第一轮总体还是挺精彩的。 但接下来第二轮，可能很难有特别好的预期。那些有机会晋级的强队，现在基本都出现了比较严重的伤病。\",\"date\":\"2026-04-26T16:00:00.000Z\",\"dateKey\":\"2026-04-27\",\"url\":\"/notes/nba-playoffs-2026-04-27\",\"tags\":[\"NBA\",\"季后赛\",\"马刺\",\"森林狼\",\"掘金\"]},{\"key\":\"post:spurs-young-core-playoffs-2026-04-25\",\"section\":\"essay\",\"title\":\"马刺与开拓者第三场：年轻人已经做好了准备\",\"excerpt\":\"今天中午我还看了一场NBA季后赛。先是看了湖人队与火箭队的比赛，非常精彩。湖人在两个核心缺阵的情况下，现在已经3:0领先火箭了。 尤其是詹姆斯，已经40多岁了，依然打出了统治级的表现。虽然没有年轻时候那种毁天灭地的感觉，但依然足够压制比赛。 火箭队也挺令人感动的，他们特别拼。湖人这边，詹姆斯在加时赛里的拼抢非常积极，真的很难想象他这种地位的球员，会像一个蓝领一样去拼。 接下来我又看了一下马刺与开拓者的比赛。 文班亚马在上一场比赛里受伤，这场比赛继续缺席。第三节的时候，马刺一度落后10多分。当时我感觉要完了，因为如果这场输掉，下一场再输，那就可能1:3了。等文班第五场回归，局面会非常被动。 不过后来我刷新比分的时候，发现已经追上来了，比分大概是84:83。然后我就打开视频直播看了一下，还是非常震撼。 马刺的新秀迪伦·哈珀表现出了极高的水准，最后拿到了27分。卡斯尔作为一个二年级球员，也拿到了33分。这两个年轻人的表现非常惊艳。 最终马刺在第四节锁定了胜局，击败了开拓者，2:1领先。这样，文班亚马就可以继续安心养伤了。或许下一场他可以考虑替补复出，先适应一下比赛节奏。 经过这一轮系列赛，我感觉马刺这样一支缺乏经验的球队，已经做好了准备。 接下来他们还需要挑战更强的球队。第二轮有可能打雷霆，也有可能打掘金，或者森林狼。这些球队的季后赛经验都非常丰富，挑战性很大。 但经验似乎并没有成为马刺的软肋。 我对他们接下来的比赛，还是有很大的期待。 感觉一个新的时代即将降临。现在马刺已经有了一个三年级的核心，一个二年级的二当家，再加上一个一年级的三当家，这个组合的雏形已经形成了。 很多人会想到当年的GDP组合，也有人会想到曾经的雷霆三少。当年那三个人也是各自相差一年，非常年轻的时候就已经打出了很高的水准。\",\"date\":\"2026-04-25T00:00:00.000Z\",\"dateKey\":\"2026-04-25\",\"url\":\"/articles/spurs-young-core-playoffs-2026-04-25\",\"tags\":[\"NBA\",\"马刺\",\"开拓者\",\"迪伦·哈珀\",\"卡斯尔\"]},{\"key\":\"note:busy-gaps-rumination-2026-04-07\",\"section\":\"memo\",\"title\":\"忙碌、空档与真正热爱之事\",\"excerpt\":\"有时候我越来越觉得，忙碌本身是一件很重要的事。 因为只要一停下来，哪怕只是稍微回顾一下过去，很多伤感的体验就会立刻被勾起来。前两天我整个人非常疲倦，就想休息一下，结果一闲下来，就忍不住开始想过去的事情，然后越想越觉得遗憾很多。 一个人状态比较糟的时候，尤其是心理状态或者现实处境都不太好的时候，如果又对眼前真正该做的事情产生了很强的抵触，那接下来就很容易出问题。你会强行让自己闲下来，可一旦闲下来，又会掉进一种很困扰的状态里，开始不断回顾过去，越想越深，甚至会滑到那种接近深渊式的话题里去。这种思考并不会带来什么真正的解决，更多只是把人拖进很强的内耗里。 所以这种时候，人还是需要找到一些事情，把这些空档填上。但麻烦也就在这里：如果你已经对手头那些具体事务产生了厌恶，那事情就会变得更糟。你一方面想找回忙碌感，另一方面，那些能让你忙起来的事本身又已经让你疲惫不堪，甚至带着一点像 PTSD 一样的反感。你试图靠忙碌把自己拉回来，结果这种糟糕的忙碌体验又会把你重新推回更深的内耗里。 我现在越来越觉得，一个人还是需要有一些自己真正热爱的事。那种事情得是你可以持续投入、而且不会轻易厌倦的。只有这种东西，才有可能在你疲倦的时候，把你从那种下坠状态里拉出来。从这个角度看，找到这种事情，对心理健康可能是非常重要的。\",\"date\":\"2026-04-06T16:00:00.000Z\",\"dateKey\":\"2026-04-07\",\"url\":\"/notes/busy-gaps-rumination-2026-04-07\",\"tags\":[\"心理健康\",\"内省\",\"忙碌\",\"情绪\",\"内耗\"]},{\"key\":\"note:spurs-60-wins-2026-04-07\",\"section\":\"memo\",\"title\":\"NBA常规赛已经快到尾声了。马刺拿到了60胜，这个成绩很厉害。不过文班亚马今天受了点伤，只打了16分钟。我不太确定他后面还能不能…\",\"excerpt\":\"NBA常规赛已经快到尾声了。马刺拿到了60胜，这个成绩很厉害。不过文班亚马今天受了点伤，只打了16分钟。我不太确定他后面还能不能继续打。按我的猜测，至少还会上场一场。只要再满足参评条件，他今年就还能参加各种奖项评选。\",\"date\":\"2026-04-06T16:00:00.000Z\",\"dateKey\":\"2026-04-07\",\"url\":\"/notes/spurs-60-wins-2026-04-07\",\"tags\":[\"NBA\",\"马刺\",\"文班亚马\"]},{\"key\":\"note:spurs-nuggets-2026-04-05\",\"section\":\"memo\",\"title\":\"今天看了不少NBA相关内容，因为有一场很受关注的比赛：马刺打掘金，也就是文班亚马和约基奇这两个顶级中锋的对决。比赛确实挺精彩，最…\",\"excerpt\":\"今天看了不少NBA相关内容，因为有一场很受关注的比赛：马刺打掘金，也就是文班亚马和约基奇这两个顶级中锋的对决。比赛确实挺精彩，最后是掘金加时两分险胜马刺。\",\"date\":\"2026-04-04T16:00:00.000Z\",\"dateKey\":\"2026-04-05\",\"url\":\"/notes/spurs-nuggets-2026-04-05\",\"tags\":[\"NBA\",\"马刺\",\"掘金\",\"文班亚马\",\"约基奇\"]},{\"key\":\"note:sharp-comments-have-a-cost-2026-03-31\",\"section\":\"memo\",\"title\":\"我最近经常刷到一个之前挺喜欢看的博主对张雪峰进行输出，连着很多天揪着不放，好像是在探究某种真理，又像是在蹭热度。我有点看不下去。\",\"excerpt\":\"我最近经常刷到一个之前挺喜欢看的博主对张雪峰进行输出，连着很多天揪着不放，好像是在探究某种真理，又像是在蹭热度。我有点看不下去。 这让我反思，搞锐评不是一种很好的做人方式，因为会把人变得刻薄、不依不饶。 锐评别人本身无所谓，只要有理有据，逻辑上说得通，也不是不能接受。但是这种做法反过来会对自己的思维方式进行某种强化学习，变得一根筋、爱抬杠，这样的结果甚至不见得能够训练所谓的批判性思维，因为本身就是把自己在往二极管的维度上硬拉。 我之前挺喜欢该博主的锐评。但最近让我不适的地方可能在于，以前是针对一些抽象的现象进行批判，但是这几天完全是针对一个具体的人进行批评，有一种在”撕咬“的感觉 如果人家活着，这么进行批判，我可能也没觉着不对。但是人家去世了，没办法回击。这样纠缠不是说能对别人怎么样，我相信张雪峰早就接受了任人评说的这个现实。这种不依不饶只是显得自己很小气。\",\"date\":\"2026-03-30T16:00:00.000Z\",\"dateKey\":\"2026-03-31\",\"url\":\"/notes/sharp-comments-have-a-cost-2026-03-31\",\"tags\":[\"锐评\",\"反思\",\"批判性思维\",\"张雪峰\"]},{\"key\":\"note:ai-fast-slow-skills-2026-03-29\",\"section\":\"memo\",\"title\":\"AI 的能力与许多专业技能是解耦的。有一定的专业素养，能帮助人更好地利用 AI，而不是说有了 AI，这些能力就变得次要。\",\"excerpt\":\"AI 的能力与许多专业技能是解耦的。有一定的专业素养，能帮助人更好地利用 AI，而不是说有了 AI，这些能力就变得次要。 这里需要区分“快能力”与“慢能力”。 快能力是那些 AI 可以加速培养的——比如写代码、查资料、学习新框架，借助 AI 的反馈循环明显缩短了。我去年开始大规模 vibe coding，早期写的东西几乎都是屎山，后来慢慢有了经验，这个过程中 AI 确实帮了不少忙。模型本身也有差异，之前用 Sonnet 3.5/4 很难不生成一堆垃圾，GPT-5 在这方面靠谱许多。但即便如此，代码质量的基本意识还是得自己建立，不能完全依赖 AI。 慢能力则不同。它需要慢功夫，需要身体性的投入和长期的反馈循环，AI 不但帮不上忙，反而在制造绕过这个过程的诱惑。比如数学公式的推导——推导的价值不在结果，而在过程中建立起的直觉。再比如写字，笔迹是身体记忆和审美判断的结合，完全不可外包。 有了 AI 之后，快能力的门槛在降低，慢能力只会变得更加稀缺。\",\"date\":\"2026-03-29T12:00:00.000Z\",\"dateKey\":\"2026-03-29\",\"url\":\"/notes/ai-fast-slow-skills-2026-03-29\",\"tags\":[\"AI\",\"能力\",\"写作\",\"数学\",\"编程\",\"反思\"]},{\"key\":\"post:the-great-zhang-xuefeng\",\"section\":\"essay\",\"title\":\"绿灯熄灭：张雪峰与他的时代\",\"excerpt\":\"2026年3月24日中午，张雪峰在苏州公司的健身房跑步时突发心脏骤停。同事将他送往医院，经数小时全力抢救，未能挽回。下午近四时，确认死亡。四十一岁。 消息传开的速度很快。这并不意外。他生前在不同场合说过，希望有一天自己离开的时候，各大平台上会出现一个热搜叫\\\"张雪峰死了\\\"，希望能成为一代学生和家长的回忆。据广泛流传的说法，他还曾在微博上表示，猝死是他心目中比较理想的一种死法。 现在看，一语成谶。 但这篇文章不打算从悼念写起。张雪峰是一个足够复杂的公共人物，他值得一种比悼念更认真的对待方式。我想做的事情比较简单：把他放进一个文学坐标里，看看他的故事在多大程度上与另一个人的故事构成映射。 那个人是杰伊·盖茨比。 这个类比乍看有些突兀。一个是二十世纪美国文学最著名的悲剧人物，一个是中国互联网时代的头部网红。但如果暂时放下表面身份的差异，只看故事的结构——盖茨比从中西部的穷小子变成西卵豪宅的主人，张雪峰从齐齐哈尔铁路工人家庭的孩子变成身家近十亿的行业头部——从底层崛起、疯狂追逐、被时代托举又被时代消耗，两者之间的相似性比预想中要深。 当然，映射不是等号。盖茨比的故事是完整的，起承转合一样不缺。张雪峰的故事不是。他的剧本写到了高潮刚过、转折将至的地方，然后灯灭了。这个未完成的状态，本身就是他和盖茨比之间最大的不同，也是最耐人寻味的地方。 理解盖茨比，必须先理解黛西。 盖茨比所做的一切——买下西卵的豪宅、夜夜笙歌的派对、精心构建的上流身份——全部指向同一个目标：重新赢得黛西·布坎南的注意力。黛西是他行为的原动力，也是他悲剧的根源。黛西代表了盖茨比对自身命运的全部想象。 但黛西身上有一个致命的特征：她的注意力永远是暂时的、有条件的、随时可以收回的。她不是一个可以被\\\"赢得\\\"的人，她只是一个可以被暂时吸引的人。盖茨比倾其所有去追逐的，从一开始就不是一个可以稳定占有的东西。 张雪峰的黛西是流量。…\",\"date\":\"2026-03-25T14:57:00.000Z\",\"dateKey\":\"2026-03-25\",\"url\":\"/articles/the-great-zhang-xuefeng\",\"tags\":[\"张雪峰\",\"盖茨比\",\"时代\",\"死亡\",\"教育\"]},{\"key\":\"post:translation-pipeline-journey\",\"section\":\"build\",\"title\":\"造了一条翻译流水线，然后把它关掉了\",\"excerpt\":\"我有一个个人知识库，里面有一个目录专门存放从网上收藏的外文文章，积攒了不少播客访谈和演讲的文字稿。我习惯把这些东西翻译成中文再读，一方面是阅读速度更快，另一方面是翻译本身就是一种深度阅读——你不得不去理解每一句话到底在说什么。 我之前经常直接把东西甩到chatbot中直接翻译，这一套当然问题不大，但是存在潜在的对内容压缩的风险。另外一点，我有超多配额的国产大模型，心想其实翻译不那么考验大模型的能力，因此不妨开发一套skills，来直接对内容进行翻译。当然，有这种方法直接短文章没问题，几千字的博客帖子扔进去，几分钟就出来了。但当我把一篇 超长的YouTube视频脚本或者一本书丢过去，就很难避免它翻到一半就开始丢内容、混术语，翻译质量明显下降。当然，还有一种情况：直接卡住，几个世纪过后告诉你失败... 于是我决定写一个分片翻译系统。 核心思路：把长文按章节标题切成若干片段，每片独立调用一次 LLM，翻译完再拼起来。每片有自己独立的上下文，不会溢出。 但\\\"切开再拼回去\\\"这件事，远没有听起来那么简单。最直接的问题是：切开之后，后一片看不到前一片的内容，怎么保证术语统一？怎么保证前后文衔接自然？ 我用了两个机制。第一个是术语表接力：每片翻译完成后，脚本会从输出中提取新出现的术语对照（比如 \\\"scaling law → 规模定律\\\"），存入一个不断增长的术语表，注入到下一片的提示词里。这样模型在翻译后续片段时，已经知道前面把哪个词翻成了什么。 第二个是重叠段落：把前一片译文的最后三段文字带给下一片，标注\\\"这是前文结尾，不要重复翻译，仅用于衔接语气\\\"。这样模型能感知到前文的口吻和节奏，避免每片的开头都像是文章的第一段。 系统写出来之后，拿几篇标准的博客文章测试，运行得很顺畅。但实际使用中很快遇到了各种边界情况。 第一个是播客文字稿的时间戳。YouTube 自动转录出来的文字稿里密布着 \\\"0…\",\"date\":\"2026-03-25T00:00:00.000Z\",\"dateKey\":\"2026-03-25\",\"url\":\"/articles/translation-pipeline-journey\",\"tags\":[\"技术实践\",\"翻译\",\"LLM\",\"工程复杂度\",\"自动化\",\"弃用\"]},{\"key\":\"note:zhang-xuefeng-death-reflection-2026-03-25\",\"section\":\"memo\",\"title\":\"张雪峰去世，讨论度很高。他是运动时突发心脏骤停，半个小时后才送到医院，下午3点半去世，41岁。\",\"excerpt\":\"张雪峰去世，讨论度很高。他是运动时突发心脏骤停，半个小时后才送到医院，下午3点半去世，41岁。 对死亡，我或许有一点敬畏，但也只是单纯地感慨而已。我对他不会额外生出太多怜悯。他自己以前说过，猝死是他心目中比较理想的一种死法，希望将来能以这样的方式结束生命。这是他2018年发过的微博。从这个角度看，某种意义上，也算死得其所。 他还在直播里说过，希望自己死的那一天能上热搜，希望人们回忆起他的时候，会觉得他标记过一个时代。他很典型，就是那种天然的网红人格，非常清楚自己想在公众那里留下什么形象。现在看，也是一语成谶。 他死于运动，这种死因，我感觉和很多所谓“成功人士”对运动的理解有问题有关。他们很喜欢运动，也很强调成绩，但对运动的理解常常是畸形的。总觉得锻炼本身就等于提高身体素质。 可实际上身体素质的提升，前提是训练和恢复要一起成立。很多人只看到锻炼，不重视休息，最后就是在透支自己。张雪峰跑过马拉松，成绩也不错，但他可能把这种成绩当成了身体状态良好的证据。我不否认那说明他有一定体能基础，但我不觉得这就是健康生活方式。 真正健康的生活，还是得放在更完整、更系统的框架里去看，尤其是休息，应该被放在首位。但像他这种卷王型的工作狂，恐怕很难接受这一套。他们会觉得休息是浪费时间，是对生命的挥霍。可很多时候，真正毁人的，恰恰就是这种想法。 关于张雪峰，我自己的看法一直比较明确。他是时代的宠儿。2016年开始爆火，到现在差不多整整十年，做到了头部网红，赚到了很多钱，事业上也确实非常成功。但我一直不觉得他真正改变过这个时代。更准确地说，是这个时代把他推到了前面，也成就了他。 而且就算他继续活着往前走，这个时代本身也可能会慢慢离他远去。因为今天大家通过高考、填志愿、选专业，试图换一个好未来的那套逻辑，本身就在变弱，甚至可能正在终结。所以从这个意义上说，他在这个节点离开，未必是最糟糕的一种结局。 当然…\",\"date\":\"2026-03-24T16:00:00.000Z\",\"dateKey\":\"2026-03-25\",\"url\":\"/notes/zhang-xuefeng-death-reflection-2026-03-25\",\"tags\":[\"张雪峰\",\"死亡\",\"健康\",\"反思\",\"网红\"]},{\"key\":\"note:ai-focus-closure-2026-03-23\",\"section\":\"memo\",\"title\":\"在当前阶段，“自己想要做什么”是一个远比“AI能做什么”更值得思考的问题。\",\"excerpt\":\"在当前阶段，“自己想要做什么”是一个远比“AI能做什么”更值得思考的问题。 现在从 AI 上获得的兴奋感开始减少了。大模型技术本身似乎已经开始碰到瓶颈，模型能力好久没有显著的提高了，很多产品形态也差不多定型了。到这个阶段，我对 AI 的探索，差不多也要进入“收口”期了。 之后我应该减少对 AI 相关理论与技术本身的追踪，把更多精力转回到数学、物理和工程的细分领域问题的思考上。 大模型当然还是会继续用，它肯定会在余生中发挥很大作用。只是它已经不再是一门需要花很多精力去追着研究的东西了。它将逐渐成为一个普通的日常工具，服务于具体产出，而不是被反复拿来空转。 当前我对大模型的大致使用框架也基本固定下来了，虽然未来会有调整，但大致需求是比较确定的。 第一类是 Claude，尤其是 Opus 这种顶级模型，语言能力强，适合讨论问题、帮我出主意。第二类是 GPT，更适合做编程。再有一类是国产模型，可以拿来处理一些对质量要求没那么高的边角料工作。 对应的工具链其实也已经很多了，比如 Claude Code、OpenCode、GitHub Copilot、Codex 这些，各自都在不同场景能派上点用场。\",\"date\":\"2026-03-22T16:00:00.000Z\",\"dateKey\":\"2026-03-23\",\"url\":\"/notes/ai-focus-closure-2026-03-23\",\"tags\":[\"AI\",\"反思\",\"大模型\",\"工具\"]},{\"key\":\"note:discord-notify-test-note-2026-03-20\",\"section\":\"memo\",\"title\":\"这是一条用于测试频道推送效果的 memo note。\",\"excerpt\":\"这是一条用于测试频道推送效果的 memo note。 这里故意不写 description，目的是确认在 Telegram 卡片和 Discord embed 中，系统会自动截取正文前若干字作为简介，而不会把这些内容误当成标题。 如果你在频道里看到了日期标题、正文摘录和正确链接，就说明当前这套通知链路已经基本打通了。\",\"date\":\"2026-03-20T13:10:00.000Z\",\"dateKey\":\"2026-03-20\",\"url\":\"/notes/discord-notify-test-note-2026-03-20\",\"tags\":[\"测试\",\"Telegram\",\"Discord\",\"推送\"]},{\"key\":\"note:ai-pricing-uncertainty-2026-03-20\",\"section\":\"memo\",\"title\":\"AI 工具定价的不确定性困局\",\"excerpt\":\"AI 工具定价的不确定性困局 就像电费——发电设施成本很高，一旦建好之后，发电成本也没那么贵。那么如何定电价呢？你不可能用煤炭成本来计算吧，那水电呢？ 大模型的 token 成本本身就是一个非常难以量化的东西。现在各大 AI 厂商普遍处于亏损推广阶段，没有一个对 token 实际成本进行准确核算的标准，可能这本身就是一个专门的学问。 除了成本，另一个需要思考的就是最终的市场价格。大家可能更期望有个稳定的感觉。比如按请求数计费，对用户来说比较安心，但是对商家来说就不那么稳定了。好像不确定性，双方至少有一个要来承担。 如果是按 API 价格来算，那就反过来了——用户会陷入某种焦虑之中，因为他们很难去预期自己的工作会如何消耗 token；而商家可以通过定价确保自己稳赚不赔。 这就是需要用户与厂家进行博弈的地方了。这种博弈，双方肯定都希望自己能够获得更大的收益的同时，规避掉不确定性带来的糟糕感觉。设计定价方式，在这里需要进行权衡。\",\"date\":\"2026-03-20T10:00:00.000Z\",\"dateKey\":\"2026-03-20\",\"url\":\"/notes/ai-pricing-uncertainty-2026-03-20\",\"tags\":[\"AI\",\"定价\",\"商业模式\",\"Token\"]},{\"key\":\"note:ai-coding-like-driving-2026-03-20\",\"section\":\"memo\",\"title\":\"我现在感觉，用 AI 编程有点像在开车。\",\"excerpt\":\"我现在感觉，用 AI 编程有点像在开车。 你先设定一个目标，然后这个 AI agent 就在你的配合下，把你往那个方向带。中间会不会抛锚，就看这个\\\"车\\\"本身靠不靠谱。 目前我的体验是，GPT-5.4 算是一辆比较稳的车。你主要要做的是握住方向盘，不用太担心它半路掉链子，或者突然把你带沟里。整个过程里，你更多是在掌控方向，而不是在救火。 但你还是需要一张路线图。这个路线图可以自己定，也可以让它帮你规划。它在这方面其实做得不错，能帮你把路径梳理清楚，还能提前指出一些可能踩坑的地方，给出一些有参考价值的提醒。 所以这个过程，本质上还是人和 AI 的协同。人不是被替代掉的，而是角色变了。比如有时候\\\"地图\\\"本身是有问题的，可能过时，或者和现实情况不一致，AI 就可能把你带到一些奇怪的地方。这种时候就需要人出来修正路径。 大多数时候，人要做的其实很简单：握好方向盘，处理偶发情况。正常驾驶里，真正的紧急情况并不多。更重要的是你和这辆\\\"车\\\"之间有没有形成默契，这个需要时间去磨合。 对我来说，我和 GPT-5.4 的磨合是比较顺的，用起来很自然。和 Claude 的磨合就比较差，基本谈不上形成协同，体验也不太理想。 至于其他一些模型，比如 GLM、MiniMax，现在更像是玩具车，还不太成熟。有时候甚至分不清是你在控制它，还是它在带着你乱跑。\",\"date\":\"2026-03-20T07:00:00.000Z\",\"dateKey\":\"2026-03-20\",\"url\":\"/notes/ai-coding-like-driving-2026-03-20\",\"tags\":[\"AI\",\"编程\",\"GPT-5.4\",\"Claude\",\"协同\"]},{\"key\":\"post:notification-card-normalization-and-discord-sync\",\"section\":\"build\",\"title\":\"通知卡片规范化与 Discord 同步推送\",\"excerpt\":\"最初是要解决一个小问题：站内 notes 链接在 Telegram 中生成的卡片，宽度和内容密度不一致。后来，这些问题修复后，我想干脆再增加在Discord上的同步功能吧。 有些卡片能显示完整的标题和简介，有些只剩下一个日期加一行空泛的说明文字。表现上看起来像是 bug，但根源在于不同类型的 note 走的是同一套 metadata 生成逻辑，而这套逻辑并没有为\\\"没有手写简介\\\"的情况做好兜底。 从这个具体的卡片问题出发，排查逐步扩展成对整条通知链路的重新梳理——metadata 怎么拆、推送文案怎么收敛、Discord 怎么接入、以及相邻仓库怎样复用同一套设计。 排查过程中发现的第一个结构性问题是：网页详情页的标题和 Telegram 卡片的标题共用了同一套生成逻辑。对于有手写标题的文章，这没有影响；但对于 memo 类型的 note，一旦为了让卡片看起来有内容而把正文前几句话抬成标题，网页详情页的标题也会跟着变，最终导致页面上出现一段很长的\\\"标题\\\"，既不好看也不符合阅读预期。 解决办法是把这两个场景拆开。在数据模型层面，为 note 统一计算一个 previewText 字段，作为正文前若干字的标准截取结果。在此基础上，分出两个独立的函数：一个服务网页详情页本身的标题和说明，另一个只服务 Telegram 和社交卡片的 metadata。网页详情页保持日期标题或手写描述，Telegram 卡片则使用日期标题加上固定长度的正文摘要。 这一步同时也修正了 Open Graph 和 Twitter Card 的 metadata 输出。对于没有手写描述的 memo，og:description 自动取正文前若干字，不再输出空字符串；og:image 也统一指定了一张固定的站点图片，减少卡片布局因来源图片不同而产生的尺寸波动。 站点 metadata 调整完之后，推送脚本本身也需…\",\"date\":\"2026-03-20T00:00:00.000Z\",\"dateKey\":\"2026-03-20\",\"url\":\"/articles/notification-card-normalization-and-discord-sync\",\"tags\":[\"技术实践\",\"Telegram\",\"Discord\",\"通知推送\",\"metadata\",\"工程实践\"]},{\"key\":\"note:claude-academic-discussion-2026-03-19\",\"section\":\"memo\",\"title\":\"今天用 Claude 做了一些偏学术的讨论，体验出乎意料地好。\",\"excerpt\":\"今天用 Claude 做了一些偏学术的讨论，体验出乎意料地好。 我现在越来越觉得，Claude 更像是一个偏文科取向的模型。让它写代码，有时候会觉得不太跟手；但一旦进入讨论状态，尤其是理论性、概念性比较强的问题，它的表现很突出。昨天夜里和 Opus 聊了一些偏生活化的话题，关于人生、观念变化之类，甚至有些被触动。 今天换了个方向，开始聊一个我专业领域里的工程问题。一开始觉得问题不大，但聊着聊着就发现，各种方法可以不断叠加，思路能铺得很开。科研有时候就是这样——一些看起来不大的问题，可以被层层拆解、反复推演，最后撑出一整套复杂体系，但真正能落地的部分，反而未必多。 不过和 Claude 聊这些，本身就很有价值。我从最基础的问题开始问起，一点点往上推：这件事本质上是在解决什么，怎么跟实际结合，设计阶段要考虑什么，怎样让结果更优。问到后面，连我自己都觉得问题越来越\\\"高端\\\"了。 后来让它帮我提炼科学问题和工程问题，它一口气列了十七八个，覆盖面非常全。接着让它整合成研究课题，整理出了八个方向——这个量级，已经够支撑一篇博士论文了。最后我选了其中三个，让它分别给出提纲式的研究框架和关键文献，整个过程一气呵成，输出的细腻程度也让人意外。 用 Claude 来做科研选题、问题拆解这类工作，效率确实很高。它擅长的不是替你写代码，而是帮你把思路展开、把问题结构化。这可能才是它最有价值的用法。 另外，今天 Claude Code 和 Codex 的额度都重置了，总算结束了这几天卡额度的状态。\",\"date\":\"2026-03-19T14:00:00.000Z\",\"dateKey\":\"2026-03-19\",\"url\":\"/notes/claude-academic-discussion-2026-03-19\",\"tags\":[\"Claude\",\"AI\",\"科研\",\"学术讨论\"]},{\"key\":\"post:instant-view-in-chaos\",\"section\":\"build\",\"title\":\"Instant View 踩坑记：折腾了一整天，答案是「等一下」\",\"excerpt\":\"事情从一个烦人的现象开始：同一个域名下的文章链接，发到 Telegram 里，有时候底部有 INSTANT VIEW 按钮，有时候没有；有时候点进去能正常阅读，有时候是白屏。 我以为搞个把小时就能解决。结果折腾了一整天。 最先怀疑的是 Instant View 的匹配规则。打开一看，果然——之前的规则全靠 CSS 类名来定位内容，什么 text-xl、mt-16 之类的。这些名字是 Tailwind 生成的样式标记，前端随便改一下排版，匹配就悄悄失效了，连个报错都没有。 于是我做了一件早就该做的事：在页面模板里加了一组 data-iv-* 属性。标题是 data-iv-title，正文是 data-iv-body，作者和发布时间也各有标记，导航栏之类不该被抓的元素标上 data-iv-ignore。然后 IV 规则只认这些语义标记，不再去猜页面长什么样。 改完之后，在 Telegram 的 IV 编辑器里一测，规则确实稳定了。我想这事应该差不多了吧。 没差不多。 我忘了一件事：这个域名下不只跑着我的笔记站，还有主站的文档页面，HTML 结构完全不同。我当时使用的这套域名模板需要同时覆盖两种页面。 所以我的规则得同时覆盖两种完全不同的页面结构。最后用了一个“先后匹配”的方案：先试 data-iv-*，匹配不到就回退到主站那套 docs-content + md-theme-amp 的结构。不算优雅，但能用。 到这里我又觉得差不多了。 然后进入了最耗时的一个环节。 规则改好了，用 t.me/iv?url=...\u0026rhash=... 裸链接手动粘贴到聊天里，IV 正常弹出。但 Bot 通过 API 发出来的消息，就是另一回事了。 我试了各种写法：把 IV 链接嵌在消息文本里、做成 inline 按钮、拆成两条消息、用 link_preview_options 指定预览 URL………\",\"date\":\"2026-03-14T00:00:00.000Z\",\"dateKey\":\"2026-03-14\",\"url\":\"/articles/instant-view-in-chaos\",\"tags\":[\"Telegram\",\"Instant View\",\"GitHub Pages\",\"部署\",\"调试\"]},{\"key\":\"post:open-source-cockroach-economics\",\"section\":\"build\",\"title\":\"腾讯SkillHub:开源蛋糕里的蟑螂\",\"excerpt\":\"腾讯搞了个 SkillHub，号称\\\"专为中国用户优化的 AI Skills 社区\\\"。我没有打开这东西，不想浪费时间，也不想动情绪，但据说有一万三千多个 skill，绝大多数是从 ClawHub 直接搬过来的。 他们大概率会如过去经常做的那样，一通经典的“混元形意...组合拳”：套一层中文搜索，挂一个国内 CDN，再把自家的腾讯文档、QQ 浏览器、腾讯地图塞进去凑数，通稿一发——\\\"生态建设\\\"。 我有时候其实挺抵触开源的。我抵触的是它对流氓太友好。再好的一盘蛋糕，都不够几个蟑螂造的。 这事严格来说不算抄袭。协议合规，署名保留，代码没改，法律上挑不出毛病。但恶心就恶心在这儿——它一个大厂，躲在灰色地带，把别人的劳动成果变成了自己商业版图的一块砖，还要美其名曰”造福大家“。一家市值几万亿的公司，AI 战略的核心动作是\\\"镜像别人的生态\\\"，真的让人很不适。 我经常会思考一个问题：开源的意义到底在哪？ 许多人会说他们做开源是“用爱发电”。但这明显不现实。热情往往是短暂的，回报才能让事情变得长久。开源社区对计算机行业来说是个古老的存在，绝不可能仅仅是单纯为了情怀的利他主义。 这个问题得从经济学上去想。我了解了一下，大概有几种非常“物质”的自利机制促使越来越多的人加入到开源中来。 信号理论：能力展示的成本 我觉得 Spence 的信号理论可以用来解释这件事：开源贡献是一种 costly signal，你把代码公开展示，本质上是在劳动力市场上发出一个难以伪造的能力证明。代码质量、架构设计、问题解决能力——这些都是无法伪装的硬实力。 人力资本理论：可携带的投资 Becker 的人力资本理论也讲得通——你在公司里写的代码是 firm-specific 的，离职后很难继续直接使用；开源项目是 general human capital，可以随身携带。同样的时间投入，开源的长期 ROI 可能更高。 礼…\",\"date\":\"2026-03-13T00:00:00.000Z\",\"dateKey\":\"2026-03-13\",\"url\":\"/articles/open-source-cockroach-economics\",\"tags\":[\"开源\",\"经济学\",\"腾讯\",\"生态\",\"署名权\"]},{\"key\":\"post:telegram-instant-view-settings\",\"section\":\"build\",\"title\":\"为静态站点配置 Telegram Instant View：从页面标记到部署等待\",\"excerpt\":\"Telegram 的 Instant View（IV）可以让用户在 Telegram 客户端里直接阅读网页正文，不用跳转浏览器。对内容站来说，文章链接带上 INSTANT VIEW 按钮，阅读体验会好不少。 但要让 IV 稳定工作，特别是对部署在 GitHub Pages 上的静态站点来说，需要把页面标记、IV 规则、Bot 消息和部署时序几个环节串起来。这篇文章按操作顺序整理了关键步骤。 IV 模板需要从页面 HTML 中提取标题、正文、作者、发布时间等信息。最直觉的做法是靠 CSS 类名来定位——但这非常脆弱。你用 Tailwind 生成的 text-xl、mt-16 之类的类名随时可能因为样式调整而变化，IV 规则会悄悄失效，而且没有任何报错。 更稳妥的做法是在页面模板中加一组专用的 data-iv-* 属性： 几个要点： data-iv-title、data-iv-body、data-iv-author 分别标记标题、正文和作者 data-iv-published 放在 \u003ctime\u003e 元素上，值为 Unix 时间戳（IV 引擎可以直接解析） data-iv-ignore 标记导航栏、侧边栏、评论区等不应出现在阅读视图中的元素 同时检查一下页面的 \u003clink rel=\\\"canonical\\\"\u003e 是否包含了正确的部署子路径。如果你的站点部署在 /alpacanotes 下，canonical URL 也要带上这个前缀。这个问题浏览器不在乎，但 Telegram 在抓取和缓存时会参考 canonical。 到 Telegram Instant View Editor 编写规则。规则用 XPath 语法告诉 IV 引擎从页面中提取哪些内容。 如果你的域名下只有一套页面结构，规则很简单： 如果同一个域名下还跑着其他站点（比如主站的文档页），HTML 结构可能完全不同。IV 规则…\",\"date\":\"2026-03-13T00:00:00.000Z\",\"dateKey\":\"2026-03-13\",\"url\":\"/articles/telegram-instant-view-settings\",\"tags\":[\"技术实践\",\"Telegram\",\"Instant View\",\"GitHub Pages\",\"静态站点\",\"教程\"]},{\"key\":\"post:tool-addiction-and-focus\",\"section\":\"essay\",\"title\":\"工具上瘾与专注的稀缺\",\"excerpt\":\"我对倒腾工具这件事有一种近乎本能的执念——IDE、Vim、Obsidian、Rime 输入法，什么都想配一遍。这种冲动不像是兴趣爱好，更像是有些人夜里磨牙。倒腾工具是在释放某种说不清的压力，谈不上享受。 仔细想想，这种行为至少有三层吸引力。 第一层是即时反馈的快感。改一个配置，效果立刻可见——主题变了、快捷键顺手了、补全更聪明了。这种“小修小补、即时回报”的循环，跟刷短视频的多巴胺机制是同构的，只是披着一层“我在提升生产力”的合理化外衣。 第二层是掌控感。日常面对的事情充满不确定性——模型收不收敛、结果有没有意义、论文能不能写完。但 .vimrc 是完全可控的，Rime 的方案文件改一行就生效一行。倒腾工具提供了一种“我在掌控一切”的心理补偿。 第三层大概最核心：逃避真正困难的事。当我沉迷于 Obsidian 的插件体系时，我其实是在回避打开那个还没写完的章节。工具折腾是一种高伪装度的拖延。 回顾过去几年，我在写作工具上的轨迹是这样的： VS Code 时期，Markdown 插件试了五六款，到后来自己都分不清哪款是什么样。然后转向 Emacs，体验了 org mode，坚持了几个月，最终也放弃了。期间在 VS Code、PyCharm、Emacs 里都装过 Vim 键位插件，无一例外半途而废。 现在又到了 Vim。 每一次切换都有自己的合理理由。用 Emacs 的时候觉得笔记软件已经足够丰富，没必要在编辑器里重造轮子；用 Vim 键位插件的时候总有退路，不开心了直接关掉，恢复原来的操作方式。但把这些片段串起来看，工具本身从来不是瓶颈。真正的模式是：在不确定该往哪走的时候，用工具迁移来填充空白。 我曾经在笔记里写过一句话：“我已经失去了捣鼓这些工具的欲望。”但后来我又开始折腾 Vim。这说明那个欲望并没有消失，只是换了个对象。 目前我在用 Vim 写 Markdown。体验…\",\"date\":\"2026-03-13T00:00:00.000Z\",\"dateKey\":\"2026-03-13\",\"url\":\"/articles/tool-addiction-and-focus\",\"tags\":[\"vim\",\"写作\",\"工具\",\"自我反思\"]},{\"key\":\"note:adebayo-83pts\",\"section\":\"memo\",\"title\":\"阿德巴约单场83分之后，有记者问斯波是否要为此道歉(为了达到成就的刷分行为）\",\"excerpt\":\"阿德巴约单场83分之后，有记者问斯波是否要为此道歉(为了达到成就的刷分行为） 这件事情陷入了热烈讨论。当然，许多人希望篮球场是一个展示体育精神的舞台，但是刷分这种有点虚荣的行为又太社会... 我个人认为，83分挺好的，道啥歉呢？阿德巴约和热火队又没干什么违法的事情。 对阿德巴约来说，这是一辈子的高光。对其他球员也是一个梦寐以求的时刻，有机会冲一把，谁会经得住诱惑呢？ 我们这些普通人又何尝不希望有这样一个瞬间，甚至愿意拿一切来换取。 也可能是，当别人看完上半场甚至前三节的时候，并没有太关注。但是到他们意识到科比的记录马上就要被打破的时候，打开了电视机，看到了最后丑陋的半节比赛... 从曝光的统计效果上，可能绝大多数的关注都在那一个个很无聊的罚球上。也就是说，看完全场的人可能只有只看最后半节的10%不到。当然，更多人甚至连半节都没看到，他们只看到阿德巴约通过罚球的方式拿到了第81,82,83分... 关于阿德巴约的83分，我与Opus交流了一下，问它在检索这则消息的时候是否对它的数据储备造成了一些冲击？ 它表示，有那么一瞬间，让它感觉需要hold on一下... 不过它很快检索到了各种消息，确认是真实的。 当然，考虑到Opus的高情商，他的回答可能只是来应付一下我。但是这个数据确实对所有人的认知来说都有点反常。\",\"date\":\"2026-03-12T16:00:00.000Z\",\"dateKey\":\"2026-03-13\",\"url\":\"/notes/adebayo-83pts\",\"tags\":[\"NBA\",\"热火\",\"阿德巴约\"]},{\"key\":\"post:building-ai-collaboration-rules\",\"section\":\"build\",\"title\":\"为 AI 协作建立项目规则的实践\",\"excerpt\":\"前几轮花了不少时间把项目从一锅乱炖理成了层次分明的样子：代码归代码，数据归数据，测试归测试，实验归实验。目录结构看起来已经像那么回事了。 但真正开始频繁地让 AI 参与日常工作之后，发现了一个新的问题：结构清楚，不等于 AI 知道该怎么在这个结构里干活。 你让它帮忙改个模型，它可能把新代码放到了实验目录里。你让它跑个验证，它可能把结果直接输出到了根目录。你让它做代码审查，它可能检查了一堆代码风格问题，却完全没注意到一个关键的目录边界已经被悄悄打破了。 这不是 AI 不够聪明。这是因为项目里那些\\\"这个目录只放这种东西\\\"、\\\"改了这里至少要跑一下那个测试\\\"、\\\"实验代码不等于正式实现\\\"之类的规则，全都装在人脑子里，从来没有被写下来过。 于是这一轮做的第一件事，就是在项目根目录放一份 AGENTS.md。 这个文件的定位很明确：README.md 给人提供项目说明。AGENTS.md 给 AI agent 提供协作规则。里面写的是：各个顶层目录各自放什么、改了核心代码至少要做什么验证、输出产物该落到哪里、优先用哪个命令行入口。 写完根目录的 AGENTS.md，发现还不够。有些子目录有自己更严格的要求，但全塞在根目录的文件里会变得又长又杂。于是继续在几个关键位置加了局部的 AGENTS.md： 验证算例目录强调结构化报告、失败退出和输出目录归属 测试目录强调 fixture、baseline 和测试分层 核心装配模块强调内部分层边界和实验工作台与主线实现的区分 实验目录强调探索区不是正式实现入口，不要被误当主线引用 这些局部文件不重复根级规则，只补充本目录特有的约束。最终形成的是一个分层体系：根级 AGENTS.md 管全局协议，局部 AGENTS.md 管各自的细节。 AGENTS.md 解决了\\\"在哪里干活\\\"的问题，但还有一个高频场景没覆盖：代码审查。 以前的做法是每次需要审查时，…\",\"date\":\"2026-03-10T04:00:00.000Z\",\"dateKey\":\"2026-03-10\",\"url\":\"/articles/building-ai-collaboration-rules\",\"tags\":[\"AI协作\",\"工程实践\",\"代码审查\",\"项目管理\",\"经验总结\"]},{\"key\":\"post:reflections-on-reorganization\",\"section\":\"build\",\"title\":\"两轮项目结构整理的踩坑与反思\",\"excerpt\":\"这轮整理的起点，其实来自一种很具体的不适感：打开项目目录，不知道该看哪里。 这个项目已经\\\"能跑\\\"了。模型写好了，仿真跑得动，数据也能出图。但每次想改点什么，或者想回忆三周前某个参数到底放在哪里，都要花相当一段时间重新定位。目录结构是从最初\\\"先写着试试\\\"开始一路堆叠上来的，每个文件夹的存在都有合理的历史原因，但合在一起已经没有人能一口说清全貌了。 这不是\\\"技术债\\\"那种听起来很抽象的东西。这就是一种很日常的、每天打开项目都会多花十分钟的摩擦力。这轮整理就是在处理这股摩擦力。 一开始的冲动是想赶紧动手：重命名文件夹、搬文件、删旧代码。但很快发现，如果不先搞清楚\\\"这个工作区到底在做几件不同的事情\\\"，搬了也白搬，过两周还是会乱。 于是先停下来，花了一整轮时间回答一个问题：这个目录里，到底混着几种不同性质的东西？ 答案比想象的多。有主线实现代码，有实验性的另一套写法，有跑仿真用的参数数据，有建模推导留下来的说明文档，有跑出来的结果图，有测试脚本，有半成品的讨论稿，有已经过时但不敢删的旧模型。它们全都平铺在差不多的目录层级里，只靠文件名和记忆区分。 弄清楚这一点之后，才知道该按\\\"性质\\\"分。代码归代码，数据归数据，文档归文档，测试归测试，实验归实验。这听起来像废话，但在一个长期试验式推进的项目里，这些东西是天然混在一起的，因为它们确实是一起产生的。 整理到中途，发现了一个比目录混乱更实质的问题：两条实现线里有好几块代码在做几乎一样的事。 这不是谁偷懒复制粘贴造成的。这是自然演化出来的。一开始只有一条主线，后来想试另一种写法，于是开了一条实验线。实验线需要用到一些基础功能——数值计算、数据解析、格式转换——主线已经写好了，但直接调用主线的代码会引入不想要的依赖，于是实验线自己也写了一份。 刚开始没什么问题，两份代码各走各的。但时间一长，主线那边改了一版，实验线这边没同步，两份代码就悄悄分叉了…\",\"date\":\"2026-03-09T04:00:00.000Z\",\"dateKey\":\"2026-03-09\",\"url\":\"/articles/reflections-on-reorganization\",\"tags\":[\"项目管理\",\"重构\",\"工程实践\",\"经验总结\"]},{\"key\":\"post:project-reorg-experience\",\"section\":\"build\",\"title\":\"一次失控项目的目录整理复盘\",\"excerpt\":\"这次整理面对的是一个在长期探索式开发中逐步生长起来的工作区。年前赶进度的那段时间，所有精力都花在功能推进上，新的实验不断往里加，旧的尝试没空清理，文档、数据、中间产物随手放在离代码最近的地方——\\\"先跑通再说\\\"。当时这样做是合理的，毕竟时间紧迫，整理是可以推迟的事。 但过完年再打开这个项目时，情况就不一样了。一个月的间隔足以让人忘掉大部分上下文：哪些目录是正在用的，哪些是废弃的尝试？这个文件为什么放在这里？那个脚本到底是主线的一部分还是某次调试的临时产物？目录结构已经从\\\"反映当前项目边界\\\"退化为\\\"记录历史开发过程\\\"，打开项目看到的是一座小型屎山的横截面。面对这样的项目，过重的认知负担让人不知道从哪里下铲子，心里甚至产生了一种畏惧感。 现有结构已经开始拖慢实际工作，甚至阻碍了继续投入的意愿。这正是启动整理的直接原因。 整理的起点是先弄清楚当前工作区里到底有几类东西、它们之间是什么关系。 在动手之前，先对所有内容做了一轮语义分类：哪些是正在开发的主线，哪些是曾经的实验但已经停止推进，哪些是辅助工具、哪些是数据源、哪些是生成出来的中间产物。这一步花了不少时间，但它决定了后续所有搬迁操作的方向，避免了反复挪动。 原来所有内容共用一个 Git 仓库，什么都往里扔，日积月累就成了一锅乱炖。一个工具的提交记录和主线研究的提交记录混在一起，不仅看不清历史脉络，也给回溯带来障碍。 拆分的原则很简单：如果两个东西的生命周期不一样、维护频率不一样、关心它们的人不一样，这次就不再让它们共用一个仓库。拆分时，旧仓库的 .git 目录被重命名保留而非删除，确保历史可追溯。每个新项目各自初始化独立的 Git 仓库，拥有自己的版本历史和忽略规则，互不干扰。 仅仅拆分项目还不够，主项目内部同样需要分层。主线实现、实验性实现、已经冻结的旧实现、原始数据、说明文档被分别放到不同的位置，并且为每一层制定了明确的定位…\",\"date\":\"2026-03-08T16:30:00.000Z\",\"dateKey\":\"2026-03-09\",\"url\":\"/articles/project-reorg-experience\",\"tags\":[\"项目管理\",\"重构\",\"AI工具\",\"工程实践\",\"经验总结\"]},{\"key\":\"post:three-disciplines-eight-points-personal-review\",\"section\":\"essay\",\"title\":\"三大纪律八项注意：一张个人生活审查表的诞生\",\"excerpt\":\"富兰克林的美德审查法我很早就知道——最初是读吴军的文章时接触到的：十三项美德、每周聚焦一条、每晚对着小册子打点。这个思路两百多年了，至今仍然是我见过的最简洁有力的个人审查框架。后来读了富兰克林自传原文，对这套方法更加感兴趣，也确实尝试过几次，但每次都没能坚持下来。原因说起来也简单：首先自己的意志力有限，这种繁琐的事情很难坚持。另外，他的十三项美德带着十八世纪费城中产的气息，节制、沉默寡言、贞洁，这些词和我的实际生活之间隔着一层，用起来总觉得不贴身。 另一个一直放在心里的东西是德尔斐神庙的铭文——“认识你自己”、“凡事勿过度”、“妄作承诺，祸患随之”。这三条我知道很久了，一直觉得很有分量，但始终不清楚怎么把它们从格言变成可以日常操作的东西，怎么融入对自我的具体塑造中。 所以当我决定再做一次尝试时，想法很明确：我想借富兰克林的结构，填入属于我自己的内容，同时把德尔斐那些一直悬在空中的原则也找到落点。框架上，我想用一个更有中国味道的壳——“三大纪律八项注意”。 这件事做下来，我用了两个AI深度参与，各自发挥了不同的长处。 GPT的核心优势在于记忆。我和GPT的长期对话让它对我积累了相当多的上下文——我的工作方式、思维偏好、表达习惯、甚至我对什么东西不耐烦。所以当我抛出“我想做一个三大纪律八项注意”这个想法时，它直接带着对我的了解来展开。它很快就给出了一个覆盖面相当宽的方案，从身体管理到认知习惯到精神趣味，还专门做了一个“按你本人气质定制”的版本，措辞比通用版更锋利，比如“别让底盘先烂”、“别把夜晚活成无底洞”。它提出的那句“不媚俗”，确实说到了点上。这种定制感，如果没有记忆功能是做不到的。 但铺开之后需要收拢。这时候我把GPT的方案拿给Claude。Claude的长处不太一样——它的文风更好，对话时比较能抓住重点，不容易跑偏。 Claude上来就指出了几个我自己没注意到的结构缺陷…\",\"date\":\"2026-03-08T02:00:00.000Z\",\"dateKey\":\"2026-03-08\",\"url\":\"/articles/three-disciplines-eight-points-personal-review\",\"tags\":[\"个人成长\",\"AI\",\"自我审查\",\"方法论\",\"富兰克林\"]},{\"key\":\"note:sports-roundup-2026-03-08\",\"section\":\"memo\",\"title\":\"体育近况速览：NBA、英超、世界杯与自行车赛季\",\"excerpt\":\"最近其实很久没有认真关注体育比赛了。这两天稍微补了一点信息，主要还是篮球看得多一些。 篮球方面我平时会在 B 站刷一些讲篮球的博主，在 YouTube 和推特上也关注了一些账号，他们经常会发一些我比较感兴趣的内容。NBA 里我关注最多的还是马刺队，一直也比较留意文班亚马的情况。 足球方面最近关注得少很多。大概只知道利物浦这段时间状态比较一般。英超现在竞争很激烈，本来阿森纳一度领先不少，但最近曼城又有追上来的趋势，冠军争夺又变得紧张起来。利物浦现在大概在第 5 名，离欧冠区还有一些距离，后面估计要和曼联有一番比较激烈的竞争。 不过今年足球真正的焦点还是世界杯。这届世界杯在美国举办，扩军到 48 支球队。从目前的分组形势看，小组赛好像没有特别明显的\\\"死亡之组\\\"，传统强队大概率都能比较顺利进入 32 强。 这届世界杯一个很有意思的看点是那些老将。2022 年那届世界杯被很多人称为\\\"诸神黄昏\\\"，当时大家普遍觉得梅西、C 罗、莫德里奇这些人可能会告别世界杯。但现在看，他们居然都很可能继续参加这一届。从 2008 年到 2022 年，这三个人几乎包揽了所有金球奖，统治力非常夸张。现在他们的年龄都接近 40 岁，梅西可能是最年轻的，也差不多 39 岁，还能踢世界杯确实有点不可思议。 反而有点出人意料的是内马尔。2022年的时候恐怕没有人意识到那是他最后一次世界杯。原本觉得他还会将巅峰保持几年，但这几年他逐渐淡出了主流舞台。世界杯之后他先去了沙特，后来又回到巴西联赛，整体状态一直不太稳定，基本没有保持高强度比赛。原来所谓22年诸神指的是内马尔。 巴西现在也有一些麻烦。一方面没有巅峰时期的内马尔，另一方面罗德里戈又遭遇了韧带撕裂，预计要缺席大约 10 个月，基本确定赶不上今年的世界杯。他的位置虽然还有一些选择，比如恩德里克、安东尼、马丁内利等，但整体稳定性还是需要观察。 巴西在最近的世界杯预…\",\"date\":\"2026-03-07T18:29:00.000Z\",\"dateKey\":\"2026-03-08\",\"url\":\"/notes/sports-roundup-2026-03-08\",\"tags\":[\"NBA\",\"足球\",\"世界杯\",\"自行车\",\"随想\"]},{\"key\":\"note:wembanyama-russell-2026-03-06\",\"section\":\"memo\",\"title\":\"文班与拉塞尔：超越数据统计的赢家\",\"excerpt\":\"文班今天的数据很豪华。不过他前两天数据不那么高，应该也没有人觉着那叫\\\"低迷\\\"。 我之前一直相信，文班一定会在自己职业生涯中积累出非常夸张的技术统计。但现在我更倾向于把他与历史上那位超越数据统计的大魔王进行联想。那个人就是\\\"指环王\\\"——比尔·拉塞尔。 拉塞尔有句名言：\\\"唯一重要的统计数据是最后的比分。\\\" 拉塞尔的职业生涯，篮板多于得分，个人数据上与张伯伦这种人物相比比较一般，但是他总是赢家——八连冠、11枚戒指——有了这些，其它的都是微弱的插曲。 我相信拉塞尔并不是不擅长得分，尤其是他那种体型的内线在那个没有三分线的年代，得多少分主要看他的意愿。我相信他的个人数据是被比赛胜利所塑造。为了赢球，需要什么数据，他就会去拿什么数据。 这一点，我感觉文班与拉塞尔很像。他们能够刷出疯狂的数据，但他们根本不care这些，他们只对胜利感兴趣，并乐意为此做各种工作。 文班的天赋以及当前已经开发出来的技能包在当今的诸多比赛中都是妥妥溢出的，这也使得虽然马刺阵容并不是很合理，但文班几乎可以用自己丰富的手段和超群的能力即时弥补阵容弱点，在必要的时候随时打崩对手——包括被认为最强的雷霆、活塞... 我相信文班最后会被当成一个\\\"赢家\\\"铭记，而不是什么历史得分榜前几、多少次DPOY或者历史盖帽王... 比赛背景： 2026.03.05，马刺主场 121-106 击败活塞，完成赛季横扫（2-0）。文班 38 分 16 板 5 盖帽，Fox 29 分，Castle 11 分 12 助攻。马刺全场未曾落后，近 14 场赢下 13 场。（ESPN Recap）\",\"date\":\"2026-03-06T06:00:00.000Z\",\"dateKey\":\"2026-03-06\",\"url\":\"/notes/wembanyama-russell-2026-03-06\",\"tags\":[\"NBA\",\"随想\"]},{\"key\":\"post:github-actions-trigger-incident-retrospective-2026-03-06\",\"section\":\"build\",\"title\":\"一次深夜排障：以为是自己的锅，最后定位到 GitHub 侧触发服务异常\",\"excerpt\":\"事情发生在 3 月 5 号晚上，排查持续到 3 月 6 日凌晨。 我的博客有一条自动化链路：在 Telegram 里发一条消息，内容会自动同步到网站上。这条链路已经稳定运行了两周多，我一直没怎么操心过。但那天晚上我发完消息后，习惯性地刷了一下网页，发现内容没有更新。 一开始我没太在意，以为是缓存延迟，等了几分钟又刷了几次，还是没有。于是打开 GitHub 的 Actions 页面看了一眼——果然，最近的几次 push 之后，部署流程根本没有被触发。 就在两天前，我刚刚调整过一个定时任务的频率，把原来每半小时检查一次改成了一天只在几个固定时段检查。当时觉得是个很小的改动，甚至没怎么仔细看就提交了。 所以第一反应就是：肯定是这次改动搞坏了什么。 我马上打开配置文件，反复对比改动前后的差异，逐行检查有没有不小心动到触发条件。看了好几遍，逻辑上没毛病，改的确实只是定时频率，跟 push 触发完全无关。 但问题就是摆在眼前——push 之后确实不触发了。那不是这次改动的问题，还能是什么呢？ 带着“肯定是配置有问题”的执念，我开始往更深的地方挖。 回过头翻了翻更早之前的提交记录，发现两周前为了防止机器人账号的 push 触发重复部署，我加了一条过滤规则。当时这个改动运行得很正常，但现在我开始怀疑是不是这条规则在某种边界情况下误伤了正常的触发。 于是我把这条过滤规则去掉了，又重新整理了一下触发逻辑，想让整个部署配置变得更“健壮”一些。改完之后提交，push 上去，满怀期待地等着看 Actions 页面…… 还是没触发。 这下我有点慌了。既然 push 不行，那我手动触发总可以吧？ 于是我去 Actions 页面点了“Run workflow”按钮。结果页面弹出一行红字： Failed to queue workflow run. Please try again. 试了好几次，每次都是同…\",\"date\":\"2026-03-06T00:00:00.000Z\",\"dateKey\":\"2026-03-06\",\"url\":\"/articles/github-actions-trigger-incident-retrospective-2026-03-06\",\"tags\":[\"GitHub Actions\",\"Incident\",\"Retrospective\",\"踩坑\"]},{\"key\":\"note:mac-cleanup-2026-03-06\",\"section\":\"memo\",\"title\":\"Mac 文档整理与磁盘瘦身记录\",\"excerpt\":\"刚才把苹果电脑里的文档整理了一轮。 电脑里积累了不少文件，比如以前下载的 PDF、论文、书籍，还有一些自己写的 Markdown 再转成的 PDF。单靠手动整理非常麻烦，所以这次基本交给 AI 来处理。 整个过程大概分成两个层面： 表层整理：根据文件名和基本信息做分类。 深层处理：解析 PDF，提取文档里的元信息，再根据内容进行整理。 符合需求的文档会放进 Zotero 里，其余的放到普通文件夹中。分类时考虑的因素包括：文件大小（不希望存太多超大文件）、主题分类（数学、物理、工程等）、文献类型（论文、书籍、报告）。 通过这一轮处理，两台电脑里积累很久的文件基本梳理了一遍，清爽了不少。 接着顺手做了一些\\\"瘦身\\\"，主要是删掉没必要保留的东西。 比如以前的一些 Git 仓库。今天才意识到，如果仓库历史比较复杂，.git 文件夹会非常大，因为里面保存了大量历史记录。如果这些历史和当前内容已经没什么关系，那这些空间就是纯粹的占用。早期用 Git 比较随意，什么文件都往仓库里拖，甚至把很大的 PDF 直接放进去。今天干脆删掉了一个几乎没用的仓库，.git 文件夹本身就有 2.9GB，整个目录 3.1GB，删掉之后立刻轻松了不少。 不过自己制造的垃圾还不算最离谱，真正夸张的是软件自动产生的缓存： Apple Podcasts 缓存：14GB Notion 缓存：8GB 这些通常被归到系统数据里，系统工具也看不太清楚。这次能定位到它们，其实是靠 OpenCode 做了一次磁盘分析，很快就找出了这些异常空间，效率非常高。 一些更深入的整理工作也是直接让 AI 帮忙写脚本，比如解析 PDF、统计文件、给命名混乱的文档自动重命名。这种事情手动做会非常痛苦，用 AI 编程工具之后效率高了很多。 这一轮折腾下来，大概腾出了 30GB 的空间，还是挺满意的。 另外，Mac 上还有个很好用的软件叫 Mo…\",\"date\":\"2026-03-05T16:00:00.000Z\",\"dateKey\":\"2026-03-06\",\"url\":\"/notes/mac-cleanup-2026-03-06\",\"tags\":[\"Mac\",\"整理\",\"AI工具\"]},{\"key\":\"post:site-experience-iteration-2026-03-04\",\"section\":\"build\",\"title\":\"一轮体验修补：让网站用起来更顺手\",\"excerpt\":\"事情的起因是推文整理。我把过去备份的推文筛选之后导入到了博客的笔记区，一下子多了两百多条内容。导入之前首页加载一直挺流畅的，但这两百多条进来之后，明显感觉到首页变卡了——打开时卡片先刷出来一大片，日历却要等好一阵才出现，整个页面像是在一块一块地拼装。 这让我意识到，之前\\\"所有内容全量加载\\\"的方案已经扛不住了。除了首页卡顿之外，我还注意到文章列表里偶尔有卡片因为标题太长而撑得特别高，打破了整体节奏；主题页面的分割线也是有的有、有的没有，看着不统一。 既然要动首页，不如把这些积攒的体验问题一并处理掉。于是开启了这一轮集中修补。 一开始以为是动画或者脚本写得不好，排查之后首先确认的是页面本身太大了。当时整个首页导出的文件大概有两三兆，所有内容一股脑全塞在里面，加载要花不少时间。日历排在最后面，自然就最后才出现。 知道原因以后，思路就清楚了：不需要一次展示所有内容，先显示最近的四十条就好，之后每次点\\\"查看更多\\\"再多加载一批。改完以后，首页文件大小从两三兆降到了两百多K，打开时那种\\\"先闪一大片再慢慢拼装\\\"的体感基本消失了。 首页不再一次性加载全部内容之后，新的问题来了——如果用户点了日历上某个日期，但那天的内容还没被加载出来怎么办？ 直觉上觉得不难：先把对应的内容加载出来，再跳过去就好了。但实际操作的时候发现一个时序问题：内容加载需要时间，如果加载还没完成就立刻去跳转，会找不到目标位置。最后的办法是先记住\\\"要跳到哪里\\\"，等内容真正出现在页面上之后再执行跳转动作。这种\\\"先记后跳\\\"的模式虽然不复杂，但如果一开始没想到，很容易在这里卡住。 笔记页面也做了类似的改造——一次先显示十条，之后每次多加载五条，但保留了完整正文而不是只给摘要。笔记毕竟是用来认真读的，只展示开头几行没什么意义。 改布局的时候还碰到一个有意思的事。之前首页用的是一种\\\"瀑布流\\\"排列方式，内容从上到下填满一列再流到下一列。…\",\"date\":\"2026-03-04T00:00:00.000Z\",\"dateKey\":\"2026-03-04\",\"url\":\"/articles/site-experience-iteration-2026-03-04\",\"tags\":[\"网站优化\",\"经验分享\",\"博客\"]},{\"key\":\"post:tweet-backup-experience-2026-03-04\",\"section\":\"build\",\"title\":\"把散落的推文变成有价值的笔记\",\"excerpt\":\"这次做的事情说起来很简单：从以前的推文备份里，挑出值得长期保留的内容，整理成博客上的笔记。 但\\\"简单\\\"只是说起来简单。真正动手之后才发现，从一堆原始数据里提炼出有价值的东西，比写一篇新文章还费劲。 推文备份一直躺在数据文件夹里，JSON 格式，几千条。这些内容里有不少是当时认真想过、认真写过的——个人观点、生活感受、某个瞬间的想法。但混在里面的也有大量噪音：转发的摘要、AI 工具的使用记录、绘图相关的技术参数，等等。 如果不做整理，这些有价值的内容会永远埋在噪音里，既没法浏览也没法检索。我希望把它们沉淀到笔记区，和其他日常随笔放在一起，成为一种可以回顾和再利用的资产。 一开始的思路是按文字长度来筛——超过三百字的保留，太短的丢掉。但很快发现长度只是最粗的一层过滤，远远不够。一条三百字的 AI 摘要转发没什么保留价值，而一条一百多字的个人感悟可能恰恰值得留下。 于是筛选变成了好几层叠加：先按长度初筛，再排除掉模板化的提示词内容、非中文帖子、AI 绘图相关帖子，最后再判断剩下的内容是\\\"个人表达\\\"还是\\\"信息搬运\\\"。 这个过程让我意识到，内容筛选的标准特别容易在\\\"过宽\\\"和\\\"过严\\\"之间摇摆。放宽了会混进大量噪音，收紧了又可能误伤真正有价值的东西。最终的办法是把筛选分成硬性规则和软性判断两层——硬规则用来排除明显不要的，软判断用来甄别\\\"个人表达\\\"和\\\"信息搬运\\\"之间的模糊地带——同时保留每一步的中间结果，万一筛错了可以回退重来。 筛选之后还要做一步去重——之前已经整理过一批推文了，不能把已经存在的内容再导入一遍。方法是把现有笔记里出现过的所有推文链接提取出来，和新的候选列表做比对，剔除重复的。 这一步看起来简单，但如果漏掉了，就会出现同一条推文在笔记里出现两次的情况，后续清理起来很麻烦。 筛完去重之后，下一个问题是怎么组织这些内容。一开始是每条推文生成一个独立文件，但这样文件数量太多，浏…\",\"date\":\"2026-03-04T00:00:00.000Z\",\"dateKey\":\"2026-03-04\",\"url\":\"/articles/tweet-backup-experience-2026-03-04\",\"tags\":[\"内容整理\",\"经验分享\",\"博客\"]},{\"key\":\"note:ai-svg-workflow\",\"section\":\"memo\",\"title\":\"下午帮一位朋友处理了一张理论模型的概念框图。\",\"excerpt\":\"下午帮一位朋友处理了一张理论模型的概念框图。 他发来一张经典的框图截图，希望做成类似风格，但又不想用 Visio 或 PPT 画，问能不能用 Nano Banana。我直接判断不太合适。Nano Banana 生成视觉效果可以，但做结构严谨的关系图时，经常会把逻辑关系搞复杂，线条也容易变形，不太稳。 我建议他试试用 Gemini 直接生成 SVG。坦白说，我一开始也不确定效果怎么样。结果今天自己试了一下，把原图直接贴进去生成，出来的效果相当惊艳。确实有一些细节问题，比如线框尺寸和字体比例不够协调，但整体布局非常可观，结构基本是对的。 我把生成的 SVG 发给他，他明显有点震惊。因为一旦有了可编辑的 SVG，后面只需要做微调，而不是从零开始画。 微调时我用了 Inkscape，但这个软件对我来说完全陌生，界面逻辑也不算直观，目前操作还比较生疏。很多细节我暂时处理不了，只能删减一些明显多余的线条和文字。技术上还有盲区，不过路径已经清晰，效率比传统方式高太多，剩下的就是熟练度问题。 后来他自己用 Gemini 试了一下，但用的不是 Pro 版本，生成速度很慢。我又帮他跑了一次。他给我一段文字描述，我让 AI 根据描述生成框图草稿，先用 Banana 生成一个渲染版，再把框图转成 SVG，效果相当稳定。这种组合式工作流反而很顺。 最后我用 Inkscape 简单清理了一些多余元素，就把成品发给他。进一步的精细调整我现在还做不了，只能慢慢练。 整体来看，这件事验证了一点：在结构化图形这类任务上，AI 生成 SVG 的路径已经非常可用。真正的瓶颈不在生成，而在人工微调能力。熟练度一上来，这种工作会变得异常高效。\",\"date\":\"2026-03-03T10:00:00.000Z\",\"dateKey\":\"2026-03-03\",\"url\":\"/notes/ai-svg-workflow\",\"tags\":[\"AI\",\"SVG\",\"Gemini\",\"Inkscape\",\"工作流\"]},{\"key\":\"note:zotero-ai-workflow\",\"section\":\"memo\",\"title\":\"昨天晚上开始折腾 Zotero 的仓库。它本身是非常成熟、也非常著名的文献管理软件，插件体系很丰富。但这些插件大多停留在旧时代的…\",\"excerpt\":\"昨天晚上开始折腾 Zotero 的仓库。它本身是非常成熟、也非常著名的文献管理软件，插件体系很丰富。但这些插件大多停留在旧时代的思路里。这几年 AI 发展太快了，Zotero 的生态在这方面明显有些滞后，我觉得有必要往更底层挖一挖。 运气不错，我发现它的数据库文件是可以直接访问和解析的，并没有加密。这一下就打开了局面。我可以直接从数据库里提取文献目录、元数据等信息，绕开原本的界面层。基于这个数据库，我做了一个简单的前端，有点像一个轻量版的 Zotero 界面。界面本身并不复杂，但有了它，我就可以直接调用自己定制的功能，比如用 AI 去读取和分析文献文件。整个流程突然变得顺滑了很多。 这个项目我感觉是有延展性的，后面完全可以继续往下走。整体实现基本都是用 Python。额外做了两个核心功能模块： 一个是通过现成的库，把 PDF 文档转成结构化的数据格式，方便 AI 直接读取和分析； 另一个是通过 Claude Agent SDK，对每篇文章做自动分析。单篇分析确实需要时间，但整体效果是值得的，尤其在规模化处理时优势会逐渐显现。 严格说来，除了\\\"数据库可以直接被解析\\\"这个发现之外，其余几个环节我之前都做过。真正让我兴奋的是这次意识到：很多软件在 AI 时代，其实可以绕开表层接口，直接下沉到数据层去重构工作流。这种思路的变化，对我来说是一次观念上的转折。 整体感觉是，进入 AI 时代之后，软件进一步扁平化几乎成了一种趋势。界面不再是中心，数据与模型的连接才是中心。谁能把这条路打通，谁就真正获得了效率的杠杆。\",\"date\":\"2026-03-03T07:00:00.000Z\",\"dateKey\":\"2026-03-03\",\"url\":\"/notes/zotero-ai-workflow\",\"tags\":[\"Zotero\",\"AI\",\"工作流\",\"Python\",\"数据库\"]},{\"key\":\"post:indie-dev-and-ai-coding-review\",\"section\":\"build\",\"title\":\"独立开发近况与 AI 编程心得\",\"excerpt\":\"最近密集地做了好几个开发项目。二月底手头额度充裕，我索性把 GitHub Copilot 和 Windsurf 直接当 Agent 深度使用，开发效率拉满。不过进入三月，额度重新计算，得稳着点用了。 趁此机会，回顾一下近期做的几件事，以及在这个过程中对 AI 辅助编程的一些新认识。 网站升级 给个人网站加了一个新功能：在 Telegram 输入信息后自动同步到网页上。从家里回来之后，又参考了 AMP 的网页设计风格，把页面美化了一番，看起来精致多了。 网页版简历 帮一个朋友把 CV 做成了网页版并进行了优化。不过他更希望自己来搞，婉拒了我的好意——只能说很遗憾。但我还是把成品挂在了自己的站点上，没事翻看一下，颇有成就感。 流量监控面板 做了一个用来查看 VPN 流量记录的 Dashboard。以前主要写前端，很少碰后端，这次终于把后端数据处理的功能加上了，还修复了一些 bug、做了性能方面的调整。这次尝试让我对前后端的交互有了更完整的了解。 重启 DoneList 项目 把之前搁置的 DoneList 项目重新捡起来开发了一波。虽然雏形已出，但感觉偏离了初衷——本来是为了逃离传统的 Todo list 软件，结果做出来越来越像市面上常见的笔记应用。后续可能还得继续打磨。 做独立开发，我需要一个能让自己持续投入精力、不断迭代、且有足够发挥空间的项目。以前做网站能让我兴奋好几个月，不断积累新经验，但现在网站开发带来的兴奋感已经没那么强了。 接下来计划把重心更多地转移到 App 开发 上，目标是把自己的作品上架到 App Store 等平台。这算是一个初步计划，具体落实时间待定。 这段时间高强度使用 AI 辅助编程，积累了不少经验。之前以写前端为主，接下来打算慢慢加入后端，再结合以前常做的数据处理和深度建模工作，把它们全都融合起来。这种不断探索新领域的感觉非常美妙。 在这个过程中…\",\"date\":\"2026-03-01T00:00:00.000Z\",\"dateKey\":\"2026-03-01\",\"url\":\"/articles/indie-dev-and-ai-coding-review\",\"tags\":[\"独立开发\",\"AI编程\",\"Windsurf\",\"开发心得\"]},{\"key\":\"post:theme-migration-experience-2026\",\"section\":\"build\",\"title\":\"从极简到报纸：一次博客改版的经验与反思\",\"excerpt\":\"偶然看到一个叫 Amp Chronicle 的设计风格——紧凑的多列排版、复古米色底、衬线标题、细实线分割——像一份印刷精良的老报纸。当时就想：我的博客能不能也变成这样？ 一开始以为只是换个色调、调个字体的事。结果几乎每一个页面都被翻了个底朝天。 改版的第一件事是换色调和字体。背景从冷白色换成米黄色，标题从无衬线体换成衬线体。就这两步，整个站的气质瞬间从\\\"科技产品\\\"变成了\\\"羊皮纸手稿\\\"。 但紧接着就出了问题——原先看着挺和谐的圆角卡片和半透明阴影，在暖色调的底色上突然变得格格不入。就像你把一套宜家的北欧家具搬进了一间中式书房，每一件单看都没问题，放在一起就哪哪都别扭。 于是圆角全部改成直角，阴影全部换成细实线边框，元数据区全部统一成小号大写字母——一环扣一环地调，最后几乎所有组件都重新过了一遍。 这件事让我意识到：设计系统是牵一发动全身的。 你以为只是换了个底色，其实是换了一整套视觉语言。不要指望只改一层就能停下来。 报纸风格最核心的视觉特征是多列排版。最直觉的实现方式是用网格布局——把页面切成三列四列，内容往里填就好了。 但实践中马上碰到一个问题：网格布局要求同一行的所有卡片等高。 我的内容长短差异很大——一条碎碎念可能就两行字，一篇长文能撑满半屏。它们被放在同一行里时，短卡片下方就会出现大块空白，像报纸排版时忘了填广告的版面。 后来换了一种\\\"瀑布流\\\"的方案。它的工作方式更像真正的报纸排版——内容从上往下自然流动，填满一栏再流入下一栏，每张卡片紧挨着前一张，不会有空白浪费。这正是我想要的效果。 这次布局改造中，我在错误方向上反复调试、打补丁，最终还是得推翻重来。 日历组件是整个改版中被翻新次数最多的部分，前后试了三种方案，每一种都有各自\\\"理论上没问题但实际不行\\\"的故事。 第一次，把日历固定在屏幕右侧，滚动时始终可见。在普通屏幕上很完美，但在超宽屏幕上，日历和主内容之间的距…\",\"date\":\"2026-02-27T00:00:00.000Z\",\"dateKey\":\"2026-02-27\",\"url\":\"/articles/theme-migration-experience-2026\",\"tags\":[\"设计\",\"经验分享\",\"博客\"]},{\"key\":\"note:scherbo-six-golds-olympics\",\"section\":\"memo\",\"title\":\"克莱伯在单届冬奥会中豪取六金的壮举，促使我又一次了解了一下奥运历史上的单届\\\"多金王\\\"。\",\"excerpt\":\"克莱伯在单届冬奥会中豪取六金的壮举，促使我又一次了解了一下奥运历史上的单届\\\"多金王\\\"。 纵观历届奥运会，单届狂揽6金以上的运动员屈指可数：除了2008年北京奥运会的菲尔普斯（8金）和1972年慕尼黑奥运会的马克·斯皮茨（7金）之外，与克莱伯同样单届拿下6金的，还有一位常常被忽略的传奇——1992年代表独联体出战的体操运动员维塔利·谢尔博。 谢尔博的成绩极具压迫感：在体操男子项目总共仅有8枚金牌的情况下，他一人独揽6金，甚至创下了单日狂揽4金的神迹，堪称前无古人。 然而，稍微深入了解他的故事后，却让人为他倍感惋惜。 谢尔博的职业生涯充满了时代带来的坎坷。他仅参加过两届奥运会： 1992年巴塞罗那奥运会：他代表由前苏联加盟共和国组成的松散代表团\\\"独联体\\\"参赛，留下了单届6金的神话。 1996年亚特兰大奥运会：苏联彻底解体后，他代表刚刚独立、经济十分困顿的白俄罗斯出战。 不仅缺乏大国的强力支持，谢尔博的备战还遭到了家庭变故的沉重打击。 1995年，他的妻子身患重病，谢尔博为此一度中断训练，竞技状态受到严重影响。即便如此，在1996年火线复出后，面对中国名将李小双和俄罗斯体操王子涅莫夫等顶尖高手的夹击，他在仅有白俄罗斯微薄资源支持的劣势下，依然拼下了4枚铜牌。这足以证明他拥有多么恐怖的体操天赋。 令人遗憾的是，尽管谢尔博在1992年达成了至今无人接近的历史级成就，他在体操史上的存在感却非常低。他不如苏联时期的柳金声名显赫，也不及后来的涅莫夫或中国的李小双家喻户晓。 这种\\\"低存在感\\\"，很大程度上是因为他生不逢时： 国家解体的遗憾：如果苏联晚解体几年，凭借其强大的国家宣传机器，谢尔博的壮举必将被大书特书；如果他能生在俄罗斯或乌克兰这样的大国，也能获得更高的曝光度和训练资源。 无人背书的荣誉：他的巅峰6金是代表一个已经不存在的临时组织（独联体）获得的，这导致后来没有哪个国家会主动将他作为…\",\"date\":\"2026-02-21T16:00:00.000Z\",\"dateKey\":\"2026-02-22\",\"url\":\"/notes/scherbo-six-golds-olympics\",\"tags\":[\"奥运会\",\"体操\",\"历史\"]},{\"key\":\"post:telegram-notes-journey-2026-02-20\",\"section\":\"build\",\"title\":\"从一个念头到自动化链路：Telegram 碎碎念入站记\",\"excerpt\":\"事情的起因很简单：我想要一个“随手记”的地方。 平时看到什么、想到什么，顺手发一条消息就完事了。但这些零碎的想法散落在聊天记录里或者仅存在于脑海之中，过几天就沉没了。我希望它们能自动汇集到博客的 Notes 页面上——每天的消息归到同一篇，标题就是当天日期，像一份“碎碎念合集”。 需求说起来就一句话，但真正动手做的时候，发现牵扯的东西远比想象中多，不过好在，基于Codex的给力输出，一下午就把基本功能搞定了。 一开始摆在面前的核心问题是：怎么把 Telegram 里的消息送到 GitHub 仓库？ 最终选定的方案是 Telegram Bot Webhook。简单说，Webhook 就是“你给我一个网址，有事我主动来敲门”——Telegram 每次收到消息，会主动把内容 POST 到我指定的地址，而不是我反复去轮询“有没有新消息”。 思路是这样的：我建一个 Bot，私聊发文本给它，Telegram 会把消息推送到 Webhook 地址。Webhook 收到消息后，调用 GitHub API 触发一个 repository_dispatch 事件（可以理解为“远程拍一下 GitHub 的肩膀，告诉它该干活了”），然后 GitHub Actions 接手，把消息内容写入当天的 Markdown 文件，提交到仓库。最后靠现有的部署流程自动发布到站点。 整条链路画出来大概是这样的： Telegram 私聊 → Bot Webhook → Cloudflare Worker → GitHub repository_dispatch → Actions 脚本写入 notes → commit \u0026 push → 定时部署到 Pages 看起来环节不少，但每一环的职责都很清晰。Webhook 只做“接收和转发”，Actions 脚本只做“写文件”，部署还是复用原来的流程。 说来有点惭愧，一开…\",\"date\":\"2026-02-20T00:00:00.000Z\",\"dateKey\":\"2026-02-20\",\"url\":\"/articles/telegram-notes-journey-2026-02-20\",\"tags\":[\"Telegram\",\"GitHub Actions\",\"Cloudflare Workers\",\"自动化\",\"开发记录\"]},{\"key\":\"post:ai-quota-anxiety\",\"section\":\"essay\",\"title\":\"当AI配额用不完：一种新型焦虑\",\"excerpt\":\"最近有一个让我略微尴尬的烦恼：我的AI工具配额用不完。 Claude、ChatGPT、Gemini、windsurf、amp，再加上几个国产模型的API，每个月花也是花了一些钱的。但真正坐到电脑前，我却常常盯着对话框发呆，不知道该让它们做什么。配额静静地躺在那里，像超市里快过期的食材，提醒你又浪费了。 起初我以为这只是钱的问题——花了钱没用上，心疼。但仔细想想，焦虑的根源不在这里。 过去这些年，我习惯了一种现状：技术是瓶颈。电脑太慢、软件不好用、工具跟不上想法。于是我不断升级设备、订阅服务、囤积工具，相信只要装备到位，生产力自然会到来。 AI的出现把我熟悉的这个现状彻底翻转了。它可以在几秒钟内写出一段代码、翻译一篇文章、分析一份数据，对我来说产能几乎是无限的。而我——那个需要提出问题、判断质量、做出决策的人——反而成了整个系统里最慢的环节。 现在，我自己成了瓶颈。早期的AI还难免让人感觉智障，但现在更多的时候是感觉自己是个智障。 这种感觉很陌生，也很不舒服。之前梦寐以求一辆炫酷的跑车，但现在终于买了一辆性能极好的车，却发现自己不知道要去哪里。油箱是满的，引擎在低声轰鸣，而我坐在驾驶座上翻地图，翻了半天也没找到目的地，然后就陷入了昏昏欲睡的状态。 冷静下来想，我在和AI协作时最需要练习的有两件事。 第一件是提问。AI再聪明，也得有人告诉它该做什么。而提出一个好问题，远比它听起来要难。我得把脑子里那团模糊的念头拆解成清晰的任务，还得知道怎么描述才能拿到最好的结果。我能做的就是多用、多试、多观察。每一次和AI对话，其实都是一次练习提问的机会。 第二件是判断。AI给我的东西好不好、对不对、能不能用？这个问题最后还得由我回答。判断力来自我在某个领域的积累——读过的书、踩过的坑、做过的项目。AI可以帮我加速，但它没法替我长出这根神经。 这两件事说起来简单，做起来却需要持续的投入。而且说…\",\"date\":\"2026-02-10T00:00:00.000Z\",\"dateKey\":\"2026-02-10\",\"url\":\"/articles/ai-quota-anxiety\",\"tags\":[\"AI\",\"焦虑\",\"个人成长\",\"效率\"]},{\"key\":\"post:development-journey\",\"section\":\"build\",\"title\":\"基于Claude Agent SDK的文档摘要处理工具开发记录\",\"excerpt\":\"这篇文档记录了我如何一步步构建一个基于 Claude Agent SDK 的文档摘要生成工具。整个过程并非一帆风顺——从最初的 API 选型困惑，到摘要格式的反复调整，再到文件命名规则的多次重构，每一步都伴随着问题的发现与解决。 事情的起点很简单：我有一个 Clippings 文件夹，里面存放着从各处收集的文章（接近300篇）。这些文章越积越多，却很少被真正阅读和消化。我希望有一个工具，能够批量处理这些文章，为每篇生成一张摘要卡片——既保留核心信息，又节省阅读时间（最后，我将其上传到自己的网站中，即精选阅读模块）。 最初的代码框架已经存在，使用的是智谱 AI 的 GLM 模型（这是我最初的设想，但还没有完全调通）。但我希望切换到 Claude Agent SDK，因为它提供了更强大的 agent 能力，而且我已经配置好了 Claude Code 环境。接下来的工作是由amp完成的，因为我有免费赠送的10美刀额度，整个thread都使用的smart模型（调用Claude Opus 4.5, 大概花费$7） 当我说\\\"使用 Claude Agent SDK\\\"时，虽然我之前用过几次，但其实对它的详细用法印象并不深刻，只有残存于记忆中的模糊印象。我让amp帮我通过查阅最新文档，了解到 Claude Agent SDK 是一个基于 Claude Code 构建的 Python/TypeScript 库，核心 API 是异步的 query() 函数： 与传统的同步 API 调用不同，这里返回的是一个异步迭代器，需要用 async for 来遍历消息流。这意味着整个处理逻辑都需要重构为异步模式。 我们写了一个简单的测试脚本来验证 SDK 是否正常工作： 测试通过后，我们才开始正式改造主程序。 接下来需要设计清晰的工作流程。最终确定的目录结构是： 工作流程很直观：从 toread 读取文章，…\",\"date\":\"2026-01-25T00:00:00.000Z\",\"dateKey\":\"2026-01-25\",\"url\":\"/articles/development-journey\",\"tags\":[\"技术实践\",\"development\",\"claude-sdk\",\"documentation\",\"automation\"]},{\"key\":\"note:telegram-push-summary-v1\",\"section\":\"memo\",\"title\":\"终于把博客自动同步到 Telegram 频道的功能彻底搞定了。\",\"excerpt\":\"终于把博客自动同步到 Telegram 频道的功能彻底搞定了。 回顾一下这次折腾的过程，其实核心逻辑不难，细节全是坑： 申请机器人：找 BotFather 申请机器人，拉进频道当管理员，拿 Token 和 Chat ID。这步最简单。 自动化脚本：写了个 Node.js 脚本，配合 GitHub Actions。每次代码 push 到 main 分支时，用 git diff 算出新增的 Markdown 文件，解析出标题和链接发给 Bot。 现象：修改了文件名（如 v1.md -\u003e v2.md）后，推送没有触发通知。 原因：Git 将此操作识别为 重命名 (Rename)，而脚本最初只检测 新增 (Add)。 解决：将 git diff 的过滤器从 A 升级为 ACR，同时覆盖 Add、Copy、Rename 三种情况。 现象：IV 模板测试时，提示 \u003cimg\u003e is not supported in \u003cp\u003e。 原因：Markdown 渲染器默认将图片包裹在 \u003cp\u003e 标签里，但 IV 规范不允许。 解决：在 IV 规则中加入 @split_parent: //p/img，强制将图片与父级段落拆开。 现象：App 端点击 t.me/iv?... 链接能秒开，但 Web 端点击后无反应或报错。 原因：Telegram Web 对 IV 链接的支持极差。 尝试1（隐形链接）：在消息开头插入零宽空格 [\\\\u200B](IV链接)，正文保留原始链接。这能在 App 端触发卡片，但依然不够优雅。 尝试2（官方方案）：升级到 Telegram Bot API 的 link_preview_options。在 API 调用中显式指定 url: \\\"t.me/iv?...\\\" 用于生成预览卡片，而正文链接保持原始网址。这是目前最稳健的方案。 现象：消息能发送，但无论 App 还是 Web 都没有…\",\"date\":\"2026-01-24T05:10:00.000Z\",\"dateKey\":\"2026-01-24\",\"url\":\"/notes/telegram-push-summary-v1\",\"tags\":[\"折腾\",\"Telegram\",\"自动化\"]},{\"key\":\"note:tsinghua-agi-next-2026\",\"section\":\"memo\",\"title\":\"今天完整听了清华AGI-NEXT的圆桌对话录音，现场气氛很好，我听了也颇有感触。\",\"excerpt\":\"今天完整听了清华AGI-NEXT的圆桌对话录音，现场气氛很好，我听了也颇有感触。 过去几年, 国产大模型的发展实属不易。在各种条件制约下, \\\"把穷日子过好\\\" 似乎成了他们的发展主旋律。 诚然,有条件时谁都愿意过富足的日子, 但创新恰恰常常诞生于限制之中——这些制约提供了创新的两大关键要素: 真实存在的技术难题, 以及必须聚焦突破的理由。 AI时代,许多事物的前景尚不明朗,很难断言哪条路更有希望。但去做, 总比不做更有前途。 可以预见的是,会有越来越多年轻人投身AI行业,贡献智慧——这正是这个新兴领域的生命力所在(也是创新的另一关键要素:头脑活跃的人才)。 今天看到马斯克的一条推文: \\\"宁可乐观地犯错,也不要悲观地正确。\\\" (For quality of life, it is better to err on the side of being an optimist and wrong, rather than a pessimist and right.) 这或许就是\\\"笨笨的坚持\\\"吧。一开始可能并不清楚自己在坚持什么, 只是觉得有意思。但当你坚持走下去, 或许在某个回头的瞬间, 一切的意义已经自然而然地显露出来。 小羊驼笔记 @AztecaAlpaca 下午9:51 · 2026年1月23日 推文链接 引文链接 论坛音频：小宇宙\",\"date\":\"2026-01-23T13:51:00.000Z\",\"dateKey\":\"2026-01-23\",\"url\":\"/notes/tsinghua-agi-next-2026\",\"tags\":[\"AI\",\"清华\",\"思考\",\"创新\"]},{\"key\":\"note:about-one-person-who-mike-at-X\",\"section\":\"memo\",\"title\":\"这个人，我跟他打过一次交道。当时他发了两个帖子，连续火了，尤其是那条关于Apple ID的，流量达到了300w，整个人都很跳。粉…\",\"excerpt\":\"这个人，我跟他打过一次交道。当时他发了两个帖子，连续火了，尤其是那条关于Apple ID的，流量达到了300w，整个人都很跳。粉丝数也从300一天狂飙到3000。 随后他又发了另一条，关于注册Gmail的，又有20万流量，把我看傻了。我当时就转发了那一条，吐槽：就这, 也能火？ 随后，他到我评论区回复，说是的。然后问我想不想学，正在招生中... 当时我就很奇怪，不就是火了两条嘛，怎么就开始卖课了？在那之前，他也发了1000多条，粉丝数不过300。我是很菜，但两天之前，他也并不比我成功到哪里啊...而且我也走过狗屎运，只是踩到的没有那么大一坨而已。 我赶紧把转发他的帖子删了，把他屏蔽掉... 从那之后，我就经常吐槽X的算法，尤其是有些人说\\\"高质量内容会带来流量\\\", 我一直保持不屑... 我当然支持输出高质量内容，但事情远没那么简单。 我后来也有搜索过这个人，点进去看过几次，发现他接下来经常发一些英文内容，频率也很低，涨粉也趋于停滞，感觉是遇到了一些瓶颈。当然，也无所谓了。 踩到一次流量密码就开始不断地用来解释自己成功的必然性，甚至开始卖课，这种心态确实挺扭曲的。 小羊驼笔记 @AztecaAlpaca 上午9:32 · 2026年1月23日 原文链接 推文引用\",\"date\":\"2026-01-23T01:32:00.000Z\",\"dateKey\":\"2026-01-23\",\"url\":\"/notes/about-one-person-who-mike-at-X\",\"tags\":[\"社交媒体\",\"流量\",\"思考\"]},{\"key\":\"post:telegram-integration\",\"section\":\"build\",\"title\":\"为博客集成 Telegram 自动推送：GitHub Actions 与 Bot API 实战\",\"excerpt\":\"为了方便读者及时获取更新，我为 AlpacaNotes 博客增加了 Telegram 频道自动推送功能。每当有新文章发布时，GitHub Actions 会自动触发脚本，将文章标题和链接发送到订阅频道。以下是实现这一功能的简要流程。 首先，你需要拥有一个 Telegram 账号并申请一个机器人： 在 Telegram 中搜索 @BotFather。 发送指令 /newbot 创建新机器人。 按照提示设置机器人的名称（Name）和用户名（Username）。 创建成功后，BotFather 会给你一个 HTTP API Token（类似 123456789:ABCdef...），请妥善保管。 创建一个新的 Telegram Channel（频道），或者使用现有频道。 将你刚才创建的机器人添加为频道管理员（Administrator），赋予发送消息的权限。 为了获取频道的 Chat ID，你可以先在频道里随便发一条消息，然后转发给 @getidsbot（或其他类似 ID 查询机器人），它会返回以 -100 开头的频道 ID（例如 -1003229698152）。 为了安全起见，不要将 Token 直接硬编码在代码中。 进入博客项目的 GitHub 仓库页面。 点击 Settings -\u003e Secrets and variables -\u003e Actions。 新建 Repository Secret： TELEGRAM_TOKEN: 填入 BotFather 给你的 Token。 在项目中编写一个 Node.js 脚本（scripts/telegram-notify.js），用于检测变更并发送消息。 主要逻辑如下： 使用 git diff 识别本次提交中新增的 .md 文件。 解析 Markdown 文件的 Frontmatter（元数据），提取标题和描述。 调用 Telegram…\",\"date\":\"2026-01-23T00:00:00.000Z\",\"dateKey\":\"2026-01-23\",\"url\":\"/articles/telegram-integration\",\"tags\":[\"技术实践\",\"DevOps\",\"Telegram\",\"GitHub Actions\",\"Automation\"]},{\"key\":\"note:8000tweets\",\"section\":\"memo\",\"title\":\"第8000条内容，这是个里程碑。每1000条帖子，都会发表一下“获奖感言”。这次为了写得多一些，我又把蓝v充上了。\",\"excerpt\":\"第8000条内容，这是个里程碑。每1000条帖子，都会发表一下“获奖感言”。这次为了写得多一些，我又把蓝v充上了。 本来打算多与X平台冷战几天，保持素人的状态，摆脱那些数据统计的困扰。但发现没有会员，我发了很多零碎的短贴，导致数量很快就逼近了8000。我之前说过，发帖数也是很重要的成就，尤其是这些内容都是我花费时间与精力创作的。 这几天的流量不佳。不过随着经验积累，历经系统的反复捶打，也渐渐地接受了这种处境。对我而言，保持输出是唯一重要的。 那种搞流量，分“低保”的事情，一来有点遥不可及，另外要长期保持三个月500万曝光量也挺令人焦虑。这种政策就要求我们持续地蹭热点，关注那些大家都关注的内容。但是，我们的生活不可能总这样，每个人都应应当有自己的生活方式，有自己热衷的话题，有自己喜欢交往的人与物。刷热点能带来流量、些许收入和成就感，但沉迷于流量中的生活总归会少了许多重要的东西。 最近做了一些不一样的——把被闲置许久的网站进行了大改，增加和完善了许多功能。这个网站最早是用来分享内容，但在建站开发的过程中，我也会不断的思考许多交互的逻辑，把自己作为第一个严肃的用户对其反复拷打（事实上，除了我本人，也没有几个人看，感兴趣可以点击 linguista.cn ，你应该不会很失望）。当前AI在前端编程的能力非常恐怖，所以我并没有非常费神，而是频繁地获得惊喜，不断地为我提供正反馈。这种体验比最近形势惨淡的推特涨粉事业好了太多。 我不是专业开发者，因此我会在所有场合中都对真正专业的人士保持欣赏与尊重，这是让我能够从他们身上学到好东西的前提。我非常喜欢的一点就是，中推本身就云集了许多热衷于做产品的人，也有许多名副其实的大神级人物。通过一年多的观察，毫无疑问，技术区在中推中属于流量黑洞，但这并不重要，这个社区的朋友们是吸引我参与进来并不断地去表达的动力来源。 我希望自己是一个builder，不管…\",\"date\":\"2026-01-23T00:00:00.000Z\",\"dateKey\":\"2026-01-23\",\"url\":\"/notes/8000tweets\",\"tags\":[\"里程碑\",\"写作\",\"思考\"]},{\"key\":\"note:a-break-2026\",\"section\":\"memo\",\"title\":\"A break\",\"excerpt\":\"A break 需要做一些重要的事情。暂时不搞自媒体了… 现在我发现我的几个号基本上凉了，没人爱看，且振作不起来的那种。不过刚好我也需要清净一段时间，做一些重要的事情，所以先就此打住吧。 希望不会出现很多的取关，或许保持静默很重要，毕竟一旦露头，被发现很久没更新，还有点尴尬...在推上，为了达到分收益的及格线需要的三个月曝光，我距离5M的目标还差很多，基本上指望不上。最终应该还是要靠长期主义慢慢地达到目标，当前阶段的努力大概要前功尽弃了。 在推上花了很长时间，感觉有必要去开辟新的写作空间。推特有长文写作的功能，但体验不佳，我不是很情愿去在那里写作。比较理想的长文写作平台是 Substack。 当然，在 Substack 上也存在问题，那就是我不知道是否需要英文写作。我显然更适应写中文，但似乎这样很难获得关注，写英文，我还需要好好努力。 后面就随便写点东西吧，写作发帖，虽然不是专业的，但至少也成了我的一种生活方式。\",\"date\":\"2026-01-20T03:53:00.000Z\",\"dateKey\":\"2026-01-20\",\"url\":\"/notes/a-break-2026\",\"tags\":[\"反思\",\"写作\",\"社交媒体\"]},{\"key\":\"post:nie-weiping-from-my-view\",\"section\":\"essay\",\"title\":\"关于聂卫平\",\"excerpt\":\"“棋圣”聂卫平最近去世了。在1月18号举行的告别仪式上，他获得了至高的哀荣。习家和邓家这两个中国“第一家庭”都送来了花圈，社会各界名流人士前来悼念。 对于聂卫平，我了解的不多，只有一些零碎且模糊的片段。但这些足以让我对这位老人心生敬意。 我对围棋的关注不多，只能算知道吴清源、聂卫平、常昊、古力、柯洁、李昌镐、李世石这些人物。2016年初，阿尔法狗引发了大家对AI在围棋领域的广泛讨论。我也从那时开始对围棋的关注多了一些。后来刷到过一些柯洁对他自己围棋心路历程的复盘，也偶尔刷一下战鹰讲述各种围棋的花边故事，借此感受一下围棋的魅力，对围棋这项运动有一点点的感情。 聂卫平被誉为“棋圣”，而这个称号是依靠他在中日围棋擂台赛上的精彩发挥获得的，据说他是八十年代几乎所有中国人的偶像。 印象中，在我很小的时候，中国的围棋下不过李昌镐领衔的韩国，但稳压日本一头。后来常昊、古力崛起，基本上能与韩国棋手五五开。到了柯洁这一代，终于能够压制韩日，而且此时，中国围棋人才储备非常雄厚，学习围棋的人越来越多，发展越来越良性。 后来才知道，在聂卫平之前，中国围棋的整体水平并不高。日本在八十年代及之前，一直引领着围棋的发展。而聂卫平算得上较早具备挑战日本选手实力的中国棋手。 我第一次听说聂卫平，是小学时从报纸上读到的关于80年代中日围棋擂台赛的文章。当时看到的是第二届擂台赛，中国只剩下聂卫平一个主将，日本还有五位选手，其中有片冈聪、武宫正树、大竹英雄，都是如雷贯耳的人物。但聂老在每一场都是生死战的情况下，连胜5场，赢下了擂台赛。 当时我的了解也仅此而已。后来才发现，他在三届擂台赛中连赢了11场，这种壮举震古烁今。 从后来这些围棋领军人物——李昌镐、李世石、柯洁——的经历能看出，围棋选手到了30岁左右，棋力就会下降。围棋拼的是童子功、年轻和体力，20岁左右往往是巅峰年龄。柯洁还没到30岁，就已经能感觉到过了巅…\",\"date\":\"2026-01-19T00:00:00.000Z\",\"dateKey\":\"2026-01-19\",\"url\":\"/articles/nie-weiping-from-my-view\",\"tags\":[\"聂卫平\",\"围棋\",\"人物\",\"个人记忆\"]},{\"key\":\"note:call-of-create-tolkin\",\"section\":\"memo\",\"title\":\"创作是对抗虚无的途径\",\"excerpt\":\"创作是对抗虚无的途径 搞推大半年，我有 2000 多关注，但是写了 7000 多条帖子。从转化效果上看，似乎挺失败。 但不管怎么评价，能写几千条帖子（而且内容也不那么水哦），也是挺了不起的成就。对我而言，这个过程乐在其中，足以对抗流量焦虑。 昨天刷到这篇文章，介绍了托尔金的“次创造”哲学，我之前没听说过这个理论，但也是我逐渐形成的一种认知。创作能够获得什么（流量、收益）当然很重要，但即便没有这些，我也会去写一些东西。 在消费至上的喧嚣时代，创造并非消遣，而是人类对抗虚无、恢复神性形象的唯一途径。 创造不仅是服务他人的责任，更是磨炼灵魂的救赎。无论作品是否完美，唯有立刻行动，用具体的创造抵抗混乱，才能活出完整的生命意义。 🔖 延伸阅读 原文中译本：Why you must become a creator 来源： 阿兹特克小羊驼 (@AztecaAlpaca)\",\"date\":\"2026-01-18T12:23:00.000Z\",\"dateKey\":\"2026-01-18\",\"url\":\"/notes/call-of-create-tolkin\",\"tags\":[\"创作\",\"托尔金\",\"次创造\",\"虚无\",\"哲学\",\"流量焦虑\"]},{\"key\":\"note:software-like-youtube-a16z-comment\",\"section\":\"memo\",\"title\":\"我们将迎来一个通过软件讲故事的时代！（而不仅仅使用文字、图片和视频，我说的😎）\",\"excerpt\":\"我们将迎来一个通过软件讲故事的时代！（而不仅仅使用文字、图片和视频，我说的😎） 自从AI可以轻松胜任一些编程任务，软件开发就不再只属于专业人士，许多人都可以像做视频一样编写一些小软件（可能需要提一下，在十多年前，做视频的专业要求恐怕不低于软件开发） a16z 的这篇文章认为软件开发正在经历它的“YouTube 时刻”。 正如 YouTube 将视频创作权从好莱坞下放给大众，AI 工具（如 Claude Code、Cursor）正在彻底粉碎编程的高墙。这意味着： 门槛崩塌：你不再需要精通代码，只需拥有好点子即可构建应用。 媒介进化：软件正从单纯的“实用工具”转变为承载个人情绪与文化的“表达媒介”。 价值复利：相比易过期的内容，软件具有长期积累价值的优势。 这是一个创作平权的时代，AI 赋予了年轻一代前所未有的杠杆，让“掌控命运”变得触手可及。\",\"date\":\"2026-01-18T02:06:00.000Z\",\"dateKey\":\"2026-01-18\",\"url\":\"/notes/software-like-youtube-a16z-comment\",\"tags\":[\"software\",\"A16Z\",\"media\",\"ai\",\"llms\",\"youtube\"]},{\"key\":\"note:a-story-fraud-tel\",\"section\":\"memo\",\"title\":\"我接到过一个诈骗电话，说他是我们当地公安的，因我群发垃圾短信，要对我进行处罚，要我...\",\"excerpt\":\"我接到过一个诈骗电话，说他是我们当地公安的，因我群发垃圾短信，要对我进行处罚，要我... 我听了，直接把电话挂断，拨打了110询问情况。110那边说，如果你真犯事了，我们是不会电话通知你的，直接就上门问候了😂 这边110刚挂断，那边的电话就又打过来了，说：你竟然敢挂公安局的电话 跟我打电话的那位普通话还有点标准（引发了我的怀疑）。 不过他很认真地报了他的姓名与警号，很正规的样子，当时我想还是打110询问一下吧🤣 比较搞笑的是他被我挂断之后又气急败坏地打回来，说你竟然敢挂警察的电话。我当时赶紧又给他挂了，我旁边的朋友笑得肚子疼。之前的精心策划，突然间被他糟糕的心情给破坏掉了😅😅😅 来源：推文\",\"date\":\"2026-01-17T04:06:00.000Z\",\"dateKey\":\"2026-01-17\",\"url\":\"/notes/a-story-fraud-tel\",\"tags\":[\"诈骗\",\"警察\",\"狗血故事\"]},{\"key\":\"post:ai-tools-refactor-experience\",\"section\":\"build\",\"title\":\"网站重构过程中AI工具的体验\",\"excerpt\":\"来回顾一下，我在网站增加新功能或修复老问题的过程中，对AI的使用情况。 我的AI主要还是用在深度场景中，基本上都是用Windsurf。在这个过程中，我会调用不同的模型。我很少调用Claude的模型，因为一次请求可能会消耗比较多的点数，非常浪费。而且从效果上来说，我觉得Gemini和GPT各有千秋，但至少在前端方面，它们的效果都比Claude要好。 这一次我主要用的是Gemini 3 Pro，一次请求会消耗两个点的积分。不过我现在积分非常多，上个月其实挺浪费的，因为上个月沉迷于画图，用得很少，这个月已经过去一半了。在使用过程中，我基本上是毫无顾忌地消耗这些积分，感觉很爽。 总体来说，使用过程非常丝滑，很多问题都能得到解决。中间唯一出现比较糟糕的情况，是在之前网站重构过程中使用时遇到的。 夜间模式的主题无法正常启用。具体表现为字体颜色可以切换到夜间模式，但页面背景无法切换，始终是白天的背景，导致页面无法正常查看。 我试图修复这个Bug，也花了不少功夫。一开始我以为这是很简单的事情，但将这个问题提给AI后，它陷入了疯狂的内耗，沉思很久之后，并没有成功解决问题。 几次失败之后，我让AI先总结一下它的整个思考过程、尝试过的方法以及可能存在的问题，把可能的原因整理成一个文档。之所以整理文档，也跟它频繁、大量的思考过程导致上下文窗口被挤爆有一定关系。 由于上下文窗口被挤爆，我不得不重新开启一个新的对话。但这样的话，之前的记忆可能就没办法保留。于是，我新开了一个窗口，把它总结的文档放进去，然后让它重新开始思考分析。在这个过程中，有了这样一个操作后，效果是立竿见影的。 不过，这件事情也暴露了一个问题，就是GPT的上下文窗口是比较小的。而Gemini有一兆的上下文窗口，总体来说没有太大的这种顾虑。另外，我感受到的一点是，GPT和Gemini在性格上是有区别的。 Gemini是一个比较礼貌的AI…\",\"date\":\"2026-01-17T00:00:00.000Z\",\"dateKey\":\"2026-01-17\",\"url\":\"/articles/ai-tools-refactor-experience\",\"tags\":[\"AI工具\",\"Windsurf\",\"Gemini\",\"重构\",\"开发体验\"]},{\"key\":\"post:website-refactor-2026\",\"section\":\"build\",\"title\":\"博客网站开发与重构回顾\",\"excerpt\":\"我现在需要回顾一下过去三天的时间，主要是对我的网站进行重构。 前天的下午，我在浏览纳瓦尔的博客后，决定复刻一下他的博客。不过，随后我去骑车了，回来的时候已经大概十点多。纳瓦尔的博客网站非常简洁，我也需要一个比较简洁的网站，于是我用 windsurf 进行了复刻。我调用了 Gemini 3 Pro，效果好得让我震惊，只花了一次就基本完成了网站雏形的搭建。当然，也不是完全一次完成的，因为我之前做过几个网站，我让 AI 直接把之前网站的一些配置搬过来，进行了重新整理，效率非常高。 做完这些事情后，接下来要做的就是丰富网站内容。这是第二天的工作。第二天，我基本上完善了网站的不同功能模块，整体做得比较完善。这个时候我开始思考网站的定位，主要是提升页面展示效果，让它看起来更好看，同时还需要保持轻量化。因为我之前有一个比较大的博客网站，那个网站非常臃肿，内容太多了。 另一方面，我实在没怎么维护它，它原来的性能也是越来越差。我希望这个新的网站能够比较高效。 对这个网站，我的期望是： 首先用来更新我的文章，我自己写的文章。现在很难不去用AI来写，但是以自己为主导、以AI为辅助的创作，至少对自己来说这是非常重要的事情。这个博客网站将会主要更新这一类的文章。那些直接由AI生成或搬运的文章，我会放到其他地方。当然，这些东西也有价值。 另一个期望是让它进行一些推文备份的管理。我会每隔几天把推文下载下来，然后用AI来进行整理。实际上是用这个网站来进行整理。我下载下来的是JSON格式的文档，这种格式非常严格。我在几个月前曾尝试过把它转成Markdown格式，但这种格式的文件非常大，打开Markdown后基本上没办法进行任何操作。于是我就想到，为什么不直接把这些JSON原始数据放到一个文件夹里，然后通过程序直接生成网页内容？ 后来发现这条路非常可行且高效。我对推文页面进行了一些管控，增加了导航式功能，例如…\",\"date\":\"2026-01-17T00:00:00.000Z\",\"dateKey\":\"2026-01-17\",\"url\":\"/articles/website-refactor-2026\",\"tags\":[\"网站开发\",\"重构\",\"AI辅助\",\"博客系统\"]},{\"key\":\"note:x-articles-ultra-guides\",\"section\":\"memo\",\"title\":\"最近𝕏把“文章”功能下放给premium用户，我也用过几次，感觉与许多推友差不多，该功能有值得喜欢的地方，也有很多槽点。\",\"excerpt\":\"最近𝕏把“文章”功能下放给premium用户，我也用过几次，感觉与许多推友差不多，该功能有值得喜欢的地方，也有很多槽点。 𝕏平台官方的《X长文终极指南》，核心大概三部分： 宣布 𝕏 Articles 已全面向 Premium 用户开放，长文正式成为平台的“一级内容形态”，不再只是补充功能。 给出一套写长文的操作范式：从目的、标题、结构、语气、编辑、视觉呈现，到结尾的行动号召，强调“可读性”和“平台友好度”，明显是为移动端与算法服务的写作逻辑。 把 “写作—传播—变现” 串成一条闭环，明确告诉创作者：文章不只是表达工具，也是增长与订阅变现的入口。 𝕏对文章写作的建议：不追求文学性，而是要追求转化率、停留时间和复访。 评论区也许多看法，总体呈现明显的两极分化： 有不少核心用户热烈拥抱这一变化，将其视为突破280字限制的“未来形态”，并积极投入创作； 但更多的的声音则充满批判性，集中火力抨击“AI垃圾（AI Slop）”的潜在泛滥，担忧平台将沦为机器生成内容的倾倒场，质疑严肃作家是否会为了𝕏而放弃Substack。 在实操落地层面，用户也不再满足于“有功能”，而是追求“好体验”，包括但不限于：修复嵌入Bug、支持RTL语言（希伯来语/阿拉伯语）、要求更高级的编辑工具与定时发布功能... 另外，对文章功能，算法可见性成为痛点，创作者迫切希望长文能获得与其投入相匹配的流量扶持。 来源：阿兹特克小羊驼 @AztecaAlpaca\",\"date\":\"2026-01-16T13:25:00.000Z\",\"dateKey\":\"2026-01-16\",\"url\":\"/notes/x-articles-ultra-guides\",\"tags\":[\"X\",\"文章\",\"写作\",\"平台\",\"算法\"]},{\"key\":\"post:AI-and-healthcare-2026-zhang\",\"section\":\"essay\",\"title\":\"AI与医疗：效率与理解力的博弈\",\"excerpt\":\"作者：阿兹特克小羊驼 (@AztecaAlpaca) 发布时间：2026-01-14 原文链接：点击跳转 在1月10日于香港举行的高山书院十周年论坛上，国家传染病医学中心（上海）主任张文宏教授就 AI 在医疗领域的应用分享了见解。 张文宏明确反对将其系统性地引入医院的日常诊疗流程。 张文宏解释： 他个人使用 AI 的方式是让其对病例“先看一遍”，事后凭借深厚的专业经验，他可以一看就知道 AI 哪里是错的。 张文宏担忧的是，一名医生若从实习阶段就未经完整的诊断思维训练，直接借助 AI 获得结论，将导致其无法鉴别 AI 诊断的正误。这种能力的缺失，是隐藏在技术便利背后的深层隐患。 张文宏医生是一位话题人物，经常能够抛出值得讨论的问题。这一次，无疑又引起了热议。 在当前，如何将 AI 应用于医疗，始终是个热点话题。首先，面对繁琐的医疗工作，医疗工作者很难完全不用 AI。但医疗又是一个偏保守的行业，至少作为患者的时候，每个人还是希望能够被严肃对待。 当我们把人工智能放进医生的诊室时，我们其实是在进行一场巨大的交易。一方面，我们看到了惊人的效率——机器不知疲倦，能处理海量数据；但另一方面，我们面临着一个根本性的隐患：如果机器替医生做了所有的思考，医生还会思考吗？ 想象一下学习物理，如果一个人在学会牛顿定律之前就只会背公式表，他永远成不了物理学家。医学也是如此。张文宏担心的是，如果我们让 AI 系统性地接管诊断流程，年轻医生就会跳过“第一性原理”的推导过程。他们会直接得到答案，而错过了那种构建直觉所必需的“脑力折磨”。 当 AI 直接把结果端上来时，我们的大脑就会停止那种深入的、慢速的分析（系统2思维），转而依赖直觉（系统1思维）。结果可能是一群只会验证答案、不会寻找答案的医生。 如果不再使用某种能力，它可能会退化；大脑也是一样。 静默的自动驾驶： 医生可能会习惯 AI 总是对的，于是…\",\"date\":\"2026-01-14T00:00:00.000Z\",\"dateKey\":\"2026-01-14\",\"url\":\"/articles/AI-and-healthcare-2026-zhang\",\"tags\":[\"AI\",\"医疗\",\"张文宏\",\"人工智能\",\"医疗系统\"]},{\"key\":\"note:dankoe-next2years\",\"section\":\"memo\",\"title\":\"Dan Koe最近爆火的长文。\",\"excerpt\":\"Dan Koe最近爆火的长文。 他警告大家，工业时代的“专精”已成陷阱，我们正迎来属于博学者的“第二次文艺复兴”。 在这种趋势中，拥有多种兴趣非弱点，而是构建独特视角的终极优势。 Dan主张打造承载兴趣的商业“载体”，将跨领域思维转化为“观点护城河”。你无需细分领域，因为“你”即是利基市场。通过策展思想与系统化输出，将好奇心变为不可替代的终身事业。 本来在邮件中收到推送，打算慢慢读，结果不到两天竟然全网都在搬运与解读。看来蹭热度还是需要一定的敏感性。 我在昨天读过另一篇文章，也认为“通才的时代”要来了。可见这种观点不算标新立异。这是很多人能感知到的，正在默默地形成的一个共识。 了解Dan Koe的读者应该也会发现，这篇文章其实也没有什么很新颖的观点，而更像是对他一以贯之理念的一个汇总与延伸。 关于“通才”话题，未来几年肯定会被越来越多讨论的。通才并不是“样样通，样样松”，而是能够快速地从多个领域里及其思想与实践中的影响，从而可以用更高视角寻求对问题的理解与解决。 但通才不算是AI造就的。渴望博学是人的本能。在文艺复兴的年代，那些前沿的创作者，比如达芬奇与米开朗琪罗，他们都是通才。只是，在工业化时代，他们被不断细分的专业所割裂，不断地被边缘化。 在当前的经济环境与科技冲击下，过于细腻的专业分工逐渐展露其荒谬之处。而AI的突破，更是将掩埋通才的浮尘拂去。所以，Dan Koe认为这是“第二次文艺复兴”，当然也是“通才的复兴”。 那么，如何抓住这个机会呢？Dan Koe并不建议去追求那些本不属于自己的东西。与其看别人如何，不如利用好自己本就拥有的资源，技能、兴趣、激情，将自己品牌化，将自己的作品延伸到市场之中。 当然，我并不认为“通才”与“专才”有什么对立，人才在探索与解决问题的过程中，微观与宏观视角都很有价值，不同的问题的解决路径通常也需要两者结合，通一点或专一点，不过是技能光谱…\",\"date\":\"2026-01-13T04:45:00.000Z\",\"dateKey\":\"2026-01-13\",\"url\":\"/notes/dankoe-next2years\",\"tags\":[\"Dan Koe\",\"通才\",\"博学者\",\"第二次文艺复兴\",\"观点护城河\",\"个人品牌\"]},{\"key\":\"note:socials-math-quanta\",\"section\":\"memo\",\"title\":\"我特别喜欢了解数学家的工作方式。数学似乎是这个科技不断加速的时代中的一个bug。QuantaMagazine的这篇文章给出了一个…\",\"excerpt\":\"我特别喜欢了解数学家的工作方式。数学似乎是这个科技不断加速的时代中的一个bug。QuantaMagazine的这篇文章给出了一个非常有趣的观点： 数学问题之所以卡住，通常不是算力不足，而是视角单一；视角之所以被打破，依赖人与人之间的信息碰撞；这种碰撞高度依赖面对面的环境，而不是视频窗口里的轮流发言。 疫情期间会议全面线上化，让数学家们第一次集体意识到这种损失。Zoom 能传递信息，却很难制造“顺手一提”的瞬间。 AI时代，可能有一个让人略感不安的前景：如果研究者把“随便聊聊”也外包给 ChatGPT，而不是去敲同事的门，某些突破可能会直接消失。 原文链接：The Real Reason That Great Math Happens Over Coffee 推文来源：阿兹特克小羊驼 @AztecaAlpaca\",\"date\":\"2026-01-08T03:39:00.000Z\",\"dateKey\":\"2026-01-08\",\"url\":\"/notes/socials-math-quanta\",\"tags\":[\"数学\",\"QuantaMagazine\",\"视角\",\"信息碰撞\",\"AI\",\"研究方法\"]},{\"key\":\"post:create-for-what\",\"section\":\"essay\",\"title\":\"为谁创作？——平台、读者or你自己？\",\"excerpt\":\"很多经验贴都喜欢给萌新创作者灌输一条所谓的金科玉律：“要为用户创造价值。”这句话听起来无可辩驳。然而，当我们深入剖析内容平台的运作机制，就会发现这句箴言不仅不准确——它更是一个陷阱。 “为用户创造价值”的说法之所以具有欺骗性，是因为它掩盖了平台的真实目标。平台并非慈善机构，其核心商业模式是制造和聚集海量流量，从而获取广告收益。因此，平台真正需要的，是能够最大限度吸引用户注意力、让用户沉迷其中的内容，而不是内容本身质量有多高。 在这种模式下，创作者所谓的“创造价值”，其本质是在帮助平台创造流量价值。在这笔交易中，你创造的价值首先服务于平台的商业底线。至于它是否服务于你的读者——或者你自己——充其量只是一个次要的考虑。 所谓的“创造价值”是在为平台创造价值，为他们的流量创造价值，然后你从中获得一些少量抽成。 平台的算法制造了一个残酷的现实：一个只擅长搞流量的创作者，即便产出的是垃圾，也能风生水起；而一个能创作出高质量内容却不懂流量技巧的创作者，则注定被埋没。这不是系统的漏洞，这恰恰就是系统本身。 这就引出了一个核心悖论：如果一位创作者过度地为了流量而生产，就很容易在这个过程中“失去自我”。当创作的唯一目标变成追逐平台的算法和用户的瞬时兴趣时，创作者独特的思考和风格便荡然无存。而一个没有了“自我”的创作者，在平台眼中就只是一个消耗品。等到他那些获取流量的技能不再有效时，平台会毫不犹豫地将他彻底抛弃。 那么，可持续的创作之路在哪里？观察那些真正通过自媒体获得长期成功和丰厚“睡后收入”的人，会发现他们的核心策略惊人地一致：在创作时，首先为自己创造价值。只有做到这一点，自媒体工作才能变得可持续，并带来充分的激励。 “为自己创造价值”意味着，将每一次创作都视为一次自我迭代和提升的机会。在这种模式下，创作者能获得三重回报：首先，创作者自身在创作过程中实现了知识和能力的“正面积累”，内容质量…\",\"date\":\"2025-11-26T00:00:00.000Z\",\"dateKey\":\"2025-11-26\",\"url\":\"/articles/create-for-what\",\"tags\":[\"创作思考\",\"平台经济\",\"内容创作\",\"自我成长\"]},{\"key\":\"post:about-complain\",\"section\":\"essay\",\"title\":\"抱怨的哲学：当不公遭遇现实\",\"excerpt\":\"熊老板的观点：抱怨不公很难给自己带来实质性帮助 可以找到许多理由支持这一观点: 很多杰出人物，比如乔丹等运动员，很少会抱怨裁判不公，他会在后面把所有人打得心服口服；这两年樊振东也几乎没有任何抱怨，而是专注于打磨自己的技术与心智，即便被孤立，依然能够维持世界最佳的水平。 我们的精力有限，抱怨并不会带来积极的反馈，反而会把心情搞得很糟糕。更坏的是这种心态会把人的注意力引向非常消极的一面，这对于提升自己是一种阻碍。 不过，这些都是有前提的。我来解读一下公开抱怨不公的好处。 1.抱怨是一系列思考的开始。抱怨往往来自于真实感受，对迎着真实的问题（相比之下，那些刻意地阳光向上的观点反而不够真实）。抱怨的过程中，人们也在抛出真正的问题，而这些问题会驱动有意义的思考。 2.对心理健康有好处，避免把客观条件带来的负担过度施加给自己，造成心理负担且完全无法改善。 公开的抱怨有助于寻找共同处境的人，帮助人们认识到世界的部分真相，尤其是很多糟糕处境并不是因为自己能力不行（比如很多时候，打不赢比赛就是因为判罚不公正）。 3.抱怨通常是一种获得自洽的途径（它能够提供一个与积极提示不同的视角，从而获得对世界更加全面的看法）。而提升自己的基础往往就是内在的自洽，至于别人怎么想，并不重要。 4.关于提升自己，乔丹不需要抱怨不公，樊振东也只对那些处境置之一笑，这样很好。但需要注意这些例子的特殊性。 因为他们是自身拥有最高天赋，可以通过努力填补上那个人为制造的坑，而且他们拥有海量粉丝，总有很多人看得清问题，会积极地声援他们。 此外，由于境界较高，他们世界的规则比较单纯：NBA 不光不会对乔丹搞各种不公平，在多数时候会去讨好乔丹的，乔丹很清楚在当时的 NBA 谁是爹，对那些小小的不公，就像慈父一样原谅一切。樊振东也不需要考虑太多乱七八糟的，因为国乒这年头的水平离不开他，正常人都很清楚这一点。 5.不少大人物也会像…\",\"date\":\"2025-11-25T00:00:00.000Z\",\"dateKey\":\"2025-11-25\",\"url\":\"/articles/about-complain\",\"tags\":[\"哲学\",\"社会思考\",\"情绪管理\",\"儒家\"]},{\"key\":\"note:death-frontend-videogames\",\"section\":\"memo\",\"title\":\"技术的进步会解放人们对某项工作的理解力和想象力。相反，技术的长期停滞反而会让我们误以为某项工作本该如此...\",\"excerpt\":\"技术的进步会解放人们对某项工作的理解力和想象力。相反，技术的长期停滞反而会让我们误以为某项工作本该如此... 试想一下，八十年代玩初代马里奥画质的人是否能想象到现在3A大作的体验？ 后来游戏引擎的发展可以让80年代的画质几乎不需要费劲就能轻松做出来，但这是否说明游戏画面的设计师就此完蛋了呢？ 以为游戏画质本该如此而拒绝创新的人确实完蛋了，但是宫本茂没有止步于此; 在那个电子游戏萌芽的年代，很多年轻人也涌进来，贡献自己的创意，逐渐形成了当前的游戏生态。我们再回望当年，单从画质上看，现在的3A大作似乎已经成了另一类事物。 游戏行业的发展表明，通常随着技术的进步，对游戏的画质、美术、交互的要求总是更高、更细，对应的从业者也越来越多。 前端与游戏画质是比较接近的东西。人对视觉、交互体验方面的追求是无止境的，体验的提高会把人们的品味养刁，进一步提高对该行业的要求，相应地也就有了更多的工作需求。通常有了新技术之后只是开启了一个新世界。 我们无法根据现有的行业状态以及从业经验来认定未来会是什么样子。现在我们总是以技术停滞时代的思维惯性来看待正在迅速变革的行业。 \\\"前端已死\\\"就是这样一个例子。当然，我们刻板印象中的前端肯定要死了，但是服务于交互体验的前端会永远存在，而且正在进入全新的时代。 或许过几年再回头看，我们目前认为先进炫酷的前端设计就像习惯了3A大作之后的人们回看80年代的史前2D马赛克画质的游戏一样。 原帖链接 来源：阿兹特克小羊驼@AztecaAlpaca 与失业问题相关的是对劳动力的需求。那么游戏产业对劳动力的需求是否在下降呢？ 我看到一个数字，过去十多年游戏玩家的数量其实是在显著增长的（我看到一个数据，是从16年的十几亿增加到现在的30多亿）。 是否可以认为过去十多年电子游戏的技术没有明显进步呢？ 技术进步，一方面要看软件层面，在美工与软件开发模式变化大不大且不说（不写代码…\",\"date\":\"2025-11-19T17:16:00.000Z\",\"dateKey\":\"2025-11-20\",\"url\":\"/notes/death-frontend-videogames\",\"tags\":[\"前端\",\"技术\",\"游戏\",\"行业思考\"]},{\"key\":\"note:ludwitt-p1\",\"section\":\"memo\",\"title\":\"\\\"我度过了完美的一生“\",\"excerpt\":\"\\\"我度过了完美的一生“ 1951年4月29日，路德维希·维特根斯坦永远地闭上了眼睛。 他本可以成为历史上最不差钱的学者，但却放弃了所有财富，过着清苦的生活； 他是二十世纪最重要的哲学家，却仅以哲学为业，而不愿靠其谋生； 他人生的前半段开创了逻辑哲学，成为一代宗师，却在后半生致力于从相反的视角出发，创立了另一个门派——语言哲学。 听过刀郎的《罗刹海市》的应该有印象，他的父亲是奥地利的钢铁大亨，死后给他留下了丰厚遗产，足以让他成为欧洲最有钱的人之一。但他放弃了这份遗产，他认为金钱让人堕落。他一分钱都没有要，全部送给了自己的亲戚，理由是他认为这些人已经足够堕落，已无可救药。 彼时是一战刚结束，维特根斯坦在前线经历了战争，也一度沦为俘虏。他在战争期间陆陆续续地写下了他的思考，并结合之前的研究，在1920年前后整理出了著名的《逻辑哲学论》。 该书篇幅不大，但却是哲学史上最伟大的著作之一。只是这部作品给大约过了十年，才给维特根斯坦带来了一点点实在的回报。 这十年，几乎整个1920年代，维特根斯坦并没有继续他的哲学研究。他花了多年时间在奥地利乡村小学当老师，还编辑了一部非常成功的词典。后来，他为姐姐家设计了一栋小楼，也被认为非常经典的建筑。后来几经辗转，现在是维特根斯坦纪念馆。 维特根斯坦虽然已从哲学界隐退，但他的逻辑哲学论却一直是被学界研究与讨论的焦点。而当他终于再度出山之时，已经颇有一番“王者归来”的气势。彼时是大名鼎鼎的凯恩斯去火车站迎接他，而见面时凯恩斯的第一句话就是： \\\"上帝来了！\\\" （未完待续） 原帖链接\",\"date\":\"2025-11-18T04:00:00.000Z\",\"dateKey\":\"2025-11-18\",\"url\":\"/notes/ludwitt-p1\",\"tags\":[\"哲学\",\"维特根斯坦\",\"传记\"]},{\"key\":\"post:low_tech_guide_post_boom\",\"section\":\"essay\",\"title\":\"“下沉贴”的爆火与“流量黑洞”中的自嗨\",\"excerpt\":\"面对“下沉贴”的爆火，起号内容的频出，我陷入了沉思。不能说读者不对，毕竟东西能火一定是有原因的。 但又总觉着那里不对，好像是件很讽刺的事情：本来X还自诩为信息排泄链的源头，产出高质量内容，现在却在吸取来自尾端的东西，似乎还甘之如饴... 有时候惊叹自己的无知。但稍微了解后感想：还是继续保持无知吧。 让我惊叹的事情是最近在推上爆火的两个帖子，一个是注册美区Apple ID的教程，一个是注册Gmail的教程，前者260万流量，后者刚开贴，也有20万。这种流量的爆炸让我震惊，惊叹自己常自诩为大明白，竟然对一些“显而易见”的现实如此无知。 美区的Apple ID，我在两年多之前注册过，当时GPT刚出iOS版的客户端，我下载不了。一位朋友说美区的可以下载，于是我就在网上随便搜了一下教程，然后按照教程把美区的ID注册了，下载了GPT客户端使用至今。 昨天一看，发现这个爆火的帖子和我当年用的教程几乎一模一样，包括我的ID地址也选的俄勒冈州。当然，这个帖子引发的热议让我想起来了这个账号，于是我把iPhone切到美区，充了个礼品卡，开了一个X的basic会员。 如果说开美区的Apple ID还有些难度，那么注册Gmail也需要教程就有点让我震撼了。 我大概有四个Gmail，其中有两个是在去年年底注册，三个是美区的地址，前段时间白嫖了几个月的Gemini pro，爽了一把。 我在注册的过程中没有碰到任何技术困难，但是现在大家如此渴望一个详细的教程，不知是不是因为现在中美关系紧张，Google对中国的用户越发不友好。 这个经验帖可能考虑了一些复杂的情况，比如注册时需要手机验证码，国内的手机号会经常出现收不到验证码的情况，说明这个帖子应该有一定的实用价值，但是能如此爆火就有点让我吃惊。 我刚才转发了一下那个帖子并发表了惊叹，可能带着一些吐槽。我说“现在的X平台都那么下沉了吗？能翻墙出来，还不会注册…\",\"date\":\"2025-10-30T00:00:00.000Z\",\"dateKey\":\"2025-10-30\",\"url\":\"/articles/low_tech_guide_post_boom\",\"tags\":[\"技术\",\"X平台\",\"内容创作\",\"病毒传播\",\"科技限制\",\"社区互动\"]},{\"key\":\"post:about-nobel-prize-in-2025\",\"section\":\"essay\",\
