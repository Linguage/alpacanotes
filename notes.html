"title\":\"关于诺贝尔奖的感想（2025）\",\"excerpt\":\"一年一度的诺奖颁奖季过半，又是令国人失望的一年。作为一个打小热爱科学的人，我关注这个奖项十多次了，有那么几次挺开心的，比如钱永健、高锟、莫言、屠呦呦获奖，衷心地为他们高兴。但是其他年份，尤其是过去十年，心情越发不美丽。本文是我在当下的一些感想，其实也是我与朋友在失望之下的争吵中所达成的某种合理化解读。 我自我感觉成熟了，已经对诺奖祛魅。但出于对自己“墙头草”秉性的清醒认识，相信如果哪天中国人频繁拿奖到手软，我不会因为“物以稀为贵”而开始嫌弃，而是会重新为这个奖项赋予更伟大的意义，并对其大加赞扬。不过这些打脸的评价是留给未来的，所以在本文的标题中我需要加上2025这个年份，现在先把话撂这儿！当前的看法，也就如下这样吧。 2025年的颁奖还在继续，但是三项科学大奖已经名花有主。如往年一样，中国学者又一次地没能拿奖。后面还有三个奖项，想必大家兴趣不大，很多次颁发和平奖，我们感觉就像吃苍蝇一样，尤其是今年川普在颁奖季明显发力了，此时最好避其锋芒，毕竟此人惹不起，只能躲着。经济学奖，在当前形势下获奖显得有点不可思议，如果非要给，如果不颁给今日连发数文，抛出惊天理论的某日报，有点说不过去，我们姑且拭目以待吧！至于文学奖，莫言因为获得该奖，每每被推向舆论的风口浪尖，也算是个高危奖项。鉴于莫言得奖后在国内舆论获得的待遇，也可以认为中国人并不稀罕这种奖项。 相对于和平、经济和文学这三大“文科奖项”，国人显然更在乎“理科奖项”。过去这几十年，中国在科技领域发展迅猛，因此每次颁奖的时候也都跃跃欲试。但是自从屠呦呦获奖，至今已经十年了，三大科学奖每一次都与我们“擦肩而过”。 与自己的郁郁不得志相比，更气人的可能还是邻居家又在张灯结彩了。今年日本学者拿了生命科学医学奖和化学奖这两项大奖，刚刚看到石破茂现场直播打电话向生医奖得主坂口志文表示祝贺，电话列表里的名单又+1，化学奖颁给了北川进。今年的两次获…\",\"date\":\"2025-10-08T00:00:00.000Z\",\"dateKey\":\"2025-10-08\",\"url\":\"/articles/about-nobel-prize-in-2025\",\"tags\":[\"诺奖\",\"体制\",\"社会\"]},{\"key\":\"post:memory-of-running\",\"section\":\"essay\",\"title\":\"跑步的记忆\",\"excerpt\":\"我不知道自己喜不喜欢运动，但在 2021 年，确实进入了一段跑步的高潮。那年 10 月份跑了 200 多公里，一度以为自己要进化成一位\\\"严肃跑者\\\"，但在月底脚踝受伤，歇了几个月之后，跑步的习惯没有继续维系下去。 围绕这个主题，我搜集一些记忆碎片。 我在跑步方面毫无天赋可言。大二开始，我有过一波长达许久的夜跑经历——当时与好友每天晚上绕学校跑一圈（大约 4km），持续了一年左右。那位同学是我在本科阶段最好的朋友。不过后来，到了大三秋冬交际，因为雾霾实在严重，加之我与他的关系\\\"破裂\\\"，遂终止。 说到参加马拉松，我在更早的时候参加过一次半马。 那是 2018 年，成都的第二届马拉松。那个时候报名轻松一些，不像现在热度这么让人苦大仇深。当时设有 5km、半马以及全马，我和同学一起中签，他的是 5km 欢乐跑。 那一次我非常认真地进行训练。本科时那位跑友同学告诉我，如果能够轻松跑完 10km，跑完半马问题不大。9 月份报名，10 月底比赛，时间算得上比较充裕，可以有条不紊地准备。我的目标是先跑下 10km，这对我也不是什么挑战，训练了几次就完成了。后来不断提升，每周提高 2～3km，在比赛前一周左右跑完了第一个半马。 那一次马拉松，也是我目前唯一一次亲临现场感受气氛。那个气氛非常美妙，路边的观众非常多，助威声感觉非常震撼，烘托到了那种氛围——不跑完实在是浪费，毕竟一生之中要走那么多路，有人为你呐喊欢呼的并不多。观众应该多是赛道沿线的居民，也有不少沿线的小餐馆老板，为参赛者提供了很多诱人的美食——如果不追求成绩，吃一路估计问题也不大。赛事方准备的补给也比较丰富，大概每 2.5km 一个补水站，每 5km 一个物资更丰富的补给站，此外还有临时厕所方便解决问题。跑完之后，我领到了两个大礼包，装了水、水果和能量棒，还有应对失温的防护物资。加上之前领取的参赛大礼包，也差不多值回票价了。 刚读研…\",\"date\":\"2025-09-29T00:00:00.000Z\",\"dateKey\":\"2025-09-29\",\"url\":\"/articles/memory-of-running\",\"tags\":[\"生活方式\",\"跑步\",\"训练\",\"健康\",\"回忆\"]},{\"key\":\"post:git-incident-2025-09-28\",\"section\":\"build\",\"title\":\"代码“劫后余生”:记一场Git灾难与抢救\",\"excerpt\":\"如果你对类似的情况感到恐惧，或者对Git的使用还不够熟悉，可以参考我的自救手册。本文主要讲述这件事情的前后经过。 今天我发现博客的评论区没了，我感到很奇怪，因为这是我昨天下午做的，当时也提交到Git了。当时我猜，可能是今天进行主题修改的时候，AI不小心把该部分代码删掉了。虽然有点小不爽，但想来也不是很复杂的事情，毕竟昨天配置评论区的时候也没费多大劲。 然而，当我打开windsurf试图查找之前的记录，发现GPT-5-Codex一如既往地陷入了“内耗式”地查找，来来回回几圈之后，我忍不住叫停问它：到底找没找到？它的回答是，没有… 我很震惊，因为这种情况不太可能发生：最近每一次都是完成一小波修改就提交一下，已经养成了习惯。昨天的那个配置不可能丢失，我对那一部分工作印象很深刻，我坚信不是我出现幻觉，就是AI出现了幻觉。我打开了GitHub Desktop（我之前都是直接在IDE上随手提交的，功能相对简陋），试图依次查找与博客评论区相关的配置，我要跟AI对质！ 然而，真正惊悚的事情就此开始：我发现GitHub Desktop上记录的最新提交记录是3天前（25日）。我惊慌之余打开了GitHub网站，发现的确如此，我这几天的工作记录不存在。我很困惑，难道是创建了什么新的分支？于是就在GitHub Desktop上随便点点点，突然，当我切回Windsurf，发现该IDE上的文件夹目录已经回归到了25日… 话说，25日的时候，我这一系列工作才刚开始没多久啊！我傻了。 之前曾经出现过对Git的误操作导致一些记录找不到，不过那个时候的工作烂尾较多，丢失也不心疼。这一次，我好不容易把网站搭好，在25日晚上线，颇有成就感。25日之后，我又对该网站进一步完善，增加了评论区、搜索页、GA4的网站流量监控、深色主题等配置。我对UI交互方面也进行了许多优化，自认为体验比最初的版本好了许多。而此时我能找到的…\",\"date\":\"2025-09-28T00:00:00.000Z\",\"dateKey\":\"2025-09-28\",\"url\":\"/articles/git-incident-2025-09-28\",\"tags\":[\"数据恢复\",\"分支管理\",\"编程\",\"网站开发\"]},{\"key\":\"post:git-recover_guide\",\"section\":\"build\",\"title\":\"Git 历史回退自救手册：reflog 找回与分支指针恢复\",\"excerpt\":\"该指南来自于一次自我感觉惊险的经历， 一份精简但可操作的“掉历史”自救清单：当你在 GUI 或命令行误操作后，发现最近提交“消失”时，如何快速定位并安全恢复。 近期提交不见了：git log 顶端不是你刚做的提交。 工作区回到旧版本：本地文件和远端网站内容明显“时光倒流”。 远端与本地不一致：git status -sb 显示 main...origin/main [ahead N|behind N]。 直接成因：分支指针被移到旧提交，或进入分离 HEAD，导致近期提交不在当前分支历史中。 前几天可能埋下的雷： 直接 git checkout \u003ccommit\u003e 查看旧版本后继续开发/提交； 用 GUI 的“Checkout/Reset/Restore”类功能回到旧提交但未建保护分支； 偶发 git reset --hard \u003cold\u003e； 未及时推送，远端与本地脱节，引发误判。 今天触发的动作：在 GUI 中对某个旧提交执行了“Checkout/Reset”，把当前分支（例如 main）指针回退了。 用 reflog 找到目标提交 \u003csha\u003e（历史未丢，只是指针偏了）。 二选一恢复： 如远端历史需以本地为准：git push -f origin main 在 reflog 输出中，找到你需要回到的那次正确提交的 SHA（记为 \u003csha\u003e）。 说明：保留现场，历史连贯，最不容易出岔子。 说明：让当前分支指针“瞬移”到 \u003csha\u003e；如远端不是你想要的历史，后续可能需要强推。 查看旧版本用新分支：git checkout -b inspect-\u003cdate\u003e \u003csha\u003e。 小步提交，及时推送：远端即备份。 危险操作前打快照：git branch backup-\u003cdate\u003e 或 git tag safety-\u003cdate\u003e。 丢历史先看 reflog：优先 git reflog，再考虑其…\",\"date\":\"2025-09-28T00:00:00.000Z\",\"dateKey\":\"2025-09-28\",\"url\":\"/articles/git-recover_guide\",\"tags\":[\"技术实践\",\"Git\",\"数据恢复\",\"分支管理\"]},{\"key\":\"post:Updates-APPLE-Tahoe-v1\",\"section\":\"essay\",\"title\":\"虽然有点卡，但我喜欢Liquid Glass\",\"excerpt\":\"更新了一下苹果的系统，先是手机，后是电脑，体验良好。 不过接下来需要考虑的可能是更新一下设备，老旧的款式仿佛有点卡，只是别人不那么说，我也不太确信，也不希望如此。 我的好感来自于两点： 上个版本的“黑金主题”，切换过来之后一直没搞清楚怎么恢复之前的模式，被恶心了一年； WWDC上呈现的效果过于拉胯。过了几个月之后，惊喜地发现它远比预期的漂亮。 顺便地，我也把MacOS系统界面进行了修改，设计很好看，但可能是适配性问题，在刷网页的时候有点卡。 这一次，MacOS的系统代号为Tahoe，取名自著名的太浩湖。 这是一个旅游胜地，在文化与科技史上都具有传奇色彩，比如《教父2》电影的取景，比如著名的\\\"AlexNet拍卖会\\\"。可参考太浩湖的传奇故事及其数据可视化版本。\",\"date\":\"2025-09-12T00:00:00.000Z\",\"dateKey\":\"2025-09-12\",\"url\":\"/articles/Updates-APPLE-Tahoe-v1\",\"tags\":[\"生活方式\",\"测试\",\"苹果\"]},{\"key\":\"post:the-fate-of-general-han-xin\",\"section\":\"essay\",\"title\":\"韩信评传：月光下的不世之功与宿命悲歌\",\"excerpt\":\"在中国历史的长廊中，有些名字的陨落，比其升起更加令人扼腕。韩信，便是其中最耀眼的一位。他的一生，是一场关于天才、机遇与宿命的宏大戏剧，而贯穿始终的，是他那既能成就伟业、亦能招致杀身之祸的青春锋芒。 韩信的传奇，始于一道清冷的月光。若无萧何月下决绝的追寻，韩信或许终其一生，也只是个在市井中忍受过胯下之辱的落魄青年。那一夜，注定了他此后的不凡，也为他未来的悲剧埋下了伏笔。他得到了年长近三十岁的刘邦的破格提拔与充分信任，这在当时是一场匪夷所思的豪赌。刘邦赌上了自己的天下，而韩信，则用他那属于年轻人的、无所畏惧的才华，回报了这份知遇之恩。 在属于他的那短短数年高光时刻里，他几乎就是战争的化身。明修栈道，暗度陈仓；背水一战，置之死地而后生。这些军事史上的奇迹，无一不带着年轻人特有的傲慢、任性和敢于打破一切常规的锐气。可以说，正是这份不羁的性格，才让他立下了那样的不世之功。如果他是一个循规蹈矩、唯唯诺诺的人，他也绝不可能成为那个让项羽都束手无策的“兵仙”。 然而，当天下大局已定，当开拓的时代让位于守成的时代，他性格中那些曾经的优点，便成了最致命的缺陷。最大的问题，在于他太年轻了。不到三十岁便功高盖主，这让他难以低下高傲的头颅，去对那位已经步入晚年、心思深沉的君主察言观色。 对于刘邦而言，矛盾是显而易见的。在征讨英布中箭受伤后，他深知自己时日无多。此刻的他，需要的不再是一个能够改变战局的天才，而是一个能够确保政权平稳交接的“可控的听话的人”。韩信的危险，不在于他知道了什么秘密，而在于“听他的人太多了”。他的威望和能力，已经成了一个刘邦身后无人能镇住的巨大变数。 这道横亘在君臣间的年龄鸿沟与权力逻辑，是无法跨越的。或许，如果刘邦能年轻三十岁，他会欣喜于与这样一位军事天才惺惺相惜，恨不得日日与他泡在一起。但现实是，衰老的帝王需要的是稳定，而如日中天的韩信代表的却是不可知的未来。 因此，韩信的…\",\"date\":\"2025-08-07T00:00:00.000Z\",\"dateKey\":\"2025-08-07\",\"url\":\"/articles/the-fate-of-general-han-xin\",\"tags\":[\"人物\",\"历史评论\",\"韩信\"]},{\"key\":\"post:jota-passed-away\",\"section\":\"essay\",\"title\":\"R.I.P, Diogo!\",\"excerpt\":\"利物浦前锋迪奥戈·若塔（Diogo Jota）不幸逝世，享年28岁。据传他因为做了气胸手术，无法乘坐飞机，于是驾驶自己的兰博基尼，在其兄弟安德烈的陪同下前往利物浦，但途径西班牙境内，路况糟糕，在试图超越一辆卡车时发生了爆胎事故，导致车辆失控，兄弟俩不幸遇难。 在本博客中，我日常分享的第一篇就是类似于讣告的文章，这令人遗憾，但将其献给迪奥戈又是一种荣誉。 作为利物浦球迷，对这件事情感到震惊，但又有些麻木。似乎霉运总是会在这只球队最欢快的时候找上门来。利物浦今年刚刚拿到了阔别数年的英超冠军，而28岁的迪奥戈·若塔正值生涯的黄金年龄，备受期待，但一切都戛然而止了。 或许坚强地面对悲伤是利物浦球迷的必修课。我从2005年开始看球的时候就追随这家俱乐部，从“伊斯坦布尔之夜”开始，然后是近十年没有冠军进账的漫长等待，终于迎来了克洛普伟大的执教生涯以及克洛普与斯洛特堪称佳话的交接。在两天之前，我们经历了最开心最憧憬的一段时间，但现在需要重新开始。 为什么热爱利物浦？因为这支队伍的命运与我们的艹蛋人生太押韵了。 与这支球队共同经历过2005, 2019, 2020, 2025，两次欧冠，两次英超，次数没有那些豪门那么多，但每一次都是苦尽甘来。本以为40天之前的狂欢可以继续，但却传来永远不可挽回的噩耗。 在球迷的意识星空中，1985、1989年的那些星星永远照亮着一个个黯淡的夜晚。2025，天上又多了一颗星星，照亮不屈的人们继续前行。感谢迪奥戈在过去的五个赛季里的兢兢业业，为球队带来了一个个进球和一座座冠军奖杯。 You will never walk alone！ 注：本文中的图片均来自于利物浦官网\",\"date\":\"2025-07-05T00:00:00.000Z\",\"dateKey\":\"2025-07-05\",\"url\":\"/articles/jota-passed-away\",\"tags\":[\"足球\",\"利物浦\"]},{\"key\":\"post:newton_biography_review\",\"section\":\"essay\",\"title\":\"《牛顿传》读后记\",\"excerpt\":\"在阅读《牛顿传》之前，我对牛顿的印象还停留在课本和科普故事中。带着对这位科学巨匠的好奇，我试图通过这本传记，重新认识牛顿的真实人生与复杂性格。以下是我的一些思考与感受。 首先，毋庸置疑，牛顿是一个了不起的人物，很少有人能像他一样对我们每个人产生如此深刻的影响。他给世界带来的改变无需多言，但我们对他的认识和了解却非常肤浅。 我小学时就开始借阅关于牛顿的书，但当时阅读能力太差，读不下去，只是对他的一些故事有所耳闻，比如知道他出生在克伦威尔时期，但那时我并不知道克伦威尔是谁。后来我对科学史有了一些初步的了解，但我一直有意避开牛顿这个人，因为他太过久远，是个难以理解的神秘人物，总有种敬而远之的心态。相对来说，我当时更愿意去了解其他人，包括爱因斯坦、居里夫人、费曼等科学家。 这一次，我终于打开了牛顿的传记，阅读欲望很强烈，一气呵成地读完了全书。牛顿的生平非常丰富。首先，他寿命很长，活了 84 岁，这在当时属于非常难得的高寿。他的经历也很丰富。他出身不算差，后来在读书过程中一度并不出色，但突然奋发，从此之后就一直是最优秀的学生。后来他从事学术，接替了巴罗的位置，成为卢卡斯讲座的教授。他在20多岁的时候就做出了非常突出的成就，比如著名的万有引力，成了明星学者，并能够出入非常高级别的场所，在后来还成了政府重要的官员和国王的座上宾，成为全欧洲的话题人物。 我们对他的了解更多的是他作为科学家的成就，比如提出了万有引力定律、牛顿三定律以及光学原理，当然还有微积分。除此之外，我们对他的了解相对较少，偶尔听说他对炼金术很感兴趣，并且他非常虔诚，是一个清教徒。此外，他还炒股，有着惊世骇俗的韭菜经历，他一度血赚，最终血亏，最终成为了南海金融泡沫的受难者。关于他作为皇家造币厂厂长的经历，我也有所了解，但了解得并不多。通过这些事情，我所了解的还是一个比较片面、比较干瘪的牛顿。而这次读他的传记，让我对他这个人…\",\"date\":\"2025-07-01T00:00:00.000Z\",\"dateKey\":\"2025-07-01\",\"url\":\"/articles/newton_biography_review\",\"tags\":[\"评论\",\"传记\",\"学者\",\"牛顿\"]},{\"key\":\"post:pale-blue-dot-review\",\"section\":\"essay\",\"title\":\"《暗淡蓝点》读后记\",\"excerpt\":\"在浩瀚宇宙中，地球只是微不足道的一粒尘埃。然而，正是这颗“暗淡蓝点”，承载了人类全部的历史与情感。本文将从科学与人文的视角，分享我对卡尔·萨根《暗淡蓝点》一书的阅读体会，探讨我们在宇宙中的位置与意义。 卡尔·萨根去世于1996年，那时我还很小。几年后，在一本少儿科普读物中看到缅怀他的文章，于是他也成了我小学时记住的为数不多的几位外国科学家之一。 中学时读过《日本平家蟹》，当时阅读能力有限，没能理解文章背后的思想。不喜欢那种娓娓道来的叙述方式，更不喜欢那些虾啊蟹啊之类的事物。大学时，纪录片《宇宙》真正把我带进了科学殿堂，对“平家蟹”的疑惑也得以解开。 “平家蟹”揭示了一种造型上类似于日本武士的蟹类，被当地渔民认为是随平家沉入海底的武士们的化身。但卡尔·萨根告诉我们，当地渔民捞到长相与武士神似的螃蟹后会将其放生，以表达对平家武士的缅怀。久而久之，这类螃蟹的种群就繁衍壮大——本质上，这是一种“人工选择”（也可以说是经人之手的“自然选择”）。平家蟹的故事让我开始掌握用科学视角理解自然现象的技巧。 年轻时喜欢科学视角，却更沉迷于宏大叙事。毕竟，煌煌大国，数千年绵长文明，沧海横流与歌舞升平交织的历史，总让人热血澎湃。然而，后来发现，当宏大叙事照进日常生活时，总感觉有些不协调。这很正常，毕竟历史中最不起眼的人名，在当时恐怕都是显赫一时的人物，而我们在历史长河中不过是注定被遗忘的一颗水滴或一粒沙尘。 后来，在一个播客节目中，听到主播朗读《暗淡蓝点》中的那段文字，那种蓦然回首的动人瞬间在脑海中再也挥之不去： “再看看那个光点，它就在这里。这是家园，这是我们。你所爱的每一个人，你认识的每一个人，你听说过的每一个人，曾经有过的每一个人，都在它的上面度过他们的一生。我们的欢乐与痛苦聚集在一起。数以千计的自以为是的宗教、意识形态和经济学说，每一个猎人与采集者，每一个英雄与懦夫，每一个文明的缔造者与毁…\",\"date\":\"2025-07-01T00:00:00.000Z\",\"dateKey\":\"2025-07-01\",\"url\":\"/articles/pale-blue-dot-review\",\"tags\":[\"评论\",\"科学\",\"卡尔·萨根\",\"科普\"]},{\"key\":\"post:comment_hacker_painter\",\"section\":\"essay\",\"title\":\"评论：《黑客与画家》\",\"excerpt\":\"本文将围绕Paul Graham的《黑客与画家》展开评论，探讨黑客与艺术家的共通之处，以及黑客在工程科学等领域中所面临的现实困境与生存之道。 《黑客与画家》是Paul Graham（保罗·格雷厄姆）的一篇博客文章，该文章被收录至其同名的著作中，称得上是计算机领域里影响巨大的一篇文章。 保罗·格雷厄姆是知名的硅谷投资人，他创立了投资机构Y-Combinator，该机构孵化出了包括airbnb在内的无数家成功的初创企业。此外，在经营Y-Combinator的过程中，保罗发现并提拔了日后名声大噪的Sam Altman。与其成功的投资人经历相比，保罗的早年经历也挺传奇。他在哈佛拿到了计算机科学的博士学位，但后来又去罗德岛设计学院学习绘画。他在90年代，创建了叫做ViaWeb的互联网应用，并卖给了雅虎，赚得了自己的第一桶金。由此可以看出，《黑客与画家》这样一个主题正是作者个人经历的一个总结提炼。 当提起“黑客”，不少人会想到制造计算机病毒的或者破解某个网站密码的程序员。这多少是在互联网发展早期一些从事非法工作的程序员给“黑客”带来的坏名声。在更早的时候，黑客就是泛指那些技术精湛的程序员自身，而没有什么道德评判或工种划分。当然，在本篇评论之中，“黑客\\\"的内涵会被进一步泛化，他们将不再局限于进行计算机的编程工作，在任何领域里掌握着精湛技艺的人都可以成为黑客——这一点与作者所描述的黑客或许更为契合。 在文中，作者多角度地类比了黑客与画家着两类职业，并指出黑客的本质在于他们依托一些技术进行创作。 这种创作不同于科研工作，因为从事科研工作需要对他的研究方向的诸多细节有着深入的理解，他们需要对既有工作进行大量的学习，包括去了解相关的理论体系的、完成某项研究细节的实现，他们需要进行很多公式推导、科学实验，并逐渐形成对研究方向的直觉，这一切可以帮助他们在一个已经有了很多成果的方向上更进一步，或者说“…\",\"date\":\"2024-04-22T00:00:00.000Z\",\"dateKey\":\"2024-04-22\",\"url\":\"/articles/comment_hacker_painter\",\"tags\":[\"黑客\",\"计算机科学\",\"工程科学\",\"生活方式\"]}]}]}]}]]}]\n"])</script><script>self.__next_f.push([1,"11:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\nf:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Notes - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Essay、Build 与 Memo：文章、制作记录和日常笔记。\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/notes\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"AlpacaNotes Blog\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image\",\"content\":\"https://linguista.cn/alpacanotes/aztecaalpaca.jpg\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"12\",{\"property\":\"og:image:alt\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"13\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:site\",\"content\":\"@linguista2025\"}],[\"$\",\"meta\",\"16\",{\"name\":\"twitter:creator\",\"content\":\"@linguista2025\"}],[\"$\",\"meta\",\"17\",{\"name\":\"twitter:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"18\",{\"name\":\"twitter:description\",\"content\":\"AlpacaNotes Blog\"}],[\"$\",\"meta\",\"19\",{\"name\":\"twitter:image\",\"content\":\"https://linguista.cn/alpacanotes/aztecaalpaca.jpg\"}],[\"$\",\"link\",\"20\",{\"rel\":\"icon\",\"href\":\"/alpacanotes/favicon.svg\",\"type\":\"image/svg+xml\"}]]\n"])</script><script>self.__next_f.push([1,"d:null\n"])</script></body></html>
