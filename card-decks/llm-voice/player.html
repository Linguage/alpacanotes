<script>'use strict';

// MiaoYan's standalone export uses a fixed canvas and assigns each page a number.
function adaptNumberedSlides(body) {
  const stage = body.querySelector(':scope > #stage');
  const sourceDeck = stage?.querySelector(':scope > #deck');
  if (!sourceDeck) return null;
  const slides = [...sourceDeck.children];
  if (slides.length < 2 || slides.length > 200 || !slides.every((slide, index) =>
    slide.matches('section.page') && slide.dataset.page === String(index + 1) &&
    slide.id === 'page-' + (index + 1)
  )) return null;

  const deck = document.createElement('main');
  deck.dataset.htmlCardsDeck = '1';
  deck.dataset.htmlCardsAdapted = 'numbered';
  const styles = [...body.querySelectorAll('style')].map(style => style.textContent).join('\n');
  if (/\bhtml\.dark\b/.test(styles)) deck.dataset.htmlCardsThemes = '';
  if (/\bhtml\.portrait\b/.test(styles)) deck.dataset.htmlCardsAspects = '';
  for (const slide of slides) {
    const frame = document.createElement('div');
    frame.dataset.htmlCardsSlide = '';
    slide.classList.add('active');
    frame.append(slide);
    deck.append(frame);
  }
  const shortcut = [...slides[0].querySelectorAll('span.font-mono')].find(node =>
    node.childElementCount === 0 && /^KEYBOARD:.*\bESC\s+目录/.test(node.textContent.trim()));
  if (shortcut) shortcut.textContent = shortcut.textContent.replace(/ESC\s+目录\s*·\s*/g, '');
  stage.replaceWith(deck);
  for (const selector of [':scope > #hud', ':scope > #drawer']) body.querySelector(selector)?.remove();
  return deck;
}

function mountHtmlCardsDeck(deck, loadPage) {
  const slides = [...deck.children].filter(node => node.hasAttribute('data-html-cards-slide'));
  if (!slides.length) return;
  const root = document.documentElement;
  const channel = 'pagestudio-deck';
  const send = (type, detail) => window.parent.postMessage({ channel, version: 1, type, ...detail }, '*');
  document.body.classList.add('html-cards-deck-player');
  deck.tabIndex = 0;
  deck.setAttribute('aria-label', '幻灯片');
  const controls = document.createElement('nav');
  controls.className = 'html-cards-deck-controls';
  controls.setAttribute('aria-label', '幻灯片播放');
  const icons = {
    directory: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/>',
    theme: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/>',
    aspect: '<rect x="7" y="3.5" width="10" height="17" rx="2"/><path d="M11 17.5h2"/>',
    previous: '<path d="m15 6-6 6 6 6"/>',
    next: '<path d="m9 6 6 6-6 6"/>',
    expand: '<path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/>',
    collapse: '<path d="M4 9h5V4m11 5h-5V4M4 15h5v5m11-5h-5v5"/>',
  };
  function setIcon(control, icon, label, shortcut) {
    control.setAttribute('aria-label', label);
    control.title = shortcut ? `${label} (${shortcut})` : label;
    control.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${icons[icon]}</svg>`;
  }
  function button(icon, label, shortcut) {
    const control = document.createElement('button');
    control.type = 'button';
    setIcon(control, icon, label, shortcut);
    return control;
  }
  const previous = button('previous', '上一页', '←');
  const next = button('next', '下一页', '→');
  const directoryButton = button('directory', '幻灯片目录');
  const directory = document.createElement('ol');
  const pageNumber = number => String(number).padStart(Math.max(2, String(slides.length).length), '0');
  directory.id = 'html-cards-deck-directory';
  directory.className = 'html-cards-deck-directory';
  directory.setAttribute('aria-label', '幻灯片目录');
  directory.hidden = true;
  directoryButton.hidden = slides.length < 2;
  directoryButton.setAttribute('aria-controls', directory.id);
  directoryButton.setAttribute('aria-expanded', 'false');
  const directoryItems = slides.map((slide, number) => {
    const item = document.createElement('li');
    const entry = document.createElement('button');
    entry.type = 'button';
    const label = document.createElement('span');
    const title = slide.querySelector('h1,h2')?.textContent.trim().replace(/\s+/g, ' ');
    const pageLabel = `第 ${number + 1} 页`;
    label.textContent = title || pageLabel;
    const count = document.createElement('span');
    count.textContent = pageNumber(number + 1);
    count.setAttribute('aria-hidden', 'true');
    entry.setAttribute('aria-label', title ? `${pageLabel}，${title}` : pageLabel);
    entry.append(count, label);
    entry.onclick = () => { navigate(number); setDirectory(false, true); };
    item.append(entry);
    directory.append(item);
    return entry;
  });
  const theme = button('theme', '主题', 'T');
  theme.hidden = !deck.hasAttribute('data-html-cards-themes');
  theme.setAttribute('aria-pressed', String(root.classList.contains('dark')));
  const aspect = button('aspect', '横竖屏', 'R');
  aspect.hidden = !deck.hasAttribute('data-html-cards-aspects');
  const full = button('expand', '全屏', 'F');
  full.hidden = window.parent !== window;
  const position = document.createElement('output');
  const pageStatus = document.createElement('span');
  const pageCount = document.createElement('span');
  pageStatus.className = 'html-cards-deck-visually-hidden';
  pageCount.setAttribute('aria-hidden', 'true');
  position.append(pageStatus, pageCount);
  controls.append(directoryButton, theme, aspect, previous, position, next, full);
  const dock = document.createElement('div');
  dock.className = 'html-cards-deck-dock';
  dock.append(controls, directory);
  deck.after(dock);

  let index = 0;
  let fit = true;
  let orientation;
  let presenting = false;
  let hostConnected = false;
  let lastPortrait;
  let navigate = show;
  let preloadNext = () => {};
  if (loadPage) {
    const pending = new Map();
    const feedback = document.createElement('div');
    feedback.className = 'html-cards-deck-feedback';
    feedback.hidden = true;
    const message = document.createElement('span');
    message.setAttribute('role', 'status');
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.textContent = '重试';
    feedback.append(message, retry);
    dock.append(feedback);
    let requested = 0;

    function load(index) {
      const section = slides[index]?.firstElementChild;
      if (!section?.hasAttribute('data-html-cards-deferred')) return Promise.resolve(true);
      if (!pending.has(index)) {
        pending.set(index, loadPage(index + 1).then(fragment => {
          if (!fragment) return false;
          section.replaceChildren(fragment);
          section.removeAttribute('data-html-cards-deferred');
          return true;
        }).finally(() => pending.delete(index)));
      }
      return pending.get(index);
    }

    // Keep one adjacent slide ready without fetching the rest of the deck.
    preloadNext = () => {
      const page = index;
      if (hostConnected) setTimeout(() => { if (requested === page) void load(page + 1); }, 0);
    };
    navigate = async page => {
      requested = Math.max(0, Math.min(slides.length - 1, page));
      const target = requested;
      const deferred = slides[target].firstElementChild?.hasAttribute('data-html-cards-deferred');
      retry.hidden = true;
      feedback.hidden = !deferred;
      if (deferred) {
        message.textContent = '正在加载第 ' + (target + 1) + ' 页';
        const loaded = await load(target);
        if (target !== requested) return;
        if (!loaded) {
          message.textContent = '第 ' + (target + 1) + ' 页加载失败';
          retry.hidden = false;
          return;
        }
      }
      feedback.hidden = true;
      show(target);
      preloadNext();
    };
    retry.onclick = () => navigate(requested);
  }
  function setDirectory(open, restoreFocus = false) {
    directory.hidden = !open;
    directoryButton.setAttribute('aria-expanded', String(open));
    if (open) directoryItems[index].focus();
    else if (restoreFocus) directoryButton.focus();
  }
  directoryButton.onclick = () => setDirectory(directory.hidden);
  directory.addEventListener('keydown', event => {
    const focused = directoryItems.indexOf(event.target);
    const targets = { ArrowUp: focused - 1, ArrowDown: focused + 1, Home: 0, End: directoryItems.length - 1 };
    if (focused === -1 || !Object.hasOwn(targets, event.key)) return;
    event.preventDefault();
    event.stopPropagation();
    directoryItems[Math.max(0, Math.min(directoryItems.length - 1, targets[event.key]))].focus();
  });
  document.addEventListener('pointerdown', event => {
    if (!directory.hidden && !directory.contains(event.target) && !directoryButton.contains(event.target)) setDirectory(false);
  });
  function fitPortrait() {
    const section = slides[index].firstElementChild;
    if (!section || !lastPortrait) return;
    const areas = [...section.querySelectorAll('.page-inner,.ed-main,.card,.ed-quad-cell')];
    const fits = () => areas.every(node => node.scrollHeight <= node.clientHeight + 2 && node.scrollWidth <= node.clientWidth + 2);
    let low = 24, high = 35;
    section.style.setProperty('--ed-fs', high + 'px');
    if (fits()) return;
    for (let step = 0; step < 7; step++) {
      const middle = (low + high) / 2;
      section.style.setProperty('--ed-fs', middle + 'px');
      if (fits()) low = middle;
      else high = middle;
    }
    section.style.setProperty('--ed-fs', (Math.floor(low * 2) / 2) + 'px');
  }
  function size() {
    const portrait = !aspect.hidden && (orientation ?? (window.innerHeight > window.innerWidth));
    if (portrait !== lastPortrait) {
      lastPortrait = portrait;
      root.classList.toggle('portrait', portrait);
      aspect.setAttribute('aria-pressed', String(portrait));
      fitPortrait();
    }
    const width = portrait ? 1080 : 1920;
    const height = portrait ? 1920 : 1080;
    const scale = fit ? Math.min(1, Math.max(1, deck.clientWidth - 24) / width, Math.max(1, deck.clientHeight - 24) / height) : 1;
    slides[index].style.zoom = String(scale);
  }
  function show(page) {
    directoryItems[index].removeAttribute('aria-current');
    index = Math.max(0, Math.min(slides.length - 1, page));
    slides.forEach((slide, number) => { slide.hidden = number !== index; });
    previous.disabled = index === 0;
    next.disabled = index === slides.length - 1;
    directoryItems[index].setAttribute('aria-current', 'page');
    pageStatus.textContent = `第 ${index + 1} 页，共 ${slides.length} 页`;
    pageCount.textContent = `${pageNumber(index + 1)} / ${pageNumber(slides.length)}`;
    deck.scrollTo(0, 0);
    size();
    fitPortrait();
  }
  previous.onclick = () => navigate(index - 1);
  next.onclick = () => navigate(index + 1);
  theme.onclick = () => {
    const dark = root.classList.toggle('dark');
    root.classList.toggle('light', !dark);
    theme.setAttribute('aria-pressed', String(dark));
  };
  aspect.onclick = () => { orientation = !lastPortrait; size(); };
  function setPresenting(active) {
    if (presenting !== active || !full.hasAttribute('aria-pressed')) {
      setIcon(full, active ? 'collapse' : 'expand', active ? '退出全屏' : '全屏', 'F');
    }
    presenting = active;
    full.setAttribute('aria-pressed', String(active));
  }
  function requestFullscreen(active) {
    if (hostConnected) send('fullscreen', { active });
    else if (window.parent === window) {
      const operation = active ? root.requestFullscreen?.() : document.exitFullscreen?.();
      operation?.catch(() => {});
    }
  }
  full.onclick = () => requestFullscreen(!presenting);
  document.addEventListener('fullscreenchange', () => {
    if (!hostConnected) setPresenting(Boolean(document.fullscreenElement));
  });
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest?.('select,input,textarea,[contenteditable]')) return;
    if (!directory.hidden && event.key === 'Escape') {
      setDirectory(false, true);
      event.preventDefault();
      return;
    }
    if (directory.contains(event.target)) return;
    if (!full.hidden && /^f$/i.test(event.key)) {
      if (!event.repeat) requestFullscreen(!presenting);
      event.preventDefault();
      return;
    }
    if (event.key === 'Escape' && presenting && hostConnected) {
      requestFullscreen(false);
      event.preventDefault();
      return;
    }
    if (!theme.hidden && /^t$/i.test(event.key)) { if (!event.repeat) theme.click(); return; }
    if (!aspect.hidden && /^r$/i.test(event.key)) { if (!event.repeat) aspect.click(); return; }
    const pages = { ArrowLeft: index - 1, ArrowRight: index + 1, Home: 0, End: slides.length - 1 };
    if (!Object.hasOwn(pages, event.key)) return;
    event.preventDefault();
    navigate(pages[event.key]);
  });
  window.addEventListener('resize', size);
  window.addEventListener('message', event => {
    if (event.source !== window.parent) return;
    if (event.data?.channel === channel && event.data.version === 1 && event.data.type === 'host') {
      const firstContact = !hostConnected;
      hostConnected = true;
      full.hidden = false;
      setPresenting(event.data.fullscreen === true);
      size();
      if (firstContact) {
        send('ready');
        preloadNext();
      }
    }
    if (event.data?.channel === 'dsh-html-cards-reader' && typeof event.data.fit === 'boolean') {
      fit = event.data.fit;
      size();
    }
  });
  navigate(0);
  document.fonts?.ready.then(fitPortrait);
  if (window.parent !== window) send('ready');
}
</script>
<script>'use strict';
(() => {
  const payload = document.getElementById('reader-data');
  const { html, title, hasTailwind, deferred } = JSON.parse(payload.textContent);
  payload.remove();
  document.title = title;

  const template = document.createElement('template');
  template.innerHTML = html;
  const source = template.content;
  const digest = source.querySelector('meta[name="article-card-digest"]')?.content;
  const articleCanvas = /^[a-f0-9]{64}$/.test(digest) ? source.querySelector('.canvas-list') : null;
  const articlePages = articleCanvas ? [...articleCanvas.querySelectorAll('.sheet-wrap > article[data-canvas-width]')] : [];
  if (articlePages.length) {
    source.querySelector('nav.toolbar')?.remove();
    articleCanvas.style.justifyContent = 'safe center';
  }

  if (hasTailwind) {
    for (const script of source.querySelectorAll('script:not([src])')) {
      const config = script.textContent.match(/^\s*tailwind\.config\s*=\s*(\{[\s\S]*\})\s*;?\s*$/);
      if (!config || config[1].length > 32000) continue;
      try {
        const parsed = window.JSON5.parse(config[1], (key, value) =>
          ['__proto__', 'constructor', 'prototype'].includes(key) ? undefined : value);
        const settings = {};
        if (parsed.theme && typeof parsed.theme === 'object') settings.theme = parsed.theme;
        if (['class', 'media', 'selector'].includes(parsed.darkMode)) settings.darkMode = parsed.darkMode;
        if (Object.keys(settings).length) window.tailwind.config = settings;
      } catch (error) {
        console.warn('Could not read the card theme', error);
      }
      break;
    }
  }

  function sanitize(fragment) {
    const block = 'script,iframe,frame,frameset,object,embed,portal,base,link,meta,template,title,animate,set,animateTransform,animateMotion,discard';
    fragment.querySelectorAll(block).forEach(node => node.remove());
    for (const node of fragment.querySelectorAll('*')) {
      for (const { name, value, localName } of [...node.attributes]) {
        const key = localName.toLowerCase();
        if (key.startsWith('on') || ['target', 'action', 'formaction', 'srcdoc', 'srcset', 'ping', 'poster', 'background', 'data', 'attributionsrc', 'autofocus', 'base'].includes(key)) {
          node.removeAttribute(name);
        } else if (key === 'href' && !value.startsWith('#')) {
          node.removeAttribute(name);
        } else if (key === 'src' && !/^data:image\//i.test(value)) {
          node.removeAttribute(name);
        }
      }
    }
    return fragment;
  }
  sanitize(source);

  // Template parsing strips the root elements. Copy their presentation attributes separately.
  const structure = html.replace(/<!--[\s\S]*?-->|<(script|style|textarea)\b[^>]*>[\s\S]*?<\/\1\s*>/gi, '');
  const copied = new Set();
  for (const [, name, attributes] of structure.matchAll(/<(html|body)\b((?:[^>"']|"[^"]*"|'[^']*')*)>/gi)) {
    const kind = name.toLowerCase();
    if (copied.has(kind)) continue;
    copied.add(kind);
    const opening = document.createElement('template');
    opening.innerHTML = '<div' + attributes + '></div>';
    const from = opening.content.firstElementChild;
    const target = kind === 'html' ? document.documentElement : document.body;
    for (const attr of ['class', 'style', 'lang', 'dir', 'id']) {
      if (from?.hasAttribute(attr)) target.setAttribute(attr, from.getAttribute(attr));
    }
  }
  document.body.append(source);
  const deck = typeof mountHtmlCardsDeck === 'function' &&
    (document.querySelector('main[data-html-cards-deck="1"]') || adaptNumberedSlides(document.body));
  if (deck) {
    const playerStyles = document.head.querySelector('#deck-player-style');
    if (playerStyles) document.body.append(playerStyles);
    if (!document.documentElement.hasAttribute('data-html-cards-capture')) {
      const loadPage = deferred === true && window.parent !== window ? page => new Promise(resolve => {
        const channel = 'pagestudio-deck';
        function finish(fragment) {
          clearTimeout(timeout);
          window.removeEventListener('message', receive);
          resolve(fragment);
        }
        function receive(event) {
          const data = event.data;
          if (event.source !== window.parent || data?.channel !== channel || data.version !== 1 ||
              data.type !== 'page-content' || data.page !== page) return;
          if (typeof data.html !== 'string') return finish(null);
          const part = document.createElement('template');
          part.innerHTML = data.html;
          finish(sanitize(part.content));
        }
        const timeout = setTimeout(() => finish(null), 20000);
        window.addEventListener('message', receive);
        window.parent.postMessage({ channel, version: 1, type: 'page-request', page }, '*');
      }) : undefined;
      mountHtmlCardsDeck(deck, loadPage);
    }
    return;
  }
  // Give unstyled documents a readable default without replacing authored palettes.
  if (!hasTailwind && !document.body.querySelector('style,[style]') &&
      !document.body.hasAttribute('style') && !document.documentElement.hasAttribute('style')) {
    document.documentElement.setAttribute('data-html-cards-plain', '');
    document.documentElement.classList.add('pagestudio-theme');
  }

  const artboards = articlePages.length ? articlePages : [...document.body.children].filter(node => !node.matches('script,style'));
  const originalStyles = ['zoom', 'overflow-x', 'justify-content', 'align-items', 'translate'].map(name =>
    [name, document.body.style.getPropertyValue(name), document.body.style.getPropertyPriority(name)]);
  function horizontalBounds() {
    const boxes = artboards.map(node => node.getBoundingClientRect()).filter(box => box.width && box.height);
    if (boxes.length) return [Math.min(...boxes.map(box => box.left)), Math.max(...boxes.map(box => box.right))];
  }
  let fit = true;
  let frame = 0;
  function layout() {
    for (const [name, value, priority] of originalStyles) document.body.style.setProperty(name, value, priority);
    const viewport = document.documentElement.clientWidth;
    const bounds = horizontalBounds();
    if (!bounds || !viewport) return;
    const [left, right] = bounds;
    const width = right - left;
    if (left >= -1 && right <= viewport + 1) return;
    const body = getComputedStyle(document.body);
    const baseZoom = Number(body.zoom) || 1;
    const box = articlePages.length ? getComputedStyle(articleCanvas) : body;
    const gutters = ['paddingLeft', 'paddingRight', 'marginLeft', 'marginRight']
      .reduce((total, key) => total + (Number.parseFloat(box[key]) || 0), 0) * baseZoom;
    if (fit && width + gutters > viewport) {
      document.body.style.zoom = String(baseZoom * (viewport - 1) / (width + gutters));
    }
    // Centered, fixed-width canvases otherwise start outside the scrollable area.
    if (body.justifyContent === 'center') document.body.style.justifyContent = 'safe center';
    if (body.alignItems === 'center') document.body.style.alignItems = 'safe center';
    document.body.style.overflowX = 'visible';
    if (fit && body.translate === 'none') {
      const [fittedLeft, fittedRight] = horizontalBounds() ?? bounds;
      // A centered scale transform can leave a leading gap after safe alignment.
      const excess = Math.min(fittedLeft, fittedRight - viewport + 1);
      if (excess > 1) document.body.style.translate = (-excess / (Number(body.zoom) || 1)) + 'px 0';
    }
  }
  function scheduleLayout() {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(layout);
  }
  const resize = new ResizeObserver(scheduleLayout);
  artboards.forEach(node => resize.observe(node));
  window.addEventListener('resize', scheduleLayout);
  window.addEventListener('load', scheduleLayout);
  window.addEventListener('message', event => {
    if (event.source !== window.parent || event.data?.channel !== 'dsh-html-cards-reader') return;
    const { theme, appearance, fit: nextFit } = event.data;
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-html-cards-theme', theme);
    if (appearance === 'song' || appearance === 'retro') document.documentElement.dataset.appearance = appearance;
    if (typeof nextFit === 'boolean') {
      fit = nextFit;
      scheduleLayout();
    }
  });
  scheduleLayout();
})();
</script>
