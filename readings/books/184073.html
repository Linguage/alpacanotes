73:mark:184073_1_2432-2491\",\"quote\":\"直至1453年君士坦丁堡被攻陷，除了在艺术上增加了一种传统和制定了罗马法典以外，东罗马没有给世界创造更多重要的东西。 \",\"chapter\":\"绪论 \",\"date\":\"2020-06-08\"},{\"id\":\"184073:mark:184073_1_308-403\",\"quote\":\"还有一片领域，它既不属于科学范畴，也不属于神学范畴，双方都不承认它，并且还攻击它，这片领域便是哲学。哲学家们最热衷的那些问题，科学根本给不出一个答案；神学家们给出的答案越来越不能让人信服。 \",\"chapter\":\"绪论 \",\"date\":\"2020-06-08\"},{\"id\":\"184073:mark:184073_1_880-933\",\"quote\":\"要想了解一个民族或者一个时代，就必须了解它的哲学；当我们试图去做到这一点的时候，我们身上便有了哲学家的影子\",\"chapter\":\"绪论 \",\"date\":\"2020-06-08\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[]}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"西方哲学简史 - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"伯兰特·罗素 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/184073\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image\",\"content\":\"https://linguista.cn/alpacanotes/aztecaalpaca.jpg\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"12\",{\"property\":\"og:image:alt\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"13\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:card\",\"content\":\"sum
