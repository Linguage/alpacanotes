赖\",\"chapter\":\"谁毁了城市？六十年后再读《美国大城市的死与生》\",\"date\":\"2024-10-23\"},{\"id\":\"32908875:mark:32908875_4_4779-4917\",\"quote\":\"如果说学习西方先进思想需要结合中国特色的话，那么，我更愿意把雅各布斯女士的那面城市生死之镜，比作《红楼梦》中贾瑞从神秘道士那里得到的、警幻仙姑所制的那面“风月宝鉴”，它正可照见风花月夜，最终却使人在短暂的欢愉之后，命归黄泉；反则可照见骷髅朽骨，却可以救人于膏肓，有起死回生之效\",\"chapter\":\"谁毁了城市？六十年后再读《美国大城市的死与生》\",\"date\":\"2024-10-23\"},{\"id\":\"32908875:mark:32908875_7_609-756\",\"quote\":\"生活本身就是目的。若问生活是否有价值，唯一答案就在于你的生活是否足够丰富。还有一点不能忘记：我们每个人都濒临绝望。托护着我们渡过绝望之海的，是希望，是深信我们自身难以解释的价值，我们确定不移的努力，以及运用我们自身力量所带来的潜在满足感。\",\"chapter\":\"卷首\",\"date\":\"2024-10-23\"},{\"id\":\"32908875:review:6166943_7V9WE4IRv\",\"quote\":\"他们费尽了心思去学习现代正统规划理论的圣人先贤们曾经说过的话，如城市理应如何运作，以及什么理应为城市里的人们和企业带来好处。他们对这些思想如此投入，以至于当现实矛盾威胁到要推翻他们千辛万苦学来的知识时，他们一定会把现实撇在一边。\",\"annotation\":\"本本主义\",\"chapter\":\"一 导言\",\"date\":\"2024-10-23\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[],\"record\":\"$f:1:props:page:book\",\"shelf\":\"recent\"}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"美国大城市的死与生（60周年致敬版） - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"[加]简·雅各布斯 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/32908875\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image\",\"content\":\"https://linguista.cn/alpacanotes/aztecaalpaca.jpg\"}],[\"$\"
