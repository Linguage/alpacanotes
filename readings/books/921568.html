date\":\"2025-02-19\"},{\"id\":\"921568:mark:921568_68_12000-12088\",\"quote\":\"习惯本质上是惯性，一种继续把你一直做的事情做下去（或者继续不做你一直不做的事情）的强烈倾向。研究显示，如果你能坚持某种行为约18个月，你就会形成一种几乎要永远做下去的强烈倾向。\",\"chapter\":\"4 理解人与人大不相同\",\"date\":\"2025-02-19\"},{\"id\":\"921568:mark:921568_68_12832-12935\",\"quote\":\"为了帮助你，我建议你写下自己最大的三个坏习惯。现在就写。然后从中选一个，下决心戒掉。你能做到吗？这将带来很大的改变。如果你能把三个坏习惯都戒掉，你的人生轨迹将大大改善。你也可以决定要养成哪些习惯，然后执行。\",\"chapter\":\"4 理解人与人大不相同\",\"date\":\"2025-02-19\"},{\"id\":\"921568:mark:921568_64_993-1075\",\"quote\":\"我逐渐明白，我的遭遇是对我的个性和创造力的考验。我逐渐领悟到，在一个如此伟大的系统里，我不过是渺小的匆匆过客，因此知道如何与这个系统良好互动，对我和系统都是有益的。\",\"chapter\":\"8 从更高的层面回顾\",\"date\":\"2025-02-15\",\"annotation\":\"接纳与珍惜发生在自己生命中的一切\"},{\"id\":\"921568:mark:921568_55_2551-2772\",\"quote\":\"只要原则是真实的（即能够反映你的真实性格和价值观），你就可以随心所欲地选定自己的原则。你在生活中将面临无数的选择，而你做出选择的方式将反映你的原则，所以用不了多久，你身边的人就将明白你依据怎样的原则为人处世。最糟糕的情况是你很虚假，因为假如你虚假的话，你将失去自尊和人们的信任。所以你必须清楚自己的原则是什么，并且“知行合一”。如果知与行之间似乎存在矛盾，你应当解释这些矛盾。最好的方法是写下来，因为这样一来，你将能够改进你写在纸面上的原则。\",\"chapter\":\"导言\",\"date\":\"2025-02-12\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[]}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"原则 - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"瑞·达利欧 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/921568\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"m
