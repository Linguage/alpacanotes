,\"date\":\"2024-10-26\"},{\"id\":\"35239336:mark:35239336_22_822-882\",\"quote\":\"人的智力不深入了解无数错综复杂的条件（其中每一个条件单独看都像是原因），只随便抓住一个首先碰到的近似条件说：这就是原因。\",\"chapter\":\"第二部\",\"date\":\"2024-10-26\"},{\"id\":\"35239336:mark:35239336_20_1905-1962\",\"quote\":\"只有承认无穷小的单位——历史的微分（就是人的个人倾向）而进行观察，并掌握求积分的方法，我们才有希望认识历史的规律。\",\"chapter\":\"第三卷\",\"date\":\"2024-10-23\",\"annotation\":\"追问一件事情背后的原因，或可以认为是对现象的曲线进行求导\"},{\"id\":\"35239336:mark:35239336_20_2480-2549\",\"quote\":\"我每次看表，时针指到“十”，我就听见附近教堂钟声当当，但我不能因此得出结论说，每当指针指到“十”，教堂响起钟声，时针的位置就是打钟的原因。\",\"chapter\":\"第三卷\",\"date\":\"2024-10-23\",\"annotation\":\"一只鸡可能以为太阳是它叫起来的\"},{\"id\":\"35239336:mark:35239336_20_2879-3020\",\"quote\":\"要研究历史规律，我们应该完全改变观察的对象，抛开帝王将相，而着眼研究支配群众的同类无穷小的因素。没有人说得出，这样研究历史规律，人们能取得多大成就；但显而易见，只有用这种方法，才有可能发现历史规律，而人的智慧在这方面所做的，还不及史学家描述帝王将相事迹和评论他们行为的百万分之一呢。\",\"chapter\":\"第三卷\",\"date\":\"2024-10-23\"},{\"id\":\"35239336:mark:35239336_20_3258-3271\",\"quote\":\"侵略就凭着一股冲力向前推进\",\"chapter\":\"第三卷\",\"date\":\"2024-10-23\"},{\"id\":\"35239336:mark:35239336_13_29297-29383\",\"quote\":\"由于他同海伦伯爵夫人的亲密关系，他在上流社会的地位很引人注目；由于他受到一位要人的信任和庇护，他在官场的地位也很优越。他打算在彼得堡娶一个最有钱的姑娘，而这是很容易办到的。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_42628-42707\",\"quote\":\"“人有时会产生多么荒唐的念头！”安德烈公爵想，“不过可以肯定，这个姑娘那么可爱，那么出色，她只要在这里跳上一个月舞，就一定会嫁人……这里难得有这样的好姑娘。”\",\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_47911-47963\",\"quote\":\"“既然生活，充满种种欢乐的生活，展现在我的面前，我为什么还要害怕，为什么还要在闭塞的小圈子里忙忙碌碌？”\",\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_48059-48205\",\"quote\":\"“皮埃尔说得对，人要幸福，必须相信能获得幸福。现在我相信他的话是对的。‘任凭死人埋葬他们的死人，’[13]我们活着一天，就要生活，而且要生活得幸福。”\",\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_51987-52046\",\"quote\":\"她提到现在这个时代，因为凡是智力不发达的人总喜欢提到时代，认为他们懂得并且重视时代的特点，而且人的本性是随时代而改变的\",\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_56606-56688\",\"quote\":\"安德烈公爵明白，老头子希望他的感情或他未婚妻的感情经受不住一年时间的考验，或者老公爵自己会在这一年里死去。于是安德烈公爵决定遵从父亲的意志：先订婚，一年后举行婚礼。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_67162-67254\",\"quote\":\"玛丽雅公爵小姐活得越久，她的生活经验越丰富，对生活观察得越深刻，她就越觉得在茫茫尘世追求享乐和幸福的人目光短浅。他们操劳，受苦，奋斗，互相伤害，想获得那种空虚、罪恶和不可能获得的幸福。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-14\"},{\"id\":\"35239336:mark:35239336_13_10002-10068\",\"quote\":\"此外，原来认识他的人一致认为，五年来他大有进步，变得更加成熟，不像原来那样做作、傲慢和喜欢嘲弄别人，而是随着年龄的增长显得稳重沉着。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_14691-14733\",\"quote\":\"总的来说，斯佩兰斯基使安德烈公爵吃惊的思想特点在于他毫不动摇地坚信理性的力量和正确。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_16675-16774\",\"quote\":\"皮埃尔对他的活动开始感到不满。共济会，至少他在这里看到的共济会，他有时觉得徒具形式。他对共济会本身并不怀疑，但疑心俄国共济会已误入歧途，背离它的宗旨。因此，皮埃尔为了研究共济会的高深教义在年底出国。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_17384-17529\",\"quote\":\"为此目的，必须使美德压倒罪恶，使正直的人今世也能因他们的德行而获得永久的奖赏。但现在的种种政治制度却妨碍我们达到目的。在这种情况下应该怎么办呢？实行革命，推翻一切，用暴力驱除暴力吗？不，我们绝不赞成这样做。任何暴力改革都必须反对，因为人们若仍像现在这样是不能驱除罪恶的，因为智慧不需要暴力。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_18004-18070\",\"quote\":\"等到我们的会友在每个国家里有一定数目，每个人再培养两个人，他们又能紧密团结起来，到那时本会就什么都能做到，就可以为人类福利做许多事。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_18292-18404\",\"quote\":\"在这次集会上，皮埃尔第一次惊讶地发现人的思想千差万别，任何真理在两个人看来都不一样。就连那些似乎支持他的人也是按照自己的理解歪曲他的意见。皮埃尔不能容忍这种歪曲，因为他坚决要求把他的思想完整地传达给别人，使别人能正确理解他。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_19907-20020\",\"quote\":\"只有在尘世的骚乱中我们才能达到以下三项宗旨：第一，自知，因为人只有通过比较才能认识自己；第二，自我完善，只有经过奋斗才能自我完善；第三，达到主要的德行——视死如归。生活的变化无常最能显示它的空虚，增强我们天生对死亡或重生的爱。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_21416-21529\",\"quote\":\"但也许因为主持这种交际活动就是需要愚蠢，也许因为受骗的人在受骗中感到快乐，骗术并没有被拆穿，而海伦作为美丽而聪明的迷娘的名声绝不动摇，她即使说出最庸俗愚蠢的话，大家也会赞美她的每一句话，并在其中寻求连她自己都没想到的深奥意义。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_21542-21626\",\"quote\":\"皮埃尔正是这个风头十足的交际花所需要的丈夫。他是个精神恍惚的怪人，具有绅士风度的老爷，他不妨碍任何人，不仅不破坏客厅的高雅格调，而且以自己的平庸笨拙反衬出妻子的文雅大方\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_5736-5843\",\"quote\":\"老栎树完全变了样，展开苍绿多汁的华盖，在夕阳下轻轻摇曳。如今生着节瘤的手指，身上的疤痕，老年的悲哀和疑虑，一切都不见了。从粗糙的百年老树皮里，没有长出枝条，却长出许多鲜嫩的新叶，使人无法相信这样的老树又会披满绿叶。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_6029-6153\",\"quote\":\"“我心里有什么感觉，只有我自己知道是不够的，应该让人人都知道：应该让皮埃尔知道，让那个想飞上天去的姑娘知道，要让人人都了解我，我活着不能只为我自己，也不能让大家都像那个姑娘似的不关心我的存在，我的生命要在大家身上反映出来，要使大家都同我一起生活！”\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_6276-6318\",\"quote\":\"他明白，要是他不把生活经验用于实际工作中，不积极参与生活，那么，他的经验就毫无用处。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"},{\"id\":\"35239336:mark:35239336_13_9777-9855\",\"quote\":\"安德烈公爵处境非常有利，他受到彼得堡上流社会各界的欢迎。改革派热烈欢迎他，拉拢他，第一，因为他以聪明和博学著称，第二，因为他解放农奴而获得自由主义者的名声。\",\"chapter\":\"第二卷\",\"date\":\"2022-04-13\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[],\"record\":\"$f:1:props:page:book\",\"shelf\":\"archive\",\"rank\":2}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"战争与和平（全集） - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"[俄]列夫·托尔斯泰 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/35239336\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"9\",{\"p
