大革命（中法双语版）\",\"author\":\"[法]托克维尔\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/52/cpplatform_uzmy4nhxfsqzz8hdrq5ere/t6_cpplatform_uzmy4nhxfsqzz8hdrq5ere1729655199.jpg\",\"url\":\"https://weread.qq.com/web/reader/2f932450813ab8eceg01272c\",\"linkLabel\":\"打开阅读\",\"progress\":null,\"finished\":true,\"readingSeconds\":27384,\"wordCount\":921194},\"notes\":[{\"id\":\"3300103182:mark:3300103182_65_4216-4257\",\"quote\":\"可悲的人们，竟然忘掉了先辈四百年前简洁有力的法语箴言：追求大自由，就会陷入大奴役！\",\"chapter\":\"第一章 文人何以在18世纪中期成为政治权威及其影响\",\"date\":\"2024-12-27\",\"annotation\":\"只知道有问题，但没有合适的解决方案，把对未来的预期寄托于一厢情愿的幻想中，只有骗子能满足他们的预期\"},{\"id\":\"3300103182:review:6166943_7WJMwdQ1v\",\"quote\":\"就像如今一样，彼时，农民极其爱恋土地，土地占有欲点燃了农民身上的全部激情。当时有位睿智之士评曰：“对成为地主，人们趋之若鹜，所以，土地总是溢价出售。在法国，下等阶层的所有积蓄，就是为了购买土地，而在其他国家，不是借给他人就是投资公债证券。”\",\"annotation\":\"What？这不是在说东大？\",\"chapter\":\"第一章 法国人民为何比其他国家人民更憎恨封建制度\",\"date\":\"2024-12-27\"},{\"id\":\"3300103182:mark:3300103182_62_4457-4800\",\"quote\":\"在草草追溯大革命的过程中，我将尽力阐明：是哪些事件、哪些错误、哪些失策，导致法国人抛弃原定目标，忘却自由，而只想成为世界霸主[插图]的平等奴仆；那比大革命所推翻的政府更强悍、更专制的政府，如何攫取并垄断所有政治权力，如何取消付出如此高昂代价换来的所有自由而代之以徒具其表的自由；如何剥夺选民的知情权、集会权和决定权而又标榜人民主权；在决定征税时，如何把议会的屈从和沉默吹嘘成议员自主投票决定；如何盗用大革命名义，取消国民自治权以及思想、言论、出版自由——此乃1789年争取的最珍贵、最伟大的成果——的主要法律保障。\",\"chapter\":\"原著前言\",\"date\":\"2024-12-21\",\"annotation\":\"以创建天堂的名义打造地狱\"},{\"id\":\"3300103182:mark:3300103182_62_6244-6454\",\"quote\":\"在专制社会，无所谓安居乐业，人人都焦虑不已，都渴望挤为人上人，都唯恐沦为人下人；金钱，成为尊卑贵贱的主要标志，具有独特的流动性，不断转手，改变个人的社会地位，提升或者降低家庭的社会地位。因此，几乎人人都想拼命积聚财富、渴望不惜代价发财致富，热衷经商、贪图钱财、追求物质享受和安逸就会成为专制社会最普遍的情绪。这种情绪，很容易弥漫于社会各阶层，甚至弥漫于素来与此无缘的阶层。倘若不遏制这种情绪，不久就会让整个民族萎靡堕落。\",\"chapter\":\"原著前言\",\"date\":\"2024-12-21\",\"annotation\":\"专制，内卷与躺平\"},{\"id\":\"3300103182:mark:3300103182_62_819-930\",\"quote\":\"从来没有哪个民族，像1789年的法国人那样，企图决绝地把自身历史一刀两断，在过去与未来之间挖一道鸿沟。为防止把任何旧东西带进新社会，他们高度警惕；为迥异于先辈，他们给自己设立了种种限制；为让自身面貌焕然一新，他们不遗余力。\",\"chapter\":\"原著前言\",\"date\":\"2024-12-21\"},{\"id\":\"3300103182:review:6166943_7WBPtK6Rv\",\"quote\":\"自由却截然不同：唯有自由，才能与社会固有的种种罪恶作斗争，才能阻止社会沉沦；唯有自由，可以促使人们摆脱因自主自立而必然导致的孤立，可以促使彼此亲近以便讨论公共事务并达成妥协而形成共识；唯有自由，才能促使人们摆脱金钱崇拜，摆脱日常琐事的烦扰，从而让人们时时刻刻都感受到，祖国就在身边，祖国高于自身；唯有自由，能够在关键时刻以更强烈、更高尚的情感取代追求安逸的念头，能够让人们具有比发家致富更伟大的雄心壮志，能够点亮明灯让人们清晰辨别善恶\",\"annotation\":\"算了，全文背诵吧\",\"chapter\":\"原著前言\",\"date\":\"2024-12-21\"}],\"reviews\":[{\"id\":\"3300103182:review:6166943_7WKJAbdqb\",\"date\":\"2024-12-27\",\"excerpt\":\"内容过于真实，读起来仿佛是“猪八戒照镜子”。\\n\\n托克维尔最好真的只是在讲法国（doge）。\"}],\"years\":[],\"references\":[],\"essays\":[],\"record\":\"$f:1:props:page:book\",\"shelf\":\"archive\"}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"旧制度与大革命（中法双语版） - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"[法]托克维尔 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/3300103182\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image\",\"content\":\"https://linguista.cn/alpacanotes/aztecaalpaca.jpg\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"12\",{\"property\":\"og:image:alt\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"13\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:site\",\"content\"
