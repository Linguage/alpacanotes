b86c4g019d98\",\"linkLabel\":\"打开阅读\",\"progress\":null,\"finished\":true,\"readingSeconds\":11951,\"wordCount\":52593},\"notes\":[{\"id\":\"3300082609:mark:3300082609_12_820-856\",\"quote\":\"我们依靠神经网络在这些样例“之间”进行“合理”的“插值”（或“泛化”）。\",\"chapter\":\"机器学习和神经网络的训练\",\"date\":\"2024-12-22\"},{\"id\":\"3300082609:mark:3300082609_28_1033-1121\",\"quote\":\"虽然“原始ChatGPT”可以在许多情况下帮助人们写作、提供建议或生成对各种文档或交流有用的文本，但是当必须把事情做到完美时，机器学习并不是解决问题的方法—就像人类也不是一样。\",\"chapter\":\"前方的路\",\"date\":\"2024-12-22\"},{\"id\":\"3300082609:mark:3300082609_28_1165-1230\",\"quote\":\"ChatGPT在“类人的部分”表现出色，因为其中没有精确的“正确答案”。但当它被“赶鸭子上架”、需要提供精确的内容时，往往会失败。\",\"chapter\":\"前方的路\",\"date\":\"2024-12-22\"},{\"id\":\"3300082609:mark:3300082609_28_1509-1642\",\"quote\":\"在许多方面，可以说ChatGPT从未“真正理解”过事物，它只“知道如何产生有用的东西”。但是Wolfram|Alpha则完全不同。因为一旦Wolfram|Alpha将某些东西转换为Wolfram语言，我们就拥有了它们完整、精确、形式化的表示，可以用来可靠地计算事物。\",\"chapter\":\"前方的路\",\"date\":\"2024-12-22\"}],\"reviews\":[{\"id\":\"3300082609:review:6166943_7WD4q8aoT\",\"date\":\"2024-12-22\",\"excerpt\":\"作为一本书还是太薄了，前面还加上了大篇幅的推荐序。\\n\\n观点有很深刻独到的见解，毕竟是大科学家。\\n\\n但对大模型来说，这本书的时间还是太早了，里面的玩法现在来看不算很新颖。\"}],\"years\":[],\"references\":[],\"essays\":[],\"record\":\"$f:1:props:page:book\",\"shelf\":\"archive\"}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"这就是ChatGPT - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"斯蒂芬·沃尔弗拉姆 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/3300082609\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes
