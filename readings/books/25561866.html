te\":\"他所追求的，只是新奇的事物和无牵无挂的境界\",\"chapter\":\"死于威尼斯\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_4_3443-3575\",\"quote\":\"迫切想去远方遨游，追求新奇事物，渴望自由、解脱一切和到达忘我境界——他承认这些无非是逃避现实的一种冲动，企图尽力摆脱本身的工作和刻板的、冷冰冰的、使人头脑发涨的日常事务。可是他还是眷恋着这样的工作，同时也几乎喜欢去作那种使人伤透脑筋的、每天都有一番新鲜内容的斗争。\",\"chapter\":\"死于威尼斯\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_4_3802-3928\",\"quote\":\"不过他精神涣散的原因，却是畏首畏尾，鼓不起劲儿，这表现在他的要求愈来愈高，永远感不到满足。当然，这种不满足从他青年时代起就被看作是他天才的禀性和特质；正因为如此，他的情感才能受到约束，并冷静下来，因为他知道，人们是容易为得过且过和半点成就而心满意足的。\",\"chapter\":\"死于威尼斯\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_4_5494-5552\",\"quote\":\"由于阿申巴赫生来体格并不结实，更显得他在道德上是一个勇者——他只是由于责任感才经常从事紧张的工作，并非生来就能如此。\",\"chapter\":\"死于威尼斯\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_4_555-907\",\"quote\":\"几个月来阴云密布。整整一个上午，作家为繁重的、绞脑汁的工作累得精疲力竭，这些工作一直需要他以缜密周到、深入细致和一丝不苟的精神从事。午饭以后，他又感到自己控制不住内心汹涌澎湃创作思潮的激荡，也就是一种“motus animi continuus”[插图]；根据西塞罗[插图]的意见，雄伟有力的篇章就是由此产生的。\",\"chapter\":\"死于威尼斯\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_4_6005-6083\",\"quote\":\"每天一早就用冷水淋洗他的胸部和背部，然后擎起一对银座的长蜡烛，将它们放在稿纸上面，把他从睡眠中积聚起来的精力热诚地、专心致志地贡献给艺术，一次就是两三小时。\",\"chapter\":\"死于威尼斯\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_4_6333-6401\",\"quote\":\"要使一部杰出的作品能立即发挥深远的影响，作者的个人命运与同时代广大群众的命运之间，必须有某种内在的休戚相关的联系，甚至彼此间能引起共鸣。\",\"chapter\":\"死于威尼斯\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_4_7416-7530\",\"quote\":\"古斯塔夫·阿申巴赫确实是所有那些辛勤工作、心力交瘁而仍能挺起腰板的人们的代言人，是现代一切有成就而道德高尚的人们的代言人，他们尽管病弱瘦削，财源匮乏，但还是凭借自己顽强的意志力和智能，设法使自己的业绩至少在一个时期内放射出异彩。\",\"chapter\":\"死于威尼斯\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_4_8053-8104\",\"quote\":\"可是一颗崇高活泼的心灵，在知识尖利而严酷的锋芒面前似乎会比在其他事物面前更加迅速、更加急剧地萎缩下去。\",\"chapter\":\"死于威尼斯\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_4_8856-8915\",\"quote\":\"听其自然吧！发展的本身就是一种命运；而博得广大公众同情和信赖的那些人，在行动方面为什么不该与那些默默无闻的人们有别呢？\",\"chapter\":\"死于威尼斯\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_4_9056-9142\",\"quote\":\"随着时间的推移，古斯塔夫·阿申巴赫的文章中有一些官腔和教训人的味儿，他后几年的笔调失去了敢想敢说的犀利风格和微妙清新的色彩，变得一本正经，精雕细琢，循规蹈矩，甚至有些公式化\",\"chapter\":\"死于威尼斯\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_5_17227-17273\",\"quote\":\"他又一次感觉到，这座城市就气候来说，对他的健康是非常不利的。这件事，现在他已终于一清二楚了。\",\"chapter\":\"2\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_5_19141-19227\",\"quote\":\"阿申巴赫出神地望着，胸口感到一阵绞痛。威尼斯的空气，以及海洋和沼泽隐隐散发出的腐臭气味，曾促使他迫不及待地离开这个城市，但现在他又感到依依不舍，深情而痛苦地吸着这里的空气。\",\"chapter\":\"2\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_13315-13332\",\"quote\":\"您先生该留在这儿吧，您是不怕瘟病的\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_14344-14433\",\"quote\":\"因为激情像罪恶一样，与既定秩序和千篇一律、平淡而舒适的生活是格格不入的；对于布尔乔亚社会结构的任何削弱以及世界上各种混乱和苦难，它必然都很欢迎，因它指望能模模糊糊地在其中捞到好处\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_16831-16943\",\"quote\":\"因为艺术是一场战斗，是一场心力交瘁的斗争；今天，人们对这场斗争往往没有多久就支持不住了。这是一种不断征服困难、不畏任何险阻的生活，是一种备尝艰辛、坚韧不拔而有节制的生活，他使这种生活成为超然的、合乎时代要求的英雄主义的象征。\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_17325-17416\",\"quote\":\"报上一会儿承认，一会儿又否认。病人和死亡者的数目，说法不一：二十个，四十个，一百个，甚至更多。但隔天报上却把疫病发生的原因说成是国外传染过来的，得病的人寥寥无几，尽管还没有干脆否认。\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_2240-2265\",\"quote\":\"他知道只是为了塔齐奥的缘故，才那么舍不得离开这儿。\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_22682-23083\",\"quote\":\"。但正当欧洲惊恐万状，深怕这个鬼怪会从那边涉足到欧洲大陆上时，它经过海面从叙利亚的商船偷偷地来了，在地中海几个港口同时出现；它在土伦[插图]和马拉加[插图]伸出头来，在巴勒莫和那不勒斯[插图]好几次公开露面，而在卡拉布里亚和阿普利亚[插图]却生根似的不肯离开。\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_23229-23437\",\"quote\":\"奥地利某省有一个人到威尼斯来玩上几天，回家后就带着这种确凿无疑的症候死去了，因此这种疾病侵袭水上城市[插图]，是德文报纸首先报道的[插图]。\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_23677-23749\",\"quote\":\"得这种病时，患者无法将他血管中大量分泌的水分排出。不上几小时，病人枯萎下去，全身抽搐，发出声嘶力竭的呻吟声，血液像黏滞滞的沥青一样，窒息着死去。\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_23869-24011\",\"quote\":\"可是威尼斯当局所着重考虑的，是害怕泄漏真情后会使各种利益受到损害，也顾虑到不久前公园里开幕的图画展览会会因此有所影响，同时，如果城市臭名四扬，人们慌作一团，旅馆、商店、各式各样为外国人服务的企业就会受到威胁，从而造成巨大损失；至于应当如何老实公开真情，遵守国际协定，那就不放在心上了。\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_24340-24400\",\"quote\":\"英国人从以上的事实得出这样的结论，他斩钉截铁地说：“您最好今天就动身，不要再挨到明天了。封锁的日子看来不会超出几天的。”\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_3134-3267\",\"quote\":\"过去，一遇到可以排愁解闷、寻欢作乐的场合——不管在哪儿，也不管在什么时候——他总满不在乎，不一会就怀着憎恶不安的心情让自己再在极度的疲劳中煎熬，投入他每天不可或缺的神圣而艰苦的工作中去，这在他青年时代尤其如此。唯有这个地方迷住了他的心，涣散了他的意志，使他感到快乐。\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_5267-5413\",\"quote\":\"艺术家怀着坚强的意志和一颗纯洁的心，在黑夜里埋头工作，终于使自己神圣的作品得以问世——对于他这个艺术家来说，难道这个还不懂得，不熟悉吗？当艺术家费尽心血用语言千锤百炼地努力把他灵魂深处见到的精微形象刻画出来，并把这种形象当作是“精神美”的化身奉献给人类时，难道不就是这样一种力量在推动着他吗？\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_5776-5906\",\"quote\":\"说真的，爱神像数学家一样，为了将纯粹形式性的概念传授给不懂事的孩子，必须用图形来帮助理解；上帝也是一样，为了向我们清晰地显示出灵性，就利用人类年轻人的形体与肤色，涂以各种美丽的色彩，使人们永不忘怀，而在看到它以后，又会不禁使人们满怀伤感之情，并燃起了希望之火。\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_7174-7259\",\"quote\":\"思想和整个情感、情感和整个思想能完全融为一体——这是作家至高无上的快乐。当时，我们这位孤寂的作家就处在这样一种精神状态中：他的思想闪烁着情感的火花，而情感却冷静而有节制。\",\"chapter\":\"3\",\"date\":\"2020-04-09\"},{\"id\":\"25561866:mark:25561866_6_7877-7956\",\"quote\":\"世人只知道他这篇文章写得漂亮，而不知它的来源及产生作品的条件，这样确实很好；因为一旦了解到艺术家灵感的源泉，他们往往会大惊小怪，从而使作品失去了诱人的感染力。\",\"chapter\":\"3\",\"date\":\"2020-04-09\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[]}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"死于威尼斯（译文经典） - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"托马斯·曼 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/25561866\"}],[\"$\",
