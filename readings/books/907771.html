7.js\",\"8224\",\"static/chunks/app/readings/books/%5BbookId%5D/page-689f051258b0623c.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"$L17\",null,{}],[\"$\",\"$L18\",null,{\"page\":{\"book\":{\"id\":\"907771\",\"title\":\"黑客与画家（10万册纪念版）\",\"author\":\"保罗·格雷厄姆\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/771/907771/t6_907771.jpg\",\"url\":\"https://weread.qq.com/web/reader/5b9328f05dd9fb5b922d1eb\",\"linkLabel\":\"打开阅读\",\"progress\":null,\"finished\":true,\"readingSeconds\":26076,\"wordCount\":187889},\"notes\":[{\"id\":\"907771:mark:907771_136_1337-1572\",\"quote\":\"为什么家长要这样伪装呢？因为他们觉得孩子不应该知道成年人语言的所有内容，只需知道一部分适合儿童的词就行了。我们喜欢孩子们看上去天真无邪。[插图]\",\"chapter\":\"道貌岸然\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_136_1680-1717\",\"quote\":\"扪心自问，我们向孩子灌输圣诞老人的神话，到底是为了孩子，还是为了我们自己？\",\"chapter\":\"道貌岸然\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_139_1918-1955\",\"quote\":\"能够一起谈论“异端邪说”并且不会因此气急败坏的人，就是你最应该认识的朋友。\",\"chapter\":\"守口如瓶\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_139_847-905\",\"quote\":\"我就鼓励自己在心里默默思考那些最无法无天的想法。你的思想是一个“地下组织”，绝不要把那里发生的事情一股脑说给外人听。\",\"chapter\":\"守口如瓶\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_165_861-885\",\"quote\":\"金钱不是财富，而只是我们用来转移财富所有权的东西\",\"chapter\":\"大饼谬论\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_168_1129-1202\",\"quote\":\"如果一家公司真正能够按照贡献付薪，它将取得巨大成功。许多雇员会更努力地工作。更重要的是，这样一家公司将吸引那些工作特别努力的人，从而超越竞争对手。\",\"chapter\":\"更努力地工作\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_168_1527-1556\",\"quote\":\"在大公司中，个人的表现无法单独测量，公司里其他人会拖累你。\",\"chapter\":\"更努力地工作\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_169_435-468\",\"quote\":\"此外，你还必须有可放大性，也就是说你做出的决定能够产生巨大的效应。\",\"chapter\":\"可测量性和可放大性\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_169_553-624\",\"quote\":\"你的表现可以被测量，并且据此得到回报，但是你没有决策的权力。你能做的唯一决策就是以多快的速度完成工作。即使你做到最快，回报可能也只增加一两倍。\",\"chapter\":\"可测量性和可放大性\",\"date\":\"2024-10-22\"},{\"id\":\"907771:mark:907771_143_4969-5017\",\"quote\":\"黑客永远是自负的。如果黑客有自己的节日，那就是4月1日愚人节，在这一天，你可以放心地作弄其他人。\",\"chapter\":\"4 良好的坏习惯\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_143_7400-7467\",\"quote\":\"如果读美国开国元勋的自述，你会发现他们听起来很像黑客。“反抗政府的精神，”杰斐逊写道，“在某些场合是如此珍贵，我希望它永远保持活跃。”\",\"chapter\":\"4 良好的坏习惯\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_143_7627-7674\",\"quote\":\"那些占据高位、本能地想要约束黑客、强迫黑客服从的人，请谨慎施为，因为你们真有可能成为千古罪人。\",\"chapter\":\"4 良好的坏习惯\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_152_1303-1428\",\"quote\":\"随着参与人数的增加，人与人之间需要的沟通成本呈现指数级增长。人数越来越多，开会讨论各个部分如何协同工作所需的时间越来越长，无法预见的互相影响越来越大，产生的bug也越来越多。幸运的是，这个过程的逆向也成立：人数越来越少，软件开发的效率将呈指数式上升。\",\"chapter\":\"逆向的《人月神话》\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_1010-1091\",\"quote\":\"如果这样的用户使用盗版，你并没有任何损失。事实上，你反而赚到了，因为你的软件现在多了一个用户，市场影响力就更大了一些，而这个用户可能毕业以后就会出钱购买你的软件。\",\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_1578-1616\",\"quote\":\"Intel服务器版本更贵的原因。如果一个公司购买Sun服务器，就表明它很有钱\",\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_1641-1933\",\"quote\":\"盗版实质上是一种价格歧视，只不过针对的是最底层的消费者。我觉得，软件公司明白这个道理，所以故意对某些盗版行为睁一只眼闭一只眼。[插图]由于互联网软件无法盗版，所以软件公司必须想出其他策略推广软件。\",\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_2068-2163\",\"quote\":\"事实上，第二步对第一步有反作用，如果某样商品购买起来很困难，人们就会改变主意，放弃购买。反过来也成立，如果某样东西易于购买，你就会多买一点。自从有了亚马逊网上书店，我买的新书比什么时候都多。\",\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_421-492\",\"quote\":\"第一眼看上去，这种说法好像很滑稽，但是后来我意识到这个观点是对的，因为它反映了软件开发的现实：软件开发不是静态的，而是一个持续不断的动态过程。\",\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_154_752-920\",\"quote\":\"对于软件公司来说，互联网软件是一个很理想的收入来源。你每个季度的销售额不是从零开始，而是拥有一个持续的现金流。因为互联网软件每时每刻都可以升级，所以你不用担心做错什么事。事实上，你不可能真的做错什么事，因为如果用户痛恨你对软件的修改，你马上就会知道。你也不会有坏账的烦恼，如果谁不付钱，你就停止对他的服务。此外，你也不可能遇到盗版问题。\",\"chapter\":\"金钱问题\",\"date\":\"2024-10-21\"},{\"id\":\"907771:mark:907771_210_465-506\",\"quote\":\"所谓“一次性程序”，就是指为了完成某些很简单的临时性任务而在很短时间内写出来的程序\",\"chapter\":\"一次性程序\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_210_568-661\",\"quote\":\"令人吃惊的是，一次性程序往往不是真的只用一次，就像第二次世界大战期间很多美国大学造的一大批临时建筑后来都成了永久建筑。许多一次性程序后来也都变成了正式的程序，具备了正式的功能和外部用户。\",\"chapter\":\"一次性程序\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_210_742-790\",\"quote\":\"一下子从无到有做出一个大项目是很恐怖的一件事。当人们接手一个巨型项目时，很容易被它搞得一蹶不振。\",\"chapter\":\"一次性程序\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_210_904-935\",\"quote\":\"开发大型程序的另一个方法就是从一次性程序开始，然后不断地改进。\",\"chapter\":\"一次性程序\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_213_1032-1074\",\"quote\":\"人们真正注意到你的时候，不是第一眼看到你站在那里，而是发现过了这么久你居然还在那里。\",\"chapter\":\"时间\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_213_717-806\",\"quote\":\"大多数人接触新事物时会使用类似的过滤机制，甚至有时要听到别人提起十遍以上他们才会留意。这样做完全是合理的，因为大多数热门新商品事后被证明是浪费时间的噱头，没多久就消失得无影无踪。\",\"chapter\":\"时间\",\"date\":\"2024-10-20\"},{\"id\":\"907771:mark:907771_213_829-875\",\"quote\":\"但是我决定等到一两年后再去学习它，结果一两年后已经没有学习的必要了，因为市场已经把它遗忘了。\",\"chapter\":\"时间\",\"date\":\"2024-10-20\"}],\"reviews\":[{\"id\":\"907771:review:6166943_7V7ZArs1x\",\"date\":\"2024-10-22\",\"excerpt\":\"作者在书中有很多具有前瞻性的看法。\\n\\n书里的第一部分关于社会，第二部分关于商业，第三部分关于技术。这三部分的观点都具有很强的预见性，非常犀利。即便是一些关于技术的观点，虽然过去二十多年迭代迅速，但放在今天也非常具有参考价值。\"}],\"years\":[\"2024\"],\"references\":[],\"essays\":[{\"url\":\"https://hanzkell.github.io/hzlzh/essays/comment-hacker-painter/\",\"title\":\"评论：《黑客与画家》\"}],\"record\":\"$f:1:props:page:book\",\"shelf\":\"archive\"}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"黑客与画家（10万册纪念版） - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"保罗·格雷厄姆 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/907771\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"conten
