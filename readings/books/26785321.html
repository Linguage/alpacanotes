d7992e045b837.js\",\"8224\",\"static/chunks/app/readings/books/%5BbookId%5D/page-689f051258b0623c.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"$L17\",null,{}],[\"$\",\"$L18\",null,{\"page\":{\"book\":{\"id\":\"26785321\",\"title\":\"打开：周濂的100堂西方哲学课\",\"author\":\"周濂\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/6/YueWen_26785321/t6_YueWen_26785321.jpg\",\"url\":\"https://weread.qq.com/web/reader/eac32a007198b629eac60e4\",\"linkLabel\":\"打开阅读\",\"progress\":null,\"finished\":true,\"readingSeconds\":60079,\"wordCount\":439343},\"notes\":[{\"id\":\"26785321:review:6166943_7Uufl2EdA\",\"quote\":\"莱布尼茨的上帝好比电脑程序员，一旦设定了初始程序，电脑就开始自动运行，然后上帝就开始无所事事地四处溜达，喝咖啡，闲聊，发呆，再也不插手剩下的事务\",\"annotation\":\"上帝的本意是好的，只是被人给执行坏了\",\"chapter\":\"057 这个世界是所有可能世界里最好的吗？——莱布尼茨哲学（下）\",\"date\":\"2024-09-26\"},{\"id\":\"26785321:mark:26785321_100_1002-1091\",\"quote\":\"喜剧调动的是人的感官，悲剧触碰的是人的思想；喜剧描绘人生的表象，悲剧揭示人生的真相；喜剧是人生的偶然，悲剧是人生的必然。\\n\",\"chapter\":\"答问10 为什么悲剧比喜剧更深刻？\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_100_1885-2104\",\"quote\":\"可是尼采不一样，他不打算接受放弃的人生。他认为真正的悲剧精神恰恰在于，在体悟到了存在的恐怖和荒诞之后，既不是像叔本华那样，选择放弃一切生命的意志，也不是像日神精神那样，借助于理性和光明，用“高贵的单纯和静穆的伟大”去战胜存在的“可怕深渊”和人性的“多愁善感”，而是要更深地投入酒神精神中，在悲剧中去体会一种“形而上的慰藉”。这种形而上的慰藉会让我们深深地体会到“一种极强烈的统一感”，人与自身的统一，人与人之间的统一，以及人与自然的统一。\",\"chapter\":\"答问10 为什么悲剧比喜剧更深刻？\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_100_2579-2637\",\"quote\":\"“总有一天我会如愿以偿。这将是很远的一天，我不能亲眼看到了，那时候人们会打开我的书，我会有读者。我应该为他们写作。”\",\"chapter\":\"答问10 为什么悲剧比喜剧更深刻？\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_1442-1530\",\"quote\":\"回到尼采的语境，他认为，酒神精神所提倡的生命力与创造力，先是遭受到了以苏格拉底为代表的理性主义的压制，而后又被基督教的道德所固化。理性和道德都在对蓬勃生长的生命力say no。\",\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_3067-3122\",\"quote\":\"他们推崇的不是道德意义上的德性（virtue），而是“生命的力量在生活赋予的广阔空间中的卓异表现”，也就是卓越\",\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_3518-3586\",\"quote\":\"生成和消逝，建设和破坏，对之不可作任何道德评定，它们永远同样无罪，在这世界上仅仅属于艺术家和孩子的游戏。……只有审美的人才能这样看世界。\",\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_3650-3730\",\"quote\":\"潜伏在河中的鳄鱼捕食涉水的角马，从角马的角度看，是毁灭，从鳄鱼的角度看，是创生，这只是生命生生不息、周而复始的一个过程，就像潮起和潮落，无法用对错好坏去评判它。\",\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_3877-3973\",\"quote\":\"也许有人会反驳说：可是鳄鱼捕杀角马的场景真的很残忍啊！对不起，尼采告诉我们，所谓的残忍与血腥，只是你把自我的情感投射其上的结果，所谓的意义和价值，也是如此。所以不要入戏太深，一切都是自然之理。\",\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_4583-4627\",\"quote\":\"这里我只想指出一点：尼采的确不接受人人平等的原则，但他并不是一个种族主义者和反犹主义者。\",\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_4627-4692\",\"quote\":\"他在区分人与人之间的高低贵贱时，更多的不是从种族的角度出发，而是从教育和文化的角度出发，在这个意义上，他更像是一个贵族激进主义者。\",\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_101_5198-5291\",\"quote\":\"按照现代世界尤其是自由主义的伦理观，同情弱者是尊重生命的体现，但是对尼采来说，同情弱者恰恰是在否定生命。同情会使人失去力量，让痛苦变得富有传染性，甚至会带来“生命和生命能量的整体损失”。\",\"chapter\":\"085 幸福就是感到权力在增长：尼采反对基督教\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_1015-1093\",\"quote\":\"强调个体，崇尚力量，权力意志，这就是主人道德的精髓。相比之下，奴隶道德则把个人隐身在群体之中，推崇爱与同情，遇到困境的时候垂头丧气，遭遇失败的时候会自我安慰\",\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_1456-1531\",\"quote\":\"当弱者面对强者的时候，因为无力抵抗就会产生一种怨恨的情绪。这种情绪的最基本特征就是，想要反抗但又深深地体会到自己的无能，于是只好将报复的情绪深埋在心底\",\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_1935-2030\",\"quote\":\"尼采指出，怨恨之人的精神“喜爱蛰藏的暗角，潜逃的暗道和后门，一切阴匿之物都让他满心感到，这是他的世界，他的安全，他的乐土所在。他擅长沉默，不忘怀，等待，暂时将自己渺小化，暂时地侮辱自己……”\",\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_2171-2271\",\"quote\":\"尼采举过一个名叫“俄罗斯式的宿命论”的例子，因为远征太艰苦，疲惫不堪的俄罗斯士兵就怀着宿命论的想法躺在雪地上，不再动弹，他们把身体的新陈代谢降到最低程度，让自己的意志开始冬眠。这是一种彻底的自我放弃。\",\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_3554-3634\",\"quote\":\"强者（高尚的人）也有怨恨，但是强者与弱者的区别在于，当感受到怨恨的时候，强者会立即表现出来，把怨恨的情绪充分地发作出来、消散开去，因此就不会对自己产生任何的毒害\",\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_4507-4591\",\"quote\":\"同情者根本不是在帮助别人，而是像歌词所说的那样，就是在帮助自己。所以同情心不仅肤浅而且自私，它给同情者本人带来巨大的心理满足感和优越感：多么好！我是一个富于同情心的人！\",\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_102_5754-5835\",\"quote\":\"读尼采，一定要把他的哲学跟他的人生结合在一起读，他的哲学就是他的人生，他的人生就是他的哲学。如果你不能体验他的体验，不能设想他的狂想，那就很难真正进入他的哲学。\\n\",\"chapter\":\"086 “自然力量，天生要强”：尼采论主人道德与奴隶道德\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_103_1218-1267\",\"quote\":\"成稿之后，尼采迫不及待地付诸印刷，但是仅仅售出四十本，另外赠送了七本，只有一个人回复说收到了赠书。\",\"chapter\":\"087 上帝死了，超人诞生：尼采的《查拉图斯特拉如是说》\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_103_2975-3025\",\"quote\":\"人类为什么无法忍受这样一个见证人？因为人类犯下太多的罪行，而罪恶是不希望有见证人的，所以必须杀死上帝\",\"chapter\":\"087 上帝死了，超人诞生：尼采的《查拉图斯特拉如是说》\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_103_3323-3491\",\"quote\":\"上帝死了，就意味着没有彼岸世界，只有此岸世界；没有物自身，只有现象界；没有超越感性、居高临下、说一不二的那个约束者，只有我们这些不知所往不知所终、朝生暮死、及时行乐的偶然存在者。这就好像是老师离开了教室，孩子们突然陷入莫名的狂欢，但是这种狂欢却蕴含着巨大的危机，因为它意味着怎么都行（anything goes），意味着彻底的失序状态。\",\"chapter\":\"087 上帝死了，超人诞生：尼采的《查拉图斯特拉如是说》\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_104_2752-2786\",\"quote\":\"只有超人才能认清自己身上最黑暗最沉重的东西，克服它，战胜它，超越它。\",\"chapter\":\"088 一个人如何成其所是？——与尼采一起生活\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_1001-1091\",\"quote\":\"在他精神失常前的一年中，尼采一口气写下了五本小册子，分别是《偶像的黄昏》、《瓦格纳事件》、《尼采反瓦格纳》、《敌基督者》和《瞧，这个人》——就好像是超新星在归入沉寂之前的最后爆发。\",\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_2901-2945\",\"quote\":\"这些对于健康的人来说，都是理所当然的事情，但是对于体弱多病的人来说，却是可望而不可即的。\",\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_3183-3240\",\"quote\":\"生活是一样贴得太近的东西，它不断地使我们的灵魂受到伤害。一旦感到它的镣铐有片刻的放松，人们便可以体验到隽永的乐趣。\",\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_3498-3649\",\"quote\":\"我们用意志力，用极大的轻蔑力去贬低生活，贬低一切来自生活幻想和幻象帷幕之下的幸福、快乐、温馨、亲近等等一切美好的词汇，在这种大轻蔑中体会另一种力量，一种源自生命底层的力量，它狂飙突进，荡涤一切。于是我们终于把握住生活的本质，我们手指前方，说道：“喏，这就是生活的本来面目，你们这些可怜的被蒙蔽的蝼蚁。”\",\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_3962-4011\",\"quote\":\"从病人的透镜出发去看比较健康的概念和价值，又反过来根据丰富生命的充盈和自信来探视颓废本能的隐秘工作\",\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_4220-4311\",\"quote\":\"尼采告诉我们，恰恰是从病人的视角出发，才能真正体会和理解什么叫作“健康的概念和价值”，恰恰是通过虚弱和颓废，才能真正地体会和理解什么叫作“生命的充盈和自信”。这是一种自我克服的过程。\",\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_98_4436-4472\",\"quote\":\"什么是颓废？就是体会到生命的无意义，人生的虚幻感，以及自我的无能为力感。\",\"chapter\":\"083 瞧，这个人！——“名叫尼采的人”和“名叫尼采的角色”\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_1406-1489\",\"quote\":\"尼采提出了两个重要的观点：第一，针对日神精神，提出了酒神精神，认为后者才是古希腊艺术的典范和基础；第二，反对苏格拉底开创的理性主义传统，认为这是现代病症的古希腊根源。\",\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_2110-2198\",\"quote\":\"人们在什么时候能够最自由地“手之舞之，足之蹈之”？当然是在酒醉之后。事实上，古希腊的戏剧就诞生于庆祝酒神狄奥尼索斯的节日狂欢之中。而酒神精神的艺术表现形式就是音乐、舞蹈和戏剧。\",\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_2805-2918\",\"quote\":\"“哲学不是一门特殊的理论学科，而是一种具体的生活方式，是对人和宇宙的总体看法，个体的人据此度过他的一生”。尼采与黑格尔的区别在于，黑格尔用理性和逻辑去追求整体性，而尼采则用情感和意志去实现整体性，这也正是叔本华带给尼采的影响。\",\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_3119-3169\",\"quote\":\"欲求和挣扎是人的全部本质……所以，人从来就是痛苦的……人生是在痛苦和无聊之间像钟摆一样地来回摆动着。\",\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_3972-4094\",\"quote\":\"尼采之所以能够看透苏格拉底，是因为他看透了自己。他与苏格拉底一样，也是一个颓废者，直面人生，强颜欢笑。深受生活磨难的人不是苏格拉底，而是尼采自己。唯一的不同在于，尼采不是悲观主义者，他借助悲剧精神克服了悲观主义，最终克服了颓废这个现代性的病症。\",\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_4171-4215\",\"quote\":\"尼采在他们身上看到了自己的投影，所以当尼采攻击他们的时候，他其实是在进行自我克服和治疗。\",\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_4519-4558\",\"quote\":\"尼采与瓦格纳联手，是为了用艺术代替宗教，在那个贫困的时代拯救岌岌可危的现代精神\",\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_4742-4797\",\"quote\":\"尼采冷眼旁观整个庆典，发现它与艺术毫无关系，不过是一场“不惜一切代价的娱乐”，一次对“生命贫乏者”的精神喂食。\",\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_99_5139-5207\",\"quote\":\"尼采与瓦格纳决裂，不仅因为瓦格纳败坏了艺术，更因为瓦格纳选择向基督教投降。《帕西法尔》是瓦格纳创作的最后一部歌剧，其中充斥着基督教的元素\",\"chapter\":\"084 在自己的身上克服他的时代：尼采反对瓦格纳\",\"date\":\"2020-06-10\"},{\"id\":\"26785321:mark:26785321_109_1823-1873\",\"quote\":\"维特根斯坦给出的建议是“不要想，而要看”，一旦我们睁开眼睛看，而不是像哲学家那样闭着眼睛去解释自然（\",\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_2028-2104\",\"quote\":\"总之，当你放弃想、专注看的时候，就会看到游戏的复杂多变性，它们之间没有“共同之处”，但有“相似之处”，这些“相似之处”就像是一张“盘根错节的复杂网络”。\",\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_2157-2237\",\"quote\":\"我想不出比‘家族相似’更好的说法来表达这些相似性的特征；因为家族成员之间的各式各样的相似性就是这样盘根错节的：身材、面相、眼睛的颜色、步态、脾性，等等，等等。”\",\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_2523-2606\",\"quote\":\"巴门尼德关心“一切是一”的那个“一”，维特根斯坦却想要教会我们差异；赫拉克利特说“隐蔽的关联比明显的关联更为牢固”，维特根斯坦则说：“我们对隐藏起来的东西不感兴趣”。\",\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_2899-3022\",\"quote\":\"第一，按照家族相似性的思路，游戏和工具就是边缘模糊的概念，这样一来，它们还是有意义的概念吗？第二，共相理论、本质主义真的彻底错了吗？难道我们不可以借助科学的方法去寻找“共相”和“本质”吗？\",\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_3694-3758\",\"quote\":\"从麦粒到麦堆，从头发稀疏到秃子，没有一个确定的标准，也找不到一个清晰的分界线，但这并不意味着麦堆和秃子这类模糊的概念就不是概念。\",\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_3801-3869\",\"quote\":\"相反，如果我们将秃子严格定义为头发只剩下一万根，或者头发覆盖面积少于原有面积的三分之一，我们反而不会使用秃子这个语词了，难道不是这样吗？\",\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_4038-4063\",\"quote\":\"并不是概念越清晰，逻辑越严格，句子的意义就越明确。\",\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_4892-4927\",\"quote\":\"我们觉得，即使一切可能的科学问题都已得到解答，人生问题也还完全未被触及\",\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_5757-5784\",\"quote\":\"。哲学是针对借助我们的语言来蛊惑我们的智性所做的斗争。\",\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_109_5994-6025\",\"quote\":\"哲学“不用任何方式干涉语言的实际用法”，“它让一切如其所是”。\",\"chapter\":\"093 睁开眼睛看家族相似性：维特根斯坦与反本质主义\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_1020-1069\",\"quote\":\"哲学家与诡辩家的最大差异在于，诡辩家通过转换要点来拒绝理解，而哲学家则试图通过统领要点来达成理解。\",\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_1589-1633\",\"quote\":\"对维特根斯坦来说，能够改变看特定事物时的面相，是拥有理解能力并且最终达成理解的关键所在。\",\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_2379-2503\",\"quote\":\"什么叫作“集合整理我们已经知道的东西”？还是以兔鸭图为例，无论你把那张图看成兔子还是看成鸭子，图本身并没有发生改变，它如其所是地放在那里，你没有在图上添加一笔一画，你只是通过面相的转换，也就是集合和整理我们已经知道的东西，然后你就看见了不同的对象。\",\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_2754-2830\",\"quote\":\"打个比方，就像你一个猛子扎进水里，不断地下潜，最终会遭遇河床，同理，在解释的过程中我们也会遭遇“思想的河床”，或者用维特根斯坦最常用的概念——生活形式。\",\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_3590-3699\",\"quote\":\"维特根斯坦说：“任何解释都像它所解释的东西一样悬在空中，不能为它提供支撑。”那么到底什么才能提供支撑呢？当然就是规则本身，就是生活形式本身。在维特根斯坦看来，“遵守规则是一种实践，以为[自己]在遵守规则并不是遵守规则”\",\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_4685-4767\",\"quote\":\"“我们对某些事情不理解的一个主要根源是我们不能综观语词用法的全貌”，为什么综观语词用法的全貌如此重要？因为综观可以“居间促成理解，而理解恰恰在于，我们‘看到联系’”\",\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_5076-5185\",\"quote\":\"我们正身处在一个前所未有的复杂和丰富的时代，面对这个时代，我们需要养成同样复杂和丰富的思考习惯，只有站在思想的高墙上，我们才可能鸟瞰全貌，看清差异和联系，实现面相的转换，明白哪里是沼泽哪里是沟壑，哪里是死路哪里是活路。\",\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_6108-6193\",\"quote\":\"对维特根斯坦来说，解决哲学问题意味着改变旧有的思想方式和生活方式。这种改变的发生，是通过把语词从形而上学的用法重新带回到日常用法。回到语词的日常用法，也就是让一切如其所是\",\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_6283-6348\",\"quote\":\"维特根斯坦的生活态度也是如此，他对生活做彻底的清算，目的不是要把自己从生活之流中连根拔起，而恰恰是要把自己重新放回特定的生活之流中\",\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_6997-7046\",\"quote\":\"1951年4月28日，维特根斯坦去世，留给这个世界的最后一句话是：“告诉他们我度过了极好的一生。”\",\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_110_839-956\",\"quote\":\"生活中我们总会遇到一些讨厌的人，你跟他讲人道的时候他跟你讲法律，你跟他讲法律的时候他跟你讲政策，你跟他讲政策的时候他跟你讲人性，你跟他讲人性的时候他跟你讲奇迹。总之每次你说什么话，他都能把要点转到另一处，这样的人我们称之为“诡辩家”。\",\"chapter\":\"094 站在思想的高墙上：维特根斯坦与面相的转换\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_1484-1515\",\"quote\":\"对绝大多数人来说，只有在极其特定的机缘下，才会意识到存在的问题\",\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_1525-1583\",\"quote\":\"存在的问题“是一种极度绝望的时刻赫然耸现的，在这个时刻，全部事物日益丧失了它们的重量，而所有的意义也变得蔽而不明了”\",\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_1893-1936\",\"quote\":\"海德格尔认为，时至今日，不仅“存在问题尚无答案，甚至连怎么提出这个问题也还茫无头绪”。\",\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_2678-2737\",\"quote\":\"我思”是哲学家在一个非常极端的思想实验中逼问得出的结果，它把自己封锁在我思的边界里，最终导致主体与客体之间的二元对立。\",\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_2876-2981\",\"quote\":\"只有在我们使用锤子的过程中出现了某些岔子，比如锤子头发生了松动，或者使得很不称手的时候，我们才会把注意力放在锤子上面，盯着锤子这个客体——用海德格尔的术语说，此时我们就从“当下上手状态”脱落成为“现成在手状态”\",\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\",\"annotation\":\"存在是一种运动中的状态\"},{\"id\":\"26785321:mark:26785321_112_3614-3624\",\"quote\":\"“外部世界是否存在”\",\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_3760-3816\",\"quote\":\"海德格尔解决了这个经典的怀疑论难题吗？我的判断是并没有，他只是转换了追问的方式和思考的路径，然后消解了这个问题。\",\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_4157-4211\",\"quote\":\"：你是什么，不是什么，是由你自己的选择和行动决定的，不要太早给自己下定义和做总结，因为可能性总是大于现实性。\",\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_4445-4490\",\"quote\":\"好在我们虽然无法决定“存在与否”，但却可以决定“怎样存在”，决定什么是适合做的或值得做的。\",\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_112_4684-4788\",\"quote\":\"此在被抛入特定的生活世界里，虽然我们可以决定怎样存在，但依然受到特定的价值传统的塑造和规定。在这个意义上，海德格尔并不像萨特那样主张人有绝对的自由，也不主张人有绝对的责任，海德格尔并不是纯粹意义的存在主义者。\",\"chapter\":\"096 人生就是一次“被抛”的过程：海德格尔的《存在与时间》（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_113_2285-2374\",\"quote\":\"常人怎样享乐，我们就怎样享乐；常人对文学艺术怎样阅读怎样判断，我们就怎样阅读怎样判断；竟至常人怎样从‘大众’中抽身，我们也就怎样抽身；常人对什么东西愤怒，我们也就对什么东西愤怒。\",\"chapter\":\"097 人生在世，无非一烦：海德格尔的《存在与时间》（中）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_113_3359-3401\",\"quote\":\"只要此在混迹于常人之中，人云亦云、亦步亦趋，此在就不是本真的自己，而是非本真的自己。\",\"chapter\":\"097 人生在世，无非一烦：海德格尔的《存在与时间》（中）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_113_3596-3644\",\"quote\":\"作为被抛的存在者，此在从一开始就与常人一起，在“非本真的漩涡”中沉浮，常人就是我们，我们就是常人\",\"chapter\":\"097 人生在世，无非一烦：海德格尔的《存在与时间》（中）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_114_2783-2899\",\"quote\":\"所谓本真的向死存在，就是“先行到死，看清楚了丧失在常人之中的日常存在，不再沉陷于操劳和操持，而是立足于自己的生存筹划种种生存的可能性，面对由畏敞开的威胁而确知它自己，因负重而激起热情，解脱了常人的幻想而更加实际，在向死存在中获得自由\",\"chapter\":\"098 向死存在：海德格尔的《存在与时间》（下）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_114_681-752\",\"quote\":\"有人说，死亡是人生在世唯一确定的事情，这话乍看起来很有道理，仔细想想却不尽然，因为我们只是听说过或看见过别人的死亡，却从未真正亲历过自己的死亡\",\"chapter\":\"098 向死存在：海德格尔的《存在与时间》（下）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_114_964-1037\",\"quote\":\"可是对于不死之人，永远等不到老之将至的那一天，可以无限地单曲循环“明日复明日”，所有的事情都在永恒的尺度面前失去了重量，岂不是一件更加恐怖的事情？\",\"chapter\":\"098 向死存在：海德格尔的《存在与时间》（下）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_4_4202-4258\",\"quote\":\"作为一种职业，哲学并不是性价比最高的职业，但是作为一种生活方式和思考方式，我相信哲学是值得我们用一辈子去实践的。\",\"chapter\":\"序言 让我们一起来一场思想的探险\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_5_1109-1175\",\"quote\":\"非常兴奋地说：“哲学，我知道，就是把白的说成黑的，把黑的说成白的。”现在，我们都知道了，这是诡辩家，不是哲学家，这是政治，不是哲学。\",\"chapter\":\"001 导论一：哲学是什么？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_5_2553-2573\",\"quote\":\"首先它们是反思性的，是对现实和经验的反思\",\"chapter\":\"001 导论一：哲学是什么？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_5_2710-2741\",\"quote\":\"其次，这类问题基本上是针对最一般性的范畴或者说超级概念提问的。\",\"chapter\":\"001 导论一：哲学是什么？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_5_3195-3219\",\"quote\":\"此类问题的第三个特征——它们都是没有标准答案的。\",\"chapter\":\"001 导论一：哲学是什么？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_5_3727-3840\",\"quote\":\"有人也许会问，既然如此，我们今天为什么还需要读柏拉图、读亚里士多德、读康德和黑格尔？我愿意用以赛亚·伯林的话来回答这个问题，他说：“哲学不是一种累积性的学科，古代那些基本的哲学思想、观点、理论和见解现在仍然是哲学的中心内容。”\",\"chapter\":\"001 导论一：哲学是什么？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_1839-1893\",\"quote\":\"罗素也说：“任何一门科学，只要关于它的知识一旦可能确定，这门科学便不再称为哲学，而变成为一门独立的科学了。”\",\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_2267-2308\",\"quote\":\"“不要轻视观念的影响力，教授在沉静的研究中所培育出来的哲学概念可能摧毁一个文明。”\",\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_2782-2863\",\"quote\":\"因为马克思本人正是通过解释世界来改变世界，如果不是因为他发明了“剥削”、“剩余价值”这些观念，全世界的无产者怎么可能会联合起来去推翻这个旧世界，去建立一个新世界？\",\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_3474-3493\",\"quote\":\"哲学使我们的心灵虽遭逆顺而安之若泰。\\n\",\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_3619-3674\",\"quote\":\"哲学的功用，就是教会我们在人生遭遇现实的铁壁的时候，以最软的方式着陆。为了说明这个问题，让我来给你造两个句子：\",\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_6_4968-4992\",\"quote\":\"离开人生，哲学是空洞的；离开哲学，人生是盲目的。\",\"chapter\":\"002 导论二：哲学有什么用？\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_7_1769-1807\",\"quote\":\"法国哲学家笛卡尔也说：“没有任何可靠的迹象，使人能够将清醒与睡梦加以区别。”\",\"chapter\":\"003 导论三：哲学的起源\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_7_1900-1927\",\"quote\":\"罗素指出，虽然“人生就是一场大梦”在逻辑上完全是可能的\",\"chapter\":\"003 导论三：哲学的起源\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_7_2526-2572\",\"quote\":\"比较“梦的假设”和“常识假设”这两种解释的优劣高下，而标准则是看谁更简单、更系统以及更和谐。\",\"chapter\":\"003 导论三：哲学的起源\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_7_2754-2803\",\"quote\":\"霍金认为，哥白尼系统的真正优势在于，假定太阳处于静止位置的时候，由此推导出来的运动方程要简单得多。\",\"chapter\":\"003 导论三：哲学的起源\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_7_5850-5884\",\"quote\":\"哲学是一个动词而不是一个名词，哲学的本质不在于掌握真理而在于寻找真理\",\"chapter\":\"003 导论三：哲学的起源\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_1500-1528\",\"quote\":\"无论在生活中还是在哲学里，康德都是一个天性热情冲动的人。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_2120-2133\",\"quote\":\"康德13岁丧母，22岁丧父\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_2588-2617\",\"quote\":\"1732年，康德入读腓特烈中学，这是一段不那么美好的回忆。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_2684-2727\",\"quote\":\"曾经有学者总结说，康德在评价他的中学教育时，最常提到的是以下三个词：虚伪、奴性和傲慢。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_3000-3079\",\"quote\":\"康德认为这种“自我审查”的做法，既是在控制人的身体，也是在控制人的心灵，它不仅无助于培养学生的“批判性和独立性思考能力”，而且会导致“狂热思想以及精神异常”。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_3244-3288\",\"quote\":\"晚年的康德在回忆自己的青春岁月时，曾经不无激愤地认为，自己在当时遭受到了奴隶一般的对待。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_3557-3617\",\"quote\":\"在另外一个意义上，康德的经历也恰恰验证了这样一个道理：启蒙的敌人是最大的启蒙者，正如自由的敌人最好地确证了自由的重要性。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_3876-3945\",\"quote\":\"赫尔德认为康德唯一关心的是真理本身，他毫不在意派系和门户之见，也不喜欢那些亦步亦趋、唯唯诺诺的门生。康德的哲学意在唤醒每一个人独立的思考。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_4160-4222\",\"quote\":\"有趣的是，康德对于打牌却有着非常正面的看法，他认为打牌“可以修身养性，让人情绪稳定，习于容忍克制，因此对道德修养有所影响”。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_4378-4429\",\"quote\":\"康德的身体一直算不上健康，他身高只有1.57米，在欧洲人里绝对称得上矮小瘦弱，可以说是先天不足后天失调\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_4449-4485\",\"quote\":\"他相信，如果想要献身于伟大的事业，就必须有规律地生活，进行严格的自我管理\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_4499-4559\",\"quote\":\"康德认为一个人的品格（character）是在40岁定型的，良好的品格不能建立在感觉之上，而必须永远以理性的准则作为基础\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_4645-4710\",\"quote\":\"从40岁开始，康德的生活准则已经从“美学”转向了“道德”，他不再过一种审美的生活、感性的生活，而开始过一种道德的生活、理性的生活。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_5035-5137\",\"quote\":\"当时有一个学生由于读不懂康德的著作而发了疯，耶拿大学有两个学生为此决斗，因为其中一个学生羞辱另一个人根本没读懂《纯粹理性批判》，认为后者必须花30年的时间才可能有所了解，然后再花30年的时间才有资格评论。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_5777-5843\",\"quote\":\"我们的责任不是创作书本，而是制作人格；我们要赢得的，不是战役和疆土，而是行为的秩序与安宁。我们伟大而荣耀的杰作是一种合宜的生活方式。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_70_949-988\",\"quote\":\"描述伊曼纽尔·康德生平的历史是一个极端困难的差事，因为他既没有生活也没有历史。\",\"chapter\":\"061 我们的责任不是创作书本，而是制作人格：康德的哲学与人生\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_2614-2724\",\"quote\":\"从时代大背景来说，当时占据主流地位的道德哲学是效益主义的伦理学，效益主义者是典型的后果论者，他们认为人的本性就是趋乐避苦、趋利避害，既然人类行为的目的就是尽可能多地增进幸福，那么幸福总量最大的行为也就是道德价值最高的行为\",\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_3005-3082\",\"quote\":\"自然法则属于理论理性的认知领域，是知性（understanding）为自然立法；而道德法则属于实践理性的实践领域，是理性（reason）为自身确立的法则。\",\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_3146-3188\",\"quote\":\"自然法则是人“不得不”服从的法则，它的具体表现形式为以“是”（is）为系词的判断句，\",\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_3216-3261\",\"quote\":\"道德法则是人“应该”服从但却不一定服从的法则，它是由“应该”（ought）联结起来的命令式\",\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_3605-3658\",\"quote\":\"我在网上看到一个健身App的广告词——“自律给我自由”，顿时眼前一亮，因为这正是康德道德哲学的核心要义所在\",\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_3659-3710\",\"quote\":\"“他律性”意味着强迫性，哪怕外在的要求最终促进了你的利益，依旧是对个人自主性的一种压制，它与自由无关。\",\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_4019-4053\",\"quote\":\"康德提出了三条高度形式化的原则，分别是普遍化原则、目的原则和自律原则\",\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_4462-4552\",\"quote\":\"康德道德哲学真正的魅力在于，他认为道德法则是纯粹实践理性选择的对象。这意味着道德法则不再是上帝赠予人类的礼物，也不再是客观的、自然的价值，道德法则不是被人们发现的，而是人们发明的。\",\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_75_4643-4775\",\"quote\":\"康德反对这个观点，认为道德法是被人类理性建构出来的，在建构的过程中，需要满足两个标准：第一，这些法则是被所有人所接受的（beacceptable to all）；第二，这些法则具有公共性和公开性（public）。罗尔斯认为这两条标准正是“社会契约论”的典型特征。\",\"chapter\":\"066 自律给我自由：康德道德哲学（上）\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_9_2120-2195\",\"quote\":\"我们享受着触觉的、口舌的、视觉的舒适，却终日在堵塞的道路上奔波，在工作职责和家庭责任的轮番轰炸下疲于奔命，即使有一点仅剩的时间也被压榨出来“投资未来”\",\"chapter\":\"004 希腊精神：雅典的自由vs.斯巴达的纪律\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_9_2575-2662\",\"quote\":\"，school本义就是“度过闲暇之地”，在这里我们充分利用闲暇的时光去追求和享受思想自由与言论自由带来的乐趣，而不是晃晃悠悠，“我喜欢”、“我爱”意义上的无所事事和放任自流。\",\"chapter\":\"004 希腊精神：雅典的自由vs.斯巴达的纪律\",\"date\":\"2020-04-18\"},{\"id\":\"26785321:mark:26785321_105_1568-1715\",\"quote\":\"有意思的是，即使对于自己的哲学天赋，维特根斯坦也始终抱有怀疑。有时候，他会显得非常傲慢，比如在1920年代写完《逻辑哲学论》之后，他认为所有的哲学问题已经解决，于是跑到奥地利的一个乡村小学去教书；但是更多的时候，他是在自我怀疑，他在剑桥授课的时候，经常沮丧地对学生哀叹道：你们的老师真是太蠢了。\",\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_2074-2153\",\"quote\":\"维特根斯坦径直找到罗素，开门见山地问：“你看我是不是一个十足的白痴？”维特根斯坦继续说：“如果我是，我就去当一个飞艇驾驶员，但如果我不是，我将成为一个哲学家。\",\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_2835-2853\",\"quote\":\"如果撒谎对自己有利，为什么要说实话？\",\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_3020-3067\",\"quote\":\"其中，最让维特根斯坦心动的莫过于这句话：“逻辑与伦理根本上是一回事，它们无非是对自己的责任。”\",\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_3087-3171\",\"quote\":\"什么叫“对自己的责任”？就是在自己的身上发掘和绽放天才的因子。什么是天才？就是“具备最强、最清澈的明确和清晰”，在物质上尽可能简朴地生活，但在精神生活中则要完全地发展。\",\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_3344-3366\",\"quote\":\"就改善你自己好了，那是你为改善世界能做的一切\",\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_3721-3803\",\"quote\":\"维特根斯坦很快发现自己极难与来自底层的士兵相处，他在日记里抱怨自己“几乎总是被恨我的人包围着”，这些人“恶毒”又“无情”，“几乎不可能在他们中找到一丝人性的痕迹”。\",\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_4079-4141\",\"quote\":\"维特根斯坦说：“我并不害怕被击中，只是害怕不能像样地完成我的责任。”什么责任？当然是在自己的身上发掘和绽放天才的因子的责任。\",\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_5935-6017\",\"quote\":\"，对他来说，人生就是一场彻底的自我清算，一场与自己的本性进行的战斗。终其一生，他一直在努力承担起成就其天赋的责任，一直在与自身的褊狭、软弱、伪善及绝望做永恒的斗争。\",\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_105_6095-6169\",\"quote\":\"在评价维特根斯坦的一生时，蒙克也用了类似的一句话，他说：维特根斯坦总体人生态度的核心，就是成为“自己之所是”，这意味着“真实于自己是不容违背的责任”\",\"chapter\":\"089 天才之为责任：维特根斯坦的生平与思想\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_106_6084-6192\",\"quote\":\"的结论是：“简单对象的存在是一种先天的逻辑的必然性。”这话实在有些让人费解，这么说吧，简单对象在维特根斯坦这里不是物理意义上的不可还原之点，也就是说，它不是分子、原子这样的物理的点，而是逻辑分析意义上的不可还原之点。\",\"chapter\":\"090 对于不可说的东西我们必须保持沉默：维特根斯坦的《逻辑哲学论》\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_106_7060-7171\",\"quote\":\"在这个意义上我们甚至可以说，《逻辑哲学论》并非一本关于逻辑的著作，而是一本关于罪及与之相关的伦理、美、生活的意义的著作。虽然维特根斯坦谈论最多的是逻辑，但逻辑只是梯子，真正重要的东西在楼上，一旦登上了楼，就可以撤掉梯子了。\",\"chapter\":\"090 对于不可说的东西我们必须保持沉默：维特根斯坦的《逻辑哲学论》\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_107_2092-2162\",\"quote\":\"哪些命题既不是分析命题也不是综合命题，既无法在实际中证实也无法在原则上证实？没错，就是传统形而上学的命题，比如上一讲中提到的黑格尔的那个句子\",\"chapter\":\"091 完美但不适合人居住的概念大厦：维特根斯坦反对维特根斯坦\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_107_2171-2222\",\"quote\":\"，逻辑实证主义者喊出了“反对形而上学”的口号，因为形而上学的命题在他们看来都是一些毫无意义的胡言乱语。\",\"chapter\":\"091 完美但不适合人居住的概念大厦：维特根斯坦反对维特根斯坦\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_108_1042-1085\",\"quote\":\"在西方哲学史上，以今日之是否定昨日之非，以今日之我反对昨日之我，维特根斯坦当属第一人。\",\"chapter\":\"092 我将教会你们差异：奥古斯丁图画到底错在哪里？\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_108_2584-2631\",\"quote\":\"命名，尤其是给孩子命名，对于很多父母来说是一件大事，我们深信名称能够预示或者影响一个人的命运。\",\"chapter\":\"092 我将教会你们差异：奥古斯丁图画到底错在哪里？\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_108_3480-3531\",\"quote\":\"：语词除了指称对象，还能做些什么呢？把奥古斯丁图画当成是人类语言本质的理解，究竟会导致什么样的问题呢？\",\"chapter\":\"092 我将教会你们差异：奥古斯丁图画到底错在哪里？\",\"date\":\"2020-04-17\"},{\"id\":\"26785321:mark:26785321_108_4027-4133\",\"quote\":\"在现实生活中我们用语言做很多的事情，它绝对不像前期维特根斯坦认为的那样，只是像镜子一样在反映（reflect）这个世界。语言和我们的生活交织在一起，我们使用语言，就像使用工具一样对这个世界做出反应（react）。\",\"chapter\":\"092 我将教会你们差异：奥古斯丁图画到底错在哪里？\",\"date\":\"2020-04-17\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[],\"record\":\"$f:1:props:page:book\",\"shelf\":\"archive\",\"rank\":10}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"打开：周濂的100堂西方哲学课 - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"周濂 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/26785321\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image\",\"content\":\"https://linguista.cn/alpacanotes/aztecaalpaca.jpg\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"12\",{\"property\":\"og:image:alt\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"13\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:site\",\"content\":\"@linguista2025\"}],[\"$\",\"meta\",\"16\",{\"name\":\"twitter:creator\",\"content\":\"@linguista2025\"}],[\"$\",\"meta\",\"17\",{\"name\":\"twitter:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"18\",{\"name\":\"twitter:description\",\"content\":\"PageStudio 卡片、阅读与专
