通婚，然后进入上层社会。\",\"chapter\":\"一 中国：一个强大的中央\",\"date\":\"2020-06-19\"},{\"id\":\"31231802:mark:31231802_8_7839-7938\",\"quote\":\"每个社会都会发生这种事，但最终会引发很多抱怨。底层的人会说：“好啊，让我们重新洗牌吧。”这就是共产党革命的缘起。国民党被推翻了。现在共产党的精英已经出现了。但是，我们尚未达到高度分化的社会那种状态。\",\"chapter\":\"一 中国：一个强大的中央\",\"date\":\"2020-06-19\"},{\"id\":\"31231802:mark:31231802_4_1053-1128\",\"quote\":\"美国和中国是在行动和决策上，最具国际影响力的两个主要国家。但新加坡还是必须尽可能与其他国家建立联系，如欧洲国家、日本、韩国、东南亚国家、印度和中东国家\",\"chapter\":\"序\",\"date\":\"2020-06-08\"},{\"id\":\"31231802:mark:31231802_4_1202-1233\",\"quote\":\"无论世界怎么样，新加坡都得去接受它，因为它实在小得无法改变世界\",\"chapter\":\"序\",\"date\":\"2020-06-08\"},{\"id\":\"31231802:mark:31231802_4_1338-1407\",\"quote\":\"就新加坡而言，我们的成功故事取决于三大特性：确保这是个让人们生活与工作的最安全国家、平等对待每一个公民，以及确保每一代新加坡人能持续成功。\",\"chapter\":\"序\",\"date\":\"2020-06-08\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[]}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"李光耀观天下（精装版） - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"李光耀 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/31231802\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image\",\"content\":\"https://linguista.cn/alpacanotes/aztecaalpaca.jpg\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"11\",{\
