17\"},{\"id\":\"914582:mark:914582_6_1683-1821\",\"quote\":\"除了为天朝扬威这一抽象成果外，郑和没有为中国攫取领土或资源，充其量不过是较早地运用中国的“软实力”[插图]，为中国的商人创造了良好条件。\",\"chapter\":\"中国的强盛时期\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_6_1913-1997\",\"quote\":\"。虽然中国的商人继续沿着郑和昔日航行过的海路往来穿梭，但中国的航海能力却日益衰微，以至于中国南部沿海地区面临海盗侵扰时，明朝的统治者竟想强迫沿海居民向内陆迁移10英里。\",\"chapter\":\"中国的强盛时期\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_6_2081-2114\",\"quote\":\"中国的光荣孤立在人类历史上独一无二，酝酿了一种独特的中国自我意识。\",\"chapter\":\"中国的强盛时期\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_6_2707-2811\",\"quote\":\"中国与周边国家的疆界与其说是政治和领土的分界线，不如说是文化差异的分水岭。中国文化的辐射圈涵盖整个东亚。美国政治学家白鲁恂（Lucian Pye）有一句名言：近代中国依然是“一个自诩为民族国家的文明社会”。[插图]\",\"chapter\":\"中国的强盛时期\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_6_4837-4889\",\"quote\":\"毋庸置疑，这是世界上已知的最美丽、人口最密集、最繁华的王国。中华帝国不亚于一个统一在同一王朝之下的欧洲。\",\"chapter\":\"中国的强盛时期\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_7_2290-2302\",\"quote\":\"皇帝位于中国等级秩序之巅\",\"chapter\":\"儒家学说\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_7_2476-2512\",\"quote\":\"皇帝扮演的第二个抽象角色是他作为“天子”的地位，调和天、地、人之间的关系\",\"chapter\":\"儒家学说\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_7_612-664\",\"quote\":\"1000年来中国得以延续至今，主要靠的是中国平民百姓和士大夫信奉的一整套价值观，而不是靠历代皇帝的镇压。\",\"chapter\":\"儒家学说\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_1023-1074\",\"quote\":\"但它从未宣扬过美国式的普世观并借此在世界各地传播自己的一套价值观，而是仅把注意力放在驾驭近邻的蛮夷上。\",\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_1362-1391\",\"quote\":\"中国的皇帝认为，试图对不幸远离中国的国家施加影响是不现实的\",\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\",\"annotation\":\"“不幸”远离中国的国家\"},{\"id\":\"914582:mark:914582_8_1663-1707\",\"quote\":\"在中国官方记载中，外国使者觐见皇帝不是为了谈判或谈国事，而是“前来领受圣上的文明教化”。\",\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_3346-3445\",\"quote\":\"在西方人的脑海里，长城是中国的主要象征，而长城也恰是中国根本弱点的体现，它在抵御外敌方面几乎没起什么作用。中国的政治家靠的是运用丰富的外交和经济手段，诱使中国潜在的外国敌手与它结成比较容易驾驭的关系\",\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_4180-4264\",\"quote\":\"治夷方针在中国官员的思维中根深蒂固，以致19世纪大批欧洲“蛮夷”抵达中国沿海地带时，中国官员讲述眼前威胁所用的语言与前朝官员如出一辙：要“以夷制夷”，直到他们受到安抚。\",\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\",\"annotation\":\"原来列强瓜分的局面是自找的？\"},{\"id\":\"914582:mark:914582_8_4859-4919\",\"quote\":\"中国强盛时，其外交体现为在意识形态上捍卫帝国权力的合理性；衰微时，外交则用来掩盖其弱点，帮助中国利用彼此争斗的各种势力。\",\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_5226-5391\",\"quote\":\"当异族君主赢得战争时，中国的官僚阶层会随之归顺，同时又游说征服者，他们刚刚征服的中国疆土幅员辽阔，文化独特，只能以中国人的方式、中国的语言和现有的中国官僚机构来统治。征服者一代代逐渐被同化到他们当初试图控制的秩序中。最终，他们的老家，即发动侵略的起始点，成了中国的一部分。征服者自己开始追求传统的中国国家利益——征服者反被征服。[插图]\",\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\",\"annotation\":\"中国与其说是一个国家，不如说是一种文明。政权都有其周期，但文明却延绵不绝。每个王朝都有衰颓的时候，但是中华文明仿佛具备极强的张力与包容性，打破武力征服者的文化外壳，并同化之。\"},{\"id\":\"914582:mark:914582_8_696-781\",\"quote\":\"近代西方的国际关系观念产生于16～17世纪。当时欧洲的中世纪制度解体，产生了一批实力不相上下的国家。罗马天主教也分裂成为形形色色的教派。均势外交不是一种选择，而是必然结果\",\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_8_886-918\",\"quote\":\"中国与西方形成鲜明对比，它从未长期地与另一国在平等的基础上交往过\",\"chapter\":\"国际关系观念：公正还是平等？\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_9_2716-2754\",\"quote\":\"即使在今天，《孙子兵法》一书读起来依然没有丝毫过时感，令人颇感孙子思想之深邃\",\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_9_2775-2812\",\"quote\":\"甚至可以说，美国在亚洲的几场战争中受挫，一个重要原因就是违背了孙子的规诫。\",\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_9_3051-3086\",\"quote\":\"西方战略家通过打胜仗检验自己的理论，孙子则通过不战而胜检验自己的理论。\",\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\",\"annotation\":\"中国的战争是为了和平，正所谓“止戈为武”\"},{\"id\":\"914582:mark:914582_9_6151-6240\",\"quote\":\"西方人认为，历史是走向近代化的过程，是战胜邪恶与落后的过程。而中国人的历史观强调的是衰落与复兴的周期，在这一过程中，人可以认识自然与世界，却不能完全主宰，最佳结果是与之融为一体。\",\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\",\"annotation\":\"只能说，西方人觉醒得太晚，太天真\"},{\"id\":\"914582:mark:914582_9_660-705\",\"quote\":\"西方传统推崇决战决胜，强调英雄壮举，而中国的理念强调巧用计谋及迂回策略，耐心累积相对优势。\",\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\",\"annotation\":\"或许“韬光养晦”不是中国的权宜之计，而是终极策略😂\"},{\"id\":\"914582:mark:914582_9_6928-7011\",\"quote\":\"亚洲国家宏大的政治结构缺乏挣脱陆地束缚、走向海洋的能力，尽管它们自己濒临大海，比如中国。在它们眼里，海洋意味着极限，意味着陆地的终结。它们从未用积极的眼光审视过海洋。\",\"chapter\":\"中国人的实力政策与《孙子兵法》\",\"date\":\"2020-04-17\"},{\"id\":\"914582:mark:914582_48_1062-1114\",\"quote\":\"这位大使不得不接受了一项痛苦的任务：向台湾方面解释，今后美国要把中国政策的重点从台北移向北京。尼克松说：\",\"chapter\":\"尼克松和周恩来的对话\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_48_1601-1635\",\"quote\":\"的意思是，要是把8亿中国人放到一个不错的制度之下，他们就能领导全世界\",\"chapter\":\"尼克松和周恩来的对话\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_48_2524-2548\",\"quote\":\"尼克松建议把外交政策建立在双方利益互惠的基础之上\",\"chapter\":\"尼克松和周恩来的对话\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_48_3268-3325\",\"quote\":\"尼克松提出即使在大部分美军撤出越南之后，也还要维持美国在亚洲的长期作用。不寻常之处在于，他声称这样做符合双方利益。\",\"chapter\":\"尼克松和周恩来的对话\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_48_3638-3678\",\"quote\":\"我们的话得这么说：“美国威胁到谁了？你倒说说看，你要谁来取代美国，起到这个作用？\",\"chapter\":\"尼克松和周恩来的对话\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_1282-1329\",\"quote\":\"我们出了机场以后，沿途处处可见“打倒美帝国主义及其走狗”的标语口号，其中有一些还是用英文写的。\",\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_1454-1482\",\"quote\":\"他特意让我注意墙上一条英文标语：“亚非乒乓球赛欢迎您。”\",\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_1528-1583\",\"quote\":\"周恩来似乎是随口说道，我们应对中国观其行，而不是只听它“放空炮”——几个月后，我们又从毛泽东口中听到了这个词。\",\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_1911-1937\",\"quote\":\"毛泽东的一生都认为和平是斗出来的，和平本身不是目的。\",\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_2172-2263\",\"quote\":\"周恩来拿出的公报草案是遵照毛泽东的指示写的，草案坚定地阐述了中国立场。其中，我们的立场是几页空白，周恩来认为我们的语气也会同样强硬，当然立场是截然相反的。公报的最后一部分是共同立场。\",\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_3724-3940\",\"quote\":\"五项原则是：重申一个中国的政策；声明美国不支持台湾岛内的独立运动；美国不鼓励日本插手台湾问题（考虑到历史原因，这是中国特别关注的问题）；支持以和平方式解决中国大陆和台湾的问题；支持继续推动正常化。\",\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_4030-4053\",\"quote\":\"周恩来回答说，双方都有“困难”，“不设时限”。\",\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"},{\"id\":\"914582:mark:914582_49_4867-4926\",\"quote\":\"整个过程中，美国阐明了和平解决的重要性，中国则坚称必须最终统一。各方都实行了克制，力争避免跟对方展开意志或力量的较量。\",\"chapter\":\"《上海公报》\",\"date\":\"2020-04-16\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[]}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"论中国 - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"亨利·基辛格 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/914582\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image\",\"content\":\"https://linguista.cn/alpacanotes/aztecaalpaca.jpg\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"12\",{\"property\":\"og:image:alt\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"13\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:site\",\"content\":\"@linguista2025\"}],[\"$\",\"meta\",\"16\",{\"name\":\"twitter:creator\",\"content\":\"@linguista2025\"}],[
