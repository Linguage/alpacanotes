ull]},null]},null]},null]},null],[\"$\",\"$7\",\"h\",{\"children\":[null,[\"$\",\"$7\",\"9acilrmNltPwm6WMNTj6V\",{\"children\":[[\"$\",\"$L12\",null,{\"children\":\"$L13\"}],[\"$\",\"$L14\",null,{\"children\":\"$L15\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\"}]]}]]}]]],\"m\":\"$undefined\",\"G\":[\"$16\",\"$undefined\"],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"17:I[7619,[\"4839\",\"static/chunks/4839-9ee37c2c1d934023.js\",\"5687\",\"static/chunks/5687-f12d7992e045b837.js\",\"8224\",\"static/chunks/app/readings/books/%5BbookId%5D/page-689f051258b0623c.js\"],\"default\"]\n18:I[928,[\"4839\",\"static/chunks/4839-9ee37c2c1d934023.js\",\"5687\",\"static/chunks/5687-f12d7992e045b837.js\",\"8224\",\"static/chunks/app/readings/books/%5BbookId%5D/page-689f051258b0623c.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"f:[[\"$\",\"$L17\",null,{}],[\"$\",\"$L18\",null,{\"page\":{\"book\":{\"id\":\"25023819\",\"title\":\"当下的启蒙\",\"author\":\"[美]史蒂芬·平克\",\"cover\":\"https://cdn.weread.qq.com/weread/cover/82/YueWen_25023819/t6_YueWen_25023819.jpg\",\"url\":\"https://weread.qq.com/web/reader/50032a40717dd54b500e00b\"},\"notes\":[{\"id\":\"25023819:mark:25023819_8_3332-3357\",\"quote\":\"所谓科学，就是对理性的加工提炼，并以此去解释世界。\",\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-12\"},{\"id\":\"25023819:mark:25023819_8_1975-2044\",\"quote\":\"通常来说，启蒙运动指的是18世纪的后60年，不过它可以上溯自17世纪的科学革命和理性时代，也可以下延至19世纪上半叶古典自由主义的鼎盛时期\",\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_8_2139-2194\",\"quote\":\"在这个时期内，各种思想纷涌迭现，有些还相互矛盾，但有四个理念将它们连在一起，也就是理性、科学、人文主义和进步。\",\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_8_2613-2650\",\"quote\":\"正是理性让大多数启蒙运动思想家都不相信世界上存在一位干预人类事物的拟人神。\",\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_8_2854-2886\",\"quote\":\"正如孟德斯鸠所言：“假如三角形也有神，那么它的神一定有三条边。”\",\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_8_2906-3032\",\"quote\":\"其中一些人是自然神论者，他们与有神论者不同，认为上帝在将世界这台机器发动起来之后就退居幕后，听凭世界按照自然法则存在和发展下去。另一些人则是泛神论者，他们将“上帝”作为自然法则的代名词。不过，他们中几乎没有人信奉《圣经》中那位制定律法、呼风唤雨的上帝。\",\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_8_639-849\",\"quote\":\"：启蒙是指“人类从自己加于自己的不成熟状态中解脱出来”，从因“懒惰和怯懦”而服从于宗教或政治权威的“条规戒律”的状态中解脱出来。[插图]他宣称，启蒙运动的口号就是：“勇于运用自己的理智！”它的基本条件是思想与言论的自由。“\",\"chapter\":\"01 勇于运用自己的理智\",\"date\":\"2020-08-01\"},{\"id\":\"25023819:mark:25023819_7_1174-1193\",\"quote\":\"这个世界只有愚蠢的回答，没有愚蠢的问题\",\"chapter\":\"PART I 启蒙运动\",\"date\":\"2020-07-31\"},{\"id\":\"25023819:mark:25023819_7_1347-1415\",\"quote\":\"当你问出这个问题时，你是在为你的信念寻找理由，也就是力图用理性的方法，来发现和证明那些对你来说重要的东西。事实上，活着的理由实在是太多了\",\"chapter\":\"PART I 启蒙运动\",\"date\":\"2020-07-31\"},{\"id\":\"25023819:mark:25023819_7_2813-2885\",\"quote\":\"启蒙运动的理念是人类理性的产物，但它们总是与人性的其他方面相互斗争：对部族的忠诚、对权威的服从、奇幻无稽的思维，以及将自身不幸归咎于他人的习惯。\",\"chapter\":\"PART I 启蒙运动\",\"date\":\"2020-07-31\"},{\"id\":\"25023819:mark:25023819_7_3227-3476\",\"quote\":\"哈耶克说：“如果要让旧的真理保留在人们的大脑中，就必须在后代人的语言和观念中不断加以重申。[插图]那些曾经明确有效的词语由于使用过多而变成陈词滥调，以至于不再具有确切的含义。虽然其内在理念可能和以往一样正确合理，但这些词语已经不再拥有令人信服的力量，即便它们关涉的问题在今天依然存在。”[插图]\",\"chapter\":\"PART I 启蒙运动\",\"date\":\"2020-07-31\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[]}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"当下的启蒙 - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"[美]史蒂芬·平克 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/25023819\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":
