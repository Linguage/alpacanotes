\"$L18\",null,{\"page\":{\"book\":{\"id\":\"934366\",\"title\":\"陀思妥耶夫斯基文集（套装共9册）\",\"author\":\"陀斯妥耶夫斯基\",\"cover\":\"https://wfqqreader-1252317822.image.myqcloud.com/cover/366/934366/t6_934366.jpg\",\"url\":\"https://weread.qq.com/web/reader/034329d05e41de0341e07e4\"},\"notes\":[{\"id\":\"934366:mark:934366_572_2630-2682\",\"quote\":\"从这时起，苦役犯们就非常尊敬若-斯基，对他总是彬彬有礼。他们特别中意的是，他在受刑时竟一声也没有叫喊。 \",\"chapter\":\"死屋手记(43)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_572_3259-3321\",\"quote\":\"我所在的第二类的苦役犯是由军事管制下的城堡中的囚犯所构成的，其生活比其他两类，即第三类（工厂类）和第一类（矿工类）要艰苦得多\",\"chapter\":\"死屋手记(43)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_572_3329-3429\",\"quote\":\"所有的囚犯都艰苦得多，恰恰是因为这一类囚犯的管理和生活制度全都是军事化的，与俄军的囚犯连很相似。军事管制更严酷，限制更多，总是戴着镣铐，总是在士兵的监视之下，牢房总是上锁，而另外两类的管理就比较宽松。\",\"chapter\":\"死屋手记(43)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_573_4179-4237\",\"quote\":\"以前他在这座城市里就是市长啊，这一切记忆犹新……这次打击是突如其来的。消息传来，监狱里一片欢腾。这是一个胜利的节日！\",\"chapter\":\"死屋手记(44)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_573_4300-4421\",\"quote\":\"我们后来遇见他穿着老百姓的破旧的常礼服，头戴有一个小帽徽的大檐帽。他凶狠地瞪着囚犯们。可是他一旦脱下身上的军服，便威风扫地了。穿上军服，他是雷霆，是上帝。身穿常礼服，他突然变得什么也不是，有些像听差了。真奇怪，对这种人来说，军服是何等重要啊。\",\"chapter\":\"死屋手记(44)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_574_14-79\",\"quote\":\"我们的少校教官被撤换不久，我们监狱就发生了根本性的变化。取消了服苦役的制度，取而代之的是建立军事管辖的囚犯连，以俄军囚犯连为基础。\",\"chapter\":\"死屋手记(45)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_574_2270-2346\",\"quote\":\"我已经说过，囚犯在监狱里蹲上两三年，就会珍惜这些岁月，不由得开始盘算，最好还是避免麻烦和危险，平安地度过剩余的时间，最后合法地获释，出狱后作为移民定居。\",\"chapter\":\"死屋手记(45)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_1128-1196\",\"quote\":\"可是很奇怪：流逝的时间越多，离刑期越近，我却越来越沉得住气了。到了最后几天，我甚至感到吃惊而责备自己：我觉得，我好像变得完全平静而冷漠了\",\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_123-245\",\"quote\":\"我在囚犯中已经有了很多朋友和知己，他们都认定我是个好人。其中有不少人都与我以诚相待，真心地爱护我。一名工程兵在送我和我的一个难友出狱时几乎要哭了，后来，我们出狱后还在这座城市的公家房子里住了整整一个月，他几乎天天都拐到我们这里来，就为了看看我们\",\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_1595-1669\",\"quote\":\"在这里我要顺便指出，由于幻想和疏阔，我们在监狱里会觉得，自由比真实的自由更自由，就是说，比实际上的、现实中的自由更自由。囚犯们夸大了真实的自由的概念\",\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_2050-2181\",\"quote\":\"在这一堵堵墙壁之内，曾有多少青春被白白葬送，多少伟大的力量在这里徒然遭到毁灭！必须把话都说出来：要知道，这些人绝非平庸之辈。要知道，这也许就是我国全体人民中最有才华、最坚强的人们。可是强大的力量白白地遭到毁灭，不正常地、非法地、无可挽回地惨遭毁灭。这是谁之罪？ \",\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_309-334\",\"quote\":\"在最后一段时间我所得到的优待，超过了以往的全部刑期\",\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_601-696\",\"quote\":\"我字斟句酌，努力在字里行间探寻隐秘的含意以及对往日生活的暗示；我在寻找在我那个时代曾激动人心的事件的痕迹，而现在我是多么悲伤而真切地意识到了，我与新的生活是那么格格不入，成了弃家出走的浪子。\",\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_576_844-883\",\"quote\":\"一旦搜出来，一定会查问：“书是哪儿来的？在哪里买的？可见，你是有联络的了……”\",\"chapter\":\"死屋手记(47)\",\"date\":\"2020-07-28\"},{\"id\":\"934366:mark:934366_565_1906-1993\",\"quote\":\"可以肯定地说，考虑到困难，考虑到问题的严重性，决心逃跑的人只有百分之一；然而其余的九十九个人至少也会幻想怎样逃跑，以及逃往哪里；哪怕仅仅在希望中，在可能性的想象中得到一点安慰\",\"chapter\":\"死屋手记(36)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_565_2044-2133\",\"quote\":\"已判处刑期的犯人只是在入狱初期也许会逃跑。服苦役两三年以后，该囚犯就珍惜这些岁月了，渐渐地暗自承认，最好还是依法服满刑期，出狱后到移民点去定居，不愿冒险逃跑并承受失败的毁灭性后果\",\"chapter\":\"死屋手记(36)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_565_205-224\",\"quote\":\"在春天我们的监狱似乎会更经常地发生纷争\",\"chapter\":\"死屋手记(36)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_565_4569-4618\",\"quote\":\"在服苦役期间，为了承受这可诅咒的生活中的一切恶劣的物质条件，对体力的需要不下于对精神力量的需要。 \",\"chapter\":\"死屋手记(36)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_566_2027-2114\",\"quote\":\"按说这有什么用呢？然而对将军以及一般高级官员的详细了解足以衡量一个人的知识水平、见识以及他入狱前在社会上的地位。总之，关于高级首长的谈论被认为是监狱里最高雅、最重要的谈论。 \",\"chapter\":\"死屋手记(37)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_566_3892-3953\",\"quote\":\"九点多钟清点人数之后，把我们赶回各自的牢房，上锁过夜。夜很短；我们在早晨四点多钟就被叫醒，而入睡的时间决不会早于十一点钟。\",\"chapter\":\"死屋手记(37)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_566_42-136\",\"quote\":\"之所以屡次谈到这条河的河岸，是因为只有在这里才能看到上帝的世界，那纯净、明朗的远方，那渺无人烟的自由的大草原，它的荒凉使我产生了一种奇特的印象。只有在这河岸上才能拿屁股对着城堡而看不到它。\",\"chapter\":\"死屋手记(37)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_568_4770-4839\",\"quote\":\"一名囚犯买下了全部羊肉，付给监狱一个半卢布。这些钱全都拿来买了面包圈，而买了瓦西卡的囚犯，再零售给难友们做烤羊肉。羊肉的味道确实非常鲜美。\",\"chapter\":\"死屋手记(39)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_569_4758-4801\",\"quote\":\"最娇生惯养、四体不勤的人，在满脸汗水地劳动一天之后，就会吃黑面包，喝着有死蟑螂的菜汤。\",\"chapter\":\"死屋手记(40)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_570_115-247\",\"quote\":\"然而高贵的人、贵族就不同了。不管他多么正直、善良、聪明，都会成年累月地受到所有的人乃至整个集体的仇视和蔑视；他得不到理解，主要的是——得不到信任。他不是朋友也不是伙伴，即使随着岁月的流逝，终于使他们不再欺辱他，然而他终究不是自己人，永远痛苦地意识到自己被疏远的孤独\",\"chapter\":\"死屋手记(41)\",\"date\":\"2020-07-27\"},{\"id\":\"934366:mark:934366_562_1269-1315\",\"quote\":\"我国普通百姓所非常喜欢和相信的拔火罐、贴水蛭、热敷和放血，我们这里的人都愿意甚至很高兴接受。\",\"chapter\":\"死屋手记(33)\",\"date\":\"2020-07-26\"},{\"id\":\"934366:mark:934366_562_1330-1407\",\"quote\":\"同样是这些人，他们能顽强地忍受木棒和树条所引起的剧痛，而拔火罐时却往往会埋怨、忸怩甚至呻吟。他们这是太娇气，或干脆就是矫情呢，——我就不知道该如何解释了。\",\"chapter\":\"死屋手记(33)\",\"date\":\"2020-07-26\"},{\"id\":\"934366:mark:934366_563_575-812\",\"quote\":\"在一片寂静中听到这病态、沙哑而酸楚的声音是很怪异的。而这时在某个角落，也有些人未曾入睡，躺在各自的床上闲谈。一个人开始讲述自己的往事，讲到遥远的过去，讲到流浪生涯，讲到妻儿和往日的风习。单凭这远处的低语声，你就会感到，他所讲到的一切，对他来说，已经一去不复返了，而他自己，这个讲故事的人，——已是孑然一身。只听到轻微而单调的低语声，仿佛远方的流水潺潺……记得，我曾在漫长的冬夜听到一个故事。我立刻觉得，这是热病中的一个梦，仿佛我患疟疾躺在床上，在发烧和谵妄中梦见了这一切……\",\"chapter\":\"死屋手记(34)\",\"date\":\"2020-07-26\"},{\"id\":\"934366:mark:934366_561_0-86\",\"quote\":\"我讲到了刑吏。刑吏的特性几乎以萌芽的形式存在于每一个现代人身上。但人的兽性的发展并不相同。如果一个人的兽性在其发展中压倒他其余的所有特性，那么这个人当然就会变得可怕而丑恶。\",\"chapter\":\"死屋手记(32)\",\"date\":\"2020-07-25\"},{\"id\":\"934366:mark:934366_561_1973-2070\",\"quote\":\"可是刑吏即使为减轻处罚而受贿，第一下打击他还是会抡起胳膊使出全力。这在他们之间甚至成了一种常规。他会减轻随后的打击力度，尤其是在他已经受贿的情况下。然而这第一下，不论受贿与否，他是要使出全力的。\",\"chapter\":\"死屋手记(32)\",\"date\":\"2020-07-25\"},{\"id\":\"934366:mark:934366_560_1167-1298\",\"quote\":\"那些在执行前一半之后医好背伤的人，便出院去承受后一半的惩罚，在出院的当天和前夜往往面色阴沉，愁眉苦脸，沉默寡言。他们会显出某种程度的迟钝、一种反常的心神不定。这样的人不愿与人交谈，多半是默然不语；最奇怪的是，囚犯们也从不主动与这样的人谈话，不想涉及他面临的遭遇。\",\"chapter\":\"死屋手记(31)\",\"date\":\"2020-07-24\"},{\"id\":\"934366:mark:934366_560_1555-1716\",\"quote\":\"早在关押受审期间，他已经听到关于长官的种种手段的传言；那时他就有了死的准备。但是在挨过前一半惩罚后，他振作起来了。他回到医院时已被打得半死；我还从未见过那样可怕的伤口；但是他心里充满了喜悦，希望能活下来，因为传言不实，他这不是活着离开了刑场吗，于是眼下，在长期关押受审之后，他已经开始梦想旅途、逃亡、自由、田野和森林了……\",\"chapter\":\"死屋手记(31)\",\"date\":\"2020-07-24\"},{\"id\":\"934366:mark:934366_560_2614-2674\",\"quote\":\"人尝试了以极具侮辱性的形式凌辱另一个同样具有上帝形象的生物的权力和无限可能性，那么他就不由自主地丧失了支配自己情感的能力\",\"chapter\":\"死屋手记(31)\",\"date\":\"2020-07-24\"},{\"id\":\"934366:mark:934366_560_2675-2701\",\"quote\":\"施暴是一种习惯；它天然地能发展，终于会发展成一种病态\",\"chapter\":\"死屋手记(31)\",\"date\":\"2020-07-24\"},{\"id\":\"934366:mark:934366_560_834-929\",\"quote\":\"我已经说过，在面临惩罚时，很少有人能保持冷静，甚至那些已经屡次挨打而且打得很重的人也不例外。这时犯人总是会感到一种强烈的，但纯粹是生理上的恐惧，一种压倒一切精神特点的不由自主和不可遏止的恐惧\",\"chapter\":\"死屋手记(31)\",\"date\":\"2020-07-24\"},{\"id\":\"934366:mark:934366_557_1519-1562\",\"quote\":\"一个已判决的苦役犯患有任何疾病，都不可以解除镣铐。甚至肺病患者也是戴着镣铐死在我的面前\",\"chapter\":\"死屋手记(28)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_557_1650-1783\",\"quote\":\"镣铐本身并不是很沉。一般也就是八磅到十二磅。健康的人带上十磅的东西是不觉得沉重的。不过我听说，戴着脚镣的腿几年后就开始萎缩。我不知道这是不是真的，但这是有可能的。即使分量不重，哪怕只有十磅，永久地套在脚上，毕竟会反常地增加肢体的重量，日子久了自然会产生有害的影响……\",\"chapter\":\"死屋手记(28)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_557_183-279\",\"quote\":\"囚犯病房不像普通病房，有病的囚犯在病中也要遭受惩罚。是谁最先规定了这个制度的呢，我不知道，只知道在这方面并没有任何明文规定的制度，形式主义的无益有害的本质从来没有像在这种事情上表现得如此严重。\",\"chapter\":\"死屋手记(28)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_557_2180-2325\",\"quote\":\"镣铐仅仅是一种示众、羞辱以及肉体上和精神上的压力。至少初衷是这样。镣铐从来就不能妨碍任何人逃跑。最迟钝、最笨拙的囚犯也不费什么事就能很快地把镣铐锯断或用石头砸开。脚镣是起不了什么预防作用的；既然是这样，既然脚镣的作用仅仅是为了对已判决的苦役犯进行惩罚，那么我又要问了：难道是要惩罚将死之人？\",\"chapter\":\"死屋手记(28)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_557_3824-3937\",\"quote\":\"但这时人们开始抬尸体了，连铺板一起抬了起来；在一片寂静中稻草发出沙沙的声音，脚镣拖在地板上铿然作响……有人把脚镣提了起来。尸体被抬走了。突然，大伙儿都大声说起话来。只听已经在走廊里的士官在打发人去找铁匠。应该替死者除掉脚镣……\",\"chapter\":\"死屋手记(28)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_558_1049-1087\",\"quote\":\"我只是想说，普通民众的不信任和敌视更多的是针对医院的行政部门，而不是针对医生\",\"chapter\":\"死屋手记(29)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_558_2871-2957\",\"quote\":\"这个可怜的人受尽了可怕的折磨，还是一连几天顽强地忍受着这种酷刑，最后才愿意出院。眼睛一天后就痊愈了。等到脖子上的伤口愈合，他立即回到军营的禁闭室，第二天还要出去挨那一千棒。\",\"chapter\":\"死屋手记(29)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_558_308-441\",\"quote\":\"普通民众即使身患重病，也宁可一连几年去找巫医或服用自家的民间草药（草药是绝不可轻视的），而不去就医或住院。这里有一个与医学无关的非常重要的情况，即：老百姓普遍地不信任一切带有官方行政印记的东西；然而除此之外，老百姓还由于各种可怕的事故和传说而对军医院产生了恐惧和偏见\",\"chapter\":\"死屋手记(29)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_558_811-930\",\"quote\":\"那些放弃自己职责的人，那些羊群中的狼，不管提出什么理由来为自己辩护，无论怎样自我辩解，比如归咎于环境，说环境也腐蚀了他们，他们都总是错的，特别是因此而泯灭了仁爱之心的话。仁爱、和蔼可亲、对病人的兄弟般的同情，有时比任何药物都更有益于病人。\",\"chapter\":\"死屋手记(29)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_559_0-64\",\"quote\":\"我再补充一点：所有这些挨过打的人在讲到他们怎样挨打、讲到那些毒打他们的人的时候，我总是惊讶于他们是那样非凡地和善、那样心平气和。\",\"chapter\":\"死屋手记(30)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_559_1185-1329\",\"quote\":\"除他之外也曾有过勤奋而热心地忠于职守的执行官，当然这是在从前，在那个并不遥远的从前，关于那个时期的“传说还很新鲜，却令人难以置信”。不过，他们的勤奋和热心多半是质朴的，并不特别着迷。而这个中尉在执行任务时却有点像高雅的美食家。他爱好、狂热地爱好执行的艺术，而且他的爱好完全是为艺术而艺术。\",\"chapter\":\"死屋手记(30)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_559_3852-4005\",\"quote\":\"他为人朴实，甚至还自以为是一个善良的人。可是也有这样的情况，长官中偶尔也会有不仅善良，而且宽宏大度的人；那又怎样呢？——大家都不喜欢他，简直还会嘲笑他。问题在于，斯梅卡洛夫善于使我们这里所有的人都觉得他是自己人，而这是一种重要的才能，或者更准确地说，是一种天赋的能力，拥有这种能力的人甚至连想也没有想到过它\",\"chapter\":\"死屋手记(30)\",\"date\":\"2020-07-23\"},{\"id\":\"934366:mark:934366_553_1414-1482\",\"quote\":\"倘若我们的学者有人对民间戏剧进行新的、比迄今更细致的研究，那将是非常有益的大好事，民间戏剧是有的，是存在的，而且它也许并不是无足轻重的。\",\"chapter\":\"死屋手记(24)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_553_1972-2020\",\"quote\":\"平日天色向晚监狱就早早地上锁了。圣诞节是例外：直至出现晚霞的时候也不上锁。其实这是对演剧的优待。\",\"chapter\":\"死屋手记(24)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_553_4134-4237\",\"quote\":\"只要剥掉非其固有的假象的外壳，更细心、更贴近而不抱成见地看一看实质本身，——任何人都能在人民身上看到他所料想不到的东西。我们的精英能教给人民的东西不多。我甚至敢于断言，——恰恰相反，他们自己还要向人民学习。\",\"chapter\":\"死屋手记(24)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_554_2004-2050\",\"quote\":\"不过我最感兴趣的是观众；这时人人都敞开了心扉。他们忘我地尽情欢乐。喝彩声越来越频繁地轰然而起\",\"chapter\":\"死屋手记(25)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_554_801-1011\",\"quote\":\"至于铃鼓，简直创造了奇迹：它时而在手指上旋转，时而只见拇指在鼓皮上蹭过，时而发出急骤、清脆而单一的击鼓声，时而这强烈、清晰的声音仿佛豌豆陡然洒落，化为无数细碎、震颤的簌簌声。最后还出现了两架手风琴。说实话，在此之前，我对简单的民间乐器的能量是没有概念的；音响的和谐、协调、主要是对乐曲的内涵本身的理解和表现的那种魄力和独特，简直令人叫绝。那时我才第一次完全理解了，豪放、剽悍的俄罗斯民间舞曲的无比豪放而剽悍的特点究竟何在\",\"chapter\":\"死屋手记(25)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_555_2581-2705\",\"quote\":\"我渐渐地回忆起了一切：最后一天、节日、这整整的一个月……我惊恐地抬起头来，在监狱六支蜡烛的抖动、微弱的烛光下扫视着我的睡梦中的难友们。我看着他们苍白的脸、他们破旧的被子、这十足的潦倒和赤贫，——我凝目注视——仿佛我想认定这不是噩梦的延续，而是实情。\",\"chapter\":\"死屋手记(26)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_555_2827-2865\",\"quote\":\"“我毕竟不是一辈子在这里，不过就是那么几年！……”我想，又把头垂落在枕头上。\",\"chapter\":\"死屋手记(26)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_555_4433-4520\",\"quote\":\"病人中爱喝茶的人为数不多。至于小烟斗和烟丝袋，几乎人人都有，甚至连肺痨病人也不例外，都藏在病床底下。医师和其他管理人员几乎从来不检查床铺，即使碰到有人拿着小烟斗，也装作没看见\",\"chapter\":\"死屋手记(26)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_556_138-229\",\"quote\":\"他因假币案被起诉，躺在这里已近一年，看来什么病也没有，但硬是对医师说，他患有动脉瘤。他的目的达到了：他躲过了苦役和体罚，再过一年将被流放到T城去，在一所医院附近的什么地方靠公家养着。\",\"chapter\":\"死屋手记(27)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_556_3263-3350\",\"quote\":\"我特别讨厌在这些罩衫里有时会发现的那些肥得出奇的大虱子。囚犯们都满怀喜悦地消灭它们，每当囚犯在厚实而笨拙的指甲下啪的一声磕死一个虱子时，甚至从他的脸色就能看出，他是多么高兴。\",\"chapter\":\"死屋手记(27)\",\"date\":\"2020-07-18\"},{\"id\":\"934366:mark:934366_552_3346-3396\",\"quote\":\"仅仅按法律条文执法而不领会其意义、不理解法律的精神实质，只会直接导致混乱，而且不可能有任何别的结果。\",\"chapter\":\"死屋手记(23)\",\"date\":\"2020-07-15\"},{\"id\":\"934366:mark:934366_552_3523-3725\",\"quote\":\"我敢肯定地说，戏剧演出以及演出获得准许所激起的感激心情，才使监狱在节日期间没有发生任何严重的事态：一次恶性的争吵、一起盗窃案也不曾有过。我亲眼看到，有些过于放纵和吵闹的囚犯被自己人所制止，而其唯一的理由就是，否则演出会遭到禁止。士官要求囚犯们保证，一定要保持肃静，举止得体。他们高兴地表示同意，严格地遵守诺言；他们的保证得到信任，也使他们颇为得意。不过，应当说，长官并没有因为允许演出而有任何破费和损失。\",\"chapter\":\"死屋手记(23)\",\"date\":\"2020-07-15\"},{\"id\":\"934366:mark:934366_551_252-300\",\"quote\":\"我想，整个城市没有哪一位商人和市民的家庭主妇没有送来自己的面包，向“不幸的”囚犯们祝贺伟大的节日\",\"chapter\":\"死屋手记(22)\",\"date\":\"2020-07-07\"},{\"id\":\"934366:mark:934366_551_3224-3289\",\"quote\":\"已到暮色苍茫的时候。在饮酒狂欢之中沉重地透露出忧伤、郁闷和昏昏沉沉的醉意。一个在一小时前欢笑的人，已经由于饮酒过量而在那里放声大哭\",\"chapter\":\"死屋手记(22)\",\"date\":\"2020-07-07\"},{\"id\":\"934366:mark:934366_546_1797-1834\",\"quote\":\"可是这一次他不愿忍受，公然在光天化日之下，在展开的队列前面捅死了自己的团长\",\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_2769-2821\",\"quote\":\"像彼得罗夫这样的人，理智起作用只有在他们还没有什么强烈愿望的时候。世上没有什么能阻碍他们实现自己的愿望。\",\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_2915-2977\",\"quote\":\"这些人有一种与生俱来的观念，毕生都在无意识地驱使他们来去奔波；他们就这样一辈子跑来跑去，直至找到完全合乎自己愿望的事业为止。\",\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_3301-3355\",\"quote\":\"晚上他亲自向我承认了偷书的事，不过没有一点窘态，也毫无悔意，完全是无所谓的样子，好像在讲一桩极其普通的事情。\",\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_3737-3834\",\"quote\":\"他能明确地提出问题，但对我所提供的知识并不感到惊奇，甚至只是三心二意地听听而已……我还觉得，他不假思索地认定，不能像跟别人谈话那样跟我谈话，除了谈书本以外，我什么也不懂，也不会懂，所以多谈无益。\",\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_4125-4191\",\"quote\":\"这些人的生活中有时会发生这样的情况，他们在某种普遍性的激烈行动或变革的时刻，突然鲜明而洒脱地尽显其本色，从而立即投入自己的豪迈的活动\",\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_546_4231-4317\",\"quote\":\"他们质朴地开始而不大肆张扬，然而首先驰马踏破主要障碍，不假思索、无所畏惧地直奔一切艰难险阻，——于是群起追随，不顾一切地前进，活动于决定性的战线，往往就在那里抛下自己的头颅\",\"chapter\":\"死屋手记(17)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_145-175\",\"quote\":\"有的人并没有杀过人，却比一个身负六条命案而入狱的人更加可怕。\",\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_3281-3441\",\"quote\":\"军官的军衔似乎搅乱了他们的内脏，同时也搅乱了他们的头脑。长期在重负下呻吟并走过一切服从的阶段之后，他们突然看到自己成了军官、指挥官、贵族，由于不习惯和最初的陶醉而夸大自己的权威和重要性；不言而喻，这只是对服从于他们的下级而言。在上级面前，他们仍然竭力奉承，虽然这已经是完全不必要的了，对不少长官来说，这甚至是令人厌恶的。\",\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_3736-3883\",\"quote\":\"有些人认为，比如说，只要囚犯们伙食好、待遇好，一切都依法办理就行了。这也是一种误解。任何一个人，不管他是谁，也不管他的地位多么卑微，哪怕是本能地、下意识地，但毕竟需要对自己人格的尊重。囚犯自己知道他是囚犯，为人所不齿，也知道自己在长官面前的地位；然而任何烙印、任何镣铐都不能使他忘记他是一个人。\",\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_376-489\",\"quote\":\"他杀死的第一个人是压迫者、仇敌；虽然这也是犯罪，然而是可以理解的；这是事出有因；可是后来他连并非仇敌的人也杀，遇到随便什么人都杀，为取乐、为一句粗话、为一个眼神、为凑成双数而杀人，或者干脆：“从路上滚开，别让我碰到，我来了！”\",\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_4190-4236\",\"quote\":\"囚犯们更喜欢这样的长官，就是说，既保持了自己的尊严，也不让他们受委屈，因而一切都高尚而又得体\",\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_4939-4989\",\"quote\":\"卢奇卡虽然杀了六个人，可是在监狱里从来没有人怕过他，尽管他在心里也许很希望享有“可怕的人”的名声……\",\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_503-609\",\"quote\":\"仿佛一旦越过他认为不可逾越的界限，他就开始自我欣赏，在他的心目中已无神圣可言了；仿佛在撺掇他一下子越过一切法度和权威，享受放荡不羁的无限的自由，享受那种由于恐惧而心跳停止的感觉，他是不可能不对自己怀有这样的恐惧的\",\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_779-850\",\"quote\":\"他装出一副无所畏惧的样子，而这个“无所畏惧”的人有时自己在盼着惩罚快些到来，盼着被人干掉，因为他自己终于觉得，这假装的无所畏惧是不可承受之重。\",\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_547_850-910\",\"quote\":\"奇怪的是，这种情绪，这种装模作样会一直持续到走上断头台，然后突然中断：仿佛这确实就是正式的期限，是由一定规则预先确定的。\",\"chapter\":\"死屋手记(18)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_548_1798-1854\",\"quote\":\"生平认识很多犹太人的卢奇卡时常逗弄他，完全不是出于恶意，就是为了逗乐，好像在逗弄小狗、鹦鹉、训练过的小动物一样。\",\"chapter\":\"死屋手记(19)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_548_2210-2231\",\"quote\":\"“那就好，有了上帝和钱，到哪里都不错。” \",\"chapter\":\"死屋手记(19)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_548_4440-4496\",\"quote\":\"铁环不是紧箍在腿上，在铁环和腿之间能塞进一根手指；这样铁环就在腿上碰击和摩擦，一天下来，没有衬垫的囚犯会把腿擦伤\",\"chapter\":\"死屋手记(19)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_548_582-641\",\"quote\":\"每逢周末他在押送下到自己在城里的祈祷室（这是法律所允许的），生活得十分惬意，不过他焦急地盼着，在服完十二年刑期后结婚。\",\"chapter\":\"死屋手记(19)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_549_0-22\",\"quote\":\"当我们打开澡堂的门的时候，我以为我们进了地狱\",\"chapter\":\"死屋手记(20)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_549_533-590\",\"quote\":\"浴床上约有五十把浴帚同时举起又落下；人人都在如醉如痴地抽打着自己。蒸汽时时刻刻都在加热。这已不是热气；这是地狱之火\",\"chapter\":\"死屋手记(20)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_550_1406-1434\",\"quote\":\"圣诞节终于到了。囚犯们几乎在圣诞节的前一天就不出去干活了\",\"chapter\":\"死屋手记(21)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_550_2225-2308\",\"quote\":\"除了对伟大节日与生俱来的崇敬之外，囚犯还下意识地感悟到，他通过对节日的这种维护而与整个世界相关联，因而他并不是无家可归的弃儿、不可救药的浪子，在监狱里也和在社会上一样\",\"chapter\":\"死屋手记(21)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_550_2706-2740\",\"quote\":\"有一次，生平仅有的一次，他试图用自己的头脑生活——却遭到了牢狱之灾。\",\"chapter\":\"死屋手记(21)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_550_4078-4150\",\"quote\":\"总的说来，大家都举止得体，态度温和，竟异乎寻常地彬彬有礼。既听不到平时的叫骂，也听不到平时的争吵。大伙儿都明白，这是一个重大的日子、伟大的节日。\",\"chapter\":\"死屋手记(21)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_550_4180-4290\",\"quote\":\"我要顺便指出，在囚犯之间几乎完全看不到友情，我不是说广泛的友情，这更是无从谈起，我说的是私人之间的友情，某一个囚犯和另一个囚犯成为朋友。这在我们之间几乎是完全没有的，而这是一个值得注意的特点：在监狱外面是没有这种情况的。\",\"chapter\":\"死屋手记(21)\",\"date\":\"2020-07-06\"},{\"id\":\"934366:mark:934366_544_23-65\",\"quote\":\"一般地说，为什么所有快乐的人，在这最初的几天里我已经注意到了，都在某种程度上受到蔑视\",\"chapter\":\"死屋手记(15)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_544_3111-3160\",\"quote\":\"不管我在哪里凑上去帮他们干活，到处都不是我待的地方，我在哪里都碍事，几乎到处都有人骂骂咧咧地赶我走\",\"chapter\":\"死屋手记(15)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_544_3688-3818\",\"quote\":\"决心要尽可能保持朴实和独立的作风，丝毫不露出特别想要接近他们的态度；但也不排斥他们，如果他们自己想接近我的话。决不惧怕他们的威胁和敌视，而且要尽可能地行若无事。决不在某些重要问题上与他们同流合污，也决不迁就他们的某些习惯和习气，总之，决不无原则地强求他们的友谊\",\"chapter\":\"死屋手记(15)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_544_4691-4742\",\"quote\":\"简直不知道我是怎么了，可我竟然扑上去亲吻它，搂着它的头；它跳起来，把两条前腿搭在我的肩上，舔着我的脸。\",\"chapter\":\"死屋手记(15)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_544_4876-4928\",\"quote\":\"在人世间我现在只剩下这仅有的爱我、依恋我的生物了，只剩下我的朋友、我唯一的朋友——我的忠诚的狗沙里克了。\",\"chapter\":\"死屋手记(15)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_1204-1286\",\"quote\":\"姑且假定，这也是一种生活——服苦役的囚徒生活；但一个被流放一定期限的苦役犯，不论他是谁，本能地就绝不会把自己的遭遇看成现实生活的一部分，看成某种实际的、稳定的东西。\",\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_1482-1554\",\"quote\":\"到涅尔琴斯克去差不多要走半年，与大伙儿结伴同行比蹲监狱可就好多啦！以后在涅尔琴斯克服完刑期，到那时……要知道，有的白发苍苍的老者也在这样期盼着呢\",\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_1763-1921\",\"quote\":\"其实每个人都渴望坐满自己的刑期。不禁要问，这是为什么呢？这是因为：那时他们就能走出低矮的石拱下的闷人潮湿的牢房，能在监狱的院子里走一走……仅此而已。他们是永远不会被放出监狱了。他们自己知道，解除铁链以后，将永远被关押在监狱里，直至老死，而且还要戴着镣铐。他们是知道这些的，然而还是强烈地渴望尽快熬过这戴着铁链的刑期。\",\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_1975-2026\",\"quote\":\"我感到劳动能拯救我，能增强我的健康和体质。经常的焦虑不安、精神上的刺激、牢房里污浊的空气会彻底毁了我。\",\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_3431-3506\",\"quote\":\"Б是一位非常有教养而高尚的人，生性豁达，但疾病毁了他的健康，使他饱受折磨。我们在一起操作砂轮，这使我们甚至乐此不疲。这个活儿对我的健康是极为有益的。 \",\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_4320-4387\",\"quote\":\"如果他发觉，比方说我想独自待着，那么他和我谈上两分钟，便立刻离开我，而且每一次都感谢我对他的关怀，其实我从来没有关怀过监狱里的任何人。\",\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_545_670-780\",\"quote\":\"他的剃刀锃亮、有人来剃头的时候，他就满意极了：他的肥皂沫是热乎乎的，他的手柔和而灵巧，剃头的动作像丝绒一般地轻柔。看来他是在享受这门艺术，并引以为自豪，他漫不经心地接过赚来的一个戈比，仿佛问题真的在于艺术，而不在于戈比。\",\"chapter\":\"死屋手记(16)\",\"date\":\"2020-07-05\"},{\"id\":\"934366:mark:934366_543_160-227\",\"quote\":\"在西伯利亚有一些人几乎要老死此乡，看来一生的宗旨就是要兄弟般地照顾“不幸的人们”，像对自己的亲生孩子一样给予完全无私的崇高的同情和关怀\",\"chapter\":\"死屋手记(14)\",\"date\":\"2020-07-03\"},{\"id\":\"934366:mark:934366_543_2232-2283\",\"quote\":\"士兵有权朝囚犯开枪，要是他试图逃跑的话；但同时也要对开枪负责，如果他不是在最迫不得已的情况下开枪的话；\",\"chapter\":\"死屋手记(14)\",\"date\":\"2020-07-03\"},{\"id\":\"934366:mark:934366_543_962-1002\",\"quote\":\"…有些人说（我听到也读到过这种说法），对别人的最崇高的爱同时也是最大的利己主义。\",\"chapter\":\"死屋手记(14)\",\"date\":\"2020-07-03\"},{\"id\":\"934366:mark:934366_541_2512-2591\",\"quote\":\"可别人在嘲笑他呀，一有机会就使他难堪，有时骂他骂得很凶，而他与他们却能和谐友好地相处，从来不会生他们的气。是呀，要真正认识一个人是很难的，即使在相识多年之后！\",\"chapter\":\"死屋手记(12)\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_542_1415-1508\",\"quote\":\"肖像画无限期地拖了下去，几乎拖了一年之久，少校终于看出来了，此人在哄骗他，于是认定画像是画不成了，相反，一天天过去，画得越来越不像他了，他勃然大怒，把画家痛打了一顿，罚他到监狱里去干粗活\",\"chapter\":\"死屋手记(13)\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_542_3013-3073\",\"quote\":\"钱嘛，我已经说过了，在监狱里是有惊人的意义和能量的。可以肯定地说，在监狱里一个一文不名的囚犯，比多少有点钱的要痛苦十倍，\",\"chapter\":\"死屋手记(13)\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_542_383-495\",\"quote\":\"但是他恬不知耻地接受了自己的新的遭遇，甚至毫无悔改之意，面对这种遭遇没有道德上的愤慨，除了被强制劳动、不得不告别那些糖果糕点店和三条市民街，竟无所畏惧。他甚至觉得，苦役犯的身份只是使他更能放开手脚，去干一些更加卑鄙龌龊的勾当\",\"chapter\":\"死屋手记(13)\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_542_4165-4266\",\"quote\":\"但这个似乎最不可能出事的犯人的这种突然爆发，——其全部原因也许就是个人的一种苦闷的、狂躁的发泄，一种想表现自己以及自己的被凌辱的个性的欲望，这欲望是蓦然出现的，达到了愤怒、癫狂、茫然、爆发和痉挛的程度。\",\"chapter\":\"死屋手记(13)\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_542_4275-4364\",\"quote\":\"就像一个人被活活埋在棺材里，醒来后便拼命撞击自己的棺材盖，使尽力气要推开它，当然，理智会让他明白，他的一切努力都将归于徒劳。但问题恰恰在于，这时已谈不上理智了：这时只有痛苦的痉挛\",\"chapter\":\"死屋手记(13)\",\"date\":\"2020-07-01\"},{\"id\":\"934366:mark:934366_540_922-1118\",\"quote\":\"在我开始新生活的这第一个凄凉的晚上，这一切只是在我眼前闪过，——闪过于腾腾烟雾和黑色烟子之间，闪过于亵渎神圣的辱骂声中，闪过于空气污浊、镣铐叮当、诅咒和无耻哄笑的氛围里。我在光光的木板通铺上躺下，把衣服枕在头下（我还没有枕头），盖一件光板皮袄，但久久不能入睡，尽管这第一天的荒诞而意外的印象已使我受尽折磨、精疲力竭。但我的新生活才刚刚开始。还有很多我从未想到也无从预料的事情在前面等待着我……\",\"chapter\":\"死屋手记(11)\",\"date\":\"2020-06-20\"},{\"id\":\"934366:mark:934366_539_4486-4619\",\"quote\":\"一个有教养的人依法受到与平民百姓同样的惩处，他所失去的却往往比后者多得不可比拟。他不得不抑制自己所有的内心需求、所有的习惯；陷入他所不能满意的环境，要学会呼吸一种不同的空气……这是从水中捞出来丢弃在沙地上的一条鱼……对所有人都相同的依法惩处，对他来说却往往痛苦十倍。\",\"chapter\":\"死屋手记(10)\",\"date\":\"2020-06-19\"},{\"id\":\"934366:mark:934366_532_1840-1902\",\"quote\":\"不少囚犯初来监狱时什么都不会，便向别人请教，等到出狱后，竟成了出色的工匠。这里有靴匠、鞋匠、裁缝、木匠、钳工、切削工、镀金工\",\"chapter\":\"死屋手记(3)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_532_3561-3598\",\"quote\":\"还有一项收入，虽然不能让囚犯发财，却是持久而有良好影响的收入。这就是施舍。\",\"chapter\":\"死屋手记(3)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_1012-1127\",\"quote\":\"这样的惩罚变成了一种酷刑，一种复仇，而且是没有意义的，因为它不能达到任何合理的目的。而由于任何强制性劳动都必然会具有这种酷刑、徒劳无益、屈辱和羞惭的成分，因而苦役犯的劳动比任何自由的劳动都痛苦得无可比拟，其原因恰恰在于它的强制性。\",\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_1417-1477\",\"quote\":\"后来我才懂得，除了自由被剥夺，除了强制劳动，在苦役生活中还有一种痛苦，比其余的一切都更为强烈的痛苦。这就是：强制的群居。\",\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_1575-1606\",\"quote\":\"囚犯们硬说，在俄罗斯欧洲部分的军人囚犯连里也没有这样好的伙食。\",\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_17-109\",\"quote\":\"入狱后的第一个月，总之是入狱初期，至今还会生动地出现在我的想象之中。此后的狱中岁月在我的回忆中便只是隐约地闪现。有些往事仿佛模糊了，混淆在一起，只留下了一个总的印象：沉重、单调、窒息。\",\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_4891-4977\",\"quote\":\"我起初无法想象，怎么能为了逗乐而吵架，而且在吵架中寻找乐趣、从事心爱的练习并得到快乐呢？不过，虚荣心也不能忽略。雄辩的谩骂者是受人尊敬的。只不过对他不像对演员那样鼓掌而已。\",\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_560-613\",\"quote\":\"说这种劳动是繁重的苦役，其主要原因不在于它艰苦而持续不断，而是因为它是强制性的，是在棍棒的驱使之下非干不可\",\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_533_896-1006\",\"quote\":\"可要是强迫他，举例来说，把一只桶里的水倒进另一只桶，再倒回原来的桶里，或捣沙土，或把一个地方的土堆拉到另一个地方，再拉回来，那么我想，犯人过不了几天就会上吊自杀，或者犯下千百种罪行，但求一死，以便摆脱这种屈辱、羞惭和痛苦\",\"chapter\":\"死屋手记(4)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_534_4443-4535\",\"quote\":\"使囚犯热心劳动的唯一办法就是给他规定工作量。有时规定的工作量很大，但是完成定量的速度仍然比被迫工作到敲午饭鼓时要快一倍。完成工作量之后，囚犯就可以毫无阻碍地回去，谁也不会来阻拦他了。 \",\"chapter\":\"死屋手记(5)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_535_1321-1410\",\"quote\":\"在如此严格的管理制度之下，一名醉酒的囚犯的出现，把我心里初步形成的关于囚犯生活的所有见解都彻底打乱了。我在狱中度过相当漫长的岁月之后，才弄清了我在入狱初期感到困惑莫解的种种现象。\",\"chapter\":\"死屋手记(6)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_535_2360-2470\",\"quote\":\"老人却是个完全不同的人。在熟读经卷方面也许比他们还更胜一筹，但总是回避争论。他性喜交际。愉快开朗，笑口常开——不是囚犯的那种粗鄙、猥亵的笑，而是开朗、安详的笑，其中含有很多孩子般的稚气，这笑容不知怎么与他的白发特别相称。\",\"chapter\":\"死屋手记(6)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_535_2860-2939\",\"quote\":\"监狱里几乎人人都是贼，可是不知为什么，大家突然都深信不疑，这位老者是决不会偷盗的。不知道他把交到他手里的钱藏到了哪里，但一定是谁也无法找到的一个十分隐秘的地方\",\"chapter\":\"死屋手记(6)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_536_1805-1857\",\"quote\":\"最后的破烂都喝光以后，醉汉躺下睡觉了，第二天醒来，脑袋里嗡嗡作响，他徒劳地请求酒贩子让他再喝一口解解酒。\",\"chapter\":\"死屋手记(7)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_538_328-418\",\"quote\":\"而一个候审犯大致计算一下那个痛苦的日子到来的期限，往往会逃进医院，希望把痛苦的时刻多少推迟一些。等到出院回监狱，几乎能准确地知道，第二天就是注定不祥的日子，这时他几乎总是焦躁不安。\",\"chapter\":\"死屋手记(9)\",\"date\":\"2020-06-18\"},{\"id\":\"934366:mark:934366_530_1295-1336\",\"quote\":\"但此人十分孤僻，避不见人，他学识渊博，博览群书，不过寡言少语，总之，很难和他深谈。\",\"chapter\":\"死屋手记(1)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_530_2331-2394\",\"quote\":\"我刚从邮局收到的书刊就拿在手上，我把这些尚未拆开的书刊推荐给他看。他投以贪婪的一瞥，却又立刻改变主意，谢绝了，借口是没有时间看\",\"chapter\":\"死屋手记(1)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_530_2485-2584\",\"quote\":\"记得，我在他的房间里几乎没有看到书，可见，说他博览群书是与事实不符的。不过，有两次我深夜从他的窗前路过，发现他屋子里有灯光。他独坐通宵，在干什么呢？不是在写作吧？倘若是在写作，那么究竟在写些什么呢？\",\"chapter\":\"死屋手记(1)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_530_2711-2741\",\"quote\":\"。我给她一枚二十戈比的硬币，她给我捧来了死者遗留的一大筐手稿\",\"chapter\":\"死屋手记(1)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_530_4796-4845\",\"quote\":\"我现在无法理解，我怎么竟能在这样的房间里生活了十年。在木板通铺上有我的三块木板：这是我的全部地盘。\",\"chapter\":\"死屋手记(1)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_531_3993-4071\",\"quote\":\"往往有人能忍耐几年，很温顺，忍受着极其残酷的刑罚，可是为了一点儿小事，稍不顺心，几乎不为什么就突然爆发。在某些人看来，简直可以说他是个疯子；可情况就是这样。\",\"chapter\":\"死屋手记(2)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_532_391-449\",\"quote\":\"这种制度吸干了人的生命汁液、使他的心灵枯竭、软弱、惊恐不安，然后却把精神枯萎的木乃伊、一个半疯子奉为改造和悔罪的典型\",\"chapter\":\"死屋手记(3)\",\"date\":\"2020-06-17\"},{\"id\":\"934366:mark:934366_532_453-546\",\"quote\":\"一个反社会的罪犯是敌视社会的，几乎总是认为自己无罪而归罪于社会。何况他已经受到社会的惩罚了，几乎认为自己经过这样的赎罪，已经净化了。从这种观点出发可以断定，最后几乎势必会为罪行本身辩护。\",\"chapter\":\"死屋手记(3)\",\"date\":\"2020-06-17\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[]}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"陀思妥耶夫斯基文集（套装共9册） - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"陀斯妥耶夫斯基 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/934366\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://linguista.cn/alpacanotes\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:site_name\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:locale\",\"content\":\"zh_CN\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image\",\"content\":\"https://linguista.cn/alpacanotes/aztecaalpaca.jpg\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"12\",{\"property\":\"og:image:alt\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"13\",{\"property\":\"og:type\",\"content\":\"website\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:site\",\"content\":\"@linguista2025\"}],[\"$\",\"meta\",\"16\",{\"name\":\"twitter:creator\",\"content\":\"@linguista2025\"}],[\"$\",\"meta\",\"17\",{\"name\":\"twitter:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"18\",{\"name\":\"twitter:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"19\",{\"name\":\"twitter:image\",\"content\":\"https://linguista.cn/alpacanotes/aztecaalpaca.jpg\"}],[\"$\",\"link\",\"20\",{\"rel\":\"icon\",\"href\":\"/alpacanotes/favicon.svg\",\"type\":\"image/svg+xml\"}]]\n"])</script><script>self.__next_f.push([1,"11:null\n"])</script></body></html>
