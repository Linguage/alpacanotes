为可能</span><div><a href="#notes" aria-current="location">笔记<!-- --> <span>7</span></a></div></nav><section id="notes" class="book-section book-notes" aria-label="本书笔记" tabindex="-1"><div class="book-note-tools"><label><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input type="search" aria-label="搜索本书笔记" placeholder="搜索本书笔记" value=""/></label><select aria-label="筛选章节"><option value="" selected="">全部章节</option><option>序言</option><option>对确定性的迷恋</option><option>我们一直都是这样做的</option></select></div><div id="book-notes-list"><section class="book-chapter"><h3>序言</h3><article class="book-extract" tabindex="-1" id="entry-34222392:mark:34222392_2_1843-2000"><time dateTime="2024-10-23">2024-10-23</time><blockquote>火箭科学家们要想象那些无法想象的事情，解决那些无法解决的问题。他们将失败转化为胜利，把束缚转化为优势；他们认为小事故只是可以解决的难题，而非不可逾越的障碍；他们前进的动力不是盲目的信念，而是自我怀疑；他们的目标不是短期结果，而是长期突破；他们知道规则不是一成不变的，已设定的东西可以更改，他们能开辟出一条新的路径。</blockquote></article></section></div><button class="book-text-action" type="button" aria-expanded="false" aria-controls="book-notes-list">查看全部 7 条笔记</button></section></div></article></div></div></div></div><script src="/alpacanotes/_next/static/chunks/webpack-ab42cc0efda2aa4b.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"7:\"$Sreact.fragment\"\n8:I[19,[\"4839\",\"static/chunks/4839-9ee37c2c1d934023.js\",\"8374\",\"static/chunks/8374-170063ce1527d25b.js\",\"5687\",\"static/chunks/5687-f12d7992e045b837.js\",\"7177\",\"static/chunks/app/layout-f0e95c5ccf81053a.js\"],\"default\"]\n9:I[8312,[\"4839\",\"static/chunks/4839-9ee37c2c1d934023.js\",\"8374\",\"static/chunks/8374-170063ce1527d25b.js\",\"5687\",\"static/chunks/5687-f12d7992e045b837.js\",\"7177\",\"static/chunks/app/layout-f0e95c5ccf81053a. 动物的伤害。但在信息时代，它们就变成了缺点。\",\"chapter\":\"序言\",\"date\":\"2024-10-23\"},{\"id\":\"34222392:mark:34222392_2_724-771\",\"quote\":\"用NASA一名官员的话来说，我们甚至不知道“如何计算地球轨道，更别提登月火箭的发射轨道了”​。\",\"chapter\":\"序言\",\"date\":\"2024-10-23\"},{\"id\":\"34222392:mark:34222392_5_1807-1980\",\"quote\":\"在现代世界，我们在不确定性中寻找确定性，在混乱中搜索秩序，在歧义中寻找正确回答，在错综复杂中寻找坚定。“我们花了更多的时间和精力尝试控制这个世界，而不是尝试着去理解它。”尤瓦尔·诺亚·赫拉利（Yuval Noah Harari）写道。我们寻找的是循规蹈矩的公式、捷径和投机取巧——那袋花生就是明证。随着时间的推移，我们丧失了与未知事物共处的能力。\",\"chapter\":\"对确定性的迷恋\",\"date\":\"2024-10-23\"},{\"id\":\"34222392:mark:34222392_5_2033-2091\",\"quote\":\"一名醉汉在夜晚的路灯下找他的钥匙。他知道自己把钥匙丢在了街上某个黑暗的地方，可他却在路灯下苦苦寻找，因为那里有灯光。\",\"chapter\":\"对确定性的迷恋\",\"date\":\"2024-10-23\"},{\"id\":\"34222392:mark:34222392_5_2367-2476\",\"quote\":\"但是，只有当我们敢于牺牲确定性答案，敢于冒险，敢于远离路灯的时候，才能真正实现突破。如果你固步自封，就不会有出人意料的发现。唯有那些领先时代之人，才敢于与伟大的未知事物共舞，并在现状中发现潜伏的危机，而不是满足于现状。\",\"chapter\":\"对确定性的迷恋\",\"date\":\"2024-10-23\"},{\"id\":\"34222392:mark:34222392_16_3351-3509\",\"quote\":\"“我们经常听到初级领导者为不好的结果找理由。”杰夫·贝佐斯（Jeff Bezos）说，“比如他们会说：‘呃，我们是按流程办事的。’如果你不小心提防的话，流程就会变成大麻烦。”不过，你无须把标准操作流程扔进碎纸机，使公司变得混乱不堪。相反，你需要养成一个习惯，像贝佐斯那样问自己：“是我们主导流程，还是流程主导我们？”\",\"chapter\":\"我们一直都是这样做的\",\"date\":\"2024-09-16\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[]}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"像火箭科学家一样思考：将不可能变为可能 - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"奥赞·瓦罗尔 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/34222392\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:description\",\"content\":\"PageStudio 卡片、阅读与专题。\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:url\",\"content\":\"https://ling
