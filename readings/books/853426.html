缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_13566-13720\",\"quote\":\"难以坚持按计划行事，无法抗拒新皮衣的诱惑，无法拒绝新项目的吸引，忘性大（忘记验车、打电话、还账单），脑子不好使（错误地估计了银行账户中的余额，发错了邀请函），这些都是因为带宽变窄才发生的。在稀缺所引发的后果中，有一项尤为重要——稀缺会进一步延续并加剧稀缺。\",\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_13785-13836\",\"quote\":\"贫穷之人会一直穷困潦倒，忙碌之人会永远日理万机，孤独之人会终日形单影只，而节食之人也总是会以失败而告终\",\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_14455-14551\",\"quote\":\"稀缺会俘获我们的注意力，并带来一点点好处：我们能够在应对迫切需求时，做得更好。但从长远的角度来看，我们的损失更大：我们会忽视其他需要关注的事项，在生活的其他方面变得不那么有成效。\",\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_6082-6211\",\"quote\":\"当然，如果你也整天忍饥挨饿的话，那么找食物必然会是第一要务。但这些人关注的方面却远远超越了自身的实际利益——开餐厅、对比食物的价格、研究菜谱，这些想法都不能缓解饥饿。而所有这些关于食物的执着，只能进一步加剧饥饿带来的痛苦。他们对此毫无招架之力，但又别无选择。\",\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_6720-6819\",\"quote\":\"稀缺俘获大脑（scarcity captures the mind） 稀缺造成的后果不仅仅是因为我们会因拥有的太少而感到不悦，而是因为它会改变我们的思维方式，会强行侵入我们的思想之中。\",\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"},{\"id\":\"853426:mark:853426_5_9518-9593\",\"quote\":\"当我们将稀缺心态考虑在内时，就能理解这一现象了：因为孤独者会去关注自身的稀缺状况，关注为数不多的亲人朋友；他们会对他人表情中所流露出来的情绪非常敏感。\",\"chapter\":\"引言 资源稀缺不可怕，就怕有稀缺心态\",\"date\":\"2020-05-02\"}],\"reviews\":[],\"years\":[],\"references\":[],\"essays\":[]}}]]\n"])</script><script>self.__next_f.push([1,"15:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"稀缺：我们是如何陷入贫穷与忙碌的 - AlpacaNotes\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"塞德希尔·穆来纳森 · 阅读记录、划线与书评\"}],[\"$\",\"link\",\"3\",{\"rel\":\"canonical\",\"href\":\"https://linguista.cn/alpacanotes/readings/books/853426\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:title\",\"content\":\"AlpacaNotes\"}],[\"$\",\"meta\",\
